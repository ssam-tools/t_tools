# 매뉴얼·PPT용 화면 찍기 (지어낸 견본 자료로) — 필요할 때 Actions에서 직접 실행
name: 매뉴얼 화면 찍기
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pillow
      - run: python .github/scripts/manual_shots.py
      - uses: actions/upload-artifact@v4
        with:
          name: manual-shots
          path: manual_shots/
          retention-days: 14
      - name: 히스토리 그림 고침 올리기
        run: |
          git config user.name "ssam-history-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/shots/v2_40_0.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "제작 히스토리 자동 기록"
          git pull --rebase origin main
          git push
