# 매뉴얼·PPT용 화면 찍기 (지어낸 견본 자료로) — 필요할 때 Actions에서 직접 실행
name: 매뉴얼 화면 찍기
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pillow
      - run: python .github/scripts/manual_shots.py
      - name: 화면을 manual-shots 가지에 올리기 (사이트에는 안 올라감)
        run: |
          mkdir -p /tmp/ms && cp manual_shots/*.jpg /tmp/ms/
          cd /tmp/ms && git init -q -b manual-shots && git add -A
          git -c user.name="ssam-history-bot" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "매뉴얼 화면 (견본 자료)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" manual-shots
      - name: 히스토리 그림 고침 올리기
        run: |
          git config user.name "ssam-history-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/shots/v2_40_0.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "제작 히스토리 자동 기록"
          git pull --rebase origin main
          git push
