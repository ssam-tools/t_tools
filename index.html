<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 도구 모음</title>
<style>
  :root{
    --bg:#f3f6f9; --card:#ffffff; --ink:#1d2733; --sub:#5b6773; --line:#dde3ea;
    --accent:#2f6fb5; --accent-soft:#e6f0fa; --ok:#2e7d4f; --ok-soft:#e3f3ea; --wait:#7a6a3a; --wait-soft:#f6efd9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    padding:clamp(10px,2vh,22px) clamp(12px,3vw,32px);
    gap:clamp(8px,1.6vh,16px);
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(20px,3.4vh,28px);font-weight:800;letter-spacing:-.02em}
  .lead{font-size:clamp(12px,1.9vh,14px);color:var(--sub);margin-top:2px}
  .home{display:inline-block;font-weight:700;font-size:12.5px;padding:2px 10px;border-radius:999px;margin-left:6px;background:#fff6d6;color:#7a5a00}
  .home.none{background:#eceff3;color:#4a5560}
  .seg{display:inline-flex;background:#e4eaf0;border-radius:12px;padding:3px}
  .seg button{
    border:0;background:transparent;font:inherit;font-size:clamp(13px,2vh,15px);font-weight:700;
    color:var(--sub);padding:8px 16px;border-radius:9px;cursor:pointer
  }
  .seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg button:focus-visible,.card:focus-visible{outline:3px solid #7fb0e6;outline-offset:2px}

  main{
    flex:1; min-height:0; display:grid; gap:clamp(8px,1.6vh,14px);
    grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-rows:minmax(0,230px); align-content:center;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:clamp(10px,2vh,18px); display:flex; flex-direction:column; gap:6px;
    text-decoration:none; color:inherit; min-height:0; overflow:hidden;
  }
  a.card{cursor:pointer;transition:transform .12s,box-shadow .12s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,60,100,.12)}
  .card.wait{background:#fafbfc}
  .ico{font-size:clamp(24px,4.4vh,34px);line-height:1}
  .name{font-size:clamp(15px,2.4vh,18px);font-weight:800;letter-spacing:-.01em}
  .desc{font-size:clamp(12px,1.8vh,13.5px);color:var(--sub);line-height:1.45;flex:1;min-height:0;overflow:hidden}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .t-home{background:var(--accent-soft);color:var(--accent)}
  .t-all{background:#eceff3;color:#4a5560}
  .s-ready{background:var(--ok-soft);color:var(--ok)}
  .s-wait{background:var(--wait-soft);color:var(--wait)}

  footer{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    font-size:clamp(11.5px,1.8vh,13px);color:var(--sub)
  }
  .priv{background:var(--ok-soft);color:var(--ok);font-weight:700;padding:7px 12px;border-radius:10px}

  body[data-mode="subject"] .card[data-for="home"]{display:none}

  @media (max-width:760px){
    header{flex-direction:column;align-items:flex-start;gap:8px}
    .seg{width:100%}.seg button{flex:1;padding:7px 8px}
    main{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,118px)}
    .desc{display:none}
    .card{padding:12px;gap:6px;justify-content:space-between}
    .chip{font-size:10.5px;padding:2px 7px}
  }
</style>
</head>
<body data-mode="home">
<header>
  <div>
    <h1>🧰 선생님 도구 모음</h1>
    <p class="lead">학급 운영과 수업에 쓰는 도구를 한곳에 모았습니다. <span class="home" id="homeChip"></span></p>
  </div>
  <div class="seg" role="group" aria-label="교사 유형">
    <button type="button" id="b-home" aria-pressed="true">담임 + 교과</button>
    <button type="button" id="b-subject" aria-pressed="false">교과만</button>
  </div>
</header>

<main id="grid"></main>

<footer>
  <span class="priv">🔒 입력한 자료는 이 기기의 브라우저에만 저장되며, 밖으로 전송되지 않습니다.</span>
  <span id="count"></span>
</footer>

<script>
  // 도구 목록. 도구가 완성되면 href에 폴더 주소를 적고 ready를 true로 바꾸세요.
  var TOOLS = [
    {icon:"👥", name:"학급 명렬표",     desc:"한 번 입력해 두면 다른 도구에서 함께 불러 씁니다.", scope:"all",  href:"roster.html", ready:true},
    {icon:"⏰", name:"지각 관리 노트",   desc:"출결을 입력하고 연속·주간 지각 학생에게 상담일지를 남깁니다.", scope:"home", href:"tardy.html", ready:true},
    {icon:"🏅", name:"가산점 자동 입력", desc:"수상경력·창체 파일을 올리면 가산점 양식을 자동으로 채웁니다.", scope:"home", href:"bonus.html", ready:true},
    {icon:"🎓", name:"고교 진학 추천",   desc:"성적을 분석해 지원 가능한 고등학교를 살펴봅니다.", scope:"home", href:"", ready:false},
    {icon:"🧩", name:"조 편성",         desc:"조건에 맞게 모둠과 자리를 편성합니다.",           scope:"all",  href:"", ready:false},
    {icon:"📷", name:"나이스 사진 이름", desc:"반별 사진 파일명을 한꺼번에 바꿉니다.",           scope:"home", href:"", ready:false},
    {icon:"📎", name:"파일 합치기",     desc:"여러 파일을 하나로 합칩니다.",                   scope:"all",  href:"", ready:false},
    {icon:"📒", name:"수업 기록장",     desc:"수업 진도와 학생 활동을 반별로 기록합니다.",      scope:"all",  href:"", ready:false}
  ];

  var grid = document.getElementById("grid");
  TOOLS.forEach(function(t){
    var el = document.createElement(t.ready && t.href ? "a" : "div");
    el.className = "card" + (t.ready ? "" : " wait");
    el.setAttribute("data-for", t.scope);
    if(t.ready && t.href){ el.href = t.href; }
    el.innerHTML =
      '<div class="ico">'+t.icon+'</div>'+
      '<div class="name">'+t.name+'</div>'+
      '<div class="desc">'+t.desc+'</div>'+
      '<div class="chips">'+
        '<span class="chip '+(t.scope==="home"?"t-home":"t-all")+'">'+(t.scope==="home"?"담임":"공통")+'</span>'+
        '<span class="chip '+(t.ready?"s-ready":"s-wait")+'">'+(t.ready?"사용 가능":"준비 중")+'</span>'+
      '</div>';
    grid.appendChild(el);
  });

  function setMode(m){
    document.body.setAttribute("data-mode", m);
    document.getElementById("b-home").setAttribute("aria-pressed", m==="home");
    document.getElementById("b-subject").setAttribute("aria-pressed", m==="subject");
    var n = TOOLS.filter(function(t){ return m==="home" || t.scope==="all"; }).length;
    document.getElementById("count").textContent = "도구 " + n + "개";
    try{ localStorage.setItem("tt_mode", m); }catch(e){}
  }
  document.getElementById("b-home").onclick = function(){ setMode("home"); };
  document.getElementById("b-subject").onclick = function(){ setMode("subject"); };

  // 명렬표에서 지정한 우리 반(담임)을 보여 줍니다.
  (function(){
    var chip = document.getElementById("homeChip"), name = "";
    try{
      var d = JSON.parse(localStorage.getItem("tt_roster_v1") || "null");
      if(d && d.home && Array.isArray(d.classes)){
        d.classes.forEach(function(c){ if(c && c.id === d.home) name = String(c.name); });
      }
    }catch(e){}
    if(name){ chip.textContent = "★ 우리 반: " + name; }
    else{ chip.textContent = "우리 반 미지정 · 명렬표에서 나이스 파일을 올려 주세요"; chip.className = "home none"; }
  })();

  var saved = "home";
  try{ saved = localStorage.getItem("tt_mode") || "home"; }catch(e){}
  setMode(saved==="subject" ? "subject" : "home");
</script>
</body>
</html>
