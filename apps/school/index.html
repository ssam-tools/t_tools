<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style id="ttKeepAll">html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}</style>
<!-- 외부로 자료를 보내는 통로를 막습니다. 예외: 학교 업무판(구글 앱스 스크립트) — 업무판 화면을 이 안에 띄우고, 내선번호를 읽어 옵니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://open.neis.go.kr https://api.open-meteo.com https://air-quality-api.open-meteo.com https://script.google.com https://script.googleusercontent.com; frame-src 'self' https://script.google.com https://*.googleusercontent.com; form-action 'none'; base-uri 'none'">
<!-- v2.38.1 빠르게 열기: 화면 파일을 처음부터 한꺼번에 받아 둠 (아래 <script src>를 바꾸면 여기도 같이) -->
<link rel="preload" as="script" href="../../shared/early.js">
<link rel="preload" as="script" href="../../shared/tt.js">
<link rel="preload" as="script" href="../../shared/libd.js">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<title>학교 업무판 · 쌤 노트</title>
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/look.css">
<link rel="stylesheet" href="../../shared/tt.css">
<style>
  /* 학교 업무판 (v2.3) — 학교 메뉴의 대표 화면: 주간·월간 업무판 · 내선번호 · 자주 보는 문서(자료실에서 ★)를 한 화면에서 */
  .tabs2{display:flex;gap:6px;flex-wrap:wrap;flex:none}
  .tabs2 button,.tabs2 a{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;min-height:38px;display:inline-flex;align-items:center;gap:4px}
  .tabs2 button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tabs2 .add{border-style:dashed}
  main.pane{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px}
  .frame{flex:1 1 0;min-height:0;width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  .note{font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .note a,.note button{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
  .msg{margin:auto;text-align:center;color:var(--sub);line-height:1.7;max-width:460px}
  .msg b{color:var(--ink)}
  .msg.mob{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px}
  .msg.mob .bi{font-size:44px;line-height:1}
  .msg.mob span{font-size:13px}
  .msg.mob .big{margin-top:10px;font-size:18px;font-weight:800;padding:14px 28px;border-radius:14px;text-decoration:none}
  .msg.mob .lnk{margin-top:6px;font:inherit;font-size:13px;color:var(--sub);background:none;border:0;text-decoration:underline;cursor:pointer}
  .lock{margin:auto;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:320px;width:100%}
  .lock input{font:inherit;font-size:16px;width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--ink)}
  .lock .er{color:var(--danger);font-size:13px;min-height:18px}
  .ext{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1 1 0}
  .ext input{font:inherit;font-size:15px;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--card);color:var(--ink);max-width:420px}
  .exl{flex:1 1 0;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;align-content:start}
  .exl div{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
  .exl b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent);min-width:44px}
  .exl span{display:flex;flex-direction:column;min-width:0}
  html[data-ui="ssambi"] .ext #exq{display:none}   /* v2.7: 쌤비 홈 디자인에서는 왼쪽 검색창 하나로 찾음 */
  .exl div.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft,rgba(0,0,0,.06))}.exl small{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* v2.52 🔐 금고 (선생님 보기) — 인쇄하면 내용이 빈칸 */
  .sf{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1 1 0}
  .sfh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:none}
  .sfh .sp{flex:1}
  .sfh button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--sub)}
  .sfh button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .sfl{flex:1 1 0;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;align-content:start}
  .sfc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
  .sfc.hit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft,rgba(0,0,0,.06))}
  .sfc .t{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
  .sfc .t span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sfc .t a{font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
  .sfc .r{display:flex;align-items:center;gap:6px}
  .sfc .r > i{font-style:normal;color:var(--sub);font-size:12px;min-width:44px}
  .sfc .r code{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none}
  .sfc .r button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 8px;cursor:pointer;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
  .sfc .r button:active,.sfc .r button.held{background:var(--accent-soft,#e6f0fa)}
  .sfc .m{color:var(--sub);font-size:12.5px}
  .sfn{font-size:12.5px;color:var(--sub);flex:none}
  @media print{.sf .sfl,.sf code{visibility:hidden!important}}
</style>
</head>
<body>
<header>
  <div class="hl"><a class="back" href="../../">← 쌤 노트</a><h1>🏫 학교 업무판</h1></div>
  <nav class="tabs2" id="tabs" aria-label="학교 업무판 칸"></nav>
</header>
<main class="pane" id="pane" aria-live="polite"></main>

<script src="../../shared/tt.js"></script>
<script src="../../shared/libd.js"></script>
<script src="../../shared/admin.js"></script>
<script src="../../shared/safe.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var TK = "sbSchoolTab", OK = "sbExtOk";
  var SUG = [["학교 배치도", "배치도"], ["교육계획서", "교육계획"], ["규정집", "규정"]];   // ★가 없을 때 보여 줄 자주 보는 문서(자료실에서 이름으로 찾음)
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function B(){ return TT.store.get("tt_board_v1", null) || {}; }
  function boardOk(){ var b = B(); return !!(b.url && /^https:\/\/script\.google\.com\//.test(b.url) && !b.hidden); }
  function stars(){ var o = (TT.store.get("tt_lib_star_v1", null) || {}).ids || {}; return Object.keys(o).map(function(id){ return {id: id, t: o[id].t, at: o[id].at || 0}; }).sort(function(a, b){ return a.at - b.at; }); }
  function tabs(){
    var L = [{k: "board", t: "📅 업무판"}, {k: "ext", t: "📞 내선번호"}], S = stars();
    if(window.TT_SAFE && !TT_SAFE.room()) L.push({k: "safe", t: "🔐 금고"});   // v2.52 교실 기기에서는 금고 칸이 없음
    if(S.length) S.forEach(function(x){ L.push({k: "doc:" + x.id, t: "★ " + x.t}); });
    else SUG.forEach(function(x){ L.push({k: "find:" + x[1], t: x[0]}); });
    return L;
  }
  var U0 = new URLSearchParams(location.search), Q0 = U0.get("q") || "";
  var cur = /^(board|ext|safe)$/.test(U0.get("tab") || "") ? U0.get("tab") : sessionStorage.getItem(TK) || "board";
  if(U0.get("tab") || Q0) try{ history.replaceState(null, "", location.pathname); }catch(e){}

  /* ── v2.7 왼쪽 쌤비 아래 검색창(shared/sbbar.js)과 연결: 보고 있는 칸에 따라 찾는 곳이 바뀜 ──
     업무판 = 업무판 안의 글자(업무판 쪽 Index.html이 칠해 줌, 메시지로 주고받음) · 내선번호 = 이름·부서·번호 · 문서 = 그 PDF 안 (apps/lib 의 TT_DOCFIND) */
  function SB(){ return window.TT_SBAR || null; }
  function sq(){ return SB() ? TT_SBAR.query() : ""; }
  function show(r){ if(SB()) TT_SBAR.show(r); }
  var BW = null;                                                        // 업무판 화면(구글 쪽 안쪽 창)
  function bsend(o){ if(BW) try{ BW.postMessage(o, "*"); }catch(e){} }
  window.addEventListener("message", function(e){
    if(!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
    var d = e.data; if(!d || typeof d !== "object") return;
    if(d.tt === "ttboard-ready"){ BW = e.source; bsend({tt: "tthello"}); if(cur === "board" && sq()) bsend({tt: "ttfind", q: sq()}); return; }
    if(e.source !== BW) return;
    if(d.tt === "ttctrlf"){ if(SB()) TT_SBAR.focusSearch(""); return; }
    if(d.tt === "ttfound" && cur === "board") show({n: +d.n || 0, i: +d.i || 0, rows: (d.rows || []).map(function(r, k){ return {ic: "📅", tx: esc(r.t), sub: esc(r.d || ""), go: function(){ bsend({tt: "ttgo", k: k}); }}; }),
      note: d.n ? "" : "지금 보는 주(달)에는 없어요 · 업무판의 ◀ ▶로 다른 주를 보면 거기서 찾아요"});
  });
  var PB = {key: "board", ph: "업무판에서 찾기",
    find: function(q){ if(!BW){ show({n: null, rows: [], note: "업무판에 들어간 뒤(비밀번호) 찾을 수 있어요"}); return; } bsend({tt: "ttfind", q: q}); },
    step: function(d){ bsend({tt: "ttstep", d: d}); }, clear: function(){ bsend({tt: "ttfind", q: ""}); }};
  var EXL = [];
  function extHits(q){ return EXL.filter(function(x){ return [x.t, x.n, x.d, x.m].join(" ").indexOf(q) >= 0; }); }
  var PE = {key: "ext", ph: "이름 · 부서 · 번호 찾기",
    find: function(q){
      var i = $("exq"); if(!i){ show({n: null, rows: [], note: "업무판 비밀번호를 넣으면 찾을 수 있어요"}); return; }
      i.value = q; i.oninput();
      var H = extHits(q);
      show({n: H.length, rows: H.slice(0, 8).map(function(x){ return {ic: "📞", tx: "<b>" + esc(x.t) + "</b> " + esc(x.n), sub: esc([x.d, x.m].filter(Boolean).join(" · ")) + " · 누르면 번호 복사", go: function(){ try{ navigator.clipboard.writeText(x.t); }catch(e){} TT.ui.toast("📞 " + x.n + " " + x.t + " — 번호를 복사했어요"); }}; }), note: H.length ? "Enter = 첫 번호 복사" : ""});
    },
    clear: function(){ var i = $("exq"); if(i){ i.value = ""; i.oninput(); } }};
  function DW(){ var f = document.querySelector("#pane iframe.frame"); try{ return f && f.contentWindow && f.contentWindow.TT_DOCFIND || null; }catch(e){ return null; } }
  var PD = {key: "doc", ph: "이 문서에서 찾기",
    find: function(q){ var d = DW(); if(d && d.open()) d.find(q); else show({n: null, busy: true, rows: [], note: "문서를 여는 중이에요. 열리면 바로 찾아요"}); },
    step: function(k){ var d = DW(); if(d) d.step(k); }, page: function(n){ var d = DW(); if(d) d.page(n); }, clear: function(){ var d = DW(); if(d) d.clear(); }};
  window.TT_DOCFIND_EMIT = function(r){ if(cur.indexOf("doc:") === 0 || cur.indexOf("find:") === 0) show(r); };
  window.TT_DOCFIND_READY = function(w){                                // 문서가 열렸을 때(w: 이어서 찾을 말) · 닫혔을 때(null)
    if(w === null){ if(sq()) show({n: null, rows: [], note: "문서가 닫혔어요"}); return; }
    if(w){ if(SB()) TT_SBAR.focusSearch(w); return; }
    var d = DW(), q = sq(); if(q && d && !/^\d{1,4}$/.test(q)) d.find(q);
  };
  function setProv(){
    window.TT_SBFIND_P = cur === "board" ? PB : cur === "ext" ? PE : cur === "safe" ? PS : PD;
    if(PD === window.TT_SBFIND_P){ PD.key = cur; var t = tabs().filter(function(x){ return x.k === cur; })[0]; PD.ph = "이 문서에서 찾기" + (t ? " · " + t.t.replace(/^★\s*/, "").slice(0, 10) : ""); }
    if(SB()) TT_SBAR.refresh();
  }
  if(Q0) (function wait(n){ if(SB() && document.getElementById("sbRq")){ setProv(); TT_SBAR.focusSearch(Q0); } else if(n < 60) setTimeout(function(){ wait(n + 1); }, 100); })(0);

  function draw(){
    var L = tabs(); if(!L.some(function(x){ return x.k === cur; })) cur = "board";
    BW = null; setProv();
    $("tabs").innerHTML = L.map(function(x){ return '<button type="button" data-k="' + esc(x.k) + '"' + (x.k === cur ? ' class="on" aria-pressed="true"' : "") + ">" + esc(x.t) + "</button>"; }).join("")
      + '<a class="add" href="../lib/" title="자료실에서 ☆를 누르면 여기에 자주 보는 문서로 나와요">☆ 문서 고르기</a>';
    var P = $("pane");
    if(cur === "board"){
      if(!boardOk()){ P.innerHTML = '<div class="msg"><b>학교 업무판이 아직 연결되지 않았어요.</b><br>설정 → 학교 업무판 연결에서 업무판 주소를 넣어 주세요.<br><br><a class="btn" href="../../#settings">설정 열기</a></div>'; return; }
      var u = B().url;
      /* v2.58.4 휴대폰: 휴대폰 크롬은 구글 계정이 여러 개 로그인되어 있는 경우가 많아, 업무판(구글 앱스 스크립트)이
         그 로그인 정보 때문에 "현재 파일을 열 수 없습니다"를 냅니다(새 창도 같음). 업무판은 '모든 사용자'용이라 로그인이 필요 없으므로
         화면 안 칸을 credentialless(로그인 정보 없이)로 엽니다 — 크롬·삼성 인터넷 110+ 지원, 지원하지 않는 브라우저는 그냥 예전처럼 열림 */
      var phone = window.matchMedia("(max-width:760px)").matches;
      P.innerHTML = '<iframe class="frame" src="' + esc(u) + '" title="학교 주간·월간 업무판" referrerpolicy="no-referrer"' + (phone ? " credentialless" : "") + '></iframe>'
        + '<div class="note">업무판이 비어 보이면 → <a href="' + esc(u) + '" target="_blank" rel="noopener">새 창으로 열기</a>'
        + (phone ? ' · 그래도 안 되면 크롬 <b>시크릿 탭</b>에 이 주소를 붙여 넣어 열어 주세요 <button type="button" id="cpU">주소 복사</button>' : "") + '</div>';
      if(phone) $("cpU").onclick = function(){ try{ navigator.clipboard.writeText(u); TT.ui.toast("📋 업무판 주소를 복사했어요"); }catch(e){} };
      return;
    }
    if(cur === "ext"){ drawExt(P); return; }
    if(cur === "safe"){ drawSafe(P); return; }
    var src = cur.indexOf("doc:") === 0 ? "../lib/?id=" + encodeURIComponent(cur.slice(4)) : "../lib/?find=" + encodeURIComponent(cur.slice(5));
    P.innerHTML = '<iframe class="frame" src="' + esc(src) + '" title="자주 보는 문서"></iframe>'
      + (stars().length ? "" : '<div class="note">자료실에서 문서의 ☆를 누르면 이 자리에 그 문서가 나와요 · <a href="../lib/">자료실 열기</a></div>');
  }
  /* ── v2.52 🔐 학교 금고 (선생님 보기) — shared/safe.js · 금고 문구로 이 기기에서 풀어 보기만 ──
     비밀번호는 ●●●●로 가리고, 누르고 있는 동안만 보임 · 복사는 30초 뒤 지움 · 10분 쓰지 않으면 잠김 · 인쇄하면 빈칸 */
  var SFsub = "acc", SFq = "";
  var SFK = [["acc", "공용 계정"], ["ppl", "연락처"], ["info", "보안 안내"]];
  var PS = {key: "safe", ph: "금고에서 찾기 (사이트·이름·항목)",
    find: function(q){ SFq = q; var d = TT_SAFE.data(); if(!d){ show({n: null, rows: [], note: "금고를 연 뒤 찾을 수 있어요"}); return; } paintSafe(); },
    clear: function(){ SFq = ""; if(TT_SAFE.data()) paintSafe(); }};
  function drawSafe(P){
    var SF = window.TT_SAFE; if(!SF){ P.innerHTML = '<div class="msg">금고를 불러오지 못했어요.</div>'; return; }
    if(SF.room()){ P.innerHTML = '<div class="msg"><b>교실 기기(공용)에서는 금고를 열 수 없어요.</b></div>'; return; }
    if(SF.data()){ P.innerHTML = '<div class="sf"><div class="sfh" id="sfh"></div><div class="sfl" id="sfl"></div><div class="sfn" id="sfn"></div></div>'; paintSafe(); return; }
    var st = SF.status();
    P.innerHTML = '<form class="lock" id="sfk" autocomplete="off"><b>🔐 학교 금고</b>'
      + (st.remembered ? '<span class="note">' + (st.wa ? "지문·기기 잠금으로 확인한 뒤 열려요." : "이 기기에 금고 문구가 기억되어 있어요.") + "</span>"
        : '<input type="password" id="sfp" placeholder="금고 문구 (담당자가 따로 알려 준 문구)" aria-label="금고 문구"><label class="note"><input type="checkbox" id="sfr" checked> 이 기기에 기억 (내 기기만)</label>')
      + '<span class="er" id="sfe"></span><button type="submit" class="btn primary">열기</button><span class="note">공용 계정 · 교직원 연락처 · 보안 안내 · 10분 쓰지 않으면 다시 잠겨요</span></form>';
    var i = $("sfp"); if(i) i.focus();
    $("sfk").onsubmit = function(e){
      e.preventDefault(); $("sfe").textContent = "여는 중…";
      (i ? SF.open(i.value, $("sfr").checked) : SF.open()).then(function(){ drawSafe(P); if(sq()) PS.find(sq()); else if(Q0 && cur === "safe" && SB()) TT_SBAR.focusSearch(Q0); }, function(x){ $("sfe").textContent = SF.errText(x); if(!i && !SF.status().remembered) drawSafe(P); });
    };
  }
  function mask(v){ return v ? "●●●●●●●●" : "—"; }
  function paintSafe(){
    var SF = window.TT_SAFE, d = SF.data(); if(!d || !$("sfl")) return;
    var q = (SFq || "").trim().toLowerCase();
    function hit(x, keys){ return q && keys.some(function(k){ return String(x[k] || "").toLowerCase().indexOf(q) >= 0; }); }
    var KEYS = {acc: ["site", "user", "owner", "memo"], ppl: ["name", "dept"], info: ["t", "memo"]};
    if(q){ var best = SFK.map(function(s){ return [s[0], d[s[0]].filter(function(x){ return hit(x, KEYS[s[0]]); }).length]; }).sort(function(a, b){ return b[1] - a[1]; })[0]; if(best[1] && !d[SFsub].some(function(x){ return hit(x, KEYS[SFsub]); })) SFsub = best[0]; }
    $("sfh").innerHTML = SFK.map(function(s){ return '<button type="button" data-sfs="' + s[0] + '"' + (s[0] === SFsub ? ' class="on"' : "") + ">" + s[1] + " " + d[s[0]].length + "</button>"; }).join("")
      + '<span class="sp"></span>' + (window.TT_ADMIN && TT_ADMIN.state() ? '<a class="btn btn-sm" href="../admin/#safe">✏️ 고치기</a>' : "")
      + '<button type="button" data-sfa="set" title="이 기기 설정">⚙</button><button type="button" data-sfa="lock">🔒 잠그기</button>';
    var L = d[SFsub].slice().sort(function(a, b){ return (hit(b, KEYS[SFsub]) ? 1 : 0) - (hit(a, KEYS[SFsub]) ? 1 : 0); });
    var row = function(lbl, v, k, secret){ return '<div class="r"><i>' + lbl + "</i><code" + (secret ? ' data-sec="' + k + '"' : "") + ">" + esc(secret ? mask(v) : v || "—") + "</code>" + (v && secret ? '<button type="button" data-hold="' + k + '" title="누르고 있는 동안 보기">👁</button>' : "") + (v ? '<button type="button" data-cp="' + k + '">복사</button>' : "") + "</div>"; };
    $("sfl").innerHTML = L.map(function(x){
      var id = esc(x.id), cls = "sfc" + (hit(x, KEYS[SFsub]) ? " hit" : "");
      if(SFsub === "acc") return '<div class="' + cls + '" data-id="' + id + '"><div class="t"><span>' + esc(x.site || "이름 없음") + "</span>" + (/^https?:\/\//.test(x.url || "") ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer">열기 ↗</a>' : "") + "</div>"
        + row("아이디", x.user, "user") + row("비밀번호", x.pw, "pw", true) + (x.memo || x.owner ? '<div class="m">' + esc([x.memo, x.owner ? "담당 " + x.owner : ""].filter(Boolean).join(" · ")) + "</div>" : "") + "</div>";
      if(SFsub === "ppl") return '<div class="' + cls + '" data-id="' + id + '"><div class="t"><span>' + esc(x.name || "") + '</span><a style="color:var(--sub)">' + esc(x.dept || "") + "</a></div>"
        + (x.ok && x.phone ? row("휴대폰", x.phone, "phone", true) : '<div class="m">📨 쿨메신저로 연락해 주세요</div>') + (x.memo ? '<div class="m">' + esc(x.memo) + "</div>" : "") + "</div>";
      return '<div class="' + cls + '" data-id="' + id + '"><div class="t"><span>' + esc(x.t || "") + "</span></div>" + row("값", x.v, "v", true) + (x.memo ? '<div class="m">' + esc(x.memo) + "</div>" : "") + "</div>";
    }).join("") || '<div class="msg">아직 없어요. 관리자가 🛡️ 관리 → 🔐 금고에서 넣어요.</div>';
    $("sfn").textContent = "🔒 누르고 있는 동안만 보여요 · 복사한 값은 30초 뒤 클립보드에서 지워져요 · 10분 쓰지 않으면 잠겨요 · 화면을 찍거나 다른 사람에게 보여 주지 마세요";
    if(q){ var n = $("sfl").querySelectorAll(".hit").length; show({n: n, rows: [], note: n ? "" : "금고에 '" + esc(SFq) + "'이(가) 없어요"}); }
  }
  function sfItem(el){ var c = el.closest("[data-id]"), d = TT_SAFE.data(); if(!c || !d) return null; return d[SFsub].filter(function(x){ return String(x.id) === c.dataset.id; })[0]; }
  function reveal(btn, on){
    var x = sfItem(btn); if(!x) return; var code = btn.parentNode.querySelector("code"), k = btn.dataset.hold;
    code.textContent = on ? (x[k] || "") : mask(x[k]); btn.classList.toggle("held", on); TT_SAFE.touch();
  }
  $("pane").addEventListener("pointerdown", function(e){ var b = e.target.closest("[data-hold]"); if(!b) return; e.preventDefault(); reveal(b, true); var up = function(){ reveal(b, false); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); }; window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up); });
  $("pane").addEventListener("keydown", function(e){ var b = e.target.closest && e.target.closest("[data-hold]"); if(b && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); reveal(b, true); setTimeout(function(){ reveal(b, false); }, 5000); } });
  $("pane").addEventListener("click", function(e){
    var SF = window.TT_SAFE; if(cur !== "safe" || !SF) return;
    var s = e.target.closest("[data-sfs]"); if(s){ SFsub = s.dataset.sfs; SF.touch(); paintSafe(); return; }
    var cp = e.target.closest("[data-cp]"); if(cp){ var x = sfItem(cp); if(x) SF.copy(x[cp.dataset.cp]).then(function(){ TT.ui.toast("📋 복사했어요 · 30초 뒤 지워져요"); }, function(){ TT.ui.toast("복사하지 못했어요"); }); return; }
    var a = e.target.closest("[data-sfa]"); if(!a) return;
    if(a.dataset.sfa === "lock"){ SF.close(); return; }
    if(a.dataset.sfa === "set") sfSettings();
  });
  function sfSettings(){
    var SF = window.TT_SAFE, st = SF.status();
    SF.waAvail().then(function(av){
      var d = document.createElement("dialog"); d.className = "tt-dlg"; d.style.cssText = "border:0;border-radius:16px;padding:18px;max-width:380px";
      d.innerHTML = '<h3 style="margin:0 0 8px">🔐 이 기기의 금고</h3>'
        + '<p style="font-size:13.5px;color:var(--sub);line-height:1.6">금고 문구: ' + (st.remembered ? "이 기기에 기억 중" : "기억하지 않음") + "</p>"
        + (av ? '<p><button type="button" class="btn" data-w="' + (st.wa ? "off" : "on") + '">' + (st.wa ? "지문·기기 잠금 확인 끄기" : "👆 지문·Windows Hello로 열기 켜기") + '</button></p><p style="font-size:12.5px;color:var(--sub)">켜면 금고를 열 때마다 이 기기의 지문·PIN으로 한 번 더 확인해요.</p>' : '<p style="font-size:12.5px;color:var(--sub)">이 기기는 지문·Windows Hello 확인을 지원하지 않아요.</p>')
        + '<p><button type="button" class="btn" data-w="forget">이 기기에서 금고 잊기</button></p><p style="text-align:right"><button type="button" class="btn primary" data-w="x">닫기</button></p>';
      document.body.appendChild(d); d.showModal();
      d.addEventListener("close", function(){ d.remove(); });
      d.onclick = function(e){
        var w = e.target.closest("[data-w]"); if(!w) return; var k = w.dataset.w;
        if(k === "x"){ d.close(); return; }
        if(k === "on") SF.waEnable().then(function(){ TT.ui.toast("👆 다음부터 금고를 열 때 기기 잠금으로 확인해요"); d.close(); }, function(){ TT.ui.toast("켜지 못했어요"); });
        if(k === "off"){ SF.waOff(); d.close(); }
        if(k === "forget"){ SF.forget(); TT.ui.toast("이 기기에서 금고 문구와 금고를 지웠어요"); d.close(); }
      };
    });
  }
  if(window.TT_SAFE) TT_SAFE.on(function(s){ if(cur === "safe" && !s.open) draw(); });

  /* 내선번호: 선생님 이름이 들어 있어, 업무판 공용 비밀번호를 넣어야 보임(이 창을 닫을 때까지) */
  function drawExt(P){
    var pw = B().pw || "";
    if(pw && sessionStorage.getItem(OK) !== "1"){
      P.innerHTML = '<form class="lock" id="lk" autocomplete="off"><b>📞 내선번호</b><input type="password" id="lkp" placeholder="업무판 비밀번호" aria-label="업무판 비밀번호"><span class="er" id="lke"></span><button type="submit" class="btn primary">보기</button></form>';
      $("lkp").focus();
      $("lk").onsubmit = function(e){ e.preventDefault(); if($("lkp").value === pw){ sessionStorage.setItem(OK, "1"); drawExt(P); if(sq()) PE.find(sq()); } else $("lke").textContent = "비밀번호가 맞지 않아요."; };
      return;
    }
    P.innerHTML = '<div class="ext"><input type="search" id="exq" placeholder="이름 · 부서 · 번호 찾기" aria-label="내선번호 찾기"><div class="exl" id="exl"></div><div class="note" id="exn"></div></div>';
    var L = window.TT_LIBD ? TT_LIBD.extCached() : []; EXL = L;
    function paint(){
      var q = ($("exq").value || "").trim(), R = L.filter(function(x){ return !q || [x.t, x.n, x.d, x.m].join(" ").indexOf(q) >= 0; });
      $("exl").innerHTML = R.length ? R.map(function(x){ return "<div><b>" + esc(x.t) + "</b><span>" + esc(x.n) + "<small>" + esc([x.d, x.m].filter(Boolean).join(" · ")) + "</small></span></div>"; }).join("") : '<div class="msg" style="grid-column:1/-1">' + (L.length ? "맞는 번호가 없어요." : "내선번호가 아직 없어요. 학기초 세팅 파일이나 업무판 '내선번호' 시트를 넣어 주세요.") + "</div>";
    }
    $("exq").oninput = paint; paint();
    if(window.TT_LIBD && TT_LIBD.connected()){
      $("exn").textContent = "업무판에서 새로 받는 중…";
      TT_LIBD.ext(true).then(function(){ L = TT_LIBD.extCached(); EXL = L; paint(); if(cur === "ext" && sq()) PE.find(sq()); $("exn").textContent = "🔒 이 창을 닫으면 다시 비밀번호를 물어요."; }, function(){ $("exn").textContent = "🔒 이 기기에 있는 번호를 보여 줍니다."; });
    }else $("exn").textContent = "🔒 이 창을 닫으면 다시 비밀번호를 물어요.";
  }
  $("tabs").addEventListener("click", function(e){ var b = e.target.closest("[data-k]"); if(!b) return; cur = b.dataset.k; sessionStorage.setItem(TK, cur); draw(); });
  window.addEventListener("storage", function(e){ if(e.key === "tt_lib_star_v1" || e.key === "tt_board_v1") draw(); });
  /* v2.50.1 ★ 자주 보는 문서 정리: 자료실에서 지운 파일은 위쪽 ★ 줄에서도 사라지게 (10분에 한 번, 목록만 받아 비교) */
  (function syncStars(){
    var b = B(), S = (TT.store.get("tt_lib_star_v1", null) || {}).ids || {};
    if(!boardOk() || !b.pw || !Object.keys(S).length) return;
    var k = "sbStarChk", last = +(sessionStorage.getItem(k) || 0); if(Date.now() - last < 600000) return;
    sessionStorage.setItem(k, String(Date.now()));
    fetch(b.url, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({pw: b.pw, action: "liblist"})})
      .then(function(r){ return r.json(); }).then(function(r){
        if(!r || !r.ok || !Array.isArray(r.items)) return;
        var keep = {}, o = TT.store.get("tt_lib_star_v1", null) || {}, ids = o.ids || {}, n = 0;
        r.items.forEach(function(x){ keep[String(x.id)] = 1; });
        Object.keys(ids).forEach(function(id){ if(!keep[id]){ delete ids[id]; n++; } });
        if(!n) return;
        o.ids = ids; TT.store.set("tt_lib_star_v1", o);
        if(cur.indexOf("doc:") === 0 && !ids[cur.slice(4)]){ cur = "board"; sessionStorage.setItem(TK, cur); }
        draw(); TT.ui.toast("자료실에서 지운 문서 " + n + "개를 ★ 줄에서 뺐어요");
      }).catch(function(){});
  })();
  draw();
})();
</script>
</body>
