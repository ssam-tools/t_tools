<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function pad(n){ return ("0" + n).slice(-2); }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function toast(m){ if(TT.ui && TT.ui.toast) TT.ui.toast(m); }
  var CH = window.TTChallenge, CON = window.TT_CONCEPTS || {AREA: {}, CARDS: {}};
  var KEY = "tt_book_v1", S = TT.store.get(KEY, null) || {};
  S.v = 1; S.off = S.off || {}; S.offs = S.offs || {}; S.map = S.map || {}; S.last = S.last || {}; S.at = S.at || {}; S.log = S.log || []; S.given = S.given || {};
  function save(){ TT.store.set(KEY, S); }
  var J = TT.store.get("tt_journal_v1", null) || {};

  /* ── 내 수업 반: 학급 명렬표 → 없으면 시간표 → 수업 기록장 ── */
  var CLS = (function(){
    var o = {};
    try{ TT.roster.classes().forEach(function(c){ if(c.grade != null && c.cls != null && c.students && c.students.length) o[c.grade * 100 + c.cls] = 1; }); }catch(e){}
    if(!Object.keys(o).length){ try{ var T = TT.timetable.load(); if(T) Object.keys(T.slots).forEach(function(k){ var c = +T.slots[k].cls; if(c > 100) o[c] = 1; }); }catch(e){} }
    if(!Object.keys(o).length && J.prog) Object.keys(J.prog).forEach(function(c){ if(+c > 100) o[+c] = 1; });
    return Object.keys(o).map(Number).sort(function(a, b){ return a - b; });
  })();
  var gOf = function(c){ return Math.floor(c / 100); };
  var GRADES = CLS.length ? CLS.map(gOf).filter(function(g, i, a){ return a.indexOf(g) === i; }) : [1, 2, 3];
  var cname = function(c){ return gOf(c) + "-" + (c % 100); };

  /* ── 교과서 PDF 저장소 (IndexedDB) ── */
  var DB = null;
  function db(cb){
    if(DB) return cb(DB);
    var r; try{ r = indexedDB.open("tt_book", 1); }catch(e){ return cb(null); }
    r.onupgradeneeded = function(){ r.result.createObjectStore("pdf"); };
    r.onsuccess = function(){ DB = r.result; cb(DB); }; r.onerror = function(){ cb(null); };
  }
  function getPdf(g, cb){ db(function(d){ if(!d) return cb(null); var q = d.transaction("pdf").objectStore("pdf").get(g); q.onsuccess = function(){ cb(q.result || null); }; q.onerror = function(){ cb(null); }; }); }
  function putPdf(g, f, cb){ db(function(d){ if(!d) return cb(false); var tx = d.transaction("pdf", "readwrite"); tx.objectStore("pdf").put({name: f.name, size: f.size, blob: f}, g); tx.oncomplete = function(){ delete DOCS[g]; cb(true); }; tx.onerror = function(){ cb(false); }; }); }
  var pdfjs = null, PJBASE = "", DOCS = {};
  function lib(){
    if(pdfjs) return Promise.resolve(pdfjs);
    var base = new URL("../../shared/vendor/pdfjs/", location.href).href;
    return import(base + "pdf.min.mjs").then(function(m){ m.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.mjs"; pdfjs = m; PJBASE = base; return m; });
  }
  function doc(g){
    if(DOCS[g]) return DOCS[g];
    DOCS[g] = new Promise(function(res){
      getPdf(g, function(rec){
        if(!rec) return res(null);
        rec.blob.arrayBuffer().then(function(buf){
          return lib().then(function(pj){ return pj.getDocument({data: new Uint8Array(buf), cMapUrl: PJBASE + "cmaps/", cMapPacked: true, isEvalSupported: false}).promise; });
        }).then(function(d){ res(d); }).catch(function(e){ console.warn(e); res(null); });
      });
    });
    return DOCS[g];
  }

  /* ── 쪽-단원표: "시작쪽 단원이름 [단원코드]" 한 줄씩 (# 줄·? 줄은 무시) ── */
  var GUESS = [["PRIME","소인수"],["INT","정수와 유리수"],["CYCLIC","순환소수|유한소수"],["ROOT","제곱근|실수"],["FACT","인수분해|다항식의 곱셈|곱셈 ?공식"],
               ["QF","이차함수"],["LF","일차함수"],["INV","좌표|정비례|반비례|그래프"],
               ["QE","이차방정식"],["SYS","연립"],["INEQ","부등식"],["LE","일차방정식"],["POLY","식의 계산|문자|단항식|다항식"],
               ["TRIG","삼각비"],["PYTH","피타고라스"],["SIM","닮음"],["QUAD","사각형"],["TRI","삼각형"],["CIRCLE","원의 성질|원주각|접선"],
               ["SOLID","입체"],["PLANE","평면도형|다각형|원과 부채꼴"],["BASIC","기본 도형|작도|합동"],["STAT2","산포도|상관|분산"],["PROB","경우의 수|확률"],["STAT1","자료|대푯값|도수"]];
  function guess(name){ for(var i = 0; i < GUESS.length; i++) if(new RegExp(GUESS[i][1]).test(name)) return GUESS[i][0]; return ""; }
  function parseMap(g){
    return String(S.map[g] || "").split("\n").map(function(l){
      var m = l.trim().match(/^p?\.?\s*(\d+)\s+(.+?)(?:\s+([A-Z][A-Z0-9]+))?$/); if(!m) return null;
      return {p: +m[1], name: m[2].trim(), code: m[3] && CH.unit(m[3]) ? m[3] : guess(m[2])};
    }).filter(Boolean).sort(function(a, b){ return a.p - b.p; });
  }
  function unitAt(g, p){ var L = parseMap(g), u = null; L.forEach(function(x){ if(x.p <= p) u = x; }); return u; }

  /* ── 수업 자료 폴더 한 번에 불러오기 (lesson_files) ──
     textbook/  교과서 PDF (파일 이름에 1학년·2학년·3학년 또는 grade1·grade2·grade3)
     page_unit/ 쪽-단원표 txt (같은 방식으로 학년 구분, "쪽차이 4" 줄은 쪽 번호 맞추기)
     exam/      기출 그림(2023-14.png …) · exam-unit-fix.json */
  function gradeIn(path){
    var m = path.match(/([123])\s*학년/) || path.match(/grade\s*_?([123])/i) || path.match(/(?:^|[\/_\-\s])g([123])(?=[^0-9]|$)/i) || path.match(/(?:^|\/)([123])(?=[^0-9\/][^\/]*$)/);
    return m ? +m[1] : 0;
  }
  function loadFolder(done){
    var inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.setAttribute("webkitdirectory", "");
    inp.onchange = function(){
      var fs = [].slice.call(inp.files || []), rep = {pdf: [], map: [], img: 0, fix: 0, skip: []}, jobs = [];
      fs.forEach(function(f){
        var path = (f.webkitRelativePath || f.name).replace(/\\/g, "/"), low = path.toLowerCase(), g = gradeIn(path);
        if(/\.pdf$/i.test(f.name)){
          if(g) jobs.push(new Promise(function(r){ putPdf(g, f, function(ok){ if(ok) rep.pdf.push(g); r(); }); })); else rep.skip.push(f.name);
        }else if(/\.txt$/i.test(f.name) && !/readme|읽어/i.test(f.name)){
          if(g) jobs.push(f.text().then(function(t){
            readOff(g, t);
            var body = t.split(/\r?\n/).filter(function(l){ return /^\s*p?\.?\s*\d+\s+\S/.test(l); }).join("\n");
            if(body){ S.map[g] = body; rep.map.push(g); }
          }));
        }else if(/exam-unit-fix.*\.json$/i.test(f.name)){
          jobs.push(f.text().then(function(t){ try{ rep.fix += CH.importFixObj(JSON.parse(t)); }catch(e){} }));
        }
      });
      jobs.push(new Promise(function(r){ CH.storeImages(fs, function(n){ rep.img = n; r(); }); }));
      toast("수업 자료를 불러오는 중…");
      Promise.all(jobs).then(function(){
        save();
        var u = function(a){ return a.length ? a.sort().map(function(g){ return g + "학년"; }).join("·") : "없음"; };
        alert("수업 자료 폴더를 불러왔습니다.\n\n📘 교과서 PDF: " + u(rep.pdf) + "\n📑 쪽-단원표: " + u(rep.map) + "\n🔥 기출 그림: " + rep.img + "장" + (rep.fix ? "\n🛠 고친 단원: " + rep.fix + "개" : "")
          + (rep.skip.length ? "\n\n⚠ 학년을 알 수 없는 PDF: " + rep.skip.join(", ") + "\n   파일 이름에 1학년·2학년·3학년 (또는 grade1) 을 넣어 주세요." : ""));
        done && done();
      });
    };
    inp.click();
  }

  /* ── 상태 ── */
  var st = { c: 0, pdfPage: 1, n: 0, wide: false, zoom: 1, busy: 0, lesson: false, mode: 1, pen: false, shown: [] };
  var off = function(g){ return +S.off[g] || 0; };
  /* 쪽차이 구간: PDF 중간에 쪽이 끼어 있으면(예: 77-1, 77-2) "쪽차이 2 78쪽부터" 줄로 그 쪽부터 차이를 바꿈 → S.offs[학년] = [{p:교과서쪽, o:차이}] */
  function steps(g){ return (S.offs[g] || []).slice().sort(function(a, b){ return a.p - b.p; }); }
  function toPdf(g, p){ var o = off(g); steps(g).forEach(function(s){ if(p >= s.p) o = s.o; }); return p + o; }
  function toBook(g, q){ var b = q - off(g); steps(g).forEach(function(s){ var c = q - s.o; if(c >= s.p) b = c; else if(b >= s.p) b = s.p - 1; }); return b; }
  function offText(g){ return off(g) + "쪽" + steps(g).map(function(s){ return " · " + s.p + "쪽부터 " + s.o + "쪽"; }).join(""); }
  function readOff(g, t){
    var re = /쪽\s*차이\s*[:=]?\s*(-?\d+)(?:[ \t]*\(?[ \t]*(\d+)[ \t]*쪽?[ \t]*부터)?/g, m, base = null, ss = [];
    while((m = re.exec(t))){ if(m[2]) ss.push({p: +m[2], o: +m[1]}); else if(base === null) base = +m[1]; }
    if(base !== null) S.off[g] = base;
    if(ss.length) S.offs[g] = ss; else if(base !== null) delete S.offs[g];
  }
  var bookP = function(){ return toBook(gOf(st.c), st.pdfPage); };   // 교과서에 찍힌 쪽
  function nowClass(){ try{ var s = TT.timetable.now() || TT.timetable.next(); if(s && CLS.indexOf(+s.cls) >= 0) return {c: +s.cls, now: !!TT.timetable.now()}; }catch(e){} return null; }
  function drawChips(){
    var nc = nowClass();
    $("cls").innerHTML = CLS.map(function(c){ return '<button data-c="' + c + '" class="' + (c === st.c ? "on " : "") + (nc && nc.c === c ? "now" : "") + '">' + cname(c) + "</button>"; }).join("") || '<span class="muted">학급 명렬표나 내 시간표를 먼저 넣으면 반이 나옵니다</span>';
    [].forEach.call($("cls").querySelectorAll("button"), function(b){ b.onclick = function(){ pick(+b.dataset.c); }; });
  }
  function pick(c){
    st.c = c; S.sel = c; save(); drawChips(); st.shown = [];
    st.pdfPage = startPage(c); show();
  }
  function startPage(c){ var g = gOf(c), p0 = (S.last[c] ? S.last[c].p : (S.at[c] || (parseMap(g)[0] || {}).p || 1)); return toPdf(g, p0); }
  function reopen(){ if(st.c){ delete S.at[st.c]; st.pdfPage = startPage(st.c); } show(); }   // 자료를 새로 불러온 뒤 (쪽 차이가 바뀌었을 수 있음)
  function curUnit(){ return st.c ? unitAt(gOf(st.c), bookP()) : null; }
  function where(){
    var u = curUnit(), l = S.last[st.c];
    $("where").innerHTML = (st.c ? (st.c % 100) + "반" : "") + (u ? ' · <span class="u">' + esc(u.name) + "</span>" : ' · <span class="muted" style="font-size:15px">쪽-단원표를 넣으면 단원이 나옵니다</span>')
      + '<span class="p">p.' + bookP() + (l ? " <small>지난 시간 p." + l.p + " (" + l.d.slice(5).replace("-", "/") + ")</small>" : "") + "</span>";
    $("lt").innerHTML = '<b class="cp">' + (st.c ? (st.c % 100) + "반 · " : "") + "p." + bookP() + "</b>" + (u ? '<span class="u">' + esc(u.name) + "</span>" : "");   // 쪽 번호는 늘 보이게, 단원 이름만 줄임
    $("pin").value = bookP();
    resChip(); if(RM.on) rState();
    var cm = st.c ? cmpText(st.c) : ""; if(cm) $("where").insertAdjacentHTML("beforeend", ' <small class="cmp">' + cm + "</small>");
    var n = u && u.code ? CH.count(u.code) : 0;
    $("bCh").textContent = "🔥 도전 " + n; $("bCh").disabled = !n; $("bCon").disabled = !(u && u.code);
    if(st.lesson && (st.mode === 2 || st.mode === 4)) drawPane();
  }

  /* ── 교과서 그리기 (확대 · 형광펜) ── */
  var renderTask = null;
  function emptyMsg(g){
    $("stage").innerHTML = '<div class="msg">' + g + '학년 교과서 PDF가 이 기기에 없습니다.<br>처음 한 번만 불러오면 다음부터 자동으로 열립니다.<br><br>'
      + '<button class="btn primary" id="bCloud">☁ 학교 드라이브에서 ' + g + '학년 교과서 받기</button><br>'
      + '<button class="btn" id="bAll">📂 수업 자료 폴더 불러오기 (lesson_files)</button><br><button class="btn" id="bLoad">📘 ' + g + '학년 교과서 PDF만 불러오기</button></div>';
    $("bCloud").onclick = function(){ cloudRun("down", g, show); };
    $("bLoad").onclick = function(){ loadBook(g); }; $("bAll").onclick = function(){ loadFolder(reopen); };
  }
  function show(){
    if(!st.c){ $("stage").innerHTML = '<div class="msg">위에서 반을 고르세요.</div>'; where(); return; }
    var g = gOf(st.c), my = ++st.busy;
    where();
    doc(g).then(function(d){
      if(my !== st.busy) return;
      if(!d){ emptyMsg(g); return; }
      st.n = d.numPages; st.pdfPage = Math.max(1, Math.min(st.n, st.pdfPage));
      S.at[st.c] = bookP(); save(); where();
      $("prev").disabled = $("sPrev").disabled = st.pdfPage <= 1; $("next").disabled = $("sNext").disabled = st.pdfPage >= st.n;
      d.getPage(st.pdfPage).then(function(pg){
        if(my !== st.busy) return;
        var box = $("stage"), v1 = pg.getViewport({scale: 1});
        var fit = st.wide ? (box.clientWidth - 16) / v1.width : Math.min((box.clientHeight - 8) / v1.height, (box.clientWidth - 16) / v1.width);
        var sc = fit * st.zoom, dpr = Math.min(2, window.devicePixelRatio || 1), vp = pg.getViewport({scale: sc * dpr});
        var w = Math.round(vp.width / dpr), h = Math.round(vp.height / dpr);
        var cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; cv.style.width = w + "px"; cv.style.height = h + "px";
        if(renderTask) try{ renderTask.cancel(); }catch(e){}
        renderTask = pg.render({canvasContext: cv.getContext("2d"), viewport: vp});
        renderTask.promise.then(function(){
          if(my !== st.busy) return;
          var wrap = document.createElement("div"); wrap.className = "pg"; wrap.style.width = w + "px"; wrap.style.height = h + "px";
          wrap.appendChild(cv); box.innerHTML = ""; box.appendChild(wrap);
          if(st.zoom === 1) box.scrollTop = 0;
          inkMount(wrap, w, h);
          if(st.anchor){ var A = st.anchor, R = wrap.getBoundingClientRect(); box.scrollLeft += R.left + A.fx * R.width - A.cx; box.scrollTop += R.top + A.fy * R.height - A.cy; st.anchor = null; }
        }).catch(function(){});
      });
    });
  }
  function turn(d){ if(!st.c) return; if(st.sc) setMode(1); /* 수업 시작 한 장을 보는 중에 쪽을 넘기면 교과서로 */ var n = st.pdfPage + d; if(n < 1 || (st.n && n > st.n)) return; st.pdfPage = n; show(); }
  function zoom(f){ st.zoom = Math.max(1, Math.min(4, Math.round(st.zoom * f * 100) / 100)); show(); }
  /* 판서 (v1.11 · 공통 엔진 shared/ink.js): 펜·곧은 형광펜·지우개·레이저·가림막·글상자·작도·각도기
     교과서 쪽마다 이 기기에 저장(tt_bookink_v1 · "학년-PDF쪽") → 다른 반 수업 때도 그대로, 🗑 로 지우기 */
  var IK = "tt_bookink_v1", IKS = TT.store.get(IK, null) || {}, inkKey = "", inkT = null;
  function saveInk(){ clearTimeout(inkT); inkT = setTimeout(function(){ Object.keys(IKS).forEach(function(k){ if(!IKS[k].length) delete IKS[k]; }); if(!TT.store.set(IK, IKS)) toast("판서를 저장하지 못했어요(저장 공간)"); }, 500); }
  var INK = TTInk.create({onChange: saveInk});
  (function(){
    var sv = document.createElement("button"); sv.type = "button"; sv.textContent = "🖼️"; sv.title = "이 쪽을 판서와 함께 그림으로 저장";
    sv.onclick = function(){
      var pg = document.querySelector(".stage .pg canvas"), ic = INK.canvas(); if(!pg) return;
      var o = document.createElement("canvas"); o.width = pg.width; o.height = pg.height; var g = o.getContext("2d"); g.drawImage(pg, 0, 0); if(ic) g.drawImage(ic, 0, 0, o.width, o.height);

        if(k > s.n) return Promise.resolve();
        var i = k++; say("☁ 받는 중… " + i + " / " + s.n + " 조각");
        return bpost({action: "libget", id: s.parts[i]}).then(function(r){ var bin = atob(r.data), u8 = new Uint8Array(bin.length); for(var j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j); parts.push(u8); return next(); });
      }
      return next().then(function(){
        var f = new File(parts, g + "학년 교과서.pdf", {type: "application/pdf"});
        return new Promise(function(res, rej){ putPdf(g, f, function(ok){ ok ? res(f.size) : rej(new Error("이 기기 저장 공간이 모자랍니다")); }); });
      });
    });
  }
  function cloudRun(kind, g, after){
    if(!hasBoard()){ alert("학교 업무판이 연결되어 있지 않습니다.\n쌤 노트 ⚙️ 설정 → 학교 업무판 연결에서 주소와 공용 비밀번호를 넣어 주세요."); return; }
    var bx = document.createElement("div"); bx.className = "cbusy"; bx.innerHTML = '<div><b>☁ 학교 드라이브</b><span>준비 중…</span><small>창을 닫지 마세요. 큰 교과서는 몇 분 걸릴 수 있어요.</small></div>'; document.body.appendChild(bx);
    var say = function(t){ bx.querySelector("span").textContent = t; };
    (kind === "up" ? cloudUp(g, say).then(function(n){ toast(g + "학년 교과서를 학교 드라이브에 올렸습니다 (" + n + "조각)"); })
                   : cloudDown(g, say).then(function(sz){ toast(g + "학년 교과서를 받았습니다 (" + Math.round(sz / 1048576) + "MB)"); }))
      .then(function(){ bx.remove(); after && after(); }, function(e){ bx.remove(); alert((kind === "up" ? "올리지 못했습니다.\n" : "받지 못했습니다.\n") + berr(e)); });
  }

  /* ── 3·8단계: 수업 시작 한 장 · 반별 진도 비교 · 오늘 목표 ── */
  S.goal = S.goal || {};
  function others(c){
    var g = gOf(c), me = S.last[c];
    return CLS.filter(function(x){ return x !== c && gOf(x) === g && S.last[x]; }).map(function(x){ return {c: x, p: S.last[x].p, d: S.last[x].d, diff: me ? S.last[x].p - me.p : null}; });
  }
  function cmpText(c){
    var O = others(c); if(!O.length || !S.last[c]) return "";
    var avg = O.reduce(function(a, x){ return a + x.p; }, 0) / O.length, d = Math.round(S.last[c].p - avg);
    return d === 0 ? "다른 반과 같은 진도" : d > 0 ? "다른 반보다 " + d + "쪽 앞섬" : "다른 반보다 " + (-d) + "쪽 늦음";
  }
  function rosterOf(c){ try{ return TT.roster.classes().filter(function(x){ return x.grade * 100 + x.cls === c; })[0] || null; }catch(e){ return null; } }
  function goalOf(c){ var o = S.goal[c]; return o && o.d === today() ? o.t : ""; }
  function startCard(){
    var P = $("lpane"), c = st.c, g = gOf(c), l = S.last[c], u = curUnit(), O = others(c), lines = [];
    P.style.setProperty("--c", "#2f6fb5"); P.classList.add("on"); setPen(false); st.sc = true;
    [].forEach.call($("lbot").querySelectorAll("button[data-m]"), function(b){ b.classList.remove("on"); });
    lines.push("📖 " + (l ? "지난 시간 <b>p." + l.p + "</b> (" + l.d.slice(5).replace("-", "/") + (l.u ? " · " + esc(l.u) : "") + ")" : "이 반은 첫 수업이에요") + " → 오늘 <b>p." + bookP() + "</b>" + (u ? " · " + esc(u.name) : ""));
    if(O.length) lines.push("📊 " + O.map(function(x){ return (x.c % 100) + "반 p." + x.p + (x.diff == null ? "" : x.diff > 0 ? ' <span class="lead">+' + x.diff + "</span>" : x.diff < 0 ? ' <span class="lag">' + x.diff + "</span>" : ""); }).join(" · ") + (cmpText(c) ? ' <small class="muted">(' + cmpText(c) + ")</small>" : ""));
    var Jo = jload(), pm = Jo && Jo.prog && Jo.prog[c]; if(pm && (pm.memo || pm.lastMemo)) lines.push("📒 " + esc(pm.memo || pm.lastMemo));
    var R = rosterOf(c);
    if(R){
      var SB = TT.store.get("tt_submit_v1", null), I = SB && SB.items ? SB.items.filter(function(it){ return it.cls === R.id; }) : [];
      I.slice(-3).forEach(function(it){ var miss = R.students.filter(function(s){ return !((SB.m || {})[it.id] || {})[s.no]; }).map(function(s){ return s.no; }); if(miss.length) lines.push("📦 " + esc(it.title) + ": " + (miss.length > 12 ? miss.length + "명" : miss.join("·") + "번") + " 미제출"); });
      var home = TT.roster.home(); if(home && home.id === R.id){ var GD = TT.store.get("tt_guide_v1", null), A = GD && GD.att ? GD.att[today()] || {} : {}, nos = Object.keys(A).filter(function(n){ return A[n]; }); if(nos.length) lines.push("🧭 오늘 결석·지각: " + nos.join("·") + "번"); }
    }
    P.innerHTML = '<div class="sc"><div class="tag">수업 시작</div><h1>' + cname(c) + " 수업</h1><ul>" + lines.map(function(x){ return "<li>" + x + "</li>"; }).join("") + "</ul>"
      + '<div class="gl"><label>🎯 오늘 목표</label><input id="gIn" maxlength="80" placeholder="' + esc(u ? u.name.replace(/^[\dⅠ-Ⅻ]+[.)]\s*/, "") + "을(를) 이해하고 문제를 풀 수 있다" : "오늘 배울 것을 한 줄로") + '" value="' + esc(goalOf(c)) + '"><button class="btn" id="gShow">칠판에 크게</button></div>'
      + '<div class="row go2"><button class="btn primary" id="scGo">▶ 수업 시작 (① 교과서)</button></div></div>';
    function keep(){ var v = $("gIn").value.trim(); if(v) S.goal[c] = {d: today(), t: v}; else delete S.goal[c]; save(); goalBn(); }
    $("gIn").onchange = keep;
    $("gShow").onclick = function(){ keep(); if(goalOf(c)){ st.goalOn = true; setMode(1); goalBn(); } };
    $("scGo").onclick = function(){ keep(); setMode(1); };
  }
  function goalBn(){
    var b = $("goalBn"), t = st.c ? goalOf(st.c) : "";
    if(!b){ b = document.createElement("div"); b.id = "goalBn"; b.className = "lx"; b.title = "누르면 숨김"; b.onclick = function(){ st.goalOn = false; goalBn(); }; $("stage").parentNode.appendChild(b); }
    b.textContent = "🎯 " + t; b.classList.toggle("on", !!(st.lesson && st.goalOn && t));
    $("lgoal").classList.toggle("on", !!st.goalOn); $("lgoal").disabled = !t;
  }

  /* ── 6·7단계: 차시 자료 바구니 (쪽 범위마다 링크) · 큰 QR ── */
  S.res = S.res || {};
  function resAt(){ if(!st.c) return []; var g = gOf(st.c), p = bookP(); return (S.res[g] || []).filter(function(r){ return p >= r.p0 && p <= r.p1; }); }
  function resChip(){ var n = resAt().length; ["lres", "bRes"].forEach(function(id){ var b = $(id); if(b){ b.innerHTML = id === "lres" ? '📎<span class="lb"> 자료</span>' + (n ? " " + n : "") : "📎 자료" + (n ? " " + n : ""); b.classList.toggle("has", !!n); } }); }
  function okUrl(u){ return /^https?:\/\/[^\s]+$/i.test(u); }
  function resDlg(){
    if(!st.c) return; var g = gOf(st.c), p = bookP(), L = S.res[g] = S.res[g] || [], here = resAt();
    var row = function(r){ var i = L.indexOf(r); return '<div class="rr"><span class="pp">p.' + r.p0 + (r.p1 !== r.p0 ? "~" + r.p1 : "") + '</span><a href="' + esc(r.u) + '" target="_blank" rel="noopener">' + esc(r.t || r.u) + '</a><button class="btn" data-q="' + i + '">QR</button><button class="btn" data-x="' + i + '" title="지우기">✕</button></div>'; };
    dlg("📎 차시 자료 — " + g + "학년 p." + p,
      '<div class="box"><h3>이 쪽 자료 (' + here.length + ")</h3>" + (here.length ? here.map(row).join("") : '<span class="muted">아직 없어요. 아래에서 넣어 주세요.</span>') + "</div>"
      + '<div class="box"><h3>＋ 자료 넣기</h3><div class="row"><input id="rP0" value="' + p + '" inputmode="numeric">~<input id="rP1" value="' + p + '" inputmode="numeric">쪽 <input id="rT" style="width:220px;text-align:left" placeholder="이름 (예: 활동지, 개념 영상)"><input id="rU" style="flex:1;min-width:220px;width:auto;text-align:left" placeholder="https:// 주소 (영상·활동지·디지털교과서·자료실 자료)"><button class="btn primary" id="rAdd">넣기</button></div>'
      + '<p class="muted">자료실 자료는 자료실에서 그 자료를 열고 주소창의 주소를 붙여 넣으면 됩니다. 학생 개인정보가 담긴 자료는 넣지 마세요.</p></div>'
      + '<div class="box"><h3>📱 아무 주소나 큰 QR로</h3><div class="row"><input id="qU" style="flex:1;width:auto;text-align:left" placeholder="https://"><button class="btn" id="qGo">QR 띄우기</button></div></div>'
      + (L.length > here.length ? '<div class="box"><h3>' + g + "학년 모든 자료 (" + L.length + ")</h3>" + L.slice().sort(function(a, b){ return a.p0 - b.p0; }).map(row).join("") + "</div>" : ""));
    [].forEach.call($("dlg").querySelectorAll("[data-q]"), function(b){ b.onclick = function(){ var r = L[+b.dataset.q]; closeDlg(); qrShow(r.u, r.t); }; });
    [].forEach.call($("dlg").querySelectorAll("[data-x]"), function(b){ b.onclick = function(){ if(!confirm("이 자료를 지울까요?")) return; L.splice(+b.dataset.x, 1); save(); resChip(); resDlg(); }; });
    $("rAdd").onclick = function(){
      var a = parseInt($("rP0").value, 10), z = parseInt($("rP1").value, 10), u = $("rU").value.trim(), t = $("rT").value.trim();
      if(isNaN(a)){ alert("쪽 번호를 넣어 주세요."); return; } if(isNaN(z) || z < a) z = a;
      if(!okUrl(u)){ alert("https:// 로 시작하는 주소를 넣어 주세요."); return; }
      L.push({p0: a, p1: z, t: t, u: u}); save(); resChip(); resDlg();
    };
    $("qGo").onclick = function(){ var u = $("qU").value.trim(); if(!okUrl(u)){ alert("https:// 로 시작하는 주소를 넣어 주세요."); return; } closeDlg(); qrShow(u, ""); };
  }
  function qrShow(u, t){
    if(!window.TTQR){ alert("QR을 만들 수 없습니다."); return; }
    var o = document.createElement("div"); o.className = "qrbig"; o.title = "누르면 닫힘";
    o.innerHTML = '<div class="in">' + TTQR.svg(u, {size: Math.round(Math.min(innerWidth, innerHeight) * 0.66)}) + "<b>" + esc(t || "휴대폰 카메라로 찍어 보세요") + "</b><small>" + esc(u.length > 70 ? u.slice(0, 67) + "…" : u) + "</small></div>";
    o.onclick = function(){ o.remove(); }; document.body.appendChild(o);
  }

  /* ── 4단계: 휴대폰 리모컨 (교실 화면 쪽) — 보관함이 열린 교실 기기에서 수업 모드일 때 2초마다 명령을 확인 ── */
  var RM = {ver: 0, seq: 0, on: false, busy: false, fail: 0, t: null, first: true};
  function vlt(){ return window.TT_VAULT ? window.TT_VAULT() : Promise.reject(new Error("보관함 없음")); }
  function rState(){
    if(!RM.on) return; clearTimeout(RM.st);
    RM.st = setTimeout(function(){
      var u = curUnit();
      vlt().then(function(V){ return V.rsend("tt_rstate_v1", {at: Date.now(), c: st.c, cn: st.c ? cname(st.c) : "", p: bookP(), u: u ? u.name : "", mode: st.mode, lesson: st.lesson, pen: !!st.pen, goal: st.c ? goalOf(st.c) : "", seq: RM.seq, n: st.c ? studentNos(st.c).length : 0}); }).catch(function(){});
    }, 150);
  }
  function rRun(cmd){
    var a = cmd.a;
    if(a === "next") turn(1); else if(a === "prev") turn(-1);
    else if(a === "zi") zoom(1.25); else if(a === "zo") zoom(1 / 1.25);
    else if(a === "mode" && st.lesson) setMode(+cmd.m || 1);
    else if(a === "lesson"){ if(!st.lesson && st.c) setLesson(true); }
    else if(a === "timer" && st.lesson){ setMode(3); timer(+cmd.m || 3); }
    else if(a === "pen" && st.lesson){ if(st.mode === 2 || st.mode === 4) setMode(1); setPen(!st.pen); }
    else if(a === "goal" && st.lesson){ if(cmd.t != null && st.c){ if(String(cmd.t).trim()) S.goal[st.c] = {d: today(), t: String(cmd.t).trim().slice(0, 80)}; save(); } st.goalOn = !!(cmd.on != null ? cmd.on : !st.goalOn); goalBn(); }
    else if(a === "pick"){ var N = studentNos(st.c), n = +cmd.n > 0 ? +cmd.n : (N.length ? N[Math.floor(Math.random() * N.length)] : 0); if(n) pickShow(n); else toast("반 명렬표가 없어 번호를 뽑지 못했어요"); }
    else if(a === "class" && CLS.indexOf(+cmd.c) >= 0){ pick(+cmd.c); if(!st.lesson) setLesson(true); }
    else if(a === "page" && st.c && +cmd.p > 0){ st.pdfPage = toPdf(gOf(st.c), +cmd.p); show(); }
  }
  function pickShow(n){
    var o = document.createElement("div"); o.className = "qrbig pk"; o.innerHTML = '<div class="in"><small>🎲 오늘의 주인공</small><b class="n">' + n + "번</b></div>"; o.onclick = function(){ o.remove(); };
    document.body.appendChild(o); setTimeout(function(){ o.remove(); }, 6000);
  }
  function rPoll(){
    clearTimeout(RM.t); if(!RM.on) return;
    if(document.hidden){ RM.t = setTimeout(rPoll, 4000); return; }
    vlt().then(function(V){ return V.rget("tt_remote_v1", RM.ver); }).then(function(r){
      if(r.off){ rChip("off"); RM.t = setTimeout(rPoll, 15000); return; }
      if(r.error){ RM.fail++; rChip("err"); RM.t = setTimeout(rPoll, Math.min(15000, 2000 * RM.fail)); return; }
      RM.fail = 0; rChip("on");
      if(r.obj && r.ver > RM.ver){ RM.hot = Date.now();
        RM.ver = r.ver;
        var Q = (r.obj.q || []).filter(function(x){ return x.s > RM.seq && Date.now() - (x.t || 0) < 90000; });
        if(RM.first){ RM.first = false; RM.seq = Math.max(RM.seq, (r.obj.q || []).reduce(function(m, x){ return Math.max(m, x.s); }, 0)); Q = Q.filter(function(x){ return Date.now() - (x.t || 0) < 8000; }); }
        Q.forEach(function(x){ RM.seq = Math.max(RM.seq, x.s); try{ rRun(x); }catch(e){} });
        if(Q.length) rState();
      }else if(RM.first) RM.first = false;
      RM.t = setTimeout(rPoll, Date.now() - (RM.hot || 0) < 10 * 60 * 1000 ? 250 : 1200);   /* v2.10.5: 리모컨을 쓰는 동안(10분)은 쉬지 않고 바로 다시 확인 */
    }).catch(function(){ RM.t = setTimeout(rPoll, 10000); });
  }
  function rChip(s){ var b = $("lrm"); if(!b) return; b.dataset.s = s; b.title = s === "on" ? "📱 휴대폰 리모컨 연결됨 (수업 메뉴 → 수업 리모컨)" : s === "err" ? "리모컨 연결이 잠깐 끊겼어요" : "보관함을 열면 휴대폰 리모컨을 쓸 수 있어요"; }
  function rStart(){ if(RM.on) return; RM.on = true; RM.first = true; RM.hot = Date.now(); rPoll(); rState(); }

  /* ── 단추·키 ── */
  $("prev").onclick = $("lprev").onclick = $("sPrev").onclick = function(){ turn(-1); }; $("next").onclick = $("lnext").onclick = $("sNext").onclick = function(){ turn(1); };
  $("pin").onchange = function(){ var v = parseInt(this.value, 10); if(!isNaN(v) && st.c){ st.pdfPage = toPdf(gOf(st.c), v); show(); } };
  $("fit").onclick = function(){ st.wide = !st.wide; this.textContent = st.wide ? "↔ 맞춤" : "↕ 맞춤"; show(); };
  $("bDone").onclick = function(){ var r = done(); if(!r) return; var js = journalSync(r); toast(cname(st.c) + " 진도 p." + r.p + " 저장 · " + js.msg); };
  $("bProg").onclick = progDlg;
  $("bSet").onclick = function(){ setDlg(); };
  $("bLesson").onclick = function(){ if(st.c) setLesson(true); };
  $("lx").onclick = function(){ setLesson(false); };
  $("lend").onclick = endLesson;
  $("lgoal").onclick = function(){ st.goalOn = !st.goalOn; if(st.goalOn && st.c && !goalOf(st.c)){ startCard(); st.goalOn = false; setTimeout(function(){ var i = $("gIn"); if(i) i.focus(); }, 50); } goalBn(); };
  $("lres").onclick = $("bRes").onclick = resDlg;
  $("lsc").onclick = function(){ if(st.c) startCard(); };
  $("lrec").onclick = function(){ RQ = {nos: [], tags: []}; recPane(); };
  $("lpen").onclick = function(){ if(st.mode === 2 || st.mode === 4) setMode(1); setPen(!st.pen); };
  $("lzi").onclick = function(){ zoom(1.25); }; $("lzo").onclick = function(){ zoom(1 / 1.25); };
  [].forEach.call($("tmb").querySelectorAll("button"), function(b){ b.onclick = function(){ timer(+b.dataset.m); }; });
  [].forEach.call($("lbot").querySelectorAll("button[data-m]"), function(b){ b.onclick = function(){ setMode(+b.dataset.m); }; });
  $("bCon").onclick = function(){ var u = curUnit(); if(u && u.code) location.href = "../concept/?u=" + u.code; };
  $("bCh").onclick = function(){ var u = curUnit(); if(u && u.code) CH.open(CH.list(u.code), 0, null, function(it){ if(st.shown.indexOf(it.id) < 0) st.shown.push(it.id); }); };
  document.addEventListener("keydown", function(e){
    if($("ov").classList.contains("on") || CH.isOpen() || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key === "ArrowLeft" || e.key === "PageUp") turn(-1); else if(e.key === "ArrowRight" || e.key === "PageDown") turn(1);
    else if(st.lesson && /^[1-4]$/.test(e.key)) setMode(+e.key);
    else if(st.lesson && (e.key === "+" || e.key === "=")) zoom(1.25); else if(st.lesson && e.key === "-") zoom(1 / 1.25);
  });
  var rt; addEventListener("resize", function(){ clearTimeout(rt); rt = setTimeout(show, 200); });

  /* 처음: 주소의 반 → 지금 시간표의 반 → 지난번 고른 반 → 첫 반 */
  drawChips();
  var nc = nowClass(), q = (location.search.match(/[?&]c=(\d+)/) || [])[1], L0 = /[?&]lesson=1/.test(location.search);
  var first = q && CLS.indexOf(+q) >= 0 ? +q : nc ? nc.c : (CLS.indexOf(+S.sel) >= 0 ? +S.sel : CLS[0]);
  if(first){ st.c = first; S.sel = first; drawChips(); st.pdfPage = startPage(first); }
  if(first && (L0 || TT.classroom)) setLesson(true); else show();   // PLAN_수업 2단계: 교실 기기는 바로 수업 화면
})();
</script>
</body>
</html>
