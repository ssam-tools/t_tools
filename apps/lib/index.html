<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 막습니다. 예외: 학교 업무판(구글 앱스 스크립트) — 자료실 파일은 학교 구글 드라이브에 있습니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self' blob:; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/tt.css">
<title>학교 자료실 · 쌤 노트</title>
<!--
  학교 자료실: 규정집·교육계획서·생활기록부 기재요령·서식처럼 구성원이 가끔 찾아보는 자료를 누구나 올리고, 내용까지 찾아봅니다.
  · 파일은 학교 업무판 계정의 구글 드라이브 폴더("쌤노트_학교자료실"), 목록과 쪽별 글자는 업무판 시트에 저장됩니다.
  · 올리기 전에 이 기기에서 글자를 뽑아(PDF: pdf.js, HWPX·DOCX·XLSX·PPTX: 압축 안 XML) 쪽 단위로 색인하고,
    학생 이름(명렬표)·전화번호·주민번호 꼴이 있으면 경고합니다. 개인정보가 담긴 자료는 올리지 않습니다.
  · 지우기: 올린 사람(이 기기·내 보관함에 남은 표) 또는 관리자(업무판 스크립트 속성 LIB_ADMIN).
  · 🤖 물어보기: 업무판에 AI 키가 있으면, 찾은 쪽만 근거로 답하고 [자료 n쪽]을 붙입니다.
  · "tt_lib_v1" {mine:{자료id: 지우기 표}}
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap;flex:1;justify-content:flex-end}
  .sbox{display:flex;align-items:center;gap:6px;flex:1;max-width:620px;margin:0}
  header .bar{align-items:center}
  /* 검색칸 · 찾기 · 물어보기 · 자료 올리기를 같은 높이 · 같은 줄에 (글자 크기를 바꿔도 맞게) */
  #q,.sbox .btn,#upBtn{box-sizing:border-box;height:42px;margin:0;align-self:center;display:inline-flex;align-items:center;justify-content:center;line-height:1;vertical-align:middle;font-size:15px}
  #q{font-size:16px}
  .sbox input{flex:1;font:inherit;font-size:16px;border:2px solid #b9c9dc;border-radius:12px;padding:8px 12px;min-width:0}
  .sbox input:focus{outline:none;border-color:var(--accent)}
  main{display:grid!important;grid-template-columns:minmax(170px,200px) minmax(0,1fr);gap:10px;padding:10px!important}
  .nav{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px}
  .nav button{font:inherit;font-size:13.5px;text-align:left;border:0;background:transparent;border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between}
  .nav button:hover{background:#f3f6f9}
  .nav button[aria-current=true]{background:var(--accent);color:#fff}
  .nav small{opacity:.75}
  .nav label{font-size:12.5px;color:var(--sub);display:flex;gap:5px;align-items:center;padding:6px 4px}
  .body{min-height:0;display:flex;flex-direction:column;gap:8px}
  .list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px}
  .it{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .it .ic{font-size:24px;flex:none}
  .it .mn{flex:1;min-width:0}
  .it .tt{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .mt{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .it .btn{padding:5px 10px;font-size:13px}
  .chip{font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;background:#eceff3;color:#4a5560}
  .chip.new{background:var(--ok-soft);color:var(--ok)}.chip.old{background:#f3f4f6;color:#9aa5b1}.chip.idx{background:var(--accent-soft);color:var(--accent)}
  .hit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:3px}
  .hit .hh{display:flex;gap:8px;align-items:center;font-size:13.5px}
  .hit .hh b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hit .pg{font-weight:900;color:var(--accent);white-space:nowrap}
  .hit .sn{font-size:13.5px;line-height:1.6;color:#33404d}
  mark{background:#ffe58a;border-radius:3px;padding:0 1px}
  .ans{background:#f8f5ff;border:1px solid #d9c9f3;border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
  .ans h3{font-size:13.5px;color:#5b2f99;margin-bottom:4px}
  .muted{color:var(--sub);font-size:12.5px}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub);text-align:center}
  .empty .big{font-size:44px}
  dialog.up{width:min(620px,94vw);max-height:calc(100vh - 16px);overflow:auto}
  .up label.f{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:12.5px;font-weight:700;color:var(--sub);margin-top:8px}
  .up label.f input[type=file]{font-size:13px}
  .up input[type=text],.up select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%;box-sizing:border-box}
  .up .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .up .st{font-size:13px;border-radius:8px;padding:6px 9px;background:#f3f6f9;margin-top:8px}
  .up .warn{background:var(--danger-soft);color:var(--danger);font-weight:700}
  .up .ok{background:var(--ok-soft);color:var(--ok)}
  .up .acts{display:flex;justify-content:space-between;margin-top:12px;gap:8px;align-items:center}.up .acts .r{display:flex;gap:6px}
  /* PDF 바로 보기 */
  dialog.pv{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:#525659}
  dialog.pv[open]{display:flex;flex-direction:column}
  .pvh{display:flex;gap:6px;align-items:center;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  .pvh b{flex:1;min-width:120px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pvh .btn{padding:5px 10px;font-size:13px}
  .pvh .pn{font-size:13px;color:var(--sub);font-weight:700;min-width:70px;text-align:center}
  .pvh input{width:52px;font:inherit;font-size:13px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px}
  .pvb{flex:1;min-height:0;overflow:auto;padding:12px 0}
  .pvp{margin:0 auto 12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);position:relative}
  .pvp canvas{display:block;width:100%;height:100%}
  .pvp::before{content:attr(data-n);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c3cad2;font-size:22px;font-weight:800}
  .pvp.done::before{display:none}
  .pvmsg{color:#fff;text-align:center;margin-top:30vh;font-size:15px}
  /* v2.7 문서 안 찾기: 찾은 자리 노랗게 · 지금 자리 주황 */
  .pvp .dfm{position:absolute;display:block;background:rgba(255,214,0,.42);mix-blend-mode:multiply;border-radius:2px;pointer-events:none}
  .pvp .dfm.cur{background:rgba(255,128,0,.55);box-shadow:0 0 0 2px rgba(255,110,0,.9)}
  .pvf{position:relative;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;background:#fff}
  .pvf:focus-within{border-color:var(--accent,#2f6fb5)}
  .pvh .pvf input{width:170px;border:0;outline:0;font:inherit;font-size:13px;text-align:left;padding:4px 0}
  .pvf #pvQc{font-size:12px;color:var(--sub);min-width:40px;text-align:right;white-space:nowrap}
  .pvh .pvf .btn{padding:3px 8px;font-size:11px;border-radius:999px}
  #pvQl{position:absolute;top:calc(100% + 6px);left:0;width:340px;max-height:50vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px;z-index:3;display:flex;flex-direction:column;gap:2px}
  #pvQl[hidden]{display:none}
  #pvQl button{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;font:inherit;cursor:pointer}
  #pvQl button:hover{background:#f2f4f7}#pvQl b{font-size:13px}#pvQl small{font-size:12px;color:var(--sub)}#pvQl div{font-size:12px;color:var(--sub);padding:4px 8px}
  html.inframe .pvf{display:none}
  @media (max-width:760px){ main{grid-template-columns:1fr} body{height:auto;min-height:100dvh;overflow:auto} .bar{justify-content:flex-start} }
  .btn.star{font-size:16px;color:#9aa5b1;padding-left:10px;padding-right:10px}.btn.star.on{color:#e0a526}
  html.inframe header{display:none}
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../">← 쌤 노트</a>
    <h1>🔎 학교 자료실</h1>
  </div>
  <div class="bar">
    <form class="sbox" id="sf"><input id="q" type="search" placeholder="찾을 말 (예: 교외 수상, 결석 처리, 체험학습 신청)" autocomplete="off"><button type="submit" class="btn primary">찾기</button><button type="button" class="btn" id="ask" hidden title="찾은 쪽만 근거로 AI가 답합니다">🤖 물어보기</button></form>
    <button type="button" class="btn primary" id="upBtn">＋ 자료 올리기</button>
    <details class="more" id="more"><summary aria-label="더 보기">⋯</summary><div class="menu"><button type="button" id="mAdmin">관리자 모드</button><button type="button" id="mReload">목록 새로 고침</button></div></details>
  </div>
</header>
<main class="panel" id="m">
  <nav class="nav" id="nav" aria-label="갈래"></nav>
  <section class="body" id="body"></section>
</main>
<footer>
  <span id="info">누구나 올리고 내려받습니다 · 내용까지 찾아 몇 쪽인지 보여 줍니다</span>
  <span class="priv">🔒 개인정보가 담긴 자료는 올리지 마세요 · 우리 학교 공용 비밀번호를 아는 구성원만</span>
</footer>
<script>if(window.top !== window) document.documentElement.classList.add("inframe");</script>
<script src="../../shared/tt.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var CATS = ["규정", "교육계획", "생활기록부", "학사·평가", "서식", "업무 안내", "연수 자료", "기타"];
  var B = TT.store.get("tt_board_v1", null) || {}, items = [], cat = "전체", onlyNew = true, admin = sessionStorage.getItem("tt_lib_admin") || "", canAsk = false;
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function mine(){ var o = TT.store.get("tt_lib_v1", null) || {}; o.mine = o.mine || {}; return o; }
  function kb(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB"; }
  function icon(name){ var e = (String(name).match(/\.(\w+)$/) || [])[1] || ""; e = e.toLowerCase(); return {pdf: "📕", hwp: "📘", hwpx: "📘", doc: "📄", docx: "📄", xls: "📗", xlsx: "📗", ppt: "📙", pptx: "📙", jpg: "🖼️", jpeg: "🖼️", png: "🖼️", zip: "🗜️"}[e] || "📄"; }
  function pg(p){ return /^\d+$/.test(p) ? p + "쪽" : p; }
  function post(o){
    return fetch(B.url, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({pw: B.pw}, o))})
      .then(function(r){ return r.json(); }).then(function(r){ if(!r || !r.ok) throw new Error((r && r.error) || "오류"); return r; });
  }
  function err(e){ var m = String(e && e.message || e); return m === "AUTH" ? "업무판 비밀번호가 맞지 않습니다" : /지원하지 않는 요청/.test(m) ? "업무판 Code.gs가 예전 것입니다 (10단계 Code.gs로 바꾸고 새 버전으로 배포)"
      : /DriveApp|auth\/drive|권한/.test(m) ? "업무판 계정이 구글 드라이브 사용을 아직 허락하지 않았습니다. 업무판 담당자가 앱스 스크립트 편집기에서 '드라이브권한승인' 함수를 한 번 실행해 [허용]을 누른 뒤, [배포 → 배포 관리 → 수정 → 새 버전]으로 다시 배포해 주세요." : m; }

  /* ---------- 목록 ---------- */
  function load(){
    $("body").innerHTML = '<div class="empty"><div class="big">⏳</div><div>자료 목록을 불러오는 중…</div></div>';
    post({action: "liblist"}).then(function(r){ items = (r.items || []).filter(function(x){ return !/^ttbook__/.test(String(x.name || "")); });   /* 교과서 조각(교과서 띄우기용)은 목록에서 숨김 */ drawNav(); drawList(); openFromUrl(); }).catch(function(e){ $("body").innerHTML = '<div class="empty"><div class="big">⚠️</div><div><b>자료실을 열지 못했습니다.</b><br>' + esc(err(e)) + "</div></div>"; });
    post({action: "aiinfo"}).then(function(r){ canAsk = !!r.enabled; $("ask").hidden = !canAsk; }).catch(function(){});
  }
  function drawNav(){
    var c = {"전체": 0}; items.forEach(function(x){ if(onlyNew && !x.latest) return; c["전체"]++; c[x.cat] = (c[x.cat] || 0) + 1; });
    $("nav").innerHTML = ["전체"].concat(CATS).map(function(k){ return '<button type="button" data-c="' + esc(k) + '" aria-current="' + (k === cat) + '">' + esc(k) + "<small>" + (c[k] || 0) + "</small></button>"; }).join("")
      + '<label><input type="checkbox" id="onlyNew" ' + (onlyNew ? "checked" : "") + "> 최신 판만</label>";
    $("onlyNew").onchange = function(){ onlyNew = this.checked; drawNav(); drawList(); };
  }
  $("nav").onclick = function(e){ var b = e.target.closest("[data-c]"); if(!b) return; cat = b.dataset.c; $("q").value = ""; drawNav(); drawList(); };
  function drawList(){
    var my = mine().mine, L = items.filter(function(x){ return (cat === "전체" || x.cat === cat) && (!onlyNew || x.latest); }).sort(function(a, b){ return a.at < b.at ? 1 : -1; });
    $("body").innerHTML = L.length ? '<div class="list">' + L.map(function(x){
      return '<div class="it"><span class="ic">' + icon(x.name) + '</span><div class="mn"><div class="tt" title="' + esc(x.name) + '">' + esc(x.title) + '</div><div class="mt"><span class="chip">' + esc(x.cat) + "</span>" + (x.latest ? '<span class="chip new">최신</span>' : '<span class="chip old">보관</span>') + (x.pages ? '<span class="chip idx">내용 검색' + (/\.pdf$/i.test(x.name) ? " " + x.pages + "쪽" : "") + "</span>" : '<span class="chip">이름으로만 검색</span>') + "<span>" + esc(x.by || "") + "</span><span>" + esc(day(x.at)) + "</span><span>" + kb(x.size) + "</span>" + (x.desc ? "<span>" + esc(x.desc) + "</span>" : "") + '</div></div>' + (star()[x.id] ? '<button type="button" class="btn star on" data-star="' + x.id + '" title="학교 업무판의 자주 보는 문서에서 빼기" aria-pressed="true">★</button>' : '<button type="button" class="btn star" data-star="' + x.id + '" title="학교 업무판의 자주 보는 문서에 넣기 (학교 배치도·교육계획서·규정집 등)" aria-pressed="false">☆</button>') + (isPdf(x.name) ? '<button type="button" class="btn" data-view="' + x.id + '">👁 보기</button>' : "") + '<button type="button" class="btn" data-get="' + x.id + '">⬇ 내려받기</button>' + (my[x.id] || admin ? '<button type="button" class="btn" data-del="' + x.id + '" title="' + (my[x.id] ? "내가 올린 자료" : "관리자") + '">🗑</button>' : "") + "</div>";
    }).join("") + "</div>" : '<div class="empty"><div class="big">🔎</div><div><b>' + (items.length ? "이 갈래에 자료가 없습니다." : "아직 올라온 자료가 없습니다.") + '</b><br>규정집, 교육계획서, 생활기록부 기재요령, 자주 쓰는 서식처럼<br>구성원이 가끔 찾아보는 자료를 올려 주세요. PDF·HWPX·워드·엑셀은 내용까지 찾을 수 있어요.</div><button type="button" class="btn primary" id="up2">＋ 자료 올리기</button></div>';
    var u2 = $("up2"); if(u2) u2.onclick = upload;
    $("info").textContent = "자료 " + items.filter(function(x){ return x.latest; }).length + "개 (보관 " + items.filter(function(x){ return !x.latest; }).length + ") · 누구나 올리고 내려받습니다";
  }
  /* v2.3: ★ = 학교 업무판(apps/school)의 '자주 보는 문서' — tt_lib_star_v1 {id: {t: 제목, at}} · 전체 백업에 들어감 */
  function star(){ return (TT.store.get("tt_lib_star_v1", null) || {}).ids || {}; }
  function toggleStar(id){
    var o = TT.store.get("tt_lib_star_v1", null) || {}; o.ids = o.ids || {};
    var x = items.filter(function(i){ return i.id === id; })[0] || {};
    if(o.ids[id]) delete o.ids[id]; else o.ids[id] = {t: x.title || x.name || "문서", at: Date.now()};
    TT.store.set("tt_lib_star_v1", o); drawList();
    TT.ui.toast(o.ids[id] ? "★ 학교 업무판의 자주 보는 문서에 넣었습니다." : "자주 보는 문서에서 뺐습니다.");
  }
  $("body").addEventListener("click", function(e){
    var sb = e.target.closest("[data-star]"); if(sb){ toggleStar(sb.dataset.star); return; }
    var v = e.target.closest("[data-view]"); if(v){ view(v.dataset.view, +v.dataset.page || 1, v); return; }
    var g = e.target.closest("[data-get]"); if(g){ download(g.dataset.get, g); return; }
    var d = e.target.closest("[data-del]"); if(d){ del(d.dataset.del); }
  });
  /* 받은 파일은 마지막 하나만 기억해 둡니다(보기 → 내려받기 때 다시 받지 않도록) */
  var last = null;
  /* 시트가 날짜를 'Fri Nov 13 2026 …'처럼 바꿔 버린 경우 2026-11-13 으로 */
  function day(s){ s = String(s || ""); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); var d = new Date(s); return isNaN(d) ? s : d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  /* ---------- 바로가기 링크 ----------
     apps/lib/?id=자료id&page=9&side=r     정확히 그 자료
     apps/lib/?find=2026 문제 -해설&page=9   자료 이름에 2026·문제가 있고 해설은 없는 최신 자료
     side=l / side=r : 두 단으로 된 쪽에서 왼쪽·오른쪽 단을 크게 */
  var opened = false;
  function openFromUrl(){
    if(opened) return; opened = true;
    var u = new URLSearchParams(location.search), id = u.get("id"), find = u.get("find"), page = parseInt(u.get("page"), 10) || 1, side = u.get("side"), qq = u.get("q");
    if(!id && !find){ if(qq){ $("q").value = qq; $("sf").requestSubmit ? $("sf").requestSubmit() : $("sf").onsubmit(new Event("submit")); } return; }   // v2.7: 왼쪽 검색창 "자료실에서 찾기"
    if(qq) DF.want = qq;                                                // v2.7: 쌤비 "○○에서 △△ 찾아 줘" → 그 문서를 열고 바로 찾기
    var x = id ? items.filter(function(i){ return i.id === id; })[0] : pick(find);
    if(!x){ TT.ui.toast("자료실에서 " + (find ? "'" + find + "'" : "그 자료") + "을(를) 찾지 못했습니다. 자료 이름에 연도와 '문제'·'해설'을 넣어 올려 주세요."); return; }
    if(!isPdf(x.name)){ TT.ui.toast("PDF가 아니라 바로 볼 수 없습니다. ⬇ 내려받기를 눌러 주세요."); return; }
    view(x.id, page, null, side);
  }
  function pick(find){
    var words = String(find).toLowerCase().split(/\s+/).filter(Boolean);
    var L = items.filter(function(x){
      var t = (x.title + " " + x.name).toLowerCase().replace(/\s+/g, "");
      return words.every(function(w){ return w[0] === "-" ? t.indexOf(w.slice(1)) < 0 : w.split("|").some(function(a){ return t.indexOf(a) >= 0; }); });
    });
    L.sort(function(a, b){ return (b.latest - a.latest) || (a.at < b.at ? 1 : -1); });
    return L[0];
  }
  function linkOf(id, page, side){
    var u = new URL(location.href); u.search = ""; u.hash = "";
    u.searchParams.set("id", id); if(page > 1) u.searchParams.set("page", page); if(side) u.searchParams.set("side", side);
    return u.href;
  }

  function isPdf(n){ return /\.pdf$/i.test(String(n || "")); }
  function fetchFile(id){
    if(last && last.id === id) return Promise.resolve(last);
    return post({action: "libget", id: id}).then(function(r){
      var bin = atob(r.data), u8 = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      last = {id: id, name: r.name, mime: r.mime, u8: u8}; return last;
    });
  }
  function saveFile(f){
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([f.u8], {type: f.mime || "application/octet-stream"})); a.download = f.name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  function download(id, btn){
    var t = btn.textContent; btn.textContent = "받는 중…"; btn.disabled = true;
    fetchFile(id).then(saveFile).catch(function(e){ TT.ui.toast("내려받지 못했습니다: " + err(e)); }).then(function(){ btn.textContent = t; btn.disabled = false; });
  }

  /* ---------- PDF 바로 보기 (이 기기에서 pdf.js로 그림 · 보이는 쪽 근처만 그려서 가볍게) ---------- */
  var PV = null;
  function pvBox(){
    if(PV) return PV;
    var d = document.createElement("dialog"); d.className = "pv";
    d.innerHTML = '<div class="pvh"><b id="pvT"></b><span class="pvf"><input id="pvQ" type="search" placeholder="이 문서에서 찾기 (Ctrl+F)" aria-label="이 문서에서 찾기" autocomplete="off"><span id="pvQc"></span><button type="button" class="btn" id="pvQp" title="이전 (Shift+Enter)">▲</button><button type="button" class="btn" id="pvQn" title="다음 (Enter)">▼</button><div id="pvQl" hidden></div></span><button type="button" class="btn" id="pvPrev" title="이전 쪽">▲</button><span class="pn"><input id="pvN" inputmode="numeric" aria-label="쪽 번호"> / <span id="pvC">0</span>쪽</span><button type="button" class="btn" id="pvNext" title="다음 쪽">▼</button>'
      + '<button type="button" class="btn" id="pvOut" title="작게">－</button><span class="pn" id="pvZ" style="min-width:44px">100%</span><button type="button" class="btn" id="pvIn" title="크게">＋</button><button type="button" class="btn" id="pvPage" title="한 쪽이 화면에 다 들어오게">한 쪽 맞춤</button><button type="button" class="btn" id="pvFit" title="화면 폭에 맞춰 크게">폭 맞춤</button>'
      + '<button type="button" class="btn" id="pvLink" title="지금 보는 쪽으로 바로 열리는 주소를 복사합니다(학교 업무판 비밀번호가 있는 선생님만 열림)">🔗 이 쪽 링크</button><button type="button" class="btn" id="pvDl">⬇ 내려받기</button><button type="button" class="btn primary" id="pvX">닫기 ✕</button></div><div class="pvb" id="pvB"></div>';
    document.body.appendChild(d);
    PV = {d: d, B: d.querySelector("#pvB"), doc: null, w: 0, h: 0, z: 1, fit: 1, wraps: [], io: null, task: 0};
    var q = function(s){ return d.querySelector(s); };
    q("#pvX").onclick = function(){ d.close(); };
    var Q = q("#pvQ");
    Q.addEventListener("input", function(){ clearTimeout(pfT); var v = Q.value; pfT = setTimeout(function(){ if(/^\d{1,4}$/.test(v.trim())) return; dfFind(v); }, 250); });
    Q.addEventListener("keydown", function(e){
      if(e.isComposing) return;
      if(e.key === "Escape" && Q.value){ e.preventDefault(); e.stopPropagation(); Q.value = ""; dfFind(""); return; }
      if(e.key !== "Enter") return; e.preventDefault(); clearTimeout(pfT);
      var v = Q.value.trim(); if(/^\d{1,4}$/.test(v)){ go(+v); return; }
      if(v.replace(/\s+/g, "").toLowerCase() !== DF.q){ dfFind(v); return; }
      if(DF.hits.length) dfJump(DF.i + (e.shiftKey ? -1 : 1));
    });
    q("#pvQp").onclick = function(){ if(DF.hits.length) dfJump(DF.i - 1); };
    q("#pvQn").onclick = function(){ if(DF.hits.length) dfJump(DF.i + 1); };
    q("#pvQl").addEventListener("click", function(e){ var b = e.target.closest("[data-pr]"), L = q("#pvQl")._rows; if(b && L && L[+b.dataset.pr]) L[+b.dataset.pr].go(); });
    d.addEventListener("keydown", function(e){
      if((e.ctrlKey || e.metaKey) && !e.altKey && (e.code === "KeyF" || e.key === "f" || e.key === "F")){
        e.preventDefault();
        if(window.top !== window){ try{ parent.TT_SBAR && parent.TT_SBAR.focusSearch(""); }catch(x){} } else { Q.focus(); Q.select(); }
      }
    });
    d.addEventListener("close", function(){ DF.task++; DF.q = ""; DF.hits = []; DF.pages = []; DF.doc = null; if(window.top === window){ Q.value = ""; pfShow({n: null, rows: []}); } else { try{ parent.TT_DOCFIND_READY && parent.TT_DOCFIND_READY(null); }catch(x){} } if(PV.io) PV.io.disconnect(); if(PV.lt){ try{ PV.lt.destroy(); }catch(e){} PV.lt = null; } PV.doc = null; PV.B.textContent = ""; PV.task++; });
    q("#pvIn").onclick = function(){ zoom(Math.min(4, PV.z * 1.2)); };
    q("#pvOut").onclick = function(){ zoom(Math.max(0.3, PV.z / 1.2)); };
    q("#pvPage").onclick = function(){ zoom(1); };
    q("#pvFit").onclick = function(){ zoom(fitW() / PV.fit); };
    q("#pvDl").onclick = function(){ if(last) saveFile(last); };
    q("#pvLink").onclick = function(){
      if(!last) return;
      var side = PV.B.scrollWidth > PV.B.clientWidth + 20 ? (PV.B.scrollLeft > (PV.B.scrollWidth - PV.B.clientWidth) / 2 ? "r" : "l") : "";
      var url = linkOf(last.id, curPage(), side);
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function(){ TT.ui.toast("링크를 복사했습니다 (" + curPage() + "쪽" + (side ? (side === "r" ? " 오른쪽 단" : " 왼쪽 단") : "") + ")"); }, function(){ TT.ui.prompt("이 주소를 복사하세요", url, "", function(){}); });
    };
    q("#pvPrev").onclick = function(){ go(curPage() - 1); };
    q("#pvNext").onclick = function(){ go(curPage() + 1); };
    q("#pvN").onchange = function(){ go(parseInt(this.value, 10) || 1); };
    PV.B.addEventListener("scroll", function(){ q("#pvN").value = curPage(); }, {passive: true});
    d.addEventListener("keydown", function(e){
      if(e.target.id === "pvN" || e.target.id === "pvQ") return;
      if(e.key === "PageDown" || e.key === "ArrowRight"){ e.preventDefault(); go(curPage() + 1); }
      else if(e.key === "PageUp" || e.key === "ArrowLeft"){ e.preventDefault(); go(curPage() - 1); }
      else if((e.key === "+" || e.key === "=") && e.ctrlKey){ e.preventDefault(); q("#pvIn").click(); }
      else if(e.key === "-" && e.ctrlKey){ e.preventDefault(); q("#pvOut").click(); }
    });
    return PV;
  }
  function fitW(){ return Math.max(0.3, (PV.B.clientWidth - 32) / PV.w); }
  function fitP(){ return Math.min(fitW(), Math.max(0.3, (PV.B.clientHeight - 24) / PV.h), 3); }   // 한 쪽이 다 보이게
  function curPage(){
    var t = PV.B.scrollTop + PV.B.clientHeight * 0.3, w = PV.wraps;
    for(var i = 0; i < w.length; i++) if(w[i].offsetTop + w[i].offsetHeight > t) return i + 1;
    return w.length;
  }
  function go(n){ var w = PV.wraps; if(!w.length) return; n = Math.max(1, Math.min(w.length, n)); PV.B.scrollTop = w[n - 1].offsetTop - 12; PV.d.querySelector("#pvN").value = n; }
  function layout(){
    var s = PV.fit * PV.z, keep = curPage();
    PV.d.querySelector("#pvZ").textContent = Math.round(PV.z * 100) + "%";
    PV.wraps.forEach(function(w){ w.style.width = Math.round(PV.w * s) + "px"; w.style.height = Math.round((w._r || PV.h / PV.w) * PV.w * s) + "px"; if(w._s !== s){ w.classList.remove("done"); w.textContent = ""; w._s = 0; } });
    if(PV.io){ PV.io.disconnect(); PV.wraps.forEach(function(w){ PV.io.observe(w); }); }
    return keep;
  }
  function zoom(z){ var keep = curPage(); PV.z = z; layout(); go(keep); }
  function draw(w){
    var s = PV.fit * PV.z, task = PV.task; if(w._s === s || w._busy) return;
    w._busy = true;
    PV.doc.getPage(+w.dataset.n).then(function(page){
      if(task !== PV.task) return;
      var vp1 = page.getViewport({scale: 1}); w._r = vp1.height / vp1.width;
      w.style.height = Math.round(w._r * PV.w * s) + "px";
      var dpr = Math.min(2, window.devicePixelRatio || 1), vp = page.getViewport({scale: (PV.w * s / vp1.width) * dpr});
      var c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      return page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise.then(function(){
        if(task !== PV.task || s !== PV.fit * PV.z) return;
        w.textContent = ""; w.appendChild(c); w.classList.add("done"); w._s = s; dfPaint(w);
      });
    }).catch(function(){}).then(function(){ w._busy = false; });
  }
  function view(id, page, btn, side){
    var x = items.filter(function(i){ return i.id === id; })[0] || {}, P = pvBox(), task = ++P.task;
    P.d.querySelector("#pvT").textContent = "📕 " + (x.title || "자료");
    P.d.querySelector("#pvC").textContent = x.pages || "…"; P.d.querySelector("#pvN").value = "";
    P.B.innerHTML = '<div class="pvmsg">⏳ 자료를 받는 중…</div>'; P.wraps = []; P.z = 1;
    if(!P.d.open) P.d.showModal();
    fetchFile(id).then(async function(f){
      if(task !== P.task) return;
      P.B.innerHTML = '<div class="pvmsg">⏳ 쪽을 준비하는 중…</div>';
      var base = new URL("../../shared/vendor/pdfjs/", location.href).href;
      var pdfjs = await import(base + "pdf.min.mjs"); pdfjs.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.mjs";
      var lt = pdfjs.getDocument({data: f.u8.slice(), cMapUrl: base + "cmaps/", cMapPacked: true, isEvalSupported: false}), doc = await lt.promise;
      if(task !== P.task){ try{ lt.destroy(); }catch(e){} return; }
      P.doc = doc; P.lt = lt;
      var p1 = (await doc.getPage(1)).getViewport({scale: 1});
      P.w = p1.width; P.h = p1.height;
      P.fit = fitP();
      P.B.textContent = "";
      for(var i = 1; i <= doc.numPages; i++){ var w = document.createElement("div"); w.className = "pvp"; w.dataset.n = i; P.B.appendChild(w); P.wraps.push(w); }
      P.d.querySelector("#pvC").textContent = doc.numPages;
      P.io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) draw(e.target); }); }, {root: P.B, rootMargin: "1200px 0px"});
      if(side === "l" || side === "r"){ P.z = Math.max(1, (Math.min(P.B.clientWidth - 32, 820) / (P.w * 0.52)) / P.fit); layout(); }   // 한 단이 화면 폭에 차게
      else layout();
      go(page || 1);
      if(side === "r") P.B.scrollLeft = P.B.scrollWidth; else P.B.scrollLeft = 0;
      P.side = side || "";
      dfReady();
    }).catch(function(e){
      if(task !== P.task) return;
      P.B.innerHTML = '<div class="pvmsg">⚠️ 열지 못했습니다: ' + esc(err(e)) + "<br><br>⬇ 내려받기로 받아서 열어 보세요.</div>";
    });
  }
  window.addEventListener("resize", function(){ if(PV && PV.d.open && PV.doc){ var k = curPage(); PV.fit = fitP(); layout(); go(k); } });

  /* ---------- v2.7 문서 안 찾기 (PDF 찾기처럼) ----------
     학교 업무판 안에 열렸을 때는 왼쪽 쌤비 아래 검색창이, 자료실에서 바로 열었을 때는 보기 창 위쪽 찾기 칸이 씁니다.
     쪽마다 글자를 이 기기에서 읽어(pdf.js getTextContent) 찾은 자리를 노랗게 칠합니다. 띄어쓰기는 무시하고 찾습니다. */
  var DF = {q: "", raw: "", hits: [], i: -1, pages: [], doc: null, task: 0, done: 0, want: ""};
  function dfReset(){ DF.pages = []; DF.doc = PV && PV.doc; DF.done = 0; DF.hits = []; DF.i = -1; }
  async function dfIndex(n){                                             // n쪽 글자와 자리 읽기
    var page = await PV.doc.getPage(n), vp = page.getViewport({scale: 1}), tc = await page.getTextContent();
    var its = [], str = "", map = [], raw = "", rawAt = [];
    tc.items.forEach(function(it){
      var s = it.str || ""; if(!s && !it.hasEOL) return;
      var k = its.length, t = it.transform || [1, 0, 0, 1, 0, 0], h = Math.hypot(t[2], t[3]) || it.height || 10;
      its.push({s: s, x: t[4], y: t[5], w: it.width || 0, h: h});
      for(var c = 0; c < s.length; c++){ raw += s.charAt(c); if(/\s/.test(s.charAt(c))) continue; str += s.charAt(c).toLowerCase(); map.push([k, c]); rawAt.push(raw.length - 1); }
      if(it.hasEOL) raw += " ";
    });
    return {n: n, vp: vp, its: its, str: str, map: map, raw: raw, rawAt: rawAt};
  }
  function dfScan(P){
    if(!DF.q) return;
    var at = -1;
    while((at = P.str.indexOf(DF.q, at + 1)) >= 0) DF.hits.push({p: P.n, a: at, b: at + DF.q.length});
  }
  function dfSnip(h){
    var P = DF.pages[h.p], r0 = P.rawAt[h.a], r1 = P.rawAt[h.b - 1] + 1, s = Math.max(0, r0 - 18), e = Math.min(P.raw.length, r1 + 28);
    return (s > 0 ? "…" : "") + esc(P.raw.slice(s, r0)) + "<mark>" + esc(P.raw.slice(r0, r1)) + "</mark>" + esc(P.raw.slice(r1, e)) + (e < P.raw.length ? "…" : "");
  }
  function dfRects(h){                                                   // 찾은 글자 자리 → 쪽 안 % 네모들
    var P = DF.pages[h.p], seg = {}, out = [];
    for(var c = h.a; c < h.b; c++){ var m = P.map[c], g = seg[m[0]] || (seg[m[0]] = [m[1], m[1]]); g[0] = Math.min(g[0], m[1]); g[1] = Math.max(g[1], m[1]); }
    Object.keys(seg).forEach(function(k){
      var it = P.its[k], L = Math.max(1, it.s.length), x0 = it.x + it.w * seg[k][0] / L, x1 = it.x + it.w * (seg[k][1] + 1) / L;
      var a = P.vp.convertToViewportPoint(x0, it.y - it.h * 0.25), b = P.vp.convertToViewportPoint(x1, it.y + it.h * 0.95);
      out.push({l: Math.min(a[0], b[0]) / P.vp.width * 100, t: Math.min(a[1], b[1]) / P.vp.height * 100, w: Math.abs(b[0] - a[0]) / P.vp.width * 100, h: Math.abs(b[1] - a[1]) / P.vp.height * 100});
    });
    return out;
  }
  function dfPaint(w){
    if(!w) return;
    Array.prototype.forEach.call(w.querySelectorAll(".dfm"), function(x){ x.remove(); });
    if(!DF.q || !DF.hits.length || !w.classList.contains("done")) return;
    var n = +w.dataset.n, cur = DF.hits[DF.i];
    DF.hits.forEach(function(h){
      if(h.p !== n) return;
      dfRects(h).forEach(function(r){ var m = document.createElement("i"); m.className = "dfm" + (h === cur ? " cur" : ""); m.style.cssText = "left:" + r.l + "%;top:" + r.t + "%;width:" + r.w + "%;height:" + r.h + "%"; w.appendChild(m); });
    });
  }
  function dfPaintAll(){ if(PV) PV.wraps.forEach(function(w){ if(w.classList.contains("done")) dfPaint(w); }); }
  function dfEmit(){
    var busy = !!DF.q && DF.done < (PV && PV.doc ? PV.doc.numPages : 0), seen = {}, rows = [];
    DF.hits.forEach(function(h, k){ if(seen[h.p] || rows.length >= 40) return; seen[h.p] = 1;
      var c = DF.hits.filter(function(x){ return x.p === h.p; }).length;
      rows.push({ic: "📄", tx: h.p + "쪽" + (c > 1 ? " <small>" + c + "곳</small>" : ""), sub: dfSnip(h), go: function(){ dfJump(k); }}); });
    if(DF.q && !busy) rows.push({ic: "🗂️", tx: "다른 자료에서도 찾기", sub: "규정집 · 교육계획서 등 자료실 전체", go: function(){ dfOthers(DF.raw); }});
    var r = {n: DF.q ? DF.hits.length : null, i: DF.i >= 0 ? DF.i + 1 : 0, busy: busy, rows: DF.q ? rows : [], note: DF.q && !busy && !DF.hits.length ? "이 문서에는 '" + esc(DF.raw) + "'이(가) 없어요" : ""};
    if(window.top !== window){ try{ if(parent.TT_DOCFIND_EMIT) parent.TT_DOCFIND_EMIT(r); }catch(e){} }
    else pfShow(r);
  }
  function dfJump(k){
    if(!DF.hits.length) return;
    var old = DF.hits[DF.i]; DF.i = (k + DF.hits.length) % DF.hits.length; var h = DF.hits[DF.i], w = PV.wraps[h.p - 1]; if(!w) return;
    var r = dfRects(h)[0] || {t: 0, l: 0};
    PV.B.scrollTop = w.offsetTop + w.offsetHeight * r.t / 100 - PV.B.clientHeight * 0.35;
    if(PV.B.scrollWidth > PV.B.clientWidth + 4) PV.B.scrollLeft = w.offsetLeft + w.offsetWidth * r.l / 100 - PV.B.clientWidth / 2;
    PV.d.querySelector("#pvN").value = h.p;
    if(old && old.p !== h.p) dfPaint(PV.wraps[old.p - 1]);
    dfPaint(w); dfEmit();
  }
  async function dfFind(q){
    q = String(q || ""); var nq = q.replace(/\s+/g, "").toLowerCase(), task = ++DF.task;
    if(!PV || !PV.doc){ DF.want = q; return; }
    if(DF.doc !== PV.doc) dfReset();
    DF.raw = q.trim(); DF.q = nq; DF.hits = []; DF.i = -1;
    if(!nq){ dfPaintAll(); dfEmit(); return; }
    var N = PV.doc.numPages, from = curPage(), jumped = false;
    function firstJump(){ if(jumped || !DF.hits.length) return; var k = DF.hits.findIndex(function(h){ return h.p >= from; }); if(k < 0 && DF.done >= N) k = 0; if(k >= 0){ jumped = true; dfJump(k); } }
    DF.pages.forEach(function(P){ if(P){ P.st = task; dfScan(P); } });
    DF.hits.sort(function(a, b){ return a.p - b.p || a.a - b.a; });
    firstJump(); dfPaintAll(); dfEmit();
    for(var n = 1; n <= N; n++){
      if(DF.pages[n]){ if(DF.pages[n].st !== task){ DF.pages[n].st = task; dfScan(DF.pages[n]); } continue; }
      var P1; try{ P1 = await dfIndex(n); }catch(e){ P1 = {n: n, str: "", map: [], raw: "", rawAt: [], its: []}; }
      if(!PV.doc || DF.doc !== PV.doc) return;
      if(!DF.pages[n]){ DF.pages[n] = P1; DF.done++; }
