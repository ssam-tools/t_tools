<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style id="ttKeepAll">html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}  .pkbig{position:fixed;inset:0;z-index:900;background:rgba(10,15,25,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer}
  .pkbig small{font-size:18px;opacity:.85}.pkbig b{font-size:min(38vw,200px);line-height:1;font-weight:900}.pkbig span{font-size:14px;opacity:.7;margin-top:10px}
</style>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://open.neis.go.kr https://api.open-meteo.com https://air-quality-api.open-meteo.com; form-action 'none'; base-uri 'none'">
<!-- v2.38.1 빠르게 열기: 화면 파일을 처음부터 한꺼번에 받아 둠 (아래 <script src>를 바꾸면 여기도 같이) -->
<link rel="preload" as="script" href="../../shared/early.js">
<link rel="preload" as="script" href="../../shared/tools.js">

<link rel="stylesheet" href="../../shared/tt.css">
<title>수업 리모컨 · 쌤 노트</title>
<!--
  수업 리모컨 (PLAN_수업 4단계): 휴대폰으로 교실 컴퓨터(전자칠판)의 교과서 띄우기를 조종합니다.
  · 휴대폰 = 내 기기로 보관함 연결 · 교실 컴퓨터 = 같은 ID로 보관함을 열고 교과서 띄우기 수업 모드
  · 명령은 보관함의 잠근 글자 한 칸(tt_remote_v1)으로, 교실 화면 상태는 tt_rstate_v1 로 주고받음 (학생 이름은 보내지 않음)
  · 처음 연결만 업무판을 거치고, 그다음은 휴대폰↔교실 화면 직접 연결(WebRTC)로 바로 바뀝니다. 직접 연결이 안 되는 망이면 업무판을 거칩니다.
-->
<style>
  body{overflow:auto;height:auto!important;min-height:100dvh}
  main.rm{overflow:visible!important;flex:none!important}
  main.rm{display:flex!important;flex-direction:column;gap:10px;padding:12px!important;max-width:560px;margin:0 auto;width:100%}
  .now{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px}
  .now .k{font-size:13px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:6px}
  .now .k i{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}.now .k i.on{background:#2d8a5b}.now .k i.err{background:#c2432a}.now .k i.rtc{background:#2d8a5b;box-shadow:0 0 0 3px #bfe6cf}
  .now .t{font-size:22px;font-weight:900;margin-top:2px;word-break:keep-all}
  .now .s{font-size:14px;color:var(--sub)}
  .pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pg button{height:min(22vh,150px);font-size:44px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .rm button{font:inherit;font-weight:800;font-size:17px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:56px;cursor:pointer;touch-action:manipulation}
  .rm button:active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .rm button.p{background:var(--accent);border-color:var(--accent);color:#fff}
  .rm button small{display:block;font-size:11px;font-weight:600;opacity:.75}
  .rm h2{font-size:13px;color:var(--sub);margin:4px 2px -2px;font-weight:700}
  .gl{display:flex;gap:8px}.gl input{flex:1;min-width:0;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px}
  .cls{display:flex;gap:6px;flex-wrap:wrap}.cls button{min-height:44px;padding:0 14px;font-size:15px}
  .msg{border-radius:14px;background:var(--danger-soft,#fdeceb);color:var(--danger,#b3261e);padding:12px 14px;font-size:15px;line-height:1.6}
  .msg a{color:inherit;font-weight:800}
  .sent{font-size:13px;color:var(--sub);text-align:center;min-height:18px}
  .colA,.colB{display:flex;flex-direction:column;gap:10px;min-width:0}
  /* v2.8.1: PC(넓은 화면)에서는 두 칸으로 나눠 스크롤 없이 한 화면에 — 휴대폰은 그대로 한 줄 */
  @media (min-width:900px){
    main.rm{max-width:1080px;display:grid!important;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:10px;align-items:start}
    main.rm > #warn,main.rm > .sent{grid-column:1 / -1}
    .pg button{height:min(18vh,130px);font-size:38px}
    .rm button{min-height:48px}
    .msg{padding:9px 12px;font-size:14px;line-height:1.5}
  }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../">← 쌤 노트</a>
    <h1>📱 수업 리모컨</h1>
  </div>
</header>
<main class="panel rm" id="m">
  <div id="warn"></div>
  <div class="colA">
  <div class="now"><div class="k"><i id="dot"></i><span id="kk">교실 화면 찾는 중…</span></div><div class="t" id="nt">—</div><div class="s" id="ns"></div></div>
  <div class="pg"><button data-a="prev" aria-label="앞쪽">◀</button><button data-a="next" class="p" aria-label="뒤쪽">▶</button></div>
  <div class="g4"><button data-a="zo">－<small>작게</small></button><button data-a="zi">＋<small>크게</small></button><button data-a="pen">✏️<small>판서</small></button><button data-a="pick">🎲<small>번호 뽑기</small></button></div>
  </div><div class="colB">
  <h2>수업 단계</h2>
  <div class="g4"><button data-a="mode" data-m="1">①<small>교과서</small></button><button data-a="mode" data-m="2">②<small>개념</small></button><button data-a="mode" data-m="3">③<small>문제</small></button><button data-a="mode" data-m="4">④<small>도전</small></button></div>
  <h2>타이머</h2>
  <div class="g3"><button data-a="timer" data-m="1">1분</button><button data-a="timer" data-m="3">3분</button><button data-a="timer" data-m="5">5분</button></div>
  <h2>🎯 오늘 목표</h2>
  <div class="gl"><input id="gT" maxlength="80" placeholder="목표 한 줄 (비우면 띄우기/숨기기만)"><button id="gB" class="p" style="padding:0 16px">띄우기</button></div>
  <h2>반 바꾸기 · 쪽으로 가기</h2>
  <div class="cls" id="cls"></div>
  <div class="gl"><input id="pT" inputmode="numeric" placeholder="교과서 쪽 번호"><button id="pB" style="padding:0 16px">가기</button><button id="rB" style="padding:0 16px" title="학생 활동 한 줄 기록">✍️ 기록</button></div>
  </div>
  <div class="sent" id="sent"></div>
  <p class="sent">🔒 명령은 내 보관함 비밀 문구로 잠가 주고받습니다 · 학생 이름은 보내지 않습니다<br>교실 컴퓨터: 같은 ID로 보관함 열기 → 교과서 수업 모드</p>
</main>
<script src="../../shared/tools.js"></script>
<script src="../../shared/tt.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var Q = [], sending = false, again = false, sv = 0, last = null, fails = 0;
  function V(){ return window.TT_VAULT ? window.TT_VAULT() : new Promise(function(res, rej){ var n = 0, t = setInterval(function(){ if(window.TT_VAULT){ clearInterval(t); res(window.TT_VAULT()); } else if(++n > 50){ clearInterval(t); rej(new Error("보관함을 불러오지 못했어요")); } }, 100); }); }
  function warn(h){ $("warn").innerHTML = h ? '<div class="msg">' + h + "</div>" : ""; }
  function check(){
    return V().then(function(v){ var s = v.status(); if(s.mode !== "personal" || !s.id){ warn("이 휴대폰을 <b>내 기기</b>로 보관함에 연결해야 리모컨을 쓸 수 있어요.<br>쌤 노트 <a href=\"../../#settings\">⚙️ 설정 → 기기 연결·동기화</a>에서 연결하고, 교실 컴퓨터는 같은 ID로 <b>교실 기기</b> 보관함을 열어 주세요."); return false; } warn(""); return true; });
  }
  /* v2.11.0 직접 연결(WebRTC): 연결 요청·답만 보관함(잠근 글자)으로, 그다음 명령·화면 상태는 기기끼리 바로 */
  var ICE = {iceServers: [{urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"]}]};
  var RTC = {pc: null, dc: null, id: "", done: false, tries: 0, t: null};
  function rtcOpen(){ return RTC.dc && RTC.dc.readyState === "open"; }
  function iceDone(pc){ return new Promise(function(res){ if(pc.iceGatheringState === "complete") return res(); var t = setTimeout(res, 2500); pc.addEventListener("icegatheringstatechange", function(){ if(pc.iceGatheringState === "complete"){ clearTimeout(t); res(); } }); }); }
  function rtcStart(){
    if(!window.RTCPeerConnection || document.hidden) return;
    clearTimeout(RTC.t); try{ if(RTC.pc) RTC.pc.close(); }catch(e){}
    var pc = new RTCPeerConnection(ICE), dc = pc.createDataChannel("rm", {ordered: true});
    var me = {pc: pc, dc: dc, id: Math.random().toString(36).slice(2, 10), done: false, tries: RTC.tries + 1, t: null}; RTC = me;
    dc.onopen = function(){ if(RTC !== me) return; RTC.tries = 0; link(); try{ dc.send(JSON.stringify({ping: 1})); }catch(e){} };
    dc.onclose = function(){ if(RTC !== me) return; link(); RTC.t = setTimeout(rtcStart, 2000); };
    dc.onmessage = function(e){ var m; try{ m = JSON.parse(e.data); }catch(er){ return; } if(m && m.st){ last = m.st; drawCls(); paint(); } };
    pc.createOffer().then(function(o){ return pc.setLocalDescription(o); }).then(function(){ return iceDone(pc); })
      .then(function(){ if(RTC === me) send({a: "rtc", id: me.id, sdp: pc.localDescription.sdp}, true); }).catch(function(){});
    /* 20초 안에 안 이어지면 다시 (세 번 넘게 안 되면 1분마다) */
    me.t = setTimeout(function(){ if(RTC === me && !rtcOpen()) rtcStart(); }, me.tries > 3 ? 60000 : 20000);
  }
  function rtcAnswer(o){
    if(!o || !o.rtc || !RTC.pc || RTC.done || o.rtc.id !== RTC.id) return;
    RTC.done = true; RTC.pc.setRemoteDescription({type: "answer", sdp: String(o.rtc.sdp)}).catch(function(){ RTC.done = false; });
  }
  function link(){ var d = $("dot"); if(d && rtcOpen()) d.className = "rtc"; paint(); }
  function send(cmd, viaVault){
    var now = Date.now(); cmd.s = Math.max(now, (Q.length ? Q[Q.length - 1].s + 1 : 0)); cmd.t = now;
    if(!viaVault && rtcOpen()){ try{ RTC.dc.send(JSON.stringify(cmd)); $("sent").textContent = "⚡ 바로 보냄"; if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){} return; }catch(e){} }
    Q.push(cmd); Q = Q.filter(function(x){ return now - x.t < 60000 && (x.a !== "rtc" || x.id === RTC.id); }).slice(-10);
    if(cmd.a === "rtc"){ flush(); return; }
    $("sent").textContent = "보내는 중…"; flush();
    if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
  }
  function flush(){
    if(sending){ again = true; return; }
    sending = true; again = false;
    V().then(function(v){ return v.rsend("tt_remote_v1", {q: Q}); }).then(function(r){
      sending = false;
      $("sent").textContent = r && r.ok ? "보냄 ✓ · 교실 화면에 곧 바뀌어요" : "보내지 못했어요: " + ((r && r.error) || "");
      if(again) flush();
    }, function(e){ sending = false; $("sent").textContent = "보내지 못했어요: " + (e && e.message || e); });
  }
  /* v2.10.5: 번호 뽑기는 휴대폰에서 바로 뽑아 크게 보여 주고, 뽑은 번호를 교실 화면에 보냄 (교실 기기에 명렬표가 없어도 됨) */
  var lastPick = 0;
  window.TT_ON_CHANGED = function(){ drawCls(); };   /* 교실 화면이 진도를 저장해도 이 화면은 다시 불러오지 않음 */
  function nosOf(c){
    var N = [];
    try{ var Jo = TT.store.get("tt_journal_v1", null), js = Jo && Jo.students && Jo.students[c]; if(js && js.length) N = js.map(function(x){ return +x.no; }); }catch(e){}
    if(!N.length) try{ var R = TT.roster.classes().filter(function(x){ return x.grade * 100 + x.cls === c; })[0]; if(R) N = R.students.map(function(x){ return +x.no; }); }catch(e){}
    N = N.filter(function(n){ return n > 0; });
    if(!N.length && last && +last.c === c && +last.n > 0) for(var i = 1; i <= +last.n; i++) N.push(i);
    if(!N.length){   /* 명렬표가 없는 반: 학생 수만 한 번 물어 이 휴대폰에 기억 */
      var M = {}; try{ M = JSON.parse(localStorage.getItem("ttrm_count") || "{}"); }catch(e){}
      var k = +M[c] || 0;
      if(!k){ k = parseInt(prompt(Math.floor(c / 100) + "-" + (c % 100) + "반 명렬표가 없어요. 학생 수를 넣어 주세요 (한 번만)", "28"), 10) || 0; if(k > 0 && k < 60){ M[c] = k; try{ localStorage.setItem("ttrm_count", JSON.stringify(M)); }catch(e){} } }
      for(var j = 1; j <= k && j < 60; j++) N.push(j);
    }
    return N;
  }
  function pickNo(){
    var c = last && +last.c; if(!c) return 0;
    var N = nosOf(c); if(!N.length) return 0;
    if(N.length > 1) N = N.filter(function(n){ return n !== lastPick; });
    return (lastPick = N[Math.floor(Math.random() * N.length)]);
  }
  function pickShow(n){
    var o = document.createElement("div"); o.className = "pkbig";
    o.innerHTML = "<small>🎲 오늘의 주인공</small><b>" + n + "번</b><span>교실 화면에도 띄웠어요 · 누르면 닫힘</span>";
    o.onclick = function(){ o.remove(); }; document.body.appendChild(o); setTimeout(function(){ o.remove(); }, 5000);
  }
  [].forEach.call(document.querySelectorAll("[data-a]"), function(b){ b.onclick = function(){
    var c = {a: b.dataset.a}; if(b.dataset.m) c.m = +b.dataset.m;
    if(c.a === "pick"){ var n = pickNo(); if(!n){ $("sent").textContent = last && last.c ? "학생 수를 몰라 번호를 뽑지 못했어요" : "반을 먼저 골라 주세요 (아래 반 단추)"; return; } c.n = n; pickShow(n); }
    send(c);
  }; });
  $("gB").onclick = function(){ var t = $("gT").value.trim(); send(t ? {a: "goal", t: t, on: true} : {a: "goal"}); $("gT").value = ""; };
  $("pB").onclick = function(){ var p = parseInt($("pT").value, 10); if(p > 0) send({a: "page", p: p}); $("pT").value = ""; };
  $("rB").onclick = function(){ if(last && last.c && TT.notes && TT.notes.quick){ var R = (TT.roster.classes() || []).filter(function(x){ return x.grade * 100 + x.cls === +last.c; })[0]; TT.notes.quick(R ? {cls: R.id, src: "수업 리모컨"} : {src: "수업 리모컨"}); } else if(TT.notes && TT.notes.quick) TT.notes.quick({src: "수업 리모컨"}); };
  function myClasses(){
    var o = {};
    try{ TT.roster.classes().forEach(function(c){ if(c.grade != null && c.cls != null && c.students && c.students.length) o[c.grade * 100 + c.cls] = 1; }); }catch(e){}
    try{ var T = TT.timetable.load(); if(T) Object.keys(T.slots).forEach(function(k){ var c = +T.slots[k].cls; if(c > 100) o[c] = 1; }); }catch(e){}
    return Object.keys(o).map(Number).sort(function(a, b){ return a - b; });
  }
  function drawCls(){
    var L = myClasses();
    $("cls").innerHTML = L.map(function(c){ return '<button data-c="' + c + '"' + (last && +last.c === c ? ' class="p"' : "") + ">" + Math.floor(c / 100) + "-" + (c % 100) + "</button>"; }).join("") || '<span class="muted" style="font-size:13px">명렬표나 내 시간표를 넣으면 반 단추가 나와요.</span>';
    [].forEach.call($("cls").querySelectorAll("button"), function(b){ b.onclick = function(){ send({a: "class", c: +b.dataset.c}); }; });
  }
  var MN = ["", "① 교과서", "② 개념 정리", "③ 교과서 문제", "④ 도전 문제"];
  function paint(){
    var fresh = last && (rtcOpen() || Date.now() - last.at < 20 * 60 * 1000);
    $("dot").className = rtcOpen() ? "rtc" : fresh ? "on" : "";
    $("kk").textContent = rtcOpen() ? "⚡ 교실 화면과 직접 연결됨 · 바로 반응" : fresh ? "교실 화면 · 업무판 거쳐 연결 (직접 연결 시도 중)" : "교실 화면을 아직 찾지 못했어요";
    $("nt").textContent = fresh ? (last.cn || "") + " · p." + last.p + (last.u ? " · " + last.u : "") : "교실 컴퓨터에서 교과서 수업 모드를 켜 주세요";
    $("ns").textContent = fresh ? (last.lesson ? MN[last.mode] || "" : "수업 모드 아님") + (last.goal ? " · 🎯 " + last.goal : "") : "같은 보관함 ID로 교실 기기 보관함을 열어야 해요";
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && RTC.pc && !rtcOpen()) rtcStart(); });
  function poll(){
    if(document.hidden){ setTimeout(poll, 4000); return; }
    V().then(function(v){ return v.rget("tt_rstate_v1", sv); }).then(function(r){
      if(r.off){ check(); setTimeout(poll, 8000); return; }
      if(r.error){ fails++; $("dot").className = "err"; setTimeout(poll, Math.min(15000, 3000 * fails)); return; }
      fails = 0;
      if(r.obj && r.ver > sv){ sv = r.ver; rtcAnswer(r.obj); if(!rtcOpen()){ last = r.obj; drawCls(); } }
      paint();
      if(last && Date.now() - last.at < 20 * 60 * 1000 && !RTC.pc) rtcStart();   /* 교실 화면을 찾으면 직접 연결 시도 */
      setTimeout(poll, rtcOpen() ? 6000 : RTC.pc && !RTC.done ? 700 : 1500);
    }).catch(function(){ setTimeout(poll, 10000); });
  }
  drawCls();
  check().then(function(ok){ poll(); }).catch(function(e){ warn(esc(e.message || e)); });
})();
</script>
</body>
</html>
