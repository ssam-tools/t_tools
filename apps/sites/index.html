<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style id="ttKeepAll">html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}</style>
<!-- 외부로 자료를 보내는 통로를 막습니다. 사이트 주소는 이 기기(및 내 보관함 동기화)에만 저장됩니다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/ssambi3-192.png">
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/tt.css">
<title>자주 가는 사이트 · 쌤 노트</title>
<!--
  🌐 자주 가는 사이트 (v2.11.5)
  · 갈래 3가지: 수업용(class) · 업무용(work) · 개인용(me). 저장 키 tt_sites_v1 = {v:1, items:[{id, t, u, c, pin}]}
  · 내 기기: 세 갈래 모두 보고 고침. 📌 고정한 것은 쌤비 홈 첫 화면에 단추로(shared/sbhome.js).
  · 교실 기기(여러 선생님이 쓰는 기기): 수업용만 보이고, 고치기·지우기 없음(추가·수정은 내 기기에서 → 동기화).
-->
<style>
  main{display:flex;flex-direction:column!important;gap:10px;padding:12px!important}
  .add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .add label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--sub)}
  .add input{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-sizing:border-box;color:var(--ink);background:var(--t-field,#fff)}
  .add .nm input{width:170px} .add .ur{flex:1;min-width:220px} .add .ur input{width:100%}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:var(--t-field,#fff);font:inherit;font-size:14px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff;font-weight:800}
  .pinck{display:flex;align-items:center;gap:4px;font-size:13.5px;padding-bottom:8px;white-space:nowrap}
  .err{color:var(--danger);font-size:13px;width:100%;min-height:0}
  .cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .col{background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .col h2{font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}
  .col h2 small{font-weight:400;color:var(--sub);font-size:12px}
  .list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .it{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:7px 8px;background:var(--t-field,#fff)}
  .it a.go{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
  .it .ic{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:16px;color:#fff;background:var(--accent)}
  .it .tx{min-width:0;display:flex;flex-direction:column}
  .it .tx b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .tx span{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .ac{flex:none;display:flex;gap:2px}
  .it .ac button{border:0;background:none;cursor:pointer;font-size:14px;padding:4px 5px;border-radius:8px;color:var(--sub)}
  .it .ac button:hover{background:var(--accent-soft)}
  .it .ac button.pin.on{color:var(--accent)}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 4px}
  .c-class .ic{background:#2f6fb5} .c-work .ic{background:#1f8a7a} .c-me .ic{background:#b5652f}
  body.room .add, body.room .col.c-work, body.room .col.c-me, body.room .it .ac{display:none}
  body.room .cols{grid-template-columns:1fr}
  body.room .col.c-class .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-content:start}
  @media (max-width:760px){ .cols{grid-template-columns:1fr} body{height:auto;min-height:100dvh;overflow:auto} .list{overflow:visible} .add .nm input{width:100%} .add .nm{flex:1} }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../">← 쌤 노트</a>
    <h1>🌐 자주 가는 사이트</h1>
  </div>
</header>
<main class="panel" id="m">
  <form class="add" id="f" autocomplete="off">
    <label class="nm">이름<input id="fT" maxlength="20" placeholder="예: 나이스"></label>
    <label class="ur">주소<input id="fU" inputmode="url" placeholder="https://… (복사해 붙여 넣기)"></label>
    <div class="seg" id="fC" role="group" aria-label="갈래"><button type="button" data-c="class" class="on">📚 수업용</button><button type="button" data-c="work">💼 업무용</button><button type="button" data-c="me">🙂 개인용</button></div>
    <label class="pinck"><input type="checkbox" id="fP" checked> 📌 첫 화면에</label>
    <button class="btn primary" id="fGo">＋ 넣기</button>
    <button class="btn" type="button" id="fX" hidden>취소</button>
    <div class="err" id="fE"></div>
  </form>
  <div class="cols" id="cols"></div>
</main>
<footer>
  <span id="ft">수업용은 교실 기기(전자칠판)에서도 보여요 · 업무용·개인용은 내 기기에서만</span>
  <span class="priv">🔒 주소는 이 기기와 내 보관함에만 저장 · 아이디·비밀번호가 든 주소는 넣지 마세요</span>
</footer>
<script src="../../shared/tt.js"></script>
<script src="../../g/sites.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "tt_sites_v1", ROOM = !!TT.classroom, $ = function(i){ return document.getElementById(i); };
  var CATS = [["class", "📚 수업용", "교실 기기에서도 보여요"], ["work", "💼 업무용", "내 기기에서만"], ["me", "🙂 개인용", "내 기기에서만"]];
  if(window.TT_SITES_SEED) TT_SITES_SEED();   // 우리 학교 공통 사이트(g/sites.js)를 처음 한 번 넣기
  var D = TT.store.get(KEY, null) || {v: 1, items: []}; D.items = D.items || [];
  var cat = "class", edit = null;
  if(ROOM){ document.body.classList.add("room"); $("ft").textContent = "교실 기기에서는 수업용 사이트만 보여요 · 넣기·고치기는 내 기기에서"; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function save(){ TT.store.set(KEY, D); }
  function norm(u){
    u = String(u || "").trim(); if(!u) return "";
    if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;
    try{ var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; }
  }
  function host(u){ try{ return new URL(u).hostname.replace(/^www\./, ""); }catch(e){ return u; } }
  function letter(t){ var s = String(t || "").trim(); return s ? Array.from(s)[0].toUpperCase() : "?"; }
  function draw(){
    $("cols").innerHTML = CATS.map(function(c){
      var L = D.items.filter(function(x){ return x.c === c[0]; });
      return '<section class="col c-' + c[0] + '"><h2>' + c[1] + " <small>" + L.length + "개 · " + c[2] + '</small></h2><div class="list">'
        + (L.length ? L.map(function(x){
            return '<div class="it"><a class="go" href="' + esc(x.u) + '" target="_blank" rel="noopener noreferrer" title="' + esc(x.u) + '"><span class="ic">' + esc(letter(x.t)) + '</span><span class="tx"><b>' + esc(x.t) + (x.sch ? ' <small title="학교에서 넣어 둔 공통 사이트">🏫</small>' : "") + "</b><span>" + esc(host(x.u)) + "</span></span></a>"
              + '<span class="ac"><button type="button" class="pin' + (x.pin ? " on" : "") + '" data-pin="' + x.id + '" title="' + (x.pin ? "첫 화면에서 빼기" : "첫 화면에 📌") + '" aria-label="첫 화면 고정">📌</button>'
              + '<button type="button" data-up="' + x.id + '" title="위로" aria-label="위로">▲</button><button type="button" data-ed="' + x.id + '" title="고치기" aria-label="고치기">✏️</button><button type="button" data-del="' + x.id + '" title="지우기" aria-label="지우기">🗑</button></span></div>';
          }).join("") : '<div class="empty">' + (ROOM ? "수업용 사이트가 없어요.<br>내 기기에서 넣으면 동기화 뒤 여기에 보여요." : "위에서 이름·주소를 넣고 갈래를 고르세요.") + "</div>")
        + "</div></section>";
    }).join("");
  }
  function setCat(c){ cat = c; [].forEach.call($("fC").querySelectorAll("button"), function(b){ b.classList.toggle("on", b.dataset.c === c); }); }
  function reset(){ edit = null; $("fT").value = ""; $("fU").value = ""; $("fP").checked = true; $("fGo").textContent = "＋ 넣기"; $("fX").hidden = true; $("fE").textContent = ""; }
  $("fC").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b) setCat(b.dataset.c); });
  $("fX").onclick = reset;
  $("fU").addEventListener("change", function(){ if(!$("fT").value.trim()){ var h = host(norm(this.value)); if(h) $("fT").value = h.split(".")[0]; } });
  $("f").addEventListener("submit", function(e){
    e.preventDefault(); if(ROOM) return;
    var t = $("fT").value.trim(), u = norm($("fU").value);
    if(!u){ $("fE").textContent = "주소를 확인해 주세요 (https:// 로 시작하는 웹 주소)"; $("fU").focus(); return; }
    if(!t) t = host(u);
    if(edit){ var x = D.items.filter(function(i){ return i.id === edit; })[0]; if(x){ x.t = t; x.u = u; x.c = cat; x.pin = $("fP").checked; } }
    else D.items.push({id: "s" + Date.now().toString(36), t: t, u: u, c: cat, pin: $("fP").checked});
    save(); reset(); draw(); $("fT").focus();
  });
  $("cols").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || ROOM) return;
    var id = b.dataset.pin || b.dataset.up || b.dataset.ed || b.dataset.del, i = -1;
    D.items.forEach(function(x, k){ if(x.id === id) i = k; }); if(i < 0) return;
    var x = D.items[i];
    if(b.dataset.pin){ x.pin = !x.pin; }
    else if(b.dataset.up){ for(var k = i - 1; k >= 0; k--) if(D.items[k].c === x.c){ D.items.splice(i, 1); D.items.splice(k, 0, x); break; } }
    else if(b.dataset.ed){ edit = id; $("fT").value = x.t; $("fU").value = x.u; $("fP").checked = !!x.pin; setCat(x.c); $("fGo").textContent = "✔ 고치기"; $("fX").hidden = false; $("fT").focus(); return; }
    else if(b.dataset.del){ if(b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "지울까요?"; return; } D.items.splice(i, 1); }
    save(); draw();
  });
  draw();
})();
</script>
</body>
</html>
