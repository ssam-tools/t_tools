const sd=a=>{a=a.filter(x=>typeof x==='number'&&!isNaN(x));if(a.length<2)return null;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)};

/* =============== 성적 파싱(NEIS 일람표) =============== */
function parseValue(v){
  v=String(v==null?'':v).trim();if(!v)return null;
  const m=v.match(/-?\d+(\.\d+)?/);
  if(m){const x=parseFloat(m[0]);return (x>=0&&x<=100)?x:null}
  const L=v.toUpperCase().match(/^[A-E]/);
  return L?GRADE_MAP[L[0]]:null;
}
function parseGrid(grid){
  const rows=grid.map(r=>r.map(c=>String(c==null?'':c).replace(/\s+/g,' ').trim()));
  const h=rows.findIndex(r=>r.some(c=>/^(성명|이름)$/.test(c.replace(/ /g,''))));

  const head=rows[h];
  const nameCol=head.findIndex(c=>/^(성명|이름)$/.test(c.replace(/ /g,'')));
  const noCol=head.findIndex(c=>/^(번호|학번)$/.test(c));
  const genCol=head.findIndex(c=>/^성별$/.test(c));
  const next=rows[h+1]||[];
  const hasSub=next.filter(c=>/원점수|성취도|점수|등급|석차/.test(c)).length>=2;
  const EXCL=/^(번호|학번|성명|이름|성별|합계|총점|평균|석차|등수|비고|학년|반|순위|생년월일|출결.*|결석.*|지각.*|조퇴.*|결과.*)$/;
  const cols={};let last='';
  for(let c=nameCol+1;c<head.length;c++){
    if(head[c])last=head[c];
    const label=head[c]||last;
    if(!label||EXCL.test(label))continue;
    let type='raw';
    if(hasSub){
      const s=next[c]||'';
      if(/성취도/.test(s))type='grade';
      else if(/원점수|점수/.test(s)&&!/평균|표준/.test(s))type='raw';
      else continue;
    }
    (cols[label]=cols[label]||{})[type]=c;
  }
  const subjects=Object.keys(cols);
  if(!subjects.length)return{error:'교과(과목) 열을 찾지 못했습니다.'};
  const start=h+1+(hasSub?1:0);
  const students=[];let seq=0;
  for(let r=start;r<rows.length;r++){
    const row=rows[r];
    const nm=row[nameCol]||'';
    if(!nm&&!row.some(c=>c))continue;
    if(row.slice(0,nameCol+1).some(c=>/^(평균|합계|계|전체|표준편차)/.test(c)))continue;
    seq++;
    const scores={};let cnt=0;
    for(const s of subjects){
      const c=cols[s];
      let v=c.raw!=null?parseValue(row[c.raw]):null;
      if(v==null&&c.grade!=null)v=parseValue(row[c.grade]);
      if(v!=null){scores[s]=v;cnt++}
    }
    if(!cnt)continue;
    let no=noCol>=0?parseInt(row[noCol],10):NaN;if(isNaN(no))no=seq;
    let gender='';if(genCol>=0){gender=/남/.test(row[genCol])?'남':/여/.test(row[genCol])?'여':''}
    students.push({no,name:nm,gender,scores});
  }
  if(!students.length)return{error:'학생 성적 행을 찾지 못했습니다.'};
  return{students,subjects};
}
function parseText(text){
  const lines=String(text).split(/\r?\n/).filter(l=>l.trim()!=='');
  const tab=lines.some(l=>l.includes('\t'));
  return lines.map(l=>{
    if(tab)return l.split('\t');
    const out=[];let cur='',q=false;
    for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}
    out.push(cur);return out;
  });
}
function applyImport(parsed,exam,cls,pickedSubjects){
  let added=0,updated=0;
  if(!S.exams.includes(exam))S.exams.push(exam);
  for(const p of parsed.students){
    let st=S.students.find(s=>String(s.cls)===String(cls)&&s.no===p.no);
    if(!st){st=newStudent(cls,p.no);S.students.push(st);added++}else updated++;
    if(p.name)st.name=S.maskNames?maskName(p.name):p.name;
    if(p.gender&&!st.gender)st.gender=p.gender;
    const sc={};for(const k of pickedSubjects)if(p.scores[k]!=null)sc[k]=p.scores[k];
    st.scores[exam]=Object.assign(st.scores[exam]||{},sc);
  }
  return{added,updated};
}
/* 학급 명렬표에 같은 반·번호가 있으면 그 이름 (학년은 우리 반의 학년, 없으면 3학년) */
function rosterName(cls,no){
  try{
    if(typeof TT==='undefined')return '';
    const d=TT.roster.load(),h=TT.roster.home(d),g=h&&h.grade!=null?h.grade:3;
    const c=d.classes.find(x=>x.grade===g&&x.cls===Number(cls)),s=c&&c.students.find(x=>x.no===Number(no));
    return s?(S.maskNames?maskName(s.name):s.name):'';
  }catch(e){return ''}
}
function newStudent(cls,no){return{id:uid(),cls:cls||1,no:no||1,name:rosterName(cls||1,no||1),gender:'',area:'',job:'',univ:'',trackSel:'auto',genderPref:'any',typePref:'any',dist:{},scores:{}}}

/* =============== 분석 =============== */
function slopeOf(ser){
  const pts=[];ser.forEach((v,i)=>{if(v!=null)pts.push([i,v])});
  if(pts.length<2)return null;
  const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1]));
  let nu=0,de=0;pts.forEach(([x,y])=>{nu+=(x-mx)*(y-my);de+=(x-mx)**2});
  return de?nu/de:null;
}
function examAvg(st,e){const sc=st.scores[e];if(!sc)return null;return mean(Object.entries(sc).filter(([k])=>included(k)).map(([,v])=>v))}
function subjectMeans(st){
  const out={};
  for(const e of sortedExams())for(const [k,v] of Object.entries(st.scores[e]||{}))if(included(k)&&typeof v==='number')(out[k]=out[k]||[]).push(v);
  const r={};for(const k in out)r[k]=mean(out[k]);return r;
}
function classStats(){
  const acc={};
  for(const st of S.students){const m=subjectMeans(st);for(const k in m)(acc[k]=acc[k]||[]).push(m[k])}
  const r={};for(const k in acc)r[k]={n:acc[k].length,mean:mean(acc[k]),sd:sd(acc[k])};return r;
}
function analyze(st,cs){
  cs=cs||classStats();
  const ex=sortedExams();
  const examAvgs=ex.map(e=>({exam:e,avg:examAvg(st,e)})).filter(x=>x.avg!=null);
  examAvgs.forEach((x,i)=>{x.delta=i?x.avg-examAvgs[i-1].avg:null});
  const subs=new Set();ex.forEach(e=>Object.keys(st.scores[e]||{}).forEach(k=>included(k)&&subs.add(k)));
  const own=mean(examAvgs.map(x=>x.avg));
  const list=[...subs].map(n=>{
    const ser=ex.map(e=>{const v=(st.scores[e]||{})[n];return typeof v==='number'?v:null});
    const vals=ser.filter(v=>v!=null);
    const m=mean(vals),slope=slopeOf(ser),c=cs[n];
    const z=(c&&c.sd>0&&c.n>=5)?(m-c.mean)/c.sd:null;
    const dev=own!=null?m-own:0;
    const idx=z!=null?0.5*dev/10+0.5*z:dev/10;
    return{name:n,group:groupOf(n),ser,mean:m,latest:vals[vals.length-1],slope,label:slope==null?'-':slope>=2?'상승':slope<=-2?'하락':'유지',dev,z,idx,n:vals.length};
  });
  const byIdx=[...list].sort((a,b)=>b.idx-a.idx);
  const k=list.length>=6?3:list.length>=4?2:1;
  const strengths=byIdx.slice(0,k);
  const weaknesses=[...byIdx].reverse().slice(0,k).filter(x=>!strengths.includes(x));
  let wsum=0,wtot=0;examAvgs.forEach((x,i)=>{wsum+=x.avg*(i+1);wtot+=i+1});
  const level=wtot?wsum/wtot:null;
  const gm=g=>mean(list.filter(x=>x.group===g).map(x=>x.mean));
  const sl=slopeOf(examAvgs.map(x=>x.avg));
  return{examAvgs,list,strengths,weaknesses,level,own,natAvg:gm('nat'),humAvg:gm('human'),slope:sl,
    trendLabel:sl==null?'-':sl>=2?'상승':sl<=-2?'하락':'유지'};
}
function levelPercentile(st){
  const lv=S.students.map(s=>analyze(s).level).filter(x=>x!=null);
  const me=analyze(st).level;if(me==null||lv.length<2)return null;
  return lv.filter(x=>x<me).length/(lv.length-1)*100;
}
function resolveTrack(st,an){
  if(st.trackSel&&st.trackSel!=='auto')return{track:st.trackSel,reason:'교사가 직접 지정'};
  const txt=((st.job||'')+' '+(st.univ||'')).toLowerCase();
  let best=null,bc=0;
  for(const t of ['의약','자연공학','상경','인문사회','예체능']){
    let c=0;for(const w of KEYWORDS[t]){
      if(w==='ai'){if(/(^|[^a-z])ai([^a-z]|$)/.test(txt))c++}
      else if(txt.includes(w))c++;
    }
    if(c>bc){bc=c;best=t}
  }
  if(best)return{track:best,reason:'희망 직업·대학 키워드 기준'};
  if(an&&an.natAvg!=null&&an.humAvg!=null)return{track:an.natAvg>=an.humAvg?'자연공학':'인문사회',reason:'희망 정보 없음 → 성적 경향 기준(참고용)'};
  return{track:'미정',reason:'정보 부족'};
}

/* =============== 순위 =============== */
function rankBasisOk(){return(S.rankBasis==='cum'||S.exams.includes(S.rankBasis))?S.rankBasis:'cum'}
function basisLabel(b){b=b||rankBasisOk();return b==='cum'?'누적(최근 가중) 평균':b}
function rankMap(basis){
  const cs=classStats();
  const items=S.students.map(s=>({s,v:basis==='cum'?analyze(s,cs).level:examAvg(s,basis)})).filter(x=>x.v!=null);
  const rk=(arr,x)=>1+arr.filter(y=>Math.round(y.v*100)>Math.round(x.v*100)).length;
  const out={};
  items.forEach(x=>{const same=items.filter(y=>String(y.s.cls)===String(x.s.cls));out[x.s.id]={v:x.v,cr:rk(same,x),cn:same.length,ar:rk(items,x),an:items.length}});
  return out;
}

/* =============== 거리 계산 =============== */
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function autoDist(st,sc){
  const ar=S.areas.find(a=>a.id===st.area);
  if(!ar||ar.lat==null||ar.lng==null||isNaN(ar.lat)||isNaN(ar.lng)||sc.lat==null||sc.lng==null||isNaN(sc.lat)||isNaN(sc.lng))return null;
  const km=hav(ar.lat,ar.lng,sc.lat,sc.lng)*(S.roadFactor||1.3);
  return{km:Math.round(km*10)/10,approx:!(ar.coordOk&&sc.coordOk)};
}
function effDist(st,sc){
  const m=st.dist&&st.dist[sc.id];
  if(m!==undefined&&m!==''&&m!==null&&!isNaN(m))return{km:+m,src:'manual',approx:false};
  const a=autoDist(st,sc);
  return a?{km:a.km,src:'auto',approx:a.approx}:{km:null,src:null,approx:false};
}

/* =============== 고교 추천 점수 =============== */
function electiveScore(sc,track){
  const need=NEEDS[track];
  if(!need)return{score:50,known:0,total:0,offered:0,txt:'계열별 필수 선택과목 기준 없음'};
  const total=Object.keys(need).length;let tw=0,kw=0,ow=0,known=0,offered=0;
  for(const [k,w] of Object.entries(need)){tw+=w;const v=sc.electives[k];if(v==='Y'||v==='N'){kw+=w;known++;if(v==='Y'){ow+=w;offered++}}}
  if(!kw)return{score:50,known:0,total,offered:0,txt:'선택과목 개설 정보 미입력'};
  const cov=kw/tw;
  return{score:clamp((ow/kw)*100*cov+50*(1-cov)),known,total,offered,txt:`필요 과목 ${known}/${total}개 확인 중 ${offered}개 개설`};
}
function rateScore(sc){
  let s=clamp((sc.rate4-70)/30*100);
  if(sc.top!==''&&sc.top!=null&&!isNaN(parseFloat(sc.top)))s=0.6*s+0.4*clamp(parseFloat(sc.top)/30*100);
  return s;
}
function distScore(km){
  if(km===''||km==null||isNaN(km))return{score:50,known:false};
  km=+km;return{score:km<=2?100:km<=5?80:km<=8?60:km<=12?40:20,known:true};
}
function levelScore(sc,avg,strategy){
  if(avg==null)return 50;
  const exp=LEVEL_EXPECT[sc.level]||65;
  const fit=clamp(100-Math.abs(avg-exp)*2.5);
  const adv=clamp(50+(avg-exp)*2.5);
  const lvl=({1:100,2:75,3:50,4:25})[sc.level]||50;
  if(strategy==='naesin')return adv;
  if(strategy==='jinhak')return 0.5*lvl+0.5*fit;
  return fit;
}
function recommend(st){
  const an=analyze(st);const tr=resolveTrack(st,an);
  const W=S.weights;const sumW=W.elec+W.rate+W.dist+W.level+W.pref||1;
  const out=S.schools.map(sc=>{
    const warns=[];
    let eligible=true;
    if(st.gender==='여'&&sc.gender==='boys'){eligible=false;warns.push('남학교 — 지원 불가')}
    if(st.gender==='남'&&sc.gender==='girls'){eligible=false;warns.push('여학교 — 지원 불가')}
    if(!st.gender)warns.push('성별 미입력(남고 지원 가능 여부 확인 필요)');
    const el=electiveScore(sc,tr.track);
    if(el.known===0&&NEEDS[tr.track])warns.push('선택과목 개설 정보 미확인');
    const rt=rateScore(sc);
    const ed=effDist(st,sc);const ds=distScore(ed.km==null?'':ed.km);if(!ds.known)warns.push('거리 미입력(거주 구역 선택 또는 직접 입력)');else if(ed.approx)warns.push('거리: 대략 좌표 기준');
    const lv=levelScore(sc,an.level,S.strategy);
    let pf=100;
    if(st.genderPref==='co'&&sc.gender!=='co')pf-=50;
    if(st.genderPref==='single'&&sc.gender==='co')pf-=50;
    if(st.typePref==='public'&&sc.type!=='public')pf-=50;
    if(st.typePref==='private'&&sc.type!=='private')pf-=50;
    const parts={elec:el.score,rate:rt,dist:ds.score,level:lv,pref:pf};
    const total=(W.elec*parts.elec+W.rate*parts.rate+W.dist*parts.dist+W.level*parts.level+W.pref*parts.pref)/sumW;
    const reasons=[];
    if(NEEDS[tr.track])reasons.push(el.txt);
    reasons.push(`4년제 진학률 ${sc.rate4}%`);
    if(ds.known)reasons.push(`거리 ${ed.src==='auto'?'약 ':''}${ed.km}km`);
    return{school:sc,eligible,total:eligible?total:null,parts,reasons,warns,el};
  });
  out.sort((a,b)=>(b.eligible-a.eligible)||((b.total||0)-(a.total||0)));
  return{an,track:tr,list:out};
}

/* =============== 차트 =============== */
function lineChart(labels,series){
  const W=620,H=240,pl=34,pr=10,pt=10,pb=46;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!all.length||!labels.length)return '<p class="muted">그래프로 나타낼 성적이 없습니다.</p>';
  const lo=Math.max(0,Math.floor((Math.min(...all)-5)/10)*10),hi=100;
  const X=i=>pl+(labels.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(labels.length-1));
  const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';
  for(let v=lo;v<=hi;v+=10)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e5e7eb"/><text x="${pl-5}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  labels.forEach((l,i)=>{const t=l.replace('학년 ','-').replace('학기 ','');g+=`<text x="${X(i)}" y="${H-pb+14}" text-anchor="middle">${esc(t.slice(0,8))}</text>`});
  series.forEach(s=>{
    let d='';let pen=false;
    s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i)+' '+Y(v);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold?3:1.8}" ${s.bold?'':'stroke-dasharray="4 3"'}/>`;
    s.vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${s.bold?4:2.5}" fill="${s.color}"/>`});
  });
  let lg='',lx=pl;series.forEach(s=>{lg+=`<rect x="${lx}" y="${H-12}" width="10" height="10" fill="${s.color}"/><text x="${lx+13}" y="${H-3}">${esc(s.name)}</text>`;lx+=24+s.name.length*11});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="성적 추이 그래프">${g}${lg}</svg>`;
}
const COLORS=['#2457c5','#d9480f','#2b8a3e','#862e9c','#c2255c'];

/* =============== 화면 조각 =============== */
function trendTag(l){return l==='상승'?'<span class="up">▲ 상승</span>':l==='하락'?'<span class="down">▼ 하락</span>':l==='유지'?'유지':'-'}
function analysisHtml(st){
  const cs=classStats();const an=analyze(st,cs);const ex=sortedExams();
  if(!an.examAvgs.length)return '<p class="muted">이 학생의 성적이 아직 없습니다.</p>';
  const pct=levelPercentile(st);
  const tr=resolveTrack(st,an);
  let h=`<h2>${esc(dispName(st))} — 성적 분석</h2>`;
  h+=`<p>주요교과 평균(최근 시험에 가중) <b>${f1(an.level)}</b>점`+(pct!=null?` · 우리 반 상대 위치 상위 약 ${Math.round(100-pct)}%`:'')+` · 전체 추이 ${trendTag(an.trendLabel)} · 희망 계열 <span class="tag">${esc(tr.track)}</span> <span class="muted">(${esc(tr.reason)})</span></p>`;
  const rmm=rankMap(rankBasisOk())[st.id];
  if(rmm)h+=`<p>순위(${esc(basisLabel())}): <b>반 ${rmm.cr}등</b>/${rmm.cn}명 · <b>전체 ${rmm.ar}등</b>/${rmm.an}명 <span class="muted">(입력된 학생 기준)</span></p>`;
  h+=`<p class="muted">자연계 교과 평균 ${f1(an.natAvg)} / 인문사회계 교과 평균 ${f1(an.humAvg)}</p>`;
  h+=`<div class="tablewrap"><table><tr><th class="l">시험</th><th>평균</th><th>직전 대비</th></tr>`+an.examAvgs.map(x=>`<tr><td class="l">${esc(x.exam)}</td><td>${f1(x.avg)}</td><td>${x.delta==null?'-':(x.delta>0?'<span class="up">+':'<span class="down">')+f1(x.delta)+'</span>'}</td></tr>`).join('')+`</table></div>`;
  const ser=[{name:'평균',color:'#111827',bold:true,vals:ex.map(e=>examAvg(st,e))}];
  an.strengths.concat(an.weaknesses).slice(0,4).forEach((s,i)=>ser.push({name:s.name,color:COLORS[i],vals:s.ser}));
  h+=lineChart(ex,ser);
  h+=`<h3>강점·약점 (본인 평균 대비 + 학급 내 위치)</h3><p>`+an.strengths.map(s=>`<span class="tag g">강점 ${esc(s.name)} ${f1(s.mean)}</span>`).join('')+an.weaknesses.map(s=>`<span class="tag r">보완 ${esc(s.name)} ${f1(s.mean)}</span>`).join('')+`</p>`;
  h+=`<div class="tablewrap"><table><tr><th class="l">교과</th><th>누적 평균</th><th>최근</th><th>본인 평균 대비</th><th>학급 z점수</th><th>변화 추세</th></tr>`+
    [...an.list].sort((a,b)=>b.idx-a.idx).map(s=>`<tr><td class="l">${esc(s.name)}</td><td>${f1(s.mean)}</td><td>${f1(s.latest)}</td><td>${s.dev>0?'+':''}${f1(s.dev)}</td><td>${s.z==null?'-':f1(s.z)}</td><td>${trendTag(s.label)}${s.slope!=null?` <span class="muted">(${s.slope>0?'+':''}${f1(s.slope)}/회)</span>`:''}</td></tr>`).join('')+`</table></div>`;
  if(Object.values(cs).every(c=>c.n<5))h+=`<p class="muted">학급 z점수는 같은 교과의 학생이 5명 이상 입력되어야 계산됩니다.</p>`;
  return h;
}
function recoHtml(st){
  const r=recommend(st);
  let h=`<h2>${esc(dispName(st))} — 고교 지망 우선순위(참고)</h2>`;
  h+=`<p class="muted">적용 계열: <b>${esc(r.track.track)}</b> (${esc(r.track.reason)}) · 전략: ${({balanced:'균형(학력 수준 적합)',naesin:'내신 유리 우선',jinhak:'진학실적 중시'})[S.strategy]}</p>`;
  h+=`<div class="tablewrap"><table><tr><th>순위</th><th class="l">학교</th><th>종합</th><th>선택과목</th><th>진학실적</th><th>거리</th><th>학력수준</th><th>선호</th><th class="l">근거·유의</th></tr>`;
  let rk=0;
  for(const x of r.list){
    if(x.eligible)rk++;
    const b=v=>`<span class="bar"><i style="width:${Math.round(v)}%"></i></span> ${Math.round(v)}`;
    h+=`<tr class="${x.eligible&&rk===1?'rank1':''}"><td>${x.eligible?rk:'-'}</td><td class="l"><b>${esc(x.school.name)}</b><br><span class="muted">${x.school.type==='public'?'공립':'사립'}·${({boys:'남',girls:'여',co:'공학'})[x.school.gender]}</span></td>`+
    (x.eligible?`<td><b>${f1(x.total)}</b></td><td>${b(x.parts.elec)}</td><td>${b(x.parts.rate)}</td><td>${b(x.parts.dist)}</td><td>${b(x.parts.level)}</td><td>${b(x.parts.pref)}</td>`:`<td colspan="6" class="muted">지원 대상 아님</td>`)+
    `<td class="l">${x.reasons.map(esc).join(' · ')}${x.warns.map(w=>` <span class="tag w">${esc(w)}</span>`).join('')}</td></tr>`;
  }
  h+=`</table></div><p class="muted">※ 실제 고교 배정은 경남교육청 입학전형(지망·추첨 등)에 따릅니다. 이 표는 상담용 참고 자료이며 합격·배정을 예측하지 않습니다. 학교별 정보 미확인 항목은 중간값(50점)으로 처리됩니다.</p>`;
  return h;
}

const TABS=[['input','① 입력'],['analysis','② 학생 분석'],['reco','③ 고교 추천'],['class','④ 학급 요약'],['schools','⑤ 고교 정보'],['settings','⑥ 설정·백업']];
function renderNav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render()})}
function curStudent(){return S.students.find(s=>s.id===S.selected)||null}
function studentPicker(){
  if(!S.students.length)return '<div class="card"><p>학생이 없습니다. ① 입력 탭에서 NEIS 일람표를 불러오거나 학생을 추가해 주세요.</p></div>';
  return `<div class="card row"><label>학생 선택<select id="pick">${S.students.slice().sort((a,b)=>a.cls-b.cls||a.no-b.no).map(s=>`<option value="${s.id}" ${s.id===S.selected?'selected':''}>${esc(dispName(s))}</option>`).join('')}</select></label></div>`;
}
function bindPicker(){const p=$('#pick');if(p)p.onchange=()=>{S.selected=p.value;save();render()}}
function render(){

}
function privacyBar(){return `<div class="priv">🔒 학생 정보는 <b>이 브라우저(이 기기)</b>에만 저장되며 외부로 전송되지 않습니다. 정확한 집 주소는 입력하지 않고 거주 동·읍·면만 선택합니다. 기본값으로 성명은 가운데 글자를 가려(홍○동) 저장합니다. 공용 PC에서는 사용 후 ⑥에서 전체 삭제를 권장합니다.</div>`}

function bindInput(){
  $('#app').querySelectorAll('.slist button').forEach(b=>b.onclick=()=>{S.selected=b.dataset.id;save();render()});
  $('#addSt').onclick=()=>{const cls=curStudent()?curStudent().cls:1;const mx=Math.max(0,...S.students.filter(s=>String(s.cls)===String(cls)).map(s=>s.no));const st=newStudent(cls,mx+1);S.students.push(st);S.selected=st.id;save();render()};
  $('#demo').onclick=loadDemo;
  $('#impParse').onclick=()=>doImportPreview(null);
  $('#impFile').onchange=async e=>{const f=e.target.files[0];if(f)await readFile(f)};
  const st=curStudent();if(!st)return;
  $('#detailBox').ontoggle=e=>{S.detailOpen=e.target.open;save()};
  $('#app').querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{
    const f=el.dataset.f;let v=el.value;
    if(f==='cls'||f==='no')v=parseInt(v,10)||1;
    if(f==='name'&&S.maskNames)v=maskName(v);
    st[f]=v;save();render();
  });
  $('#app').querySelectorAll('[data-dist]').forEach(el=>el.onchange=()=>{if(el.value==='')delete st.dist[el.dataset.dist];else st.dist[el.dataset.dist]=parseFloat(el.value);save()});
  $('#app').querySelectorAll('[data-sc]').forEach(el=>el.onchange=()=>{
    const e=el.dataset.ex,k=el.dataset.sc;st.scores[e]=st.scores[e]||{};
    if(el.value==='')delete st.scores[e][k];else st.scores[e][k]=clamp(parseFloat(el.value));
    save();
  });
  $('#delSt').onclick=()=>{if(confirm('이 학생의 모든 정보를 삭제할까요?')){S.students=S.students.filter(s=>s.id!==st.id);S.selected=null;save();render()}};
  $('#addSubj').onclick=()=>{const n=$('#newSubj').value.trim();if(!n)return;const ex=sortedExams();if(!ex.length){alert('먼저 시험을 추가해 주세요.');return}const e=ex[ex.length-1];st.scores[e]=st.scores[e]||{};st.scores[e][n]=st.scores[e][n]??0;save();render()};
  $('#addExam').onclick=()=>{const e=$('#newExam').value;if(!S.exams.includes(e))S.exams.push(e);save();render()};
}
async function readFile(f){
  const name=f.name.toLowerCase();
  try{
    if(/\.(csv|tsv|txt)$/.test(name)){doImportPreview(parseText(TT.util.decodeText(await f.arrayBuffer())));return}
    doImportPreview(await TT.file.toRows(f,{firstSheet:true}));
  }catch(err){
    $('#impPreview').innerHTML=`<div class="notice">${esc(err&&err.userMsg?err.userMsg:'파일을 읽지 못했습니다. 나이스에서 받은 엑셀(xlsx) 파일인지 확인해 주세요.')} 엑셀을 열어 표를 복사한 뒤 위 입력칸에 붙여넣어도 됩니다.</div>`;
  }
}
function doImportPreview(grid){
  if(!grid){const t=$('#impPaste').value;if(!t.trim()){$('#impPreview').innerHTML='<div class="notice">붙여넣을 내용이 없습니다.</div>';return}grid=parseText(t)}
  const p=parseGrid(grid);
  if(p.error){$('#impPreview').innerHTML=`<div class="notice">${esc(p.error)}</div>`;return}
  importState=p;
  $('#impPreview').innerHTML=`<h3>미리보기: 학생 ${p.students.length}명 · 교과 ${p.subjects.length}개</h3>
  <p class="muted">반영할 교과를 선택하세요. 성취도(A~E)만 있는 교과는 A=95, B=85, C=75, D=65, E=50으로 환산합니다(근사값).</p>
  <p>${p.subjects.map((s,i)=>`<label style="margin-right:10px"><input type="checkbox" class="impSub" value="${esc(s)}" checked> ${esc(s)}</label>`).join('')}</p>
  <div class="tablewrap"><table><tr><th>번호</th><th>성명(표시)</th>${p.subjects.slice(0,8).map(s=>`<th>${esc(s)}</th>`).join('')}</tr>`+
  p.students.slice(0,3).map(s=>`<tr><td>${s.no}</td><td>${esc(maskName(s.name))}</td>${p.subjects.slice(0,8).map(k=>`<td>${s.scores[k]??''}</td>`).join('')}</tr>`).join('')+`</table></div>
  <p><button class="btn" id="impApply">이 내용으로 저장</button></p>`;
  $('#impApply').onclick=()=>{
    let exam=$('#impExam').value;if(exam==='__c'){exam=$('#impCustom').value.trim();if(!exam){alert('시험명을 입력해 주세요.');return}}
    const picked=[...document.querySelectorAll('.impSub:checked')].map(x=>x.value);
    if(!picked.length){alert('교과를 하나 이상 선택해 주세요.');return}
    const r=applyImport(importState,exam,$('#impCls').value||1,picked);
    importState=null;save();
    if(!S.selected&&S.students.length)S.selected=S.students[0].id;
    render();
    $('#impPreview').innerHTML=`<div class="priv">저장했습니다: 새 학생 ${r.added}명, 갱신 ${r.updated}명 (${esc(exam)})</div>`;
  };
}
function loadDemo(){
  if(S.students.length&&!confirm('예시 데이터를 추가합니다. 계속할까요?'))return;
  const subj=['국어','영어','수학','사회','과학'];
  const base=[[88,90,95,85,92],[75,70,68,80,72],[92,94,88,95,90],[60,58,55,65,62],[82,78,90,76,88],[70,85,65,88,68],[95,92,97,90,96],[66,62,70,64,68]];
  const names=['가나다','라마바','사아자','차카타','파하나','도레미','솔라시','기니디'];
  const exams=['3학년 1학기 중간','3학년 1학기 기말','3학년 2학기 중간'];
  exams.forEach(e=>{if(!S.exams.includes(e))S.exams.push(e)});
  base.forEach((b,i)=>{
    const st=newStudent(9,i+1);st.name=maskName(names[i]);st.gender=i%2?'여':'남';
    st.job=['소프트웨어 개발자','간호사','변호사','','건축가','기자','의사','경찰'][i];
    exams.forEach((e,ei)=>{st.scores[e]={};subj.forEach((s,si)=>{st.scores[e][s]=clamp(b[si]+ (ei-1)*(i%3-1)*3 + ((si+i)%3-1)*2)})});
    st.area=S.areas[(i*3)%S.areas.length].id;
    S.students.push(st);
  });
  S.selected=S.students[S.students.length-8].id;save();render();
}


/* ---- 빠른 입력 ---- */
function quickExamList(){const set=[...EXAM_PRESETS];S.exams.forEach(e=>{if(!set.includes(e))set.push(e)});if(!set.includes(S.qExam))set.push(S.qExam);return set}
function quickCard(){
  const maxNo=Math.max(0,...S.students.filter(s=>String(s.cls)===String(S.qCls)).map(s=>s.no));
  const rows=Math.max(S.qRows||30,maxNo);
  const subs=S.qSubjects;
  const rm=rankMap(S.qExam);
  let h=`<div class="card"><h2>빠른 입력: 번호·성명·성적</h2>
  <p class="muted">번호는 1번부터 자동으로 매겨집니다. 성명 칸부터 입력하고 Enter를 누르면 아래 칸으로 내려갑니다. 엑셀·NEIS에서 성명이나 점수 열을 복사해 칸에 붙여넣으면 아래로 채워집니다. 희망 직업·거주 구역 같은 상세 정보는 나중에 필요할 때만 입력하세요.</p>
  <div class="row"><label>반<input type="number" id="qCls" min="1" max="30" value="${S.qCls}"></label>
  <label>시험<select id="qExam">${quickExamList().map(e=>`<option ${e===S.qExam?'selected':''}>${esc(e)}</option>`).join('')}</select></label>
  <label>시험명 직접 추가<input type="text" id="qNewExam" placeholder="예: 3학년 2학기 기말"></label><button class="btn sec sm" id="qAddExam">시험 추가</button>
  <label>교과 추가<input type="text" id="qNewSub" placeholder="예: 도덕"></label><button class="btn sec sm" id="qAddSub">교과 추가</button></div>
  <div class="tablewrap" style="margin-top:10px"><table class="qgrid" id="qgrid"><tr><th>번호</th><th>성명</th>${subs.map((s,i)=>`<th>${esc(s)} <button class="btn sec sm" data-qdel="${i}" title="이 열 빼기">×</button></th>`).join('')}<th>평균</th><th>반 순위</th><th>전체 순위</th></tr>`;
  for(let r=1;r<=rows;r++){
    const st=S.students.find(x=>String(x.cls)===String(S.qCls)&&x.no===r);
    const sc=(st&&st.scores[S.qExam])||{};
    const o=st&&rm[st.id];
    h+=`<tr><td>${r}</td><td><input type="text" data-q="name" data-r="${r}" value="${esc(st?st.name:'')}"></td>${subs.map(s=>`<td><input type="number" min="0" max="100" step="0.1" data-q="s" data-r="${r}" data-s="${esc(s)}" value="${sc[s]??''}"></td>`).join('')}<td data-rk="avg" data-r="${r}">${o?f1(o.v):''}</td><td data-rk="c" data-r="${r}">${o?o.cr+'/'+o.cn:''}</td><td data-rk="a" data-r="${r}">${o?o.ar+'/'+o.an:''}</td></tr>`;
  }
  h+=`</table></div><p style="margin-top:8px"><button class="btn sec sm" id="qMore">+ 5줄 더 보기</button> <span class="muted">칸을 벗어나면 자동 저장됩니다. 순위는 선택한 시험의 주요교과 평균 기준이며, 전체 순위는 입력된 모든 반 학생 중 순위입니다. 성명은 저장 시 가운데 글자가 가려집니다.</span></p></div>`;
  return h;
}
function qCell(r,q,sub){const list=document.querySelectorAll(`#qgrid input[data-q="${q}"][data-r="${r}"]`);for(const el of list){if(q!=='s'||el.dataset.s===sub)return el}return null}
function refreshGridRanks(){
  const m=rankMap(S.qExam);
  document.querySelectorAll('#qgrid td[data-rk]').forEach(td=>{
    const r=+td.dataset.r;const st=S.students.find(x=>String(x.cls)===String(S.qCls)&&x.no===r);const o=st&&m[st.id];const k=td.dataset.rk;
    td.textContent=!o?'':k==='avg'?f1(o.v):k==='c'?o.cr+'/'+o.cn:o.ar+'/'+o.an;
  });
}
function commitRow(r){
  const nameEl=qCell(r,'name');if(!nameEl)return;
  const name=nameEl.value.trim();const sc={};const cleared=[];
  S.qSubjects.forEach(sub=>{const el=qCell(r,'s',sub);if(!el)return;if(el.value==='')cleared.push(sub);else{const v=parseFloat(el.value);if(!isNaN(v))sc[sub]=clamp(v)}});
  let st=S.students.find(x=>String(x.cls)===String(S.qCls)&&x.no===r);
  if(!st&&!name&&!Object.keys(sc).length)return;
  if(!st){st=newStudent(S.qCls,r);S.students.push(st)}
  if(name&&name!==st.name)st.name=S.maskNames?maskName(name):name;
  nameEl.value=st.name;
  if(Object.keys(sc).length&&!S.exams.includes(S.qExam))S.exams.push(S.qExam);
  if(Object.keys(sc).length||st.scores[S.qExam]){st.scores[S.qExam]=st.scores[S.qExam]||{};Object.assign(st.scores[S.qExam],sc);cleared.forEach(k=>delete st.scores[S.qExam][k])}
  if(!S.selected)S.selected=st.id;
  save();refreshGridRanks();
}
function bindQuick(){
  const g=$('#qgrid');
  $('#qCls').onchange=e=>{S.qCls=parseInt(e.target.value,10)||1;save();render()};
  $('#qExam').onchange=e=>{S.qExam=e.target.value;save();render()};
  $('#qAddExam').onclick=()=>{const v=$('#qNewExam').value.trim();if(!v)return;S.qExam=v;save();render()};
  $('#qAddSub').onclick=()=>{const v=$('#qNewSub').value.trim();if(!v||S.qSubjects.includes(v))return;S.qSubjects.push(v);save();render()};
  $('#qMore').onclick=()=>{S.qRows=(S.qRows||30)+5;save();render()};
  $('#app').querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>{S.qSubjects.splice(+b.dataset.qdel,1);save();render()});
  g.onchange=e=>{const t=e.target;if(t.dataset&&t.dataset.q)commitRow(+t.dataset.r)};
  g.onkeydown=e=>{
    if(e.key!=='Enter')return;const t=e.target;if(!t.dataset||!t.dataset.q)return;
    e.preventDefault();const nx=qCell(+t.dataset.r+1,t.dataset.q,t.dataset.s);
    if(nx){nx.focus();if(nx.select)nx.select()}
  };
  g.onpaste=e=>{
    const t=e.target;if(!t.dataset||!t.dataset.q)return;
    const txt=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\r/g,'');
    if(!/[\t\n]/.test(txt.trim()))return;
    e.preventDefault();
    const lines=txt.split('\n');while(lines.length&&lines[lines.length-1]==='')lines.pop();
    const r0=+t.dataset.r;const cols=['name',...S.qSubjects];
    const c0=t.dataset.q==='name'?0:1+S.qSubjects.indexOf(t.dataset.s);
    let skipped=0;
    lines.forEach((ln,i)=>{
      const r=r0+i;const nameEl=qCell(r,'name');if(!nameEl){skipped++;return}
      ln.split('\t').forEach((val,j)=>{const c=c0+j;if(c>=cols.length)return;const el=c===0?qCell(r,'name'):qCell(r,'s',cols[c]);if(el)el.value=val.trim()});
      commitRow(r);
    });
    if(skipped)alert(`표 아래쪽 ${skipped}줄은 칸이 없어 입력하지 못했습니다. '+ 5줄 더 보기'로 줄을 늘린 뒤 다시 붙여넣어 주세요.`);
  };
}

  $('#exp').onclick=()=>download('진학도우미_백업.json',JSON.stringify(S),'application/json');
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.students))throw 0;if(confirm('현재 데이터를 백업 내용으로 바꿉니다. 계속할까요?')){S=Object.assign(defaultState(),o);migrate();save();render()}}catch(x){alert('올바른 백업 파일이 아닙니다.')}};
  $('#wipe').onclick=()=>{if(confirm('학생·성적·학교 입력 정보를 모두 삭제합니다. 되돌릴 수 없습니다.')&&confirm('정말 삭제할까요?')){try{localStorage.removeItem(KEY)}catch(e){}S=defaultState();render()}};
}

/* =============== 시작 =============== */
if(typeof document!=='undefined'){
  load();
  // 처음 쓸 때: 빠른 입력의 반을 우리 반(담임)으로 맞춥니다.
  try{const h=TT.roster.home();if(h&&h.cls!=null&&!S.students.length)S.qCls=h.cls}catch(e){}
  render();
}
if(typeof module!=='undefined')module.exports={rankMap,commitRow,quickCard,effDist,autoDist,parseGrid,parseText,applyImport,analyze,recommend,resolveTrack,S:()=>S,setS:x=>{S=x},defaultState,newStudent,maskName,classStats,levelPercentile};
</script>
