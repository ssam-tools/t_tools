/* =============== 성적 파싱(NEIS 일람표) =============== */
function parseValue(v){
  v=String(v==null?'':v).trim();if(!v)return null;
  const m=v.match(/-?\d+(\.\d+)?/);
  if(m){const x=parseFloat(m[0]);return (x>=0&&x<=100)?x:null}
  const L=v.toUpperCase().match(/^[A-E]/);
  return L?GRADE_MAP[L[0]]:null;
}
function parseGrid(grid){
  const rows=grid.map(r=>r.map(c=>String(c==null?'':c).replace(/\s+/g,' ').trim()));
  const h=rows.findIndex(r=>r.some(c=>/^(성명|이름)$/.test(c.replace(/ /g,''))));
  if(h<0)return{error:'표에서 \'성명\'(또는 \'이름\') 칸이 있는 머리글 줄을 찾지 못했습니다. NEIS 일람표 전체를 복사했는지 확인해 주세요.'};
  const head=rows[h];
  const nameCol=head.findIndex(c=>/^(성명|이름)$/.test(c.replace(/ /g,'')));
  const noCol=head.findIndex(c=>/^(번호|학번)$/.test(c));
  const genCol=head.findIndex(c=>/^성별$/.test(c));
  const next=rows[h+1]||[];
  const hasSub=next.filter(c=>/원점수|성취도|점수|등급|석차/.test(c)).length>=2;
  const EXCL=/^(번호|학번|성명|이름|성별|합계|총점|평균|석차|등수|비고|학년|반|순위|생년월일|출결.*|결석.*|지각.*|조퇴.*|결과.*)$/;
  const cols={};let last='';
  for(let c=nameCol+1;c<head.length;c++){
    if(head[c])last=head[c];
    const label=head[c]||last;
    if(!label||EXCL.test(label))continue;
    let type='raw';
    if(hasSub){
      const s=next[c]||'';
      if(/성취도/.test(s))type='grade';
      else if(/원점수|점수/.test(s)&&!/평균|표준/.test(s))type='raw';
      else continue;
    }
    (cols[label]=cols[label]||{})[type]=c;
  }
  const subjects=Object.keys(cols);
  if(!subjects.length)return{error:'교과(과목) 열을 찾지 못했습니다.'};
  const start=h+1+(hasSub?1:0);
  const students=[];let seq=0;
  for(let r=start;r<rows.length;r++){
    const row=rows[r];
    const nm=row[nameCol]||'';
    if(!nm&&!row.some(c=>c))continue;
    if(row.slice(0,nameCol+1).some(c=>/^(평균|합계|계|전체|표준편차)/.test(c)))continue;
    seq++;
    const scores={};let cnt=0;
    for(const s of subjects){
      const c=cols[s];
      let v=c.raw!=null?parseValue(row[c.raw]):null;
      if(v==null&&c.grade!=null)v=parseValue(row[c.grade]);
      if(v!=null){scores[s]=v;cnt++}
    }
    if(!cnt)continue;
    let no=noCol>=0?parseInt(row[noCol],10):NaN;if(isNaN(no))no=seq;
    let gender='';if(genCol>=0){gender=/남/.test(row[genCol])?'남':/여/.test(row[genCol])?'여':''}
    students.push({no,name:nm,gender,scores});
  }
  if(!students.length)return{error:'학생 성적 행을 찾지 못했습니다.'};
  return{students,subjects};
}
function parseText(text){
  const lines=String(text).split(/\r?\n/).filter(l=>l.trim()!=='');
  const tab=lines.some(l=>l.includes('\t'));
  return lines.map(l=>{
    if(tab)return l.split('\t');
    const out=[];let cur='',q=false;
    for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}
    out.push(cur);return out;
  });
}
function applyImport(parsed,exam,cls,pickedSubjects){
  let added=0,updated=0;
  if(!S.exams.includes(exam))S.exams.push(exam);
  for(const p of parsed.students){
    let st=S.students.find(s=>String(s.cls)===String(cls)&&s.no===p.no);
    if(!st){st=newStudent(cls,p.no);S.students.push(st);added++}else updated++;
    if(p.name)st.name=S.maskNames?maskName(p.name):p.name;
    if(p.gender&&!st.gender)st.gender=p.gender;
    const sc={};for(const k of pickedSubjects)if(p.scores[k]!=null)sc[k]=p.scores[k];
    st.scores[exam]=Object.assign(st.scores[exam]||{},sc);
  }
  return{added,updated};
}
/* 학급 명렬표에 같은 반·번호가 있으면 그 이름 (학년은 우리 반의 학년, 없으면 3학년) */
function rosterName(cls,no){
  try{
    if(typeof TT==='undefined')return '';
    const d=TT.roster.load(),h=TT.roster.home(d),g=h&&h.grade!=null?h.grade:3;
    const c=d.classes.find(x=>x.grade===g&&x.cls===Number(cls)),s=c&&c.students.find(x=>x.no===Number(no));
    return s?(S.maskNames?maskName(s.name):s.name):'';
  }catch(e){return ''}
}
function newStudent(cls,no){return{id:uid(),cls:cls||1,no:no||1,name:rosterName(cls||1,no||1),gender:'',area:'',job:'',univ:'',trackSel:'auto',genderPref:'any',typePref:'any',dist:{},scores:{}}}

/* =============== 분석 =============== */
function slopeOf(ser){
  const pts=[];ser.forEach((v,i)=>{if(v!=null)pts.push([i,v])});
  if(pts.length<2)return null;
  const mx=mean(pts.map(p=>p[0])),my=mean(pts.map(p=>p[1]));
  let nu=0,de=0;pts.forEach(([x,y])=>{nu+=(x-mx)*(y-my);de+=(x-mx)**2});
  return de?nu/de:null;
}
function examAvg(st,e){const sc=st.scores[e];if(!sc)return null;return mean(Object.entries(sc).filter(([k])=>included(k)).map(([,v])=>v))}
function subjectMeans(st){
  const out={};
  for(const e of sortedExams())for(const [k,v] of Object.entries(st.scores[e]||{}))if(included(k)&&typeof v==='number')(out[k]=out[k]||[]).push(v);
  const r={};for(const k in out)r[k]=mean(out[k]);return r;
}
function classStats(){
  const acc={};
  for(const st of S.students){const m=subjectMeans(st);for(const k in m)(acc[k]=acc[k]||[]).push(m[k])}
  const r={};for(const k in acc)r[k]={n:acc[k].length,mean:mean(acc[k]),sd:sd(acc[k])};return r;
}
function analyze(st,cs){
  cs=cs||classStats();
  const ex=sortedExams();
  const examAvgs=ex.map(e=>({exam:e,avg:examAvg(st,e)})).filter(x=>x.avg!=null);
  examAvgs.forEach((x,i)=>{x.delta=i?x.avg-examAvgs[i-1].avg:null});
  const subs=new Set();ex.forEach(e=>Object.keys(st.scores[e]||{}).forEach(k=>included(k)&&subs.add(k)));
  const own=mean(examAvgs.map(x=>x.avg));
  const list=[...subs].map(n=>{
    const ser=ex.map(e=>{const v=(st.scores[e]||{})[n];return typeof v==='number'?v:null});
    const vals=ser.filter(v=>v!=null);
    const m=mean(vals),slope=slopeOf(ser),c=cs[n];
    const z=(c&&c.sd>0&&c.n>=5)?(m-c.mean)/c.sd:null;
    const dev=own!=null?m-own:0;
    const idx=z!=null?0.5*dev/10+0.5*z:dev/10;
    return{name:n,group:groupOf(n),ser,mean:m,latest:vals[vals.length-1],slope,label:slope==null?'-':slope>=2?'상승':slope<=-2?'하락':'유지',dev,z,idx,n:vals.length};
  });
  const byIdx=[...list].sort((a,b)=>b.idx-a.idx);
  const k=list.length>=6?3:list.length>=4?2:1;
  const strengths=byIdx.slice(0,k);
  const weaknesses=[...byIdx].reverse().slice(0,k).filter(x=>!strengths.includes(x));
  let wsum=0,wtot=0;examAvgs.forEach((x,i)=>{wsum+=x.avg*(i+1);wtot+=i+1});
  const level=wtot?wsum/wtot:null;
  const gm=g=>mean(list.filter(x=>x.group===g).map(x=>x.mean));
  const sl=slopeOf(examAvgs.map(x=>x.avg));
  return{examAvgs,list,strengths,weaknesses,level,own,natAvg:gm('nat'),humAvg:gm('human'),slope:sl,
    trendLabel:sl==null?'-':sl>=2?'상승':sl<=-2?'하락':'유지'};
}
function levelPercentile(st){
  const lv=S.students.map(s=>analyze(s).level).filter(x=>x!=null);
  const me=analyze(st).level;if(me==null||lv.length<2)return null;
  return lv.filter(x=>x<me).length/(lv.length-1)*100;
}
function resolveTrack(st,an){
  if(st.trackSel&&st.trackSel!=='auto')return{track:st.trackSel,reason:'교사가 직접 지정'};
  const txt=((st.job||'')+' '+(st.univ||'')).toLowerCase();
  let best=null,bc=0;
  for(const t of ['의약','자연공학','상경','인문사회','예체능']){
    let c=0;for(const w of KEYWORDS[t]){
      if(w==='ai'){if(/(^|[^a-z])ai([^a-z]|$)/.test(txt))c++}
      else if(txt.includes(w))c++;
    }
    if(c>bc){bc=c;best=t}
  }
  if(best)return{track:best,reason:'희망 직업·대학 키워드 기준'};
  if(an&&an.natAvg!=null&&an.humAvg!=null)return{track:an.natAvg>=an.humAvg?'자연공학':'인문사회',reason:'희망 정보 없음 → 성적 경향 기준(참고용)'};
  return{track:'미정',reason:'정보 부족'};
}

/* =============== 순위 =============== */
function rankBasisOk(){return(S.rankBasis==='cum'||S.exams.includes(S.rankBasis))?S.rankBasis:'cum'}
function basisLabel(b){b=b||rankBasisOk();return b==='cum'?'누적(최근 가중) 평균':b}
function rankMap(basis){
  const cs=classStats();
  const items=S.students.map(s=>({s,v:basis==='cum'?analyze(s,cs).level:examAvg(s,basis)})).filter(x=>x.v!=null);
  const rk=(arr,x)=>1+arr.filter(y=>Math.round(y.v*100)>Math.round(x.v*100)).length;
  const out={};
  items.forEach(x=>{const same=items.filter(y=>String(y.s.cls)===String(x.s.cls));out[x.s.id]={v:x.v,cr:rk(same,x),cn:same.length,ar:rk(items,x),an:items.length}});
  return out;
}

/* =============== 거리 계산 =============== */
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function autoDist(st,sc){
  const ar=S.areas.find(a=>a.id===st.area);
  if(!ar||ar.lat==null||ar.lng==null||isNaN(ar.lat)||isNaN(ar.lng)||sc.lat==null||sc.lng==null||isNaN(sc.lat)||isNaN(sc.lng))return null;
  const km=hav(ar.lat,ar.lng,sc.lat,sc.lng)*(S.roadFactor||1.3);
  return{km:Math.round(km*10)/10,approx:!(ar.coordOk&&sc.coordOk)};
}
function effDist(st,sc){
  const m=st.dist&&st.dist[sc.id];
  if(m!==undefined&&m!==''&&m!==null&&!isNaN(m))return{km:+m,src:'manual',approx:false};
  const a=autoDist(st,sc);
  return a?{km:a.km,src:'auto',approx:a.approx}:{km:null,src:null,approx:false};
}

/* =============== 고교 추천 점수 =============== */
function electiveScore(sc,track){
  const need=NEEDS[track];
  if(!need)return{score:50,known:0,total:0,offered:0,txt:'계열별 필수 선택과목 기준 없음'};
  const total=Object.keys(need).length;let tw=0,kw=0,ow=0,known=0,offered=0;
  for(const [k,w] of Object.entries(need)){tw+=w;const v=sc.electives[k];if(v==='Y'||v==='N'){kw+=w;known++;if(v==='Y'){ow+=w;offered++}}}
  if(!kw)return{score:50,known:0,total,offered:0,txt:'선택과목 개설 정보 미입력'};
  const cov=kw/tw;
  return{score:clamp((ow/kw)*100*cov+50*(1-cov)),known,total,offered,txt:`필요 과목 ${known}/${total}개 확인 중 ${offered}개 개설`};
}
function rateScore(sc){
  let s=clamp((sc.rate4-70)/30*100);
  if(sc.top!==''&&sc.top!=null&&!isNaN(parseFloat(sc.top)))s=0.6*s+0.4*clamp(parseFloat(sc.top)/30*100);
  return s;
}
function distScore(km){
  if(km===''||km==null||isNaN(km))return{score:50,known:false};
  km=+km;return{score:km<=2?100:km<=5?80:km<=8?60:km<=12?40:20,known:true};
}
function levelScore(sc,avg,strategy){
  if(avg==null)return 50;
  const exp=LEVEL_EXPECT[sc.level]||65;
  const fit=clamp(100-Math.abs(avg-exp)*2.5);
  const adv=clamp(50+(avg-exp)*2.5);
  const lvl=({1:100,2:75,3:50,4:25})[sc.level]||50;
  if(strategy==='naesin')return adv;
  if(strategy==='jinhak')return 0.5*lvl+0.5*fit;
  return fit;
}
function recommend(st){
  const an=analyze(st);const tr=resolveTrack(st,an);
  const W=S.weights;const sumW=W.elec+W.rate+W.dist+W.level+W.pref||1;
  const out=S.schools.map(sc=>{
    const warns=[];
    let eligible=true;
    if(st.gender==='여'&&sc.gender==='boys'){eligible=false;warns.push('남학교 — 지원 불가')}
    if(st.gender==='남'&&sc.gender==='girls'){eligible=false;warns.push('여학교 — 지원 불가')}
    if(!st.gender)warns.push('성별 미입력(남고 지원 가능 여부 확인 필요)');
    const el=electiveScore(sc,tr.track);
    if(el.known===0&&NEEDS[tr.track])warns.push('선택과목 개설 정보 미확인');
    const rt=rateScore(sc);
    const ed=effDist(st,sc);const ds=distScore(ed.km==null?'':ed.km);if(!ds.known)warns.push('거리 미입력(거주 구역 선택 또는 직접 입력)');else if(ed.approx)warns.push('거리: 대략 좌표 기준');
    const lv=levelScore(sc,an.level,S.strategy);
    let pf=100;
    if(st.genderPref==='co'&&sc.gender!=='co')pf-=50;
    if(st.genderPref==='single'&&sc.gender==='co')pf-=50;
    if(st.typePref==='public'&&sc.type!=='public')pf-=50;
    if(st.typePref==='private'&&sc.type!=='private')pf-=50;
    const parts={elec:el.score,rate:rt,dist:ds.score,level:lv,pref:pf};
    const total=(W.elec*parts.elec+W.rate*parts.rate+W.dist*parts.dist+W.level*parts.level+W.pref*parts.pref)/sumW;
    const reasons=[];
    if(NEEDS[tr.track])reasons.push(el.txt);
    reasons.push(`4년제 진학률 ${sc.rate4}%`);
    if(ds.known)reasons.push(`거리 ${ed.src==='auto'?'약 ':''}${ed.km}km`);
    return{school:sc,eligible,total:eligible?total:null,parts,reasons,warns,el};
  });
  out.sort((a,b)=>(b.eligible-a.eligible)||((b.total||0)-(a.total||0)));
  return{an,track:tr,list:out};
}

/* =============== 차트 =============== */
function lineChart(labels,series){
  const W=620,H=240,pl=34,pr=10,pt=10,pb=46;
  const all=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!all.length||!labels.length)return '<p class="muted">그래프로 나타낼 성적이 없습니다.</p>';
  const lo=Math.max(0,Math.floor((Math.min(...all)-5)/10)*10),hi=100;
  const X=i=>pl+(labels.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(labels.length-1));
  const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let g='';
  for(let v=lo;v<=hi;v+=10)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e5e7eb"/><text x="${pl-5}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  labels.forEach((l,i)=>{const t=l.replace('학년 ','-').replace('학기 ','');g+=`<text x="${X(i)}" y="${H-pb+14}" text-anchor="middle">${esc(t.slice(0,8))}</text>`});
  series.forEach(s=>{
    let d='';let pen=false;
    s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i)+' '+Y(v);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.bold?3:1.8}" ${s.bold?'':'stroke-dasharray="4 3"'}/>`;
    s.vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${s.bold?4:2.5}" fill="${s.color}"/>`});
  });
  let lg='',lx=pl;series.forEach(s=>{lg+=`<rect x="${lx}" y="${H-12}" width="10" height="10" fill="${s.color}"/><text x="${lx+13}" y="${H-3}">${esc(s.name)}</text>`;lx+=24+s.name.length*11});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="성적 추이 그래프">${g}${lg}</svg>`;
}
const COLORS=['#2457c5','#d9480f','#2b8a3e','#862e9c','#c2255c'];

/* =============== 화면 조각 =============== */
function trendTag(l){return l==='상승'?'<span class="up">▲ 상승</span>':l==='하락'?'<span class="down">▼ 하락</span>':l==='유지'?'유지':'-'}
function analysisHtml(st){
  const cs=classStats();const an=analyze(st,cs);const ex=sortedExams();
  if(!an.examAvgs.length)return '<p class="muted">이 학생의 성적이 아직 없습니다.</p>';
  const pct=levelPercentile(st);
  const tr=resolveTrack(st,an);
  let h=`<h2>${esc(dispName(st))} — 성적 분석</h2>`;
  h+=`<p>주요교과 평균(최근 시험에 가중) <b>${f1(an.level)}</b>점`+(pct!=null?` · 우리 반 상대 위치 상위 약 ${Math.round(100-pct)}%`:'')+` · 전체 추이 ${trendTag(an.trendLabel)} · 희망 계열 <span class="tag">${esc(tr.track)}</span> <span class="muted">(${esc(tr.reason)})</span></p>`;
  const rmm=rankMap(rankBasisOk())[st.id];
  if(rmm)h+=`<p>순위(${esc(basisLabel())}): <b>반 ${rmm.cr}등</b>/${rmm.cn}명 · <b>전체 ${rmm.ar}등</b>/${rmm.an}명 <span class="muted">(입력된 학생 기준)</span></p>`;
  h+=`<p class="muted">자연계 교과 평균 ${f1(an.natAvg)} / 인문사회계 교과 평균 ${f1(an.humAvg)}</p>`;
  h+=`<div class="tablewrap"><table><tr><th class="l">시험</th><th>평균</th><th>직전 대비</th></tr>`+an.examAvgs.map(x=>`<tr><td class="l">${esc(x.exam)}</td><td>${f1(x.avg)}</td><td>${x.delta==null?'-':(x.delta>0?'<span class="up">+':'<span class="down">')+f1(x.delta)+'</span>'}</td></tr>`).join('')+`</table></div>`;
  const ser=[{name:'평균',color:'#111827',bold:true,vals:ex.map(e=>examAvg(st,e))}];
  an.strengths.concat(an.weaknesses).slice(0,4).forEach((s,i)=>ser.push({name:s.name,color:COLORS[i],vals:s.ser}));
  h+=lineChart(ex,ser);
  h+=`<h3>강점·약점 (본인 평균 대비 + 학급 내 위치)</h3><p>`+an.strengths.map(s=>`<span class="tag g">강점 ${esc(s.name)} ${f1(s.mean)}</span>`).join('')+an.weaknesses.map(s=>`<span class="tag r">보완 ${esc(s.name)} ${f1(s.mean)}</span>`).join('')+`</p>`;
  h+=`<div class="tablewrap"><table><tr><th class="l">교과</th><th>누적 평균</th><th>최근</th><th>본인 평균 대비</th><th>학급 z점수</th><th>변화 추세</th></tr>`+
    [...an.list].sort((a,b)=>b.idx-a.idx).map(s=>`<tr><td class="l">${esc(s.name)}</td><td>${f1(s.mean)}</td><td>${f1(s.latest)}</td><td>${s.dev>0?'+':''}${f1(s.dev)}</td><td>${s.z==null?'-':f1(s.z)}</td><td>${trendTag(s.label)}${s.slope!=null?` <span class="muted">(${s.slope>0?'+':''}${f1(s.slope)}/회)</span>`:''}</td></tr>`).join('')+`</table></div>`;
  if(Object.values(cs).every(c=>c.n<5))h+=`<p class="muted">학급 z점수는 같은 교과의 학생이 5명 이상 입력되어야 계산됩니다.</p>`;
  return h;
}
function recoHtml(st){
  const r=recommend(st);
  let h=`<h2>${esc(dispName(st))} — 고교 지망 우선순위(참고)</h2>`;
  h+=`<p class="muted">적용 계열: <b>${esc(r.track.track)}</b> (${esc(r.track.reason)}) · 전략: ${({balanced:'균형(학력 수준 적합)',naesin:'내신 유리 우선',jinhak:'진학실적 중시'})[S.strategy]}</p>`;
  h+=`<div class="tablewrap"><table><tr><th>순위</th><th class="l">학교</th><th>종합</th><th>선택과목</th><th>진학실적</th><th>거리</th><th>학력수준</th><th>선호</th><th class="l">근거·유의</th></tr>`;
  let rk=0;
  for(const x of r.list){
    if(x.eligible)rk++;
    const b=v=>`<span class="bar"><i style="width:${Math.round(v)}%"></i></span> ${Math.round(v)}`;
    h+=`<tr class="${x.eligible&&rk===1?'rank1':''}"><td>${x.eligible?rk:'-'}</td><td class="l"><b>${esc(x.school.name)}</b><br><span class="muted">${x.school.type==='public'?'공립':'사립'}·${({boys:'남',girls:'여',co:'공학'})[x.school.gender]}</span></td>`+
    (x.eligible?`<td><b>${f1(x.total)}</b></td><td>${b(x.parts.elec)}</td><td>${b(x.parts.rate)}</td><td>${b(x.parts.dist)}</td><td>${b(x.parts.level)}</td><td>${b(x.parts.pref)}</td>`:`<td colspan="6" class="muted">지원 대상 아님</td>`)+
    `<td class="l">${x.reasons.map(esc).join(' · ')}${x.warns.map(w=>` <span class="tag w">${esc(w)}</span>`).join('')}</td></tr>`;
  }
  h+=`</table></div><p class="muted">※ 실제 고교 배정은 경남교육청 입학전형(지망·추첨 등)에 따릅니다. 이 표는 상담용 참고 자료이며 합격·배정을 예측하지 않습니다. 학교별 정보 미확인 항목은 중간값(50점)으로 처리됩니다.</p>`;
  return h;
}

const TABS=[['room','🏫 우리 반 한눈에'],['stu','🧑‍🎓 학생 한 명'],['cmp','⚖️ 학교 비교'],['input','📥 성적 넣기'],['schools','🏫 학교 정보'],['settings','⚙ 설정·백업']];

const isView=t=>VIEWS.some(x=>x[0]===t);

function curStudent(){return S.students.find(s=>s.id===S.selected)||null}
function studentPicker(){

function bindInput(){
  $('#app').querySelectorAll('.slist button').forEach(b=>b.onclick=()=>{S.selected=b.dataset.id;save();render()});

  $('#impParse').onclick=()=>doImportPreview(null);

    const f=el.dataset.f;let v=el.value;
    if(f==='cls'||f==='no')v=parseInt(v,10)||1;

    st[f]=v;save();render();
  });
  $('#app').querySelectorAll('[data-dist]').forEach(el=>el.onchange=()=>{if(el.value==='')delete st.dist[el.dataset.dist];else st.dist[el.dataset.dist]=parseFloat(el.value);save()});
  $('#app').querySelectorAll('[data-sc]').forEach(el=>el.onchange=()=>{

    if(el.value==='')delete st.scores[e][k];else st.scores[e][k]=clamp(parseFloat(el.value));
    save();
  });
  $('#delSt').onclick=()=>{if(confirm('이 학생의 모든 정보를 삭제할까요?')){S.students=S.students.filter(s=>s.id!==st.id);S.selected=null;save();render()}};
  $('#addSubj').onclick=()=>{const n=$('#newSubj').value.trim();if(!n)return;const ex=sortedExams();if(!ex.length){alert('먼저 시험을 추가해 주세요.');return}const e=ex[ex.length-1];st.scores[e]=st.scores[e]||{};st.scores[e][n]=st.scores[e][n]??0;save();render()};

async function readFile(f){
  const name=f.name.toLowerCase();
  try{
    if(/\.(csv|tsv|txt)$/.test(name)){doImportPreview(parseText(TT.util.decodeText(await f.arrayBuffer())));return}
    doImportPreview(await TT.file.toRows(f,{firstSheet:true}));
  }catch(err){
    $('#impPreview').innerHTML=`<div class="notice">${esc(err&&err.userMsg?err.userMsg:'파일을 읽지 못했습니다. 나이스에서 받은 엑셀(xlsx) 파일인지 확인해 주세요.')} 엑셀을 열어 표를 복사한 뒤 위 입력칸에 붙여넣어도 됩니다.</div>`;
  }
}
function doImportPreview(grid){
  if(!grid){const t=$('#impPaste').value;if(!t.trim()){$('#impPreview').innerHTML='<div class="notice">붙여넣을 내용이 없습니다.</div>';return}grid=parseText(t)}
  const p=parseGrid(grid);
  if(p.error){$('#impPreview').innerHTML=`<div class="notice">${esc(p.error)}</div>`;return}
  importState=p;
  $('#impPreview').innerHTML=`<h3>미리보기: 학생 ${p.students.length}명 · 교과 ${p.subjects.length}개</h3>
  <p class="muted">반영할 교과를 선택하세요. 성취도(A~E)만 있는 교과는 A=95, B=85, C=75, D=65, E=50으로 환산합니다(근사값).</p>
  <p>${p.subjects.map((s,i)=>`<label style="margin-right:10px"><input type="checkbox" class="impSub" value="${esc(s)}" checked> ${esc(s)}</label>`).join('')}</p>
  <div class="tablewrap"><table><tr><th>번호</th><th>성명(표시)</th>${p.subjects.slice(0,8).map(s=>`<th>${esc(s)}</th>`).join('')}</tr>`+
  p.students.slice(0,3).map(s=>`<tr><td>${s.no}</td><td>${esc(maskName(s.name))}</td>${p.subjects.slice(0,8).map(k=>`<td>${s.scores[k]??''}</td>`).join('')}</tr>`).join('')+`</table></div>
  <p><button class="btn" id="impApply">이 내용으로 저장</button></p>`;
  $('#impApply').onclick=()=>{
    let exam=$('#impExam').value;if(exam==='__c'){exam=$('#impCustom').value.trim();if(!exam){alert('시험명을 입력해 주세요.');return}}
    const picked=[...document.querySelectorAll('.impSub:checked')].map(x=>x.value);
    if(!picked.length){alert('교과를 하나 이상 선택해 주세요.');return}
    const r=applyImport(importState,exam,$('#impCls').value||1,picked);
    importState=null;save();
    if(!S.selected&&S.students.length)S.selected=S.students[0].id;
    render();
    $('#impPreview').innerHTML=`<div class="priv">저장했습니다: 새 학생 ${r.added}명, 갱신 ${r.updated}명 (${esc(exam)})</div>`;
  };
}
function loadDemo(){
  if(S.students.length&&!confirm('예시 데이터를 추가합니다. 계속할까요?'))return;
  const subj=['국어','영어','수학','사회','과학'];
  const base=[[88,90,95,85,92],[75,70,68,80,72],[92,94,88,95,90],[60,58,55,65,62],[82,78,90,76,88],[70,85,65,88,68],[95,92,97,90,96],[66,62,70,64,68]];
  const names=['가나다','라마바','사아자','차카타','파하나','도레미','솔라시','기니디'];
  const exams=['3학년 1학기 중간','3학년 1학기 기말','3학년 2학기 중간'];
  exams.forEach(e=>{if(!S.exams.includes(e))S.exams.push(e)});
  base.forEach((b,i)=>{
    const st=newStudent(9,i+1);st.name=maskName(names[i]);st.gender=i%2?'여':'남';
    st.job=['소프트웨어 개발자','간호사','변호사','','건축가','기자','의사','경찰'][i];
    exams.forEach((e,ei)=>{st.scores[e]={};subj.forEach((s,si)=>{st.scores[e][s]=clamp(b[si]+ (ei-1)*(i%3-1)*3 + ((si+i)%3-1)*2)})});
    st.area=S.areas[(i*3)%S.areas.length].id;
    S.students.push(st);
  });
  S.selected=S.students[S.students.length-8].id;save();render();
}

function quickExamList(){const set=[...EXAM_PRESETS];S.exams.forEach(e=>{if(!set.includes(e))set.push(e)});if(!set.includes(S.qExam))set.push(S.qExam);return set}
/* 명렬표의 우리 반 학년 반 목록 [{cls, n}] — 반 고르기·줄 수에 씀 */
function rosterClasses(){try{const d=TT.roster.load(),h=TT.roster.home(d),g=h&&h.grade!=null?h.grade:3;return d.classes.filter(c=>c.grade===g&&c.cls!=null&&c.students.length).map(c=>({cls:c.cls,n:c.students.length})).sort((a,b)=>a.cls-b.cls)}catch(e){return []}}
function clsField(id,v){const L=rosterClasses();if(!L.length)return `<input type="number" id="${id}" min="1" max="30" value="${v}">`;if(!L.some(c=>+c.cls===+v))L.push({cls:+v,n:0});return `<select id="${id}">${L.map(c=>`<option value="${c.cls}" ${+c.cls===+v?'selected':''}>${c.cls}반${c.n?' ('+c.n+'명)':''}</option>`).join('')}</select>`}
function quickCard(){
  const maxNo=Math.max(0,...S.students.filter(s=>String(s.cls)===String(S.qCls)).map(s=>s.no));
  const RC=rosterClasses(),rcN=(RC.find(c=>+c.cls===+S.qCls)||{}).n||0;   // PLAN_다듬기 3단계: 명렬표 반·인원을 그대로
  const rows=Math.max(rcN||S.qRows||30,maxNo,rcN&&S.qRows&&S.qRows>30?S.qRows:0);
  const subs=S.qSubjects;
  const rm=rankMap(S.qExam);
  let h=`<div class="card"><h2>빠른 입력: 번호·성명·성적</h2>
  <p class="muted">번호는 1번부터 자동으로 매겨집니다. 성명 칸부터 입력하고 Enter를 누르면 아래 칸으로 내려갑니다. 엑셀·NEIS에서 성명이나 점수 열을 복사해 칸에 붙여넣으면 아래로 채워집니다. 희망 직업·거주 구역 같은 상세 정보는 나중에 필요할 때만 입력하세요.</p>
  <div class="row"><label>반${clsField("qCls",S.qCls)}</label>
  <label>시험<select id="qExam">${quickExamList().map(e=>`<option ${e===S.qExam?'selected':''}>${esc(e)}</option>`).join('')}</select></label>
  <label>시험명 직접 추가<input type="text" id="qNewExam" placeholder="예: 3학년 2학기 기말"></label><button class="btn sec sm" id="qAddExam">시험 추가</button>
  <label>교과 추가<input type="text" id="qNewSub" placeholder="예: 도덕"></label><button class="btn sec sm" id="qAddSub">교과 추가</button></div>
  <div class="tablewrap" style="margin-top:10px"><table class="qgrid" id="qgrid"><tr><th>번호</th><th>성명</th>${subs.map((s,i)=>`<th>${esc(s)} <button class="btn sec sm" data-qdel="${i}" title="이 열 빼기">×</button></th>`).join('')}<th>평균</th><th>반 순위</th><th>전체 순위</th></tr>`;
  for(let r=1;r<=rows;r++){
    const st=S.students.find(x=>String(x.cls)===String(S.qCls)&&x.no===r);
    const sc=(st&&st.scores[S.qExam])||{};
    const o=st&&rm[st.id];
    h+=`<tr><td>${r}</td><td><input type="text" data-q="name" data-r="${r}" value="${esc(st?st.name:'')}" placeholder="${esc(st?'':rosterName(S.qCls,r))}"></td>${subs.map(s=>`<td><input type="number" min="0" max="100" step="0.1" data-q="s" data-r="${r}" data-s="${esc(s)}" value="${sc[s]??''}"></td>`).join('')}<td data-rk="avg" data-r="${r}">${o?f1(o.v):''}</td><td data-rk="c" data-r="${r}">${o?o.cr+'/'+o.cn:''}</td><td data-rk="a" data-r="${r}">${o?o.ar+'/'+o.an:''}</td></tr>`;
  }
  h+=`</table></div><p style="margin-top:8px"><button class="btn sec sm" id="qMore">+ 5줄 더 보기</button> <span class="muted">칸을 벗어나면 자동 저장됩니다. 순위는 선택한 시험의 주요교과 평균 기준이며, 전체 순위는 입력된 모든 반 학생 중 순위입니다. 성명은 저장 시 가운데 글자가 가려집니다.</span></p></div>`;
  return h;
}
function qCell(r,q,sub){const list=document.querySelectorAll(`#qgrid input[data-q="${q}"][data-r="${r}"]`);for(const el of list){if(q!=='s'||el.dataset.s===sub)return el}return null}
function refreshGridRanks(){
  const m=rankMap(S.qExam);
  document.querySelectorAll('#qgrid td[data-rk]').forEach(td=>{
    const r=+td.dataset.r;const st=S.students.find(x=>String(x.cls)===String(S.qCls)&&x.no===r);const o=st&&m[st.id];const k=td.dataset.rk;
    td.textContent=!o?'':k==='avg'?f1(o.v):k==='c'?o.cr+'/'+o.cn:o.ar+'/'+o.an;
  });
}
function commitRow(r){
  const nameEl=qCell(r,'name');if(!nameEl)return;
  const name=nameEl.value.trim();const sc={};const cleared=[];
  S.qSubjects.forEach(sub=>{const el=qCell(r,'s',sub);if(!el)return;if(el.value==='')cleared.push(sub);else{const v=parseFloat(el.value);if(!isNaN(v))sc[sub]=clamp(v)}});
  let st=S.students.find(x=>String(x.cls)===String(S.qCls)&&x.no===r);
  if(!st&&!name&&!Object.keys(sc).length)return;
  if(!st){st=newStudent(S.qCls,r);S.students.push(st)}
  if(name&&name!==st.name)st.name=S.maskNames?maskName(name):name;
  nameEl.value=st.name;
  if(Object.keys(sc).length&&!S.exams.includes(S.qExam))S.exams.push(S.qExam);
  if(Object.keys(sc).length||st.scores[S.qExam]){st.scores[S.qExam]=st.scores[S.qExam]||{};Object.assign(st.scores[S.qExam],sc);cleared.forEach(k=>delete st.scores[S.qExam][k])}
  if(!S.selected)S.selected=st.id;
  save();refreshGridRanks();
}
function bindQuick(){
  const g=$('#qgrid');
  $('#qCls').onchange=e=>{S.qCls=parseInt(e.target.value,10)||1;save();render()};
  $('#qExam').onchange=e=>{S.qExam=e.target.value;save();render()};
  $('#qAddExam').onclick=()=>{const v=$('#qNewExam').value.trim();if(!v)return;S.qExam=v;save();render()};
  $('#qAddSub').onclick=()=>{const v=$('#qNewSub').value.trim();if(!v||S.qSubjects.includes(v))return;S.qSubjects.push(v);save();render()};
  $('#qMore').onclick=()=>{S.qRows=(S.qRows||30)+5;save();render()};
  $('#app').querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>{S.qSubjects.splice(+b.dataset.qdel,1);save();render()});
  g.onchange=e=>{const t=e.target;if(t.dataset&&t.dataset.q)commitRow(+t.dataset.r)};
  g.onkeydown=e=>{
    if(e.key!=='Enter')return;const t=e.target;if(!t.dataset||!t.dataset.q)return;
    e.preventDefault();const nx=qCell(+t.dataset.r+1,t.dataset.q,t.dataset.s);
    if(nx){nx.focus();if(nx.select)nx.select()}
  };
  g.onpaste=e=>{
    const t=e.target;if(!t.dataset||!t.dataset.q)return;
    const txt=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\r/g,'');
    if(!/[\t\n]/.test(txt.trim()))return;
    e.preventDefault();
    const lines=txt.split('\n');while(lines.length&&lines[lines.length-1]==='')lines.pop();
    const r0=+t.dataset.r;const cols=['name',...S.qSubjects];
    const c0=t.dataset.q==='name'?0:1+S.qSubjects.indexOf(t.dataset.s);
    let skipped=0;
    lines.forEach((ln,i)=>{
      const r=r0+i;const nameEl=qCell(r,'name');if(!nameEl){skipped++;return}
      ln.split('\t').forEach((val,j)=>{const c=c0+j;if(c>=cols.length)return;const el=c===0?qCell(r,'name'):qCell(r,'s',cols[c]);if(el)el.value=val.trim()});
      commitRow(r);
    });
    if(skipped)alert(`표 아래쪽 ${skipped}줄은 칸이 없어 입력하지 못했습니다. '+ 5줄 더 보기'로 줄을 늘린 뒤 다시 붙여넣어 주세요.`);
  };
}

function rosterFull(cls,no){
  try{const d=TT.roster.load(),h=TT.roster.home(d),g=h&&h.grade!=null?h.grade:3;const c=d.classes.find(x=>x.grade===g&&x.cls===Number(cls)),s=c&&c.students.find(x=>x.no===Number(no));return s?s.name:'';}catch(e){return ''}
}

const ALL_SUBJ=[].concat(...Object.values(ELECTIVES));
function normSub(s){return String(s||'').replace(/Ⅱ|II/g,'2').replace(/Ⅰ|(?<![A-Za-z])I(?![A-Za-z])/g,'1').replace(/[\s·ㆍ・.,()（）\[\]]/g,'').toLowerCase();}
const SUB_IDX={};ALL_SUBJ.forEach(s=>{SUB_IDX[normSub(s)]=s;});
function findSubjects(text){
  const t=normSub(text),hit=[];
  ALL_SUBJ.slice().sort((a,b)=>normSub(b).length-normSub(a).length).forEach(s=>{const k=normSub(s);if(t.indexOf(k)>=0&&!hit.some(h=>normSub(h).indexOf(k)>=0&&normSub(h)!==k))hit.push(s);});
  return hit;
}
function needsOf(track){return (S.needs&&S.needs[track])||NEEDS[track]||null;}

/* ---------- 내신 등급대 예상 (5등급제: 1등급 10% · 2등급 34% · 3등급 66% · 4등급 90%) ---------- */
function phi(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function naesinBand(avg,sc){
  if(avg==null)return null;const exp=LEVEL_EXPECT[sc.level]||65,top=1-phi((avg-exp)/10);   // 학교 평균 학력 수준과 비교한 대략 위치
  return top<=0.10?1:top<=0.34?2:top<=0.66?3:top<=0.90?4:5;
}
/* ---------- 추천 (3지망) ---------- */
function recommend2(st,Wo){
  const an=analyze(st);const tr=resolveTrack(st,an);
  const W=Object.assign({},W_NEW,Wo||S.weights);const keys=['elec','level','dist','pref','wish','rate'];const sumW=keys.reduce((a,k)=>a+(+W[k]||0),0)||1;
  const style=st.style||'bal',strat=style==='push'?'jinhak':style==='safe'?'naesin':'balanced';
  const wish=st.wish||[],excl=st.excl||[];
  const out=S.schools.map(sc=>{
    const warns=[],chips=[];let eligible=true;
    if(st.gender==='여'&&sc.gender==='boys'){eligible=false;warns.push('남학교')}
    if(st.gender==='남'&&sc.gender==='girls'){eligible=false;warns.push('여학교')}
    if(excl.includes(sc.id)){eligible=false;warns.push('학생·학부모가 제외')}
    const need=needsOf(tr.track),el=electiveScore2(sc,need);
    if(need){if(el.known)chips.push(`희망 과목 ${el.total}개 중 ${el.offered}개 개설`);else warns.push('과목 정보 확인 필요');
      el.missing.slice(0,2).forEach(m=>warns.push(m+' 미개설'));}
    const ed=effDist(st,sc),ds=distScore(ed.km==null?'':ed.km);
    if(ds.known)chips.push(`통학 ${ed.src==='auto'?'약 ':''}${ed.km}km`);
    const lv=levelScore(sc,an.level,strat),band=naesinBand(an.level,sc);
    if(band)chips.push(`내신 ${band}등급대 예상`);
    let pf=100;
    if(st.genderPref==='co'&&sc.gender!=='co')pf-=50;if(st.genderPref==='single'&&sc.gender==='co')pf-=50;
    if(st.typePref==='public'&&sc.type!=='public')pf-=50;if(st.typePref==='private'&&sc.type!=='private')pf-=50;
    if((st.genderPref||'any')!=='any'||(st.typePref||'any')!=='any')chips.push((sc.type==='public'?'공립':'사립')+'·'+({boys:'남학교',girls:'여학교',co:'공학'})[sc.gender]);
    const wsc=wish.length?(wish.includes(sc.id)?100:40):50;if(wish.includes(sc.id))chips.push('학생 희망');
    const parts={elec:el.score,level:lv,dist:ds.score,pref:pf,wish:wsc,rate:rateScore(sc)};
    const total=keys.reduce((a,k)=>a+(+W[k]||0)*parts[k],0)/sumW;
    return{school:sc,eligible,total:eligible?total:null,parts,chips,warns,band,el};
  });
  out.sort((a,b)=>(b.eligible-a.eligible)||((b.total||0)-(a.total||0)));
  const top=out.filter(x=>x.eligible).slice(0,3);
  top.forEach((x,i)=>{if(i&&top[i-1].total-x.total<3)x.close=true;});
  return{an,track:tr,list:out,top};
}
function electiveScore2(sc,need){
  if(!need)return{score:50,known:0,total:0,offered:0,missing:[]};
  const ks=Object.keys(need);let tw=0,kw=0,ow=0,known=0,offered=0;const missing=[];
  ks.forEach(k=>{const w=need[k];tw+=w;const v=sc.electives[k];if(v==='Y'||v==='N'){kw+=w;known++;if(v==='Y'){ow+=w;offered++}else if(w>=2)missing.push(k);}});
  if(!kw)return{score:50,known:0,total:ks.length,offered:0,missing};
  const cov=kw/tw;return{score:clamp((ow/kw)*100*cov+50*(1-cov)),known,total:ks.length,offered,missing};
}

  {const why=[];if(eng!=null)why.push('영어 평균 '+f1(eng));if(kor!=null&&soc!=null)why.push('국어 '+f1(kor)+' · 사회 '+f1(soc));if(has('어문·국제 진로'))why.push('어문·국제 진로 희망');
    const g=eng!=null&&eng>=92&&(kor||0)>=85&&(soc||0)>=85&&has('어문·국제 진로'),y=(eng!=null&&eng>=88)||has('어문·국제 진로');
    L.push({k:'fl',name:'외국어고',light:g?'g':y?'y':'n',why:why.length?why:['성적 자료 부족'],info:H.fl});}

    L.push({k:'sci',name:'과학고 (2학년 지도용)',light:g?'g':y?'y':'n',why:why.length?why:['성적 자료 부족'],info:H.sci});}

  return{lanes:L,pct,src:H.src,checked:H.checked};

.rcard h4{margin:0;display:flex;gap:8px;align-items:center;font-size:17px}.rcard h4 .rk{font-size:13px;background:var(--pri);color:#fff;border-radius:999px;padding:1px 9px}
.rcard h4 .sc{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip2{font-size:12.5px;padding:2px 9px;border-radius:999px;background:#e3f4ea;color:#1e6b40;font-weight:700}
.chip2.w{background:#fff1d6;color:#8a5200}
.chip2.c{background:#eef2f7;color:#4a5560}
.sl{display:grid;grid-template-columns:96px 1fr 30px;gap:6px;align-items:center;font-size:12.5px}
.lane{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}.lane:last-child{border:0}
.lane .lt{font-size:18px;line-height:1}.lane b{display:block}.lane p{margin:2px 0 0;font-size:12.5px;color:var(--sub)}
.lane details{font-size:12px;color:var(--sub)}
.tg2{display:flex;flex-wrap:wrap;gap:4px}.tg2 button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer}.tg2 button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:800}
.scards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.scards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-size:13px}
.scard h4{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:6px}
.scard .k{color:var(--sub)}.scard.sel{border:2px solid var(--pri)}
.cmode main{font-size:17px}.cmode .rcard h4{font-size:21px}.cmode .chip2{font-size:15px}.cmode .hide-c{display:none!important}
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;align-items:center}.subnav .vl{font-size:12.5px;font-weight:800;color:var(--sub);margin-right:2px}.subnav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}.subnav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.drop{border:2px dashed var(--pri);border-radius:14px;padding:18px;text-align:center;background:#f4f8fe;cursor:pointer}
.drop.over{background:#e2ecfb}
.modal2{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal2>div{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.fixnote{font-size:12.5px;color:var(--sub);background:#f3f6f9;border-radius:10px;padding:6px 10px;margin-top:6px}
.rep{page-break-after:always;padding:6mm 4mm;font-size:12.5px}
.rep h2{margin:0 0 4px}.rep table{font-size:12px}.rep svg{max-height:55mm;width:100%}
`;

/* ---------- 화면: 🏫 우리 반 한눈에 ---------- */
function viewRoom(){
  const cls=roomCls(),L=S.students.filter(s=>+s.cls===cls).sort((a,b)=>a.no-b.no),cs=classStats();
  let h=`<div class="top2"><b style="font-size:17px">🏫 ${cls}반 한눈에</b>`+(classList().length>1?`<select id="rcls">${classList().map(c=>`<option ${c===cls?'selected':''}>${c}</option>`).join('')}</select>`:'')+
    `<span class="sp"></span><button class="btn" data-go="import">📥 일람표 넣기</button><button class="btn sec" data-go="report">🖨 상담 자료 전체 인쇄</button></div>`;
  if(!L.length){$('#app').innerHTML=h+`<div class="card"><p><b>아직 학생 성적이 없어요.</b></p><p>나이스 → 성적 → <b>학급별일람표조회(전체교과목)</b>를 엑셀로 저장해 [📥 일람표 넣기]에 끌어다 놓으면, 반·시험을 알아서 읽어 학생이 만들어집니다. 여러 시험 파일을 한꺼번에 넣어도 됩니다.</p></div>`;bindRoom();return;}
  const R=L.map(st=>{const r=recommend2(st,ui2.w);return{st,r,f:finalOrTop(st,r),cp:compass(st)};});
  const tc={},fc={};let noC=0;
  R.forEach(x=>{tc[x.r.track.track]=(tc[x.r.track.track]||0)+1;const id=x.f.ids[0];if(id)fc[id]=(fc[id]||0)+1;const c=counselCount(x.st);if(c===0)noC++;});
  h+=`<div class="top2">`+Object.keys(tc).map(t=>`<span class="pillx" style="background:${TRACK_COLOR[t]}22;color:${TRACK_COLOR[t]}">${esc(t)} ${tc[t]}</span>`).join('')+
    `<span class="pillx">1지망 ${Object.keys(fc).sort((a,b)=>fc[b]-fc[a]).map(id=>esc(shortName(id))+' '+fc[id]).join(' · ')}</span>`+
    `<span class="pillx">지망 확정 ${R.filter(x=>x.f.fixed).length}/${R.length}</span>`+(noC?`<span class="pillx" style="background:#fff1d6;color:#8a5200">진로 상담 기록 없음 ${noC}</span>`:'')+`</div>`;
  h+=`<div class="room">`+R.map(x=>{const st=x.st,an=x.r.an,tr=an.trendLabel;
    return `<button class="tile" data-stu="${st.id}" style="--tc:${TRACK_COLOR[x.r.track.track]||'#ccc'}">${x.f.fixed?'<span class="ok">✓</span>':''}
      <span class="n1"><b>${st.no}</b><span>${esc(nameOf(st))}</span><small>${esc(x.r.track.track)}</small></span>
      <span class="n2">${x.f.ids.length?'1지망 '+esc(shortName(x.f.ids[0]))+(x.f.ids[1]?' · '+esc(shortName(x.f.ids[1])):''):'성적 필요'}</span>
      <span class="n3"><span class="tr ${tr==='상승'?'u':tr==='하락'?'d':''}">${tr==='상승'?'↗':tr==='하락'?'↘':tr==='유지'?'→':'·'}</span>${an.level!=null?f1(an.level):'-'}<span class="dots" title="나침반: 일반고·특성화·외고·과학고">${x.cp.lanes.slice(0,4).map(l=>LIGHT[l.light]).join('')}</span></span></button>`;}).join('')+`</div>`;
  h+=`<p class="muted" style="margin-top:8px">※ 배정 예측이 아니라 학생에게 맞는 학교 순서입니다. 마산 2학군은 지망·추첨으로 배정합니다. 타일을 누르면 학생 한 명 화면으로 갑니다.</p>`;
  $('#app').innerHTML=h;bindRoom();fitRoom();
}
function fitRoom(){const g=document.querySelector('.room');if(!g)return;const n=g.children.length,avail=(document.querySelector('main').clientHeight||600)-g.offsetTop+document.querySelector('main').offsetTop-30,w=g.clientWidth;
  for(let cols=4;cols<=10;cols++){const rows=Math.ceil(n/cols),hh=(avail-(rows-1)*6)/rows;if(w/cols<120)break;if(hh>=62||cols===10){g.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;g.querySelectorAll('.tile').forEach(t=>t.style.minHeight=Math.max(58,Math.min(96,hh))+'px');return;}}}
function bindRoom(){
  const r=$('#rcls');if(r)r.onchange=()=>{S.roomCls=+r.value;save();render()};
  $('#app').querySelectorAll('[data-stu]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.stu;S.tab='stu';save();render()});
  bindGo();
}
function bindGo(){$('#app').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='import')openImport();else if(g==='report')printReports(b.dataset.one?[curStudent()]:null);});}

  else{

  }
  L1+=`</div>`;
  const B=bonusOf(st);if(B)L1+=`<div class="card"><h2>🏅 가산점</h2><p>가산점 ${esc(String(B.add!=null?B.add:'-'))} · 합계 ${esc(String(B.total!=null?B.total:'-'))}</p></div>`;

    <div class="chips">${x.chips.slice(0,4).map(c=>`<span class="chip2">${esc(c)}</span>`).join('')}${x.warns.slice(0,3).map(c=>`<span class="chip2 w">${esc(c)}</span>`).join('')}</div></div>`).join('');
  if(r.top.some(x=>x.close))M+=`<p class="fixnote">점수 차가 3점 안인 학교는 '거의 같음'이에요 — 통학·분위기로 학생과 함께 고르세요.</p>`;
  const rest=r.list.filter(x=>x.eligible&&!r.top.includes(x));if(rest.length)M+=`<p class="muted" style="margin:4px 0">그 밖: ${rest.map(x=>esc(x.school.name)+' '+Math.round(x.total)).join(' · ')}${r.list.some(x=>!x.eligible)?' · 대상 아님: '+r.list.filter(x=>!x.eligible).map(x=>esc(x.school.name)).join(', '):''}</p>`;
  M+=`<h3>무엇을 더 중요하게 볼까요? <button class="btn sec sm" id="wreset">처음 추천으로</button></h3>`+
    ['elec','level','dist','pref','wish'].map(k=>`<div class="sl"><span>${W_LABEL[k]}</span><input type="range" min="0" max="50" step="5" data-wk="${k}" value="${W[k]}"><span>${W[k]}</span></div>`).join('')+

    <button class="btn sm" id="finTop">추천대로 확정</button></div><input type="text" id="finNote" placeholder="추천과 다르게 정한 이유 (선택)" value="${esc(st.finalNote||'')}" style="width:100%;margin-top:6px"></div></div>`;
  // 오른쪽: 나침반 + 학생 정보
  let Rr=`<div class="card"><h2>🧭 고입 나침반 <span class="muted" style="font-weight:400">참고 의견</span></h2>`+cp.lanes.map(l=>`<div class="lane"><span class="lt">${LIGHT[l.light]}</span><div><b>${esc(l.name)}</b><p>${l.why.map(esc).join(' · ')}</p><details><summary>안내</summary>${esc(l.info)}</details></div></div>`).join('')+
    `<p class="muted" style="margin:6px 0 0">🟢 이야기해 볼 만함 · 🟡 살펴볼 만함 · ⚪ 해당 적음 — 결정이 아니라 상담 출발점이에요. 기준 확인일 ${esc(cp.checked)}</p></div>`;
  const cc=counselCount(st);

    <div class="tg2" style="margin-bottom:6px">${TRAITS.map(t=>`<button data-trait="${esc(t)}" class="${(st.traits||[]).includes(t)?'on':''}">${esc(t)}</button>`).join('')}</div>
    <label style="font-size:12.5px"><input type="checkbox" id="cutRisk" ${st.cutRisk?'checked':''}> 학군 합격선 근처 성적(선생님 판단)</label>

function bindStu(st,L){
  const p=$('#pick2');if(p)p.onchange=()=>{S.selected=p.value;save();render()};
  $('#app').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const i=L.indexOf(st)+(+b.dataset.mv);if(L[i]){S.selected=L[i].id;save();render();}});
  $('#cmode').onclick=()=>{ui2.cmode=!ui2.cmode;document.body.classList.toggle('cmode',ui2.cmode);render()};
  $('#app').querySelectorAll('[data-wk]').forEach(el=>el.oninput=()=>{ui2.w=Object.assign({},W_NEW,ui2.w||S.weights);ui2.w[el.dataset.wk]=+el.value;render()});
  $('#wreset').onclick=()=>{ui2.w=null;render()};
  $('#app').querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{st.style=b.dataset.style;save();render()});
  $('#app').querySelectorAll('[data-fin]').forEach(el=>el.onchange=()=>{st.final=st.final||[];st.final[+el.dataset.fin]=el.value;save();render()});
  $('#finTop').onclick=()=>{const r=recommend2(st,ui2.w);st.final=r.top.map(x=>x.school.id);save();render();};
  const fn=$('#finNote');if(fn)fn.onchange=()=>{st.finalNote=fn.value.trim().slice(0,200);save()};
  $('#app').querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{st.traits=st.traits||[];const t=b.dataset.trait,i=st.traits.indexOf(t);if(i>=0)st.traits.splice(i,1);else st.traits.push(t);save();render()});
  const ib=$('#infoBox');if(ib)ib.ontoggle=()=>{ui2.infoOpen=ib.open};
  const cr=$('#cutRisk');if(cr)cr.onchange=()=>{st.cutRisk=cr.checked;save();render()};
  $('#app').querySelectorAll('[data-f2]').forEach(el=>el.onchange=()=>{st[el.dataset.f2]=el.value;save();render()});
  $('#app').querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{const id=b.dataset.wish;st.wish=st.wish||[];st.excl=st.excl||[];
    if(st.wish.includes(id)){st.wish=st.wish.filter(x=>x!==id);st.excl.push(id);}else if(st.excl.includes(id)){st.excl=st.excl.filter(x=>x!==id);}else st.wish.push(id);save();render()});
  const tc=$('#toCounsel');if(tc)tc.onclick=()=>{const r=recommend2(st,ui2.w),tops=r.top.map(x=>x.school.name).join('·');
    let h=null;try{h=TT.roster.home();}catch(e){}
    if(!h||+h.cls!==+st.cls){alert('상담일지는 우리 반(★) 학생만 쓸 수 있어요.');return;}
    location.href='../tardy/?tab=counsel&new='+encodeURIComponent(st.no)+'&trig='+encodeURIComponent('진로·진학 상담 (추천: '+tops+')');};
}

/* ---------- 화면: ⚖️ 학교 비교 ---------- */
function viewCmp(){
  const sel=ui2.cmp,need=[...new Set([].concat(...Object.keys(NEEDS).map(t=>Object.keys(needsOf(t)||{}))))];
  const al=S.alumni||[];
  let h=`<div class="top2"><b style="font-size:17px">⚖️ 마산 2학군 8개교</b><span class="muted">두 학교를 누르면 나란히 비교해요</span><span class="sp"></span><button class="btn sec sm" id="toSchools">학교 정보 고치기·선택과목 등록 →</button></div><div class="scards">`;
  h+=S.schools.map(sc=>{const Y=Object.values(sc.electives||{}).filter(v=>v==='Y').length,K=Object.keys(sc.electives||{}).length,n=al.filter(a=>a.school===sc.id).length;
    return `<div class="scard ${sel.includes(sc.id)?'sel':''}" data-sc="${sc.id}"><h4>${esc(sc.name)}<span class="muted">${sc.type==='public'?'공립':'사립'}·${({boys:'남',girls:'여',co:'공학'})[sc.gender]}</span></h4>
      <div><span class="k">유형</span> ${esc(sc.kind||'일반고')} · <span class="k">학력</span> ${'●'.repeat(5-(sc.level||3))}${'○'.repeat((sc.level||3)-1)}</div>
      <div><span class="k">4년제 진학률</span> ${sc.rate4}%</div>
      <div><span class="k">선택과목</span> ${K?`개설 ${Y} · 확인 ${K}과목`:'<span style="color:#8a5200">미등록</span>'}${sc.checked?` <span class="muted">(${esc(sc.checked)})</span>`:''}</div>
      ${n?`<div><span class="k">우리 학교 졸업생</span> ${n}명</div>`:''}
      ${sc.note?`<div class="muted">${esc(sc.note)}</div>`:''}
      ${sc.url?`<div><a href="${esc(sc.url)}" target="_blank" rel="noopener">누리집 ↗</a></div>`:''}</div>`;}).join('')+`</div>`;
  if(sel.length===2){const a=schoolById(sel[0]),b=schoolById(sel[1]);
    const col=sc=>{const f=v=>v==='Y'?'○':v==='N'?'×':'?';return `<div><h3 style="margin:0 0 6px">${esc(sc.name)} <span class="muted">${sc.type==='public'?'공립':'사립'}·${({boys:'남',girls:'여',co:'공학'})[sc.gender]} · 4년제 ${sc.rate4}%</span></h3><div class="chips">${need.map(k=>{const v=sc.electives[k];return `<span class="chip2 ${v==='Y'?'':v==='N'?'w':'c'}">${f(v)} ${esc(k)}</span>`}).join('')}</div></div>`;};
    h+=`<div class="card" style="margin-top:10px"><h2>${esc(a.name)} ↔ ${esc(b.name)} <span class="muted" style="font-weight:400">진로별 필요 과목 개설 (○ 개설 · × 미개설 · ? 미확인)</span></h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${col(a)}${col(b)}</div></div>`;}
  $('#app').innerHTML=h;
  $('#app').querySelectorAll('[data-sc]').forEach(c=>c.onclick=e=>{if(e.target.closest('a'))return;const id=c.dataset.sc,i=sel.indexOf(id);if(i>=0)sel.splice(i,1);else{sel.push(id);if(sel.length>2)sel.shift();}render()});
  $('#toSchools').onclick=()=>{S.tab='schools';save();render()};
}

/* ---------- 9단계: 8개교 선택과목 한꺼번에 ---------- */

  return `<div class="card"><h2>📚 8개교 선택과목 한꺼번에 등록</h2>
  <p class="muted">① 서식(CSV)을 내려받아 학교별 교육과정 편성표를 보고 개설 과목 칸에 O(미개설은 X)를 적어 넣기 → 엑셀로 저장한 그대로 끌어다 놓기<br>② 또는 학교 누리집의 편성표 표를 복사해 아래에 붙여넣기 → 과목 이름을 찾아 자동 체크</p>
  <div class="row"><button class="btn sec sm" id="tplDl">📄 서식 내려받기</button><label class="btn sec sm" style="display:inline-block">📥 채운 서식 넣기<input type="file" id="tplIn" accept=".csv,.xlsx,.xls,.txt" style="display:none"></label>
  <button class="btn sec sm" id="schExp">📤 학교 정보 내보내기(공유용, 학생 정보 없음)</button><label class="btn sec sm" style="display:inline-block">📥 공유 파일 불러오기<input type="file" id="schImp" accept=".json" style="display:none"></label></div>
  <div class="row" style="margin-top:10px"><label>편성표 붙여넣을 학교<select id="pasteSc">${S.schools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
  <label><span>목록에 없는 과목</span><span><input type="checkbox" id="pasteN"> 미개설(×)로 표시</span></label></div>
  <textarea id="pasteTx" placeholder="편성표(표 전체)를 복사해서 붙여넣기 — 과목 이름만 찾아 씁니다"></textarea><button class="btn" id="pasteGo">과목 찾아 체크</button><div id="bulkMsg"></div></div>`;
}
function bindBulk(){
  const msg=t=>{const m=$('#bulkMsg');if(m)m.innerHTML=`<div class="priv">${t}</div>`;};
  $('#tplDl').onclick=()=>{const head=['교과','과목'].concat(S.schools.map(s=>s.name));const lines=[head];
    for(const [cat,list] of Object.entries(ELECTIVES))list.forEach(e=>lines.push([cat,e].concat(S.schools.map(s=>{const v=s.electives[e];return v==='Y'?'O':v==='N'?'X':'';}))));
    download('고교_선택과목_서식.csv','﻿'+lines.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv');};
  $('#tplIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;let rows;
    try{rows=/\.(csv|txt)$/i.test(f.name)?parseText(TT.util.decodeText(await f.arrayBuffer())):await TT.file.toRows(f,{firstSheet:true});}catch(x){alert('파일을 읽지 못했어요.');return;}
    const hi=rows.findIndex(r=>r.some(c=>S.schools.some(s=>String(c).replace(/\s/g,'').indexOf(s.name.replace(/고$/,''))>=0)));if(hi<0){alert('학교 이름이 있는 머리글 줄을 찾지 못했어요.');return;}
    const head=rows[hi].map(c=>String(c||'').replace(/\s/g,'')),colOf={};S.schools.forEach(s=>{const j=head.findIndex(c=>c&&(c===s.name||c.indexOf(s.name.replace(/고$/,''))>=0));if(j>=0)colOf[s.id]=j;});
    let n=0;const today=new Date().toISOString().slice(0,10);
    rows.slice(hi+1).forEach(r=>{const subj=r.map(c=>SUB_IDX[normSub(c)]).find(Boolean);if(!subj)return;
      Object.keys(colOf).forEach(id=>{const v=String(r[colOf[id]]==null?'':r[colOf[id]]).trim().toUpperCase();const sc=schoolById(id);
        if(/^(O|○|◯|Y|1|V|✓|개설)/.test(v)){sc.electives[subj]='Y';n++;}else if(/^(X|×|N|0|미개설)/.test(v)){sc.electives[subj]='N';n++;}});});
    const done=Object.keys(colOf).filter(id=>rows.slice(hi+1).some(r=>String(r[colOf[id]]==null?'':r[colOf[id]]).trim()));done.forEach(id=>schoolById(id).checked=today);save();msg(`${done.length}개교 · ${n}칸을 등록했어요.`);};
  $('#pasteGo').onclick=()=>{const sc=schoolById($('#pasteSc').value),t=$('#pasteTx').value;if(!t.trim())return;const hit=findSubjects(t);
    hit.forEach(s=>sc.electives[s]='Y');if($('#pasteN').checked)ALL_SUBJ.forEach(s=>{if(!hit.includes(s))sc.electives[s]='N';});
    sc.checked=new Date().toISOString().slice(0,10);save();msg(`${esc(sc.name)}: 과목 ${hit.length}개를 찾아 ○로 표시했어요 — ${hit.map(esc).join(', ')}`);};
  $('#schExp').onclick=()=>download('고교정보_공유.json',JSON.stringify({app:'ssamnote-advisor-schools',v:1,at:new Date().toISOString(),schools:S.schools,needs:S.needs||null,hsInfo:S.hsInfo||null}),'application/json');
  $('#schImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.schools))throw 0;
    if(!confirm('학교 정보(선택과목·진학률·메모)를 이 파일 내용으로 바꿀까요? 학생 자료는 그대로입니다.'))return;S.schools=o.schools;if(o.needs)S.needs=o.needs;if(o.hsInfo)S.hsInfo=o.hsInfo;save();render();}catch(x){alert('공유 파일이 아니에요.');}};
}

/* ---------- 8단계: 일람표 여러 개 한꺼번에 ---------- */
function detectMeta(rows,fname){
  const top=(rows.slice(0,8).map(r=>r.join(' ')).join(' ')+' '+fname).replace(/\s+/g,' ');
  const g=(top.match(/([1-3])\s*학년/)||[])[1],c=(top.match(/(\d{1,2})\s*반/)||[])[1],sem=(top.match(/([12])\s*학기/)||[])[1];
  const kind=/중간|1회\s*고사|1차\s*지필/.test(top)?'중간':/기말|2회\s*고사|2차\s*지필/.test(top)?'기말':'';
  let exam='';if(g&&sem)exam=`${g}학년 ${sem}학기 ${kind||'성적'}`;
  return{cls:c?+c:null,exam:exam};
}
function openImport(){
  ui2.imp=[];const box=document.createElement('div');box.className='modal2';box.id='impM';
  box.innerHTML=`<div><div class="top2"><b style="font-size:17px">📥 성적일람표 넣기</b><span class="sp"></span><button class="btn sec sm" id="impX">닫기</button></div>
  <div class="drop" id="drop">나이스 <b>학급별일람표조회(전체교과목)</b> 엑셀 파일을 여기에 끌어다 놓기 (여러 개 한꺼번에)<br><small>또는 눌러서 파일 고르기 · 반·학기·시험은 파일에서 알아서 읽어요</small><input type="file" id="impFs" multiple accept=".xlsx,.xls,.csv,.tsv,.txt,.html,.htm" style="display:none"></div>
  <div id="impList" style="margin-top:10px"></div></div>`;
  document.body.appendChild(box);
  const close=()=>box.remove();$('#impX').onclick=close;box.onclick=e=>{if(e.target===box)close();};
  const dz=$('#drop');dz.onclick=()=>$('#impFs').click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');addFiles(e.dataTransfer.files)};
  $('#impFs').onchange=e=>addFiles(e.target.files);
}
async function addFiles(fs){
  for(const f of fs){let rows;try{rows=/\.(csv|tsv|txt)$/i.test(f.name)?parseText(TT.util.decodeText(await f.arrayBuffer())):await TT.file.toRows(f,{firstSheet:true});}catch(e){ui2.imp.push({name:f.name,err:'파일을 읽지 못했어요'});continue;}
    const p=parseGrid(rows),m=detectMeta(rows,f.name);
    ui2.imp.push(p.error?{name:f.name,err:p.error}:{name:f.name,p:p,cls:m.cls||roomCls(),exam:m.exam||'3학년 2학기 기말',auto:!!(m.cls&&m.exam)});}
  drawImp();
}
function drawImp(){
  const L=ui2.imp,ex=[...new Set(EXAM_PRESETS.concat(S.exams).concat(L.map(x=>x.exam).filter(Boolean)))];
  $('#impList').innerHTML=!L.length?'':`<div class="tablewrap"><table><tr><th class="l">파일</th><th>반</th><th>시험</th><th>학생</th><th>교과</th><th></th></tr>`+L.map((x,i)=>x.err?`<tr><td class="l">${esc(x.name)}</td><td colspan="5" class="l" style="color:var(--bad)">${esc(x.err)}</td></tr>`:
    `<tr><td class="l">${esc(x.name)}${x.auto?' <span class="tag g">자동 인식</span>':' <span class="tag w">확인</span>'}</td><td><input type="number" min="1" max="20" data-ic="${i}" value="${x.cls}" style="width:60px"></td>
    <td><select data-ie="${i}">${ex.map(e=>`<option ${e===x.exam?'selected':''}>${esc(e)}</option>`).join('')}</select></td><td>${x.p.students.length}명</td><td class="l" style="font-size:12px">${x.p.subjects.map(esc).join(', ')}</td><td><button class="btn red sm" data-idel="${i}">빼기</button></td></tr>`).join('')+`</table></div>
    <p class="muted">같은 반·같은 시험을 다시 넣으면 그 시험 점수만 새로 바뀌어요. 이름은 저장하지 않고 학급 명렬표의 이름을 보여 줘요(명렬표에 없으면 가린 이름).</p>
    <button class="btn" id="impAll">모두 넣기 (${L.filter(x=>!x.err).length}개)</button>`;
  document.querySelectorAll('[data-ic]').forEach(el=>el.onchange=()=>{L[+el.dataset.ic].cls=+el.value||1});
  document.querySelectorAll('[data-ie]').forEach(el=>el.onchange=()=>{L[+el.dataset.ie].exam=el.value});
  document.querySelectorAll('[data-idel]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.idel,1);drawImp()});
  const a=$('#impAll');if(a)a.onclick=()=>{let ad=0,up=0;L.filter(x=>!x.err).forEach(x=>{const r=applyImport(x.p,x.exam,x.cls,x.p.subjects);ad+=r.added;up+=r.updated;});
    S.students.forEach(st=>{if(rosterFull(st.cls,st.no))st.name='';});   // 명렬표에 있는 학생은 이름을 따로 저장하지 않음
    save();const m=$('#impM');if(m)m.remove();S.tab='room';render();TT.ui.toast(`성적을 넣었어요: 새 학생 ${ad}명 · 갱신 ${up}건`);};
}

/* ---------- 13단계: 상담 자료 인쇄 ---------- */
function printReports(list){
  list=list&&list[0]?list:S.students.filter(s=>+s.cls===roomCls()).sort((a,b)=>a.no-b.no);
  const pa=$('#printArea');
  pa.innerHTML=list.map(st=>{const r=recommend2(st),an=r.an,cp=compass(st),F=(st.final||[]).filter(Boolean),ex=sortedExams();
    return `<div class="rep"><h2>${st.cls}-${st.no} ${esc(rosterFull(st.cls,st.no)||st.name||'')} · 고교 진학 상담 자료</h2>
    <p>주요교과 평균 <b>${f1(an.level)}</b> · 추세 ${esc(an.trendLabel)} · 희망 계열 ${esc(r.track.track)} · 강점 ${an.strengths.map(s=>esc(s.name)).join(', ')||'-'} · 보완 ${an.weaknesses.map(s=>esc(s.name)).join(', ')||'-'}</p>
    ${ex.length?lineChart(ex,[{name:'평균',color:'#111827',bold:true,vals:ex.map(e=>examAvg(st,e))}]):''}
    <h3>1·2·3지망 추천 (학생에게 맞는 순서)</h3><table><tr><th>지망</th><th class="l">학교</th><th class="l">이유</th><th class="l">살펴볼 점</th></tr>${r.top.map((x,k)=>`<tr><td>${k+1}</td><td class="l">${esc(x.school.name)}</td><td class="l">${x.chips.map(esc).join(' · ')}</td><td class="l">${x.warns.map(esc).join(' · ')}</td></tr>`).join('')}</table>
    ${F.length?`<p><b>확정 지망</b>: ${F.map((id,k)=>(k+1)+'지망 '+esc((schoolById(id)||{}).name||'')).join(' · ')}${st.finalNote?' — '+esc(st.finalNote):''}</p>`:''}
    <h3>고입 나침반 (참고 의견)</h3><table>${cp.lanes.map(l=>`<tr><td>${LIGHT[l.light]}</td><td class="l"><b>${esc(l.name)}</b></td><td class="l">${l.why.map(esc).join(' · ')}</td></tr>`).join('')}</table>
    <p>선생님 의견: ______________________________________________________________</p>
    <p class="muted">※ 마산 2학군 평준화 일반고는 지망·추첨으로 배정되며, 이 자료는 배정을 예측하지 않습니다. 개인정보가 담긴 자료이니 상담 뒤 안전하게 보관·파기해 주세요.</p></div>`;}).join('');
  setTimeout(()=>window.print(),80);
}

  <div class="row"><label>연도<input type="number" id="alY" value="${new Date().getFullYear()}"></label><label>학교<select id="alS">${S.schools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>계열<select id="alT">${TRACKS.map(t=>`<option>${t}</option>`).join('')}</select></label><label>소감(선택)<input type="text" id="alN" maxlength="80"></label><button class="btn sm" id="alAdd">추가</button></div>
  ${al.length?`<div class="tablewrap" style="margin-top:6px"><table><tr><th>연도</th><th>학교</th><th>계열</th><th class="l">소감</th><th></th></tr>${al.map((a,i)=>`<tr><td>${a.y}</td><td>${esc((schoolById(a.school)||{}).name||'')}</td><td>${esc(a.t)}</td><td class="l">${esc(a.n||'')}</td><td><button class="btn red sm" data-aldel="${i}">×</button></td></tr>`).join('')}</table></div>`:''}</div>`;

function bindExtra(){
  const mv=$('#mView');if(mv)mv.onchange=()=>{S.maskView=mv.checked;save()};
  $('#app').querySelectorAll('[data-hs]').forEach(el=>el.onchange=()=>{S.hsInfo=Object.assign({},HS_DEFAULT,S.hsInfo||{});S.hsInfo[el.dataset.hs]=el.value.trim();save()});
  $('#app').querySelectorAll('[data-need]').forEach(el=>el.onchange=()=>{const o={};el.value.split(/\n/).forEach(l=>{const m=l.match(/^(.+?)\s*[:：]\s*([12])\s*$/);if(m){const s=SUB_IDX[normSub(m[1])]||m[1].trim();o[s]=+m[2];}});S.needs=S.needs||{};S.needs[el.dataset.need]=o;save();});
