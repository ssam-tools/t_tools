<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../../shared/demo.js"></script><!-- 🎬 견본 모드(?demo=1): 저장소를 읽기 전에 맨 먼저 -->
<style id="ttKeepAll">html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}</style>
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://open.neis.go.kr https://api.open-meteo.com https://air-quality-api.open-meteo.com; form-action 'none'; base-uri 'none'">
<!-- v2.38.1 빠르게 열기: 화면 파일을 처음부터 한꺼번에 받아 둠 (아래 <script src>를 바꾸면 여기도 같이) -->
<link rel="preload" as="script" href="../../shared/early.js">
<link rel="preload" as="script" href="../../shared/tools.js">
<link rel="preload" as="script" href="../../shared/tt.js">
<link rel="preload" as="script" href="../../shared/clean.js">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/ssambi3-192.png">
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/tt.css">
<title>학생 카드 · 쌤 노트</title>
<!--
  학생 카드 (개편 10단계): 학생 한 명의 기록 · 출결 · 상담 · 제출물을 한 화면에 모읍니다. 읽기만 하고, 고치기는 각 도구에서.
  · 읽는 곳: 학생 기록 "tt_notes_v1"(TT.notes) · 출결·상담 "tt_guide_v1"(우리 반만) · 제출물 "tt_submit_v1" · 명렬표 "tt_roster_v1"
  · 주소: ?c=학급id&no=번호 (학생 메뉴의 이름 찾기 · Ctrl+K 에서 엶)
  · 이 기기 안에서만 읽습니다. 교실 기기에서는 열리지 않습니다(학생 정보).
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap}
  .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .who .nm{font-size:clamp(22px,3.6vh,30px);font-weight:900;color:var(--t-student,#6b46c1)}
  .who .meta{font-size:14px;color:var(--sub)}
  .memo{font-size:14px;background:var(--t-student-soft,#f1ecfb);border-radius:10px;padding:6px 10px;color:var(--ink)}
  main{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:10px;padding:10px!important;min-height:0}
  .bx{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;background:var(--card)}
  .bx h2{font-size:15px;display:flex;align-items:center;gap:6px}.bx h2 .n{font-size:12px;font-weight:800;border-radius:999px;padding:0 8px;background:var(--t-chip,#eceff3);color:var(--t-chip-ink,#4a5560)}
  .bx h2 a{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
  .ls{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px}
  .r{display:flex;gap:8px;font-size:14px;line-height:1.5;border-bottom:1px solid var(--t-chip,#eceff3);padding:2px 0}
  .r .d{flex:none;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:3.6em}
  .r .a{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--t-chip,#eceff3);color:var(--t-chip-ink,#4a5560);align-self:flex-start;margin-top:2px}
  .r .t{flex:1;min-width:0}
  .sum{display:flex;gap:6px;flex-wrap:wrap}.sum span{font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--t-chip,#eceff3)}
  .sum .bad{background:var(--danger-soft);color:var(--danger)}.sum .ok{background:var(--ok-soft);color:var(--ok)}
  .y{color:var(--ok);font-weight:800}.no{color:var(--danger);font-weight:800}
  .none{color:var(--sub);font-size:13.5px;padding:8px 2px}
  .nav2{display:flex;gap:4px}
  .pick{display:flex;gap:6px;align-items:center}
  /* 반 전체 보기 (첫 화면) */
  #ov{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px}
  #ov[hidden],main[hidden]{display:none!important}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .chips button b{font-weight:800;margin-left:2px}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(64px,1fr);gap:8px}
  .tc{position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 10px;cursor:pointer;font:inherit;text-align:left;color:var(--ink);min-width:0}
  .tc:hover{border-color:var(--accent)}
  .tc .nm2{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tc .nm2 small{font-size:12px;font-weight:600;color:var(--sub);margin-right:5px}
  .tc .bd{display:flex;gap:4px;flex-wrap:wrap;font-size:11.5px;min-height:18px}
  .tc .bd span{border-radius:999px;padding:0 6px;background:var(--t-chip,#eceff3);color:var(--t-chip-ink,#4a5560);font-weight:700}
  .tc .bd .bad{background:var(--danger-soft);color:var(--danger)}
  .tc.f0{border-style:dashed;border-color:var(--accent)}
  .tc.fl{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--danger)}
  .tc.off{opacity:.3}
  .tc .qa{position:absolute;top:4px;right:4px;border:0;background:var(--accent);color:#fff;border-radius:8px;width:28px;height:28px;font-size:14px;cursor:pointer;display:none}
  .tc:hover .qa,.tc:focus-within .qa{display:block}
  @media (max-width:760px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:64px} .tc .qa{display:block} }
  @media (max-width:760px){ main{grid-template-columns:1fr;grid-template-rows:none} body{height:auto;min-height:100dvh;overflow:auto} .ls{max-height:none} }
  @media print{ .bar,.nav2{display:none!important} main{display:grid!important} }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../#student">← 쌤 노트</a>
    <h1>📇 학생 카드</h1>
  </div>
  <div class="bar">
    <button class="btn" id="all" title="반 전체 보기">▦ 전체</button>
    <span class="pick"><select id="clsSel" aria-label="학급 선택"></select><select id="stuSel" aria-label="학생 선택"></select><button class="btn" id="pk" title="번호 칸에서 학생 고르기">👆</button></span>
    <span class="nav2"><button class="btn" id="prev" title="앞 번호">◀</button><button class="btn" id="next" title="다음 번호">▶</button></span>
    <button class="btn primary" id="addRec">✍️ 기록 더하기</button>
    <button class="btn" id="print">🖨 인쇄</button>
  </div>
</header>
<section class="who" id="who"></section>
<section id="ov" hidden><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
<main class="panel" id="m">
  <section class="bx" id="bRec"></section>
  <section class="bx" id="bAtt"></section>
  <section class="bx" id="bCns"></section>
  <section class="bx" id="bSub"></section>
</main>
<footer><span class="priv">🔒 이 기기 안의 기록만 모아 보여 줍니다. 밖으로 보내지 않습니다.</span><span>읽기 전용 · 고치기는 각 도구에서</span></footer>
<script src="../../shared/tools.js"></script>
<script src="../../shared/tt.js"></script>
<script src="../../shared/clean.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function md(s){ var a = String(s || "").split("-"); return a.length > 2 ? (+a[1]) + "/" + (+a[2]) : esc(s); }
  var TN = function(id, fb){ return typeof ttTool === "function" && ttTool(id) ? ttTool(id).name : fb; };
  var q = new URLSearchParams(location.search), cls = null, st = null;
  var AK = {sick: "병결", ok: "인정결", early: "인정조퇴", late: "인정지각", Lu: "지각"};
  function kindOf(r){ return !r ? "" : r.t === "L" ? (r.o ? "late" : "Lu") : (r.k === "ok" || r.k === "early") ? r.k : "sick"; }

  function fillStu(){
    var sel = $("stuSel"); sel.innerHTML = "";
    (cls ? cls.students : []).forEach(function(s){ var o = document.createElement("option"); o.value = s.no; o.textContent = s.no + "번 " + s.name; sel.appendChild(o); });
    var want = q.get("no"); q.delete("no");
    var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "▦ 반 전체"; sel.insertBefore(o0, sel.firstChild);
    st = cls ? (cls.students.filter(function(s){ return String(s.no) === String(want); })[0] || (st && cls.students.filter(function(s){ return s.no === st.no; })[0]) || null) : null;   // 처음에는 반 전체
    sel.value = st ? st.no : "";
    draw();
  }
  $("pk").onclick = function(){ TT.ui.pickStudent({cls: cls && cls.id, sel: st && st.no, title: "학생 카드 — 누구를 볼까요?"}, function(r){ var cs = $("clsSel"); if(cs.value !== r.cls.id){ cs.value = r.cls.id; cs.dispatchEvent(new Event("change")); } $("stuSel").value = r.no; $("stuSel").onchange(); }); };   // PLAN_다듬기 4단계
  $("all").onclick = function(){ st = null; $("stuSel").value = ""; draw(); };
  $("stuSel").onchange = function(){ st = cls.students.filter(function(s){ return String(s.no) === this.value; }, this)[0] || null; draw(); };
  function move(k){ if(!cls || !st) return; var i = cls.students.indexOf(st), j = i + k; if(j < 0 || j >= cls.students.length) return; st = cls.students[j]; $("stuSel").value = st.no; draw(); }
  $("prev").onclick = function(){ move(-1); }; $("next").onclick = function(){ move(1); };
  $("addRec").onclick = function(){ if(cls && st) TT.notes.quick({cls: cls.id, nos: [st.no], src: "학생 카드"}); };
  $("print").onclick = function(){ window.print(); };
  window.addEventListener("storage", draw);
  window.addEventListener("focus", draw);

  /* ── 반 전체 보기: 학생마다 기록·출결·상담·제출물 수, 살펴볼 학생은 테두리로 ── */
  var flt = "all";
  function ymd(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function overview(){
    document.title = "학생 카드 · 쌤 노트";
    var N = TT.notes, D = N.load(), home = TT.roster.home(), isHome = home && home.id === cls.id, G = isHome ? TT.store.get("tt_guide_v1", null) : null;
    var S = TT.store.get("tt_submit_v1", null), I = S && S.items ? S.items.filter(function(it){ return it.cls === cls.id; }) : [];
    var now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7)); var w0 = ymd(mon);
    var JS = null, code = cls.grade != null && cls.cls != null ? cls.grade * 100 + cls.cls : null; try{ JS = TT.store.get("tt_journal_v1", null); }catch(e){}
    var CLQ = {}; try{ if(window.TT_CLEAN && isHome) TT_CLEAN.pending(cls.id).forEach(function(p){ CLQ[p.no] = p.items.length; }); }catch(e){}
    var L = cls.students.map(function(s){
      var k = N.key(cls, s), no = String(s.no), x = {s: s, rec: 0, att: 0, wk: 0, cns: 0, miss: 0};
      D.recs.forEach(function(r){ if(r.k === k) x.rec++; });
      if(JS && code) (JS.records || []).forEach(function(r){ if(+r.cls === code && +r.no === +s.no) x.rec++; });
      if(G){ Object.keys(G.att || {}).forEach(function(d){ var r = (G.att[d] || {})[no], kk = kindOf(r); if(!kk) return; x.att++; if(d >= w0 && (kk === "Lu" || kk === "sick")) x.wk++; });
        x.cns = (G.counsel || []).filter(function(c){ return String(c.sid) === no; }).length; }
      x.miss = I.filter(function(it){ return !((S.m || {})[it.id] || {})[s.no]; }).length;
      return x;
    });
    var F = {all: ["전체", function(){ return true; }], rec0: ["기록 없음", function(x){ return !x.rec; }], wk: ["이번 주 지각·결석", function(x){ return x.wk > 0; }], miss: ["미제출", function(x){ return x.miss > 0; }], cns: ["상담", function(x){ return x.cns > 0; }]};
    if(!G) delete F.wk, delete F.cns;
    if(!I.length) delete F.miss;
    if(!F[flt]) flt = "all";
    $("who").innerHTML = '<span class="nm">' + esc(cls.name) + '</span><span class="meta">' + cls.students.length + "명" + (isHome ? " · ★ 우리 반" : "") + " · 이름을 누르면 학생 카드</span>";
    $("chips").innerHTML = Object.keys(F).map(function(f){ var n = L.filter(F[f][1]).length; return '<button type="button" data-f="' + f + '" class="' + (f === flt ? "on" : "") + '">' + F[f][0] + (f === "all" ? "" : " <b>" + n + "</b>") + "</button>"; }).join("");
    Array.prototype.forEach.call($("chips").querySelectorAll("button"), function(b){ b.onclick = function(){ flt = b.dataset.f; overview(); }; });
    var g = $("grid"); g.innerHTML = "";
    L.forEach(function(x){
      var b = document.createElement("div"); b.tabIndex = 0; b.setAttribute("role", "button");
      b.className = "tc" + (!x.rec ? " f0" : "") + (x.wk ? " fl" : "") + (F[flt][1](x) ? "" : " off");
      b.title = x.s.no + "번 " + x.s.name + (x.rec ? "" : " · 아직 기록 없음") + (x.wk ? " · 이번 주 지각·결석 " + x.wk : "");
      var cl = CLQ[x.s.no];
      var bd = (cl ? '<span class="bad" title="청소 당번 대기">🧹 ' + cl + "</span>" : "") + (x.rec ? "<span>✍ " + x.rec + "</span>" : "") + (x.att ? '<span class="' + (x.wk ? "bad" : "") + '">🧭 ' + x.att + "</span>" : "") + (x.cns ? "<span>🗣 " + x.cns + "</span>" : "") + (x.miss ? '<span class="bad">📦 ' + x.miss + "</span>" : "");
      b.innerHTML = '<span class="nm2"><small>' + esc(x.s.no) + "</small>" + esc(x.s.name) + '</span><span class="bd">' + bd + '</span><button type="button" class="qa" title="한 줄 기록">✍</button>';
      function open(){ st = x.s; $("stuSel").value = st.no; draw(); }
      b.onclick = function(ev){ if(ev.target.classList.contains("qa")){ TT.notes.quick({cls: cls.id, nos: [x.s.no], src: "학생 카드"}); return; } open(); };
      b.onkeydown = function(ev){ if(ev.key === "Enter") open(); };
      g.appendChild(b);
    });
  }

  function draw(){
    var ov = !!(cls && !st && cls.students.length);
    $("ov").hidden = !ov; $("m").hidden = ov; $("prev").disabled = $("next").disabled = ov; $("addRec").hidden = ov; $("all").hidden = ov;
    if(ov){ overview(); return; }
    if(!cls || !st){
      $("who").innerHTML = '<span class="none">' + (TT.roster.has() ? "학급과 학생을 고르세요." : "명렬표에 학생 명단을 넣으면 학생 카드를 볼 수 있습니다. <a href=\"../roster/\">" + TN("roster", "명렬표") + " →</a>") + "</span>";
      ["bRec", "bAtt", "bCns", "bSub"].forEach(function(id){ $(id).innerHTML = ""; }); return;
    }
    document.title = st.name + " · 학생 카드 · 쌤 노트";
    var N = TT.notes, k = N.key(cls, st), memo = N.memo(k), home = TT.roster.home(), isHome = home && home.id === cls.id;
    $("who").innerHTML = '<span class="nm">' + esc(st.name) + '</span><span class="meta">' + esc(cls.name) + " · " + esc(st.no) + "번" + (isHome ? " · ★ 우리 반" : "") + "</span>" + (memo ? '<span class="memo">📝 ' + esc(memo) + "</span>" : "");
    try{   /* 보완 8단계: 진학 추천 — 희망 진로·확정(또는 추천) 1지망 */
      var AV = TT.store.get("tt_advisor_v1", null), as = AV && (AV.students || []).filter(function(x){ return +x.cls === +cls.cls && +x.no === +st.no; })[0];
      if(as){ var sn = function(id){ var o = (AV.schools || []).filter(function(x){ return x.id === id; })[0]; return o ? o.name : ""; }, F = (as.final || []).filter(Boolean);
        $("who").insertAdjacentHTML("beforeend", '<a class="memo" style="text-decoration:none" href="../advisor/?no=' + encodeURIComponent(st.no) + '">🎓 ' + esc([as.job, (as.traits || []).join("·")].filter(Boolean).join(" / ") || "진학") + (F.length ? " · 1지망 " + esc(sn(F[0])) + " (확정)" : "") + " →</a>"); }
    }catch(e){}
    /* ① 학생 기록 (TT.notes) */
    var D = N.load(), R = D.recs.filter(function(r){ return r.k === k; }).sort(function(a, b){ return (b.date || "") < (a.date || "") ? -1 : 1; });
    var by = {}; R.forEach(function(r){ by[r.area] = (by[r.area] || 0) + 1; });
    /* PLAN_다듬기 4단계: 수업 기록장(tt_journal_v1)에 남긴 이 학생의 수업 중 기록도 함께 */
    var JR = []; try{ var JS = TT.store.get("tt_journal_v1", null), code = cls.grade != null && cls.cls != null ? cls.grade * 100 + cls.cls : null; if(JS && code) JR = (JS.records || []).filter(function(r){ return +r.cls === code && +r.no === +st.no; }); }catch(e){}
    if(JR.length){ by.__j = JR.length; R = R.concat(JR.map(function(r){ return {date: r.date, area: "__j", text: ((r.tags || []).join(" · ") + (r.text ? " — " + r.text : "")).replace(/^ — /, "") + (r.les ? " (" + r.les + ")" : "")}; })).sort(function(a, b){ return (b.date || "") < (a.date || "") ? -1 : 1; }); }
    function AR(a){ return a === "__j" ? "📒 수업 기록" : N.area(a); }
    $("bRec").innerHTML = '<h2>✍️ 학생 기록 <span class="n">' + R.length + '</span><a href="../record/">' + TN("record", "생기부 도우미") + " →</a></h2>"
      + (R.length ? '<div class="sum">' + Object.keys(by).map(function(a){ return "<span>" + esc(AR(a)) + " " + by[a] + "</span>"; }).join("") + "</div>" : "")
      + '<div class="ls">' + (R.length ? R.map(function(r){ return '<div class="r"><span class="d">' + md(r.date) + '</span><span class="a">' + esc(AR(r.area)) + '</span><span class="t">' + esc(r.text) + "</span></div>"; }).join("")
        : '<div class="none">아직 기록이 없습니다. [✍️ 기록 더하기]로 본 것·한 것을 한 줄씩 남기세요.</div>') + "</div>";
    /* ② 출결 · ③ 상담 (생활지도 tt_guide_v1 — 우리 반만) */
    var G = TT.store.get("tt_guide_v1", null), no = String(st.no);
    if(isHome && G){
      var att = [], cnt = {}; Object.keys(G.att || {}).sort().reverse().forEach(function(d){ var r = (G.att[d] || {})[no]; if(!r) return; var kk = kindOf(r); if(!kk) return; cnt[kk] = (cnt[kk] || 0) + 1; att.push({d: d, k: kk, r: r.r || ""}); });
      $("bAtt").innerHTML = '<h2>🧭 출결 <span class="n">' + att.length + '</span><a href="../tardy/">' + TN("tardy", "출결·결석계") + " →</a></h2>"
        + '<div class="sum">' + (att.length ? Object.keys(AK).filter(function(x){ return cnt[x]; }).map(function(x){ return '<span class="' + (x === "Lu" || x === "sick" ? "bad" : "") + '">' + AK[x] + " " + cnt[x] + "</span>"; }).join("") : '<span class="ok">기록된 결석·지각 없음</span>') + "</div>"
        + '<div class="ls">' + att.slice(0, 60).map(function(a){ return '<div class="r"><span class="d">' + md(a.d) + '</span><span class="a">' + AK[a.k] + '</span><span class="t">' + esc(a.r) + "</span></div>"; }).join("") + "</div>";
      var C = (G.counsel || []).filter(function(c){ return String(c.sid) === no; }).sort(function(a, b){ return a.date < b.date ? 1 : -1; }), t0 = TT.util.today().replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3");
      var GM = t0.slice(0, 7), GD = (G.gd || []).filter(function(g){ return String(g.sid) === no && String(g.date).slice(0, 7) === GM; }), GC = {};   // 보완 2단계: 이번 달 빠른 지도
      GD.forEach(function(g){ GC[g.kind] = (GC[g.kind] || 0) + 1; });
      $("bCns").innerHTML = '<h2>🗣️ 상담 <span class="n">' + C.length + '</span><a href="../tardy/?tab=counsel">' + TN("counsel", "상담 일지") + " →</a></h2>"
        + (GD.length ? '<div class="sum"><span>⚡ 이번 달 지도 ' + GD.length + "회 (" + Object.keys(GC).map(function(k){ return esc(k) + " " + GC[k]; }).join(", ") + ")</span></div>" : "")
        + '<div class="ls">' + (C.length ? C.map(function(c){ var nx = c.next && !c.done ? ' <b class="' + (c.next <= t0 ? "no" : "") + '">→ 후속 ' + md(c.next) + "</b>" : c.done ? ' <span class="y">✔ 끝남</span>' : "";
          return '<div class="r"><span class="d">' + md(c.date) + '</span><span class="t">' + esc((c.content || c.trigger || "상담").replace(/\s+/g, " ").slice(0, 140)) + nx + "</span></div>"; }).join("") : '<div class="none">상담 기록이 없습니다.</div>') + "</div>";
    }else{
      var msg = '<div class="none">' + (isHome ? "생활지도 자료가 아직 없습니다." : "출결·상담은 우리 반(★) 학생만 이 기기에 있습니다.") + "</div>";
      $("bAtt").innerHTML = '<h2>🧭 출결</h2>' + msg; $("bCns").innerHTML = '<h2>🗣️ 상담</h2>' + msg;
    }
    /* ④ 제출물 (tt_submit_v1, 이 학급) */
    var S = TT.store.get("tt_submit_v1", null), I = S && S.items ? S.items.filter(function(it){ return it.cls === cls.id; }).sort(function(a, b){ return (b.due || b.at || "") < (a.due || a.at || "") ? -1 : 1; }) : [];
    var miss = I.filter(function(it){ var mk = ((S.m || {})[it.id] || {})[st.no]; return !mk; }).length;
    $("bSub").innerHTML = '<h2>📦 제출물 <span class="n">' + I.length + '</span><a href="../submit/">' + TN("submit", "제출물 확인") + " →</a></h2>"
      + (I.length ? '<div class="sum">' + (miss ? '<span class="bad">미제출 ' + miss + "</span>" : '<span class="ok">모두 냄</span>') + "</div>" : "")
      + '<div class="ls">' + (I.length ? I.map(function(it){ var mk = ((S.m || {})[it.id] || {})[st.no];
          return '<div class="r"><span class="d">' + (it.due ? md(it.due) : "") + '</span><span class="t">' + esc(it.title) + "</span>" + (mk === "y" ? '<span class="y">✔ 냄</span>' : mk === "x" ? '<span class="d">해당 없음</span>' : '<span class="no">미제출</span>') + "</div>"; }).join("")
        : '<div class="none">이 학급의 제출물이 없습니다.</div>') + "</div>";
  }

  /* 학급 고르기: 주소의 c 가 있으면 그 반 */
  var want = q.get("c");
  if(want){ var u = TT.store.get("tt_ui_v1", {}) || {}; u.last = u.last || {}; u.last.stucard = want; TT.store.set("tt_ui_v1", u); }
  TT.ui.classSelect($("clsSel"), "stucard", function(c){ cls = c; fillStu(); });
})();
</script>
