<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<title>수업 기록장 · 쌤 노트</title>
<!--
  반별 수업 진도와 학생 활동(태도·질문 등) 기록. 기록·진도 규칙은 원래 프로그램(수업 기록장) 그대로입니다.
  · 반과 명단은 학급 명렬표(TT.roster)에서 가져옵니다. 프로그램 안에 학생 이름을 넣어 두지 않습니다.
  · 시간표는 비어 있는 상태로 시작합니다(설정에서 입력). 차시 목록은 학년별로 편집합니다.
  · 저장: "tt_journal_v1" (이 기기 브라우저에만, 전체 백업에 포함).
-->
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* 레이아웃: 칠판색 상단바 + 카드 목록 + 하단 4탭. 기록 화면은 모눈종이 위의 자리표와, 엄지가 닿는 하단 태그 도크로 구성 */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EEE7; --line:#D3DCD1;
  --fg:#1A2420; --fg-2:#566359;
  --board:#1F4A41; --board-fg:#F2F7F3;
  --primary:#1F4A41; --on-primary:#F2F7F3; --primary-soft:#DDEBE5;
  --chalk:#EBCB5E; --chalk-ink:#3D3000;
  --ok:#2C7F52; --warn:#9A6411; --bad:#B03F2D;
  --grid:rgba(31,74,65,.09);
  --scrim:rgba(10,18,15,.5);
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --tab-h:62px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#17211D; --surface-2:#1F2B26; --line:#2B3A33;
    --fg:#E7EEE9; --fg-2:#9DB0A5;
    --board:#1B3D35; --board-fg:#EAF3EE;
    --primary:#6FCBAA; --on-primary:#0B1F18; --primary-soft:#1F3A31;
    --chalk:#EBCB5E; --chalk-ink:#3D3000;
    --ok:#5CC48C; --warn:#E2AE55; --bad:#F09580;
    --grid:rgba(111,203,170,.08);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --surface-2:#1F2B26; --line:#2B3A33;
  --fg:#E7EEE9; --fg-2:#9DB0A5;
  --board:#1B3D35; --board-fg:#EAF3EE;
  --primary:#6FCBAA; --on-primary:#0B1F18; --primary-soft:#1F3A31;
  --chalk:#EBCB5E; --chalk-ink:#3D3000;
  --ok:#5CC48C; --warn:#E2AE55; --bad:#F09580;
  --grid:rgba(111,203,170,.08);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--board);z-index:10}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;text-align:inherit}
textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,.sheet:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hdr button:focus-visible{outline-color:var(--chalk)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단바 */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--board);color:var(--board-fg)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.hdr-sub{font:500 11.5px var(--f-mono);letter-spacing:.04em;opacity:.78}
.hdr h1{font-size:21px;font-weight:700;line-height:1.25;text-wrap:balance}
.hbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.hbtn:active{background:rgba(255,255,255,.12)}

main{padding-block:16px calc(var(--tab-h) + 28px);min-height:60vh}
body.has-dock main{padding-bottom:calc(var(--tab-h) + 128px)}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.tab{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--fg-2);border-radius:10px}
.tab[aria-current="page"]{color:var(--primary);font-weight:700;background:var(--primary-soft)}

/* 공통 */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0 10px}
.sec-h h2{font-size:16px;font-weight:700}
.meta{font:500 12px var(--f-mono);color:var(--fg-2)}
.sum{font-size:13.5px;color:var(--fg-2);margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--fg-2)}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.note-a{display:flex;gap:8px;flex-wrap:wrap}
.row-end{margin-top:16px;display:flex;justify-content:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.btn:active{opacity:.8}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--fg-2)}
.pill.ok{color:var(--ok);border-color:currentColor;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.pill.warn{color:var(--warn);border-color:currentColor;background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.chalk{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.pill.tag{color:var(--fg);background:var(--primary-soft);border-color:transparent}
.pill.int{background:transparent;border:1px dashed var(--fg-2);color:var(--fg-2)}
.lnk{color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:4px}

/* 반 선택 / 칩 */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.cchip{position:relative;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center;display:grid;place-items:center}
.cchip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cchip .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--chalk)}
.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;flex:none}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}
.chip.internal{border-style:dashed}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:12px}
.seg button{min-height:38px;padding:0 14px;font-size:13.5px;font-weight:500;text-align:center}
.seg button.on{background:var(--primary);color:var(--on-primary);font-weight:600}

/* 오늘 */
.daybar{display:grid;grid-template-columns:34px repeat(5,minmax(0,1fr)) 34px;gap:6px;align-items:stretch}
.nav-btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;text-align:center;color:var(--fg-2)}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;border-radius:10px;border:1px solid var(--line);background:var(--surface);gap:1px;text-align:center}
.day span{font-size:11.5px;color:var(--fg-2);font-weight:500}
.day b{font:600 16px var(--f-mono)}
.day.today b::after{content:"";display:block;height:3px;border-radius:2px;background:var(--chalk);margin:1px auto 0;width:14px}
.day.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.day.on span{color:var(--on-primary);opacity:.85}
.slot{display:grid;grid-template-columns:58px minmax(0,1fr);overflow:hidden}
.slot.now{border-color:var(--chalk);box-shadow:0 0 0 2px color-mix(in srgb,var(--chalk) 45%,transparent)}
.slot-time{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;gap:0}
.slot-time b{font:600 22px/1.1 var(--f-mono)}
.slot-time span{font-size:11px;color:var(--fg-2)}
.slot-time i{font:400 10.5px var(--f-mono);font-style:normal;color:var(--fg-2);margin-top:4px}
.slot-main{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.slot-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slot-top h3{font-size:16.5px;font-weight:700}
.lesson{font-size:14px;line-height:1.45}
.lesson .lbl{display:inline-block;font-size:11.5px;color:var(--fg-2);margin-right:8px;font-weight:500}
.lesson em{font-style:normal;color:var(--fg-2);font-size:12.5px;margin-right:4px}
.memo{font-size:13px;color:var(--fg-2);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.slot-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* 진도 */
.chart{padding:4px 0;overflow:hidden}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 52px;gap:10px;align-items:center;width:100%;padding:12px 14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pl{font-weight:700}
.pm{min-width:0;display:flex;flex-direction:column;gap:5px}
.track{position:relative;height:14px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:block}
.fill{position:absolute;top:0;bottom:0;left:0;background:var(--primary);display:block}
.tick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface);display:block}
.nx{font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pv{text-align:right;font:500 12px var(--f-mono);color:var(--fg-2);display:flex;flex-direction:column;align-items:flex-end}
.pv b{font-size:15px;color:var(--fg);font-weight:600}
.pv i{font-style:normal;font-size:11px}
.lag{color:var(--warn)}
.lead{color:var(--ok)}
.legend{font-size:12px;color:var(--fg-2);margin-top:10px}

/* 기록 */
.ctx{font-size:13px;color:var(--fg-2);margin-bottom:10px}
.rec-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.paper{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:12px;padding:14px 12px 16px}
.board{background:var(--board);color:var(--board-fg);border-radius:5px;text-align:center;font-size:12px;letter-spacing:.5em;padding:6px 0 6px .5em;margin:0 8% 16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.10),0 3px 0 rgba(0,0,0,.14)}
.seats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 6px}
.seat{position:relative;min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px;text-align:center}
.seat .no{font:500 10.5px var(--f-mono);color:var(--fg-2)}
.seat .nm{font-weight:600;font-size:13.5px;line-height:1.2;overflow-wrap:anywhere}
.seat .cnt{position:absolute;top:-7px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--chalk);color:var(--chalk-ink);font:600 11px/20px var(--f-mono);text-align:center;padding:0 5px}
.seat:active{background:var(--primary-soft)}
.seat.blank{border-style:dashed;background:transparent}
.seat.sel{outline:2px solid var(--primary);outline-offset:2px;background:var(--primary-soft)}
.hint{font-size:12.5px;color:var(--fg-2);margin-top:10px}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:7;background:var(--surface-2);border-top:1px solid var(--line)}
.dock-in{padding-block:8px 10px}
.dock-hint{font-size:12px;color:var(--fg-2);min-height:20px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dock-hint b{color:var(--fg)}
.dock-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.dock-scroll::-webkit-scrollbar{display:none}
.sp{flex:none;width:6px}

/* 학생별 */
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:52px;padding:8px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .no{font:500 12px var(--f-mono);color:var(--fg-2)}
.srow .nm{font-weight:600;overflow-wrap:anywhere}
.srow .r{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-2);justify-content:flex-end;flex-wrap:wrap}
.srow .r b{color:var(--fg);font-weight:600}
.srow .r .d{font:400 11px var(--f-mono)}

/* 시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
.sheet.tall{height:88vh;height:88dvh}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{font-size:18px;font-weight:700;line-height:1.3}
.sheet-h p{font-size:12.5px;color:var(--fg-2);margin-top:2px}
.xbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--fg-2)}
.xbtn:active{background:var(--surface-2)}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.tg h4{font-size:12.5px;font-weight:600;color:var(--fg-2);margin-bottom:6px}
.tg h4 small{font-weight:500;margin-left:6px;font-size:11px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;resize:vertical;min-height:84px;line-height:1.5}
.field textarea.tall{min-height:260px}
.starbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;width:100%}
.starbtn .g{font-size:18px;color:var(--fg-2)}
.starbtn.on{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 22%,transparent)}
.starbtn.on .g{color:var(--warn)}
.foot{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.recent h4{font-size:12.5px;color:var(--fg-2);margin-bottom:6px}
.recent p{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.recent p span{font:400 11px var(--f-mono);color:var(--fg-2);margin-right:8px}
.tool{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dh{font-size:13px;font-weight:700;margin:6px 0 0;display:flex;gap:6px;align-items:baseline}
.dh span{font-weight:500;color:var(--fg-2);font-size:12px}
.rec{border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;margin-top:8px}
.rec-top{display:flex;align-items:center;gap:8px}
.per{font:500 11px var(--f-mono);color:var(--fg-2);flex:none;min-width:34px}
.tagline{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.iconbtn{min-width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2);font-size:17px;text-align:center;padding:0 6px;flex:none}
.iconbtn.star.on{color:var(--warn)}
.iconbtn.danger{color:var(--bad);font-size:12.5px;font-weight:700}
.rec-text{font-size:14px;margin-top:2px;padding-right:4px}
.copybox{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px}
.ttwrap{overflow-x:auto}
.tt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.tt th{font-size:12.5px;font-weight:600;color:var(--fg-2);padding:2px 0}
.tt th.today{color:var(--fg)}
.tt th.today::after{content:"";display:block;height:3px;border-radius:2px;background:var(--chalk);margin:2px auto 0;width:16px}
.tt th[scope="row"]{text-align:center;line-height:1.1}
.tt th[scope="row"] b{display:block;font:600 14px var(--f-mono);color:var(--fg)}
.tt th[scope="row"] small{font:400 9.5px var(--f-mono)}
.cell{width:100%;height:42px;border-radius:8px;border:1px dashed var(--line);text-align:center;color:var(--fg-2);font-size:13.5px}
.cell.has{border-style:solid;background:var(--primary-soft);color:var(--fg);font-weight:700}
.cell.sel{outline:2px solid var(--primary);outline-offset:1px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:44px;padding:6px 4px;border-bottom:1px solid var(--line)}
.lrow .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--on-primary)}
.lrow.done .ck{background:var(--primary);border-color:var(--primary)}
.lrow.done{color:var(--fg-2)}
.uh{font-size:12.5px;font-weight:700;color:var(--fg-2);margin-top:8px}
.step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}
.step .big{text-align:center;font:600 20px var(--f-mono)}
.step .big small{font-size:12px;color:var(--fg-2);font-weight:400}
.srow-set{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg-2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-primary)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:30;max-width:calc(100% - 32px);width:max-content;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13.5px;display:flex;align-items:center;gap:14px}
.toast button{color:var(--chalk);font-weight:700;padding:4px 2px;flex:none}
body.has-dock .toast{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 118px)}
html.lock .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- 선생님 도구 모음에 맞춤 ---- */
.ttback{display:block;font-size:12px;font-weight:700;color:inherit;opacity:.8;text-decoration:none;margin-bottom:1px}
</style>
</head>
<body>
<header class="hdr"><div class="wrap hdr-in"><div><a class="ttback" href="../../">← 쌤 노트</a><div class="hdr-sub" id="hsub"></div><h1 id="htitle"></h1></div><button class="hbtn" data-act="openSettings" aria-label="설정" id="gear"></button></div></header>
<main class="wrap" id="view"></main>
<div class="dock" id="dock" hidden></div>
<nav class="tabs" aria-label="주요 화면"><div class="wrap tabs-in" id="tabsin"></div></nav>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div id="sheet-root"></div>

<script src="../../shared/tt.js"></script>
<script>
(function(){
'use strict';
const KEY='tt_journal_v1';
const DAY=['일','월','화','수','목','금','토'];
const COLS=5;
/* 가르치는 반: 학급 명렬표(TT.roster)에 올라 있는 모든 반. 반 코드는 학년×100+반 (3학년 3반 = 303) */
const ROSTER=(function(){try{return TT.roster.classes().filter(c=>c.grade!=null&&c.cls!=null&&c.students.length)}catch(e){return []}})();
const CLS=ROSTER.length?ROSTER.map(c=>c.grade*100+c.cls):[301,302,303,304,305,306];
const GRADES=Array.from(new Set(CLS.map(c=>Math.floor(c/100)))).sort((a,b)=>b-a);
const gradeOf=c=>Math.floor(c/100);
const cs=c=>gradeOf(c)+'-'+(c%100);
const cn=c=>gradeOf(c)+'학년 '+(c%100)+'반';
const PERIODS=[{n:1,t:'09:00',e:'09:45'},{n:2,t:'09:55',e:'10:40'},{n:3,t:'10:50',e:'11:35'},{n:4,t:'11:45',e:'12:30'},{n:5,t:'13:30',e:'14:15'},{n:6,t:'14:25',e:'15:10'},{n:7,t:'15:20',e:'16:05'}];
const TAGS=[
  {g:'참여·태도',tags:['적극 참여','성실함','집중','모둠 협력']},
  {g:'질문·탐구',tags:['질문함','심화 질문','다양한 풀이','오개념 수정']},
  {g:'발표·표현',tags:['발표함','칠판 풀이','친구 설명']},
  {g:'과제·수행',tags:['과제 성실','수행 우수']},
  {g:'내부 참고',internal:true,tags:['과제 미제출','집중 부족','준비물 미지참','지원 필요']}
];
const SKIP_REASONS=['학교 행사','시험','보강·결강','기타'];
const CUR3=['# 삼각비','삼각비의 뜻','특수한 각의 삼각비','삼각비의 값 구하기','삼각비의 활용 : 길이','삼각비의 활용 : 넓이','# 원의 성질','원과 현','원의 접선','원주각','원주각의 활용','# 통계','대푯값과 산포도','분산과 표준편차','산점도와 상관관계'].join('\n');
const CUR1=['# 소인수분해','소인수분해','최대공약수와 최소공배수','# 정수와 유리수','정수와 유리수','정수와 유리수의 덧셈과 뺄셈','정수와 유리수의 곱셈과 나눗셈','# 문자와 식','문자의 사용과 식의 값','일차식의 계산','# 일차방정식','방정식과 그 해','일차방정식의 풀이','일차방정식의 활용','# 좌표평면과 그래프','좌표평면','그래프','정비례와 반비례','# 기본 도형','점, 선, 면, 각','위치 관계','작도와 합동','# 평면도형과 입체도형','다각형과 원','다면체와 회전체','겉넓이와 부피','# 자료의 정리와 해석','도수분포표와 히스토그램','상대도수'].join('\n');

const IC={
  gear:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>',
  close:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  today:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  progress:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h14M4 17h7"/><circle cx="18" cy="7" r="1.6"/><circle cx="21" cy="17" r="0"/></svg>',
  record:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',
  students:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>'
};
const TABS=[['today','오늘'],['progress','진도'],['record','기록'],['students','학생']];
const TITLES={today:'오늘 수업',progress:'반별 진도',record:'수업 중 기록',students:'학생별 기록'};

/* ---------- 날짜 도구 ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d);};
const weekdayOf=k=>parseKey(k).getDay();
const mondayOf=k=>{const w=weekdayOf(k);return addDays(k,w===0?-6:1-w);};
const fmtMD=k=>{const d=parseKey(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일';};
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1];};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const isWeekend=k=>{const w=weekdayOf(k);return w===0||w===6;};
function schoolBack(k,n){let d=k;while(isWeekend(d))d=addDays(d,-1);let c=0;while(c<n){d=addDays(d,-1);if(!isWeekend(d))c++;}return d;}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 초기 데이터: 시간표와 명단 ---------- */
const TT0={};   // 시간표는 설정(톱니바퀴)에서 직접 넣습니다.
/* 명단은 프로그램에 넣어 두지 않고 학급 명렬표에서 가져옵니다. */
const R0={};ROSTER.forEach(c=>{R0[c.grade*100+c.cls]=c.students.map(s=>({no:s.no,name:s.name}))});
function buildSeats(nos){const n=nos.length;const rows=Math.max(1,Math.ceil(n/COLS));const a=[];for(let i=0;i<rows*COLS;i++)a.push(i<n?nos[i]:0);return a;}
function mkRoster(str){return str.split(/\s+/).map((nm,i)=>nm==='-'?null:{no:i+1,name:nm}).filter(Boolean);}
function seed(){
  const prog={},students={},seats={};
  CLS.forEach(c=>{
    students[c]=R0[c]?R0[c].map(s=>({no:s.no,name:s.name})):[];
    seats[c]=buildSeats(students[c].map(s=>s.no));
    prog[c]={n:0,memo:''};
  });
  return {v:2,hideNames:false,tt:Object.assign({},TT0),cur:{3:CUR3,1:CUR1},prog:prog,taught:{},students:students,seats:seats,records:[],lastCls:CLS[0],nextId:1};
}

/* ---------- 저장 ---------- */
let S;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===2&&o.prog&&o.students&&o.tt&&o.cur)return o;}}catch(e){}
  const s=seed();try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- 도메인 헬퍼 ---------- */
const _lc={};
function lessons(g){
  const raw=String((S.cur||{})[g]||'');
  if(_lc[g]&&_lc[g].k===raw)return _lc[g].v;
  const out=[];let unit='';
  raw.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]==='#'){unit=l.replace(/^#+\s*/,'');return;}out.push({unit:unit,title:l});});
  _lc[g]={k:raw,v:out};return out;
}
function unitInfo(L){const us=[];L.forEach((l,i)=>{if(!us.length||us[us.length-1].name!==l.unit)us.push({name:l.unit,start:i,count:0});us[us.length-1].count++;});return us;}
const isInternal=t=>TAGS.some(g=>g.internal&&g.tags.indexOf(t)>=0);
const nameOf=(c,no)=>{const s=(S.students[c]||[]).find(x=>x.no===no);return S.hideNames||!s?no+'번':s.name;};
const labelOf=(c,no)=>{const s=(S.students[c]||[]).find(x=>x.no===no);return S.hideNames||!s?cs(c)+' '+no+'번':s.name+' ('+cs(c)+' '+no+'번)';};
const progN=c=>{const p=S.prog[c];return p?p.n:0;};
function periodFor(c){const now=new Date(),w=now.getDay();if(w<1||w>5)return 0;const m=nowMin();let best=0;PERIODS.forEach(p=>{if(S.tt[w+'-'+p.n]===c&&m>=toMin(p.t))best=p.n;});return best;}
function defaultClass(){
  const now=new Date(),w=now.getDay();
  if(w>=1&&w<=5){const m=nowMin();for(const p of PERIODS){const c=S.tt[w+'-'+p.n];if(!c)continue;if(m<=toMin(p.e))return c;}}
  return S.lastCls||301;
}
function addRecord(c,no,tags,text,star){
  const id=S.nextId++;
  S.records.push({id:id,date:dkey(new Date()),period:periodFor(c),cls:c,no:no,tags:tags,text:text,star:!!star,ts:Date.now(),les:(TT.notes&&TT.notes.lessonNow)?TT.notes.lessonNow(c):''});
  save();return id;
}
function delRecord(id){S.records=S.records.filter(r=>r.id!==id);save();}
function statsFor(c){
  const m={};(S.students[c]||[]).forEach(s=>{m[s.no]={n:0,star:0,last:'',tags:{}};});
  S.records.forEach(r=>{if(r.cls!==c)return;const x=m[r.no];if(!x)return;x.n++;if(r.star)x.star++;if(r.date>x.last)x.last=r.date;r.tags.forEach(t=>{x.tags[t]=(x.tags[t]||0)+1;});});
  return m;
}

/* ---------- UI 상태 ---------- */
function startDate(){let k=dkey(new Date());const w=weekdayOf(k);if(w===6)k=addDays(k,2);if(w===0)k=addDays(k,1);return k;}
const ui={tab:'today',date:'',cls:1,tag:null,swap:false,swapSel:null,sheet:null,draft:{tags:[],text:'',star:false},sort:'no',fTag:'',bannerOff:false,confirm:null,undo:null};
const $view=document.getElementById('view'),$dock=document.getElementById('dock'),$toast=document.getElementById('toast'),$sheet=document.getElementById('sheet-root');
let toastTimer=null;
function toast(msg,undo){
  ui.undo=undo||null;
  $toast.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="undo">실행 취소</button>':'');
  $toast.hidden=false;clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{$toast.hidden=true;ui.undo=null;},undo?5000:2600);
}

/* ---------- 화면: 공통 조각 ---------- */
function classChips(withDot){
  const w=new Date().getDay();
  return '<div class="cgrid" role="group" aria-label="반 선택">'+CLS.map(c=>{
    const has=withDot&&w>=1&&w<=5&&PERIODS.some(p=>S.tt[w+'-'+p.n]===c);
    return '<button class="cchip '+(ui.cls===c?'on':'')+'" data-act="cls" data-c="'+c+'" aria-pressed="'+(ui.cls===c)+'">'+cs(c)+(has?'<span class="dot" aria-hidden="true"></span>':'')+'</button>';
  }).join('')+'</div>';
}
function emptyRoster(c){return '<div class="empty"><p>'+cn(c)+' 명단이 아직 없어요.</p><button class="btn primary" data-act="openRoster" data-c="'+c+'">명단 붙여넣기</button></div>';}
function lessonLine(ls){return ls?'<em>'+esc(ls.unit)+'</em> '+esc(ls.title):'';}

/* ---------- 화면: 오늘 ---------- */
function slotCard(k,p,c){
  const L=lessons(gradeOf(c)),tg=S.taught[k+'|'+p.n],todayK=dkey(new Date()),m=nowMin();
  const now=k===todayK&&m>=toMin(p.t)&&m<=toMin(p.e);
  const past=k<todayK||(k===todayK&&m>toMin(p.e)),future=k>todayK;
  const ref='data-k="'+k+'" data-p="'+p.n+'" data-c="'+c+'"';
  let badge='',line='',acts='';
  if(tg&&tg.kind==='skip'){
    badge='<span class="pill">수업 없음</span>';
    line='<p class="lesson"><span class="lbl">사유</span>'+esc(tg.reason||'기타')+'</p>';
    acts='<button class="btn sm ghost" data-act="slotUndo" '+ref+'>되돌리기</button>';
  }else if(tg&&tg.kind==='done'){
    const ls=L[tg.lesson];
    badge='<span class="pill ok">진행 완료</span>';
    line='<p class="lesson"><span class="lbl">진행</span>'+(ls?lessonLine(ls):'—')+'</p>';
    acts='<button class="btn sm ghost" data-act="slotUndo" '+ref+'>되돌리기</button>';
  }else{
    const ls=L[progN(c)];
    badge=now?'<span class="pill chalk">수업 중</span>':past?'<span class="pill warn">체크 전</span>':future?'<span class="pill">예정</span>':'';
    line='<p class="lesson"><span class="lbl">'+(past?'체크할 차시':future?'예정 차시':'오늘 차시')+'</span>'+(ls?lessonLine(ls):'모든 차시를 마쳤어요')+'</p>';
    if(!future){
      if(ls)acts+='<button class="btn sm primary" data-act="slotDone" '+ref+'>진행 완료</button>';
      acts+='<button class="btn sm" data-act="slotSkip" '+ref+'>수업 없음</button>';
    }
  }
  const memo=S.prog[c]&&S.prog[c].memo?'<p class="memo">'+esc(S.prog[c].memo)+'</p>':'';
  acts+='<button class="btn sm ghost" data-act="goRecord" data-c="'+c+'">학생 기록</button><button class="btn sm ghost" data-act="editMemo" data-c="'+c+'">메모</button>';
  return '<article class="card slot '+(now?'now':'')+'"><div class="slot-time"><b>'+p.n+'</b><span>교시</span><i>'+p.t+'</i></div><div class="slot-main"><div class="slot-top"><h3>'+cn(c)+'</h3>'+badge+'</div>'+line+memo+'<div class="slot-acts">'+acts+'</div></div></article>';
}
function vToday(){
  const todayK=dkey(new Date()),dk=ui.date,w=weekdayOf(dk),mon=mondayOf(dk);
  let h='';
  h+='<div class="daybar"><button class="nav-btn" data-act="weekShift" data-d="-7" aria-label="지난주">‹</button>';
  for(let i=0;i<5;i++){
    const k=addDays(mon,i),d=parseKey(k);
    h+='<button class="day '+(k===dk?'on':'')+' '+(k===todayK?'today':'')+'" data-act="pickDate" data-k="'+k+'" aria-pressed="'+(k===dk)+'"><span>'+DAY[i+1]+'</span><b>'+d.getDate()+'</b></button>';
  }
  h+='<button class="nav-btn" data-act="weekShift" data-d="7" aria-label="다음주">›</button></div>';
  const slots=PERIODS.filter(p=>S.tt[w+'-'+p.n]);
  const done=slots.filter(p=>S.taught[dk+'|'+p.n]).length;
  h+='<div class="sec-h"><h2>'+(dk===todayK?'오늘 · ':fmtMD(dk)+' · ')+DAY[w]+'요일</h2><span class="meta">'+(slots.length?'수업 '+slots.length+' · 체크 '+done:'')+'</span></div>';
  if(!slots.length)h+='<div class="empty"><p>이 날은 수업이 없어요.</p><button class="btn sm" data-act="openTT">시간표 편집</button></div>';
  else h+='<div class="stack">'+slots.map(p=>slotCard(dk,p,S.tt[w+'-'+p.n])).join('')+'</div>';
  h+='<div class="row-end"><button class="btn" data-act="openTT">주간 시간표 보기·편집</button></div>';
  return h;
}

/* ---------- 화면: 진도 ---------- */
function gradeBlock(g){
  const cl=CLS.filter(c=>gradeOf(c)===g),L=lessons(g),N=L.length,U=unitInfo(L);
  let h='<div class="sec-h"><h2>'+g+'학년</h2><span class="meta">'+cl.map(cs).join(' · ')+'</span></div>';
  if(!N)return h+'<div class="empty"><p>차시 목록이 비어 있어요.</p><button class="btn primary" data-act="editCur" data-g="'+g+'">차시 목록 입력</button></div>';
  const ns=cl.map(c=>Math.min(progN(c),N)),mx=Math.max.apply(null,ns),mn=Math.min.apply(null,ns);
  const lead=cl.filter(c=>Math.min(progN(c),N)===mx),lag=cl.filter(c=>Math.min(progN(c),N)===mn);
  h+='<p class="sum">'+(mx===mn?'모든 반의 진도가 같아요.':'가장 앞선 반은 '+lead.map(cs).join('·')+', 가장 늦은 반은 '+lag.map(cs).join('·')+'이에요. 차이는 '+(mx-mn)+'차시예요.')+'</p>';
  h+='<div class="card chart" role="list">'+cl.map(c=>{
    const n=Math.min(progN(c),N),d=mx-n,nx=L[n];
    return '<button class="prow" role="listitem" data-act="openClass" data-c="'+c+'" aria-label="'+cn(c)+' 진도 '+n+'/'+N+'">'
      +'<span class="pl">'+cs(c)+'</span>'
      +'<span class="pm"><span class="track"><span class="fill" style="width:'+(n/N*100)+'%"></span>'+U.slice(1).map(u=>'<span class="tick" style="left:'+(u.start/N*100)+'%"></span>').join('')+'</span><span class="nx">'+(nx?'다음 · '+esc(nx.title):'모든 차시 완료')+'</span></span>'
      +'<span class="pv"><span><b>'+n+'</b>/'+N+'</span>'+(d>0?'<i class="lag">−'+d+'</i>':'<i class="lead">선두</i>')+'</span></button>';
  }).join('')+'</div>';
  h+='<p class="legend">'+U.map(u=>esc(u.name)+' '+u.count+'차시').join(' · ')+'<br>막대의 흰 칸막이는 단원 경계예요. 반을 누르면 차시별로 고칠 수 있어요.</p>';
  h+='<div class="row-end"><button class="btn" data-act="editCur" data-g="'+g+'">'+g+'학년 차시 목록 편집</button></div>';

}
function vProgress(){return GRADES.map(gradeBlock).join('');}

/* ---------- 화면: 기록 ---------- */
function ctxLine(c){
  const w=new Date().getDay(),L=lessons(gradeOf(c)),n=progN(c),nx=L[n];
  const ps=(w>=1&&w<=5)?PERIODS.filter(p=>S.tt[w+'-'+p.n]===c):[];
  return esc((ps.length?'오늘 '+ps.map(p=>p.n+'교시').join('·'):'오늘 이 반 수업 없음')+' · 진도 '+n+'/'+L.length+(nx?' · 다음 '+nx.title:' · 모두 완료'));
}
function vRecord(){
  const c=ui.cls,ro=S.students[c]||[];
  let h=classChips(true)+'<p class="ctx">'+ctxLine(c)+'</p>';
  if(!ro.length)return h+emptyRoster(c);
  const todayK=dkey(new Date()),cnt={};let total=0;
  S.records.forEach(r=>{if(r.cls===c&&r.date===todayK){cnt[r.no]=(cnt[r.no]||0)+1;total++;}});
  h+='<div class="rec-bar"><span class="meta">오늘 기록 '+total+'건</span><button class="btn sm '+(ui.swap?'primary':'')+'" data-act="swapToggle" aria-pressed="'+ui.swap+'">'+(ui.swap?'자리 바꾸기 끝내기':'자리 바꾸기')+'</button></div>';
  const seats=S.seats[c]||[];
  h+='<div class="paper"><div class="board" aria-hidden="true">칠판</div><div class="seats">'+seats.map((no,i)=>{
    const st=ro.find(x=>x.no===no);
    if(!no||!st)return '<button class="seat blank '+(ui.swapSel===i?'sel':'')+'" data-act="seat" data-i="'+i+'" aria-label="빈자리"></button>';
    return '<button class="seat '+(ui.swapSel===i?'sel':'')+'" data-act="seat" data-i="'+i+'"><span class="no">'+no+'</span><span class="nm">'+(S.hideNames?'':esc(st.name))+'</span>'+(cnt[no]?'<span class="cnt" aria-label="오늘 '+cnt[no]+'건">'+cnt[no]+'</span>':'')+'</button>';
  }).join('')+'</div></div>';
  if(ui.swap)h+='<p class="hint">바꿀 두 자리를 차례로 누르세요. 빈자리로 옮길 수도 있어요.</p>';
  return h;
}
function renderDock(){
  const show=ui.tab==='record'&&(S.students[ui.cls]||[]).length>0;
  document.body.classList.toggle('has-dock',show);
  $dock.hidden=!show;
  if(!show){$dock.innerHTML='';return;}
  let hint;
  if(ui.swap)hint='자리 바꾸기 중에는 기록되지 않아요';
  else if(ui.tag)hint='<b>'+esc(ui.tag)+'</b> 선택됨 · 학생을 탭하면 바로 기록 <button class="lnk" data-act="tag" data-t="'+esc(ui.tag)+'">해제</button>';
  else hint='태그를 고른 뒤 학생을 탭하면 바로 기록 · 태그 없이 탭하면 메모 입력';
  const chips=TAGS.map(g=>g.tags.map(t=>'<button class="chip '+(g.internal?'internal':'')+' '+(ui.tag===t?'on':'')+'" data-act="tag" data-t="'+esc(t)+'" aria-pressed="'+(ui.tag===t)+'">'+esc(t)+'</button>').join('')).join('<span class="sp"></span>');
  $dock.innerHTML='<div class="wrap dock-in"><div class="dock-hint">'+hint+'</div><div class="dock-scroll" role="group" aria-label="빠른 기록 태그">'+chips+'</div></div>';
}

/* ---------- 화면: 학생별 ---------- */
function vStudents(){
  const c=ui.cls,ro=S.students[c]||[];
  let h=classChips(false);
  if(!ro.length)return h+emptyRoster(c);
  const st=statsFor(c);
  const total=S.records.filter(r=>r.cls===c).length,without=ro.filter(s=>st[s.no].n===0).length;
  const used=[];TAGS.forEach(g=>g.tags.forEach(t=>{if(S.records.some(r=>r.cls===c&&r.tags.indexOf(t)>=0))used.push(t);}));
  if(ui.fTag&&used.indexOf(ui.fTag)<0)ui.fTag='';
  h+='<p class="sum">학생 '+ro.length+'명 · 기록 '+total+'건 · 기록 없는 학생 '+without+'명</p>';
  h+='<div class="seg" role="group" aria-label="정렬"><button class="'+(ui.sort==='no'?'on':'')+'" data-act="sort" data-s="no">번호순</button><button class="'+(ui.sort==='few'?'on':'')+'" data-act="sort" data-s="few">기록 적은 순</button></div>';
  h+='<div class="chips-scroll" role="group" aria-label="태그로 찾기"><button class="chip '+(!ui.fTag?'on':'')+'" data-act="fTag" data-t="">전체</button>'+used.map(t=>'<button class="chip '+(ui.fTag===t?'on':'')+'" data-act="fTag" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>';
  let rows=ro.map(s=>({s:s,x:st[s.no]}));
  if(ui.fTag)rows=rows.filter(r=>r.x.tags[ui.fTag]>0).sort((a,b)=>b.x.tags[ui.fTag]-a.x.tags[ui.fTag]||a.s.no-b.s.no);
  else if(ui.sort==='few')rows.sort((a,b)=>a.x.n-b.x.n||a.s.no-b.s.no);
  h+='<div class="card">'+rows.map(r=>{
    const x=r.x;let right;
    if(ui.fTag)right='<b>'+x.tags[ui.fTag]+'회</b>';
    else if(!x.n)right='<span class="pill">기록 없음</span>';
    else right='<span>기록 <b>'+x.n+'</b>'+(x.star?' · ★'+x.star:'')+'</span><span class="d">'+x.last.slice(5).replace('-','/')+'</span>';
    return '<button class="srow" data-act="openStu" data-c="'+c+'" data-no="'+r.s.no+'"><span class="no">'+r.s.no+'</span><span class="nm">'+(S.hideNames?r.s.no+'번':esc(r.s.name))+'</span><span class="r">'+right+'</span></button>';
  }).join('')+'</div>';
  if(!rows.length)h+='<div class="empty"><p>조건에 맞는 학생이 없어요.</p></div>';
  return h;
}

/* ---------- 시트 ---------- */
function shell(title,sub,body,tall){

}
function recItem(r){

function sRec(){

function sStu(){

  if(!list.length)b+='<div class="empty"><p>'+(s.onlyStar?'★로 표시한 기록이 없어요.':'아직 기록이 없어요.')+'</p></div>';

  list.forEach(r=>{if(r.date!==last){b+='<h3 class="dh">'+fmtMD(r.date)+'<span>'+DAY[weekdayOf(r.date)]+'</span></h3>';last=r.date;}b+=recItem(r);});

function sTT(){

function renderSheet(){
  const s=ui.sheet;

  const map={rec:sRec,stu:sStu,tt:sTT,cls:sClass,cur:sCur,memo:sMemo,skip:sSkip,roster:sRoster,settings:sSettings};
  $sheet.innerHTML=map[s.type]();
  document.documentElement.classList.add('lock');
  const sh=$sheet.querySelector('.sheet');if(sh)sh.focus({preventScroll:true});
  if(s.type==='memo'||s.type==='roster'||s.type==='cur'){setTimeout(()=>{const ta=$sheet.querySelector('textarea');if(ta&&ui.sheet===s)ta.focus();},60);}
  if(s.copyText){setTimeout(()=>{const cb=document.getElementById('copybox');if(cb){cb.focus();cb.select();}},60);}
}

  document.getElementById('hsub').textContent=fmtMD(todayK)+' '+DAY[weekdayOf(todayK)]+'요일';
  document.getElementById('htitle').textContent=TITLES[ui.tab];
  $view.innerHTML=ui.tab==='today'?vToday():ui.tab==='progress'?vProgress():ui.tab==='record'?vRecord():vStudents();
  renderDock();
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}

/* ---------- 내보내기 ---------- */
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n');}
async function exportFile(name,text){
  try{
    const cl=window.claude;const dl=cl&&cl.use?await cl.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:text});toast('파일을 저장했어요');return;}
  }catch(e){if(e&&e.code==='declined')return;}
  try{await navigator.clipboard.writeText(text);toast('CSV 내용을 클립보드에 복사했어요');}
  catch(e){toast('이 화면에서는 파일 저장을 지원하지 않아요');}
}
function exportRecords(){
  const rows=[['날짜','요일','교시','반','번호','이름','태그','메모','생활기록부 반영 후보']];
  S.records.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).forEach(r=>{
    const st=(S.students[r.cls]||[]).find(x=>x.no===r.no);
    rows.push([r.date,DAY[weekdayOf(r.date)],r.period||'',cs(r.cls),r.no,st?st.name:'',r.tags.join(', '),r.text,r.star?'★':'']);
  });
  exportFile('수업기록_'+dkey(new Date())+'.csv',csv(rows));
}
function exportProgress(){
  const rows=[['학년','반','마친 차시','전체 차시','다음 차시','메모']];
  CLS.forEach(c=>{const L=lessons(gradeOf(c)),n=Math.min(progN(c),L.length);rows.push([gradeOf(c),cs(c),n,L.length,L[n]?L[n].title:'모두 완료',S.prog[c].memo]);});
  exportFile('반별진도_'+dkey(new Date())+'.csv',csv(rows));
}
function notesText(c,no){
  const list=S.records.filter(r=>r.cls===c&&r.no===no&&r.star).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  if(!list.length)return '';
  return [labelOf(c,no)].concat(list.map(r=>r.date+'('+DAY[weekdayOf(r.date)]+') '+(r.period?r.period+'교시 · ':'')+r.tags.join(', ')+(r.text?' — '+r.text:''))).join('\n');
}

/* ---------- 이벤트 ---------- */
function parseRoster(txt){
  let prev=0;const out=[];
  txt.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^(\d+)[\s.,)\t]+(.+)$/);
    let no,nm;
    if(m){no=+m[1];nm=m[2].trim();}else{no=prev+1;nm=l;}
    if(no<=prev)no=prev+1;
    prev=no;out.push({no:no,name:nm.slice(0,10)});
  });
  return out.slice(0,40);
}
function act(a,t){
  const d=t.dataset;
  switch(a){
    case 'tab':ui.tab=d.tab;ui.swap=false;ui.swapSel=null;window.scrollTo(0,0);render();break;
    case 'openSettings':openSheet({type:'settings'});break;
    case 'closeSheet':closeSheet();break;
    case 'hideBanner':ui.bannerOff=true;render();break;
    case 'pickDate':ui.date=d.k;render();break;
    case 'weekShift':ui.date=addDays(ui.date,+d.d);render();break;
    case 'slotDone':{
      const c=+d.c,key=d.k+'|'+d.p,L=lessons(gradeOf(c)),i=progN(c);
      if(S.taught[key]||i>=L.length)break;
      S.taught[key]={kind:'done',lesson:i};S.prog[c].n=i+1;save();render();
      toast(cs(c)+' · '+L[i].title+' 진행 완료');break;
    }
    case 'slotSkip':openSheet({type:'skip',k:d.k,p:+d.p,c:+d.c});break;
    case 'doSkip':{const s=ui.sheet;S.taught[s.k+'|'+s.p]={kind:'skip',reason:d.r};save();closeSheet();render();toast('수업 없음으로 표시했어요');break;}
    case 'slotUndo':{
      const c=+d.c,key=d.k+'|'+d.p,tg=S.taught[key];
      if(tg&&tg.kind==='done')S.prog[c].n=Math.max(0,progN(c)-1);
      delete S.taught[key];save();render();break;
    }
    case 'goRecord':ui.cls=+d.c;S.lastCls=ui.cls;save();ui.tab='record';window.scrollTo(0,0);render();break;
    case 'editMemo':ui.draft={memo:(S.prog[+d.c]||{}).memo||''};openSheet({type:'memo',c:+d.c,focus:true});break;
    case 'saveMemo':{const c=ui.sheet.c;S.prog[c].memo=(ui.draft.memo||'').trim();save();closeSheet();render();toast('메모를 저장했어요');break;}
    case 'openTT':openSheet({type:'tt',sel:null});break;
    case 'pickTT':ui.sheet.sel=d.k;renderSheet();break;
    case 'setTT':{const k=ui.sheet.sel,c=+d.c;if(c)S.tt[k]=c;else delete S.tt[k];save();ui.sheet.sel=null;renderSheet();render();break;}
    case 'openClass':openSheet({type:'cls',c:+d.c});break;
    case 'adjN':{const c=ui.sheet.c,N=lessons(gradeOf(c)).length;S.prog[c].n=Math.max(0,Math.min(N,progN(c)+(+d.d)));save();renderSheet();render();break;}
    case 'setN':{const c=ui.sheet.c,i=+d.i;S.prog[c].n=(progN(c)===i+1)?i:i+1;save();renderSheet();render();break;}
    case 'editCur':{const g=+d.g;ui.draft={cur:(S.cur||{})[g]||''};openSheet({type:'cur',g:g});break;}
    case 'saveCur':{const g=ui.sheet.g;S.cur[g]=(ui.draft.cur||'').trim();const N=lessons(g).length;CLS.forEach(c=>{if(gradeOf(c)===g&&S.prog[c].n>N)S.prog[c].n=N;});save();closeSheet();render();toast(g+'학년 차시 목록을 저장했어요');break;}
    case 'cls':ui.cls=+d.c;S.lastCls=ui.cls;save();ui.swapSel=null;ui.fTag='';render();break;
    case 'tag':ui.tag=(ui.tag===d.t)?null:d.t;render();break;
    case 'swapToggle':ui.swap=!ui.swap;ui.swapSel=null;render();break;
    case 'seat':{
      const c=ui.cls,i=+d.i,arr=S.seats[c],no=arr[i];
      if(ui.swap){
        if(ui.swapSel==null)ui.swapSel=i;
        else{const j=ui.swapSel;if(j!==i){const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;save();}ui.swapSel=null;}
        render();break;
      }
      if(!no)break;
      if(ui.tag){
        const tg=ui.tag,id=addRecord(c,no,[tg],'',false);
        render();toast(nameOf(c,no)+' · '+tg+' 기록',()=>{delRecord(id);render();});break;
      }
      ui.draft={tags:[],text:'',star:false};openSheet({type:'rec',c:c,no:no});break;
    }
    case 'dTag':{const a=ui.draft.tags,i=a.indexOf(d.t);if(i>=0)a.splice(i,1);else a.push(d.t);t.classList.toggle('on',i<0);t.setAttribute('aria-pressed',String(i<0));break;}
    case 'dStar':ui.draft.star=!ui.draft.star;t.classList.toggle('on',ui.draft.star);t.setAttribute('aria-pressed',String(ui.draft.star));break;
    case 'saveRec':{
      const dr=ui.draft,text=(dr.text||'').trim();
      if(!dr.tags.length&&!text){toast('태그나 메모를 하나 이상 남겨 주세요');break;}
      const s=ui.sheet;addRecord(s.c,s.no,dr.tags.slice(),text,dr.star);closeSheet();render();toast('저장했어요');break;
    }
    case 'sort':ui.sort=d.s;ui.fTag='';render();break;
    case 'fTag':ui.fTag=d.t;render();break;
    case 'openStu':openSheet({type:'stu',c:+d.c,no:+d.no,onlyStar:false});break;
    case 'onlyStar':ui.sheet.onlyStar=!ui.sheet.onlyStar;renderSheet();break;
    case 'starRec':{const r=S.records.find(x=>x.id===+d.id);if(r){r.star=!r.star;save();renderSheet();render();}break;}
    case 'delRec':{
      if(ui.confirm==='del'+d.id){delRecord(+d.id);ui.confirm=null;renderSheet();render();}
      else{ui.confirm='del'+d.id;renderSheet();}
      break;
    }
    case 'copyNotes':{
      const s=ui.sheet,txt=notesText(s.c,s.no);
      if(!txt){toast('★로 표시한 기록이 없어요');break;}
      const fallback=()=>{s.copyText=txt;renderSheet();};
      try{navigator.clipboard.writeText(txt).then(()=>toast('★ 기록을 복사했어요'),fallback);}catch(e){fallback();}
      break;
    }
    case 'openRoster':{const c=+d.c;ui.draft={ros:(S.students[c]||[]).map(s=>s.no+' '+s.name).join('\n')};openSheet({type:'roster',c:c});break;}
    case 'rosterCls':{const c=+d.c;ui.draft={ros:(S.students[c]||[]).map(s=>s.no+' '+s.name).join('\n')};ui.sheet.c=c;renderSheet();break;}
    case 'saveRoster':{
      const c=ui.sheet.c,list=parseRoster(ui.draft.ros||''),oldNos=(S.students[c]||[]).map(x=>x.no).join(',');
      S.students[c]=list;
      if(list.map(x=>x.no).join(',')!==oldNos||!S.seats[c]||!S.seats[c].length)S.seats[c]=buildSeats(list.map(x=>x.no));
      save();closeSheet();render();toast(cn(c)+' 명단 '+list.length+'명을 저장했어요');break;
    }
    case 'toggleHide':S.hideNames=!S.hideNames;save();try{const C0=TT.store.get('tt_class_v1',{})||{};C0.mask=S.hideNames;TT.store.set('tt_class_v1',C0);}catch(e){}renderSheet();render();break;
    case 'exportRec':exportRecords();break;
    case 'exportProg':exportProgress();break;
    case 'clearSample':{
      if(ui.confirm==='clear'){
        S.records=[];S.taught={};
        CLS.forEach(c=>{S.prog[c]={n:0,memo:''};});
        save();ui.confirm=null;closeSheet();render();toast('기록과 진도를 모두 지웠어요');
      }else{ui.confirm='clear';renderSheet();}
      break;
    }
    case 'undo':if(ui.undo){const f=ui.undo;ui.undo=null;$toast.hidden=true;f();}break;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  act(t.dataset.act,t);
});
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.draft)ui.draft[t.dataset.draft]=t.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ui.sheet&&ui.tab==='today')render();});

/* ---------- 시작 ---------- */
S=load();try{const C0=TT.store.get("tt_class_v1",null);if(C0&&typeof C0.mask==="boolean"&&C0.mask!==!!S.hideNames){S.hideNames=C0.mask;save();}}catch(e){}
/* 내 시간표(tt_timetable_v1, "내 시간표" 도구)가 있으면 교시 시각과 시간표를 그대로 씁니다.
   내 시간표가 바뀌었을 때만 덮어쓰므로, 그 사이 여기서 고친 내용은 다음 변경 전까지 유지됩니다. */
(function(){try{
  const T=JSON.parse(localStorage.getItem('tt_timetable_v1')||'null');
  if(!T||!T.slots||!Array.isArray(T.periods)||!Object.keys(T.slots).length)return;
  const used=Object.keys(T.slots).reduce((a,k)=>Math.max(a,+k.split('-')[1]),0);
  T.periods.forEach((p,i)=>{
    if(!p||!/^\d{1,2}:\d{2}$/.test(p.t))return;
    const st=toMin(p.t),e=st+45,v={n:p.n,t:p.t,e:pad(Math.floor(e/60))+':'+pad(e%60)};
    if(PERIODS[i])Object.assign(PERIODS[i],v);else if(p.n<=used)PERIODS.push(v);
  });
  if((S.ttFrom||0)<(T.updatedAt||0)){
    const tt={};Object.keys(T.slots).forEach(k=>{const c=T.slots[k]&&T.slots[k].cls;if(c&&CLS.includes(c))tt[k]=c;});
    S.tt=tt;S.ttFrom=T.updatedAt;save();
  }
  window.__ttShared=true;
}catch(e){}})();
/* 명렬표에 새로 생긴 반·아직 명단이 없는 반을 채웁니다. 이미 있는 명단과 자리표는 건드리지 않습니다. */
(function(){
  let ch=false;
  CLS.forEach(c=>{
    if(!S.prog[c]){S.prog[c]={n:0,memo:''};ch=true}
    if(!S.students[c]||!S.students[c].length){
      S.students[c]=R0[c]?R0[c].map(s=>({no:s.no,name:s.name})):[];
      S.seats[c]=buildSeats(S.students[c].map(s=>s.no));ch=true;
    }
    if(!S.seats[c]){S.seats[c]=buildSeats(S.students[c].map(s=>s.no));ch=true}
  });
  if(CLS.indexOf(S.lastCls)<0){S.lastCls=CLS[0];ch=true}
  if(ch)save();
})();
ui.cls=defaultClass();ui.date=startDate();
document.getElementById('gear').innerHTML=IC.gear;
document.getElementById('tabsin').innerHTML=TABS.map(t=>'<button class="tab" data-act="tab" data-tab="'+t[0]+'">'+IC[t[0]]+'<span>'+t[1]+'</span></button>').join('');
render();
})();
</script>
