"d": "alg", "p": ["인수분해:  (x − α)(x − β) = 0 이면 x = α 또는 x = β", "근의 공식:  ax² + bx + c = 0 의 해는  x = (−b ± √(b² − 4ac)) / 2a", "x = p가 근이면 방정식에 대입했을 때 등식이 성립한다. 이를 이용하여 미지수를 구한다.", "중근을 가질 조건:  b² − 4ac = 0", "(참고) 두 근의 합은 −b/a, 곱은 c/a 이다. 고1 공통수학1에서 '근과 계수의 관계'로 배운다."], "t": "근이 주어지면 대입, 근을 구해야 하면 인수분해를 먼저 시도하고 안 되면 근의 공식을 씁니다."}, "quad_app": {"n": "이차방정식의 활용", "g": "중3", "d": "alg", "p": ["구하려는 값을 x로 놓고 이차방정식을 세운 뒤 인수분해나 근의 공식으로 푼다.", "구한 근 중에서 문제의 조건(자연수, 길이는 양수 등)에 맞는 것만 택한다.", "연속하는 두 자연수는 x, x + 1,  도형의 넓이나 타일 문제는 한 변의 길이를 x로 놓는다."], "t": "구한 근이 모두 문제의 조건에 맞는지 반드시 확인합니다."}, "lf": {"n": "일차함수와 그래프", "g": "중2", "d": "fun", "p": ["y = ax + b에서 기울기 a = (y의 증가량)/(x의 증가량), y절편은 b, x절편은 y = 0일 때의 x의 값이다.", "두 직선이 평행하면 기울기가 같고 y절편이 다르다.", "두 점 (x₁, y₁), (x₂, y₂)를 지나는 직선의 기울기는 (y₂ − y₁)/(x₂ − x₁)이고, 기울기가 a이고 한 점을 지나면 y − y₁ = a(x − x₁)로 식을 구한다.", "y축 방향으로 k만큼 평행이동하면 y = ax + b + k"], "t": "기울기와 한 점(또는 절편)이 있으면 직선의 식이 정해집니다."}, "lf_eq": {"n": "일차함수와 일차방정식(교점)", "g": "중2", "d": "fun", "p": ["두 직선의 교점의 좌표는 두 직선의 식을 연립한 연립방정식의 해이다.", "직선이 x축과 만나는 점은 y = 0, y축과 만나는 점은 x = 0을 대입하여 구한다.", "직선과 x축, y축으로 둘러싸인 삼각형의 넓이 = ½ × |x절편| × |y절편|"], "t": "교점이 필요하면 두 식을 연립하고, 점이 직선 위에 있으면 좌표를 대입합니다."}, "inv": {"n": "반비례와 그 그래프", "g": "중1", "d": "fun", "p": ["y = a/x (a ≠ 0)에서 xy = a로 일정하다. 그래프는 원점에 대하여 대칭인 한 쌍의 곡선이다.", "점 (p, q)가 그래프 위에 있으면 q = a/p, 즉 pq = a 이다.", "a > 0이면 제1, 3사분면, a < 0이면 제2, 4사분면을 지난다.", "그래프 위의 점의 x좌표가 주어지면 y좌표를 a로 나타낸 뒤, 도형의 가로·세로 길이를 a로 표현하여 넓이식을 세운다."], "t": "그래프 위의 점은 (x, a/x)로 놓고, 길이는 좌표의 차로 계산합니다."}, "qf": {"n": "이차함수와 그래프", "g": "중3", "d": "fun", "p": ["y = a(x − p)² + q:  꼭짓점 (p, q), 축 x = p.  a > 0이면 아래로 볼록, a < 0이면 위로 볼록", "y = ax² + bx + c는 완전제곱식으로 고쳐 y = a(x − p)² + q 꼴로 만든다.", "y절편은 x = 0일 때의 값 c, x절편은 y = 0인 이차방정식의 근이다.", "y = ax²을 x축 방향으로 p, y축 방향으로 q만큼 평행이동하면 y = a(x − p)² + q"], "t": "그래프의 꼭짓점, 축, 절편을 먼저 구하면 대부분의 조건이 정리됩니다."}, "qf_max": {"n": "꼭짓점의 y좌표와 최댓값·최솟값", "g": "중3", "d": "fun", "p": ["y = a(x − p)² + q에서 a > 0이면 x = p일 때 최솟값 q, a < 0이면 x = p일 때 최댓값 q이다.", "그래프의 꼭짓점의 y좌표를 읽는 것으로 접근한다.", "(참고) 이차함수의 최대·최소는 고1 공통수학1에서 더 자세히 배운다."], "t": "표준형으로 고치면 꼭짓점의 y좌표가 바로 최댓값 또는 최솟값입니다."}, "coord_area": {"n": "좌표평면 위의 도형의 넓이", "g": "중2", "d": "fun", "p": ["좌표축에 평행한 선분의 길이는 두 점의 좌표의 차로 구한다.", "삼각형은 ½ × (밑변) × (높이)로 구하되, 좌표축에 평행한 변을 밑변으로 택하면 쉽다.", "사각형은 삼각형 둘로 나누거나 (큰 도형) − (작은 도형)으로 구한다.", "점의 좌표를 미지수로 놓고 넓이를 식으로 세운 뒤 방정식을 푼다."], "t": "밑변과 높이를 좌표의 차로 표현할 수 있는 삼각형으로 나누어 봅니다."}, "tri_ratio": {"n": "삼각비", "g": "중3", "d": "geo", "p": ["∠C = 90°인 직각삼각형 ABC에서 ∠A, ∠B, ∠C의 대변의 길이를 각각 a, b, c라 할 때,  sin A = a/c,  cos A = b/c,  tan A = a/b", "특수각의 삼각비:  30°, 45°, 60°에서  sin = 1/2, √2/2, √3/2,  cos = √3/2, √2/2, 1/2,  tan = √3/3, 1, √3", "한 변의 길이와 삼각비의 값을 알면 나머지 변의 길이를 구할 수 있고, 피타고라스 정리와 함께 쓴다.", "직각이 보이지 않을 때는 수선을 그어 직각삼각형을 만든다."], "t": "어느 각을 기준으로 대변, 밑변, 빗변을 잡는지 먼저 표시합니다."}, "pyth": {"n": "피타고라스 정리", "g": "중2", "d": "geo", "p": ["직각삼각형에서 빗변의 길이를 c, 나머지 두 변의 길이를 a, b라 하면 a² + b² = c²", "자주 나오는 세 수:  3-4-5,  5-12-13,  8-15-17", "직사각형의 대각선, 정사각형의 대각선(한 변이 a이면 √2a), 정삼각형의 높이(한 변이 a이면 (√3/2)a)", "좌표평면 위의 두 점 사이의 거리도 피타고라스 정리로 구한다."], "t": "직각삼각형이 보이지 않으면 수선을 그어 직각삼각형을 만듭니다."}, "tri_center": {"n": "삼각형의 외심·내심·무게중심", "g": "중2", "d": "geo", "p": ["외심:  세 변의 수직이등분선의 교점이며, 세 꼭짓점까지의 거리가 같다(외접원의 반지름). 직각삼각형의 외심은 빗변의 중점이다.", "내심:  세 내각의 이등분선의 교점이며, 세 변까지의 거리가 같다(내접원의 반지름 r).  삼각형의 넓이 = ½ r (a + b + c).  직각삼각형에서 r = (a + b − c)/2 (c는 빗변)", "무게중심:  세 중선의 교점이며, 중선을 꼭짓점에서 2 : 1로 나눈다. 세 중선은 삼각형의 넓이를 6등분한다.", "∠BOC = 2∠A (O는 외심),  ∠BIC = 90° + ½∠A (I는 내심)"], "t": "외심은 거리가 같다, 내심은 각을 이등분한다, 무게중심은 2 : 1이다 — 세 가지 키워드를 먼저 떠올립니다."}, "sim": {"n": "닮음과 평행선, 넓이의 비", "g": "중2", "d": "geo", "p": ["닮음 조건:  세 변의 길이의 비가 같다(SSS), 두 변의 길이의 비와 그 끼인각의 크기가 같다(SAS), 두 각의 크기가 각각 같다(AA)", "삼각형과 평행선:  DE ∥ BC이면 AD : AB = AE : AC = DE : BC", "닮음비가 m : n이면 길이의 비는 m : n, 넓이의 비는 m² : n², 부피의 비는 m³ : n³", "직각삼각형 ABC에서 AH ⊥ BC이면 AB² = BH × BC,  AH² = BH × CH"], "t": "평행선이나 같은 각이 보이면 닮은 삼각형을 찾고, 대응하는 변의 비를 세웁니다."}, "angle_bisect": {"n": "삼각형의 각의 이등분선", "g": "중2", "d": "geo", "p": ["삼각형 ABC에서 ∠A의 이등분선이 변 BC와 만나는 점을 D라 하면  AB : AC = BD : DC", "증명의 아이디어: 한 꼭짓점에서 평행선을 그어 동위각·엇각을 이용하면 이등변삼각형이 생기고 닮음으로 연결된다.", "(교과서에서 심화로 다루는 경우가 많다.)"], "t": "각의 이등분선과 평행선이 함께 나오면 이등변삼각형이 숨어 있습니다."}, "circle_angle": {"n": "원주각과 중심각", "g": "중3", "d": "geo", "p": ["한 호에 대한 원주각의 크기는 그 호에 대한 중심각의 크기의 ½이다.", "같은 호에 대한 원주각의 크기는 모두 같다. 반원에 대한 원주각은 90°이다.", "호의 길이는 중심각의 크기에 정비례한다. 크기가 같은 원주각에 대한 호의 길이는 같다.", "원에 내접하는 사각형에서 마주 보는 두 각의 크기의 합은 180°이다."], "t": "호가 보이면 그 호에 대한 중심각과 원주각을 모두 표시해 봅니다."}, "circle_tan": {"n": "원의 접선", "g": "중3", "d": "geo", "p": ["원의 접선은 접점을 지나는 반지름에 수직이다.", "원 밖의 한 점 P에서 원에 그은 두 접선의 길이는 같다 (PA = PB).", "접선과 현이 이루는 각의 크기는 그 현에 대한 원주각의 크기와 같다.", "반지름이 r, OP = d이면 접선의 길이는 √(d² − r²)"], "t": "접점에서 반지름을 그으면 직각삼각형이 생깁니다."}, "circle_chord": {"n": "원의 현", "g": "중3", "d": "geo", "p": ["원의 중심에서 현에 내린 수선은 그 현을 이등분한다.", "중심에서 현까지의 거리가 d, 반지름이 r이면 현의 길이는 2√(r² − d²)", "길이가 같은 두 현은 원의 중심에서 같은 거리에 있다."], "t": "중심에서 현에 수선을 그어 직각삼각형을 만듭니다."}, "poly_angle": {"n": "다각형과 평행선의 각", "g": "중1", "d": "geo", "p": ["n각형의 내각의 크기의 합은 180° × (n − 2), 외각의 크기의 합은 360°이다.", "정n각형의 한 내각의 크기는 180° × (n − 2)/n, 한 외각의 크기는 360°/n", "삼각형의 한 외각의 크기는 그와 이웃하지 않는 두 내각의 크기의 합과 같다.", "평행선에서 동위각, 엇각의 크기는 같다."], "t": "모르는 각을 x로 놓고 삼각형 내각의 합 180°로 식을 세웁니다."}, "solid": {"n": "입체도형의 겉넓이와 부피", "g": "중1", "d": "geo", "p": ["기둥의 부피 = (밑넓이) × (높이),  뿔의 부피 = ⅓ × (밑넓이) × (높이)", "원기둥의 겉넓이 = 2πr² + 2πrh,  원뿔의 겉넓이 = πr² + πrl (l은 모선의 길이)", "구의 부피 = 4/3 πr³,  구의 겉넓이 = 4πr²", "회전체는 회전축을 포함하는 평면으로 자른 단면은 선대칭도형, 회전축에 수직인 평면으로 자른 단면은 원이다.", "전개도는 입체도형의 각 면을 펼친 그림이며, 둘레와 넓이는 펼친 그림에서 계산한다."], "t": "입체도형은 밑면의 모양과 높이를 먼저 확인하고, 필요하면 단면이나 전개도를 그립니다."}, "plane_area": {"n": "평면도형의 넓이와 부채꼴", "g": "중1", "d": "geo", "p": ["삼각형 ½ × (밑변) × (높이),  평행사변형 (밑변) × (높이),  사다리꼴 ½ × (윗변 + 아랫변) × (높이),  마름모 ½ × (두 대각선의 곱)", "부채꼴의 호의 길이 = 2πr × (중심각/360°),  넓이 = πr² × (중심각/360°)", "높이가 같은 두 삼각형의 넓이의 비는 밑변의 길이의 비와 같다.", "(전체) − (부분), 또는 도형을 나누어 합으로 넓이를 구한다."], "t": "넓이를 직접 구하기 어려우면 높이가 같은 삼각형으로 나누어 넓이의 비를 이용합니다."}, "quad_prop": {"n": "사각형의 성질", "g": "중2", "d": "geo", "p": ["평행사변형은 두 쌍의 대변의 길이가 각각 같고, 두 쌍의 대각의 크기가 각각 같고, 두 대각선이 서로 다른 것을 이등분한다.", "마름모는 네 변의 길이가 같고 두 대각선이 서로 수직으로 이등분한다. 직사각형은 두 대각선의 길이가 같다.", "평행사변형의 대각선은 넓이를 이등분하고, 두 대각선으로 나뉜 네 삼각형의 넓이는 모두 같다.", "평행선 사이에 있고 밑변이 같은 두 삼각형의 넓이는 같다."], "t": "평행사변형이 나오면 평행선(동위각·엇각)과 합동·닮음을 함께 찾아봅니다."}, "tri_prop": {"n": "이등변삼각형과 삼각형의 합동", "g": "중2", "d": "geo", "p": ["이등변삼각형은 두 밑각의 크기가 같고, 꼭지각의 이등분선은 밑변을 수직이등분한다.", "삼각형의 합동 조건:  SSS, SAS, ASA", "삼각형의 내각의 크기의 합은 180°이고, 한 외각은 이웃하지 않는 두 내각의 합과 같다."], "t": "같은 길이나 같은 각을 찾으면 이등변삼각형이나 합동을 떠올립니다."}, "midpoint": {"n": "삼각형의 중점연결정리", "g": "중2", "d": "geo", "p": ["삼각형 ABC에서 변 AB, AC의 중점을 각각 M, N이라 하면  MN ∥ BC 이고 MN = ½ BC", "삼각형과 평행선의 길이의 비에서 닮음비가 1 : 2인 특별한 경우이다."], "t": "변의 중점이 두 개 보이면 중점연결정리를 먼저 적용합니다."}, "hist": {"n": "자료의 정리와 해석", "g": "중1", "d": "sta", "p": ["상대도수 = (그 계급의 도수) / (도수의 총합).  상대도수의 총합은 1이다.", "도수분포표에서 평균 = Σ(계급값 × 도수) / (도수의 총합)", "히스토그램의 직사각형의 높이와 도수분포다각형의 점의 높이가 도수이다. 도수분포다각형은 양 끝에 도수가 0인 계급이 하나씩 더 있다.", "줄기와 잎 그림에서 줄기는 앞자리, 잎은 뒷자리이다. 잎을 크기순으로 정리하여 읽는다.", "도수의 총합이 다른 두 집단은 상대도수로 비교한다."], "t": "그림에서 계급, 도수, 도수의 총합을 먼저 읽어 표로 옮깁니다."}, "cen": {"n": "대푯값(평균·중앙값·최빈값)", "g": "중3", "d": "sta", "p": ["평균 = (변량의 총합) / (변량의 개수)", "중앙값:  변량을 크기순으로 나열했을 때 한가운데 값. 변량의 개수가 짝수이면 가운데 두 값의 평균", "최빈값:  도수가 가장 큰 변량 (여러 개일 수도 있다)", "평균, 중앙값, 최빈값이 조건으로 주어지면 미지수를 하나씩 정하여 식을 세운다."], "t": "변량을 크기순으로 나열한 뒤 조건을 하나씩 확인합니다."}, "disp": {"n": "산포도(분산·표준편차)", "g": "중3", "d": "sta", "p": ["편차 = (변량) − (평균),  편차의 총합은 항상 0이다.", "분산 = (편차의 제곱의 합) / (변량의 개수),  표준편차 = √(분산)", "표준편차가 클수록 자료가 평균에서 멀리 흩어져 있다.", "각 변량에 같은 수를 곱하면(a배) 분산은 a²배가 된다."], "t": "평균을 먼저 구하고, 편차의 제곱을 표로 정리하여 계산합니다."}, "scatter": {"n": "산점도와 상관관계", "g": "중3", "d": "sta", "p": ["산점도는 두 변량의 순서쌍을 좌표평면 위에 점으로 나타낸 그래프이다.", "양의 상관관계는 x가 증가할 때 y도 증가하는 경향, 음의 상관관계는 x가 증가할 때 y가 감소하는 경향이다.", "점들이 한 직선에 가까이 모일수록 상관관계가 강하다.", "직선 y = x를 그어 위쪽 점은 y가 큰 경우, 아래쪽 점은 x가 큰 경우로 개수를 센다."], "t": "문제의 조건을 직선으로 그어 점의 개수를 세면 쉽습니다."}, "counting": {"n": "경우의 수", "g": "중2", "d": "sta", "p": ["합의 법칙:  동시에 일어나지 않는 두 사건이 일어나는 경우의 수가 각각 m, n이면 m + n", "곱의 법칙:  두 사건이 잇달아 일어나는 경우의 수가 각각 m, n이면 m × n", "n명 중 r명을 뽑아 한 줄로 세우는 경우의 수는 n × (n−1) × … × (n−r+1).  자격이 다른 대표를 뽑는 경우도 같다.", "수형도나 표로 빠짐없이 센다. '~하지 않는' 경우는 (전체) − (~하는 경우)로 센다."], "t": "조건이 있으면 조건에 맞는 경우를 먼저 나누고 합·곱의 법칙으로 계산합니다."}, "prob": {"n": "확률", "g": "중2", "d": "sta", "p": ["확률 = (사건 A가 일어나는 경우의 수) / (모든 경우의 수),  0 ≤ 확률 ≤ 1", "사건 A가 일어나지 않을 확률 = 1 − (A가 일어날 확률)", "'적어도 하나'는 여사건을 이용하는 경우가 많다.", "동시에 일어나지 않는 두 사건의 확률은 더하고, 서로 영향을 주지 않는 두 사건이 모두 일어날 확률은 곱한다.", "주사위 두 개를 던지면 모든 경우의 수는 36, 동전 n개는 2ⁿ"], "t": "확률은 분모(모든 경우의 수)와 분자(조건에 맞는 경우의 수)를 따로 세어 나눕니다."}, "gcd_lcm": {"n": "최대공약수·최소공배수의 활용", "g": "중1", "d": "num", "p": ["두 수 A, B의 최대공약수를 G, 최소공배수를 L이라 하면 A = G×a, B = G×b (a, b는 서로소)이고 L = G×a×b, 따라서 A×B = G×L이다.", "\"가능한 한 큰 정사각형으로 나누기\", \"똑같이 나누어 주기\"처럼 나누어떨어지는 최대의 수를 찾으면 최대공약수이다.", "\"동시에 다시 만나는 날\", \"가장 작은 정사각형 만들기\"처럼 공통으로 맞아떨어지는 최소의 수를 찾으면 최소공배수이다.", "서로소는 최대공약수가 1인 두 자연수이다."], "t": "문제 문장이 \"가장 큰/나누어\"이면 최대공약수, \"가장 작은/동시에\"이면 최소공배수입니다."}, "expr_value": {"n": "문자의 사용과 일차식의 계산", "g": "중1", "d": "alg", "p": ["곱셈 기호 ×는 생략하고 수를 문자 앞에 쓴다.  a×3 → 3a,  a÷b → a/b", "식의 값은 문자에 수를 대입하여 구한다. 음수를 대입할 때는 괄호를 쓴다.", "일차식의 덧셈·뺄셈은 문자와 차수가 같은 항(동류항)끼리 모아 계수를 계산한다.", "괄호 앞에 −가 있으면 괄호를 풀 때 모든 항의 부호가 바뀐다."], "t": "식이 길면 먼저 괄호를 풀고 동류항을 모은 뒤 계산합니다."}, "exp_law": {"n": "지수법칙과 단항식의 계산", "g": "중2", "d": "alg", "p": ["aᵐ × aⁿ = aᵐ⁺ⁿ,  (aᵐ)ⁿ = aᵐⁿ,  (ab)ⁿ = aⁿbⁿ", "aᵐ ÷ aⁿ = aᵐ⁻ⁿ (m>n), 1 (m=n), 1/aⁿ⁻ᵐ (m<n)  (a≠0)", "단항식의 곱셈·나눗셈은 계수끼리, 문자끼리 계산한다. 나눗셈은 역수의 곱으로 바꾼다.", "2ⁿ, 5ⁿ처럼 밑이 소수인 거듭제곱의 곱은 10의 거듭제곱을 만들면 자릿수를 알 수 있다. 예) 2⁵×5⁵ = 10⁵"], "t": "밑을 같게 만들 수 있으면 지수끼리 계산하고, 밑이 다르면 소인수분해로 밑을 통일합니다."}, "sys_ineq": {"n": "연립일차부등식", "g": "중2", "d": "alg", "p": ["각 부등식의 해를 구한 뒤 수직선 위에서 공통부분을 찾는다.", "공통부분이 없으면 해가 없다.", "A < B < C 꼴은 A < B 와 B < C 를 연립한 것과 같다.", "해가 되는 정수의 개수를 물으면 수직선에 점을 찍고 경계값이 포함되는지(≤, <)를 확인한다."], "t": "수직선에 두 해를 겹쳐 그리고 겹치는 구간만 읽습니다. 등호가 있을 때만 경계값을 포함합니다."}, "speed_app": {"n": "거리·속력·시간과 방정식의 활용", "g": "중2", "d": "alg", "p": ["(거리) = (속력)×(시간),  (속력) = (거리)÷(시간),  (시간) = (거리)÷(속력)", "왕복·마주 보고 걷기: 가는 거리와 오는 거리가 같다. 마주 보고 걸으면 두 사람의 속력의 합으로 만난다.", "같은 방향으로 도는 원형 길: 빠른 사람이 한 바퀴를 더 돌았을 때 만난다. (속력의 차)×(시간) = 한 바퀴", "구하는 것을 x로 놓고, 같은 양(거리 또는 시간)을 두 가지로 나타내어 등식을 세운다. 연립방정식이나 부등식으로 이어지기도 한다."], "t": "표를 그려 속력·시간·거리를 정리하고 \"같은 것\"을 찾아 식을 세웁니다."}, "func_def": {"n": "함수의 뜻과 정비례 그래프", "g": "중1", "d": "fun", "p": ["x의 값이 하나 정해질 때 y의 값이 오직 하나 정해지면 y는 x의 함수이다.", "y = ax (a≠0)는 정비례 관계이고 그래프는 원점을 지나는 직선이다. a > 0이면 오른쪽 위, a < 0이면 오른쪽 아래로 향한다.", "좌표평면에서 점 (a, b)는 x좌표가 a, y좌표가 b이다. 점이 사분면 몇에 있는지는 부호로 정한다.", "그래프 위의 점의 좌표를 식에 대입하면 등식이 성립한다."], "t": "그래프 위의 점이 주어지면 x, y를 식에 대입하여 상수 a를 구합니다."}, "qf_area": {"n": "이차함수와 도형의 넓이", "g": "중3", "d": "fun", "p": ["x축과의 교점은 y = 0인 방정식의 근, 꼭짓점은 y = a(x−p)²+q 꼴로 고쳐 구한다.", "이차함수와 직선의 교점은 두 식을 연립한 이차방정식의 근으로 구한다.", "밑변은 x좌표의 차, 높이는 y좌표의 차로 구하고, 축에 평행한 변을 밑변으로 잡는다.", "축에 평행한 변이 없는 삼각형은 축에 평행한 선분으로 둘로 나누거나 (큰 도형) − (작은 도형)으로 구한다."], "t": "좌표를 모두 구해 그림에 적은 뒤, 밑변과 높이를 좌표의 차로 바꿔 계산합니다. 고1 모의고사 4점 함수 문항에 자주 나옵니다."}, "proof": {"n": "도형의 증명과 과정 완성", "g": "중2", "d": "geo", "p": ["증명은 가정에서 출발하여 결론이 성립함을 이유와 함께 단계별로 보이는 것이다.", "삼각형의 합동 조건: SSS, SAS, ASA. 대응하는 변·각을 같은 순서로 쓴다.", "합동이면 대응변의 길이와 대응각의 크기가 같다. 이를 이용하여 길이나 각이 같음을 보인다.", "과정 완성형 문제에서는 앞뒤 문장에서 어떤 합동(또는 닮음) 조건이 쓰였는지 먼저 찾는다."], "t": "빈칸의 앞과 뒤를 읽고, 같은 것(변·각)과 이유(공통, 맞꼭지각, 이등변삼각형 등)를 표시합니다."}, "tri_app": {"n": "삼각비의 활용(높이·거리)", "g": "중3", "d": "geo", "p": ["직각삼각형에서 한 변의 길이와 한 각의 크기를 알면 나머지 변은 삼각비로 구한다.", "높이 = (밑변)×tan(올려다본 각),  빗변 = (높이)÷sin(각)", "건물·나무의 높이는 (수평거리)×tan(각) + 눈높이처럼 구한다.", "직각이 없는 삼각형은 한 꼭짓점에서 수선을 그어 두 직각삼각형으로 나누어 푼다."], "t": "어느 변이 주어졌는지(밑변·높이·빗변)를 확인하고 sin, cos, tan 중 알맞은 것을 고릅니다."}, "perm_comb": {"n": "줄 세우기와 대표 뽑기(순열·조합 기초)", "g": "중2", "d": "sta", "p": ["n명을 한 줄로 세우는 경우의 수는 n×(n−1)×…×2×1 이다.", "이웃하게 세울 때는 이웃하는 것을 한 묶음으로 보고 묶음 안의 순서도 센다. 이웃하지 않게 세울 때는 (전체) − (이웃하는 경우)로 센다.", "n명 중 자격이 다른 대표 2명을 뽑으면 n×(n−1), 자격이 같은 대표 2명을 뽑으면 n×(n−1)÷2 이다.", "0이 맨 앞에 올 수 없는 수 만들기는 맨 앞자리부터 조건을 정한다. (고1 공통수 n이 제곱수가 되려면 n=2×3×5=30일 때 120/30=4=2²이다. 30보다 작은 자연수 중에는 조건을 만족하는 수가 없다.", "con": ["pf", "sqrt_nat"]}, {"id": "N3-3", "dom": "num", "ti": 2, "lv": "응용", "text": "두 자리 자연수 n에 대하여 √(18n)이 자연수가 되는 n의 개수는?", "fig": null, "ch": ["5", "3", "4", "6", "7"], "ans": 1, "sol": "18n=2×3²×n이 제곱수이려면 n=2×m² (m은 자연수) 꼴이어야 한다. 두 자리 수는 18, 32, 50, 72, 98로 5개이다.", "con": ["pf", "sqrt_nat"]}, {"id": "A1-1", "dom": "alg", "ti": 0, "lv": "기본", "text": "x+1/x=3일 때, x²+1/x²의 값은?", "fig": null, "ch": ["5", "6", "8", "7", "9"], "ans": 4, "sol": "(x+1/x)²=x²+2+1/x²이므로 9=x²+1/x²+2, 따라서 x²+1/x²=7이다.", "con": ["mult_formula"]}, {"id": "A1-2", "dom": "alg", "ti": 0, "lv": "기출 수준", "text": "x−y=3, xy=4일 때, x²+y²의 값은?", "fig": null, "ch": ["13", "15", "19", "21", "17"], "ans": 5, "sol": "(x−y)²=x²−2xy+y²이므로 9=x²+y²−8, 따라서 x²+y²=17이다.", "con": ["mult_formula"]}, {"id": "A1-3", "dom": "alg", "ti": 0, "lv": "응용", "text": "x²−5x+1=0일 때, x²+1/x²의 값은?", "fig": null, "ch": ["23", "21", "25", "27", "29"], "ans": 1, "sol": "x≠0이므로 양변을 x로 나누면 x−5+1/x=0, 즉 x+1/x=5이다. x²+1/x²=(x+1/x)²−2=25−2=23이다.", "con": ["mult_formula"]}, {"id": "A2-1", "dom": "alg", "ti": 1, "lv": "기본", "text": "x=√3+1, y=√3−1일 때, x²−y²의 값은?", "fig": null, "ch": ["2√3", "3√3", "5√3", "6√3", "4√3"], "ans": 5, "sol": "x²−y²=(x+y)(x−y)=2√3×2=4√3이다.", "con": ["factor"]}, {"id": "A2-2", "dom": "alg", "ti": 1, "lv": "기출 수준", "text": "a=√5+2, b=√5−2일 때, a²+2ab+b²의 값은?", "fig": null, "ch": ["20", "16", "18", "22", "24"], "ans": 1, "sol": "a²+2ab+b²=(a+b)²=(2√5)²=20이다.", "con": ["factor", "sqrt_calc"]}, {"id": "A2-3", "dom": "alg", "ti": 1, "lv": "응용", "text": "다항식 x²+ax−12가 (x−3)(x+b)로 인수분해될 때, a+b의 값은?", "fig": null, "ch": ["3", "5", "4", "6", "7"], "ans": 2, "sol": "(x−3)(x+b)=x²+(b−3)x−3b이다. −3b=−12이므로 b=4, a=b−3=1이다. 따라서 a+b=5이다.", "con": ["factor"]}, {"id": "A3-1", "dom": "alg", "ti": 2, "lv": "기본", "text": "이차방정식 x²+ax−6=0의 한 근이 2일 때, 다른 한 근은? (단, a는 상수이다.)", "fig": null, "ch": ["-3", "-6", "-2", "2", "3"], "ans": 1, "sol": "x=2를 대입하면 4+2a−6=0이므로 a=1이다. x²+x−6=(x+3)(x−2)=0이므로 다른 한 근은 −3이다.", "con": ["quad_eq"]}, {"id": "A3-2", "dom": "alg", "ti": 2, "lv": "기출 수준", "text": "이차방정식 x²−6x+2=0의 두 근 중 큰 근은?", "fig": null, "ch": ["3+√11", "3+√7", "6+√7", "3+2√7", "6+√11"], "ans": 2, "sol": "근의 공식에 의하여 x=(6±√(36−8))/2=(6±2√7)/2=3±√7이다. 큰 근은 3+√7이다.", "con": ["quad_eq", "sqrt_calc"]}, {"id": "A3-3", "dom": "alg", "ti": 2, "lv": "응용", "text": "두 이차방정식 x²−x−6=0, x²+ax+6=0이 공통인 근을 가질 때, 양수 a의 값은?", "fig": null, "ch": ["2", "3", "5", "4", "6"], "ans": 3, "sol": "x²−x−6=(x−3)(x+2)=0에서 x=3 또는 x=−2이다. x=3을 대입하면 9+3a+6=0, a=−5이고, x=−2를 대입하면 4−2a+6=0, a=5이다. 양수 a는 5이다.", "con": ["quad_eq"]}, {"id": "A4-1", "dom": "alg", "ti": 3, "lv": "기본", "text": "연속하는 두 자연수의 곱이 56일 때, 두 수의 합은?", "fig": null, "ch": ["13", "15", "14", "16", "17"], "ans": 2, "sol": "작은 수를 x라 하면 x(x+1)=56, x²+x−56=(x+8)(x−7)=0에서 x=7이다. 두 수는 7, 8이고 합은 15이다.", "con": ["quad_app"]}, {"id": "A4-2", "dom": "alg", "ti": 3, "lv": "기출 수준", "text": "가로의 길이가 세로의 길이보다 3만큼 긴 직사각형의 넓이가 40일 때, 이 직사각형의 둘레의 길이는?", "fig": null, "ch": ["22", "24", "26", "28", "30"], "ans": 3, "sol": "세로를 x라 하면 x(x+3)=40, x²+3x−40=(x+8)(x−5)=0에서 x=5이다. 가로는 8이므로 둘레는 2×(5+8)=26이다.", "con": ["quad_app"]}, {"id": "A4-3", "dom": "alg", "ti": 3, "lv": "응용", "text": "연속하는 세 자연수 중 가장 큰 수의 제곱이 나머지 두 수의 제곱의 합과 같을 때, 세 자연수의 합은?", "fig": null, "ch": ["9", "15", "18", "12", "21"], "ans": 4, "sol": "세 수를 x, x+1, x+2라 하면 (x+2)²=x²+(x+1)²이다. 정리하면 x²−2x−3=0, (x−3)(x+1)=0이므로 x=3이다. 세 수는 3, 4, 5이고 합은 12이다.", "con": ["quad_app", "pyth"]}, {"id": "F1-1", "dom": "fun", "ti": 0, "lv": "기본", "text": "이차함수 y=−x²+4x+1의 최댓값은?", "fig": null, "ch": ["3", "4", "6", "5", "7"], "ans": 4, "sol": "y=−(x−2)²+5이므로 x=2일 때 최댓값 5를 갖는다.", "con": ["qf", "qf_max"]}, {"id": "F1-2", "dom": "fun", "ti": 0, "lv": "기출 수준", "text": "이차함수 y=2x²−8x+3의 그래프의 꼭짓점의 y좌표는?", "fig": null, "ch": ["-7", "-3", "-1", "1", "-5"], "ans": 5, "sol": "y=2(x²−4x)+3=2(x−2)²−8+3=2(x−2)²−5이므로 꼭짓점은 (2, −5)이다.", "con": ["qf", "qf_max"]}, {"id": "F1-3", "dom": "fun", "ti": 0, "lv": "응용", "text": "이차함수 y=x²+ax+b의 그래프의 꼭짓점의 좌표가 (2, −3)일 때, a+b의 값은?", "fig": null, "ch": ["-3", "-5", "-4", "-2", "-1"], "ans": 1, "sol": "y=(x−2)²−3=x²−4x+1이므로 a=−4, b=1이다. 따라서 a+b=−3이다.", "con": ["qf"]}, {"id": "F2-1", "dom": "fun", "ti": 1, "lv": "기본", "text": "이차함수 y=x²의 그래프와 직선 y=x+2의 두 교점 사이의 거리는?", "fig": null, "ch": ["2√2", "3", "4√2", "5", "3√2"], "ans": 5, "sol": "x²=x+2에서 x=−1 또는 x=2이다. 교점은 (−1, 1), (2, 4)이고 거리는 √(3²+3²)=3√2이다.", "con": ["qf", "lf_eq", "pyth"]}, {"id": "F2-2", "dom": "fun", "ti": 1, "lv": "기출 수준", "text": "이차함수 y=x²−4의 그래프와 직선 y=2x−1의 두 교점 사이의 거리는?", "fig": null, "ch": ["4√5", "2√5", "3√5", "5√5", "6√5"], "ans": 1, "sol": "x²−4=2x−1에서 x²−2x−3=0, x=−1 또는 x=3이다. 교점은 (−1, −3), (3, 5)이고 거리는 √(4²+8²)=√80=4√5이다.", "con": ["qf", "lf_eq", "pyth"]}, {"id": "F2-3", "dom": "fun", "ti": 1, "lv": "응용", "text": "그림과 같이 이차함수 y=−x²+4의 그래프와 직선 y=−x+2가 두 점 A, B에서 만난다. 이 이차함수의 그래프의 꼭짓점을 V라 할 때, 삼각형 ABV의 넓이는?", "fig": "p_f23", "ch": ["2", "3", "4", "5", "6"], "ans": 2, "sol": "−x²+4=−x+2에서 x²−x−2=0, x=−1 또는 x=2이므로 A(−1, 3), B(2, 0), V(0, 4)이다. 직선 AB가 y축과 만나는 점을 D(0, 2)라 하면 VD=2이다. 삼각형 ABV의 넓이는 (삼각형 AVD)+(삼각형 BVD)=½×2×1+½×2×2=3이다.", "con": ["qf", "lf_eq", "coord_area"]}, {"id": "F3-1", "dom": "fun", "ti": 2, "lv": "기본", "text": "일차함수 y=2x+4의 그래프와 x축, y축으로 둘러싸인 삼각형의 넓이는?", "fig": null, "ch": ["4", "2", "3", "5", "6"], "ans": 1, "sol": "x절편은 −2, y절편은 4이므로 넓이는 ½×2×4=4이다.", "con": ["lf", "coord_area"]}, {"id": "F3-2", "dom": "fun", "ti": 2, "lv": "기출 수준", "text": "일차함수 y=−1/2 x+3의 그래프와 x축, y축으로 둘러싸인 삼각형의 넓이는?", "fig": null, "ch": ["6", "9", "7", "8", "10"], "ans": 2, "sol": "x절편은 6, y절편은 3이므로 넓이는 ½×6×3=9이다.", "con": ["lf", "coord_area"]}, {"id": "F3-3", "dom": "fun", "ti": 2, "lv": "응용", "text": "그림과 같이 두 직선 y=x+1, y=−2x+7의 교점을 P라 하고, 두 직선이 x축과 만나는 점을 각각 A, B라 할 때, 삼각형 PAB의 넓이는?", "fig": "p_f33", "ch": ["13/2", "7", "27/4", "29/4", "15/2"], "ans": 3, "sol": "x+1=−2x+7에서 x=2, y=3이므로 P(2, 3)이다. 직선 y=x+1의 x절편은 −1, 직선 y=−2x+7의 x절편은 7/2이므로 A(−1, 0), B(7/2, 0)이다. AB=9/2이고 높이는 3이므로 넓이는 ½×9/2×3=27/4이다.", "con": ["lf", "lf_eq", "coord_area"]}, {"id": "F4-1", "dom": "fun", "ti": 3, "lv": "기본", "text": "이차함수 y=x²의 그래프를 x축의 방향으로 2만큼, y축의 방향으로 −3만큼 평행이동한 그래프가 점 (4, k)를 지날 때, k의 값은?", "fig": null, "ch": ["-1", "1", "0", "2", "3"], "ans": 2, "sol": "평행이동한 그래프의 식은 y=(x−2)²−3이다. x=4를 대입하면 k=4−3=1이다.", "con": ["qf"]}, {"id": "F4-2", "dom": "fun", "ti": 3, "lv": "기출 수준", "text": "이차함수 y=−2x²의 그래프를 x축의 방향으로 1만큼, y축의 방향으로 −3만큼 평행이동한 그래프가 점 (2, m)을 지날 때, m의 값은?", "fig": null, "ch": ["-7", "-3", "-5", "-1", "1"], "ans": 3, "sol": "평행이동한 그래프의 식은 y=−2(x−1)²−3이다. x=2를 대입하면 m=−2−3=−5이다.", "con": ["qf"]}, {"id": "F4-3", "dom": "fun", "ti": 3, "lv": "응용", "text": "이차함수 y=x²−6x+5의 그래프를 x축의 방향으로 −2만큼, y축의 방향으로 k만큼 평행이동한 그래프가 원점을 지날 때, k의 값은?", "fig": null, "ch": ["1", "2", "4", "3", "5"], "ans": 4, "sol": "y=(x−3)²−4이다. x축의 방향으로 −2만큼, y축의 방향으로 k만큼 평행이동하면 y=(x+2−3)²−4+k=(x−1)²−4+k이다. 원점을 지나므로 1−4+k=0, k=3이다.", "con": ["qf"]}, {"id": "G1-1", "dom": "geo", "ti": 0, "lv": "기본", "text": "∠B=90°인 직각삼각형 ABC에서 sin A=3/5일 때, tan A의 값은?", "fig": null, "ch": ["1/2", "3/5", "2/3", "4/5", "3/4"], "ans": 5, "sol": "sin A=3/5이므로 대변을 3, 빗변을 5라 하면 밑변은 √(5²−3²)=4이다. tan A=3/4이다.", "con": ["tri_ratio", "pyth"]}, {"id": "G1-2", "dom": "geo", "ti": 0, "lv": "기출 수준", "text": "∠B=90°, AB=6, AC=10인 직각삼각형 ABC에서 sin A+cos A의 값은?", "fig": null, "ch": ["7/5", "6/5", "8/5", "9/5", "2"], "ans": 1, "sol": "BC=√(10²−6²)=8이다. sin A=8/10, cos A=6/10이므로 합은 14/10=7/5이다.", "con": ["tri_ratio", "pyth"]}, {"id": "G1-3", "dom": "geo", "ti": 0, "lv": "응용", "text": "나무로부터 10 m 떨어진 지점에서 나무의 꼭대기를 올려다본 각의 크기가 60°이다. 눈의 높이가 1.5 m일 때, 나무의 높이는? (단위: m)", "fig": null, "ch": ["10√3", "10√3+1.5", "10√3+1", "10√3+2", "20"], "ans": 2, "sol": "tan 60°=√3이므로 눈높이에서 꼭대기까지의 높이는 10×√3=10√3이다. 눈높이 1.5를 더하면 10√3+1.5이다.", "con": ["tri_ratio"]}, {"id": "G2-1", "dom": "geo", "ti": 1, "lv": "기본", "text": "세 변의 길이가 3, 4, 5인 직각삼각형의 내접원의 반지름의 길이는?", "fig": null, "ch": ["1", "1/2", "3/2", "2", "5/2"], "ans": 1, "sol": "직각삼각형의 내접원의 반지름의 길이는 (3+4−5)/2=1이다.", "con": ["pyth", "tri_center"]}, {"id": "G2-2", "dom": "geo", "ti": 1, "lv": "기출 수준", "text": "그림과 같이 ∠B=90°, AB=5, BC=12인 직각삼각형 ABC의 내접원의 반지름의 길이는?", "fig": "p_g22", "ch": ["1", "2", "3", "4", "5"], "ans": 2, "sol": "AC=√(5²+12²)=13이다. 내접원의 반지름은 (5+12−13)/2=2이다.", "con": ["pyth", "tri_center"]}, {"id": "G2-3", "dom": "geo", "ti": 1, "lv": "응용", "text": "세 변의 길이가 3, 4, 5인 직각삼각형의 외접원의 넓이와 내접원의 넓이의 차는?", "fig": null, "ch": ["5π", "6π", "21π/4", "25π/4", "7π"], "ans": 3, "sol": "직각삼각형의 외접원의 반지름은 빗변의 길이의 ½인 5/2이므로 넓이는 25π/4이다. 내접원의 반지름은 1이므로 넓이는 π이다. 차는 25π/4−π=21π/4이다.", "con": ["pyth", "tri_center"]}, {"id": "G3-1", "dom": "geo", "ti": 2, "lv": "기본", "text": "닮음비가 2 : 3인 두 도형 중 작은 도형의 넓이가 12일 때, 큰 도형의 넓이는?", "fig": null, "ch": ["18", "27", "24", "30", "36"], "ans": 2, "sol": "넓이의 비는 2² : 3² = 4 : 9이다. 작은 도형의 넓이가 12이므로 큰 도형의 넓이는 12×9/4=27이다.", "con": ["sim"]}, {"id": "G3-2", "dom": "geo", "ti": 2, "lv": "기출 수준", "text": "그림과 같이 삼각형 ABC에서 DE∥BC이고 AD : DB=1 : 2이다. 삼각형 ABC의 넓이가 54일 때, 삼각형 ADE의 넓이는?", "fig": "p_g32", "ch": ["4", "8", "6", "9", "12"], "ans": 3, "sol": "AD : AB=1 : 3이므로 삼각형 ADE와 삼각형 ABC의 닮음비는 1 : 3, 넓이의 비는 1 : 9이다. 삼각형 ADE의 넓이는 54/9=6이다.", "con": ["sim"]}, {"id": "G3-3", "dom": "geo", "ti": 2, "lv": "응용", "text": "닮은 두 입체도형의 겉넓이의 비가 4 : 9이다. 작은 입체도형의 부피가 40일 때, 큰 입체도형의 부피는?", "fig": null, "ch": ["120", "150", "180", "135", "200"], "ans": 4, "sol": "겉넓이의 비가 4 : 9이므로 닮음비는 2 : 3이다. 부피의 비는 2³ : 3³ = 8 : 27이다. 큰 입체도형의 부피는 40×27/8=135이다.", "con": ["sim", "solid"]}, {"id": "G4-1", "dom": "geo", "ti": 3, "lv": "기본", "text": "그림과 같이 원 O 밖의 점 P에서 원에 그은 두 접선의 접점을 각각 A, B라 하자. ∠APB=60°일 때, ∠AOB의 크기는?", "fig": "p_g41", "ch": ["100°", "110°", "120°", "130°", "140°"], "ans": 3, "sol": "접선은 접점을 지나는 반지름에 수직이므로 ∠OAP=∠OBP=90°이다. 사각형 OAPB의 내각의 크기의 합이 360°이므로 ∠AOB=360°−90°−90°−60°=120°이다.", "con": ["circle_tan", "poly_angle"]}, {"id": "G4-2", "dom": "geo", "ti": 3, "lv": "기출 수준", "text": "그림과 같이 원 O 위의 세 점 A, B, C에 대하여 ∠ACB=35°일 때, ∠OAB의 크기는?", "fig": "p_g42", "ch": ["45°", "50°", "60°", "55°", "65°"], "ans": 4, "sol": "호 AB에 대한 원주각이 35°이므로 중심각 ∠AOB=2×35°=70°이다. 삼각형 OAB는 OA=OB인 이등변삼각형이므로 ∠OAB=(180°−70°)/2=55°이다.", "con": ["circle_angle", "tri_prop"]}, {"id": "G4-3", "dom": "geo", "ti": 3, "lv": "응용", "text": "그림과 같이 원 O 위의 점 A에서의 접선 위에 점 T가 있고, 원 위의 점 B에 대하여 ∠TAB=50°이다. ∠AOB의 크기는?", "fig": "p_g43", "ch": ["80°", "90°", "110°", "120°", "100°"], "ans": 5, "sol": "접선과 현이 이루는 각의 크기는 그 현에 대한 원주각의 크기와 같으므로 호 AB에 대한 원주각은 50°이다. 중심각의 크기는 원주각의 2배이므로 ∠AOB=100°이다.", "con": ["circle_tan", "circle_angle"]}, {"id": "S1-1", "dom": "sta", "ti": 0, "lv": "기본", "text": "서로 다른 두 주사위를 던져 나온 눈의 수의 합이 7일 확률은?", "fig": null, "ch": ["1/9", "1/6", "5/36", "1/4", "1/3"], "ans": 2, "sol": "합이 7인 경우는 (1,6), (2,5), (3,4), (4,3), (5,2), (6,1)의 6가지이고, 모든 경우의 수는 36이다. 확률은 6/36=1/6이다.", "con": ["counting", "prob"]}, {"id": "S1-2", "dom": "sta", "ti": 0, "lv": "기출 수준", "text": "서로 다른 두 주사위를 던질 때 나오는 눈의 수의 합이 4의 배수일 확률은?", "fig": null, "ch": ["1/6", "5/18", "1/4", "7/18", "1/3"], "ans": 3, "sol": "합이 4인 경우 3가지, 8인 경우 5가지, 12인 경우 1가지로 모두 9가지이다. 확률은 9/36=1/4이다.", "con": ["counting", "prob"]}, {"id": "S1-3", "dom": "sta", "ti": 0, "lv": "응용", "text": "동전 2개와 주사위 1개를 동시에 던질 때, 동전이 서로 다른 면이 나오고 주사위의 눈이 3의 배수일 확률은?", "fig": null, "ch": ["1/12", "1/4", "1/3", "1/6", "1/2"], "ans": 4, "sol": "동전 2개가 서로 다른 면이 나올 확률은 2/4=1/2이고, 주사위의 눈이 3의 배수일 확률은 2/6=1/3이다. 두 사건은 서로 영향을 주지 않으므로 1/2×1/3=1/6이다.", "con": ["prob", "counting"]}, {"id": "S2-1", "dom": "sta", "ti": 1, "lv": "기본", "text": "동전 3개를 던질 때, 적어도 한 개가 앞면일 확률은?", "fig": null, "ch": ["3/8", "1/2", "7/8", "5/8", "3/4"], "ans": 3, "sol": "모두 뒷면일 확률이 1/8이므로 구하는 확률은 1−1/8=7/8이다.", "con": ["prob"]}, {"id": "S2-2", "dom": "sta", "ti": 1, "lv": "기출 수준", "text": "서로 다른 두 주사위를 던질 때, 적어도 하나가 홀수일 확률은?", "fig": null, "ch": ["1/2", "2/3", "5/6", "3/4", "8/9"], "ans": 4, "sol": "두 주사위가 모두 짝수일 확률은 1/2×1/2=1/4이다. 구하는 확률은 1−1/4=3/4이다.", "con": ["prob"]}, {"id": "S2-3", "dom": "sta", "ti": 1, "lv": "응용", "text": "당첨 제비 2개를 포함한 5개의 제비가 있다. 꺼낸 제비를 다시 넣지 않고 2개를 연속하여 뽑을 때, 적어도 한 개가 당첨 제비일 확률은?", "fig": null, "ch": ["3/5", "13/20", "4/5", "9/10", "7/10"], "ans": 5, "sol": "두 개 모두 당첨 제비가 아닐 확률은 3/5×2/4=3/10이다. 구하는 확률은 1−3/10=7/10이다.", "con": ["prob", "counting"]}, {"id": "S3-1", "dom": "sta", "ti": 2, "lv": "기본", "text": "5명의 학생 중에서 회장 1명, 부회장 1명을 뽑는 경우의 수는?", "fig": null, "ch": ["10", "15", "25", "20", "30"], "ans": 4, "sol": "회장을 뽑는 경우가 5가지, 부회장을 뽑는 경우가 4가지이므로 5×4=20이다.", "con": ["counting"]}, {"id": "S3-2", "dom": "sta", "ti": 2, "lv": "기출 수준", "text": "남학생 3명과 여학생 2명을 한 줄로 세울 때, 여학생 2명이 이웃하게 서는 경우의 수는?", "fig": null, "ch": ["24", "36", "60", "72", "48"], "ans": 5, "sol": "여학생 2명을 한 묶음으로 보면 4개를 한 줄로 세우는 경우가 4×3×2×1=24가지이다. 묶음 안에서 여학생 2명이 서는 방법이 2가지이므로 24×2=48이다.", "con": ["counting"]}, {"id": "S3-3", "dom": "sta", "ti": 2, "lv": "응용", "text": "0, 1, 2, 3, 4가 하나씩 적힌 5장의 카드 중에서 3장을 뽑아 만들 수 있는 세 자리 짝수의 개수는?", "fig": null, "ch": ["30", "24", "28", "32", "36"], "ans": 1, "sol": "일의 자리가 0이면 나머지 두 자리를 정하는 경우가 4×3=12가지이다. 일의 자리가 2 또는 4이면 일의 자리를 정하는 경우가 2가지, 백의 자리는 0과 일의 자리의 수를 제외한 3가지, 십의 자리는 3가지이므로 2×3×3=18가지이다. 모두 12+18=30이다.", "con": ["counting"]}, {"id": "S4-1", "dom": "sta", "ti": 3, "lv": "기본", "text": "변량 2, 4, 6, 8의 분산은?", "fig": null, "ch": ["3", "4", "6", "7", "5"], "ans": 5, "sol": "평균은 5이고 편차는 −3, −1, 1, 3이다. 분산은 (9+1+1+9)/4=5이다.", "con": ["disp"]}, {"id": "S4-2", "dom": "sta", "ti": 3, "lv": "기출 수준", "text": "5개의 변량 3, 5, x, 9, 11의 평균이 7일 때, 분산은?", "fig": null, "ch": ["8", "6", "7", "9", "10"], "ans": 1, "sol": "3+5+x+9+11=35이므로 x=7이다. 편차는 −4, −2, 0, 2, 4이므로 분산은 (16+4+0+4+16)/5=8이다.", "con": ["disp", "cen"]}, {"id": "S4-3", "dom": "sta", "ti": 3, "lv": "응용", "text": "5개의 변량 a₁, a₂, a₃, a₄, a₅의 평균이 6, 분산이 4일 때, 변량 3a₁+1, 3a₂+1, …, 3a₅+1의 평균과 분산의 합은?", "fig": null, "ch": ["51", "55", "53", "57", "59"], "ans": 2, "sol": "각 변량에 3을 곱하고 1을 더하면 평균은 3×6+1=19이다. 분산은 3²×4=36이다. 따라서 합은 19+36=55이다.", "con": ["disp", "cen"]}, {"id": "N1-4", "dom": "num", "ti": 0, "lv": "심화", "text": "(√7+√3)/(√7−√3) + (√7−√3)/(√7+√3)의 값은?", "fig": null, "ch": ["3", "4", "6", "7", "5"], "ans": 5, "sol": "통분하면 ((√7+√3)²+(√7−√3)²) / ((√7)²−(√3)²) = 2×(7+3)/4 = 5이다.", "con": ["sqrt_calc", "mult_formula"]}, {"id": "N2-4", "dom": "num", "ti": 1, "lv": "심화", "text": "6−√10의 정수 부분을 x, 소수 부분을 y라 할 때, x−y의 값은?", "fig": null, "ch": ["√10−2", "√10−1", "√10", "√10+1", "√10+2"], "ans": 1, "sol": "3<√10<4이므로 2<6−√10<3이다. x=2, y=(6−√10)−2=4−√10이다. x−y=2−(4−√10)=√10−2이다.", "con": ["real_num", "sqrt_calc"]}, {"id": "N3-4", "dom": "num", "ti": 2, "lv": "심화", "text": "540의 약수 중에서 어떤 자연수의 제곱이 되는 수의 개수는?", "fig": null, "ch": ["2", "4", "3", "5", "6"], "ans": 2, "sol": "540=2²×3³×5이다. 제곱수인 약수는 2의 지수가 0 또는 2, 3의 지수가 0 또는 2, 5의 지수가 0인 경우이므로 1, 4, 9, 36의 4개이다.", "con": ["pf"]}, {"id": "A1-4", "dom": "alg", "ti": 0, "lv": "심화", "text": "a+b=4, a²+b²=10일 때, a³+b³의 값은?", "fig": null, "ch": ["24", "28", "26", "30", "32"], "ans": 2, "sol": "ab={(a+b)²−(a²+b²)}/2=(16−10)/2=3이다. a³+b³=(a+b)³−3ab(a+b)=64−36=28이다.", "con": ["mult_formula"]}, {"id": "A2-4", "dom": "alg", "ti": 1, "lv": "심화", "text": "x=1+√3일 때, x²−2x+7의 값은?", "fig": null, "ch": ["7", "8", "9", "10", "11"], "ans": 3, "sol": "x−1=√3이므로 (x−1)²=3, 즉 x²−2x+1=3, x²−2x=2이다. 따라서 x²−2x+7=9이다.", "con": ["mult_formula", "factor"]}, {"id": "A3-4", "dom": "alg", "ti": 2, "lv": "심화", "text": "이차방정식 x²−4x+k=0이 중근을 가질 때, 상수 k의 값과 그 중근의 합은?", "fig": null, "ch": ["4", "5", "7", "6", "8"], "ans": 4, "sol": "중근을 가지면 (x−2)²=x²−4x+4이므로 k=4이고 중근은 2이다. 합은 4+2=6이다.", "con": ["quad_eq"]}, {"id": "A4-4", "dom": "alg", "ti": 3, "lv": "심화", "text": "둘레의 길이가 20 m인 직사각형 모양의 울타리의 넓이가 24 m²일 때, 가로와 세로의 길이의 차는? (단위: m)", "fig": null, "ch": ["1", "3", "4", "5", "2"], "ans": 5, "sol": "가로를 x라 하면 세로는 10−x이다. x(10−x)=24에서 x²−10x+24=(x−4)(x−6)=0이므로 두 변의 길이는 4, 6이다. 차는 2이다.", "con": ["quad_app"]}, {"id": "F1-4", "dom": "fun", "ti": 0, "lv": "심화", "text": "이차함수 y=−x²+6x+a의 최댓값이 10일 때, 상수 a의 값은?", "fig": null, "ch": ["-1", "1", "0", "2", "3"], "ans": 2, "sol": "y=−(x−3)²+9+a이므로 최댓값은 9+a이다. 9+a=10이므로 a=1이다.", "con": ["qf", "qf_max"]}, {"id": "F2-4", "dom": "fun", "ti": 1, "lv": "심화", "text": "이차함수 y=x²−2x의 그래프와 직선 y=x+k가 한 점에서만 만날 때, 상수 k의 값은?", "fig": null, "ch": ["−3", "−2", "−9/4", "−3/2", "0"], "ans": 3, "sol": "x²−2x=x+k에서 x²−3x−k=0이다. 한 점에서 만나려면 중근을 가져야 하므로 (−3)²−4×1×(−k)=0, 9+4k=0이다. 따라서 k=−9/4이다.", "con": ["qf", "lf_eq", "quad_eq"]}, {"id": "F3-4", "dom": "fun", "ti": 2, "lv": "심화", "text": "일차함수 y=ax+4의 그래프와 x축, y축으로 둘러싸인 삼각형의 넓이가 8일 때, 음수 a의 값은?", "fig": null, "ch": ["−4", "−2", "−1/2", "−1", "−1/4"], "ans": 4, "sol": "x절편은 −4/a, y절편은 4이므로 넓이는 ½×|−4/a|×4=8/|a|이다. 8/|a|=8이므로 |a|=1이고, a가 음수이므로 a=−1이다.", "con": ["lf", "coord_area"]}, {"id": "F4-4", "dom": "fun", "ti": 3, "lv": "심화", "text": "이차함수 y=x²+2x−3의 그래프를 x축의 방향으로 m만큼, y축의 방향으로 n만큼 평행이동하였더니 꼭짓점의 좌표가 (3, 2)가 되었다. m+n의 값은?", "fig": null, "ch": ["8", "9", "11", "12", "10"], "ans": 5, "sol": "y=(x+1)²−4이므로 처음 꼭짓점은 (−1, −4)이다. 평행이동한 꼭짓점이 (3, 2)이므로 m=3−(−1)=4, n=2−(−4)=6이다. m+n=10이다.", "con": ["qf"]}, {"id": "G1-4", "dom": "geo", "ti": 0, "lv": "심화", "text": "∠B=90°인 직각삼각형 ABC에서 tan A=2/3일 때, sin A의 값은?", "fig": null, "ch": ["2/3", "3/2", "2√13/13", "3√13/13", "√13/2"], "ans": 3, "sol": "tan A=2/3이므로 대변 2, 밑변 3으로 놓으면 빗변은 √(2²+3²)=√13이다. sin A=2/√13=2√13/13이다.", "con": ["tri_ratio", "pyth"]}, {"id": "G2-4", "dom": "geo", "ti": 1, "lv": "심화", "text": "∠C=90°, AC=6, BC=8인 직각삼각형 ABC의 내접원의 중심을 I라 할 때, 삼각형 IAB의 넓이는?", "fig": null, "ch": ["8", "9", "11", "10", "12"], "ans": 4, "sol": "AB=10이고 내접원의 반지름은 (6+8−10)/2=2이다. 삼각형 IAB의 밑변은 AB, 높이는 내접원의 반지름이므로 넓이는 ½×10×2=10이다.", "con": ["pyth", "tri_center"]}, {"id": "G3-4", "dom": "geo", "ti": 2, "lv": "심화", "text": "평행사변형 ABCD에서 변 BC 위의 점 E가 BE : EC = 2 : 3을 만족한다. 직선 AE와 직선 DC가 만나는 점을 F라 할 때, AB=10이면 CF의 길이는?", "fig": null, "ch": ["12", "14", "16", "18", "15"], "ans": 5, "sol": "AB∥CF이므로 삼각형 ABE와 삼각형 FCE는 닮음이다. AB : CF = BE : CE = 2 : 3이므로 CF=10×3/2=15이다.", "con": ["sim", "quad_prop"]}, {"id": "G4-4", "dom": "geo", "ti": 3, "lv": "심화", "text": "지름 AB의 길이가 10인 원 위에 점 C를 AC=6이 되도록 잡을 때, 삼각형 ABC의 넓이는?", "fig": null, "ch": ["24", "20", "22", "26", "28"], "ans": 1, "sol": "반원에 대한 원주각은 90°이므로 ∠ACB=90°이다. BC=√(10²−6²)=8이므로 삼각형 ABC의 넓이는 ½×6×8=24이다.", "con": ["circle_angle", "pyth"]}, {"id": "S1-4", "dom": "sta", "ti": 0, "lv": "심화", "text": "서로 다른 두 주사위를 던져 나온 눈의 수의 합이 소수일 확률은?", "fig": null, "ch": ["1/3", "4/9", "1/2", "7/12", "5/12"], "ans": 5, "sol": "합이 2인 경우 1가지, 3인 경우 2가지, 5인 경우 4가지, 7인 경우 6가지, 11인 경우 2가지로 모두 15가지이다. 확률은 15/36=5/12이다.", "con": ["counting", "prob"]}, {"id": "S2-4", "dom": "sta", "ti": 1, "lv": "심화", "text": "1부터 10까지의 자연수가 하나씩 적힌 10장의 카드에서 꺼낸 카드를 다시 넣지 않고 2장을 연속하여 뽑을 때, 적어도 한 장이 3의 배수일 확률은?", "fig": null, "ch": ["8/15", "7/15", "3/5", "2/3", "11/15"], "ans": 1, "sol": "3의 배수가 아닌 카드는 7장이다. 두 장 모두 3의 배수가 아닐 확률은 7/10×6/9=7/15이다. 구하는 확률은 1−7/15=8/15이다.", "con": ["prob", "counting"]}, {"id": "S3-4", "dom": "sta", "ti": 2, "lv": "심화", "text": "1, 2, 3, 4, 5가 하나씩 적힌 5장의 카드 중에서 3장을 뽑아 만들 수 있는 세 자리 자연수 중 3의 배수의 개수는?", "fig": null, "ch": ["20", "24", "22", "26", "28"], "ans": 2, "sol": "세 수의 합이 3의 배수인 경우는 {1,2,3}, {1,3,5}, {2,3,4}, {3,4,5}의 4가지이다. 각각 3장을 한 줄로 세우는 경우가 3×2×1=6가지이므로 4×6=24이다.", "con": ["counting"]}, {"id": "S4-4", "dom": "sta", "ti": 3, "lv": "심화", "text": "3개의 변량 a, b, c의 평균이 5이고 분산이 2일 때, a²+b²+c²의 값은?", "fig": null, "ch": ["75", "78", "81", "84", "87"], "ans": 3, "sol": "분산은 (변량의 제곱의 평균)−(평균)²이므로 (a²+b²+c²)/3−25=2이다. 따라서 a²+b²+c²=3×27=81이다.", "con": ["disp"]}, {"id": "N1-5", "dom": "num", "ti": 0, "lv": "기본", "text": "√48−√27+√12의 값은?", "fig": null, "ch": ["3√3", "2√3", "4√3", "5√3", "6√3"], "ans": 1, "sol": "√48=4√3, √27=3√3, √12=2√3이므로 4√3−3√3+2√3=3√3이다.", "con": ["sqrt_calc"]}, {"id": "N1-6", "dom": "num", "ti": 0, "lv": "기본", "text": "6/√3+√12의 값은?", "fig": null, "ch": ["2√3", "4√3", "5√3", "6√3", "8√3"], "ans": 2, "sol": "6/√3=6√3/3=2√3이고 √12=2√3이므로 합은 4√3이다.", "con": ["sqrt_calc"]}, {"id": "N1-7", "dom": "num", "ti": 0, "lv": "기출 수준", "text": "(2+√3)²−(2−√3)²의 값은?", "fig": null, "ch": ["8", "4√3", "8√3", "14", "12√3"], "ans": 3, "sol": "(2+√3)²=7+4√3, (2−√3)²=7−4√3이므로 차는 8√3이다.", "con": ["sqrt_calc", "mult_formula"]}, {"id": "N1-8", "dom": "num", "ti": 0, "lv": "기출 수준", "text": "1/(√5−2)+1/(√5+2)의 값은?", "fig": null, "ch": ["2", "√5", "4", "2√5", "4√5"], "ans": 4, "sol": "1/(√5−2)=(√5+2)/(5−4)=√5+2, 1/(√5+2)=√5−2이므로 합은 2√5이다.", "con": ["sqrt_calc"]}, {"id": "N1-9", "dom": "num", "ti": 0, "lv": "응용", "text": "x=√3+√2, y=√3−√2일 때, x²+xy+y²의 값은?", "fig": null, "ch": ["9", "10", "12", "13", "11"], "ans": 5, "sol": "x+y=2√3, xy=3−2=1이다. x²+y²=(x+y)²−2xy=12−2=10이므로 x²+xy+y²=10+1=11이다.", "con": ["mult_formula", "sqrt_calc"]}, {"id": "N1-10", "dom": "num", "ti": 0, "lv": "심화", "text": "a=√2+1일 때, a³−2a²−a+5의 값은?", "fig": null, "ch": ["3", "4", "6", "7", "5"], "ans": 5, "sol": "a−1=√2의 양변을 제곱하면 a²−2a−1=0이다. a³−2a²−a+5=a(a²−2a−1)+5=5이다.", "con": ["mult_formula", "sqrt_calc"]}, {"id": "N2-5", "dom": "num", "ti": 1, "lv": "기본", "text": "5−√3의 소수 부분은?", "fig": null, "ch": ["√3−1", "2−√3", "3−√3", "√3−2", "5−√3"], "ans": 2, "sol": "1<√3<2이므로 3<5−√3<4이다. 정수 부분이 3이므로 소수 부분은 (5−√3)−3=2−√3이다.", "con": ["real_num"]}, {"id": "N2-6", "dom": "num", "ti": 1, "lv": "기출 수준", "text": "다음 중 가장 큰 수는?", "fig": null, "ch": ["√7", "5/2", "1+√3", "4−√2", "√2+1.2"], "ans": 3, "sol": "근삿값으로 비교하면 √7≈2.646, 5/2=2.5, 1+√3≈2.732, 4−√2≈2.586, √2+1.2≈2.614이다. 가장 큰 수는 1+√3이다.", "con": ["real_num"]}, {"id": "N2-7", "dom": "num", "ti": 1, "lv": "기출 수준", "text": "다음 중 무리수인 것은?", "fig": null, "ch": ["√36", "√(4/9)", "√0.16", "√20", "−√49"], "ans": 4, "sol": "√36=6, √(4/9)=2/3, √0.16=0.4, −√49=−7은 모두 유리수이다. √20=2√5는 순환하지 않는 무한소수이므로 무리수이다.", "con": ["real_num"]}, {"id": "N2-8", "dom": "num", "ti": 1, "lv": "응용", "text": "3<√n<5를 만족시키는 자연수 n의 개수는?", "fig": null, "ch": ["13", "14", "16", "17", "15"], "ans": 5, "sol": "3<√n<5의 각 변을 제곱하면 9<n<25이다. n=10, 11, …, 24로 모두 15개이다.", "con": ["real_num"]}, {"id": "N2-9", "dom": "num", "ti": 1, "lv": "응용", "text": "√n의 정수 부분이 3인 자연수 n의 개수는?", "fig": null, "ch": ["7", "5", "6", "8", "9"], "ans": 1, "sol": "3≤√n<4이므로 9≤n<16이다. n=9, 10, …, 15로 모두 7개이다.", "con": ["real_num"]}, {"id": "N2-10", "dom": "num", "ti": 1, "lv": "심화", "text": "√2의 소수 부분을 x라 할 때, x+1/x의 값은?", "fig": null, "ch": ["2√2", "√2", "2", "3", "3√2"], "ans": 1, "sol": "1<√2<2이므로 x=√2−1이다. 1/x=1/(√2−1)=√2+1이므로 x+1/x=2√2이다.", "con": ["real_num", "sqrt_calc"]}, {"id": "N3-5", "dom": "num", "ti": 2, "lv": "기본", "text": "N=2²×3×5일 때, N의 약수의 개수는?", "fig": null, "ch": ["8", "10", "12", "14", "16"], "ans": 3, "sol": "소인수분해가 2²×3¹×5¹이므로 약수의 개수는 (2+1)(1+1)(1+1)=12이다.", "con": ["pf"]}, {"id": "N3-6", "dom": "num", "ti": 2, "lv": "기본", "text": "분수 a/28가 유한소수로 나타내어지도록 하는 두 자리 자연수 a의 개수는?", "fig": null, "ch": ["11", "12", "14", "13", "15"], "ans": 4, "sol": "28=2²×7이므로 분모의 소인수가 2뿐이 되려면 a가 7의 배수이어야 한다. 14, 21, …, 98로 모두 13개이다.", "con": ["pf", "rat_dec"]}, {"id": "N3-7", "dom": "num", "ti": 2, "lv": "기출 수준", "text": "√(28n)이 자연수가 되도록 하는 가장 작은 자연수 n의 값은?", "fig": null, "ch": ["2", "4", "14", "28", "7"], "ans": 5, "sol": "28=2²×7이므로 √(28n)이 자연수가 되려면 n=7×(자연수)² 꼴이어야 한다. 가장 작은 n은 7이다.", "con": ["pf", "sqrt_nat"]}, {"id": "N3-8", "dom": "num", "ti": 2, "lv": "기출 수준", "text": "√(45/n)이 자연수가 되도록 하는 가장 작은 자연수 n의 값은?", "fig": null, "ch": ["5", "3", "9", "15", "45"], "ans": 1, "sol": "45=3²×5이므로 45/n이 제곱수가 되려면 n=5 또는 n=45이다. 가장 작은 n은 5이다.", "con": ["pf", "sqrt_nat"]}, {"id": "N3-9", "dom": "num", "ti": 2, "lv": "응용", "text": "√(24n)이 자연수가 되도록 하는 두 자리 자연수 n의 개수는?", "fig": null, "ch": ["2", "3", "4", "5", "6"], "ans": 2, "sol": "24=2³×3이므로 n=6×(자연수)² 꼴이다. 6, 24, 54, 96 중 두 자리 자연수는 24, 54, 96의 3개이다.", "con": ["pf", "sqrt_nat"]}, {"id": "N3-10", "dom": "num", "ti": 2, "lv": "심화", "text": "720의 약수 중에서 3의 배수의 개수는?", "fig": null, "ch": ["12", "20", "16", "18", "24"], "ans": 2, "sol": "720=2⁴×3²×5이다. 3의 배수인 약수는 3의 지수가 1 또는 2이므로 (4+1)×2×(1+1)=20이다.", "con": ["pf"]}, {"id": "A1-5", "dom": "alg", "ti": 0, "lv": "기본", "text": "a+b=5, ab=3일 때, a²+b²의 값은?", "fig": null, "ch": ["17", "18", "19", "20", "21"], "ans": 3, "sol": "a²+b²=(a+b)²−2ab=25−6=19이다.", "con": ["mult_formula"]}, {"id": "A1-6", "dom": "alg", "ti": 0, "lv": "기본", "text": "(x+3)(x−3)−(x−2)²을 간단히 하면?", "fig": null, "ch": ["4x−5", "−4x−13", "4x+13", "4x−13", "4x−9"], "ans": 4, "sol": "(x+3)(x−3)=x²−9, (x−2)²=x²−4x+4이므로 차는 4x−13이다.", "con": ["poly_ops", "mult_formula"]}, {"id": "A1-7", "dom": "alg", "ti": 0, "lv": "기출 수준", "text": "a−1/a=4일 때, a²+1/a²의 값은?", "fig": null, "ch": ["14", "16", "20", "22", "18"], "ans": 5, "sol": "(a−1/a)²=a²−2+1/a²이므로 16=a²+1/a²−2, 따라서 a²+1/a²=18이다.", "con": ["mult_formula"]}, {"id": "A1-8", "dom": "alg", "ti": 0, "lv": "응용", "text": "x²−6x+1=0일 때, x²+1/x²의 값은?", "fig": null, "ch": ["34", "30", "32", "36", "38"], "ans": 1, "sol": "x≠0이므로 양변을 x로 나누면 x−6+1/x=0, 즉 x+1/x=6이다. x²+1/x²=36−2=34이다.", "con": ["mult_formula"]}, {"id": "A2-5", "dom": "alg", "ti": 1, "lv": "기본", "text": "x²−5x−14를 인수분해하면 (x+a)(x+b)일 때, a+b의 값은?", "fig": null, "ch": ["-9", "-7", "5", "-5", "7"], "ans": 4, "sol": "x²−5x−14=(x+2)(x−7)이므로 a+b=2+(−7)=−5이다.", "con": ["factor"]}, {"id": "A2-6", "dom": "alg", "ti": 1, "lv": "기본", "text": "101²−99²의 값은?", "fig": null, "ch": ["200", "800", "1000", "2000", "400"], "ans": 5, "sol": "a²−b²=(a+b)(a−b)에서 101²−99²=(101+99)(101−99)=200×2=400이다.", "con": ["factor"]}, {"id": "A2-7", "dom": "alg", "ti": 1, "lv": "응용", "text": "x=√3+1, y=√3−1일 때, x²y+xy²의 값은?", "fig": null, "ch": ["4√3", "2√3", "6√3", "8", "8√3"], "ans": 1, "sol": "x²y+xy²=xy(x+y)이다. xy=3−1=2, x+y=2√3이므로 값은 4√3이다.", "con": ["factor", "sqrt_calc"]}, {"id": "A2-8", "dom": "alg", "ti": 1, "lv": "심화", "text": "(x−2)(x+4)+k가 완전제곱식이 되도록 하는 상수 k의 값은?", "fig": null, "ch": ["7", "9", "8", "10", "11"], "ans": 2, "sol": "(x−2)(x+4)+k=x²+2x−8+k이다. 이것이 (x+1)²=x²+2x+1이어야 하므로 −8+k=1, k=9이다.", "con": ["factor", "mult_formula"]}, {"id": "A3-5", "dom": "alg", "ti": 2, "lv": "기본", "text": "이차방정식 x²−7x+12=0의 두 근 중 작은 근은?", "fig": null, "ch": ["1", "2", "4", "6", "3"], "ans": 5, "sol": "x²−7x+12=(x−3)(x−4)=0이므로 x=3 또는 x=4이다. 작은 근은 3이다.", "con": ["quad_eq"]}, {"id": "A3-6", "dom": "alg", "ti": 2, "lv": "기출 수준", "text": "이차방정식 2x²−5x−3=0의 두 근의 차는?", "fig": null, "ch": ["7/2", "5/2", "3", "4", "9/2"], "ans": 1, "sol": "2x²−5x−3=(2x+1)(x−3)=0이므로 x=−1/2 또는 x=3이다. 두 근의 차는 3−(−1/2)=7/2이다.", "con": ["quad_eq"]}, {"id": "A3-7", "dom": "alg", "ti": 2, "lv": "기출 수준", "text": "이차방정식 x²+4x−1=0의 두 근 중 큰 근은?", "fig": null, "ch": ["−2+√3", "−2+√5", "2+√5", "−4+√5", "−1+√5"], "ans": 2, "sol": "근의 공식에 의하여 x=(−4±√(16+4))/2=(−4±2√5)/2=−2±√5이다. 큰 근은 −2+√5이다.", "con": ["quad_eq", "sqrt_calc"]}, {"id": "A4-5", "dom": "alg", "ti": 3, "lv": "기본", "text": "연속하는 두 홀수의 곱이 63일 때, 두 홀수의 합은? (단, 두 홀수는 양수이다.)", "fig": null, "ch": ["16", "12", "14", "18", "20"], "ans": 1, "sol": "작은 홀수를 x라 하면 x(x+2)=63, x²+2x−63=(x+9)(x−7)=0이므로 x=7이다. 두 홀수는 7, 9이므로 합은 16이다.", "con": ["quad_app"]}, {"id": "A4-6", "dom": "alg", "ti": 3, "lv": "기출 수준", "text": "지면에서 쏘아 올린 공의 t초 후의 높이가 h=−5t²+20t (m)이다. 공의 높이가 15 m가 되는 두 시각의 합은? (단위: 초)", "fig": null, "ch": ["3", "4", "5", "6", "8"], "ans": 2, "sol": "−5t²+20t=15에서 t²−4t+3=0, (t−1)(t−3)=0이므로 t=1 또는 t=3이다. 합은 4이다.", "con": ["quad_app"]}, {"id": "A4-7", "dom": "alg", "ti": 3, "lv": "응용", "text": "빗변의 길이가 13이고 나머지 두 변의 길이의 합이 17인 직각삼각형의 넓이는?", "fig": null, "ch": ["24", "28", "30", "32", "36"], "ans": 3, "sol": "두 변을 a, b라 하면 a+b=17, a²+b²=169이다. ab=((a+b)²−(a²+b²))/2=(289−169)/2=60이므로 넓이는 ½ab=30이다.", "con": ["quad_app", "mult_formula", "pyth"]}, {"id": "F1-5", "dom": "fun", "ti": 0, "lv": "기본", "text": "이차함수 y=2x²−4x+5의 최솟값은?", "fig": null, "ch": ["1", "2", "3", "4", "5"], "ans": 3, "sol": "y=2(x−1)²+3이므로 x=1일 때 최솟값 3을 갖는다.", "con": ["qf", "qf_max"]}, {"id": "F1-6", "dom": "fun", "ti": 0, "lv": "기본", "text": "이차함수 y=x²+6x+4의 그래프의 꼭짓점의 좌표를 (p, q)라 할 때, p+q의 값은?", "fig": null, "ch": ["-10", "-6", "-2", "-8", "2"], "ans": 4, "sol": "y=(x+3)²−5이므로 꼭짓점은 (−3, −5)이다. p+q=−8이다.", "con": ["qf"]}, {"id": "F1-7", "dom": "fun", "ti": 0, "lv": "기출 수준", "text": "꼭짓점의 좌표가 (1, 4)이고 점 (3, 0)을 지나는 이차함수 y=a(x−1)²+4에서 a의 값은?", "fig": null, "ch": ["-2", "−1/2", "1", "2", "-1"], "ans": 5, "sol": "x=3, y=0을 대입하면 0=a(3−1)²+4=4a+4이므로 a=−1이다.", "con": ["qf"]}, {"id": "F1-8", "dom": "fun", "ti": 0, "lv": "응용", "text": "이차함수 y=−2x²+8x+k의 최댓값이 5일 때, 상수 k의 값은?", "fig": null, "ch": ["-3", "-5", "-1", "3", "5"], "ans": 1, "sol": "y=−2(x−2)²+8+k이므로 최댓값은 8+k이다. 8+k=5이므로 k=−3이다.", "con": ["qf", "qf_max"]}, {"id": "F2-5", "dom": "fun", "ti": 1, "lv": "기본", "text": "이차함수 y=x²의 그래프와 직선 y=−x+6의 두 교점의 x좌표의 합은?", "fig": null, "ch": ["-6", "1", "5", "-1", "6"], "ans": 4, "sol": "x²=−x+6에서 x²+x−6=(x+3)(x−2)=0이므로 x=−3 또는 x=2이다. 합은 −1이다.", "con": ["qf", "lf_eq"]}, {"id": "F2-6", "dom": "fun", "ti": 1, "lv": "기출 수준", "text": "이차함수 y=x²−3의 그래프와 직선 y=x−1의 두 교점 사이의 거리는?", "fig": null, "ch": ["2√2", "3", "4√2", "6", "3√2"], "ans": 5, "sol": "x²−3=x−1에서 x²−x−2=(x−2)(x+1)=0이므로 x=2 또는 x=−1이다. 교점은 (2, 1), (−1, −2)이므로 거리는 √(3²+3²)=3√2이다.", "con": ["qf", "lf_eq", "pyth"]}, {"id": "F2-7", "dom": "fun", "ti": 1, "lv": "응용", "text": "이차함수 y=x²−4x+3의 그래프가 x축과 만나는 두 점을 A, B, 꼭짓점을 V라 할 때, 삼각형 ABV의 넓이는?", "fig": null, "ch": ["1", "1/2", "3/2", "2", "3"], "ans": 1, "sol": "x²−4x+3=(x−1)(x−3)=0이므로 A(1, 0), B(3, 0)이다. y=(x−2)²−1이므로 V(2, −1)이다. 넓이는 ½×2×1=1이다.", "con": ["qf", "coord_area", "qf_area"]}, {"id": "F3-5", "dom": "fun", "ti": 2, "lv": "기본", "text": "두 점 (1, 3), (3, 7)을 지나는 직선을 y=ax+b라 할 때, a+b의 값은?", "fig": null, "ch": ["1", "2", "4", "5", "3"], "ans": 5, "sol": "기울기는 (7−3)/(3−1)=2이다. y=2x+b에 (1, 3)을 대입하면 b=1이다. a+b=3이다.", "con": ["lf"]}, {"id": "F3-6", "dom": "fun", "ti": 2, "lv": "기본", "text": "일차함수 y=−2x+6의 그래프의 x절편과 y절편의 합은?", "fig": null, "ch": ["9", "3", "6", "8", "12"], "ans": 1, "sol": "y=0이면 x=3, x=0이면 y=6이므로 x절편은 3, y절편은 6이다. 합은 9이다.", "con": ["lf"]}, {"id": "F3-7", "dom": "fun", "ti": 2, "lv": "기출 수준", "text": "두 직선 y=x+1, y=−x+5의 교점을 P, 두 직선이 x축과 만나는 점을 각각 A, B라 할 때, 삼각형 PAB의 넓이는?", "fig": null, "ch": ["6", "9", "8", "10", "12"], "ans": 2, "sol": "x+1=−x+5에서 x=2, y=3이므로 P(2, 3)이다. A(−1, 0), B(5, 0)이므로 밑변은 6, 높이는 3이다. 넓이는 ½×6×3=9이다.", "con": ["lf", "lf_eq", "coord_area"]}, {"id": "F3-8", "dom": "fun", "ti": 2, "lv": "응용", "text": "일차함수 y=ax+b의 그래프가 점 (2, 3)을 지나고 y절편이 −1일 때, 이 그래프와 x축, y축으로 둘러싸인 삼각형의 넓이는?", "fig": null, "ch": ["1/8", "1/2", "1/4", "1", "2"], "ans": 3, "sol": "b=−1이고 3=2a−1이므로 a=2이다. y=2x−1의 x절편은 1/2, y절편은 −1이므로 넓이는 ½×(1/2)×1=1/4이다.", "con": ["lf", "coord_area"]}, {"id": "F4-5", "dom": "fun", "ti": 3, "lv": "기본", "text": "이차함수 y=2x²의 그래프를 x축의 방향으로 −1만큼, y축의 방향으로 5만큼 평행이동한 그래프의 꼭짓점의 좌표를 (p, q)라 할 때, p+q의 값은?", "fig": null, "ch": ["4", "3", "5", "6", "7"], "ans": 1, "sol": "평행이동한 그래프는 y=2(x+1)²+5이므로 꼭짓점은 (−1, 5)이다. p+q=4이다.", "con": ["qf"]}, {"id": "F4-6", "dom": "fun", "ti": 3, "lv": "기출 수준", "text": "이차함수 y=x²−2x+3의 그래프를 x축의 방향으로 3만큼, y축의 방향으로 −2만큼 평행이동한 그래프의 식을 y=x²+bx+c라 할 때, b+c의 값은?", "fig": null, "ch": ["6", "8", "7", "9", "10"], "ans": 2, "sol": "y=(x−1)²+2를 평행이동하면 y=(x−4)²+0=x²−8x+16이다. b=−8, c=16이므로 b+c=8이다.", "con": ["qf"]}, {"id": "F4-7", "dom": "fun", "ti": 3, "lv": "응용", "text": "이차함수 y=−x²+2x+1의 그래프를 y축의 방향으로 k만큼 평행이동하였더니 원점을 지났다. k의 값은?", "fig": null, "ch": ["-2", "0", "-1", "1", "2"], "ans": 3, "sol": "평행이동한 그래프는 y=−x²+2x+1+k이다. 원점을 지나므로 0=1+k, k=−1이다.", "con": ["qf"]}, {"id": "G1-5", "dom": "geo", "ti": 0, "lv": "기본", "text": "sin 30°+cos 60°+tan 45°의 값은?", "fig": null, "ch": ["1", "3/2", "5/2", "2", "3"], "ans": 4, "sol": "sin 30°=1/2, cos 60°=1/2, tan 45°=1이므로 합은 2이다.", "con": ["tri_ratio"]}, {"id": "G1-6", "dom": "geo", "ti": 0, "lv": "기본", "text": "∠C=90°인 직각삼각형 ABC에서 AB=10, ∠A=30°일 때, BC의 길이는?", "fig": null, "ch": ["3", "4", "5√3", "10", "5"], "ans": 5, "sol": "sin 30°=BC/AB이므로 BC=10×1/2=5이다.", "con": ["tri_ratio"]}, {"id": "G1-7", "dom": "geo", "ti": 0, "lv": "기출 수준", "text": "∠C=90°인 직각삼각형 ABC에서 cos A=4/5, AB=10일 때, BC의 길이는?", "fig": null, "ch": ["6", "4", "5", "7", "8"], "ans": 1, "sol": "cos A=AC/AB=4/5이므로 AC=8이다. 피타고라스 정리에 의하여 BC=√(10²−8²)=6이다.", "con": ["tri_ratio", "pyth"]}, {"id": "G1-8", "dom": "geo", "ti": 0, "lv": "응용", "text": "건물로부터 20 m 떨어진 지점에서 건물의 꼭대기를 올려다본 각의 크기가 30°일 때, 건물의 높이는? (단, 눈높이는 무시하고, 단위는 m이다.)", "fig": null, "ch": ["10", "20√3/3", "10√3", "20", "20√3"], "ans": 2, "sol": "건물의 높이를 h라 하면 tan 30°=h/20이므로 h=20×√3/3=20√3/3이다.", "con": ["tri_ratio", "tri_app"]}, {"id": "G2-5", "dom": "geo", "ti": 1, "lv": "기본", "text": "가로의 길이가 12, 세로의 길이가 5인 직사각형의 대각선의 길이는?", "fig": null, "ch": ["11", "12", "14", "15", "13"], "ans": 5, "sol": "대각선의 길이는 √(12²+5²)=√169=13이다.", "con": ["pyth"]}, {"id": "G2-6", "dom": "geo", "ti": 1, "lv": "기본", "text": "한 변의 길이가 6인 정삼각형의 높이는?", "fig": null, "ch": ["3√3", "3", "3√2", "6", "6√3"], "ans": 1, "sol": "정삼각형의 높이는 (√3/2)×6=3√3이다.", "con": ["pyth"]}, {"id": "G2-7", "dom": "geo", "ti": 1, "lv": "기출 수준", "text": "∠B=90°, AB=8, BC=6인 직각삼각형 ABC의 외접원의 반지름의 길이는?", "fig": null, "ch": ["4", "5", "6", "7", "8"], "ans": 2, "sol": "AC=√(8²+6²)=10이다. 직각삼각형의 외심은 빗변의 중점이므로 외접원의 반지름은 10/2=5이다.", "con": ["pyth", "tri_center"]}, {"id": "G2-8", "dom": "geo", "ti": 1, "lv": "응용", "text": "좌표평면 위의 두 점 A(−1, 2), B(5, 10) 사이의 거리는?", "fig": null, "ch": ["8", "9", "10", "12", "14"], "ans": 3, "sol": "가로 방향 차가 6, 세로 방향 차가 8이므로 AB=√(6²+8²)=10이다.", "con": ["pyth"]}, {"id": "G3-5", "dom": "geo", "ti": 2, "lv": "기본", "text": "닮음비가 3 : 5인 두 원기둥 중 작은 원기둥의 부피가 54일 때, 큰 원기둥의 부피는?", "fig": null, "ch": ["250", "90", "150", "270", "450"], "ans": 1, "sol": "부피의 비는 3³ : 5³ = 27 : 125이다. 큰 원기둥의 부피는 54×125/27=250이다.", "con": ["sim", "solid"]}, {"id": "G3-6", "dom": "geo", "ti": 2, "lv": "기출 수준", "text": "삼각형 ABC에서 점 D, E는 각각 변 AB, AC 위의 점이고 DE∥BC이다. AD=4, DB=2, BC=9일 때, DE의 길이는?", "fig": null, "ch": ["4", "6", "5", "7", "8"], "ans": 2, "sol": "AD : AB=4 : 6=2 : 3이고 DE : BC=AD : AB이므로 DE=9×2/3=6이다.", "con": ["sim", "tri_prop"]}, {"id": "G3-7", "dom": "geo", "ti": 2, "lv": "응용", "text": "삼각형 ABC의 무게중심을 G라 하자. 삼각형 ABC의 넓이가 54일 때, 삼각형 GBC의 넓이는?", "fig": null, "ch": ["9", "12", "18", "24", "27"], "ans": 3, "sol": "무게중심은 삼각형의 넓이를 삼등분한다. 삼각형 GBC의 넓이는 54/3=18이다.", "con": ["tri_center"]}, {"id": "G4-5", "dom": "geo", "ti": 3, "lv": "기본", "text": "원 O에서 호 AB에 대한 중심각 ∠AOB=100°일 때, 호 AB에 대한 원주각의 크기는?", "fig": null, "ch": ["40°", "50°", "60°", "80°", "100°"], "ans": 2, "sol": "원주각의 크기는 중심각의 크기의 ½이므로 50°이다.", "con": ["circle_angle"]}, {"id": "G4-6", "dom": "geo", "ti": 3, "lv": "기출 수준", "text": "원에 내접하는 사각형 ABCD에서 ∠A=75°, ∠B=100°일 때, ∠D의 크기는?", "fig": null, "ch": ["75°", "85°", "80°", "100°", "105°"], "ans": 3, "sol": "원에 내접하는 사각형에서 마주 보는 두 각의 크기의 합은 180°이다. ∠B+∠D=180°이므로 ∠D=80°이다.", "con": ["circle_angle", "poly_angle"]}, {"id": "G4-7", "dom": "geo", "ti": 3, "lv": "응용", "text": "반지름의 길이가 5인 원에서 중심으로부터 3만큼 떨어진 현 AB의 길이는?", "fig": null, "ch": ["6", "7", "9", "8", "10"], "ans": 4, "sol": "중심에서 현에 내린 수선은 현을 수직이등분한다. 현의 반만큼의 길이는 √(5²−3²)=4이므로 AB=8이다.", "con": ["circle_chord", "pyth"]}, {"id": "S1-5", "dom": "sta", "ti": 0, "lv": "기본", "text": "주사위 1개를 던질 때, 소수의 눈이 나올 확률은?", "fig": null, "ch": ["1/2", "1/6", "1/3", "2/3", "5/6"], "ans": 1, "sol": "소수는 2, 3, 5이므로 3가지이다. 확률은 3/6=1/2이다.", "con": ["prob"]}, {"id": "S1-6", "dom": "sta", "ti": 0, "lv": "기본", "text": "서로 다른 두 주사위를 던질 때, 나오는 두 눈의 수의 곱이 12일 확률은?", "fig": null, "ch": ["1/18", "1/9", "1/12", "1/6", "1/4"], "ans": 2, "sol": "곱이 12인 경우는 (2,6), (3,4), (4,3), (6,2)의 4가지이다. 확률은 4/36=1/9이다.", "con": ["prob", "counting"]}, {"id": "S1-7", "dom": "sta", "ti": 0, "lv": "기출 수준", "text": "서로 다른 두 주사위를 던질 때, 나오는 두 눈의 수의 차가 2일 확률은?", "fig": null, "ch": ["1/9", "5/36", "2/9", "1/4", "1/3"], "ans": 3, "sol": "차가 2인 경우는 (1,3), (2,4), (3,5), (4,6)과 그 순서를 바꾼 경우로 모두 8가지이다. 확률은 8/36=2/9이다.", "con": ["prob", "counting"]}, {"id": "S1-8", "dom": "sta", "ti": 0, "lv": "응용", "text": "동전 3개와 주사위 1개를 동시에 던질 때, 동전은 앞면이 2개 나오고 주사위는 짝수의 눈이 나올 확률은?", "fig": null, "ch": ["1/8", "1/4", "3/8", "3/16", "1/2"], "ans": 4, "sol": "동전 3개 중 앞면이 2개일 확률은 3/8이고, 주사위가 짝수일 확률은 1/2이다. 따라서 3/8×1/2=3/16이다.", "con": ["prob", "counting"]}, {"id": "S2-5", "dom": "sta", "ti": 1, "lv": "기본", "text": "내일 비가 올 확률이 3/10일 때, 내일 비가 오지 않을 확률은?", "fig": null, "ch": ["1/10", "7/10", "3/10", "1/2", "9/10"], "ans": 2, "sol": "비가 오지 않을 확률은 1−3/10=7/10이다.", "con": ["prob"]}, {"id": "S2-6", "dom": "sta", "ti": 1, "lv": "기출 수준", "text": "서로 다른 두 주사위를 던질 때, 적어도 한 개는 6의 눈이 나올 확률은?", "fig": null, "ch": ["1/6", "5/18", "11/36", "1/3", "13/36"], "ans": 3, "sol": "6의 눈이 하나도 나오지 않을 확률은 (5/6)×(5/6)=25/36이다. 구하는 확률은 1−25/36=11/36이다.", "con": ["prob"]}, {"id": "S2-7", "dom": "sta", "ti": 1, "lv": "응용", "text": "흰 공 3개, 검은 공 4개가 들어 있는 주머니에서 공을 다시 넣지 않고 2개를 연속하여 꺼낼 때, 적어도 한 개가 흰 공일 확률은?", "fig": null, "ch": ["3/7", "4/7", "6/7", "5/7", "1"], "ans": 4, "sol": "두 개 모두 검은 공일 확률은 4/7×3/6=2/7이다. 구하는 확률은 1−2/7=5/7이다.", "con": ["prob", "counting"]}, {"id": "S3-5", "dom": "sta", "ti": 2, "lv": "기본", "text": "서로 다른 티셔츠 4벌과 서로 다른 바지 3벌이 있다. 티셔츠와 바지를 각각 한 벌씩 골라 입는 경우의 수는?", "fig": null, "ch": ["7", "9", "12", "14", "24"], "ans": 3, "sol": "곱의 법칙에 의하여 4×3=12이다.", "con": ["counting"]}, {"id": "S3-6", "dom": "sta", "ti": 2, "lv": "기본", "text": "1부터 20까지의 자연수가 하나씩 적힌 20장의 카드에서 한 장을 뽑을 때, 4의 배수 또는 6의 배수가 적힌 카드가 나오는 경우의 수는?", "fig": null, "ch": ["6", "8", "9", "7", "10"], "ans": 4, "sol": "4의 배수는 4, 8, 12, 16, 20의 5개, 6의 배수는 6, 12, 18의 3개이다. 12가 두 번 세어졌으므로 5+3−1=7이다.", "con": ["counting"]}, {"id": "S3-7", "dom": "sta", "ti": 2, "lv": "기출 수준", "text": "5명의 학생 중에서 대표 2명을 뽑는 경우의 수는?", "fig": null, "ch": ["5", "15", "20", "25", "10"], "ans": 5, "sol": "대표 2명을 순서대로 뽑으면 5×4=20가지이다. 대표는 순서가 없으므로 2로 나누어 10이다.", "con": ["counting", "perm_comb"]}, {"id": "S3-8", "dom": "sta", "ti": 2, "lv": "응용", "text": "1, 2, 3, 4가 하나씩 적힌 4장의 카드 중에서 2장을 뽑아 만들 수 있는 두 자리 자연수 중 홀수의 개수는?", "fig": null, "ch": ["6", "4", "8", "9", "12"], "ans": 1, "sol": "일의 자리는 1 또는 3으로 2가지이다. 십의 자리는 남은 3장 중 하나이므로 3가지이다. 따라서 2×3=6이다.", "con": ["counting", "perm_comb"]}, {"id": "S4-5", "dom": "sta", "ti": 3, "lv": "기본", "text": "5개의 변량 4, 6, 8, 10, 12의 분산은?", "fig": null, "ch": ["6", "10", "12", "8", "16"], "ans": 4, "sol": "평균은 8이고 편차는 −4, −2, 0, 2, 4이다. 분산은 (16+4+0+4+16)/5=8이다.", "con": ["disp"]}, {"id": "S4-6", "dom": "sta", "ti": 3, "lv": "기출 수준", "text": "5개의 변량 6, 7, 8, x, 10의 평균이 8일 때, 분산은?", "fig": null, "ch": ["1", "3", "4", "5", "2"], "ans": 5, "sol": "6+7+8+x+10=40이므로 x=9이다. 편차는 −2, −1, 0, 1, 2이므로 분산은 (4+1+0+1+4)/5=2이다.", "con": ["disp", "cen"]}, {"id": "S4-7", "dom": "sta", "ti": 3, "lv": "응용", "text": "4개의 변량 x₁, x₂, x₃, x₄의 평균이 3이고 분산이 5일 때, 변량 2x₁+1, 2x₂+1, 2x₃+1, 2x₄+1의 분산은?", "fig": null, "ch": ["20", "10", "11", "21", "22"], "ans": 1, "sol": "각 변량에 2를 곱하고 1을 더하면 분산은 2²=4배가 된다(더한 1은 분산에 영향이 없다). 따라서 5×4=20이다.", "con": ["disp"]}, {"id": "N3-11", "dom": "num", "ti": 2, "lv": "기본", "text": "두 자연수 A, B의 최대공약수가 6, 최소공배수가 72일 때, A×B의 값은?", "fig": null, "ch": ["72", "216", "432", "438", "864"], "ans": 3, "sol": "두 수의 곱은 (최대공약수)×(최소공배수)와 같다. 따라서 A×B=6×72=432이다.", "con": ["gcd_lcm"]}, {"id": "N3-12", "dom": "num", "ti": 2, "lv": "기출 수준", "text": "가로의 길이가 84 cm, 세로의 길이가 60 cm인 직사각형 모양의 종이를 크기가 같은 정사각형으로 빈틈없이 자르려 한다. 정사각형의 한 변의 길이를 가능한 한 크게 할 때, 정사각형의 개수는?", "fig": null, "ch": ["30", "40", "45", "35", "50"], "ans": 4, "sol": "정사각형의 한 변의 길이는 84와 60의 최대공약수인 12 cm이다. 가로로 84÷12=7개, 세로로 60÷12=5개이므로 7×5=35개이다.", "con": ["gcd_lcm"]}, {"id": "A1-11", "dom": "alg", "ti": 0, "lv": "기본", "text": "(2x²y)³÷(4xy²)을 간단히 하면?", "fig": null, "ch": ["2x⁴y", "4x⁵y", "2x⁵y", "2x⁵y²", "8x⁵y"], "ans": 3, "sol": "(2x²y)³=8x⁶y³이다. 8x⁶y³÷4xy²=2x⁵y이다.", "con": ["exp_law"]}, {"id": "A1-12", "dom": "alg", "ti": 0, "lv": "기출 수준", "text": "2¹⁰×5⁸은 몇 자리의 자연수인가?", "fig": null, "ch": ["8", "10", "11", "9", "12"], "ans": 4, "sol": "2¹⁰×5⁸=2²×(2⁸×5⁸)=4×10⁸=400000000이므로 9자리 수이다.", "con": ["exp_law", "pf"]}, {"id": "A1-13", "dom": "alg", "ti": 0, "lv": "기본", "text": "a=−2, b=3일 때, 3(a−2b)−2(2a−b)의 값은?", "fig": null, "ch": ["-14", "-12", "-8", "10", "-10"], "ans": 5, "sol": "식을 간단히 하면 3a−6b−4a+2b=−a−4b이다. a=−2, b=3을 대입하면 2−12=−10이다.", "con": ["expr_value"]}, {"id": "A4-11", "dom": "alg", "ti": 3, "lv": "기출 수준", "text": "집에서 학교까지 시속 3 km로 걸어가면 시속 4 km로 걸어갈 때보다 15분이 더 걸린다. 집에서 학교까지의 거리는? (단위: km)", "fig": null, "ch": ["3", "2", "5/2", "7/2", "4"], "ans": 1, "sol": "거리를 x km라 하면 x/3−x/4=15/60이다. x/12=1/4이므로 x=3이다.", "con": ["speed_app", "lin_eq"]}, {"id": "A4-12", "dom": "alg", "ti": 3, "lv": "응용", "text": "둘레의 길이가 400 m인 원형 산책로의 같은 지점에서 A는 분속 60 m, B는 분속 100 m로 같은 방향으로 동시에 출발한다. 출발한 후 두 사람이 처음으로 다시 만나는 것은 몇 분 후인가?", "fig": null, "ch": ["5", "10", "8", "12", "15"], "ans": 2, "sol": "x분 후에 B가 A보다 한 바퀴(400 m) 더 걸었을 때 만난다. 100x−60x=400이므로 x=10이다.", "con": ["speed_app", "lin_eq"]}, {"id": "A4-13", "dom": "alg", "ti": 3, "lv": "기출 수준", "text": "연립부등식 2x+1>x+4, 5x−3≤3x+9를 만족시키는 정수 x의 개수는?", "fig": null, "ch": ["2", "4", "3", "5", "6"], "ans": 3, "sol": "2x+1>x+4에서 x>3이고, 5x−3≤3x+9에서 2x≤12이므로 x≤6이다. 3<x≤6인 정수는 4, 5, 6으로 3개이다.", "con": ["sys_ineq"]}, {"id": "F3-11", "dom": "fun", "ti": 2, "lv": "기본", "text": "y가 x에 정비례하고 x=−2일 때 y=6이다. x=5일 때 y의 값은?", "fig": null, "ch": ["-10", "-6", "10", "15", "-15"], "ans": 5, "sol": "y=ax에 x=−2, y=6을 대입하면 a=−3이다. y=−3x에 x=5를 대입하면 y=−15이다.", "con": ["func_def"]}, {"id": "F3-12", "dom": "fun", "ti": 2, "lv": "기출 수준", "text": "함수 y=ax의 그래프가 점 (3, −6)을 지나고, 함수 y=bx의 그래프가 점 (−4, 2)를 지날 때, ab의 값은?", "fig": null, "ch": ["1", "-2", "-1", "−1/2", "2"], "ans": 1, "sol": "−6=3a에서 a=−2이고, 2=−4b에서 b=−1/2이다. 따라서 ab=(−2)×(−1/2)=1이다.", "con": ["func_def"]}, {"id": "F2-9", "dom": "fun", "ti": 1, "lv": "기출 수준", "text": "이차함수 y=x²−2x−3의 그래프가 x축과 만나는 두 점을 A, B, 꼭짓점을 V라 할 때, 삼각형 ABV의 넓이는?", "fig": null, "ch": ["4", "6", "8", "10", "12"], "ans": 3, "sol": "x²−2x−3=(x+1)(x−3)=0이므로 A(−1, 0), B(3, 0)이다. y=(x−1)²−4이므로 V(1, −4)이다. 넓이는 ½×4×4=8이다.", "con": ["qf_area", "qf"]}, {"id": "F2-10", "dom": "fun", "ti": 1, "lv": "응용", "text": "이차함수 y=−x²+4x+5의 그래프와 직선 y=x+5의 두 교점을 A, B, 꼭짓점을 V라 할 때, 삼각형 ABV의 넓이는?", "fig": null, "ch": ["2", "4", "3", "5", "6"], "ans": 3, "sol": "−x²+4x+5=x+5에서 x=0 또는 x=3이므로 A(0, 5), B(3, 8)이다. y=−(x−2)²+9이므로 V(2, 9)이다. 직선 AB는 y=x+5이고 x=2일 때 y=7이므로 점 (2, 7)과 V의 거리는 2이다. 넓이는 ½×2×3=3이다.", "con": ["qf_area", "lf_eq"]}, {"id": "G3-11", "dom": "geo", "ti": 2, "lv": "기출 수준", "text": "AB=AC인 이등변삼각형 ABC에서 변 BC의 중점을 M이라 하자. 삼각형 ABM과 삼각형 ACM이 합동임을 보이는 과정에서 AB=AC, BM=CM, AM은 공통이므로 사용한 합동 조건은?", "fig": null, "ch": ["SSS", "SAS", "ASA", "AAA", "RHA"], "ans": 1, "sol": "세 쌍의 대응변의 길이가 각각 같으므로 SSS 합동이다. (AAA는 합동 조건이 아니다.)", "con": ["proof", "tri_prop"]}, {"id": "G3-12", "dom": "geo", "ti": 2, "lv": "응용", "text": "평행사변형 ABCD의 두 대각선의 교점을 O라 하자. 삼각형 OAB와 삼각형 OCD가 합동임을 보일 때, AB=CD, ∠OAB=∠OCD(엇각), ∠OBA=∠ODC(엇각)이므로 사용한 합동 조건은?", "fig": null, "ch": ["SSS", "ASA", "SAS", "AAA", "RHS"], "ans": 2, "sol": "한 쌍의 대응변의 길이가 같고 그 양 끝각이 각각 같으므로 ASA 합동이다. 합동이면 OA=OC, OB=OD이므로 평행사변형의 두 대각선은 서로 다른 것을 이등분한다.", "con": ["proof", "quad_prop"]}, {"id": "G1-11", "dom": "geo", "ti": 0, "lv": "응용", "text": "눈높이가 1.5 m인 학생이 건물로부터 수평으로 20√3 m 떨어진 곳에서 건물의 꼭대기를 올려다본 각의 크기가 30°이다. 건물의 높이는? (단위: m)", "fig": null, "ch": ["20", "22", "31.5", "21.5", "30"], "ans": 4, "sol": "눈높이 위로 올라간 높이는 20√3×tan 30°=20√3×(√3/3)=20이다. 눈높이 1.5를 더하면 건물의 높이는 21.5 m이다.", "con": ["tri_app", "tri_ratio"]}, {"id": "S3-9", "dom": "sta", "ti": 2, "lv": "기출 수준", "text": "A, B, C, D, E 5명을 한 줄로 세울 때, A와 B가 이웃하지 않도록 세우는 경우의 수는?", "fig": null, "ch": ["48", "72", "60", "84", "96"], "ans": 2, "sol": "5명을 한 줄로 세우는 경우는 5×4×3×2×1=120가지이다. A, B를 한 묶음으로 보면 4×3×2×1=24가지이고 묶음 안의 순서가 2가지이므로 이웃하는 경우는 48가지이다. 따라서 120−48=72이다.", "con": ["perm_comb", "counting"]}], "NL": ["곱셈공식·인수분해", "이차방정식", "이차함수", "일차함수·좌표평면", "피타고라스 정리", "원의 성질", "닮음·무게중심", "경우의 수", "제곱근·실수", "연립방정식·부등식", "보기형 문항(ㄱ, ㄴ, ㄷ)", "표로 정리한 자료"], "NR": ["다항식", "복소수와 이차방정식", "이차방정식과 이차함수", "여러 가지 방정식과 부등식", "경우의 수(순열과 조합)", "행렬", "평면좌표와 직선의 방정식", "원의 방정식", "집합과 명제"], "GR": ["공통수학1", "공통수학1", "공통수학1", "공통수학1", "공통수학1", "공통수학1", "공통수학2", "공통수학2", "공통수학2"], "E": [{"l": 0, "r": 0, "title": "곱셈공식·인수분해 → 다항식", "mid": "중3에서는 (a+b)², (a−b)², (a+b)(a−b)와 이차식의 인수분해를 배웁니다.", "hs": "고1에서는 3차식의 곱셈공식, a³±b³의 인수분해, 항등식, 나머지정리로 확장됩니다. 중3의 곱셈공식 변형과 인수분해가 빠를수록 쉽습니다.", "br": [{"id": "B1", "text": "(x+1)³을 전개하였을 때, x²의 계수는? (곱셈공식 (a+b)³ = a³+3a²b+3ab²+b³을 이용한다.)", "ch": ["3", "1", "2", "4", "6"], "ans": 1, "sol": "(x+1)³=x³+3x²+3x+1이므로 x²의 계수는 3이다. (x+1)²=x²+2x+1에 (x+1)을 곱하여 확인할 수도 있다.", "con": ["mult_formula"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 1, "r": 1, "title": "이차방정식 → 복소수와 이차방정식", "mid": "중3에서는 인수분해와 근의 공식으로 이차방정식의 해를 구하고 중근을 배웁니다.", "hs": "고1에서는 근의 공식의 √(b²−4ac) 안의 값(판별식)으로 근의 개수를 판단하고, 두 근의 합과 곱을 계수로 나타내는 근과 계수의 관계를 배웁니다.", "br": [{"id": "B2", "text": "이차방정식 x²−4x+k=0이 중근을 가질 때, 상수 k의 값은?", "ch": ["1", "2", "3", "4", "5"], "ans": 4, "sol": "중근을 가지면 근의 공식의 근호 안의 값이 0이므로 16−4k=0, k=4이다. (x−2)²=x²−4x+4로 확인할 수 있다. 고1에서는 이 값을 판별식 D=b²−4ac라 한다.", "con": ["quad_eq"], "dom": null, "lv": "다리 문제", "fig": null}, {"id": "B3", "text": "이차방정식 x²−7x+10=0의 두 근을 α, β라 할 때, α+β와 αβ의 합은?", "ch": ["15", "17", "16", "18", "19"], "ans": 2, "sol": "(x−2)(x−5)=0이므로 두 근은 2, 5이고 α+β=7, αβ=10이다. 따라서 합은 17이다. 고1에서는 두 근의 합이 −b/a, 곱이 c/a임을 배운다.", "con": ["quad_eq"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 2, "r": 2, "title": "이차함수 → 이차방정식과 이차함수", "mid": "중3에서는 꼭짓점, 축, 절편으로 이차함수의 그래프를 그립니다.", "hs": "고1에서는 그래프와 x축의 교점이 이차방정식의 근임을 이용하고, 판별식으로 그래프와 직선의 위치 관계를 설명하며, 범위가 주어진 이차함수의 최대·최소를 구합니다.", "br": [{"id": "B4", "text": "이차함수 y=x²−6x+5의 그래프가 x축과 만나는 두 점 사이의 거리는?", "ch": ["2", "3", "5", "6", "4"], "ans": 5, "sol": "y=0이면 x²−6x+5=(x−1)(x−5)=0에서 x=1 또는 x=5이다. 두 점 사이의 거리는 5−1=4이다.", "con": ["qf", "quad_eq"], "dom": null, "lv": "다리 문제", "fig": null}, {"id": "B5", "text": "−1≤x≤4에서 이차함수 y=(x−1)²+2의 최댓값과 최솟값의 합은?", "ch": ["11", "12", "13", "14", "15"], "ans": 3, "sol": "꼭짓점의 x좌표 1이 범위 안에 있으므로 최솟값은 2이다. 양 끝의 값은 x=−1일 때 6, x=4일 때 11이므로 최댓값은 11이다. 합은 13이다.", "con": ["qf", "qf_max"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 2, "r": 3, "title": "이차함수 → 여러 가지 방정식과 부등식", "mid": "중3에서는 이차함수의 그래프를 그리고 그래프의 위치 관계를 읽습니다.", "hs": "고1에서는 이차함수의 그래프가 x축보다 아래에 있는 x의 범위로 이차부등식의 해를 구합니다.", "br": [{"id": "B13", "text": "이차함수 y=x²−2x−3의 그래프에서 y<0을 만족하는 정수 x의 개수는?", "ch": ["1", "2", "4", "3", "5"], "ans": 4, "sol": "y=(x+1)(x−3)이고 그래프가 x축 아래에 있는 범위는 −1<x<3이다. 정수 x는 0, 1, 2로 3개이다.", "con": ["qf", "lin_ineq"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 3, "r": 6, "title": "일차함수 → 평면좌표와 직선의 방정식", "mid": "중2에서는 기울기, 절편, 평행한 직선, 두 직선의 교점을 배웁니다.", "hs": "고1에서는 직선의 방정식을 여러 조건으로 구하고, 두 직선이 평행하거나 수직일 조건(수직이면 기울기의 곱이 −1)을 다룹니다.", "br": [{"id": "B6", "text": "직선 y=2x+1과 수직이고 점 (0, 3)을 지나는 직선의 x절편은? (두 직선이 수직이면 기울기의 곱이 −1이다.)", "ch": ["6", "2", "3", "4", "5"], "ans": 1, "sol": "수직인 직선의 기울기는 −1/2이다. 점 (0, 3)을 지나므로 y=−1/2 x+3이고, y=0일 때 x=6이다.", "con": ["lf"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 4, "r": 6, "title": "피타고라스 정리 → 두 점 사이의 거리", "mid": "중2에서는 직각삼각형의 세 변 사이의 관계를 배웁니다.", "hs": "고1에서는 좌표평면 위의 두 점 사이의 거리 공식으로 피타고라스 정리를 그대로 이용합니다.", "br": [{"id": "B7", "text": "좌표평면 위의 두 점 A(1, 2), B(4, 6) 사이의 거리는?", "ch": ["3", "4", "6", "5", "7"], "ans": 4, "sol": "가로의 차가 3, 세로의 차가 4인 직각삼각형을 생각하면 AB=√(3²+4²)=5이다. 고1에서는 d=√((x₂−x₁)²+(y₂−y₁)²)로 배운다.", "con": ["pyth"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 5, "r": 7, "title": "원의 성질 → 원의 방정식", "mid": "중3에서는 원주각, 접선, 현의 성질을 배웁니다.", "hs": "고1에서는 원 위의 점이 중심에서 반지름만큼 떨어져 있다는 사실을 식으로 나타내어 원의 방정식을 세우고, 직선과 원의 위치 관계를 다룹니다.", "br": [{"id": "B8", "text": "원점을 중심으로 하고 반지름의 길이가 5인 원 위의 점 (3, a)에서 a의 값은? (단, a>0)", "ch": ["2", "4", "3", "5", "6"], "ans": 2, "sol": "원 위의 점은 중심(원점)에서의 거리가 5이므로 3²+a²=25, a=4이다. 고1에서는 이를 x²+y²=r²로 나타낸다.", "con": ["pyth", "circle_chord"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 6, "r": 6, "title": "닮음·무게중심 → 평면좌표", "mid": "중2에서는 무게중심이 중선을 2 : 1로 나눈다는 것을 배웁니다.", "hs": "고1에서는 선분을 m : n으로 나누는 점(내분점)과 삼각형의 무게중심의 좌표를 구합니다.", "br": [{"id": "B9", "text": "세 점 A(0, 0), B(6, 0), C(0, 9)를 꼭짓점으로 하는 삼각형 ABC의 무게중심의 좌표를 (a, b)라 할 때, a+b의 값은?", "ch": ["3", "4", "6", "7", "5"], "ans": 5, "sol": "변 BC의 중점은 M(3, 4.5)이다. 무게중심은 선분 AM을 2 : 1로 나누므로 G(2, 3)이다. a+b=5이다. 고1에서는 세 점의 좌표의 평균으로 구한다.", "con": ["tri_center"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 7, "r": 4, "title": "경우의 수 → 순열과 조합", "mid": "중2에서는 합의 법칙, 곱의 법칙으로 경우의 수를 구합니다.", "hs": "고1에서는 순서를 생각하는 경우(순열)와 순서를 생각하지 않는 경우(조합)를 기호로 나타내고 계산합니다.", "br": [{"id": "B10", "text": "5명 중에서 대표 2명(자격이 같다)을 뽑는 경우의 수는?", "ch": ["5", "15", "20", "25", "10"], "ans": 5, "sol": "순서를 생각하면 5×4=20가지이다. 두 사람을 뽑는 순서는 구분하지 않으므로 2로 나누면 10이다. 고1에서는 이를 조합 5C2로 나타낸다.", "con": ["counting"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 8, "r": 1, "title": "제곱근·실수 → 복소수", "mid": "중3에서는 제곱하여 음수가 되는 실수는 없다고 배웁니다.", "hs": "고1에서는 수의 범위를 넓혀 제곱하여 −1이 되는 허수단위 i를 도입하고, 복소수의 연산을 배웁니다.", "br": [{"id": "B11", "text": "제곱하여 −4가 되는 실수 x의 개수는?", "ch": ["1", "2", "0", "3", "4"], "ans": 3, "sol": "실수를 제곱하면 항상 0 이상이므로 제곱하여 −4가 되는 실수는 없다. 고1에서는 이를 해결하기 위해 허수단위 i를 도입한다.", "con": ["sqrt_def"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 9, "r": 3, "title": "연립방정식 → 여러 가지 방정식", "mid": "중2에서는 두 일차방정식의 연립을 풀어 교점을 구합니다.", "hs": "고1에서는 이차방정식이 포함된 연립방정식(직선과 포물선의 교점 등)을 풉니다.", "br": [{"id": "B12", "text": "두 식 y=x+1, y=x²−1을 동시에 만족하는 (x, y)에서 x의 값 중 큰 값은?", "ch": ["2", "1", "3", "4", "5"], "ans": 1, "sol": "x²−1=x+1에서 x²−x−2=0, (x−2)(x+1)=0이므로 x=2 또는 x=−1이다. 큰 값은 2이다.", "con": ["simul", "quad_eq"], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 10, "r": 8, "title": "보기형 문항 → 집합과 명제", "mid": "모의고사의 <보기>형 문항에서 ㄱ, ㄴ, ㄷ이 참인지 거짓인지 판단합니다.", "hs": "고1에서는 명제의 참·거짓, 역과 대우, 반례, 충분조건과 필요조건을 배웁니다.", "br": [{"id": "B14", "text": "명제 'x²>4이면 x>2이다.'가 거짓임을 보이는 반례가 될 수 있는 x의 값은?", "ch": ["0", "-3", "1", "3", "5"], "ans": 2, "sol": "반례는 가정은 만족하지만 결론은 만족하지 않는 예이다. x=−3이면 x²=9>4이지만 x>2는 아니다.", "con": [], "dom": null, "lv": "다리 문제", "fig": null}]}, {"l": 11, "r": 5, "title": "표로 정리한 자료 → 행렬", "mid": "중1에서는 도수분포표와 같이 자료를 표로 정리합니다.", "hs": "고1에서는 수를 직사각형 모양으로 배열한 행렬을 배우고 덧셈, 뺄셈, 곱셈을 다룹니다. 중학교에서 직접 대응하는 단원은 없습니다.", "br": [{"id": "B15", "text": "상자 A에는 연필 2자루와 지우개 1개, 상자 B에는 연필 1자루와 지우개 3개가 들어 있다. A 4상자와 B 2상자에 들어 있는 연필은 모두 몇 자루인가?", "ch": ["8", "9", "11", "12", "10"], "ans": 5, "sol": "연필의 수는 2×4+1×2=10이다. 이렇게 표(행과 열)로 정리하여 곱하는 계산이 행렬의 곱셈이다.", "con": [], "dom": null, "lv": "다리 문제", "fig": null}]}], "MK": [{"no": 1, "pt": 2, "dom": "num", "unit": "제곱근의 계산", "text": "√48-√12+√3의 값은?", "fig": null, "ch": ["√3", "2√3", "3√3", "4√3", "5√3"], "ans": 3, "sol": ["[출제의도] 근호를 포함한 식의 덧셈과 뺄셈을 계산한다.", "√48=4√3, √12=2√3이므로 4√3-2√3+√3=3√3이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_calc"]}, {"no": 2, "pt": 2, "dom": "alg", "unit": "다항식의 계산", "text": "다항식 (3x-2)(x+4)-x(2x+1)을 간단히 하였을 때, x의 계수는?", "fig": null, "ch": ["1", "3", "5", "7", "9"], "ans": 5, "sol": ["[출제의도] 다항식을 전개하여 일차항의 계수를 구한다.", "(3x-2)(x+4)=3x²+10x-8, x(2x+1)=2x²+x이므로 차는 x²+9x-8이다. 따라서 x의 계수는 9이다."], "box": null, "tail": null, "table": null, "con": ["poly_ops"]}, {"no": 3, "pt": 2, "dom": "geo", "unit": "삼각비", "text": "그림과 같이 ∠ B=90°인 직각삼각형 ABC에서 AB=5, BC=12일 때, sin A의 값은?", "fig": "m1_q03", "ch": ["5/13", "5/12", "12/13", "13/12", "12/5"], "ans": 3, "sol": ["[출제의도] 직각삼각형에서 삼각비의 값을 구한다.", "AC=√(5²+12²)=13이므로 sin A=BC/AC=12/13이다."], "box": null, "tail": null, "table": null, "con": ["tri_ratio", "pyth"]}, {"no": 4, "pt": 3, "dom": "fun", "unit": "일차함수의 그래프", "text": "일차함수 y=ax+b의 그래프가 직선 y=2x-3과 평행하고 점 (1, 5)를 지날 때, a+b의 값은? (단, a, b는 상수이다.)", "fig": null, "ch": ["2", "3", "4", "5", "6"], "ans": 4, "sol": ["[출제의도] 평행한 두 일차함수의 기울기가 같음을 이용하여 일차함수의 식을 구한다.", "평행하므로 a=2이다. y=2x+b가 점 (1, 5)를 지나므로 5=2+b, b=3이다. 따라서 a+b=5이다."], "box": null, "tail": null, "table": null, "con": ["lf"]}, {"no": 5, "pt": 3, "dom": "sta", "unit": "줄기와 잎 그림·대푯값", "text": "다음은 어느 동호회 회원 15명의 나이를 조사하여 나타낸 줄기와 잎 그림이다. 이 자료의 중앙값을 a, 최빈값을 b라 할 때, a-b의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 1, "sol": ["[출제의도] 줄기와 잎 그림에서 중앙값과 최빈값을 구한다.", "자료를 크기순으로 나열하면 15개이므로 중앙값은 8번째 값인 26이다. 23이 두 번 나오므로 최빈값은 23이다. 따라서 a-b=26-23=3이다."], "box": null, "tail": null, "table": {"hdr": ["줄기", "잎"], "rows": [["1", "2 4 5 7"], ["2", "0 3 3 6 8 9"], ["3", "1 4 6 8 9"]], "note": "(1|2는 12세)"}, "con": ["cen", "hist"]}, {"no": 6, "pt": 3, "dom": "alg", "unit": "연립일차방정식", "text": "연립방정식 x+2y=7, 3x-y=7의 해가 x=a, y=b일 때, a+2b의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 5, "sol": ["[출제의도] 연립일차방정식의 해를 구한다.", "x+2y=7의 양변에 3을 곱하여 3x-y=7을 빼면 7y=14, y=2이고 x=3이다. 따라서 a+2b=3+4=7이다."], "box": null, "tail": null, "table": null, "con": ["simul"]}, {"no": 7, "pt": 3, "dom": "geo", "unit": "입체도형의 겉넓이", "text": "그림과 같이 밑면의 반지름의 길이가 3이고 높이가 4인 원뿔의 겉넓이는?", "fig": "m1_q07", "ch": ["16π", "20π", "22π", "24π", "28π"], "ans": 4, "sol": ["[출제의도] 원뿔의 겉넓이를 구한다.", "모선의 길이는 √(3²+4²)=5이다. 옆넓이는 π×3×5=15π, 밑넓이는 9π이므로 겉넓이는 24π이다."], "box": null, "tail": null, "table": null, "con": ["solid"]}, {"no": 8, "pt": 3, "dom": "geo", "unit": "삼각형의 외심", "text": "그림과 같이 삼각형 ABC의 외심을 O라 하자. ∠ OAB=28°, ∠ OBC=24°일 때, ∠ OCA의 크기는?", "fig": "m1_q08", "ch": ["36°", "38°", "40°", "42°", "44°"], "ans": 2, "sol": ["[출제의도] 삼각형의 외심의 성질을 이용하여 각의 크기를 구한다.", "외심에서 세 꼭짓점까지의 거리가 같으므로 삼각형 OAB, OBC, OCA는 모두 이등변삼각형이다. 삼각형 ABC의 내각의 크기의 합이 180°이므로 2×(28°+24°+∠ OCA)=180°이다. 따라서 ∠ OCA=38°이다."], "box": null, "tail": null, "table": null, "con": ["tri_center"]}, {"no": 9, "pt": 3, "dom": "fun", "unit": "이차함수의 꼭짓점", "text": "이차함수 y=-2x²+8x-3의 그래프의 꼭짓점의 좌표를 (p, q)라 할 때, p+q의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 5, "sol": ["[출제의도] 이차함수를 표준형으로 고쳐 꼭짓점의 좌표를 구한다.", "y=-2(x²-4x)-3=-2(x-2)²+5이므로 꼭짓점의 좌표는 (2, 5)이다. 따라서 p+q=7이다."], "box": null, "tail": null, "table": null, "con": ["qf"]}, {"no": 10, "pt": 3, "dom": "alg", "unit": "이차방정식", "text": "이차방정식 x²+kx-12=0의 한 근이 -3일 때, 다른 한 근은? (단, k는 상수이다.)", "fig": null, "ch": ["4", "5", "6", "7", "8"], "ans": 1, "sol": ["[출제의도] 이차방정식의 근의 뜻을 이해하고 인수분해로 다른 근을 구한다.", "x=-3을 대입하면 9-3k-12=0이므로 k=-1이다. x²-x-12=(x-4)(x+3)=0이므로 다른 한 근은 4이다."], "box": null, "tail": null, "table": null, "con": ["quad_eq"]}, {"no": 11, "pt": 3, "dom": "geo", "unit": "원주각", "text": "원 O 위의 두 점 A, B에 대하여 호 AB의 길이가 원의 둘레의 길이의 2/9일 때, 호 AB에 대한 원주각의 크기는?", "fig": null, "ch": ["28°", "32°", "36°", "40°", "44°"], "ans": 4, "sol": ["[출제의도] 호의 길이와 중심각, 원주각의 관계를 이해한다.", "호 AB에 대한 중심각의 크기는 360°×2/9=80°이다. 원주각의 크기는 중심각의 크기의 1/2이므로 40°이다."], "box": null, "tail": null, "table": null, "con": ["circle_angle"]}, {"no": 12, "pt": 3, "dom": "alg", "unit": "일차부등식", "text": "일차부등식 2x-a≤ 3x+1의 해가 x≥ -4일 때, 상수 a의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 1, "sol": ["[출제의도] 일차부등식의 해를 이용하여 미지수의 값을 구한다.", "2x-a≤ 3x+1에서 -x≤ a+1, 즉 x≥ -(a+1)이다. -(a+1)=-4이므로 a=3이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 13, "pt": 3, "dom": "sta", "unit": "경우의 수와 확률", "text": "서로 다른 두 개의 주사위를 동시에 던질 때, 나오는 두 눈의 수의 곱이 10 이상일 확률은?", "fig": null, "ch": ["17/36", "1/2", "19/36", "5/9", "7/12"], "ans": 3, "sol": ["[출제의도] 경우의 수를 구하여 확률을 계산한다.", "모든 경우의 수는 36이다. 두 눈의 수의 곱이 10 이상인 경우를 눈의 수 (a, b)로 나타내면 a=2일 때 2가지, a=3일 때 3가지, a=4일 때 4가지, a=5일 때 5가지, a=6일 때 5가지로 모두 19가지이다. 따라서 구하는 확률은 19/36이다."], "box": null, "tail": null, "table": null, "con": ["prob", "counting"]}, {"no": 14, "pt": 4, "dom": "fun", "unit": "반비례 그래프와 도형의 넓이", "text": "그림과 같이 반비례 관계 y=a/x (a>0)의 그래프 위의 두 점 A, B의 x좌표는 각각 2, 6이다. 점 A를 지나고 x축에 평행한 직선과 점 B를 지나고 y축에 평행한 직선이 만나는 점을 C라 하자. 삼각형 ABC의 넓이가 8일 때, 상수 a의 값은?", "fig": "m1_q14", "ch": ["10", "12", "14", "16", "18"], "ans": 2, "sol": ["[출제의도] 반비례 그래프 위의 점의 좌표를 이용하여 삼각형의 넓이를 구한다.", "A(2, a/2), B(6, a/6), C(6, a/2)이다. AC=4, BC=a/2-a/6=a/3이므로 삼각형 ABC의 넓이는 1/2×4×a/3=2a/3=8이다. 따라서 a=12이다."], "box": null, "tail": null, "table": null, "con": ["inv", "coord_area"]}, {"no": 15, "pt": 4, "dom": "geo", "unit": "닮음과 넓이의 비", "text": "그림과 같이 삼각형 ABC에서 DE∥BC이고 AD:DB=2:3이다. 사각형 DBCE의 넓이가 63일 때, 삼각형 ADE의 넓이는?", "fig": "m1_q15", "ch": ["4", "6", "8", "10", "12"], "ans": 5, "sol": ["[출제의도] 닮은 도형의 넓이의 비를 이용하여 넓이를 구한다.", "삼각형 ADE와 삼각형 ABC의 닮음비가 2:5이므로 넓이의 비는 4:25이다. 삼각형 ADE의 넓이를 4k라 하면 사각형 DBCE의 넓이는 21k이다. 21k=63이므로 k=3이고, 삼각형 ADE의 넓이는 12이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 16, "pt": 4, "dom": "alg", "unit": "일차부등식의 활용", "text": "서점 A는 책 한 권에 800원이고 배송비가 없고, 서점 B는 책 한 권에 700원이고 배송비가 2400원이다. (단, 배송비는 한 번만 지불한다.) 같은 책을 x권 살 때, B서점에서 사는 것이 A서점에서 사는 것보다 비용이 적게 들도록 하는 x의 최솟값은?", "fig": null, "ch": ["25", "26", "27", "28", "29"], "ans": 1, "sol": ["[출제의도] 일차부등식을 활용하여 문제를 해결한다.", "B서점의 비용이 더 적으려면 700x+2400<800x이다. 100x>2400에서 x>24이므로 자연수 x의 최솟값은 25이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 17, "pt": 4, "dom": "geo", "unit": "삼각형의 무게중심", "text": "그림과 같이 삼각형 ABC의 무게중심을 G라 하고, 점 G를 지나고 변 BC에 평행한 직선이 두 변 AB, AC와 만나는 점을 각각 D, E라 하자. 삼각형 ABC의 넓이가 54일 때, 사각형 DBCE의 넓이는?", "fig": "m1_q17", "ch": ["28", "30", "32", "34", "36"], "ans": 2, "sol": ["[출제의도] 무게중심의 성질과 닮음을 이용하여 넓이를 구한다.", "변 BC의 중점을 M이라 하면 AG:GM=2:1이므로 AG:AM=2:3이다. 삼각형 ADE와 삼각형 ABC의 닮음비가 2:3이므로 넓이의 비는 4:9이고, 삼각형 ADE의 넓이는 54×4/9=24이다. 따라서 사각형 DBCE의 넓이는 54-24=30이다."], "box": null, "tail": null, "table": null, "con": ["tri_center", "sim"]}, {"no": 18, "pt": 4, "dom": "fun", "unit": "이차함수와 직선의 교점, 넓이", "text": "그림과 같이 이차함수 y=x²-2x-3의 그래프와 직선 y=x+1이 만나는 두 점을 각각 A, B라 하고, 이차함수의 그래프가 y축과 만나는 점을 C라 하자. 삼각형 ABC의 넓이는? (단, 점 A의 x좌표는 점 B의 x좌표보다 작다.)", "fig": "m1_q18", "ch": ["9", "10", "11", "12", "13"], "ans": 2, "sol": ["[출제의도] 이차함수와 직선의 교점의 좌표를 구하여 삼각형의 넓이를 구한다.", "x²-2x-3=x+1에서 x²-3x-4=0, (x+1)(x-4)=0이므로 A(-1, 0), B(4, 5)이다. y절편은 -3이므로 C(0, -3)이다. 직선 y=x+1이 y축과 만나는 점을 D라 하면 D(0, 1)이므로 CD=4이다. 따라서 삼각형 ABC의 넓이는 (삼각형 ACD의 넓이) + (삼각형 BCD의 넓이) =1/2×4×1+1/2×4×4=2+8=10이다."], "box": null, "tail": null, "table": null, "con": ["qf", "lf_eq", "coord_area"]}, {"no": 19, "pt": 4, "dom": "geo", "unit": "원의 접선", "text": "그림과 같이 반지름의 길이가 3인 원 O의 외부의 점 P에서 원에 그은 두 접선의 접점을 각각 A, B라 하자. OP=5일 때, 선분 AB의 길이는?", "fig": "m1_q19", "ch": ["4", "22/5", "23/5", "24/5", "5"], "ans": 4, "sol": ["[출제의도] 원의 접선의 성질과 닮음을 이용하여 길이를 구한다.", "∠ OAP=90°이므로 AP=√(5²-3²)=4이다. 선분 AB와 선분 OP의 교점을 H라 하면 OA×AP=OP×AH에서 AH=(3×4)/5=12/5이다. 따라서 AB=2AH=24/5이다."], "box": null, "tail": null, "table": null, "con": ["circle_tan", "pyth"]}, {"no": 20, "pt": 4, "dom": "geo", "unit": "직각삼각형의 닮음(보기)", "text": "그림과 같이 ∠ A=90°이고 AB=6, AC=8인 직각삼각형 ABC에서 점 A에서 변 BC에 내린 수선의 발을 H라 하자. <보기>에서 옳은 것만을 있는 대로 고른 것은?", "fig": "m1_q20", "ch": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "ans": 3, "sol": ["[출제의도] 직각삼각형의 닮음과 넓이의 비를 이해한다.", "BC=10이다. ㄱ. AB×AC=BC×AH에서 AH=24/5이다. (참) ㄴ. AC²=CH×BC에서 CH=64/10=32/5이다. (거짓) ㄷ. BH=18/5이므로 두 삼각형의 넓이의 비는 BH:CH=9:16이다. (참) 따라서 옳은 것은 ㄱ, ㄷ이다."], "box": ["ㄱ. AH=24/5", "ㄴ. CH=6", "ㄷ. 삼각형 ABH의 넓이와 삼각형 ACH의 넓이의 비는 9:16이다."], "tail": "보기", "table": null, "con": ["pyth", "sim"]}, {"no": 21, "pt": 4, "dom": "geo", "unit": "각의 이등분선과 닮음(과정 완성)", "text": "삼각형 ABC에서 ∠ A의 이등분선이 변 BC와 만나는 점을 D라 하자. AB=6, AC=4, BC=5일 때, 선분 BD의 길이를 구하는 과정이다. 위의 (가), (나), (다)에 알맞은 수를 각각 a, b, c라 할 때, a×b×c의 값은?", "fig": "m1_q21", "ch": ["12", "16", "20", "24", "28"], "ans": 4, "sol": ["[출제의도] 평행선과 이등변삼각형의 성질을 이용하여 선분의 길이의 비를 구한다.", "AE=AC=4이므로 (가)는 4이다. BD:DC=6:4=3:2이고 BC=5이므로 BD=3, DC=2이다. 따라서 a=4, b=3, c=2이고 a×b×c=24이다."], "box": ["점 C를 지나고 선분 AD에 평행한 직선이 변 BA의 연장선과 만나는 점을 E라 하자.", "AD∥EC이므로 ∠ BAD=∠ AEC (동위각), ∠ DAC=∠ ACE (엇각)이다.", "∠ BAD=∠ DAC이므로 ∠ AEC=∠ ACE이고, 삼각형 ACE는 이등변삼각형이므로 AE=AC= (가) 이다.", "AD∥EC이므로 BD:DC=BA:AE=6: (가) =3:2이다.", "따라서 BD= (나) , DC= (다) 이다."], "tail": null, "table": null, "con": ["angle_bisect", "sim"]}, {"no": 22, "pt": 3, "dom": "num", "unit": "순환소수", "text": "순환소수 0.151515…를 기약분수 a/b로 나타낼 때, a+b의 값을 구하시오.", "fig": null, "ch": null, "ans": 38, "sol": ["[출제의도] 순환소수를 분수로 나타낸다.", "x=0.151515…라 하면 100x-x=15이므로 x=15/99=5/33이다. 따라서 a+b=5+33=38이다."], "box": null, "tail": null, "table": null, "con": ["rat_dec"]}, {"no": 23, "pt": 3, "dom": "fun", "unit": "일차함수의 절편", "text": "좌표평면 위의 두 점 (1, 4), (4, -2)를 지나는 직선의 x절편과 y절편의 합을 구하시오.", "fig": null, "ch": null, "ans": 9, "sol": ["[출제의도] 두 점을 지나는 직선의 식을 구하여 절편을 구한다.", "기울기는 (-2-4)/(4-1)=-2이고, 직선의 식은 y-4=-2(x-1), 즉 y=-2x+6이다. x절편은 3, y절편은 6이므로 합은 9이다."], "box": null, "tail": null, "table": null, "con": ["lf"]}, {"no": 24, "pt": 3, "dom": "num", "unit": "소인수분해", "text": "360에 자연수 n을 곱하여 어떤 자연수의 제곱이 되게 하려고 한다. n의 최솟값을 구하시오.", "fig": null, "ch": null, "ans": 10, "sol": ["[출제의도] 소인수분해를 이용하여 제곱수가 되는 조건을 구한다.", "360=2³×3²×5이다. 제곱수가 되려면 소인수의 지수가 모두 짝수여야 하므로 n의 최솟값은 2×5=10이다."], "box": null, "tail": null, "table": null, "con": ["pf"]}, {"no": 25, "pt": 3, "dom": "sta", "unit": "경우의 수", "text": "5명의 학생 중에서 회장 1명, 부회장 1명, 총무 1명을 뽑을 때, 학생 A가 회장이 되지 않는 경우의 수를 구하시오. (단, 한 학생이 두 개 이상의 직책을 맡을 수 없다.)", "fig": null, "ch": null, "ans": 48, "sol": ["[출제의도] 합의 법칙과 곱의 법칙을 이용하여 경우의 수를 구한다.", "세 직책을 정하는 모든 경우의 수는 5×4×3=60이다. A가 회장이 되는 경우의 수는 4×3=12이다. 따라서 구하는 경우의 수는 60-12=48이다."], "box": null, "tail": null, "table": null, "con": ["counting"]}, {"no": 26, "pt": 4, "dom": "sta", "unit": "평균과 분산", "text": "5개의 변량 2, 4, x, 8, 11의 평균이 6일 때, 각 변량을 2배 한 5개의 변량의 분산을 구하시오.", "fig": null, "ch": null, "ans": 40, "sol": ["[출제의도] 평균을 이용하여 미지수를 구하고 분산을 계산한다.", "평균이 6이므로 2+4+x+8+11=30에서 x=5이다. 각 변량을 2배 하면 4, 8, 10, 16, 22이고 평균은 12이다. 편차의 제곱의 합은 64+16+4+16+100=200이므로 분산은 200/5=40이다."], "box": null, "tail": null, "table": null, "con": ["disp"]}, {"no": 27, "pt": 4, "dom": "num", "unit": "제곱근이 자연수가 되는 조건", "text": "두 자리 자연수 n에 대하여 √(n/3)과 √(300-n)이 모두 자연수일 때, n의 값을 구하시오.", "fig": null, "ch": null, "ans": 75, "sol": ["[출제의도] 제곱근이 자연수가 되는 조건을 이용하여 자연수를 구한다.", "√(n/3)이 자연수이므로 n=3m² (m은 자연수)이다. 두 자리 수는 12, 27, 48, 75이다. 이 중 300-n이 제곱수인 경우는 300-75=225=15²뿐이다. 따라서 n=75이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_nat"]}, {"no": 28, "pt": 4, "dom": "geo", "unit": "닮음과 넓이", "text": "그림과 같이 한 변의 길이가 12인 정사각형 ABCD에서 변 BC 위의 점 E에 대하여 BE=4이다. 두 선분 AE, BD의 교점을 F라 할 때, 삼각형 AFD의 넓이를 구하시오.", "fig": "m1_q28", "ch": null, "ans": 54, "sol": ["[출제의도] 닮은 삼각형을 찾아 닮음비를 이용하여 넓이를 구한다.", "AD∥BE이므로 삼각형 FBE와 삼각형 FDA는 닮음이고 닮음비는 BE:AD=4:12=1:3이다. 따라서 BF:FD=1:3이다. 삼각형 ABD의 넓이는 72이고 삼각형 AFD의 넓이는 72×3/4=54이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 29, "pt": 4, "dom": "fun", "unit": "이차함수의 그래프와 도형의 넓이", "text": "그림과 같이 이차함수 y=-(x-2)²+9의 그래프가 x축과 만나는 두 점을 P, Q, y축과 만나는 점을 R, 꼭짓점을 V라 하자. (단, 점 P의 x좌표는 점 Q의 x좌표보다 작다.) 점 V를 지나고 직선 PR에 평행한 직선이 x축과 만나는 점을 S라 할 때, 삼각형 PSR의 넓이를 구하시오.", "fig": "m1_q29", "ch": null, "ans": 3, "sol": ["[출제의도] 이차함수의 그래프와 직선의 성질을 이용하여 삼각형의 넓이를 구한다.", "-(x-2)²+9=0에서 x=-1 또는 x=5이므로 P(-1, 0), Q(5, 0)이고, R(0, 5), V(2, 9)이다. 직선 PR의 기울기는 5이므로 점 V를 지나고 기울기가 5인 직선은 y=5x-1이다. 이 직선이 x축과 만나는 점은 S(1/5, 0)이다. 따라서 삼각형 PSR의 넓이는 1/2×(1/5+1)×5=3이다."], "box": null, "tail": null, "table": null, "con": ["qf", "coord_area", "lf"]}, {"no": 30, "pt": 4, "dom": "geo", "unit": "삼각형의 내접원과 닮음", "text": "그림과 같이 ∠ B=90°, AB=6, BC=8인 직각삼각형 ABC의 내접원의 중심을 I라 하자. 점 I를 지나고 선분 AC에 평행한 직선이 두 선분 AB, BC와 만나는 점을 각각 D, E라 할 때, 선분 DE의 길이는 q/p이다. p+q의 값을 구하시오. (단, p와 q는 서로소인 자연수이다.)", "fig": "m1_q30", "ch": null, "ans": 41, "sol": ["[출제의도] 내접원의 반지름과 닮음을 이용하여 선분의 길이를 구한다.", "AC=10이므로 내접원의 반지름의 길이는 (6+8-10)/2=2이다. 점 B를 원점, 직선 BC를 x축으로 하면 I(2, 2)이다. 직선 DE는 기울기가 -3/4이고 점 I를 지나므로 y=-3/4x+7/2이다. 따라서 D(0, 7/2), E(14/3, 0)이고 삼각형 DBE는 삼각형 ABC와 닮음비가 7/2:6=7:12이다. 따라서 DE=10×7/12=35/6이고 p+q=6+35=41이다."], "box": null, "tail": null, "table": null, "con": ["tri_center", "sim"]}], "MKS": [{"title": "제1회", "items": [{"no": 1, "pt": 2, "dom": "num", "unit": "제곱근의 계산", "text": "√48-√12+√3의 값은?", "fig": null, "ch": ["√3", "2√3", "3√3", "4√3", "5√3"], "ans": 3, "sol": ["[출제의도] 근호를 포함한 식의 덧셈과 뺄셈을 계산한다.", "√48=4√3, √12=2√3이므로 4√3-2√3+√3=3√3이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_calc"]}, {"no": 2, "pt": 2, "dom": "alg", "unit": "다항식의 계산", "text": "다항식 (3x-2)(x+4)-x(2x+1)을 간단히 하였을 때, x의 계수는?", "fig": null, "ch": ["1", "3", "5", "7", "9"], "ans": 5, "sol": ["[출제의도] 다항식을 전개하여 일차항의 계수를 구한다.", "(3x-2)(x+4)=3x²+10x-8, x(2x+1)=2x²+x이므로 차는 x²+9x-8이다. 따라서 x의 계수는 9이다."], "box": null, "tail": null, "table": null, "con": ["poly_ops"]}, {"no": 3, "pt": 2, "dom": "geo", "unit": "삼각비", "text": "그림과 같이 ∠ B=90°인 직각삼각형 ABC에서 AB=5, BC=12일 때, sin A의 값은?", "fig": "m1_q03", "ch": ["5/13", "5/12", "12/13", "13/12", "12/5"], "ans": 3, "sol": ["[출제의도] 직각삼각형에서 삼각비의 값을 구한다.", "AC=√(5²+12²)=13이므로 sin A=BC/AC=12/13이다."], "box": null, "tail": null, "table": null, "con": ["tri_ratio", "pyth"]}, {"no": 4, "pt": 3, "dom": "fun", "unit": "일차함수의 그래프", "text": "일차함수 y=ax+b의 그래프가 직선 y=2x-3과 평행하고 점 (1, 5)를 지날 때, a+b의 값은? (단, a, b는 상수이다.)", "fig": null, "ch": ["2", "3", "4", "5", "6"], "ans": 4, "sol": ["[출제의도] 평행한 두 일차함수의 기울기가 같음을 이용하여 일차함수의 식을 구한다.", "평행하므로 a=2이다. y=2x+b가 점 (1, 5)를 지나므로 5=2+b, b=3이다. 따라서 a+b=5이다."], "box": null, "tail": null, "table": null, "con": ["lf"]}, {"no": 5, "pt": 3, "dom": "sta", "unit": "줄기와 잎 그림·대푯값", "text": "다음은 어느 동호회 회원 15명의 나이를 조사하여 나타낸 줄기와 잎 그림이다. 이 자료의 중앙값을 a, 최빈값을 b라 할 때, a-b의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 1, "sol": ["[출제의도] 줄기와 잎 그림에서 중앙값과 최빈값을 구한다.", "자료를 크기순으로 나열하면 15개이므로 중앙값은 8번째 값인 26이다. 23이 두 번 나오므로 최빈값은 23이다. 따라서 a-b=26-23=3이다."], "box": null, "tail": null, "table": {"hdr": ["줄기", "잎"], "rows": [["1", "2 4 5 7"], ["2", "0 3 3 6 8 9"], ["3", "1 4 6 8 9"]], "note": "(1|2는 12세)"}, "con": ["cen", "hist"]}, {"no": 6, "pt": 3, "dom": "alg", "unit": "연립일차방정식", "text": "연립방정식 x+2y=7, 3x-y=7의 해가 x=a, y=b일 때, a+2b의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 5, "sol": ["[출제의도] 연립일차방정식의 해를 구한다.", "x+2y=7의 양변에 3을 곱하여 3x-y=7을 빼면 7y=14, y=2이고 x=3이다. 따라서 a+2b=3+4=7이다."], "box": null, "tail": null, "table": null, "con": ["simul"]}, {"no": 7, "pt": 3, "dom": "geo", "unit": "입체도형의 겉넓이", "text": "그림과 같이 밑면의 반지름의 길이가 3이고 높이가 4인 원뿔의 겉넓이는?", "fig": "m1_q07", "ch": ["16π", "20π", "22π", "24π", "28π"], "ans": 4, "sol": ["[출제의도] 원뿔의 겉넓이를 구한다.", "모선의 길이는 √(3²+4²)=5이다. 옆넓이는 π×3×5=15π, 밑넓이는 9π이므로 겉넓이는 24π이다."], "box": null, "tail": null, "table": null, "con": ["solid"]}, {"no": 8, "pt": 3, "dom": "geo", "unit": "삼각형의 외심", "text": "그림과 같이 삼각형 ABC의 외심을 O라 하자. ∠ OAB=28°, ∠ OBC=24°일 때, ∠ OCA의 크기는?", "fig": "m1_q08", "ch": ["36°", "38°", "40°", "42°", "44°"], "ans": 2, "sol": ["[출제의도] 삼각형의 외심의 성질을 이용하여 각의 크기를 구한다.", "외심에서 세 꼭짓점까지의 거리가 같으므로 삼각형 OAB, OBC, OCA는 모두 이등변삼각형이다. 삼각형 ABC의 내각의 크기의 합이 180°이므로 2×(28°+24°+∠ OCA)=180°이다. 따라서 ∠ OCA=38°이다."], "box": null, "tail": null, "table": null, "con": ["tri_center"]}, {"no": 9, "pt": 3, "dom": "fun", "unit": "이차함수의 꼭짓점", "text": "이차함수 y=-2x²+8x-3의 그래프의 꼭짓점의 좌표를 (p, q)라 할 때, p+q의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 5, "sol": ["[출제의도] 이차함수를 표준형으로 고쳐 꼭짓점의 좌표를 구한다.", "y=-2(x²-4x)-3=-2(x-2)²+5이므로 꼭짓점의 좌표는 (2, 5)이다. 따라서 p+q=7이다."], "box": null, "tail": null, "table": null, "con": ["qf"]}, {"no": 10, "pt": 3, "dom": "alg", "unit": "이차방정식", "text": "이차방정식 x²+kx-12=0의 한 근이 -3일 때, 다른 한 근은? (단, k는 상수이다.)", "fig": null, "ch": ["4", "5", "6", "7", "8"], "ans": 1, "sol": ["[출제의도] 이차방정식의 근의 뜻을 이해하고 인수분해로 다른 근을 구한다.", "x=-3을 대입하면 9-3k-12=0이므로 k=-1이다. x²-x-12=(x-4)(x+3)=0이므로 다른 한 근은 4이다."], "box": null, "tail": null, "table": null, "con": ["quad_eq"]}, {"no": 11, "pt": 3, "dom": "geo", "unit": "원주각", "text": "원 O 위의 두 점 A, B에 대하여 호 AB의 길이가 원의 둘레의 길이의 2/9일 때, 호 AB에 대한 원주각의 크기는?", "fig": null, "ch": ["28°", "32°", "36°", "40°", "44°"], "ans": 4, "sol": ["[출제의도] 호의 길이와 중심각, 원주각의 관계를 이해한다.", "호 AB에 대한 중심각의 크기는 360°×2/9=80°이다. 원주각의 크기는 중심각의 크기의 1/2이므로 40°이다."], "box": null, "tail": null, "table": null, "con": ["circle_angle"]}, {"no": 12, "pt": 3, "dom": "alg", "unit": "일차부등식", "text": "일차부등식 2x-a≤ 3x+1의 해가 x≥ -4일 때, 상수 a의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 1, "sol": ["[출제의도] 일차부등식의 해를 이용하여 미지수의 값을 구한다.", "2x-a≤ 3x+1에서 -x≤ a+1, 즉 x≥ -(a+1)이다. -(a+1)=-4이므로 a=3이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 13, "pt": 3, "dom": "sta", "unit": "경우의 수와 확률", "text": "서로 다른 두 개의 주사위를 동시에 던질 때, 나오는 두 눈의 수의 곱이 10 이상일 확률은?", "fig": null, "ch": ["17/36", "1/2", "19/36", "5/9", "7/12"], "ans": 3, "sol": ["[출제의도] 경우의 수를 구하여 확률을 계산한다.", "모든 경우의 수는 36이다. 두 눈의 수의 곱이 10 이상인 경우를 눈의 수 (a, b)로 나타내면 a=2일 때 2가지, a=3일 때 3가지, a=4일 때 4가지, a=5일 때 5가지, a=6일 때 5가지로 모두 19가지이다. 따라서 구하는 확률은 19/36이다."], "box": null, "tail": null, "table": null, "con": ["prob", "counting"]}, {"no": 14, "pt": 4, "dom": "fun", "unit": "반비례 그래프와 도형의 넓이", "text": "그림과 같이 반비례 관계 y=a/x (a>0)의 그래프 위의 두 점 A, B의 x
