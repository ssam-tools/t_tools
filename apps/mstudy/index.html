좌표는 각각 2, 6이다. 점 A를 지나고 x축에 평행한 직선과 점 B를 지나고 y축에 평행한 직선이 만나는 점을 C라 하자. 삼각형 ABC의 넓이가 8일 때, 상수 a의 값은?", "fig": "m1_q14", "ch": ["10", "12", "14", "16", "18"], "ans": 2, "sol": ["[출제의도] 반비례 그래프 위의 점의 좌표를 이용하여 삼각형의 넓이를 구한다.", "A(2, a/2), B(6, a/6), C(6, a/2)이다. AC=4, BC=a/2-a/6=a/3이므로 삼각형 ABC의 넓이는 1/2×4×a/3=2a/3=8이다. 따라서 a=12이다."], "box": null, "tail": null, "table": null, "con": ["inv", "coord_area"]}, {"no": 15, "pt": 4, "dom": "geo", "unit": "닮음과 넓이의 비", "text": "그림과 같이 삼각형 ABC에서 DE∥BC이고 AD:DB=2:3이다. 사각형 DBCE의 넓이가 63일 때, 삼각형 ADE의 넓이는?", "fig": "m1_q15", "ch": ["4", "6", "8", "10", "12"], "ans": 5, "sol": ["[출제의도] 닮은 도형의 넓이의 비를 이용하여 넓이를 구한다.", "삼각형 ADE와 삼각형 ABC의 닮음비가 2:5이므로 넓이의 비는 4:25이다. 삼각형 ADE의 넓이를 4k라 하면 사각형 DBCE의 넓이는 21k이다. 21k=63이므로 k=3이고, 삼각형 ADE의 넓이는 12이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 16, "pt": 4, "dom": "alg", "unit": "일차부등식의 활용", "text": "서점 A는 책 한 권에 800원이고 배송비가 없고, 서점 B는 책 한 권에 700원이고 배송비가 2400원이다. (단, 배송비는 한 번만 지불한다.) 같은 책을 x권 살 때, B서점에서 사는 것이 A서점에서 사는 것보다 비용이 적게 들도록 하는 x의 최솟값은?", "fig": null, "ch": ["25", "26", "27", "28", "29"], "ans": 1, "sol": ["[출제의도] 일차부등식을 활용하여 문제를 해결한다.", "B서점의 비용이 더 적으려면 700x+2400<800x이다. 100x>2400에서 x>24이므로 자연수 x의 최솟값은 25이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 17, "pt": 4, "dom": "geo", "unit": "삼각형의 무게중심", "text": "그림과 같이 삼각형 ABC의 무게중심을 G라 하고, 점 G를 지나고 변 BC에 평행한 직선이 두 변 AB, AC와 만나는 점을 각각 D, E라 하자. 삼각형 ABC의 넓이가 54일 때, 사각형 DBCE의 넓이는?", "fig": "m1_q17", "ch": ["28", "30", "32", "34", "36"], "ans": 2, "sol": ["[출제의도] 무게중심의 성질과 닮음을 이용하여 넓이를 구한다.", "변 BC의 중점을 M이라 하면 AG:GM=2:1이므로 AG:AM=2:3이다. 삼각형 ADE와 삼각형 ABC의 닮음비가 2:3이므로 넓이의 비는 4:9이고, 삼각형 ADE의 넓이는 54×4/9=24이다. 따라서 사각형 DBCE의 넓이는 54-24=30이다."], "box": null, "tail": null, "table": null, "con": ["tri_center", "sim"]}, {"no": 18, "pt": 4, "dom": "fun", "unit": "이차함수와 직선의 교점, 넓이", "text": "그림과 같이 이차함수 y=x²-2x-3의 그래프와 직선 y=x+1이 만나는 두 점을 각각 A, B라 하고, 이차함수의 그래프가 y축과 만나는 점을 C라 하자. 삼각형 ABC의 넓이는? (단, 점 A의 x좌표는 점 B의 x좌표보다 작다.)", "fig": "m1_q18", "ch": ["9", "10", "11", "12", "13"], "ans": 2, "sol": ["[출제의도] 이차함수와 직선의 교점의 좌표를 구하여 삼각형의 넓이를 구한다.", "x²-2x-3=x+1에서 x²-3x-4=0, (x+1)(x-4)=0이므로 A(-1, 0), B(4, 5)이다. y절편은 -3이므로 C(0, -3)이다. 직선 y=x+1이 y축과 만나는 점을 D라 하면 D(0, 1)이므로 CD=4이다. 따라서 삼각형 ABC의 넓이는 (삼각형 ACD의 넓이) + (삼각형 BCD의 넓이) =1/2×4×1+1/2×4×4=2+8=10이다."], "box": null, "tail": null, "table": null, "con": ["qf", "lf_eq", "coord_area"]}, {"no": 19, "pt": 4, "dom": "geo", "unit": "원의 접선", "text": "그림과 같이 반지름의 길이가 3인 원 O의 외부의 점 P에서 원에 그은 두 접선의 접점을 각각 A, B라 하자. OP=5일 때, 선분 AB의 길이는?", "fig": "m1_q19", "ch": ["4", "22/5", "23/5", "24/5", "5"], "ans": 4, "sol": ["[출제의도] 원의 접선의 성질과 닮음을 이용하여 길이를 구한다.", "∠ OAP=90°이므로 AP=√(5²-3²)=4이다. 선분 AB와 선분 OP의 교점을 H라 하면 OA×AP=OP×AH에서 AH=(3×4)/5=12/5이다. 따라서 AB=2AH=24/5이다."], "box": null, "tail": null, "table": null, "con": ["circle_tan", "pyth"]}, {"no": 20, "pt": 4, "dom": "geo", "unit": "직각삼각형의 닮음(보기)", "text": "그림과 같이 ∠ A=90°이고 AB=6, AC=8인 직각삼각형 ABC에서 점 A에서 변 BC에 내린 수선의 발을 H라 하자. <보기>에서 옳은 것만을 있는 대로 고른 것은?", "fig": "m1_q20", "ch": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "ans": 3, "sol": ["[출제의도] 직각삼각형의 닮음과 넓이의 비를 이해한다.", "BC=10이다. ㄱ. AB×AC=BC×AH에서 AH=24/5이다. (참) ㄴ. AC²=CH×BC에서 CH=64/10=32/5이다. (거짓) ㄷ. BH=18/5이므로 두 삼각형의 넓이의 비는 BH:CH=9:16이다. (참) 따라서 옳은 것은 ㄱ, ㄷ이다."], "box": ["ㄱ. AH=24/5", "ㄴ. CH=6", "ㄷ. 삼각형 ABH의 넓이와 삼각형 ACH의 넓이의 비는 9:16이다."], "tail": "보기", "table": null, "con": ["pyth", "sim"]}, {"no": 21, "pt": 4, "dom": "geo", "unit": "각의 이등분선과 닮음(과정 완성)", "text": "삼각형 ABC에서 ∠ A의 이등분선이 변 BC와 만나는 점을 D라 하자. AB=6, AC=4, BC=5일 때, 선분 BD의 길이를 구하는 과정이다. 위의 (가), (나), (다)에 알맞은 수를 각각 a, b, c라 할 때, a×b×c의 값은?", "fig": "m1_q21", "ch": ["12", "16", "20", "24", "28"], "ans": 4, "sol": ["[출제의도] 평행선과 이등변삼각형의 성질을 이용하여 선분의 길이의 비를 구한다.", "AE=AC=4이므로 (가)는 4이다. BD:DC=6:4=3:2이고 BC=5이므로 BD=3, DC=2이다. 따라서 a=4, b=3, c=2이고 a×b×c=24이다."], "box": ["점 C를 지나고 선분 AD에 평행한 직선이 변 BA의 연장선과 만나는 점을 E라 하자.", "AD∥EC이므로 ∠ BAD=∠ AEC (동위각), ∠ DAC=∠ ACE (엇각)이다.", "∠ BAD=∠ DAC이므로 ∠ AEC=∠ ACE이고, 삼각형 ACE는 이등변삼각형이므로 AE=AC= (가) 이다.", "AD∥EC이므로 BD:DC=BA:AE=6: (가) =3:2이다.", "따라서 BD= (나) , DC= (다) 이다."], "tail": null, "table": null, "con": ["angle_bisect", "sim"]}, {"no": 22, "pt": 3, "dom": "num", "unit": "순환소수", "text": "순환소수 0.151515…를 기약분수 a/b로 나타낼 때, a+b의 값을 구하시오.", "fig": null, "ch": null, "ans": 38, "sol": ["[출제의도] 순환소수를 분수로 나타낸다.", "x=0.151515…라 하면 100x-x=15이므로 x=15/99=5/33이다. 따라서 a+b=5+33=38이다."], "box": null, "tail": null, "table": null, "con": ["rat_dec"]}, {"no": 23, "pt": 3, "dom": "fun", "unit": "일차함수의 절편", "text": "좌표평면 위의 두 점 (1, 4), (4, -2)를 지나는 직선의 x절편과 y절편의 합을 구하시오.", "fig": null, "ch": null, "ans": 9, "sol": ["[출제의도] 두 점을 지나는 직선의 식을 구하여 절편을 구한다.", "기울기는 (-2-4)/(4-1)=-2이고, 직선의 식은 y-4=-2(x-1), 즉 y=-2x+6이다. x절편은 3, y절편은 6이므로 합은 9이다."], "box": null, "tail": null, "table": null, "con": ["lf"]}, {"no": 24, "pt": 3, "dom": "num", "unit": "소인수분해", "text": "360에 자연수 n을 곱하여 어떤 자연수의 제곱이 되게 하려고 한다. n의 최솟값을 구하시오.", "fig": null, "ch": null, "ans": 10, "sol": ["[출제의도] 소인수분해를 이용하여 제곱수가 되는 조건을 구한다.", "360=2³×3²×5이다. 제곱수가 되려면 소인수의 지수가 모두 짝수여야 하므로 n의 최솟값은 2×5=10이다."], "box": null, "tail": null, "table": null, "con": ["pf"]}, {"no": 25, "pt": 3, "dom": "sta", "unit": "경우의 수", "text": "5명의 학생 중에서 회장 1명, 부회장 1명, 총무 1명을 뽑을 때, 학생 A가 회장이 되지 않는 경우의 수를 구하시오. (단, 한 학생이 두 개 이상의 직책을 맡을 수 없다.)", "fig": null, "ch": null, "ans": 48, "sol": ["[출제의도] 합의 법칙과 곱의 법칙을 이용하여 경우의 수를 구한다.", "세 직책을 정하는 모든 경우의 수는 5×4×3=60이다. A가 회장이 되는 경우의 수는 4×3=12이다. 따라서 구하는 경우의 수는 60-12=48이다."], "box": null, "tail": null, "table": null, "con": ["counting"]}, {"no": 26, "pt": 4, "dom": "sta", "unit": "평균과 분산", "text": "5개의 변량 2, 4, x, 8, 11의 평균이 6일 때, 각 변량을 2배 한 5개의 변량의 분산을 구하시오.", "fig": null, "ch": null, "ans": 40, "sol": ["[출제의도] 평균을 이용하여 미지수를 구하고 분산을 계산한다.", "평균이 6이므로 2+4+x+8+11=30에서 x=5이다. 각 변량을 2배 하면 4, 8, 10, 16, 22이고 평균은 12이다. 편차의 제곱의 합은 64+16+4+16+100=200이므로 분산은 200/5=40이다."], "box": null, "tail": null, "table": null, "con": ["disp"]}, {"no": 27, "pt": 4, "dom": "num", "unit": "제곱근이 자연수가 되는 조건", "text": "두 자리 자연수 n에 대하여 √(n/3)과 √(300-n)이 모두 자연수일 때, n의 값을 구하시오.", "fig": null, "ch": null, "ans": 75, "sol": ["[출제의도] 제곱근이 자연수가 되는 조건을 이용하여 자연수를 구한다.", "√(n/3)이 자연수이므로 n=3m² (m은 자연수)이다. 두 자리 수는 12, 27, 48, 75이다. 이 중 300-n이 제곱수인 경우는 300-75=225=15²뿐이다. 따라서 n=75이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_nat"]}, {"no": 28, "pt": 4, "dom": "geo", "unit": "닮음과 넓이", "text": "그림과 같이 한 변의 길이가 12인 정사각형 ABCD에서 변 BC 위의 점 E에 대하여 BE=4이다. 두 선분 AE, BD의 교점을 F라 할 때, 삼각형 AFD의 넓이를 구하시오.", "fig": "m1_q28", "ch": null, "ans": 54, "sol": ["[출제의도] 닮은 삼각형을 찾아 닮음비를 이용하여 넓이를 구한다.", "AD∥BE이므로 삼각형 FBE와 삼각형 FDA는 닮음이고 닮음비는 BE:AD=4:12=1:3이다. 따라서 BF:FD=1:3이다. 삼각형 ABD의 넓이는 72이고 삼각형 AFD의 넓이는 72×3/4=54이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 29, "pt": 4, "dom": "fun", "unit": "이차함수의 그래프와 도형의 넓이", "text": "그림과 같이 이차함수 y=-(x-2)²+9의 그래프가 x축과 만나는 두 점을 P, Q, y축과 만나는 점을 R, 꼭짓점을 V라 하자. (단, 점 P의 x좌표는 점 Q의 x좌표보다 작다.) 점 V를 지나고 직선 PR에 평행한 직선이 x축과 만나는 점을 S라 할 때, 삼각형 PSR의 넓이를 구하시오.", "fig": "m1_q29", "ch": null, "ans": 3, "sol": ["[출제의도] 이차함수의 그래프와 직선의 성질을 이용하여 삼각형의 넓이를 구한다.", "-(x-2)²+9=0에서 x=-1 또는 x=5이므로 P(-1, 0), Q(5, 0)이고, R(0, 5), V(2, 9)이다. 직선 PR의 기울기는 5이므로 점 V를 지나고 기울기가 5인 직선은 y=5x-1이다. 이 직선이 x축과 만나는 점은 S(1/5, 0)이다. 따라서 삼각형 PSR의 넓이는 1/2×(1/5+1)×5=3이다."], "box": null, "tail": null, "table": null, "con": ["qf", "coord_area", "lf"]}, {"no": 30, "pt": 4, "dom": "geo", "unit": "삼각형의 내접원과 닮음", "text": "그림과 같이 ∠ B=90°, AB=6, BC=8인 직각삼각형 ABC의 내접원의 중심을 I라 하자. 점 I를 지나고 선분 AC에 평행한 직선이 두 선분 AB, BC와 만나는 점을 각각 D, E라 할 때, 선분 DE의 길이는 q/p이다. p+q의 값을 구하시오. (단, p와 q는 서로소인 자연수이다.)", "fig": "m1_q30", "ch": null, "ans": 41, "sol": ["[출제의도] 내접원의 반지름과 닮음을 이용하여 선분의 길이를 구한다.", "AC=10이므로 내접원의 반지름의 길이는 (6+8-10)/2=2이다. 점 B를 원점, 직선 BC를 x축으로 하면 I(2, 2)이다. 직선 DE는 기울기가 -3/4이고 점 I를 지나므로 y=-3/4x+7/2이다. 따라서 D(0, 7/2), E(14/3, 0)이고 삼각형 DBE는 삼각형 ABC와 닮음비가 7/2:6=7:12이다. 따라서 DE=10×7/12=35/6이고 p+q=6+35=41이다."], "box": null, "tail": null, "table": null, "con": ["tri_center", "sim"]}]}, {"title": "제2회", "items": [{"no": 1, "pt": 2, "dom": "num", "unit": "제곱근의 계산", "text": "(√20+√45)÷√5의 값은?", "fig": null, "ch": ["3", "4", "5", "6", "7"], "ans": 3, "sol": ["[출제의도] 근호를 포함한 식의 계산을 한다.", "√20=2√5, √45=3√5이므로 (2√5+3√5)÷√5=5이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_calc"]}, {"no": 2, "pt": 2, "dom": "alg", "unit": "다항식의 계산과 곱셈공식", "text": "다항식 (2x+3)²-(2x-1)(2x+1)을 간단히 하였을 때, x의 계수는?", "fig": null, "ch": ["6", "8", "10", "12", "14"], "ans": 4, "sol": ["[출제의도] 곱셈공식을 이용하여 다항식을 계산한다.", "(2x+3)²=4x²+12x+9, (2x-1)(2x+1)=4x²-1이므로 차는 12x+10이다. 따라서 x의 계수는 12이다."], "box": null, "tail": null, "table": null, "con": ["poly_ops", "mult_formula"]}, {"no": 3, "pt": 2, "dom": "geo", "unit": "삼각비", "text": "그림과 같이 ∠ B=90°인 직각삼각형 ABC에서 AB=8, BC=6일 때, cos A의 값은?", "fig": "m2_r2_q03", "ch": ["3/5", "3/4", "4/5", "5/4", "4/3"], "ans": 3, "sol": ["[출제의도] 직각삼각형에서 삼각비의 값을 구한다.", "AC=√(8²+6²)=10이므로 cos A=AB/AC=8/10=4/5이다."], "box": null, "tail": null, "table": null, "con": ["tri_ratio", "pyth"]}, {"no": 4, "pt": 3, "dom": "fun", "unit": "일차함수의 절편", "text": "일차함수 y=-3x+6의 그래프의 x절편을 a, y절편을 b라 할 때, a+b의 값은?", "fig": null, "ch": ["8", "9", "10", "11", "12"], "ans": 1, "sol": ["[출제의도] 일차함수의 그래프의 절편을 구한다.", "y=0이면 x=2이므로 a=2, x=0이면 y=6이므로 b=6이다. 따라서 a+b=8이다."], "box": null, "tail": null, "table": null, "con": ["lf"]}, {"no": 5, "pt": 3, "dom": "sta", "unit": "도수분포표와 상대도수", "text": "다음은 학생 40명의 한 달 동안 읽은 책의 수를 조사하여 나타낸 도수분포표이다. 책의 수가 5권 이상 10권 미만인 계급의 상대도수가 0.3일 때, 책의 수가 15권 이상 20권 미만인 학생 수 b는?", "fig": null, "ch": ["4", "5", "6", "7", "8"], "ans": 5, "sol": ["[출제의도] 도수분포표에서 상대도수를 이용하여 도수를 구한다.", "상대도수가 0.3이므로 a=40×0.3=12이다. 도수의 총합이 40이므로 b=40-(6+12+14)=8이다."], "box": null, "tail": null, "table": {"hdr": ["책의 수(권)", "학생 수(명)"], "rows": [["0 이상 ~ 5 미만", "6"], ["5 ~ 10", "a"], ["10 ~ 15", "14"], ["15 ~ 20", "b"], ["합계", "40"]], "note": ""}, "con": ["hist"]}, {"no": 6, "pt": 3, "dom": "alg", "unit": "연립일차방정식", "text": "연립방정식 2x+y=11, x-y=1의 해가 x=a, y=b일 때, ab의 값은?", "fig": null, "ch": ["10", "12", "14", "16", "18"], "ans": 2, "sol": ["[출제의도] 연립일차방정식의 해를 구한다.", "두 식을 더하면 3x=12이므로 x=4이고 y=3이다. 따라서 ab=12이다."], "box": null, "tail": null, "table": null, "con": ["simul"]}, {"no": 7, "pt": 3, "dom": "geo", "unit": "입체도형의 겉넓이", "text": "밑면의 반지름의 길이가 3이고 높이가 5인 원기둥의 겉넓이는?", "fig": null, "ch": ["24π", "30π", "36π", "42π", "48π"], "ans": 5, "sol": ["[출제의도] 원기둥의 겉넓이를 구한다.", "밑넓이는 π×3²=9π이고 옆넓이는 2π×3×5=30π이므로 겉넓이는 2×9π+30π=48π이다."], "box": null, "tail": null, "table": null, "con": ["solid"]}, {"no": 8, "pt": 3, "dom": "geo", "unit": "삼각형의 내심", "text": "그림과 같이 삼각형 ABC의 내심을 I라 하자. ∠ A=64°일 때, ∠ BIC의 크기는?", "fig": "m2_r2_q08", "ch": ["120°", "122°", "124°", "126°", "128°"], "ans": 2, "sol": ["[출제의도] 삼각형의 내심의 성질을 이용하여 각의 크기를 구한다.", "∠ IBC+∠ ICB=1/2(∠ B+∠ C)=1/2(180°-64°)=58°이다. 따라서 ∠ BIC=180°-58°=122°이다."], "box": null, "tail": null, "table": null, "con": ["tri_center"]}, {"no": 9, "pt": 3, "dom": "fun", "unit": "이차함수의 꼭짓점", "text": "이차함수 y=x²-6x+k의 그래프의 꼭짓점의 y좌표가 -2일 때, 상수 k의 값은?", "fig": null, "ch": ["7", "9", "11", "13", "15"], "ans": 1, "sol": ["[출제의도] 이차함수를 표준형으로 고쳐 꼭짓점의 좌표를 구한다.", "y=(x-3)²+k-9이므로 꼭짓점의 y좌표는 k-9이다. k-9=-2에서 k=7이다."], "box": null, "tail": null, "table": null, "con": ["qf"]}, {"no": 10, "pt": 3, "dom": "alg", "unit": "이차방정식", "text": "이차방정식 2x²-x-6=0의 두 근 중 양수인 근은?", "fig": null, "ch": ["3/2", "2", "5/2", "3", "7/2"], "ans": 2, "sol": ["[출제의도] 인수분해로 이차방정식의 해를 구한다.", "2x²-x-6=(2x+3)(x-2)=0이므로 x=-3/2 또는 x=2이다. 양수인 근은 2이다."], "box": null, "tail": null, "table": null, "con": ["quad_eq"]}, {"no": 11, "pt": 3, "dom": "geo", "unit": "원에 내접하는 사각형", "text": "원에 내접하는 사각형 ABCD에서 ∠ A=70°, ∠ B=95°일 때, ∠ C-∠ D의 크기는?", "fig": null, "ch": ["15°", "20°", "25°", "30°", "35°"], "ans": 3, "sol": ["[출제의도] 원에 내접하는 사각형의 성질을 이해한다.", "마주 보는 두 각의 크기의 합이 180°이므로 ∠ C=180°-70°=110°, ∠ D=180°-95°=85°이다. 따라서 ∠ C-∠ D=25°이다."], "box": null, "tail": null, "table": null, "con": ["circle_angle"]}, {"no": 12, "pt": 3, "dom": "alg", "unit": "일차부등식", "text": "일차부등식 4x-a≤ 2x+6의 해가 x≤ 5일 때, 상수 a의 값은?", "fig": null, "ch": ["0", "1", "2", "3", "4"], "ans": 5, "sol": ["[출제의도] 일차부등식의 해를 이용하여 미지수의 값을 구한다.", "2x≤ a+6에서 x≤(a+6)/2이다. (a+6)/2=5이므로 a=4이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 13, "pt": 3, "dom": "sta", "unit": "경우의 수와 확률", "text": "서로 다른 두 개의 주사위를 동시에 던질 때, 나오는 두 눈의 수의 차가 2 이하일 확률은?", "fig": null, "ch": ["1/2", "5/9", "11/18", "2/3", "13/18"], "ans": 4, "sol": ["[출제의도] 경우의 수를 구하여 확률을 계산한다.", "모든 경우의 수는 36이다. 두 눈의 수의 차가 0인 경우 6가지, 1인 경우 10가지, 2인 경우 8가지로 모두 24가지이다. 따라서 확률은 24/36=2/3이다."], "box": null, "tail": null, "table": null, "con": ["prob", "counting"]}, {"no": 14, "pt": 4, "dom": "fun", "unit": "반비례 그래프와 도형의 넓이", "text": "그림과 같이 반비례 관계 y=a/x (a>0)의 그래프 위의 두 점 A, B의 x좌표는 각각 3, 6이다. 두 점 A, B에서 x축에 내린 수선의 발을 각각 C, D라 할 때, 사각형 ACDB의 넓이가 18이다. 상수 a의 값은?", "fig": "m2_r2_q14", "ch": ["22", "24", "26", "28", "30"], "ans": 2, "sol": ["[출제의도] 반비례 그래프 위의 점의 좌표를 이용하여 사각형의 넓이를 구한다.", "A(3, a/3), B(6, a/6), C(3, 0), D(6, 0)이다. 사각형 ACDB는 사다리꼴이므로 넓이는 1/2×(a/3+a/6)×3=3a/4=18이다. 따라서 a=24이다."], "box": null, "tail": null, "table": null, "con": ["inv", "coord_area"]}, {"no": 15, "pt": 4, "dom": "geo", "unit": "닮음의 활용", "text": "그림과 같이 삼각형 ABC에서 변 AC 위의 점 D에 대하여 ∠ ABD=∠ ACB이다. AB=6, AC=9일 때, 선분 CD의 길이는?", "fig": "m2_r2_q15", "ch": ["3", "4", "5", "6", "7"], "ans": 3, "sol": ["[출제의도] 두 삼각형의 닮음을 이용하여 선분의 길이를 구한다.", "삼각형 ABD와 삼각형 ACB에서 ∠ A는 공통이고 ∠ ABD=∠ ACB이므로 닮음(AA)이다. AB:AC=AD:AB에서 AD=36/9=4이다. 따라서 CD=9-4=5이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 16, "pt": 4, "dom": "alg", "unit": "일차부등식의 활용", "text": "집에서 출발하여 갈 때는 시속 4 km로, 올 때는 같은 길을 시속 6 km로 걸어서 왕복 2시간 30분 이내에 돌아오려고 한다. 집에서 최대 몇 km 떨어진 곳까지 다녀올 수 있는가?", "fig": null, "ch": ["6", "7", "8", "9", "10"], "ans": 1, "sol": ["[출제의도] 일차부등식을 활용하여 문제를 해결한다.", "집에서 x km 떨어진 곳까지 다녀온다고 하면 x/4+x/6≤5/2이다. 양변에 12를 곱하면 3x+2x≤ 30, x≤ 6이다. 최대 6 km이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq", "lin_eq"]}, {"no": 17, "pt": 4, "dom": "geo", "unit": "삼각형의 무게중심", "text": "그림과 같이 삼각형 ABC의 무게중심을 G, 변 AB의 중점을 D, 변 BC의 중점을 M이라 하자. 사각형 DBMG의 넓이가 10일 때, 삼각형 ABC의 넓이는?", "fig": "m2_r2_q17", "ch": ["21", "24", "27", "30", "33"], "ans": 4, "sol": ["[출제의도] 무게중심의 성질을 이용하여 넓이를 구한다.", "세 중선은 삼각형의 넓이를 6등분한다. 사각형 DBMG는 삼각형 GDB와 삼각형 GBM으로 이루어져 있으므로 삼각형 ABC의 넓이의 2/6=1/3이다. 따라서 삼각형 ABC의 넓이는 10×3=30이다."], "box": null, "tail": null, "table": null, "con": ["tri_center"]}, {"no": 18, "pt": 4, "dom": "fun", "unit": "이차함수와 도형의 넓이", "text": "그림과 같이 이차함수 y=-x²+2x+3의 그래프가 x축과 만나는 두 점을 A, B, y축과 만나는 점을 C라 하자. 삼각형 ABC의 넓이는? (단, 점 A의 x좌표는 점 B의 x좌표보다 작다.)", "fig": "m2_r2_q18", "ch": ["2", "3", "4", "5", "6"], "ans": 5, "sol": ["[출제의도] 이차함수의 그래프와 좌표축의 교점을 이용하여 넓이를 구한다.", "-x²+2x+3=0에서 x²-2x-3=(x+1)(x-3)=0이므로 A(-1, 0), B(3, 0)이다. y절편은 3이므로 C(0, 3)이다. 삼각형 ABC의 넓이는 1/2×4×3=6이다."], "box": null, "tail": null, "table": null, "con": ["qf", "coord_area"]}, {"no": 19, "pt": 4, "dom": "geo", "unit": "원의 접선과 원주각", "text": "그림과 같이 원 O 밖의 점 P에서 원에 그은 두 접선의 접점을 각각 A, B라 하자. ∠ APB=50°이고, 점 C는 원 위의 점 중 직선 AB에 대하여 점 P와 반대쪽에 있는 점일 때, ∠ ACB의 크기는?", "fig": "m2_r2_q19", "ch": ["55°", "60°", "65°", "70°", "75°"], "ans": 3, "sol": ["[출제의도] 접선의 성질과 원주각의 성질을 이용하여 각의 크기를 구한다.", "∠ OAP=∠ OBP=90°이므로 사각형 OAPB에서 ∠ AOB=360°-90°-90°-50°=130°이다. 호 AB에 대한 원주각은 중심각의 1/2이므로 ∠ ACB=65°이다."], "box": null, "tail": null, "table": null, "con": ["circle_tan", "circle_angle"]}, {"no": 20, "pt": 4, "dom": "geo", "unit": "정삼각형과 외접원·내접원(보기)", "text": "그림과 같이 한 변의 길이가 6인 정삼각형 ABC가 있다. <보기>에서 옳은 것만을 있는 대로 고른 것은?", "fig": "m2_r2_q20", "ch": ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "ans": 4, "sol": ["[출제의도] 정삼각형의 높이와 외심, 내심의 성질을 이해한다.", "ㄱ. 높이는 √3/2×6=3√3이다. (거짓) ㄴ. 정삼각형의 외심은 무게중심과 같으므로 외접원의 반지름은 높이의 2/3인 2√3이다. (참) ㄷ. 내접원의 반지름은 높이의 1/3인 √3이므로 넓이는 3π이다. (참) 따라서 옳은 것은 ㄴ, ㄷ이다."], "box": ["ㄱ. 높이는 3√2이다.", "ㄴ. 외접원의 반지름의 길이는 2√3이다.", "ㄷ. 내접원의 넓이는 3π이다."], "tail": "보기", "table": null, "con": ["tri_center", "pyth"]}, {"no": 21, "pt": 4, "dom": "geo", "unit": "직사각형 접기와 피타고라스 정리", "text": "그림과 같이 AB=6, BC=8인 직사각형 ABCD를 꼭짓점 C가 꼭짓점 A에 겹치도록 접었다. 접은 선의 길이는?", "fig": "m2_r2_q21", "ch": ["6", "7", "15/2", "8", "9"], "ans": 3, "sol": ["[출제의도] 직사각형 접기에서 닮음과 피타고라스 정리를 이용하여 길이를 구한다.", "AC=√(6²+8²)=10이다. 접은 선과 AC의 교점을 M이라 하면 CM=5이고 접은 선은 AC에 수직이다. 접은 선이 변 BC와 만나는 점을 E라 하면 삼각형 MEC와 삼각형 BAC는 닮음(∠ C 공통, 직각)이므로 ME:AB=CM:BC, ME=(6×5)/8=15/4이다. 대칭이므로 접은 선의 길이는 2×15/4=15/2이다."], "box": null, "tail": null, "table": null, "con": ["pyth", "sim"]}, {"no": 22, "pt": 3, "dom": "num", "unit": "소인수분해와 약수의 개수", "text": "540의 약수의 개수를 구하시오.", "fig": null, "ch": null, "ans": 24, "sol": ["[출제의도] 소인수분해를 이용하여 약수의 개수를 구한다.", "540=2²×3³×5이므로 약수의 개수는 (2+1)(3+1)(1+1)=24이다."], "box": null, "tail": null, "table": null, "con": ["pf"]}, {"no": 23, "pt": 3, "dom": "fun", "unit": "이차함수의 그래프와 x축", "text": "이차함수 y=-2(x+1)²+8의 그래프가 x축과 만나는 두 점 사이의 거리를 구하시오.", "fig": null, "ch": null, "ans": 4, "sol": ["[출제의도] 이차함수의 그래프가 x축과 만나는 점을 구한다.", "-2(x+1)²+8=0에서 (x+1)²=4이므로 x=1 또는 x=-3이다. 두 점 사이의 거리는 1-(-3)=4이다."], "box": null, "tail": null, "table": null, "con": ["qf"]}, {"no": 24, "pt": 3, "dom": "num", "unit": "유한소수가 되는 조건", "text": "분수 a/60가 유한소수로 나타내어지는 두 자리 자연수 a의 개수를 구하시오.", "fig": null, "ch": null, "ans": 30, "sol": ["[출제의도] 유한소수가 되는 조건을 이용하여 자연수의 개수를 구한다.", "60=2²×3×5이므로 a/60가 유한소수가 되려면 a가 3의 배수이어야 한다. 두 자리 자연수 중 3의 배수는 12부터 99까지 30개이다."], "box": null, "tail": null, "table": null, "con": ["rat_dec"]}, {"no": 25, "pt": 3, "dom": "sta", "unit": "경우의 수", "text": "A, B, C, D, E 5명을 한 줄로 세울 때, A와 B가 이웃하지 않도록 세우는 경우의 수를 구하시오.", "fig": null, "ch": null, "ans": 72, "sol": ["[출제의도] 여사건을 이용하여 경우의 수를 구한다.", "5명을 한 줄로 세우는 경우의 수는 5×4×3×2×1=120이다. A와 B가 이웃하는 경우는 A, B를 한 묶음으로 보아 4×3×2×1=24가지이고 묶음 안에서 2가지이므로 48이다. 따라서 120-48=72이다."], "box": null, "tail": null, "table": null, "con": ["counting"]}, {"no": 26, "pt": 4, "dom": "sta", "unit": "평균과 분산", "text": "6개의 변량 4, 6, 7, x, 10, y의 평균이 7이고 분산이 4일 때, xy의 값을 구하시오. (단, x<y)", "fig": null, "ch": null, "ans": 54, "sol": ["[출제의도] 평균과 분산을 이용하여 미지수의 값을 구한다.", "평균이 7이므로 4+6+7+x+10+y=42에서 x+y=15이다. 편차의 제곱의 합이 4×6=24이므로 9+1+0+(x-7)²+9+(y-7)²=24, (x-7)²+(y-7)²=5이다. a=x-7, b=y-7이라 하면 a+b=1, a²+b²=5이므로 ab=-2이다. 따라서 a=-1, b=2이고 x=6, y=9이다. xy=54이다."], "box": null, "tail": null, "table": null, "con": ["disp", "cen"]}, {"no": 27, "pt": 4, "dom": "num", "unit": "제곱근이 자연수가 되는 조건", "text": "두 자리 자연수 n 중에서 √40n이 자연수가 되는 모든 n의 값의 합을 구하시오.", "fig": null, "ch": null, "ans": 140, "sol": ["[출제의도] 제곱근이 자연수가 되는 조건을 이용하여 자연수를 구한다.", "40n=2³×5×n이 제곱수가 되려면 n=10m² (m은 자연수) 꼴이어야 한다. 두 자리 자연수는 m=1, 2, 3일 때 10, 40, 90이다. 합은 140이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_nat", "pf"]}, {"no": 28, "pt": 4, "dom": "geo", "unit": "닮음과 넓이", "text": "그림과 같이 AB=8, AD=12인 직사각형 ABCD에서 변 AD 위의 점 E에 대하여 AE=4이다. 두 선분 BE, AC의 교점을 F라 할 때, 삼각형 FBC의 넓이를 구하시오.", "fig": "m2_r2_q28", "ch": null, "ans": 36, "sol": ["[출제의도] 닮은 삼각형을 이용하여 넓이를 구한다.", "AD∥BC이므로 삼각형 FAE와 삼각형 FCB는 닮음이고 닮음비는 AE:CB=4:12=1:3이다. 따라서 점 F에서 변 BC까지의 거리는 AB의 3/4인 6이다. 삼각형 FBC의 넓이는 1/2×12×6=36이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 29, "pt": 4, "dom": "fun", "unit": "이차함수와 도형의 넓이", "text": "그림과 같이 이차함수 y=x²-2x-8의 그래프가 x축과 만나는 두 점을 A, B, y축과 만나는 점을 C, 꼭짓점을 V라 하자. 삼각형 ABC의 넓이와 삼각형 ABV의 넓이의 합을 구하시오.", "fig": "m2_r2_q29", "ch": null, "ans": 51, "sol": ["[출제의도] 이차함수의 그래프의 꼭짓점과 절편을 이용하여 넓이를 구한다.", "x²-2x-8=(x+2)(x-4)=0이므로 A(-2, 0), B(4, 0)이고 AB=6이다. y절편은 -8이므로 C(0, -8)이고, y=(x-1)²-9이므로 V(1, -9)이다. 삼각형 ABC의 넓이는 1/2×6×8=24, 삼각형 ABV의 넓이는 1/2×6×9=27이다. 합은 51이다."], "box": null, "tail": null, "table": null, "con": ["qf", "coord_area"]}, {"no": 30, "pt": 4, "dom": "geo", "unit": "외접원과 내접원", "text": "∠ C=90°, AC=9, BC=12인 직각삼각형 ABC의 외접원의 중심을 O, 내접원의 중심을 I라 할 때, 20×OI²의 값을 구하시오.", "fig": null, "ch": null, "ans": 225, "sol": ["[출제의도] 직각삼각형의 외심과 내심의 성질을 이용하여 길이를 구한다.", "AB=15이고 외심 O는 빗변 AB의 중점이다. 내접원의 반지름은 (9+12-15)/2=3이다. 점 C를 원점, 직선 CA를 x축으로 하면 A(9, 0), B(0, 12)이고 O(9/2, 6), I(3, 3)이다. OI²=(3/2)²+3²=45/4이므로 20×OI²=225이다."], "box": null, "tail": null, "table": null, "con": ["pyth", "tri_center"]}]}, {"title": "제3회", "items": [{"no": 1, "pt": 2, "dom": "num", "unit": "제곱근의 계산", "text": "√75-√12+√3의 값은?", "fig": null, "ch": ["2√3", "3√3", "4√3", "5√3", "6√3"], "ans": 3, "sol": ["[출제의도] 근호 안의 수를 간단히 하여 계산한다.", "√75=5√3, √12=2√3이므로 5√3-2√3+√3=4√3이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_calc"]}, {"no": 2, "pt": 2, "dom": "alg", "unit": "다항식의 계산과 곱셈공식", "text": "다항식 (3x-2)²-(3x+1)(3x-1)을 간단히 하였을 때, x의 계수는?", "fig": null, "ch": ["−12", "−6", "6", "12", "13"], "ans": 1, "sol": ["[출제의도] 곱셈공식을 이용하여 다항식을 계산한다.", "(3x-2)²=9x²-12x+4, (3x+1)(3x-1)=9x²-1이므로 차는 -12x+5이다. 따라서 x의 계수는 -12이다."], "box": null, "tail": null, "table": null, "con": ["poly_ops", "mult_formula"]}, {"no": 3, "pt": 2, "dom": "geo", "unit": "삼각비", "text": "그림과 같이 ∠ C=90°인 직각삼각형 ABC에서 AB=13, BC=5일 때, sin A의 값은?", "fig": "m3_r3_q03", "ch": ["5/13", "12/13", "5/12", "12/5", "13/5"], "ans": 1, "sol": ["[출제의도] 직각삼각형에서 삼각비의 값을 구한다.", "sin A=BC/AB=5/13이다."], "box": null, "tail": null, "table": null, "con": ["tri_ratio"]}, {"no": 4, "pt": 3, "dom": "fun", "unit": "일차함수의 식", "text": "두 점 (-1, 5), (2, -1)을 지나는 직선을 그래프로 하는 일차함수의 식을 y=ax+b라 할 때, a+b의 값은?", "fig": null, "ch": ["−1", "0", "1", "2", "3"], "ans": 3, "sol": ["[출제의도] 두 점을 지나는 직선의 식을 구한다.", "기울기는 (-1-5)/(2-(-1))=-2이다. y=-2x+b에 (2, -1)을 대입하면 b=3이다. 따라서 a+b=1이다."], "box": null, "tail": null, "table": null, "con": ["lf"]}, {"no": 5, "pt": 3, "dom": "sta", "unit": "대푯값", "text": "5개의 변량 3, 5, x, 9, 11의 중앙값이 7일 때, 평균은?", "fig": null, "ch": ["5", "6", "7", "8", "9"], "ans": 3, "sol": ["[출제의도] 중앙값과 평균을 구한다.", "변량을 작은 값부터 나열하면 3, 5, x, 9, 11이고 중앙값은 가운데 값이므로 x=7이다. 평균은 (3+5+7+9+11)/5=7이다."], "box": null, "tail": null, "table": null, "con": ["cen"]}, {"no": 6, "pt": 3, "dom": "alg", "unit": "연립일차방정식", "text": "연립방정식 3x+2y=13, x-y=1의 해가 x=a, y=b일 때, ab의 값은?", "fig": null, "ch": ["4", "5", "6", "7", "8"], "ans": 3, "sol": ["[출제의도] 연립일차방정식의 해를 구한다.", "x=y+1을 3x+2y=13에 대입하면 5y+3=13이므로 y=2, x=3이다. 따라서 ab=6이다."], "box": null, "tail": null, "table": null, "con": ["simul"]}, {"no": 7, "pt": 3, "dom": "geo", "unit": "구의 부피와 겉넓이", "text": "부피가 36π인 구의 겉넓이는?", "fig": null, "ch": ["12π", "18π", "27π", "36π", "48π"], "ans": 4, "sol": ["[출제의도] 구의 부피와 겉넓이를 구한다.", "반지름을 r라 하면 4/3π r³=36π에서 r³=27이므로 r=3이다. 겉넓이는 4π×3²=36π이다."], "box": null, "tail": null, "table": null, "con": ["solid"]}, {"no": 8, "pt": 3, "dom": "geo", "unit": "삼각형의 외심", "text": "그림과 같이 삼각형 ABC의 외심을 O라 하자. ∠ A=62°일 때, ∠ BOC의 크기는?", "fig": "m3_r3_q08", "ch": ["112°", "118°", "124°", "128°", "132°"], "ans": 3, "sol": ["[출제의도] 삼각형의 외심의 성질을 이용하여 각의 크기를 구한다.", "외심에서 한 변을 바라보는 중심각의 크기는 원주각의 2배이므로 ∠ BOC=2∠ A=124°이다."], "box": null, "tail": null, "table": null, "con": ["tri_center"]}, {"no": 9, "pt": 3, "dom": "fun", "unit": "이차함수의 최댓값", "text": "이차함수 y=-x²+4x+k의 최댓값이 9일 때, 상수 k의 값은?", "fig": null, "ch": ["1", "2", "3", "4", "5"], "ans": 5, "sol": ["[출제의도] 이차함수를 표준형으로 고쳐 최댓값을 구한다.", "y=-(x-2)²+4+k이므로 최댓값은 4+k이다. 4+k=9이므로 k=5이다."], "box": null, "tail": null, "table": null, "con": ["qf", "qf_max"]}, {"no": 10, "pt": 3, "dom": "alg", "unit": "이차방정식", "text": "이차방정식 3x²+x-2=0의 두 근 중 양수인 근은?", "fig": null, "ch": ["1/3", "1/2", "2/3", "1", "3/2"], "ans": 3, "sol": ["[출제의도] 인수분해로 이차방정식의 해를 구한다.", "3x²+x-2=(3x-2)(x+1)=0이므로 x=2/3 또는 x=-1이다. 양수인 근은 2/3이다."], "box": null, "tail": null, "table": null, "con": ["quad_eq"]}, {"no": 11, "pt": 3, "dom": "geo", "unit": "원주각과 중심각", "text": "원 O 위의 서로 다른 세 점 A, B, C에 대하여 점 C를 포함하지 않는 호 AB의 중심각의 크기가 110°일 때, ∠ ACB의 크기는?", "fig": null, "ch": ["45°", "50°", "55°", "60°", "110°"], "ans": 3, "sol": ["[출제의도] 한 호에 대한 원주각과 중심각의 관계를 이해한다.", "원주각의 크기는 같은 호에 대한 중심각의 크기의 1/2이므로 ∠ ACB=55°이다."], "box": null, "tail": null, "table": null, "con": ["circle_angle"]}, {"no": 12, "pt": 3, "dom": "alg", "unit": "일차부등식", "text": "일차부등식 3x-a>x+4의 해가 x>3일 때, 상수 a의 값은?", "fig": null, "ch": ["0", "1", "2", "3", "4"], "ans": 3, "sol": ["[출제의도] 일차부등식의 해를 이용하여 미지수의 값을 구한다.", "2x>a+4에서 x>(a+4)/2이다. (a+4)/2=3이므로 a=2이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 13, "pt": 3, "dom": "sta", "unit": "경우의 수와 확률", "text": "서로 다른 두 개의 주사위를 동시에 던질 때, 나오는 두 눈의 수의 합이 8 이상일 확률은?", "fig": null, "ch": ["1/3", "5/12", "4/9", "1/2", "7/12"], "ans": 2, "sol": ["[출제의도] 경우의 수를 구하여 확률을 구한다.", "합이 8, 9, 10, 11, 12인 경우는 각각 5, 4, 3, 2, 1가지이므로 모두 15가지이다. 구하는 확률은 15/36=5/12이다."], "box": null, "tail": null, "table": null, "con": ["prob", "counting"]}, {"no": 14, "pt": 4, "dom": "fun", "unit": "이차함수와 직선의 교점", "text": "그림과 같이 이차함수 y=-x²+4x의 그래프가 x축과 원점 O가 아닌 점 A에서 만나고, 직선 y=x와 원점 O가 아닌 점 B에서 만난다. 삼각형 OAB의 넓이는?", "fig": "m3_r3_q14", "ch": ["4", "5", "6", "7", "8"], "ans": 3, "sol": ["[출제의도] 이차함수의 그래프와 직선의 교점을 이용하여 도형의 넓이를 구한다.", "-x²+4x=0에서 x=0 또는 x=4이므로 A(4, 0)이다. -x²+4x=x에서 x=0 또는 x=3이므로 B(3, 3)이다. 삼각형 OAB의 넓이는 1/2×4×3=6이다."], "box": null, "tail": null, "table": null, "con": ["qf", "lf_eq", "coord_area"]}, {"no": 15, "pt": 4, "dom": "geo", "unit": "삼각형의 닮음", "text": "그림과 같이 삼각형 ABC의 변 AB, AC 위의 점 D, E에 대하여 ∠ ADE=∠ ACB이다. AD=3, DB=5, AC=6일 때, 선분 CE의 길이는?", "fig": "m3_r3_q15", "ch": ["1", "2", "3", "4", "5"], "ans": 2, "sol": ["[출제의도] 두 삼각형의 닮음을 이용하여 선분의 길이를 구한다.", "삼각형 ADE와 삼각형 ACB에서 ∠ A는 공통이고 ∠ ADE=∠ ACB이므로 닮음이다. AD:AC=AE:AB에서 3:6=AE:8이므로 AE=4이다. 따라서 CE=6-4=2이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 16, "pt": 4, "dom": "alg", "unit": "일차부등식의 활용", "text": "한 개에 1500원인 과자 4개와 한 개에 800원인 사탕을 합하여 15000원 이하가 되도록 사려고 한다. 사탕을 최대 몇 개까지 살 수 있는가?", "fig": null, "ch": ["9", "10", "11", "12", "13"], "ans": 3, "sol": ["[출제의도] 일차부등식을 활용하여 문제를 해결한다.", "사탕을 x개 산다고 하면 1500×4+800x≤ 15000이다. 800x≤ 9000에서 x≤ 11.25이므로 최대 11개이다."], "box": null, "tail": null, "table": null, "con": ["lin_ineq"]}, {"no": 17, "pt": 4, "dom": "geo", "unit": "닮음의 활용(평행선과 넓이)", "text": "삼각형 ABC의 변 AB, AC 위의 점 D, E에 대하여 DE//BC이고 AD:DB=2:3이다. 삼각형 ADE의 넓이가 8일 때, 사각형 DBCE의 넓이는?", "fig": null, "ch": ["32", "36", "40", "42", "48"], "ans": 4, "sol": ["[출제의도] 닮은 도형의 넓이의 비를 이용하여 넓이를 구한다.", "AD:AB=2:5이므로 삼각형 ADE와 삼각형 ABC의 닮음비는 2:5이고 넓이의 비는 4:25이다. 삼각형 ABC의 넓이는 8×25/4=50이므로 사각형 DBCE의 넓이는 50-8=42이다."], "box": null, "tail": null, "table": null, "con": ["sim", "tri_prop"]}, {"no": 18, "pt": 4, "dom": "fun", "unit": "이차함수와 도형의 넓이", "text": "그림과 같이 이차함수 y=-x²+2x+8의 그래프가 x축과 만나는 두 점을 A, B, y축과 만나는 점을 C, 꼭짓점을 V라 하자. 삼각형 ABV의 넓이와 삼각형 ABC의 넓이의 차는? (단, 점 A의 x좌표는 점 B의 x좌표보다 작다.)", "fig": "m3_r3_q18", "ch": ["1", "2", "3", "4", "5"], "ans": 3, "sol": ["[출제의도] 이차함수의 그래프의 점의 좌표를 이용하여 도형의 넓이를 구한다.", "-x²+2x+8=-(x+2)(x-4)이므로 A(-2, 0), B(4, 0), C(0, 8)이다. y=-(x-1)²+9이므로 V(1, 9)이다. 삼각형 ABV의 넓이는 1/2×6×9=27, 삼각형 ABC의 넓이는 1/2×6×8=24이다. 차는 3이다."], "box": null, "tail": null, "table": null, "con": ["qf", "coord_area"]}, {"no": 19, "pt": 4, "dom": "geo", "unit": "원의 접선", "text": "원 O 밖의 점 P에서 원에 그은 두 접선의 접점을 각각 A, B라 하자. ∠ APB=64°일 때, ∠ OAB의 크기는?", "fig": null, "ch": ["28°", "30°", "32°", "34°", "36°"], "ans": 3, "sol": ["[출제의도] 원의 접선의 성질을 이용하여 각의 크기를 구한다.", "PA=PB이므로 ∠ PAB=(180°-64°)/2=58°이다. ∠ OAP=90°이므로 ∠ OAB=90°-58°=32°이다."], "box": null, "tail": null, "table": null, "con": ["circle_tan", "circle_angle"]}, {"no": 20, "pt": 4, "dom": "geo", "unit": "정삼각형의 외접원과 내접원", "text": "한 변의 길이가 6인 정삼각형의 외접원의 넓이와 내접원의 넓이의 합은?", "fig": null, "ch": ["12π", "13π", "14π", "15π", "16π"], "ans": 4, "sol": ["[출제의도] 정삼각형의 외심과 내심의 성질을 이용한다.", "정삼각형의 높이는 3√3이다. 외심과 내심은 무게중심과 일치하므로 외접원의 반지름은 2/3×3√3=2√3, 내접원의 반지름은 1/3×3√3=√3이다. 넓이의 합은 12π+3π=15π이다."], "box": null, "tail": null, "table": null, "con": ["tri_center", "pyth"]}, {"no": 21, "pt": 4, "dom": "geo", "unit": "직각삼각형의 닮음과 피타고라스 정리", "text": "그림과 같이 ∠ A=90°인 직각삼각형 ABC에서 AB=6, AC=8이다. 꼭짓점 A에서 변 BC에 내린 수선의 발을 H라 할 때, AH의 길이는?", "fig": "m3_r3_q21", "ch": ["4", "24/5", "5", "28/5", "6"], "ans": 2, "sol": ["[출제의도] 직각삼각형의 넓이를 이용하여 높이를 구한다.", "BC=√(6²+8²)=10이다. 삼각형 ABC의 넓이는 1/2×6×8=24이고 1/2×10×AH=24이므로 AH=24/5이다."], "box": null, "tail": null, "table": null, "con": ["pyth", "sim"]}, {"no": 22, "pt": 3, "dom": "num", "unit": "소인수분해와 약수의 개수", "text": "450의 약수의 개수를 구하시오.", "fig": null, "ch": null, "ans": 18, "sol": ["[출제의도] 소인수분해를 이용하여 약수의 개수를 구한다.", "450=2×3²×5²이므로 약수의 개수는 (1+1)(2+1)(2+1)=18이다."], "box": null, "tail": null, "table": null, "con": ["pf"]}, {"no": 23, "pt": 3, "dom": "fun", "unit": "이차함수의 그래프와 x축", "text": "이차함수 y=-(x-2)²+9의 그래프가 x축과 만나는 두 점 사이의 거리를 구하시오.", "fig": null, "ch": null, "ans": 6, "sol": ["[출제의도] 이차함수의 그래프가 x축과 만나는 점을 구한다.", "-(x-2)²+9=0에서 (x-2)²=9이므로 x=5 또는 x=-1이다. 두 점 사이의 거리는 6이다."], "box": null, "tail": null, "table": null, "con": ["qf"]}, {"no": 24, "pt": 3, "dom": "num", "unit": "유한소수가 되는 조건", "text": "분수 a/84가 유한소수로 나타내어지는 두 자리 자연수 a의 값을 모두 더한 값을 구하시오.", "fig": null, "ch": null, "ans": 210, "sol": ["[출제의도] 유한소수가 되는 조건을 이용한다.", "84=2²×3×7이므로 a는 21의 배수이어야 한다. 두 자리 자연수는 21, 42, 63, 84이므로 합은 210이다."], "box": null, "tail": null, "table": null, "con": ["rat_dec", "pf"]}, {"no": 25, "pt": 3, "dom": "sta", "unit": "경우의 수", "text": "0, 1, 2, 3, 4가 하나씩 적힌 5장의 카드에서 서로 다른 3장을 뽑아 만들 수 있는 세 자리 짝수의 개수를 구하시오.", "fig": null, "ch": null, "ans": 30, "sol": ["[출제의도] 조건에 맞는 경우의 수를 구한다.", "일의 자리가 0이면 4×3=12가지이다. 일의 자리가 2 또는 4이면 백의 자리는 0과 일의 자리 수를 제외한 3가지, 십의 자리는 남은 3가지이므로 2×3×3=18가지이다. 따라서 12+18=30이다."], "box": null, "tail": null, "table": null, "con": ["counting"]}, {"no": 26, "pt": 4, "dom": "sta", "unit": "평균과 분산", "text": "5개의 변량 2, 4, 8, x, y의 평균이 6이고 분산이 8일 때, xy의 값을 구하시오. (단, x<y)", "fig": null, "ch": null, "ans": 60, "sol": ["[출제의도] 평균과 분산을 이용하여 미지수의 값을 구한다.", "평균이 6이므로 x+y=16이다. 편차의 제곱의 합은 16+4+4+(x-6)²+(y-6)²=40이므로 (x-6)²+(y-6)²=16이다. a=x-6, b=y-6이라 하면 a+b=4, a²+b²=16이므로 ab=0이다. x<y이므로 a=0, b=4, 즉 x=6, y=10이다. 따라서 xy=60이다."], "box": null, "tail": null, "table": null, "con": ["disp", "cen"]}, {"no": 27, "pt": 4, "dom": "num", "unit": "제곱근이 자연수가 되는 조건", "text": "두 자리 자연수 n 중에서 √18n이 자연수가 되는 모든 n의 값의 합을 구하시오.", "fig": null, "ch": null, "ans": 270, "sol": ["[출제의도] 제곱근이 자연수가 되는 조건을 이용한다.", "18=2×3²이므로 n=2×k² 꼴이어야 한다. 두 자리 자연수는 18, 32, 50, 72, 98이므로 합은 270이다."], "box": null, "tail": null, "table": null, "con": ["sqrt_nat", "pf"]}, {"no": 28, "pt": 4, "dom": "geo", "unit": "닮음과 넓이", "text": "그림과 같이 AD//BC인 사다리꼴 ABCD에서 AD=4, BC=8이고 두 대각선의 교점을 O라 하자. 삼각형 AOD의 넓이가 6일 때, 사다리꼴 ABCD의 넓이를 구하시오.", "fig": "m3_r3_q28", "ch": null, "ans": 54, "sol": ["[출제의도] 닮은 삼각형의 넓이의 비를 이용하여 넓이를 구한다.", "삼각형 AOD와 삼각형 COB의 닮음비는 1:2이므로 넓이의 비는 1:4이고 삼각형 COB의 넓이는 24이다. AO:OC=1:2이므로 삼각형 ABO와 삼각형 DCO의 넓이는 각각 6×2=12이다. 사다리꼴의 넓이는 6+12+12+24=54이다."], "box": null, "tail": null, "table": null, "con": ["sim"]}, {"no": 29, "pt": 4, "dom": "fun", "unit": "이차함수와 도형의 넓이", "text": "그림과 같이 이차함수 y=x²-4x의 그래프와 직선 y=2x가 원점 O와 점 A에서 만난다. 이 그래프의 꼭짓점을 V라 할 때, 삼각형 OAV의 넓이를 구하시오.", "fig": "m3_r3_q29", "ch": null, "ans": 24, "sol": ["[출제의도] 이차함수의 그래프와 직선의 교점을 이용하여 삼각형의 넓이를 구한다.", "x²-4x=2x에서 x=0 또는 x=6이므로 A(6, 12)이다. y=(x-2)²-4이므로 V(2, -4)이다. 직선 OA 위에서 x=2인 점 P(2, 4)를 잡으면 PV=8이고, 삼각형 OAV의 넓이는 삼각형 OPV와 삼각형 PAV의 넓이의 합이므로 1/2×8×2+1/2×8×4=24이다."], "box": null, "tail": null, "table": null, "con": ["qf", "lf_eq", "coord_area"]}, {"no": 30, "pt": 4, "dom": "geo", "unit": "원의 현", "text": "반지름의 길이가 13인 원 O의 평행한 두 현 AB, CD의 길이가 각각 24, 10이다. 두 현 사이의 거리가 될 수 있는 모든 값의 곱을 구하시오.", "fig": null, "ch": null, "ans": 119, "sol": ["[출제의도] 원의 중심에서 현에 내린 수선의 성질을 이용한다.", "중심에서 현 AB까지의 거리는 √(13²-12²)=5, 현 CD까지의 거리는 √(13²-5²)=12이다. 두 현이 중심에 대하여 같은 쪽에 있으면 거리는 12-5=7, 반대쪽에 있으면 12+5=17이다. 곱은 7×17=119이다."], "box": null, "tail": null, "table": null, "con": ["circle_chord", "pyth"]}]}], "FIG": {"p_f23": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZYAAAGoCAAAAABA45yXAAAdXElEQVR42u2deXxU5b2Hn5nsJEOACbLFsolgEaTKIhD2VRQEFSxqwaV+pNVisWqr4kKv3rbW9l61ilrB3SsoKlsgCAQIiyiCgAiyS2UJJCxZWJLMvPePLEySmTPbOWfO8n7/YWbOMifz8FvPe97XIZAynpzyJ5BYpCQWiUVKYpFYpCQWKYlFYpGSWCQWKYlFYpGSWKQkFolFSmKRWKQkFolFSmKRklgkFimJRWKRklgiUKdOVsMSb4U/olBai5TEIrFISSxSEovEIiWxSCxSEouUxCKxSEksEouUxCKxSEksUhKLxCKFbW8a11NFrT9OeADiHNJaYqufEir1beXbvyUkJCQkvCKtJcZq/HLFIxX8NTWz8u3wtG3/ntx9gJn+AocVpnlryom6H41exOy7at7d/cHhDBnyDaC7YVbNm5K5YzJkJmYE3dCUdT9Uv5lTeo9MkA2hhDtgdvWb2ZnDJRZj6B54typP/mH9nU6JxRjq3INj2ZUvZznuklW+gYJ+p const PRM={};SITE.PR.forEach(p=>PRM[p.id]=p);
const BRM={};SITE.E.forEach(e=>e.br.forEach(b=>BRM[b.id]=b));
const MKM={};SITE.MK.forEach(m=>MKM['M-'+m.no]=m);
let ST={};try{ST=JSON.parse(localStorage.getItem('st')||'{}')}catch(e){}
function saveST(){try{localStorage.setItem('st',JSON.stringify(ST))}catch(e){}}
function rec(id,ok,con){if(window.onRec)onRec(id);const s=ST[id]||{n:0,w:0,ok:0,con:con};s.n++;if(!ok)s.w++;s.ok=ok?1:0;s.con=con;ST[id]=s;saveST()}
const CIR='①②③④⑤';
function br(s){return esc(s).replace(/\n/g,'<br>')}
function findP(id){return PRM[id]||BRM[id]}
function chipsFor(ids){return ids&&ids.length?`<div class="yl">${ids.map(c=>`<button class="nb" onclick="showCon('${c}')">${CON[c].n}</button>`).join('')}</div>`:''}
function probCard(p,ctx){
 const prev=ST[p.id];
 return `<div class="pc" id="pc-${ctx}-${p.id}"><div class="ph"><span class="lv">${p.lv}</span>${prev?`<span class="pv2 ${prev.ok?'g':'r'}">지난 결과: ${prev.ok?'맞힘':'틀림'} (${prev.n}회 풀이)</span>`:''}</div><div class="pq">${br(p.text)}</div>${p.fig?`<img class="pf" src="${SITE.FIG[p.fig]}" alt="문제 그림">`:''}<div class="chs">${p.ch.map((c,i)=>`<button class="cb" onclick="pick('${p.id}',${i+1},'${ctx}')">${CIR[i]} ${esc(c)}</button>`).join('')}</div><div class="fb" id="fb-${ctx}-${p.id}"></div></div>`}
function pick(id,k,ctx){const p=findP(id);const card=document.getElementById('pc-'+ctx+'-'+id);if(card.dataset.done)return;card.dataset.done='1';
 const ok=k===p.ans;[...card.querySelectorAll('.cb')].forEach((b,i)=>{b.disabled=true;if(i+1===p.ans)b.classList.add('ok');else if(i+1===k)b.classList.add('no')});
 rec(id,ok,p.con||[]);
 document.getElementById('fb-'+ctx+'-'+id).innerHTML=`<div class="${ok?'fok':'fno'}"><b>${ok?'정답입니다.':'오답입니다.'}</b> 정답은 ${CIR[p.ans-1]} ${esc(p.ch[p.ans-1])}입니다.</div><div class="sol">${br(p.sol)}</div>${p.con&&p.con.length?'<div class="note">이 문제에 쓰인 개념</div>'+chipsFor(p.con):''}<button class="nb" onclick="redo('${id}','${ctx}')">다시 풀기</button>`}
function redo(id,ctx){const card=document.getElementById('pc-'+ctx+'-'+id);card.outerHTML=probCard(findP(id),ctx)}
function typeBlocks(did,ctx){ctx=ctx||'t';const d=D.find(x=>x.id===did);return d.types.map((t,i)=>{const ps=SITE.PR.filter(p=>p.dom===did&&p.ti===i);return `<div class="type"><b>${t.n}</b><details><summary>연습 문제 ${ps.length}개 풀어 보기 (기본 · 기출 수준 · 응용)</summary>${ps.map(p=>probCard(p,ctx)).join('')}</details></div>`}).join('')}
/* 약점 진단 */
let resetArm=false;
function renderDiag(){

 if(!cons.length)return `<p class="note">이 문제에 연결된 개념이 없습니다.</p>${lv>=3?`<div class="sol">${br(p.sol)}</div>`:''}`;
 let h=`<div class="note">1단계 · 이 문제에 쓰이는 개념</div><div class="yl">${cons.map(c=>`<span class="pill">${esc(CON[c].n)}</span>`).join(' ')}</div>`;
 if(lv>=2)h+=`<div class="note" style="margin-top:10px">2단계 · 공식과 접근법</div>${cons.map(c=>`<div class="cc"><b>${esc(CON[c].n)}</b><ul class="cl">${CON[c].p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="tp"><b>문제를 만나면</b> ${esc(CON[c].t)}</div></div>`).join('')}`;
 if(lv>=3)h+=`<div class="note" style="margin-top:10px">3단계 · 해설</div><div class="sol">${br(p.sol)}</div>`;
 return h}
function hint(id,ctx){const lv=Math.min(3,(HL[id]||0)+1);HL[id]=lv;const nxt=lv<3?`<button class="nb hi" onclick="hint('${id}','${ctx}')">다음 힌트 (${lv+1}단계)</button>`:'<span class="note">마지막 단계입니다.</span>';
 const html=`<div class="hh"><b>힌트</b> <span class="gr">${lv} / 3단계</span></div>${hintHTML(id,lv)}<div style="margin-top:10px">${nxt}</div>`;
 if(WIDE.matches||TEACH){openPanel(html,'힌트')}else{document.getElementById('hb-'+ctx+'-'+id).innerHTML=`<div class="hub">${html}</div>`}}
function probCard(p,ctx){
 const prev=ST[p.id];const tn=(p.dom&&p.ti!==undefined)?D.find(x=>x.id===p.dom).types[p.ti].n:'';
 return `<div class="pc" id="pc-${ctx}-${p.id}"><div class="ph"><span class="lv">${p.lv}</span>${tn?`<span class="tyn">${esc(tn)}</span>`:''}${prev?`<span class="pv2 ${prev.ok?'g':'r'}">지난 결과: ${prev.ok?'맞힘':'틀림'}</span>`:''}</div><div class="pq">${br(p.text)}</div>${p.fig?`<img class="pf" src="${SITE.FIG[p.fig]}" alt="문제 그림">`:''}<div class="chs">${p.ch.map((c,i)=>`<button class="cb" onclick="pick('${p.id}',${i+1},'${ctx}')">${CIR[i]} ${esc(c)}</button>`).join('')}</div><div style="margin-top:8px"><button class="nb" onclick="hint('${p.id}','${ctx}')">힌트 보기</button></div><div id="hb-${ctx}-${p.id}"></div><div class="fb" id="fb-${ctx}-${p.id}"></div></div>`}
/* 오답 복습 */
function reviewHTML(id){const p=findP(id);const cons=p.con||[];
 const easy=SITE.PR.filter(q=>q.id!==id&&q.con.some(c=>cons.includes(c))&&(q.lv==='기본'||q.lv==='기출 수준')).slice(0,4).map(q=>q.id);
 const seen={};const items=[];cons.forEach(c=>conItems(c).forEach(e=>{const k=e[0]+'-'+e[1];if(!seen[k]&&items.length<10){seen[k]=1;items.push(e)}}));
 return `<div class="fno" style="margin-bottom:6px"><b>틀린 문제의 개념을 복습해 보세요.</b></div>${cons.map(conCard).join('')}${easy.length?`<h4 class="dh" style="border-left:5px solid var(--ink)">같은 개념의 문제 다시 풀기</h4>${plInit('rv'+id,easy)}`:''}${items.length?`<h4 class="dh" style="border-left:5px solid var(--ink)">같은 개념이 나온 기출</h4><div class="yl">${items.map(e=>`<button class="nb${e[5]===4?' hi':''}" onclick="openItem(${e[0]},${e[1]})">${e[0]} ${e[1]}번</button>`).join('')}</div>`:''}`}
function openReview(id){openPanel(reviewHTML(id),'오답 복습')}
function pick(id,k,ctx){const p=findP(id);const card=document.getElementById('pc-'+ctx+'-'+id);if(card.dataset.done)return;card.dataset.done='1';
 const ok=k===p.ans;[...card.querySelectorAll('.cb')].forEach((b,i)=>{b.disabled=true;if(i+1===p.ans)b.classList.add('ok');else if(i+1===k)b.classList.add('no')});
 rec(id,ok,p.con||[]);const s=PLS[ctx];const nx=s&&s.i<s.list.length-1?`<button class="nb hi" onclick="plGo('${ctx}',1)">다음 문제 →</button>`:'';
 const rv=ok?'':`<button class="nb hi" onclick="openReview('${id}')">오답 복습 창 열기</button>`;
 document.getElementById('fb-'+ctx+'-'+id).innerHTML=`<div class="${ok?'fok':'fno'}"><b>${ok?'정답입니다.':'오답입니다.'}</b> 정답은 ${CIR[p.ans-1]} ${esc(p.ch[p.ans-1])}입니다.</div><div class="sol">${br(p.sol)}</div><button class="nb solbtn" onclick="toggleSol(this)">해설 펼치기/접기</button>${p.con&&p.con.length?'<div class="note">이 문제에 쓰인 개념</div>'+chipsFor(p.con):''}<div style="margin-top:6px">${nx} ${rv} <button class="nb" onclick="redo('${id}','${ctx}')">다시 풀기</button></div>`;
 if(!ok&&(WIDE.matches||TEACH)&&!TEACH)openReview(id)}
function redo(id,ctx){HL[id]=0;const card=document.getElementById('pc-'+ctx+'-'+id);card.outerHTML=probCard(findP(id),ctx)}
/* 약점 복습 코스 */
function crsTog(id,i,v){const s=CRS[id]||[0,0,0];s[i]=v?1:0;CRS[id]=s;saveLS('crs',CRS)}
function conBody(id){const c=CON[id];return `<ul class="cl">${c.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="tp"><b>문제를 만나면</b> ${esc(c.t)}</div>`}
function showCourse(id){const c=CON[id];const st=CRS[id]||[0,0,0];
 const ps=SITE.PR.filter(q=>q.con.includes(id)).slice(0,3).map(q=>q.id);const items=conItems(id).slice(0,8);
 const html=`<div class="hh"><b>${esc(c.n)}</b> 복습 코스 <span class="gr">${c.g}</span></div>
 <div class="step3"><label class="ci"><input type="checkbox" ${st[0]?'checked':''} onchange="crsTog('${id}',0,this.checked)"><b>1단계 · 개념 읽기</b></label>${conBody(id)}<div class="yl"><button class="nb" onclick="showCon('${id}')">개념 창으로 자세히 보기</button></div></div>
 <div class="step3"><label class="ci"><input type="checkbox" ${st[1]?'checked':''} onchange="crsTog('${id}',1,this.checked)"><b>2단계 · 연습 문제 풀기</b></label>${ps.length?plInit('cr'+id,ps):'<p class="note">이 개념의 연습 문제가 아직 없습니다.</p>'}</div>
 <div class="step3"><label class="ci"><input type="checkbox" ${st[2]?'checked':''} onchange="crsTog('${id}',2,this.checked)"><b>3단계 · 기출 번호 확인</b></label>${items.length?`<div class="yl">${items.map(e=>`<button class="nb${e[5]===4?' hi':''}" onclick="openItem(${e[0]},${e[1]})">${e[0]} ${e[1]}번</button>`).join('')}</div>`:'<p class="note">연결된 기출이 없습니다.</p>'}</div>`;
 openPanel(html,'복습 코스')}

const P={"G2-4": {"id": "G2-4", "lv": "심화", "text": "∠C=90°, AC=6, BC=8인 직각삼각형 ABC의 내접원의 중심을 I라 할 때, 삼각형 IAB의 넓이는?", "ch": ["8", "9", "11", "10", "12"], "ans": 4, "sol": "AB=10이고 내접원의 반지름은 (6+8−10)/2=2이다. 삼각형 IAB의 밑변은 AB, 높이는 내접원의 반지름이므로 넓이는 ½×10×2=10이다.", "con": ["pyth", "tri_center"]}, "F3-1": {"id": "F3-1", "lv": "기본", "text": "일차함수 y=2x+4의 그래프와 x축, y축으로 둘러싸인 삼각형의 넓이는?", "ch": ["4", "2", "3", "5", "6"], "ans": 1, "sol": "x절편은 −2, y절편은 4이므로 넓이는 ½×2×4=4이다.", "con": ["lf", "coord_area"]}, "F1-3": {"id": "F1-3", "lv": "응용", "text": "이차함수 y=x²+ax+b의 그래프의 꼭짓점의 좌표가 (2, −3)일 때, a+b의 값은?", "ch": ["-3", "-5", "-4", "-2", "-1"], "ans": 1, "sol": "y=(x−2)²−3=x²−4x+1이므로 a=−4, b=1이다. 따라서 a+b=−3이다.", "con": ["qf"]}, "N1-4": {"id": "N1-4", "lv": "심화", "text": "(√7+√3)/(√7−√3) + (√7−√3)/(√7+√3)의 값은?", "ch": ["3", "4", "6", "7", "5"], "ans": 5, "sol": "통분하면 ((√7+√3)²+(√7−√3)²) / ((√7)²−(√3)²) = 2×(7+3)/4 = 5이다.", "con": ["sqrt_calc", "mult_formula"]}, "F4-1": {"id": "F4-1", "lv": "기본", "text": "이차함수 y=x²의 그래프를 x축의 방향으로 2만큼, y축의 방향으로 −3만큼 평행이동한 그래프가 점 (4, k)를 지날 때, k의 값은?", "ch": ["-1", "1", "0", "2", "3"], "ans": 2, "sol": "평행이동한 그래프의 식은 y=(x−2)²−3이다. x=4를 대입하면 k=4−3=1이다.", "con": ["qf"]}, "S1-1": {"id": "S1-1", "lv": "기본", "text": "서로 다른 두 주사위를 던져 나온 눈의 수의 합이 7일 확률은?", "ch": ["1/9", "1/6", "5/36", "1/4", "1/3"], "ans": 2, "sol": "합이 7인 경우는 (1,6), (2,5), (3,4), (4,3), (5,2), (6,1)의 6가지이고, 모든 경우의 수는 36이다. 확률은 6/36=1/6이다.", "con": ["counting", "prob"]}, "S2-3": {"id": "S2-3", "lv": "응용", "text": "당첨 제비 2개를 포함한 5개의 제비가 있다. 꺼낸 제비를 다시 넣지 않고 2개를 연속하여 뽑을 때, 적어도 한 개가 당첨 제비일 확률은?", "ch": ["3/5", "13/20", "4/5", "9/10", "7/10"], "ans": 5, "sol": "두 개 모두 당첨 제비가 아닐 확률은 3/5×2/4=3/10이다. 구하는 확률은 1−3/10=7/10이다.", "con": ["prob", "counting"]}, "G1-2": {"id": "G1-2", "lv": "기출 수준", "text": "∠B=90°, AB=6, AC=10인 직각삼각형 ABC에서 sin A+cos A의 값은?", "ch": ["7/5", "6/5", "8/5", "9/5", "2"], "ans": 1, "sol": "BC=√(10²−6²)=8이다. sin A=8/10, cos A=6/10이므로 합은 14/10=7/5이다.", "con": ["tri_ratio", "pyth"]}, "N1-1": {"id": "N1-1", "lv": "기본", "text": "(√3+√2)/(√3−√2)를 간단히 하면?", "ch": ["1", "5+2√6", "5", "5−2√6", "6+2√6"], "ans": 2, "sol": "분모와 분자에 (√3+√2)를 곱하면 (√3+√2)² / ((√3)²−(√2)²) = (5+2√6)/1 = 5+2√6이다.", "con": ["sqrt_calc"]}, "S3-2": {"id": "S3-2", "lv": "기출 수준", "text": "남학생 3명과 여학생 2명을 한 줄로 세울 때, 여학생 2명이 이웃하게 서는 경우의 수는?", "ch": ["24", "36", "60", "72", "48"], "ans": 5, "sol": "여학생 2명을 한 묶음으로 보면 4개를 한 줄로 세우는 경우가 4×3×2×1=24가지이다. 묶음 안에서 여학생 2명이 서는 방법이 2가지이므로 24×2=48이다.", "con": ["counting"]}, "A3-3": {"id": "A3-3", "lv": "응용", "text": "두 이차방정식 x²−x−6=0, x²+ax+6=0이 공통인 근을 가질 때, 양수 a의 값은?", "ch": ["2", "3", "5", "4", "6"], "ans": 3, "sol": "x²−x−6=(x−3)(x+2)=0에서 x=3 또는 x=−2이다. x=3을 대입하면 9+3a+6=0, a=−5이고, x=−2를 대입하면 4−2a+6=0, a=5이다. 양수 a는 5이다.", "con": ["quad_eq"]}, "S3-1": {"id": "S3-1", "lv": "기본", "text": "5명의 학생 중에서 회장 1명, 부회장 1명을 뽑는 경우의 수는?", "ch": ["10", "15", "25", "20", "30"], "ans": 4, "sol": "회장을 뽑는 경우가 5가지, 부회장을 뽑는 경우가 4가지이므로 5×4=20이다.", "con": ["counting"]}, "S4-4": {"id": "S4-4", "lv": "심화", "text": "3개의 변량 a, b, c의 평균이 5이고 분산이 2일 때, a²+b²+c²의 값은?", "ch": ["75", "78", "81", "84", "87"], "ans": 3, "sol": "분산은 (변량의 제곱의 평균)−(평균)²이므로 (a²+b²+c²)/3−25=2이다. 따라서 a²+b²+c²=3×27=81이다.", "con": ["disp"]}, "A2-3": {"id": "A2-3", "lv": "응용", "text": "다항식 x²+ax−12가 (x−3)(x+b)로 인수분해될 때, a+b의 값은?", "ch": ["3", "5", "4", "6", "7"], "ans": 2, "sol": "(x−3)(x+b)=x²+(b−3)x−3b이다. −3b=−12이므로 b=4, a=b−3=1이다. 따라서 a+b=5이다.", "con": ["factor"]}, "N3-3": {"id": "N3-3", "lv": "응용", "text": "두 자리 자연수 n에 대하여 √(18n)이 자연수가 되는 n의 개수는?", "ch": ["5", "3", "4", "6", "7"], "ans": 1, "sol": "18n=2×3²×n이 제곱수이려면 n=2×m² (m은 자연수) 꼴이어야 한다. 두 자리 수는 18, 32, 50, 72, 98로 5개이다.", "con": ["pf", "sqrt_nat"]}, "A2-2": {"id": "A2-2", "lv": "기출 수준", "text": "a=√5+2, b=√5−2일 때, a²+2ab+b²의 값은?", "ch": ["20", "16", "18", "22", "24"], "ans": 1, "sol": "a²+2ab+b²=(a+b)²=(2√5)²=20이다.", "con": ["factor", "sqrt_calc"]}, "F3-2": {"id": "F3-2", "lv": "기출 수준", "text": "일차함수 y=−1/2 x+3의 그래프와 x축, y축으로 둘러싸인 삼각형의 넓이는?", "ch": ["6", "9", "7", "8", "10"], "ans": 2, "sol": "x절편은 6, y절편은 3이므로 넓이는 ½×6×3=9이다.", "con": ["lf", "coord_area"]}, "G1-1": {"id": "G1-1", "lv": "기본", "text": "∠B=90°인 직각삼각형 ABC에서 sin A=3/5일 때, tan A의 값은?", "ch": ["1/2", "3/5", "2/3", "4/5", "3/4"], "ans": 5, "sol": "sin A=3/5이므로 대변을 3, 빗변을 5라 하면 밑변은 √(5²−3²)=4이다. tan A=3/4이다.", "con": ["tri_ratio", "pyth"]}, "A4-1": {"id": "A4-1", "lv": "기본", "text": "연속하는 두 자연수의 곱이 56일 때, 두 수의 합은?", "ch": ["13", "15", "14", "16", "17"], "ans": 2, "sol": "작은 수를 x라 하면 x(x+1)=56, x²+x−56=(x+8)(x−7)=0에서 x=7이다. 두 수는 7, 8이고 합은 15이다.", "con": ["quad_app"]}, "N2-2": {"id": "N2-2", "lv": "기출 수준", "text": "√10의 정수 부분을 a, 소수 부분을 b라 할 때, b(b+6)의 값은?", "ch": ["3", "5", "7", "1", "9"], "ans": 4, "sol": "3<√10<4이므로 a=3, b=√10−3이다. b+3=√10이므로 b(b+6)=b²+6b=(b+3)²−9=10−9=1이다.", "con": ["real_num", "mult_formula"]}, "A1-1": {"id": "A1-1", "lv": "기본", "text": "x+1/x=3일 때, x²+1/x²의 값은?", "ch": ["5", "6", "8", "7", "9"], "ans": 4, "sol": "(x+1/x)²=x²+2+1/x²이므로 9=x²+1/x²+2, 따라서 x²+1/x²=7이다.", "con": ["mult_formula"]}, "G3-3": {"id": "G3-3", "lv": "응용", "text": "닮은 두 입체도형의 겉넓이의 비가 4 : 9이다. 작은 입체도형의 부피가 40일 때, 큰 입체도형의 부피는?", "ch": ["120", "150", "180", "135", "200"], "ans": 4, "sol": "겉넓이의 비가 4 : 9이므로 닮음비는 2 : 3이다. 부피의 비는 2³ : 3³ = 8 : 27이다. 큰 입체도형의 부피는 40×27/8=135이다.", "con": ["sim", "solid"]}, "F2-4": {"id": "F2-4", "lv": "심화", "text": "이차함수 y=x²−2x의 그래프와 직선 y=x+k가 한 점에서만 만날 때, 상수 k의 값은?", "ch": ["−3", "−2", "−9/4", "−3/2", "0"], "ans": 3, "sol": "x²−2x=x+k에서 x²−3x−k=0이다. 한 점에서 만나려면 중근을 가져야 하므로 (−3)²−4×1×(−k)=0, 9+4k=0이다. 따라서 k=−9/4이다.", "con": ["qf", "lf_eq", "quad_eq"]}, "A1-4": {"id": "A1-4", "lv": "심화", "text": "a+b=4, a²+b²=10일 때, a³+b³의 값은?", "ch": ["24", "28", "26", "30", "32"], "ans": 2, "sol": "ab={(a+b)²−(a²+b²)}/2=(16−10)/2=3이다. a³+b³=(a+b)³−3ab(a+b)=64−36=28이다.", "con": ["mult_formula"]}},C={"tri_center": {"n": "삼각형의 외심·내심·무게중심", "g": "중2", "p": ["외심:  세 변의 수직이등분선의 교점이며, 세 꼭짓점까지의 거리가 같다(외접원의 반지름). 직각삼각형의 외심은 빗변의 중점이다.", "내심:  세 내각의 이등분선의 교점이며, 세 변까지의 거리가 같다(내접원의 반지름 r).  삼각형의 넓이 = ½ r (a + b + c).  직각삼각형에서 r = (a + b − c)/2 (c는 빗변)", "무게중심:  세 중선의 교점이며, 중선을 꼭짓점에서 2 : 1로 나눈다. 세 중선은 삼각형의 넓이를 6등분한다.", "∠BOC = 2∠A (O는 외심),  ∠BIC = 90° + ½∠A (I는 내심)"], "t": "외심은 거리가 같다, 내심은 각을 이등분한다, 무게중심은 2 : 1이다 — 세 가지 키워드를 먼저 떠올립니다."}, "rat_dec": {"n": "유한소수와 순환소수", "g": "중2", "p": ["기약분수로 나타낸 분모의 소인수가 2나 5뿐이면 유한소수, 다른 소인수가 있으면 순환소수이다.", "순환소수를 분수로:  x = 0.151515… 이면 100x − x = 15 이므로 x = 15/99 = 5/33", "순환마디의 길이를 알면 소수점 아래 n번째 자리의 수를 찾을 수 있다."], "t": "분수를 기약분수로 만든 뒤 분모를 소인수분해하여 살펴봅니다."}, "coord_area": {"n": "좌표평면 위의 도형의 넓이", "g": "중2", "p": ["좌표축에 평행한 선분의 길이는 두 점의 좌표의 차로 구한다.", "삼각형은 ½ × (밑변) × (높이)로 구하되, 좌표축에 평행한 변을 밑변으로 택하면 쉽다.", "사각형은 삼각형 둘로 나누거나 (큰 도형) − (작은 도형)으로 구한다.", "점의 좌표를 미지수로 놓고 넓이를 식으로 세운 뒤 방정식을 푼다."], "t": "밑변과 높이를 좌표의 차로 표현할 수 있는 삼각형으로 나누어 봅니다."}, "lf_eq": {"n": "일차함수와 일차방정식(교점)", "g": "중2", "p": ["두 직선의 교점의 좌표는 두 직선의 식을 연립한 연립방정식의 해이다.", "직선이 x축과 만나는 점은 y = 0, y축과 만나는 점은 x = 0을 대입하여 구한다.", "직선과 x축, y축으로 둘러싸인 삼각형의 넓이 = ½ × |x절편| × |y절편|"], "t": "교점이 필요하면 두 식을 연립하고, 점이 직선 위에 있으면 좌표를 대입합니다."}, "quad_app": {"n": "이차방정식의 활용", "g": "중3", "p": ["구하려는 값을 x로 놓고 이차방정식을 세운 뒤 인수분해나 근의 공식으로 푼다.", "구한 근 중에서 문제의 조건(자연수, 길이는 양수 등)에 맞는 것만 택한다.", "연속하는 두 자연수는 x, x + 1,  도형의 넓이나 타일 문제는 한 변의 길이를 x로 놓는다."], "t": "구한 근이 모두 문제의 조건에 맞는지 반드시 확인합니다."}, "factor": {"n": "인수분해", "g": "중3", "p": ["공통인수로 묶기:  ma + mb = m(a + b)", "a² + 2ab + b² = (a + b)²,  a² − 2ab + b² = (a − b)²,  a² − b² = (a + b)(a − b)", "x² + (a + b)x + ab = (x + a)(x + b),  acx² + (ad + bc)x + bd = (ax + b)(cx + d)", "인수분해로 계산을 간단히:  26² − 24² = (26 + 24)(26 − 24) = 100"], "t": "식이 복잡하면 먼저 공통인수를 찾고, 이차식이면 곱이 상수항, 합이 x의 계수가 되는 두 수를 찾습니다."}, "tri_ratio": {"n": "삼각비", "g": "중3", "p": ["∠C = 90°인 직각삼각형 ABC에서 ∠A, ∠B, ∠C의 대변의 길이를 각각 a, b, c라 할 때,  sin A = a/c,  cos A = b/c,  tan A = a/b", "특수각의 삼각비:  30°, 45°, 60°에서  sin = 1/2, √2/2, √3/2,  cos = √3/2, √2/2, 1/2,  tan = √3/3, 1, √3", "한 변의 길이와 삼각비의 값을 알면 나머지 변의 길이를 구할 수 있고, 피타고라스 정리와 함께 쓴다.", "직각이 보이지 않을 때는 수선을 그어 직각삼각형을 만든다."], "t": "어느 각을 기준으로 대변, 밑변, 빗변을 잡는지 먼저 표시합니다."}, "pf": {"n": "소인수분해와 약수·배수", "g": "중1", "p": ["소수는 1보다 큰 자연수 중 1과 자기 자신만을 약수로 갖는 수이고, 소인수분해는 자연수를 소수의 곱으로 나타내는 것이다.", "N = pᵃ × qᵇ 이면 약수의 개수는 (a+1)(b+1) 이다.", "최대공약수는 공통인 소인수의 지수 중 작은 것을, 최소공배수는 큰 것을 택하여 곱한다.", "제곱수는 소인수의 지수가 모두 짝수이다."], "t": "문제의 수를 먼저 소인수분해해 두면 약수, 배수, 제곱수 조건이 한꺼번에 보입니다."}, "real_num": {"n": "무리수와 실수의 대소", "g": "중3", "p": ["무리수는 순환하지 않는 무한소수이고, 유리수와 무리수를 합하여 실수라 한다.", "양수 a, b에 대하여 a < b이면 √a < √b 이다. 제곱하거나 어림값을 구하여 크기를 비교한다.", "무리수의 정수 부분과 소수 부분:  (소수 부분) = (그 수) − (정수 부분).  예) √7 = 2.64…이면 소수 부분은 √7 − 2"], "t": "크기를 비교하기 어려우면 각 수를 제곱하거나, 가장 가까운 제곱수 사이에 끼워 봅니다."}, "pyth": {"n": "피타고라스 정리", "g": "중2", "p": ["직각삼각형에서 빗변의 길이를 c, 나머지 두 변의 길이를 a, b라 하면 a² + b² = c²", "자주 나오는 세 수:  3-4-5,  5-12-13,  8-15-17", "직사각형의 대각선, 정사각형의 대각선(한 변이 a이면 √2a), 정삼각형의 높이(한 변이 a이면 (√3/2)a)", "좌표평면 위의 두 점 사이의 거리도 피타고라스 정리로 구한다."], "t": "직각삼각형이 보이지 않으면 수선을 그어 직각삼각형을 만듭니다."}, "cen": {"n": "대푯값(평균·중앙값·최빈값)", "g": "중3", "p": ["평균 = (변량의 총합) / (변량의 개수)", "중앙값:  변량을 크기순으로 나열했을 때 한가운데 값. 변량의 개수가 짝수이면 가운데 두 값의 평균", "최빈값:  도수가 가장 큰 변량 (여러 개일 수도 있다)", "평균, 중앙값, 최빈값이 조건으로 주어지면 미지수를 하나씩 정하여 식을 세운다."], "t": "변량을 크기순으로 나열한 뒤 조건을 하나씩 확인합니다."}, "disp": {"n": "산포도(분산·표준편차)", "g": "중3", "p": ["편차 = (변량) − (평균),  편차의 총합은 항상 0이다.", "분산 = (편차의 제곱의 합) / (변량의 개수),  표준편차 = √(분산)", "표준편차가 클수록 자료가 평균에서 멀리 흩어져 있다.", "각 변량에 같은 수를 곱하면(a배) 분산은 a²배가 된다."], "t": "평균을 먼저 구하고, 편차의 제곱을 표로 정리하여 계산합니다."}, "sqrt_nat": {"n": "제곱근이 자연수가 되는 조건", "g": "중3", "p": ["√(자연수)가 자연수가 되려면 근호 안의 수가 어떤 자연수의 제곱이어야 한다.", "근호 안의 수를 소인수분해했을 때 모든 소인수의 지수가 짝수이면 제곱수이다.  예) 72n = 2³ × 3² × n이 제곱수가 되는 가장 작은 n은 2", "√(a − n)이 자연수이면 a − n이 제곱수이므로, 범위 안의 제곱수를 차례로 대입하여 찾는다."], "t": "소인수분해로 지수가 홀수인 소인수를 찾고, 그것을 한 번 더 곱할 방법을 생각합니다."}, "solid": {"n": "입체도형의 겉넓이와 부피", "g": "중1", "p": ["기둥의 부피 = (밑넓이) × (높이),  뿔의 부피 = ⅓ × (밑넓이) × (높이)", "원기둥의 겉넓이 = 2πr² + 2πrh,  원뿔의 겉넓이 = πr² + πrl (l은 모선의 길이)", "구의 부피 = 4/3 πr³,  구의 겉넓이 = 4πr²", "회전체는 회전축을 포함하는 평면으로 자른 단면은 선대칭도형, 회전축에 수직인 평면으로 자른 단면은 원이다.", "전개도는 입체도형의 각 면을 펼친 그림이며, 둘레와 넓이는 펼친 그림에서 계산한다."], "t": "입체도형은 밑면의 모양과 높이를 먼저 확인하고, 필요하면 단면이나 전개도를 그립니다."}, "prob": {"n": "확률", "g": "중2", "p": ["확률 = (사건 A가 일어나는 경우의 수) / (모든 경우의 수),  0 ≤ 확률 ≤ 1", "사건 A가 일어나지 않을 확률 = 1 − (A가 일어날 확률)", "'적어도 하나'는 여사건을 이용하는 경우가 많다.", "동시에 일어나지 않는 두 사건의 확률은 더하고, 서로 영향을 주지 않는 두 사건이 모두 일어날 확률은 곱한다.", "주사위 두 개를 던지면 모든 경우의 수는 36, 동전 n개는 2ⁿ"], "t": "확률은 분모(모든 경우의 수)와 분자(조건에 맞는 경우의 수)를 따로 세어 나눕니다."}, "sim": {"n": "닮음과 평행선, 넓이의 비", "g": "중2", "p": ["닮음 조건:  세 변의 길이의 비가 같다(SSS), 두 변의 길이의 비와 그 끼인각의 크기가 같다(SAS), 두 각의 크기가 각각 같다(AA)", "삼각형과 평행선:  DE ∥ BC이면 AD : AB = AE : AC = DE : BC", "닮음비가 m : n이면 길이의 비는 m : n, 넓이의 비는 m² : n², 부피의 비는 m³ : n³", "직각삼각형 ABC에서 AH ⊥ BC이면 AB² = BH × BC,  AH² = BH × CH"], "t": "평행선이나 같은 각이 보이면 닮은 삼각형을 찾고, 대응하는 변의 비를 세웁니다."}, "lf": {"n": "일차함수와 그래프", "g": "중2", "p": ["y = ax + b에서 기울기 a = (y의 증가량)/(x의 증가량), y절편은 b, x절편은 y = 0일 때의 x의 값이다.", "두 직선이 평행하면 기울기가 같고 y절편이 다르다.", "두 점 (x₁, y₁), (x₂, y₂)를 지나는 직선의 기울기는 (y₂ − y₁)/(x₂ − x₁)이고, 기울기가 a이고 한 점을 지나면 y − y₁ = a(x − x₁)로 식을 구한다.", "y축 방향으로 k만큼 평행이동하면 y = ax + b + k"], "t": "기울기와 한 점(또는 절편)이 있으면 직선의 식이 정해집니다."}, "mult_formula": {"n": "곱셈공식과 그 변형", "g": "중3", "p": ["(a + b)² = a² + 2ab + b²,  (a − b)² = a² − 2ab + b²", "(a + b)(a − b) = a² − b²", "(x + a)(x + b) = x² + (a + b)x + ab,  (ax + b)(cx + d) = acx² + (ad + bc)x + bd", "변형:  a² + b² = (a + b)² − 2ab = (a − b)² + 2ab,  x² + 1/x² = (x + 1/x)² − 2"], "t": "합(a+b)과 곱(ab)이 주어지면 제곱의 합 a²+b²를 변형 공식으로 구합니다."}, "qf_max": {"n": "꼭짓점의 y좌표와 최댓값·최솟값", "g": "중3", "p": ["y = a(x − p)² + q에서 a > 0이면 x = p일 때 최솟값 q, a < 0이면 x = p일 때 최댓값 q이다.", "그래프의 꼭짓점의 y좌표를 읽는 것으로 접근한다.", "(참고) 이차함수의 최대·최소는 고1 공통수학1에서 더 자세히 배운다."], "t": "표준형으로 고치면 꼭짓점의 y좌표가 바로 최댓값 또는 최솟값입니다."}, "qf": {"n": "이차함수와 그래프", "g": "중3", "p": ["y = a(x − p)² + q:  꼭짓점 (p, q), 축 x = p.  a > 0이면 아래로 볼록, a < 0이면 위로 볼록", "y = ax² + bx + c는 완전제곱식으로 고쳐 y = a(x − p)² + q 꼴로 만든다.", "y절편은 x = 0일 때의 값 c, x절편은 y = 0인 이차방정식의 근이다.", "y = ax²을 x축 방향으로 p, y축 방향으로 q만큼 평행이동하면 y = a(x   if(i!==0)s+=`<text x="${X(i)}" y="${Y(0)+13}" font-size="10" fill="#9aa0cf" text-anchor="middle">${i}</text><text x="${X(0)-5}" y="${Y(i)+3}" font-size="10" fill="#9aa0cf" text-anchor="end">${i}</text>`}
 s+=`<path d="M${X(-5)} ${Y(0)}H${X(5)}M${X(0)} ${Y(-5)}V${Y(5)}" stroke="#8892c8" stroke-width="2"/><text x="${X(5)-4}" y="${Y(0)-5}" font-size="12" fill="#cfd4ff" text-anchor="end">x</text><text x="${X(0)+6}" y="${Y(5)+11}" font-size="12" fill="#cfd4ff">y</text>`;

 s+=`<polyline points="${G.path.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 4"/>`;
 G.path.forEach((p,i)=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${i===G.path.length-1?9:5}" fill="${i===G.path.length-1?'#ffd166':'#ff9f6e'}" stroke="#000" stroke-width="1.5"/>`;if(i>0||true)s+=`<text x="${X(p[0])+10}" y="${Y(p[1])-9}" font-size="10.5" fill="#fff">${i===0?'출발':`(${p[0]}, ${p[1]})`}</text>`});

 U('6 사각형의 성질',[L('평행사변형의 성질',['para']),L('평행사변형이 되는 조건',['para']),L('여러 가지 사각형',['para'])]),

CURR[1].units.forEach((u,i)=>u.ls.forEach((l,j)=>l.id='1-'+(i+1)+'-'+(j+1)));
[2,3].forEach(g=>CURR[g].units.forEach((u,i)=>u.ls.forEach((l,j)=>l.id=g+'-'+(i+1)+'-'+(j+1))));
function findLesson(id){for(const g in CURR)for(const u of CURR[g].units)for(const l of u.ls)if(l.id===id)return {l,u,g:+g};return null}
const LS=(k,d)=>loadLS(k,d),SV=(k,v)=>saveLS(k,v);
let sess=null;
const rnd=()=>Math.floor(Math.random()*1e9);
function lessonCons(l){const s=new Set();l.g.forEach(t=>{const p=GENS.make(t,1,1);if(p)p.con.forEach(c=>s.add(c))});return [...s].filter(c=>CON[c])}
function buildSession(id){
 const f=findLesson(id),lp=LS('lp',{})[id]||{},lvl=lp.lvl||1,list=[],seen={};
 const add=(t,L,tag)=>{for(let k=0;k<12;k++){const p=GENS.make(t,L,rnd());if(p&&!seen[p.q+p.ch[p.ans-1]]){seen[p.q+p.ch[p.ans-1]]=1;p.tag=tag;p.type=t;p.lv=L;list.push(p);return true}}return false};
 const types=f.l.g;const base=[lvl,lvl,Math.min(3,lvl+1),Math.min(3,lvl+1)];
 const rev=LS('rev',[]).filter(r=>!types.includes(r.t)).slice(0,1);
 base.forEach((L,i)=>add(types[i%types.length],L,i<2?'기본':'유형'));
 rev.forEach(r=>add(r.t,r.L,'복습'));
 // 고1 기출 연결: 같은 개념의 기존 문제 1개
 const cons=lessonCons(f.l);
 const pool=SITE.PR.filter(q=>q.con.some(c=>cons.includes(c))&&(q.lv==='기출 수준'||q.lv==='응용'));
 const bank=pool.length?pool:SITE.PR.filter(q=>q.con.some(c=>cons.includes(c)));
 if(bank.length){const q=bank[rnd()%bank.length];list.push({q:q.text,ch:q.ch,ans:q.ans,er:q.ch.map((c,i)=>i+1===q.ans?null:'함정에 걸림'),s:q.sol,con:q.con,tag:'고1 연결',type:'bank',pid:q.id,fig:q.fig,lv:q.lv})}
 else add(types[0],Math.min(3,lvl+1),'유형');
 while(list.length<6)add(types[list.length%types.length],lvl,'기본');
 return {id,f,list:list.slice(0,6),i:0,res:[],lvl,errs:[]}}
function css(){if(document.getElementById('daycss'))return;const s=document.createElement('style');s.id='daycss';s.textContent='.dl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.dl button{font:inherit;padding:7px 10px;border:1px solid var(--line,#ccc);border-radius:10px;background:#fff;cursor:pointer;text-align:left}.dl button.dn{background:#e8f6ea;border-color:#7cc58a}.dl button small{display:block;color:#777;font-size:.78em}.dtag{display:inline-block;font-size:.78em;padding:1px 8px;border-radius:99px;background:#eef;margin-right:6px}.dbar{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin:6px 0}.dbar i{display:block;height:100%;background:#4a8;}';document.head.appendChild(s)}
window.renderDay=function(){css();const g=LS('grade',3),C=CURR[g],lp=LS('lp',{});
 const q=new URLSearchParams(location.search).get('l');if(q&&!window._dayq){window._dayq=1;if(findLesson(q)){startLesson(q);return}}
 let h=`<div class="card"><h3 style="margin:0 0 4px">차시 학습</h3><div class="note">교과서 차시마다 6문제. 숫자가 매번 바뀌어 여러 번 풀 수 있고, 틀리면 어떤 실수인지 알려 줍니다.</div>
 <div class="yl" style="margin:8px 0">${[1,2,3].map(x=>`<button class="nb${x===g?' hi':''}" onclick="dayGrade(${x})">${CURR[x].name}</button>`).join('')}</div><div class="note">${C.book}</div>
 <div style="margin:8px 0"><input id="daycode" placeholder="차시 번호 예: 2-3-1" style="font:inherit;padding:6px;width:9em"> <button class="nb" onclick="dayCode()">이동</button></div></div>`;
 C.units.forEach(u=>{const done=u.ls.filter(l=>lp[l.id]).length;h+=`<div class="card"><h4 style="margin:0">${u.u} <span class="note">(${done}/${u.ls.length})</span></h4><div class="dbar"><i style="width:${done/u.ls.length*100}%"></i></div><div class="dl">${u.ls.map(l=>{const r=lp[l.id];return `<button class="${r?'dn':''}" onclick="startLesson('${l.id}')">${l.id} ${l.t}<small>${r?'최고 '+r.best+'/6 · 수준 '+r.lvl:'아직 안 풀었어요'}</small></button>`}).join('')}</div></div>`});
 h+=errPanel();document.getElementById('v-day').innerHTML=h};
window.dayGrade=x=>{SV('grade',x);renderDay()};
window.dayCode=()=>{const v=document.getElementById('daycode').value.trim();if(findLesson(v))startLesson(v);else alert&&0,document.getElementById('daycode').placeholder='없는 번호예요'};
function errPanel(){const e=LS('errs',{});const k=Object.keys(e).sort((a,b)=>e[b]-e[a]).slice(0,5);if(!k.length)return '';return `<div class="card"><h4 style="margin:0 0 4px">내가 자주 하는 실수</h4>${k.map(x=>`<div>· ${esc(x)} <b>${e[x]}회</b></div>`).join('')}<div class="note" style="margin-top:6px">차시를 다시 풀 때 이 실수가 나오는 문제를 더 많이 만나게 됩니다.</div></div>`}
window.startLesson=function(id){css();sess=buildSession(id);nav('prac','v-day');showQ()};
function showQ(){const s=sess,p=s.list[s.i];const el=document.getElementById('v-day');
 el.innerHTML=`<div class="card"><div class="note">${s.f.l.id} ${s.f.l.t} · ${s.i+1}/6</div><div class="dbar"><i style="width:${s.i/6*100}%"></i></div>
 <div class="pc"><div class="ph"><span class="dtag">${p.tag}</span></div><div class="pq">${br(p.q)}</div>${p.fig&&SITE.FIG[p.fig]?`<img class="pf" src="${SITE.FIG[p.fig]}" alt="문제 그림">`:''}
 <div class="chs">${p.ch.map((c,i)=>`<button class="cb" onclick="dayPick(${i+1})">${CIR[i]} ${esc(c)}</button>`).join('')}</div><div class="fb" id="dayfb"></div></div></div>`}
window.dayPick=function(k){const s=sess,p=s.list[s.i];const bs=[...document.querySelectorAll('#v-day .cb')];if(bs[0].disabled)return;
 const ok=k===p.ans;bs.forEach((b,i)=>{b.disabled=true;if(i+1===p.ans)b.classList.add('ok');else if(i+1===k)b.classList.add('no')});
 s.res.push(ok);rec(p.pid||('g-'+p.type),ok,(p.con||[]).filter(c=>CON[c]));
 let why='';if(!ok){const lab=p.er[k-1]||'계산 실수';s.errs.push(lab);const e=LS('errs',{});e[lab]=(e[lab]||0)+1;SV('errs',e);
  if(p.type!=='bank'){const r=LS('rev',[]);r.push({t:p.type,L:p.lv});SV('rev',r.slice(-8))}
  why=`<div class="fno"><b>이 선택지는 '${esc(lab)}' 유형이에요.</b></div>`}
 else if(p.type!=='bank'){const r=LS('rev',[]);const i=r.findIndex(x=>x.t===p.type);if(i>=0&&p.tag==='복습'){r.splice(i,1);SV('rev',r)}}
 const cs=(p.con||[]).filter(c=>CON[c]).slice(0,1);
 document.getElementById('dayfb').innerHTML=`<div class="${ok?'fok':'fno'}"><b>${ok?'정답입니다!':'아쉬워요. 정답은 '+CIR[p.ans-1]+' 입니다.'}</b></div>${why}<div class="sol show" style="margin-top:6px">${br(p.s||'')}</div><div style="margin-top:8px">${!ok&&cs.length?`<button class="nb" onclick="openPanel(conCard('${cs[0]}'),'개념 확인')">개념 보기</button> `:''}<button class="nb hi" onclick="dayNext()">${s.i<5?'다음 문제 →':'결과 보기'}</button></div>`}
window.dayNext=function(){const s=sess;if(s.i<5){s.i++;showQ();return}finish()};
function finish(){const s=sess,n=s.res.filter(x=>x).length;const lp=LS('lp',{});const old=lp[s.id]||{};let lvl=s.lvl;if(n>=5)lvl=Math.min(3,lvl+1);else if(n<=2)lvl=Math.max(1,lvl-1);
 lp[s.id]={best:Math.max(old.best||0,n),lvl,last:dkey(),times:(old.times||0)+1};SV('lp',lp);
 const cnt={};s.errs.forEach(x=>cnt[x]=(cnt[x]||0)+1);
 const msg=n>=5?'아주 잘했어요! 다음에는 한 단계 어려운 문제가 나옵니다.':n>=3?'좋아요. 틀린 유형을 다시 풀어 보면 더 단단해집니다.':'개념을 먼저 복습한 뒤 다시 도전해 봐요. 문제는 숫자가 달라져요.';
 const f=s.f,nxt=(()=>{let found=false;for(const u of CURR[f.g].units)for(const l of u.ls){if(found)return l;if(l.id===s.id)found=true}return null})();
 const hs=cnt&&Object.keys(cnt).length?`<h4 class="dh">이번에 한 실수</h4>${Object.keys(cnt).map(x=>`<div>· ${esc(x)} ${cnt[x]}회</div>`).join('')}`:'';
 const cons=lessonCons(f.l).slice(0,3);
 document.getElementById('v-day').innerHTML=`<div class="card"><h3 style="margin:0">${n} / 6 정답</h3><div class="dbar"><i style="width:${n/6*100}%"></i></div><div>${msg}</div>${hs}
 ${cons.length?`<h4 class="dh">관련 개념</h4><div class="yl">${cons.map(c=>`<button class="nb" onclick="openPanel(conCard('${c}'),'개념 확인')">${esc(CON[c].n)}</button>`).join('')}</div>`:''}
 <div style="margin-top:10px"><button class="nb hi" onclick="startLesson('${s.id}')">같은 차시 다시(새 숫자)</button> ${nxt?`<button class="nb" onclick="startLesson('${nxt.id}')">다음 차시: ${esc(nxt.t)}</button>`:''} <button class="nb" onclick="renderDay()">차시 목록</button></div></div>`}
window.CURR=CURR;
})();
