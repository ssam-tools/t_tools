<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>쌤 노트 소개 영상 · 장면 (만드는 화면)</title>
<!-- PLAN_배포 5단계 · 소개 영상의 '촬영장'.
     film.html?v=teacher | student          → 실제 빠르기로 재생해 보기 (화면 확인용)
     film.html?v=teacher&t=12.5             → 그 순간 한 장면만 (make.py 가 1/30초씩 찍어 MP4로 만듦)
     장면 내용은 film.js 의 SCENES 한 곳. 화면 그림은 ../shots/ (견본 모드로 찍은 것, 개인정보 없음) -->
<style>
@font-face{font-family:"SN Jua";src:url("../../../shared/fonts/Jua-Regular.ttf") format("truetype")}
:root{--g:#1D9E75;--gd:#0F6E56;--ink:#04342C;--y:#FFC83D;--red:#D9483B;--t-accent:#1D9E75}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.ab{position:absolute}
.sbArt *{animation:none!important}
.jua{font-family:"SN Jua","Noto Sans CJK KR",sans-serif;font-weight:400}

/* 공통: 기기 틀 */
.mon{position:absolute;background:#1f2a30;border-radius:28px;padding:18px 18px 46px;box-shadow:0 40px 80px rgba(4,52,44,.28)}
.mon:after{content:"";position:absolute;left:50%;bottom:16px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#3a474e}
.phone{position:absolute;background:#121a1e;border-radius:64px;padding:16px;box-shadow:0 40px 90px rgba(0,0,0,.3)}
.phone:before{content:"";position:absolute;top:26px;left:50%;width:120px;height:30px;margin-left:-60px;border-radius:20px;background:#000;z-index:3}
.scr{position:relative;overflow:hidden;background:#fff;width:100%;height:100%}
.mon .scr{border-radius:12px}.phone .scr{border-radius:50px}
.scr img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:8px solid var(--y);opacity:0}
.cur{position:absolute;width:64px;height:64px;opacity:0;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}

/* 선생님 영상 */
.T{background:linear-gradient(180deg,#E9F7F1 0%,#F7FBF9 55%,#E3F3EC 100%)}
.T .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(29,158,117,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(29,158,117,.07) 2px,transparent 2px);background-size:72px 72px}
.hud{position:absolute;left:56px;right:56px;top:86px;height:250px}
.clock{position:absolute;left:0;top:0;background:#fff;border-radius:36px;padding:22px 34px 20px;box-shadow:0 14px 34px rgba(4,52,44,.12);display:flex;align-items:center;gap:22px}
.clock .ic{font-size:64px;line-height:1}
.clock b{font-size:104px;font-weight:900;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.clock small{display:block;font-size:30px;font-weight:700;color:var(--g);margin-bottom:4px}
.cnt{position:absolute;right:0;top:6px;text-align:right}
.cnt .pill{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:16px 30px;font-size:40px;font-weight:900}
.cnt .pill em{font-style:normal;color:var(--y)}
.cnt .demo{display:block;margin-top:14px;font-size:26px;font-weight:700;color:#5b7a71}
.track{position:absolute;left:0;right:0;top:206px;height:16px;border-radius:9px;background:rgba(4,52,44,.1)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--g),#58c99f)}
.track .tl{position:absolute;top:28px;font-size:24px;font-weight:700;color:#5b7a71}
.track .owl{position:absolute;top:-58px;width:70px;margin-left:-35px}
.cap{position:absolute;left:56px;right:56px;top:1420px;height:330px}
.cap .owl{position:absolute;left:-6px;bottom:20px;width:210px}
.cap .bub{position:absolute;left:206px;right:0;top:0;background:#fff;border-radius:40px;padding:34px 40px 36px;box-shadow:0 18px 40px rgba(4,52,44,.14)}
.cap .bub:before{content:"";position:absolute;left:-26px;bottom:62px;border:20px solid transparent;border-right:30px solid #fff;border-left:0}
.cap h2{font-size:70px;font-weight:900;letter-spacing:-2px;line-height:1.14}
.cap p{font-size:40px;font-weight:700;color:#4c6b62;margin-top:14px;line-height:1.3}
.cap .one{display:inline-block;margin-top:20px;background:#FFF3CC;color:#8a5b00;border-radius:999px;padding:8px 24px;font-size:32px;font-weight:900}
.hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:420px}
.hook h1{font-size:112px;font-weight:900;letter-spacing:-4px;line-height:1.15;text-align:center}
.hook h1 em{font-style:normal;color:var(--g)}
.chips{position:relative;width:940px;height:620px;margin-top:40px}
.chip{position:absolute;background:#fff;border:4px solid #d4e5de;border-radius:24px;padding:16px 26px;font-size:40px;font-weight:800;color:#5b7a71;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,.06)}
.times{position:absolute;right:30px;top:-30px;font-size:150px;font-weight:900;color:var(--red);transform:rotate(8deg)}
.hookOwl{position:absolute;left:50%;top:1350px;width:300px;margin-left:-150px}
.hookSay{position:absolute;left:90px;right:90px;top:1660px;text-align:center;font-size:60px;font-weight:900;color:var(--ink)}
.mont{position:absolute;left:40px;right:40px;top:400px;height:980px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mont div{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 24px rgba(4,52,44,.18);border:4px solid #fff}
.mont img{width:100%;height:100%;object-fit:cover;object-position:left top}
.end{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#22b285 0%,#118060 60%,#0b5c45 100%);color:#fff}
.stamp{position:absolute;left:50%;top:330px;width:470px;height:470px;margin-left:-235px;border-radius:50%;border:22px solid var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.96);font-weight:900}
.stamp b{font-size:150px;line-height:1;letter-spacing:-4px}.stamp small{font-size:46px;margin-top:10px}
.end h1{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:96px;font-weight:900;letter-spacing:-3px;line-height:1.2}
.end h1 em{font-style:normal;color:var(--y)}
.end .qr{position:absolute;left:50%;top:1170px;width:840px;margin-left:-420px;background:#fff;color:var(--ink);border-radius:40px;padding:34px;display:flex;gap:34px;align-items:center}
.end .qr .q{width:260px;height:260px;flex:none}.end .qr .q svg{width:100%;height:100%}
.end .qr b{font-size:52px;font-weight:900;display:block;line-height:1.2}.end .qr span{display:block;font-size:34px;font-weight:700;color:#4c6b62;margin-top:12px}
.end .qr code{display:block;margin-top:18px;font:700 28px/1.2 "Noto Sans CJK KR",sans-serif;color:var(--g)}
.end .by{position:absolute;left:0;right:0;top:1520px;text-align:center;font-size:32px;font-weight:700;opacity:.85}
.end .owlE{position:absolute;right:70px;top:560px;width:250px}

/* 학생 영상 */
.S{background:#FFD84D}
.S .rays{position:absolute;left:50%;top:50%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,transparent 10deg 20deg)}
.S .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(43,33,0,.08) 4px,transparent 5px);background-size:48px 48px}
.shud{position:absolute;left:50px;right:50px;top:80px;height:200px}
.lv{position:absolute;left:0;top:0;background:#2B2100;color:#FFD84D;border-radius:28px;padding:14px 30px;font-size:64px}
.xp{position:absolute;left:250px;right:0;top:22px;height:58px;border-radius:30px;background:rgba(43,33,0,.18);border:5px solid #2B2100;overflow:hidden}
.xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FF7A1A,#FF4D6D)}
.xp span{position:absolute;right:20px;top:4px;font-size:36px;color:#2B2100}
.streak{position:absolute;left:250px;top:104px;font-size:42px;color:#2B2100}
.sdemo{position:absolute;right:0;top:110px;font:700 26px "Noto Sans CJK KR",sans-serif;color:#6b5600}
.plus{position:absolute;font-size:80px;color:#FF4D6D;-webkit-text-stroke:4px #fff;paint-order:stroke;opacity:0}
.scap{position:absolute;left:40px;right:40px;top:1530px;text-align:center}
.scap h2{font-size:112px;color:#2B2100;line-height:1.05;-webkit-text-stroke:0}
.scap p{display:inline-block;margin-top:22px;background:#2B2100;color:#FFD84D;border-radius:999px;padding:12px 40px;font-size:50px}
.sowl{position:absolute;width:220px}
.shook{position:absolute;inset:0;text-align:center}
.shook h1{position:absolute;left:0;right:0;font-size:150px;line-height:1.08;color:#2B2100}
.shook h1.b{color:#FF4D6D;-webkit-text-stroke:6px #2B2100;paint-order:stroke}
.lvup{position:absolute;z-index:5;left:0;right:0;top:640px;text-align:center;font-size:190px;color:#fff;-webkit-text-stroke:12px #2B2100;paint-order:stroke;letter-spacing:4px}
.send h1{position:absolute;left:0;right:0;top:760px;text-align:center;font-size:122px;line-height:1.12;color:#2B2100}
.send h1 em{font-style:normal;color:#FF4D6D}
.send .qr{position:absolute;left:50%;top:1220px;width:820px;margin-left:-410px;background:#fff;border:8px solid #2B2100;border-radius:44px;padding:30px;display:flex;gap:30px;align-items:center}
.send .qr .q{width:250px;height:250px;flex:none}.send .qr .q svg{width:100%;height:100%}
.send .qr b{font-size:70px;display:block;color:#2B2100}.send .qr span{display:block;font-size:40px;color:#6b5600;margin-top:10px}
.send .qr code{display:block;margin-top:14px;font:700 23px/1.25 "Noto Sans CJK KR",sans-serif;color:#b04a00;white-space:nowrap}
.send .by{position:absolute;left:0;right:0;top:1600px;text-align:center;font:700 30px "Noto Sans CJK KR",sans-serif;color:#6b5600}
.conf{position:absolute;width:26px;height:40px;border-radius:6px}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../../../shared/qr.js"></script>
<script src="../../../shared/sbart.js"></script>
<script src="film.js"></script>
</body>
</html>
