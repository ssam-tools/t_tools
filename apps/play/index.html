<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<link rel="stylesheet" href="../../shared/tt.css">
<title>수학 놀이터 · 쌤 노트</title>
<!--
  🎮 수학 놀이터 — 전자칠판에서 반 전체가 함께 하는 수학 게임·퍼즐 17가지
  · 🍀 운으로 (누구나 역전): 🎁 보물 상자 · 💣 숫자 폭탄 · 🎡 돌림판 · 🛤️ 주사위 말판 · 🏇 주사위 합 경주 · 🃏 하이·로우
  · 🙌 함께 풀기: 🏁 퀴즈 배틀 · 🎱 수학 빙고 · ➕ 숫자 만들기 · 🕵️ 수 탐정 · 📈 그래프 맞히기
  · 🧠 퍼즐: 🔲 스도쿠 · 🔷 세 장 찾기 · 🎴 짝 맞추기 · 🗼 하노이 탑 · 🪄 마방진 · 🔥 성냥개비 식
  · 아래 모둠 점수 줄은 수업 도구 🏆 모둠 점수와 같은 자료(tt_class_v1.scores)입니다. 학생 이름은 쓰지 않습니다.
  · 문제는 🔢 문항 생성기 엔진(shared/mathgen.js)과 각 게임의 생성기로 그때그때 만듭니다.
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap}
  .tbtn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink)}
  .tbtn[aria-pressed=true]{background:#2d3a48;border-color:#2d3a48;color:#fff}
  main{display:grid!important;grid-template-columns:minmax(150px,178px) minmax(0,1fr);gap:10px;padding:10px!important}
  .nav{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
  .nav h3{font-size:11.5px;color:var(--sub);margin:5px 6px 1px;font-weight:800}
  .nav h3:first-child{margin-top:0}
  .nav button{font:inherit;font-size:13.5px;text-align:left;border:0;background:transparent;border-radius:8px;padding:3px 8px;cursor:pointer;color:var(--ink);display:flex;gap:7px;align-items:center}
  .nav button:hover{background:#f3f6f9}
  .nav button[aria-current=true]{background:var(--accent);color:#fff}
  .stage{min-height:0;display:flex;flex-direction:column;gap:8px}
  .ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ghead h2{font-size:clamp(17px,2.8vh,22px);font-weight:900}
  .ghead .d{font-size:12.5px;color:var(--sub);flex:1;min-width:160px}
  .ghead .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ghead .ctl .btn,.ghead .ctl select{padding:6px 11px;font-size:13.5px}
  .area{flex:1;min-height:0;position:relative;border-radius:14px;background:linear-gradient(160deg,#f7faff,#eef4fb);border:1px solid var(--line);overflow:hidden;display:flex}
  /* 모둠 점수 줄 */
  .teams{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto}
  .tm{flex:1;min-width:96px;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 6px 4px 9px;position:relative}
  .tm.turn{box-shadow:0 0 0 3px #ffd23f;border-color:#ffd23f}
  .tm .nm{font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .tm .sc{font-size:clamp(18px,3vh,24px);font-weight:900;min-width:30px;text-align:right}
  .tm .pm{display:flex;flex-direction:column;gap:2px}
  .tm .pm button{border:0;border-radius:6px;width:22px;height:17px;line-height:15px;font-weight:900;cursor:pointer;background:#eef2f6;font-size:13px;padding:0}
  .tm .crown{position:absolute;top:-11px;left:4px;font-size:15px}
  .tm.bump .sc{animation:bump .5s}
  .tm .fly{position:absolute;right:8px;top:-6px;font-weight:900;font-size:18px;animation:fly 1s forwards;pointer-events:none}
  @keyframes bump{40%{transform:scale(1.6)}}
  @keyframes fly{to{transform:translateY(-34px);opacity:0}}
  /* 처음 화면: 놀이 고르기 */
  .home{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .home h3{font-size:14px;font-weight:900;color:#33404d}
  .home h3 small{font-weight:500;color:var(--sub);margin-left:6px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;gap:9px;align-items:flex-start;transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,60,100,.14)}
  .card .i{font-size:28px;line-height:1}
  .card b{display:block;font-size:14px}
  .card span{display:block;font-size:11.5px;color:var(--sub);line-height:1.4;margin-top:2px}
  /* 효과 */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .conf{position:absolute;width:11px;height:15px;border-radius:2px;animation:conf 1.6s cubic-bezier(.15,.7,.4,1) forwards}
  @keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r));opacity:0}}
  .flash{position:absolute;inset:0;animation:flash .6s forwards}
  @keyframes flash{from{opacity:.85}to{opacity:0}}
  .bigmsg{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;background:rgba(255,255,255,.96);border-radius:24px;padding:18px 36px;box-shadow:0 14px 50px rgba(0,0,0,.25);animation:popin .45s cubic-bezier(.2,1.6,.4,1);pointer-events:auto;cursor:pointer;max-width:90vw}
  .bigmsg .t{font-size:clamp(34px,8vh,72px);font-weight:900;line-height:1.15}
  .bigmsg .s{font-size:clamp(15px,2.6vh,22px);font-weight:700;color:var(--sub);margin-top:6px}
  .bigmsg.out{animation:popout .4s forwards}
  @keyframes popin{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
  @keyframes popout{to{transform:translate(-50%,-50%) scale(.6);opacity:0}}
  .shake{animation:shake .55s}
  @keyframes shake{10%,50%,90%{transform:translate(-9px,3px)}30%,70%{transform:translate(9px,-3px)}}
  .die{display:inline-block;font-size:clamp(54px,11vh,96px);line-height:1;color:#2d3a48}
  .die.rolling{animation:spin .14s linear infinite}
  .die.land{animation:land .4s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes land{40%{transform:scale(1.35)}}
  .ring{width:100%;height:100%}
  .tmr{position:relative;width:clamp(52px,9vh,76px);height:clamp(52px,9vh,76px);flex:none}
  .tmr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3.4vh,28px);font-weight:900}
  .tmr.over{animation:shake .55s}
  dialog.teampick .tp{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  dialog.teampick .tp .btn{font-size:18px;padding:12px 18px;flex:1}
  /* 게임 공통 */
  .gwrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
  .hint{font-size:13px;color:var(--sub);text-align:center}
  .bigbtn{font:inherit;font-size:clamp(16px,2.6vh,20px);font-weight:900;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;color:#fff;background:var(--accent);box-shadow:0 4px 0 #1e4f86}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e4f86}
  .bigbtn.g{background:#2e9d5b;box-shadow:0 4px 0 #1d6b3d}.bigbtn.r{background:#d64545;box-shadow:0 4px 0 #8f2a2a}.bigbtn.y{background:#f0a400;box-shadow:0 4px 0 #a87300}.bigbtn.k{background:#56606b;box-shadow:0 4px 0 #333b44}
  .bigbtn:disabled{opacity:.45;cursor:default}
  .q{font-size:clamp(22px,5vh,44px);font-weight:800;text-align:center;line-height:1.45}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.1;margin:0 2px}
  .frac span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
  .ans{font-size:clamp(20px,4vh,36px);font-weight:900;color:#c2410c}
  @media (max-width:760px){ main{grid-template-columns:minmax(0,1fr)} .ghead .d{display:none} .bomb,.bingo,.det,.pz,.wheel,.gq{flex-direction:column} .bomb .side,.bingo .right,.det .cand{width:100%} .sd{max-width:100%;height:auto;width:100%} .wheel .wbox{max-width:100%;height:auto;width:100%} .gq .main,.gq .opts.g{max-width:100%;height:auto;width:100%} .nav{flex-direction:row;flex-wrap:wrap;max-height:110px} .nav h3{width:100%} body{height:auto;min-height:100dvh;overflow:auto} .area{min-height:60vh} }
  :fullscreen body,body:fullscreen{padding:10px}
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../">← 쌤 노트</a>
    <h1>🎮 수학 놀이터</h1>
  </div>
  <div class="bar">
    <select id="cls" aria-label="반 (모둠 점수)"></select>
    <button type="button" class="tbtn" id="snd" aria-pressed="true" title="소리 켜고 끄기">🔊 소리</button>
    <button type="button" class="tbtn" id="full" title="전체 화면">⛶ 전체 화면</button>
    <details class="more" id="more"><summary aria-label="더 보기">⋯</summary><div class="menu">
      <button type="button" id="mCount">모둠 수 바꾸기</button>
      <button type="button" id="mReset" class="danger">모둠 점수 모두 0으로</button>
      <hr><a href="../class/">🧰 수업 도구 (🎲 뽑기 · 🏆 모둠 점수)</a><a href="../mgen/">🔢 문항 생성기</a>
    </div></details>
  </div>
</header>
<main class="panel" id="m">
  <nav class="nav" id="nav" aria-label="놀이"></nav>
  <section class="stage">
    <div class="ghead" id="ghead"></div>
    <div class="area" id="area"></div>
    <div class="teams" id="teams" aria-label="모둠 점수"></div>
  </section>
</main>
<footer>
  <span id="info">맞히면 기회, 점수는 운으로! 모둠 점수는 수업 도구 🏆와 함께 쌓입니다 · 모둠 이름을 누르면 바꿀 수 있어요</span>
  <span class="priv">🔒 학생 이름 없이 · 저장되는 것은 모둠 점수뿐</span>
</footer>
<script src="../../shared/tt.js"></script>
<script src="../../shared/mathgen.js"></script>
<script src="kit.js"></script>
<script src="g_luck.js"></script>
<script src="g_team.js"></script>
<script src="g_puzzle.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); }, h = K.h;
  var CATS = [{id: "luck", name: "🍀 운으로", sub: "누구나 역전할 수 있어요"}, {id: "team", name: "🙌 함께 풀기", sub: "맞히면 점수 · 모둠 대항"}, {id: "puzzle", name: "🧠 퍼즐", sub: "혼자·짝·반 전체 도전"}];
  var cur = null, cleanup = null;

  function drawNav(){
    var nav = $("nav"); nav.innerHTML = "";
    var hb = h("button", "", "🏠 놀이 고르기"); hb.type = "button"; hb.setAttribute("aria-current", String(!cur)); hb.onclick = function(){ go(""); }; nav.appendChild(hb);
    CATS.forEach(function(c){
      nav.appendChild(h("h3", "", c.name));
      K.games.filter(function(g){ return g.cat === c.id; }).forEach(function(g){
        var b = h("button"); b.type = "button"; b.setAttribute("aria-current", String(cur === g.id)); b.appendChild(h("span", "", g.icon)); b.appendChild(h("span", "", g.name)); b.onclick = function(){ go(g.id); }; nav.appendChild(b);
      });
    });
  }
  function go(id){ if(location.hash.slice(1) !== id) history.replaceState(null, "", id ? "#" + id : location.pathname); show(id); }
  function show(id){
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
    K.bump();
    Array.prototype.forEach.call(document.querySelectorAll("dialog[open]"), function(d){ if(!d.classList.contains("keep")) d.close(); });
    var fx = document.getElementById("fx"); if(fx) fx.innerHTML = "";
    var g = K.games.filter(function(x){ return x.id === id; })[0]; cur = g ? g.id : null;
    var gh = $("ghead"), ar = $("area"); gh.innerHTML = ""; ar.innerHTML = ""; ar.className = "area";
    drawNav();
    if(!g){
      gh.appendChild(h("h2", "", "오늘은 무엇을 할까요?")); gh.appendChild(h("span", "d", "운 게임은 문제를 맞힌 모둠에게 기회를 주는 상으로 쓰면 좋아요. 🏁 퀴즈 배틀 → 맞힌 모둠이 🎁 상자 열기!"));
      var home = h("div", "home");
      CATS.forEach(function(c){
        home.appendChild(h("h3", "", c.name));
        var cards = h("div", "cards");
        K.games.filter(function(x){ return x.cat === c.id; }).forEach(function(x){ var b = h("button", "card"); b.type = "button"; b.appendChild(h("div", "i", x.icon)); var d = h("div"); d.appendChild(h("b", "", x.name)); d.appendChild(h("span", "", x.desc)); b.appendChild(d); b.onclick = function(){ K.S.click(); go(x.id); }; cards.appendChild(b); });
        home.appendChild(cards);
      });
      ar.appendChild(home); return;
    }
    gh.appendChild(h("h2", "", g.icon + " " + g.name)); gh.appendChild(h("span", "d", g.desc));
    var ctl = h("div", "ctl"); gh.appendChild(ctl);
    try{ cleanup = g.mount(ar, ctl) || null; }catch(e){ ar.appendChild(h("div", "gwrap", "이 놀이를 여는 중 문제가 생겼습니다: " + e.message)); console.error(e); }
  }

  /* 모둠 점수 줄 */
  function drawTeams(ev){
    var T = K.teams(), box = $("teams"), top = Math.max.apply(null, T.map(function(t){ return t.score; }));
    box.innerHTML = "";
    T.forEach(function(t){
      var d = h("div", "tm" + (t.i === K.turn() ? " turn" : "")); d.style.borderLeft = "8px solid " + t.color;
      if(top > 0 && t.score === top) d.appendChild(h("span", "crown", "👑"));
      var nm = h("span", "nm", t.name); nm.title = "눌러서 이름 바꾸기"; nm.onclick = function(){ TT.ui.prompt("모둠 이름", t.name, "예: 1모둠, 피타고라스", function(v){ K.rename(t.i, v.slice(0, 10)); }); }; d.appendChild(nm);
      var s = h("span", "sc", String(t.score)); s.style.color = t.color; d.appendChild(s);
      var pm = h("div", "pm"), p = h("button", "", "+"), mi = h("button", "", "−"); p.type = mi.type = "button"; p.onclick = function(){ K.add(t.i, 1); }; mi.onclick = function(){ K.add(t.i, -1); }; pm.appendChild(p); pm.appendChild(mi); d.appendChild(pm);
      if(ev && ev.type === "score" && ev.i === t.i && ev.n){ d.classList.add("bump"); var f = h("span", "fly", (ev.n > 0 ? "+" : "") + ev.n); f.style.color = ev.n > 0 ? "#2e9d5b" : "#d64545"; d.appendChild(f); }
      box.appendChild(d);
    });
  }
  K.on(drawTeams);

  /* 머리줄 */
  function sndBtn(){ $("snd").setAttribute("aria-pressed", String(K.sound())); $("snd").textContent = K.sound() ? "🔊 소리" : "🔇 소리 끔"; }
  $("snd").onclick = function(){ K.sound(!K.sound()); sndBtn(); if(K.sound()) K.S.coin(); }; sndBtn();
  $("full").onclick = function(){ if(document.fullscreenElement) document.exitFullscreen(); else (document.documentElement.requestFullscreen || function(){}).call(document.documentElement); };
  function closeMenu(){ $("more").open = false; }
  document.addEventListener("click", function(e){ if(!$("more").contains(e.target)) closeMenu(); });
  $("mCount").onclick = function(){ closeMenu(); TT.ui.prompt("모둠 수 (2~8)", String(K.teams().length), "", function(v){ var n = Math.max(2, Math.min(8, parseInt(v, 10) || 4)); K.setCount(n); }); };
  $("mReset").onclick = function(){ closeMenu(); TT.ui.confirm("모둠 점수 0으로", "이 반의 모둠 점수를 모두 0으로 합니다. (수업 도구 🏆 모둠 점수도 같이 바뀝니다)", "0으로", function(){ K.resetScores(); }); };

  var sel = $("cls");
  if(TT.roster.classes().length) TT.ui.classSelect(sel, "class", function(c){ K.setClass(c); });
  else { sel.hidden = true; K.setClass(null); }
  drawTeams();
  window.addEventListener("hashchange", function(){ show(location.hash.slice(1)); });
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
