<!--
  🛤️ 수업 길 — 45분 6단계 수업 자료를 단원별로 미리 보고 검토·준비 (화면은 shared/lessonroad.js, 교과서·수업 모드와 같은 화면)
  · 자료: shared/lessonkit.js (견본: 중1 소인수분해 PRIME · 중2 피타고라스 PYTH · 중3 이차방정식 QE)
  · 교과서·수업 모드 아래쪽 🛤️ 수업 길 줄(Shift+1~6)과 같은 화면입니다. 이 화면은 수업 준비·검토용.
  · 숫자키 1~6 단계 · ← → 단계 이동 · 답은 눌러야 보임(수업 중 실수로 정답이 보이지 않게)
  · 저장 "tt_lessonkit_v1" { u: 마지막 단원, s: 마지막 단계, rv: {단원: 검토 날짜} } — 이 기기에만
  jidangmath가 Claude와 함께 제작
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap;gap:6px;align-items:center}
  main{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px;padding:10px!important;min-height:0}
  nav.units{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:0;overflow:auto}
  nav.units button{font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  nav.units button b{font-size:15px}
  nav.units button small{color:var(--sub);font-size:12px;font-weight:700}
  nav.units button[aria-current=true]{border-color:var(--accent);background:var(--accent-soft)}
  nav.units .soon{color:#b3bac2;font-size:12.5px;line-height:1.5;margin-top:6px}
  .view{display:flex;flex-direction:column;gap:8px;min-height:0}
  .road{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .road button{font:inherit;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
  .road button b{font-size:clamp(13px,1.2vw,16px)}
  .road button small{font-size:12px;color:var(--sub);font-weight:700}
  .road button.st{border-color:#9fd8c3}
  .road button.te{border-color:#cdc6f3}
  .road button[aria-current=true]{background:#222;border-color:#222;color:#fff}
  .road button[aria-current=true] small{color:#ddd}
  .road .tm{position:absolute;top:4px;right:8px;font-size:11px;color:inherit;opacity:.6}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .head h1{margin:0;font-size:clamp(20px,2.1vw,28px)}
  .head .g{font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:1px 8px}
  .head .sp{flex:1}
  .head a.btn{text-decoration:none}
  .rv{font:inherit;font-size:13px;font-weight:800;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
  .rv[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .pane{flex:1;min-height:0;display:grid;gap:8px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
  .box h3{margin:0;font-size:15px;display:flex;gap:6px;align-items:center}
  .box h3 small{margin-left:auto;color:var(--sub);font-weight:600;font-size:12px}
  .big{font-size:clamp(20px,2.4vw,34px);font-weight:800;line-height:1.45}
  .mid{font-size:clamp(15px,1.4vw,19px);line-height:1.6}
  .ans{font:inherit;font-size:14px;font-weight:800;border:1.5px dashed var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;align-self:flex-start}
  .ansv{font-size:clamp(15px,1.4vw,19px);font-weight:700;color:var(--danger);background:#fff6f3;border-radius:10px;padding:8px 12px;line-height:1.55}
  .talk{display:flex;flex-direction:column;gap:6px}
  .talk p{margin:0;padding:7px 12px;border-radius:14px;max-width:88%;line-height:1.55;font-size:clamp(14px,1.25vw,17px)}
  .talk .T{background:var(--accent-soft);align-self:flex-start}
  .talk .S{background:#f3f3f3;align-self:flex-end;color:#555}
  .talk p b{font-size:12px;display:block;opacity:.7}
  .scene p{margin:0 0 .5em;line-height:1.65;font-size:clamp(14px,1.25vw,17px)}
  .fact{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45}
  .fact i{flex:none;font-style:normal;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px}
  .fact i.r{background:var(--ok-soft);color:var(--ok)}
  .fact i.l{background:var(--wait-soft);color:var(--wait)}
  .pp{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.5}
  .pp b{font-size:15px}
  .pp .w{color:var(--sub);font-size:12px;font-weight:700}
  .why{font-size:14px;line-height:1.6}
  .why b{color:var(--accent)}
  .q3{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .q3 .k{font-size:12px;font-weight:800;color:#fff;border-radius:6px;padding:1px 8px;align-self:flex-start}
  ol.steps{margin:0;padding-left:1.3em;font-size:clamp(15px,1.4vw,19px);line-height:1.75}
  .sw a{font-weight:800}
  .sw div{font-size:14px;line-height:1.5;margin-bottom:4px}
  .words{display:flex;flex-wrap:wrap;gap:8px}
  .words button{font:inherit;font-size:clamp(15px,1.4vw,19px);font-weight:800;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
  .words button[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .timer{display:flex;align-items:center;gap:10px}
  .timer b{font-size:clamp(30px,3.4vw,48px);font-variant-numeric:tabular-nums}
  .timer button{font:inherit;font-weight:800;border:2px solid #222;background:#fff;border-radius:12px;padding:6px 14px;cursor:pointer}
  .can button{font:inherit;text-align:left;font-size:clamp(15px,1.4vw,19px);font-weight:700;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;width:100%;margin-bottom:6px}
  .can button[aria-pressed=true]{background:#fff8e1;border-color:#e0a526}
  .can button[aria-pressed=true]::before{content:"⭐ "}
  .line{font-size:clamp(17px,1.8vw,24px);font-weight:800;line-height:1.5;background:linear-gradient(90deg,#fff8e1,#fff);border-left:5px solid #e0a526;padding:10px 14px;border-radius:0}
  @media (max-width:900px){
    body{height:auto!important;min-height:100dvh;overflow:auto!important}
    main{grid-template-columns:1fr}
    .road{grid-template-columns:repeat(3,1fr)}
    .pane{grid-template-columns:1fr!important}
    .box{overflow:visible}
  }
</style>

<body>
<header>
  <div>
    <a class="back" href="../../">← 쌤 노트</a>
    <h1>🛤️ 수업 길 <span class="lead" style="display:inline">45분 6단계 · 다시 꺼내기 → 이야기 → 배우기 → 해 보기 → 가르치기 → 마무리</span></h1>
  </div>
  <div class="bar">
    <a class="btn" href="../book/">📘 교과서·수업 모드</a>
  </div>
</header>
<main class="panel">
  <nav class="units" id="units" aria-label="단원"></nav>
  <section class="view" id="view"></section>
</main>
<footer>
  <span>숫자키 1~6 단계 · ← → 이동 · 답·정답은 눌러야 보여요 · 🟩 학생이 직접 하는 단계 · 🟪 선생님이 여는 단계</span>
  <span class="priv">🔒 검토 표시는 이 기기에만 · 실제 수업은 교과서·수업 모드에서 (아래쪽 🛤️ 수업 길 줄)</span>
</footer>
<script src="../../shared/tt.js"></script>
<script src="../../shared/exam-data.js"></script>
<script src="../../shared/challenge.js"></script>
<script src="../../shared/concepts.js"></script>
<script src="../../shared/mathgen.js"></script>
<script src="../../shared/lessonkit.js"></script>
<script src="../../shared/mathlab.js"></script>
<script src="../../shared/mathtools.js"></script>
<script src="../../shared/lessonroad.js"></script>
<script>
(function(){
  "use strict";
  var K = window.TT_LESSONKIT, KEY = "tt_lessonkit_v1", $ = function(id){ return document.getElementById(id); };
  var S = (function(){ try{ return JSON.parse(localStorage.getItem(KEY) || "null") || {}; }catch(e){ return {}; } })();
  S.rv = S.rv || {};
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
  var CODES = Object.keys(K.units).sort(function(a, b){ return K.units[a].g - K.units[b].g; });
  var q = (location.search.match(/[?&]u=([A-Z0-9]+)/) || [])[1];
  var cur = q && K.units[q] ? q : (S.u && K.units[S.u] ? S.u : CODES[0]), step = S.s || 1;

  function drawUnits(){
    $("units").innerHTML = CODES.map(function(c){ var u = K.units[c]; return '<button data-u="' + c + '" aria-current="' + (c === cur) + '"><small>중' + u.g + (S.rv[c] ? " · ✔ 검토함" : "") + "</small><b>" + esc(u.title) + "</b></button>"; }).join("")
      + '<div class="soon">견본 3단원이에요.<br>검토 뒤 중학교 25단원을 같은 틀로 채워요.<br><br><a href="../mlab/">🧪 수학 실험실 전체 보기</a></div>';
  }
  function road(){
    return '<div class="road" role="tablist">' + K.steps.map(function(s){ return '<button role="tab" data-s="' + s.id + '" class="' + (s.who === "학생" ? "st" : "te") + '" aria-current="' + (s.id === step) + '"><span class="tm">' + s.m + "분</span><b>" + s.ic + " " + s.id + "</b><small>" + s.n + "</small></button>"; }).join("") + "</div>";
  }
  function draw(){
    var u = K.units[cur]; S.u = cur; S.s = step; save(); drawUnits();
    $("view").innerHTML = '<div class="head"><span class="g">중' + u.g + "</span><h1>" + esc(u.title) + '</h1><span class="sp"></span><button class="rv" id="rv" aria-pressed="' + !!S.rv[cur] + '">' + (S.rv[cur] ? "✔ 검토함" : "검토 표시") + "</button></div>" + road() + '<div id="rdHost" style="flex:1;min-height:0"></div>';
    TT_ROAD.render($("rdHost"), {code: cur, step: step, redraw: draw});
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.u){ cur = b.dataset.u; draw(); return; }
    if(b.dataset.s){ step = +b.dataset.s; draw(); return; }
    if(b.id === "rv"){ if(S.rv[cur]) delete S.rv[cur]; else S.rv[cur] = new Date().toISOString().slice(0, 10); save(); draw(); return; }
  });
  document.addEventListener("keydown", function(e){
    if(/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) return;
    if(/^[1-6]$/.test(e.key)){ step = +e.key; draw(); }
    else if(e.key === "ArrowRight" && step < 6){ step++; draw(); }
    else if(e.key === "ArrowLeft" && step > 1){ step--; draw(); }
  });
  draw();
})();
</script>
</body>
