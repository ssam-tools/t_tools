<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<link rel="stylesheet" href="../../shared/tt.css">
<title>나이스 사진 이름 · 선생님 도구 모음</title>
<!--
  반 사진 파일을 명렬표 순서대로 "이름(번호).jpg"처럼 바꾸고, 필요하면 용량을 줄여 ZIP 하나로 내려받습니다.
  · 명단은 학급 명렬표(TT.roster)에서 가져옵니다. 엑셀 파일을 따로 올리지 않습니다.
  · 사진은 이 기기 안에서만 처리합니다. 저장하거나 전송하지 않고, 원본 파일은 바뀌지 않습니다.
  · 용량 줄이기 방식은 예전 실행파일(photo_tool.py)과 같습니다: 화질을 먼저 낮추고, 부족하면 크기를 10%씩 줄입니다.
  · 기억하는 것: 이름 형식과 목표 용량 설정뿐 ("tt_photo_v1").
-->
<style>
  main.panel{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:clamp(10px,2vw,18px)}
  .side{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,12px);min-height:0}
  .step{display:flex;flex-direction:column;gap:5px}
  .step > b{font-size:13.5px}
  .step .sub{font-size:12.5px;color:var(--sub);line-height:1.45}
  .step input[type=text],.step input[type=number]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
  .step select{max-width:none;width:100%}
  .inline{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
  .inline input[type=number]{width:84px}
  .go{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .go .btn{padding:11px 13px;font-size:15px}
  #prog{font-size:13px;color:var(--sub);min-height:18px}
  #list{min-width:0;min-height:0;display:grid;grid-auto-flow:column;gap:5px 12px;justify-content:start;align-content:start;overflow:auto}
  .it{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--line);border-radius:9px;padding:0 8px 0 3px;background:#fbfcfd;cursor:pointer;font:inherit;color:inherit;text-align:left}
  .it img,.it .ph0{flex:none;height:calc(100% - 6px);aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#e8edf2}
  .it .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .it .src{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
  .it.skip{background:#f1f3f5;border-style:dashed}
  .it.skip .nm{color:#9aa4ae;font-weight:400}
  .it.none{border-color:var(--danger);background:var(--danger-soft)}
  #empty{grid-column:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--sub);font-size:15px;line-height:1.65}
  #empty .big{font-size:40px}
  #empty b{color:var(--ink)}
  #stat.warn{color:var(--danger);font-weight:700}
  @media (max-width:760px){
    main.panel{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:8px}
    .side{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
    .step .sub{display:none}
    .go{grid-column:1 / -1;margin-top:0;flex-direction:row;align-items:center}
    .go .btn{flex:none;padding:9px 12px;font-size:14px}
    #empty{grid-column:1}
    #empty .big{font-size:30px}
    .it .src{display:none}
    .it{gap:5px;padding-right:5px}
    .it .nm{font-size:12.5px}
  }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../">← 도구 모음</a>
    <h1>📷 나이스 사진 이름</h1>
  </div>
  <div class="bar">
    <select id="clsSel" aria-label="학급 선택"></select>
  </div>
</header>
<main class="panel">
  <div class="side">
    <div class="step">
      <b>① 사진 고르기</b>
      <button type="button" class="btn primary" id="pick">📂 반 사진 한꺼번에 고르기</button>
      <span class="sub">번호 순서대로 찍은 사진을 모두 고르세요. 파일 이름 순서가 번호 순서가 됩니다. 이 화면에 끌어다 놓아도 됩니다.</span>
    </div>
    <div class="step">
      <b>② 이름 형식</b>
      <select id="fmt" aria-label="이름 형식"></select>
      <input type="text" id="custom" hidden maxlength="60" aria-label="직접 입력 형식" placeholder="{학년}학년 {반}반 {번호}번 {이름}">
      <span class="sub" id="ex"></span>
    </div>
    <div class="step">
      <b>③ 용량</b>
      <label class="inline"><input type="checkbox" id="shrink" checked> 사진 용량 줄이기 <input type="number" id="kb" min="10" max="5000" step="10" value="200" aria-label="목표 용량"> KB 이하</label>
      <span class="sub">끄면 이름만 바꿉니다. 켜면 JPG로 저장됩니다.</span>
    </div>
    <div class="go">
      <button type="button" class="btn primary" id="run" disabled>⬇ 바꿔서 한 파일(ZIP)로 받기</button>
      <span id="prog"></span>
    </div>
  </div>
  <div id="empty">
    <div class="big">📷</div>
    <div><b>반 사진을 골라 주세요.</b><br>명렬표 순서대로 한 명씩 짝지어 보여 줍니다.<br>사진이 없는 학생은 눌러서 건너뛸 수 있습니다.</div>
  </div>
  <div id="list" hidden></div>
</main>
<footer>
  <span id="stat"></span>
  <span class="priv">🔒 사진은 이 기기 안에서만 처리 · 저장·전송 안 함</span>
</footer>
<input type="file" id="files" accept="image/*" multiple hidden>

<script src="../../shared/tt.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var PREF = "tt_photo_v1";
  var FORMATS = [
    ["{이름}({번호})", "이름(번호) · 나이스 사진 올리기용"],
    ["{번호} {이름}", "번호 이름"],
    ["{학번} {이름}", "학번 이름"],
    ["{학번}", "학번만"],
    ["custom", "직접 입력…"]
  ];
  var cls = null, photos = [], skip = {}, urls = [], busy = false;
  var list = $("list");

  /* ---------- 설정 기억 ---------- */
  var pref = TT.store.get(PREF, {}) || {};
  FORMATS.forEach(function(f){ var o = document.createElement("option"); o.value = f[0]; o.textContent = f[1]; $("fmt").appendChild(o); });
  if(FORMATS.some(function(f){ return f[0] === pref.fmt; })) $("fmt").value = pref.fmt;
  $("custom").value = pref.custom || "";
  if(pref.kb >= 10) $("kb").value = pref.kb;
  if(pref.shrink === false) $("shrink").checked = false;
  function savePref(){ TT.store.set(PREF, {fmt:$("fmt").value, custom:$("custom").value, kb:kbValue(), shrink:$("shrink").checked}); }
  function kbValue(){ var n = parseInt($("kb").value, 10); return isFinite(n) && n >= 10 ? Math.min(n, 5000) : 200; }

  /* ---------- 이름 만들기 ---------- */
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function template(){ var f = $("fmt").value; return f === "custom" ? ($("custom").value.trim() || "{이름}({번호})") : f; }
  function makeName(s, c){
    var hakbun = (c.grade != null && c.cls != null) ? String(c.grade) + pad2(c.cls) + pad2(s.no) : String(s.no);
    var out = template().replace(/\{이름\}/g, s.name).replace(/\{번호\}/g, s.no).replace(/\{학번\}/g, hakbun)
      .replace(/\{학년\}/g, c.grade == null ? "" : c.grade).replace(/\{반\}/g, c.cls == null ? "" : c.cls);
    return out.replace(/[\\\/:*?"<>|]/g, "_").trim().replace(/[. ]+$/, "");
  }
  function naturalKey(a, b){ return a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:"base"}); }
  function extOf(name){ var m = /\.[A-Za-z0-9]+$/.exec(name); return m ? m[0].toLowerCase() : ".jpg"; }

  /* 학생 ↔ 사진 짝짓기: 건너뛴 학생을 빼고 순서대로 */
  function pairs(){
    if(!cls) return [];
    var k = 0, used = {}, shrink = $("shrink").checked;
    return cls.students.map(function(s){
      var p = {s:s, skip:!!skip[s.no], photo:null, name:""};
      if(!p.skip && k < photos.length){
        p.photo = photos[k]; p.idx = k; k++;
        var base = makeName(s, cls) || String(s.no), ext = shrink ? ".jpg" : extOf(p.photo.name), nm = base, n = 2;
        while(used[(nm + ext).toLowerCase()]){ nm = base + "_" + n; n++; }
        used[(nm + ext).toLowerCase()] = 1; p.name = nm + ext;
      }
      return p;
    });
  }

  /* ---------- 화면 ---------- */
  function layout(){
    var n = list.children.length; if(!n) return;
    var W = list.clientWidth, H = list.clientHeight, mobile = window.innerWidth <= 760, rg = 5, cg = 12;
    var minColW = mobile ? 100 : 230, minRow = mobile ? 26 : 34, maxRow = 56;
    var maxCols = Math.max(1, Math.floor((W + cg) / (minColW + cg))), cols = maxCols, c, rows;
    for(c = 1; c <= maxCols; c++){ rows = Math.ceil(n / c); if(rows * minRow + (rows - 1) * rg <= H){ cols = c; break; } }
    rows = Math.ceil(n / cols);
    var rowH = Math.max(minRow, Math.min(maxRow, Math.floor((H - (rows - 1) * rg) / rows)));
    list.style.gridTemplateRows = "repeat(" + rows + ", " + rowH + "px)";
    list.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, " + (mobile ? "1fr" : "320px") + "))";
  }
  function render(){
    var has = photos.length > 0 && !!cls;
    $("empty").hidden = has; list.hidden = !has;
    var ex = cls && cls.students[0] ? makeName(cls.students[0], cls) : "";
    $("ex").textContent = ex ? "예) " + ex + ($("shrink").checked ? ".jpg" : "") : "";
    $("custom").hidden = $("fmt").value !== "custom";
    list.textContent = "";
    var ps = pairs(), matched = 0, missing = 0;
    if(has) ps.forEach(function(p){
      var b = document.createElement("button"); b.type = "button"; b.className = "it"; b.dataset.no = p.s.no;
      var nm = document.createElement("span"); nm.className = "nm";
      if(p.photo){
        var im = document.createElement("img"); im.src = urls[p.idx]; im.alt = ""; im.loading = "lazy"; im.decoding = "async"; b.appendChild(im);
        nm.textContent = p.name; matched++;
        var src = document.createElement("span"); src.className = "src"; src.textContent = p.photo.name;
        b.appendChild(nm); b.appendChild(src);
        b.title = p.s.no + "번 " + p.s.name + " ← " + p.photo.name + " (누르면 이 학생을 건너뜁니다)";
      }else{
        var ph = document.createElement("span"); ph.className = "ph0"; b.appendChild(ph);
        nm.textContent = p.s.no + " " + p.s.name + (p.skip ? " · 건너뜀" : " · 사진 없음");
        b.appendChild(nm);
        if(p.skip){ b.classList.add("skip"); b.title = "누르면 다시 포함합니다"; }
        else{ b.classList.add("none"); missing++; b.title = "사진이 모자랍니다. 사진이 없는 학생을 눌러 건너뛰세요."; }
      }
      list.appendChild(b);
    });
    var st = $("stat"), extra = photos.length - matched;
    st.className = "";
    if(!cls){ st.textContent = "명렬표에 나이스 파일을 먼저 올려 주세요."; }
    else if(!photos.length){ st.textContent = cls.name + " · 학생 " + cls.students.length + "명"; }
    else{
      st.textContent = cls.name + " · 사진 " + photos.length + "장 · 짝지은 학생 " + matched + "명";
      if(extra > 0){ st.textContent += " · 남는 사진 " + extra + "장(바꾸지 않음)"; st.className = "warn"; }
      else if(missing > 0){ st.textContent += " · 사진 없는 학생 " + missing + "명 → 사진을 안 찍은 학생을 눌러 건너뛰세요"; st.className = "warn"; }
    }
    $("run").disabled = busy || !matched;
    layout();
  }
  if(window.ResizeObserver) new ResizeObserver(layout).observe(list); else window.addEventListener("resize", layout);

  list.addEventListener("click", function(e){
    var b = e.target.closest(".it"); if(!b || busy) return;
    var no = b.dataset.no; if(skip[no]) delete skip[no]; else skip[no] = 1;
    render();
  });

  /* ---------- 사진 고르기 ---------- */
  function setPhotos(fileList){
    var arr = Array.prototype.filter.call(fileList, function(f){ return /^image\//.test(f.type) || /\.(jpe?g|png|bmp|gif|webp)$/i.test(f.name); });
    if(!arr.length){ TT.ui.toast("사진 파일이 없습니다."); return; }
    urls.forEach(function(u){ URL.revokeObjectURL(u); });
    photos = arr.sort(naturalKey); urls = photos.map(function(f){ return URL.createObjectURL(f); }); skip = {};
    $("prog").textContent = ""; render();
  }
  $("pick").onclick = function(){ $("files").value = ""; $("files").click(); };
  $("files").addEventListener("change", function(){ if(this.files && this.files.length) setPhotos(this.files); });
  function hasFiles(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") >= 0; }
  ["dragenter","dragover"].forEach(function(ev){ window.addEventListener(ev, function(e){ if(hasFiles(e)){ e.preventDefault(); document.body.classList.add("drag"); } }); });
  window.addEventListener("dragleave", function(e){ if(!e.relatedTarget) document.body.classList.remove("drag"); });
  window.addEventListener("drop", function(e){ if(!hasFiles(e)) return; e.preventDefault(); document.body.classList.remove("drag"); setPhotos(e.dataTransfer.files); });

  ["fmt","custom","shrink","kb"].forEach(function(id){
    $(id).addEventListener(id === "custom" || id === "kb" ? "input" : "change", function(){ savePref(); render(); });
  });

  /* ---------- 용량 줄이기 (예전 실행파일과 같은 방식) ---------- */
  async function shrinkToJpeg(file, kb){
    var target = kb * 1024, bmp;
    try{ bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); }
    catch(e){ bmp = await createImageBitmap(file); }
    var w = bmp.width, h = bmp.height, cv = document.createElement("canvas");
    function draw(){ cv.width = w; cv.height = h; var g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h); }
    function blobAt(q){ return new Promise(function(res){ cv.toBlob(res, "image/jpeg", q / 100); }); }
    async function tryQuality(){
      var lo = 20, hi = 95, best = null;
      while(lo <= hi){
        var mid = (lo + hi) >> 1, b = await blobAt(mid);
        if(b && b.size <= target){ best = b; lo = mid + 1; } else hi = mid - 1;
      }
      return best;
    }
    draw();
    var data = await tryQuality();
    while(!data){
      if(w < 50 || h < 50){ data = await blobAt(20); break; }
      w = Math.floor(w * 0.9); h = Math.floor(h * 0.9); draw(); data = await tryQuality();
    }
    if(bmp.close) bmp.close();
    return data;
  }

  $("run").onclick = async function(){
    if(busy || !cls) return;
    var todo = pairs().filter(function(p){ return p.photo; }), shrink = $("shrink").checked, kb = kbValue(), out = [], fail = 0;
    busy = true; $("run").disabled = true;
    for(var i = 0; i < todo.length; i++){
      $("prog").textContent = "바꾸는 중… " + (i + 1) + " / " + todo.length;
      try{
        var blob = shrink ? await shrinkToJpeg(todo[i].photo, kb) : todo[i].photo;
        out.push({name: todo[i].name, data: new Uint8Array(await blob.arrayBuffer())});
      }catch(e){ fail++; }
    }
    busy = false;
    if(!out.length){ $("prog").textContent = ""; TT.ui.toast("사진을 읽지 못했습니다. JPG나 PNG 사진인지 확인해 주세요."); render(); return; }
    var zipName = TT.util.safe(cls.name) + "_사진_" + TT.util.today() + ".zip";
    TT.util.download(zipName, TT.file.zip(out));
    var big = out.reduce(function(m, f){ return Math.max(m, f.data.length); }, 0);
    $("prog").textContent = "완료: " + out.length + "장" + (fail ? " · 실패 " + fail + "장" : "") + (shrink ? " · 가장 큰 사진 " + Math.ceil(big / 1024) + "KB" : "");
    TT.ui.toast(zipName + " 파일을 저장했습니다. 압축을 풀어 나이스에 올리세요. 원본 사진은 그대로입니다.");
    render();
  };

  TT.ui.classSelect($("clsSel"), "photo", function(c){ cls = c; skip = {}; render(); });
})();
</script>
</body>
</html>
