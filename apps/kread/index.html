<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 학생용 · 외부로 자료를 보내는 통로를 막습니다(이 사이트 안의 파일만). 기록은 이 기기 브라우저에만 저장(kr_read_v1). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b4c9b">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<title>국어 근육 · 읽기·어휘 훈련</title>
<!--
  📖 국어 근육 (국어 팩, PLAN_국어.md) — 학생이 각자 휴대폰으로 하는 비문학 읽기·어휘 훈련
  · 오늘: 어휘 5개 → 지문 1편 (하루 10분)
  · 읽기: 보통 / 페이서 / 끊어 읽기, 문제 먼저 훑기 → 지문 가림 → 한 줄 요약 → 문항 → 속도·정답률·유효 속도
  · 어휘: 간격 반복 복습, 한자로 묶어 보기, 단어장 / 성장: 그래프·배지
  · 자료: data.js (KR_DATA). 이름·로그인 없음. 저장: localStorage "kr_read_v1"
-->
<style>
  :root{--ac:#2b4c9b;--ac2:#e8eefb;--ink:#1d2533;--sub:#667085;--line:#e3e7ee;--ok:#1f8a5b;--okb:#e5f5ec;--ng:#c8372d;--ngb:#fdecea;--warn:#b26a00;--bg:#f5f7fb;--fs:17px}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
  #app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto;background:var(--bg)}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top))}
  header h1{font-size:19px;font-weight:900;flex:1;letter-spacing:-.3px}
  header h1 small{font-size:12.5px;color:var(--sub);font-weight:600;margin-left:6px}
  .ib{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:36px;height:34px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
  main{min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 14px 10px;gap:10px}
  nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;color:var(--sub);padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  nav button b{font-size:21px;line-height:1}
  nav button[aria-current=true]{color:var(--ac)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .sc{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
  .grow{flex:1;min-height:0}
  .btn{display:block;width:100%;border:0;border-radius:14px;background:var(--ac);color:#fff;font:inherit;font-size:17px;font-weight:800;padding:14px;cursor:pointer}
  .btn.sub{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}
  .btn.gray{background:#eef1f6;color:var(--ink)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .muted{color:var(--sub);font-size:13.5px}
  h2{font-size:18px;font-weight:900}
  .seg{display:flex;background:#e9edf4;border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;border-radius:10px;font:inherit;font-size:14px;font-weight:800;color:var(--sub);padding:8px 4px;cursor:pointer}
  .seg button[aria-pressed=true]{background:#fff;color:var(--ac);box-shadow:0 1px 3px #0001}
  .seg button:disabled{opacity:.4}
  /* 오늘 */
  .hero{background:linear-gradient(135deg,#2b4c9b,#4a6fd1);color:#fff;border-radius:18px;padding:16px}
  .hero .t{font-size:13.5px;opacity:.85}.hero .big{font-size:23px;font-weight:900;margin-top:2px}
  .hero .fire{float:right;text-align:center;font-weight:900;font-size:13px}.hero .fire b{display:block;font-size:26px}
  .step{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .step .n{width:34px;height:34px;border-radius:50%;background:var(--ac2);color:var(--ac);font-weight:900;display:grid;place-items:center;flex:none}
  .step.done .n{background:var(--ok);color:#fff}
  .step .tx{flex:1;min-width:0}.step .tx b{display:block;font-size:16px}.step .tx span{font-size:13px;color:var(--sub)}
  .tip{background:#fff7e6;border:1px solid #f4dca8;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
  .tip button{margin-left:auto;white-space:nowrap;flex:none;border:0;background:#b26a00;color:#fff;border-radius:9px;padding:6px 10px;font:inherit;font-size:13px;font-weight:800}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:21px;font-weight:900;color:var(--ac)}.stat span{font-size:12px;color:var(--sub)}
  /* 지문 목록 */
  .plist{display:flex;flex-direction:column;gap:8px}
  .pi{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;font:inherit;width:100%}
  .pi .tg{font-size:11.5px;font-weight:800;color:var(--ac);background:var(--ac2);border-radius:7px;padding:3px 6px;flex:none}
  .pi .tt{flex:1;min-width:0}.pi .tt b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi .tt span{font-size:12.5px;color:var(--sub)}
  .pi .bs{font-size:12px;color:var(--ok);font-weight:800;text-align:right;flex:none}
  .opt{display:flex;flex-direction:column;gap:8px}
  .mode{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;width:100%}
  .mode[aria-pressed=true]{border-color:var(--ac);background:var(--ac2)}
  .mode b{font-size:15.5px}.mode span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
  .mode i{font-style:normal;font-size:22px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;padding:4px 2px}
  .chk input{width:20px;height:20px;accent-color:var(--ac)}
  .pace{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .pace input{flex:1;accent-color:var(--ac)}
  /* 읽기 */
  .rtop{display:flex;align-items:center;gap:8px}
  .rtop .clk{font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;color:var(--ac);margin-left:auto}
  .pctl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--sub)}
  .text{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 15px;font-size:var(--fs);line-height:1.85;word-break:keep-all}
  .text p{margin-bottom:.9em;text-indent:.6em}.text p:last-child{margin-bottom:0}
  .poem p{white-space:pre-line;text-indent:0;margin-bottom:1.3em;padding-left:.4em}
  .text .u{border-radius:5px;transition:background .15s,color .15s}
  .text.pacing .u{color:#a5adbb}.text.pacing .u.past{color:#5b6576}.text.pacing .u.on{color:var(--ink);background:#fff1a8}
  .gist{display:block;margin:-.4em 0 1em;font-size:13.5px;line-height:1.5;color:var(--ac);background:var(--ac2);border-radius:9px;padding:6px 9px;text-indent:0}
  /* 문항 */
  .qbar{display:flex;gap:4px}.qbar i{flex:1;height:6px;border-radius:3px;background:#dfe4ec}.qbar i.ok{background:var(--ok)}.qbar i.ng{background:var(--ng)}.qbar i.cur{background:var(--ac)}
  .qk{font-size:12.5px;font-weight:800;color:var(--ac)}
  .q{font-size:17.5px;font-weight:800;line-height:1.5;word-break:keep-all}
  .glist{list-style:none;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;flex:none;font-size:14.5px;line-height:1.45;word-break:keep-all}
  .qa{display:flex;flex-direction:column;gap:10px}
  .glist b{color:var(--ac);margin-right:4px}
  .mwrap{display:flex;flex-direction:column;gap:4px}
  .mb{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:15px;line-height:1.75;word-break:keep-all}
  .mb .ml{flex:none;min-width:58px;font-size:12px;font-weight:900;color:var(--ac);background:var(--ac2);border-radius:7px;padding:2px 6px;text-align:center;line-height:1.6;margin-top:3px}
  .mar{text-align:center;color:var(--sub);font-size:12px;line-height:1}
  .mtb{width:100%;border-collapse:separate;border-spacing:4px;font-size:14px;line-height:1.7;word-break:keep-all}
  .mtb th{font-size:13px;color:var(--ac);background:var(--ac2);border-radius:8px;padding:4px}
  .mtb td{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 7px;vertical-align:top}
  .mtb td:first-child{font-size:12px;font-weight:900;color:var(--sub);background:none;border:0;padding:6px 0;width:52px}
  .slot{display:inline-block;min-width:58px;border:0;border-bottom:2px solid var(--ac);background:#eef2fb;border-radius:6px 6px 0 0;font:inherit;font-weight:800;color:var(--ac);padding:0 6px;margin:0 2px;line-height:1.5;cursor:pointer;vertical-align:baseline}
  .slot.sel{background:#fff1c2;border-color:#d99a00}
  .slot.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.slot.ng{background:var(--ngb);border-color:var(--ng);color:var(--ng)}
  .slot small{font-size:11px;color:var(--ok);margin-left:4px}
  .bank{display:flex;flex-wrap:wrap;gap:6px;flex:none;max-height:22dvh;overflow:auto}
  .bank button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .bank button:disabled{opacity:.25}
  .kbar{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:13.5px}
  .kbar i{display:block;height:10px;border-radius:6px;background:#eef1f6;overflow:hidden}.kbar i b{display:block;height:100%;background:var(--ac);border-radius:6px}
  .kbar.lo i b{background:var(--ng)}.kbar em{font-style:normal;text-align:right;color:var(--sub)}
  .snt{display:flex;flex-direction:column;gap:7px}
  .snt div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:15px;line-height:1.55;word-break:keep-all;display:flex;gap:8px;align-items:flex-start}
  .snt div p{flex:1}.snt div small{color:var(--sub);font-size:11.5px;display:block}
  .snt div button{border:0;background:none;color:var(--sub);font-size:17px;cursor:pointer}
  .chk2{display:flex;flex-wrap:wrap;gap:6px}.chk2 span{font-size:13px;border-radius:999px;padding:4px 10px;background:#eef1f6;color:var(--sub)}.chk2 span.on{background:var(--okb);color:var(--ok);font-weight:800}
  @media (max-height:760px){.vtip{display:none}}
  .dlv{font-size:40px;font-weight:900;color:var(--ac);line-height:1.1}
  .ch{display:flex;flex-direction:column;gap:8px}
  .ch button{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;font:inherit;font-size:15.5px;text-align:left;line-height:1.45;cursor:pointer;word-break:keep-all;display:flex;gap:8px}
  .ch button em{font-style:normal;font-weight:900;color:var(--ac)}
  .ch button.ok{border-color:var(--ok);background:var(--okb)}.ch button.ng{border-color:var(--ng);background:var(--ngb)}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ox button{border:1.5px solid var(--line);background:#fff;border-radius:16px;font:inherit;font-size:40px;font-weight:900;padding:14px 0;cursor:pointer}
  .ox button.ok{border-color:var(--ok);background:var(--okb);color:var(--ok)}.ox button.ng{border-color:var(--ng);background:var(--ngb);color:var(--ng)}
  .fb{border-radius:13px;padding:11px 13px;font-size:14.5px;line-height:1.55;word-break:keep-all}
  .fb.ok{background:var(--okb)}.fb.ng{background:var(--ngb)}.fb b{display:block;font-size:15.5px;margin-bottom:2px}
  .exs{font-size:15px;line-height:1.6;background:#f3f5f9;border-radius:12px;padding:10px 12px;word-break:keep-all}
  mark{background:#fff1a8;padding:0 2px;border-radius:3px;font-weight:800}
  textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:13px;padding:11px;resize:none;line-height:1.5}
  /* 결과 */
  .res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .res div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
  .res b{display:block;font-size:22px;font-weight:900}.res span{font-size:12px;color:var(--sub)}.res small{display:block;font-size:11.5px;font-weight:800;margin-top:2px}
  .res .main{background:var(--ac);border-color:var(--ac);color:#fff}.res .main span{color:#dbe4ff}
  .up{color:var(--ok)}.down{color:var(--ng)}.res .main .up,.res .main .down{color:#fff}
  .cmp{font-size:14px;line-height:1.55;word-break:keep-all}.cmp b{color:var(--ac)}
  /* 어휘 */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;font:inherit;cursor:pointer}
  .tile i{font-style:normal;font-size:26px}.tile b{display:block;font-size:16px;margin-top:4px}.tile span{font-size:12.5px;color:var(--sub)}
  .tile.wide{grid-column:1/-1;background:var(--ac);color:#fff;border-color:var(--ac)}.tile.wide span{color:#dbe4ff}
  .wcard{text-align:center;display:flex;flex-direction:column;gap:10px}
  .wcard .w{font-size:34px;font-weight:900;letter-spacing:1px}
  .wcard .h{font-size:20px;color:var(--sub);font-weight:700}
  .hb{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .hb span{background:var(--ac2);color:var(--ac);border-radius:10px;padding:5px 9px;font-size:14px;font-weight:800}
  .wcard .m{font-size:17px;font-weight:700;line-height:1.5;word-break:keep-all}
  .syn{font-size:14px;color:var(--ok);font-weight:800}
  .hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;flex:none;max-height:34dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:1px}
  .hgrid button{background:#fff;border:1px solid var(--line);border-radius:12px;font:inherit;padding:8px 0 6px;cursor:pointer}
  .hgrid button b{display:block;font-size:24px;font-family:"Noto Serif KR","Batang",serif}
  .hgrid button span{font-size:11px;color:var(--sub)}
  .hgrid button[aria-pressed=true]{border-color:var(--ac);background:var(--ac2)}
  .hgrid button.all{border-color:var(--ok)}
  .wl{display:flex;flex-direction:column;gap:6px}
  .wl button{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;text-align:left;cursor:pointer}
  .wl button b{font-size:15.5px;min-width:64px}.wl button span{flex:1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv{font-size:11px;font-weight:900;border-radius:7px;padding:3px 6px;flex:none}
  .lv0{background:#eef1f6;color:var(--sub)}.lv1{background:#fff3d6;color:var(--warn)}.lv2{background:var(--okb);color:var(--ok)}
  /* 성장 */
  .chart{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 10px 4px}
  .chart svg{width:100%;height:auto;display:block}
  .days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
  .days i{aspect-ratio:1;border-radius:5px;background:#e3e7ee}.days i.r{background:#9fb4ea}.days i.f{background:var(--ac)}.days i.t{outline:2px solid var(--ink);outline-offset:1px}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badges span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:13px;font-weight:800}
  .badges span.off{opacity:.35;filter:grayscale(1)}
  .link{background:none;border:0;font:inherit;font-size:13px;color:var(--sub);text-decoration:underline;cursor:pointer}
  /* 창 */
  .ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:9}
  .ov .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
  .addr{font-size:13px;word-break:break-all;background:#f3f5f9;border-radius:10px;padding:9px;user-select:all}
  @media (max-height:640px){.hero{padding:12px}.hero .big{font-size:20px}.step{padding:9px 12px}.btn{padding:12px}.q{font-size:16.5px}.ch button{padding:10px 12px;font-size:15px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📖 국어 근육<small id="hsub">읽기·어휘 훈련</small></h1>
    <button class="ib" onclick="fontSize(-1)" aria-label="글자 작게">가−</button>
    <button class="ib" onclick="fontSize(1)" aria-label="글자 크게">가+</button>
    <button class="ib" onclick="about()" aria-label="안내">ⓘ</button>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-t="today" onclick="go('today')"><b>☀️</b>오늘</button>
    <button data-t="read" onclick="go('read')"><b>📄</b>읽기</button>
    <button data-t="vocab" onclick="go('vocab')"><b>🔤</b>어휘</button>
    <button data-t="grow" onclick="go('grow')"><b>📈</b>성장</button>
  </nav>
</div>
<script src="data.js"></script>
<script>
"use strict";
var D = KR_DATA, KEY = "kr_read_v1";
var W = {}; D.words.forEach(function(w){ W[w.w] = w; });
var HJ = {}; D.hanja.forEach(function(x){ HJ[x.h] = x; });
var P = {}; D.passages.forEach(function(p){ P[p.id] = p; p.chars = p.paras.join("").replace(/\s/g, "").length; });
if(D.diag) D.diag.chars = D.diag.paras.join("").replace(/\s/g, "").length;
var GAP = [0, 1, 3, 7, 16, 30];          // 상자(b)별 다음 복습까지 날 수. b ≥ 4 = 익힘

/* ── 저장 (이 기기에만) ── */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY) || "null") || {}; }catch(e){ return {}; } }
var S = Object.assign({v: 1, lv: 1, reads: [], wd: {}, days: {}, fs: 17, best: 0}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function ymd(d){ d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function day(k){ k = k || ymd(); return S.days[k] || (S.days[k] = {r: 0, v: 0}); }
function active(k){ var x = S.days[k]; return !!x && (x.r > 0 || x.v > 0); }
function streak(){
  var n = 0, d = new Date();
  if(!active(ymd(d))) d.setDate(d.getDate() - 1);
  while(active(ymd(d))){ n++; d.setDate(d.getDate() - 1); }
  if(n > (S.best || 0)){ S.best = n; save(); }
  return n;
}

/* ── 작은 도구 ── */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a, n, not){ return shuffle(a.filter(function(x){ return not.indexOf(x) < 0; })).slice(0, n); }

var GL = "가나다라마바사아";

/* ════════ ✍️ 배운 단어로 문장 쓰기 (채점 없음) ════════ */
var SW = null;
function sentPick(skip){

  var studied = D.words.filter(function(w){ var r = S.wd[w.w]; return r && r.n > 0 && w.w !== skip; });
  var pool = studied.length ? studied : D.words.filter(function(w){ return w.w !== skip; }).slice(0, 20);
  pool = shuffle(pool).sort(function(a, b){ return (used[a.w] || 0) - (used[b.w] || 0) || ((S.wd[b.w] || {}).b || 0) - ((S.wd[a.w] || {}).b || 0); });
  return {w: pool[0], studied: !!studied.length};
}
function showSent(word){

    '<div class="card wcard" style="padding:12px"><div class="w" style="font-size:28px">' + esc(w.w) + '</div><div class="h">' + esc(w.h) + '</div><div class="m">' + esc(w.m) + '</div><div class="exs">예) ' + exHTML(w.ex) + "</div></div>" +

function diagStart(){

  view('<div><div class="qk">🧭 진단 읽기 · 약 3분</div><h2>나에게 맞는 단계 찾기</h2></div>' +

    '결과(읽기 속도 · 정답률 · 어휘)로 <b>시작 단계</b>를 추천해요. 서두르지 말고 평소처럼 읽어야 정확해요.</div>' +

}
function diagQs(){

    qs.push({k: "dv", q: "노란색 낱말 '" + w + "'의 뜻으로 알맞은 것은?", ex: x.ex, c: c, a: c.indexOf(x.m), e: w + " (" + x.h + ") : " + x.m});
  });

}
function diagResult(){
  var n = R.qs.filter(function(q){ return q.k !== "dv"; }).length, ok = 0, v = 0, vn = 0;
  R.qs.forEach(function(q, i){ if(q.k === "dv"){ vn++; if(R.ans[i]) v++; } else if(R.ans[i]) ok++; });
  var a = ok / n, cpm = Math.round(R.p.chars / (R.sec / 60)), fast = cpm > 1300, lv = 1;
  if(a >= 0.8 && (fast || cpm >= 450) && v >= 4) lv = 2;

          : lv === 2 ? "내용을 잘 파악하고 있어요. 고1 모의고사 길이의 글로 속도와 정확도를 함께 키워요."
          : a < 0.6 ? "먼저 짧은 글에서 문단마다 핵심 문장을 잡는 연습부터 해요. 정확하게 읽는 것이 먼저예요."
          : v < 4 ? "이해는 좋아요. 어휘를 늘리면 금방 다음 단계로 갈 수 있어요. 어휘 훈련을 함께 해요."

  R.dg = {d: ymd(), cpm: cpm, a: Math.round(a * 100) / 100, v: v, lv: lv};
  view('<div><div class="qk">🧭 진단 결과 · ' + mmss(R.sec) + ' 걸림</div><h2>추천 시작 단계</h2></div>' +
    '<div class="res"><div><b>' + cpm + '</b><span>읽기 속도 (자/분)</span></div><div><b>' + ok + "/" + n + '</b><span>내용 이해</span></div><div><b>' + v + "/" + vn + '</b><span>어휘</span></div></div>' +
    '<div class="card" style="text-align:center"><div class="dlv">' + lv + '단계</div><div class="muted">' + esc((D.levels.filter(function(l){ return l.lv === lv; })[0] || {}).desc || "") + '</div><p class="cmp" style="margin-top:8px">' + why + "</p>" +
    (fast ? '<p class="muted">⚠️ 읽기 속도가 너무 빨라요. 끝까지 읽지 않았다면 속도는 빼고 추천했어요.</p>' : "") + "</div>" +

    '<div class="grow"></div><button class="btn" onclick="diagSave(' + lv + ')">' + lv + "단계로 시작하기</button>");

  view('<div class="rtop"><b>🀄 한자로 묶어 보기</b><button class="link" style="margin-left:auto" onclick="go(\'vocab\')">← 어휘</button></div>' +
    '<div class="hgrid">' + D.hanja.map(function(h){ var all = h.words.every(function(w){ var r = S.wd[w]; return r && r.b >= 4; }); return '<button aria-pressed="' + (h.h === HSEL) + '" class="' + (all ? "all" : "") + '" onclick="HSEL=\'' + h.h + '\';showHanja()"><b>' + h.h + "</b><span>" + h.hun + " " + h.eum + "</span></button>"; }).join("") + "</div>" +
    (x ? '<div class="card sc grow" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:12px"><b style="font-size:44px;font-family:Batang,serif">' + x.h + '</b><div><b style="font-size:18px">' + x.hun + " " + x.eum + '</b><div class="muted">이 한자가 들어간 단어 ' + x.words.length + "개</div></div></div>" +
      '<div class="wl">' + x.words.map(function(w){ return '<button onclick="wordPop(\'' + w + '\')"><b>' + w + "</b><span>" + esc(W[w].m) + "</span>" + lvTag(w) + "</button>"; }).join("") + "</div></div>" +
      '<button class="btn" onclick="vocabRun(HJ[HSEL].words,\'' + x.h + " " + x.hun + " " + x.eum + '\',showHanja)">이 한자 단어 퀴즈</button>'
      : '<div class="card cmp grow">위에서 한자를 누르세요. 한자 하나의 뜻을 알면 그 한자가 들어간 낯선 단어도 뜻을 짐작할 수 있어요.<br><br>예) <b>推</b>(헤아릴 추) → 추론 · 유추 · 추정 : 모두 "미루어 헤아린다"는 뜻이 들어 있어요.</div>'));
}
function lvTag(w){ var r = S.wd[w]; return !r || !r.n ? '<i class="lv lv0">아직</i>' : r.b >= 4 ? '<i class="lv lv2">익힘</i>' : '<i class="lv lv1">공부 중</i>'; }
function wordPop(w){ modal(cardHTML(W[w]) + '<div class="row"><button class="btn sub" data-close onclick="showSent(\'' + w + '\')">✍️ 이 단어로 문장</button><button class="btn" data-close>닫기</button></div>'); }
var BF = "all";
function showBook(){
  var L = D.words.filter(function(w){ var r = S.wd[w.w]; return BF === "all" || (BF === "new" ? !r || !r.n : BF === "ok" ? r && r.b >= 4 : r && r.n && r.b < 4); });
  view('<div class="rtop"><b>📒 단어장</b><button class="link" style="margin-left:auto" onclick="go(\'vocab\')">← 어휘</button></div>' +
    '<div class="seg">' + [["all", "전체"], ["study", "공부 중"], ["ok", "익힘"], ["new", "아직"]].map(function(f){ return '<button aria-pressed="' + (BF === f[0]) + '" onclick="BF=\'' + f[0] + '\';showBook()">' + f[1] + "</button>"; }).join("") + "</div>" +
    '<div class="wl sc grow">' + (L.length ? L.map(function(w){ return '<button onclick="wordPop(\'' + w.w + '\')"><b>' + w.w + "</b><span>" + esc(w.m) + "</span>" + lvTag(w.w) + "</button>"; }).join("") : '<div class="muted" style="padding:20px;text-align:center">해당하는 단어가 없어요.</div>') + "</div>");
}

/* ════════ 📈 성장 ════════ */
function chartSVG(rs){
  if(rs.length < 2) return '<div class="muted" style="padding:28px 8px;text-align:center">지문을 2편 이상 읽으면 그래프가 나와요.</div>';
  var w = 340, h = 150, l = 30, r = 10, t = 14, b = 22, mx = Math.max.apply(null, rs.map(function(x){ return Math.max(x.e, x.cpm); })) * 1.1;
  var X = function(i){ return l + (w - l - r) * (rs.length === 1 ? 0.5 : i / (rs.length - 1)); }, Y = function(v){ return t + (h - t - b) * (1 - v / mx); };
  var line = function(f, col, dash){ return '<polyline fill="none" stroke="' + col + '" stroke-width="2.5"' + (dash ? ' stroke-dasharray="4 4"' : "") + ' points="' + rs.map(function(x, i){ return X(i).toFixed(1) + "," + Y(f(x)).toFixed(1); }).join(" ") + '"/>'; };
  var grid = [0, 0.5, 1].map(function(k){ var v = Math.round(mx * k / 10) * 10; return '<line x1="' + l + '" x2="' + (w - r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e3e7ee"/><text x="' + (l - 4) + '" y="' + (Y(v) + 4) + '" font-size="10" text-anchor="end" fill="#667085">' + v + "</text>"; }).join("");
  var dots = rs.map(function(x, i){ return '<circle cx="' + X(i) + '" cy="' + Y(x.e) + '" r="3.5" fill="#2b4c9b"/>'; }).join("");
  var last = rs[rs.length - 1];
  return '<svg viewBox="0 0 ' + w + " " + h + '">' + grid + line(function(x){ return x.cpm; }, "#b9c6e6", true) + line(function(x){ return x.e; }, "#2b4c9b") + dots +
    '<text x="' + (X(rs.length - 1) - 4) + '" y="' + (Y(last.e) - 8) + '" font-size="12" font-weight="900" text-anchor="end" fill="#2b4c9b">' + last.e + "</text>" +
    '<text x="' + l + '" y="' + (h - 5) + '" font-size="10" fill="#667085">━ 유효 속도   ┅ 읽기 속도 (최근 ' + rs.length + "편)</text></svg>";
}
function showGrow(){
  var rs = readsSpeed().slice(-12), st = streak(), uniq = {}; S.reads.forEach(function(r){ uniq[r.p] = 1; });
  var acc = S.reads.length ? Math.round(avg(S.reads.slice(-10), function(r){ return r.a; }) * 100) : 0;
  var days = []; for(var i = 13; i >= 0; i--){ var k = addDays(-i), x = S.days[k]; days.push('<i class="' + (x && x.r > 0 && x.tv ? "f" : active(k) ? "r" : "") + (i === 0 ? " t" : "") + '" title="' + k + '"></i>'); }
  var B = [["🌱 첫 지문", S.reads.length >= 1], ["🔥 3일 연속", (S.best || 0) >= 3], ["🔥 7일 연속", (S.best || 0) >= 7], ["📚 지문 5편", Object.keys(uniq).length >= 5],
           ["🎯 만점", S.reads.some(function(r){ return r.a === 1; })], ["🧠 단어 20개 익힘", mastered() >= 20], ["🚀 2단계 도전", S.reads.some(function(r){ return (P[r.p] || {}).lv >= 2; })], ["⚡ 유효 속도 600", S.reads.some(function(r){ return r.e >= 600; })], ["🗺️ 구조도 5편", Object.keys(S.maps || {}).length >= 5], ["📕 오답 10개 해결", (S.wfix || 0) >= 10], ["✍️ 내 문장 10개", (S.sent || []).length >= 10]];
  view(
    (Object.keys(S.kst || {}).length ? '<button class="tip" style="width:100%;font:inherit;font-size:14px;cursor:pointer;text-align:left" onclick="showWrong()">📕 오답 노트 ' + wrongList().length + "문항 · 유형별 정답률 보기<b style=\"margin-left:auto\">›</b></button>" : "") +
    '<div class="stats"><div class="stat"><b>' + st + '</b><span>연속 일수 (최고 ' + (S.best || 0) + ')</span></div><div class="stat"><b>' + acc + '%</b><span>최근 정답률</span></div><div class="stat"><b>' + mastered() + '</b><span>익힌 단어</span></div></div>' +
    '<div class="chart">' + chartSVG(rs) + "</div>" +
    '<div><div class="muted" style="margin-bottom:5px">최근 14일 <span style="color:var(--ac)">■</span> 오늘 훈련 완료 <span style="color:#9fb4ea">■</span> 조금 함</div><div class="days">' + days.join("") + "</div></div>" +
    '<div class="badges">' + B.map(function(b){ return '<span class="' + (b[1] ? "" : "off") + '">' + b[0] + "</span>"; }).join("") + "</div>" +
    '<div class="grow"></div><div style="text-align:center;display:flex;justify-content:center;gap:18px"><button class="link" onclick="codeAsk()">📤 선생님께 결과 코드</button><button class="link" onclick="diagStart()">🧭 진단 다시 하기' + (S.diag ? " (" + S.diag.lv + "단계 추천받음)" : "") + '</button><button class="link" onclick="resetAsk()">기록 모두 지우기</button></div>'
  );
}
/* ── 📤 선생님께 결과 코드 (번호와 점수만, 이름 없음) — 교사용 화면(teach.html)에서 모아 봄 ── */
function codeChk(body){ var s = 0; for(var i = 0; i < body.length; i++) s += (i + 1) * body.charCodeAt(i); return ("0" + s % 97).slice(-2); }
function resultCode(no){
  var sp = readsSpeed(), rec = S.reads.slice(-10), d14 = 0;
  for(var i = 0; i < 14; i++) if(active(addDays(-i))) d14++;
  var f = [Math.max(0, Math.min(99999, +no || 0)), ymd().replace(/-/g, ""), S.lv === 9 ? 9 : Math.max(1, Math.min(3, S.lv || 1)), Math.min(9999, S.reads.length),
    rec.length ? Math.round(avg(rec, function(r){ return r.a; }) * 100) : 0, sp.length ? Math.round(avg(sp.slice(-3), function(r){ return r.e; })) : 0,
    Math.min(9999, mastered()), d14, Math.min(999, Object.keys(S.maps || {}).length)];
  var body = "KR1-" + f.join("-");
  return body + "-" + codeChk(body);
}
function codeAsk(){
  var o = modal('<h2>📤 선생님께 결과 코드</h2><p class="cmp">번호만 넣으면 <b>번호와 점수</b>만 담긴 코드가 만들어져요. <b>이름은 넣지 마세요.</b> 코드를 복사해 선생님이 알려 준 곳(쿨메신저·과제방 등)에 붙여 보내요.</p>' +
    '<div class="row" style="align-items:center"><span style="flex:none;font-weight:800">번호</span><input id="cno" type="number" inputmode="numeric" min="1" max="99999" placeholder="예) 12 또는 30512" value="' + (S.no || "") + '" style="font:inherit;font-size:18px;padding:9px 11px;border:1.5px solid var(--line);border-radius:11px;min-width:0"></div>' +
    '<div class="addr" id="ccode" style="font-size:16px;font-weight:800;text-align:center;letter-spacing:.3px">번호를 넣으세요</div>' +
    '<div class="muted">들어가는 것: 번호 · 날짜 · 단계 · 읽은 글 수 · 최근 정답률 · 유효 속도 · 익힌 단어 수 · 최근 14일 훈련일 · 구조도 수</div>' +
    '<div class="row"><button class="btn gray" data-close>닫기</button><button class="btn" id="ccopy" disabled>코드 복사</button></div>');
  var upd = function(){ var n = +$("cno").value; if(n > 0){ S.no = n; save(); $("ccode").textContent = resultCode(n); $("ccopy").disabled = false; } else { $("ccode").textContent = "번호를 넣으세요"; $("ccopy").disabled = true; } };
  $("cno").oninput = upd; upd();
  $("ccopy").onclick = function(){ var c = $("ccode").textContent, b = this; (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function(){ b.textContent = "복사했어요 ✓"; }, function(){ b.textContent = "코드를 길게 눌러 복사"; }); };
}
function resetAsk(){
  modal('<h2>기록을 모두 지울까요?</h2><p class="cmp">읽기 기록, 단어 공부 기록, 연속 일수가 모두 지워지고 되돌릴 수 없어요.</p>' +
    '<div class="row"><button class="btn gray" data-close>취소</button><button class="btn" style="background:var(--ng)" onclick="localStorage.removeItem(KEY);location.reload()">지우기</button></div>');
}

/* ── 시작 ── */
document.documentElement.style.setProperty("--fs", (S.fs || 17) + "px");
if(levels().indexOf(S.lv) < 0) S.lv = levels()[0];
go(/[?&]tab=(read|vocab|grow)/.test(location.search) ? RegExp.$1 : "today");
if("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(function(){});
</script>
</body>
