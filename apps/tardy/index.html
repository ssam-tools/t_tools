<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<title>출결·결석계·상담 · 쌤 노트</title>
<!--
  학생 생활지도(출결 포함)  — 예전 이름: 지각 관리 노트
  · 명단: 학급 명렬표의 "우리 반"(TT.roster.home). 프로그램 안에 학생 이름을 넣어 두지 않습니다.
  · 출결: 지각(무단/인정), 결석(병결/인정결/미인정결/기타)과 사유. 조퇴·결과는 다루지 않습니다.
  · 표시 기준: 무단 지각 연속 2일 이상(주황), 한 주 3회 이상(빨강) — 설정에서 바꿀 수 있음.
  · 결석신고서: 같은 학생의 이어진 결석을 한 건으로 묶어 양식(absence-form.hwpx)에 자동으로 채우고, 한글 파일로 저장하거나 인쇄합니다.
  · 저장: "tt_guide_v1" (이 기기 브라우저에만, 전체 백업에 포함). 예전 "tt_attend_v1"·"tt_counsel_v1" 자료는 처음 열 때 옮겨 옵니다.
-->
<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#18202b; --muted:#5a6676; --line:#d9e0e8;
  --accent:#1f5fbf; --accent-soft:#e4edfb; --cL:#2a3a52; --cA:#6a3d8f; --on:#fff;
  --caution:#9a5200; --caution-bg:#fff3de; --caution-fill:#f0a93b; --caution-on:#2b1a00;
  --alert:#b3261e; --alert-bg:#fdeae8; --alert-fill:#c4372e; --alert-on:#fff; --good:#1d6b45;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:1360px;margin:0 auto}
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px 2px}
.back{font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:700}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
h2{font-size:16px;margin:0 0 8px;font-weight:700}
h3{font-size:14px;margin:0 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.hl{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.hr{display:flex;align-items:center;gap:6px}
main{flex:1;min-height:0;overflow:hidden}
.view{height:100%;display:flex;flex-direction:column;gap:8px;padding:4px 16px 8px;min-height:0}
.scroll{overflow:auto;min-height:0}
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tab{flex:1;border:0;background:none;padding:10px 2px 11px;color:var(--muted);font-size:13px;border-top:3px solid transparent;margin-top:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-top-color:var(--accent)}
.tab .bd{display:inline-block;min-width:17px;padding:0 4px;border-radius:9px;background:var(--alert-fill);color:#fff;font-size:11px;font-weight:700;margin-left:3px;line-height:17px}
@media (min-width:900px){
  .tabs{order:1;border-top:0;border-bottom:1px solid var(--line);background:none;padding:0 16px;margin-top:2px}
  main{order:2}
  .tab{flex:none;padding:8px 18px;font-size:15px;border-top:0;border-bottom:3px solid transparent;margin:0 0 -1px}
  .tab[aria-selected="true"]{border-bottom-color:var(--accent)}
}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn-danger{color:var(--alert);border-color:var(--alert-fill)}
.btn-sm{padding:2px 9px;min-height:28px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.pill-alert{background:var(--alert-fill);border-color:var(--alert-fill);color:var(--alert-on)}
.pill-caution{background:var(--caution-fill);border-color:var(--caution-fill);color:var(--caution-on)}
.pill-good{color:var(--good);border-color:var(--good)}
.pill-A{color:var(--cA);border-color:var(--cA)}
.t-L{--c:var(--cL)} .t-A{--c:var(--cA)}
/* 입력 */
.daybar,.modebar{flex:none;display:flex;gap:6px;align-items:center}
.daybar input[type=date]{flex:1;min-width:0;text-align:center;font-weight:700}
.seg{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;min-height:42px;font-weight:700;cursor:pointer;color:var(--c,var(--ink))}
.seg[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.okbtn{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;min-height:42px;cursor:pointer;font-weight:700}
.okbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chips2{flex:1;min-height:0;display:grid;gap:6px;grid-auto-rows:minmax(46px,1fr);overflow:auto;align-content:stretch}
.chip2{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:2px;min-width:0;cursor:pointer;overflow:hidden}
.chip2 .cn{position:absolute;top:3px;left:6px;font-size:10.5px;color:var(--muted)}
.chip2 .cname{font-weight:700;font-size:14.5px;white-space:nowrap;line-height:1.2}
.chip2 .cst{font-size:11px;min-height:14px;line-height:14px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.chip2.has{background:var(--c);border-color:var(--c);color:var(--on)}
.chip2.has .cn{color:inherit;opacity:.8}
.chip2.has.appr{background:transparent;color:var(--c);border-width:2px}
.chip2.f-alert::after,.chip2.f-caution::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px}
.chip2.f-alert::after{background:var(--alert-fill)} .chip2.f-caution::after{background:var(--caution-fill)}
.chip2.f-alert:not(.has) .cst{color:var(--alert)} .chip2.f-caution:not(.has) .cst{color:var(--caution)}
.foot2{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between}
.counts{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.counts b{color:var(--ink)}
.donebtn{min-height:42px;padding:6px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:800;cursor:pointer;white-space:nowrap}
.donebtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.empty{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:16px}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13.5px}
/* 주간 */
.tiles{flex:none;display:flex;gap:8px}
.tile{flex:1;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;cursor:pointer;min-width:0}
.tile b{font-size:18px;line-height:1.2;margin-right:4px}
.tile span{font-size:12px;color:var(--muted)}
.tile.t-alert{border-color:var(--alert-fill);background:var(--alert-bg)} .tile.t-alert b{color:var(--alert)}
.tile.t-caution{border-color:var(--caution-fill);background:var(--caution-bg)} .tile.t-caution b{color:var(--caution)}
.tile[aria-pressed="true"]{outline:2px solid var(--accent)}
.wkgrid{flex:1;min-height:0;display:grid;grid-template-rows:34px;grid-auto-rows:minmax(26px,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto}
.wkrow{display:grid;grid-template-columns:minmax(86px,1.8fr) repeat(5,minmax(0,1fr)) 28px 58px;align-items:stretch;border-bottom:1px solid var(--line);min-height:26px}
.wkrow:last-child{border-bottom:0}
.wkrow>*{display:flex;align-items:center;justify-content:center;padding:1px;min-width:0}
.wkhead{font-size:12px;color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:1}
.wkhead button{border:0;background:none;cursor:pointer;color:inherit;line-height:1.1;width:100%;height:100%}
.wkhead .today{color:var(--accent);font-weight:800}
.wkrow.row-alert{background:var(--alert-bg)} .wkrow.row-caution{background:var(--caution-bg)}
.wkrow.row-alert .nm{box-shadow:inset 5px 0 0 var(--alert-fill)} .wkrow.row-caution .nm{box-shadow:inset 5px 0 0 var(--caution-fill)}
.nm{justify-content:flex-start!important;padding-left:12px!important}
.nm button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:700;white-space:nowrap;overflow:hidden;max-width:100%}
.nm button:hover{color:var(--accent);text-decoration:underline}
.no{color:var(--muted);font-weight:400;font-size:12px;margin-right:5px}
.dc{width:100%;height:100%;min-height:22px;max-height:34px;border:1px solid var(--line);background:transparent;border-radius:6px;font-size:12px;font-weight:800;color:var(--muted);padding:0;cursor:pointer}
.dc.has{background:var(--c);border-color:var(--c);color:var(--on)}
.dc.has.appr{background:transparent;color:var(--c);border-width:2px}
.dc.has.c-caution{background:var(--caution-fill);border-color:var(--caution-fill);color:var(--caution-on)}
.dc.has.c-alert{background:var(--alert-fill);border-color:var(--alert-fill);color:var(--alert-on)}
.dc.has.run{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--caution-fill)}
.dc:disabled{border-style:dashed;opacity:.5;cursor:default}
.sum{font-weight:800;font-size:13px}
.wkrow.row-alert .sum{color:var(--alert)}
.st{font-size:11.5px;font-weight:800;border-radius:999px;padding:0 6px;line-height:18px}
.legend{flex:none;display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.split{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.split>.main{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.side{display:none}
@media (min-width:900px){
  .split.two{flex-direction:row;gap:14px}
  .split.two>.main{flex:1.7;min-width:0}
  .split.two>.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
  .wkrow{grid-template-columns:minmax(120px,1.6fr) repeat(5,minmax(0,1fr)) 34px 84px}
  .chips2{grid-auto-rows:minmax(54px,1fr)}
  .chip2 .cname{font-size:16px}
  .mo{display:none!important}
}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.todo li:first-child{border-top:0;padding-top:0}
/* 학생 */
.kv{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:600px){.kv{grid-template-columns:repeat(3,1fr)}}
.kv div{border:1px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--surface)}
.kv b{display:block;font-size:18px;line-height:1.2}
.kv span{font-size:11.5px;color:var(--muted)}
.cal{display:grid;gap:4px;grid-template-columns:58px repeat(5,minmax(0,1fr));align-items:stretch}
.cal .wl{font-size:11.5px;color:var(--muted);display:flex;align-items:center}
.cal .wl.f-alert{box-shadow:inset -4px 0 0 var(--alert-fill);color:var(--alert);font-weight:800} .cal .wl.f-caution{box-shadow:inset -4px 0 0 var(--caution-fill);color:var(--caution);font-weight:800}
.cc{position:relative;min-height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cc small{font-size:10px;font-weight:400;opacity:.8}
.cc.has{background:var(--c);border-color:var(--c);color:var(--on)}
.cc.has.appr{background:transparent;color:var(--c);border-width:2px}
.cc.cs::before{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.cc:disabled{opacity:.4;cursor:default;border-style:dashed}
.cc.hol{background:transparent;border-style:dashed}
.log{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.log p{margin:4px 0;white-space:pre-wrap}
/* 폼 */
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-height:36px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
.err{color:var(--alert);font-size:13px;margin-top:6px}
table.plain{width:100%;border-collapse:collapse;font-size:13.5px}
.plain th,.plain td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.plain th:first-child,.plain td:first-child{text-align:left}
.plain td.l,.plain th.l{text-align:left}
.plain th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.bars{display:flex;gap:8px;align-items:flex-end;height:96px;padding-top:4px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:12px}
.bars i{display:block;width:100%;max-width:44px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.holrow{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:4px 0;font-size:14px}
/* 창 */
.modal{position:fixed;inset:0;background:rgba(8,12,18,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;max-width:700px;width:100%;max-height:94%;overflow:auto;padding:16px;border:1px solid var(--line)}
.sheet.wide{max-width:980px}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:92%;text-align:center}
@media (min-width:900px){#toast{bottom:24px}}
/* 결석신고서 편집 */
.rf{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.rf{grid-template-columns:1fr}}
.rf fieldset{border:1px solid var(--line);border-radius:10px;padding:6px 10px 10px;margin:0}
.rf legend{font-size:13px;font-weight:800;padding:0 4px}
.rf label.f{margin-top:6px}
.auto{background:#f2f8f2!important}
.radios{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
.radios label{display:flex;gap:4px;align-items:center;cursor:pointer}
/* 인쇄용 결석신고서 */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm 16mm}
  body{overflow:visible;height:auto;background:#fff}
  .app,.modal,#toast,.tt-rail,.tt-sheet{display:none!important}
  #printArea{display:block}
}
.pf{font-family:"Batang","바탕","Malgun Gothic",serif;color:#000;font-size:14.5px}
.pf .top{font-size:12px;border-bottom:1px dotted #555;margin-bottom:22px;padding-bottom:2px}
.pf .lb{font-size:12px;margin:0 0 4px}
.pf h1{font-family:"Malgun Gothic",sans-serif;text-align:center;font-size:28px;letter-spacing:22px;margin:0 0 24px}
.pf table{width:100%;border-collapse:collapse}
.pf td{border:1px solid #000;padding:6px 8px;vertical-align:top}
.pf .kinds div{line-height:1.8}
.pf .sign td{text-align:center;height:26px;padding:2px;font-size:13px}
.pf .body{padding:14px 18px 6px;line-height:2.3;font-size:15.5px}
.pf .r{text-align:right}
.pf .c{text-align:center}
.pf .note{font-size:11.5px;border-top:1px solid #000;padding:4px 8px}
.pf .cut{border-top:1px dashed #555;margin:18px 0 6px}
.pf h2{font-family:"Malgun Gothic",sans-serif;text-align:center;font-size:22px;letter-spacing:10px;margin:6px 0 16px}
.pf .school{text-align:center;font-family:"Malgun Gothic",sans-serif;font-size:24px;font-weight:800;letter-spacing:12px;margin-top:22px}
.pf .school small{font-size:14px;letter-spacing:0;font-weight:400}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hl"><a class="back" href="../../">← 쌤 노트</a><h1>🧭 출결·결석계 <span class="sub" style="font-size:13px;font-weight:700">· 🗣️ 상담</span></h1><span class="sub" id="classname"></span></div>
    <div class="hr"><button class="btn btn-sm" id="maskBtn" data-act="mask" aria-pressed="false">이름 가리기</button></div>
  </header>
  <main id="main"></main>
  <nav class="tabs" role="tablist" aria-label="화면 선택">
    <button class="tab" role="tab" data-act="tab" data-tab="entry">입력</button>
    <button class="tab" role="tab" data-act="tab" data-tab="week">주간</button>
    <button class="tab" role="tab" data-act="tab" data-tab="student">학생</button>
    <button class="tab" role="tab" data-act="tab" data-tab="stats">통계</button>
    <button class="tab" role="tab" data-act="tab" data-tab="counsel">상담</button>
    <button class="tab" role="tab" data-act="tab" data-tab="report" id="tabReport">결석신고서</button>
    <button class="tab" role="tab" data-act="tab" data-tab="settings">설정</button>
    <a class="tab" href="../parent/" style="text-decoration:none;margin-left:auto">✉️ 학부모 문자</a>
  </nav>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="상세 창"></div></div>
<div id="toast" role="status" hidden></div>
<div id="printArea"></div>

<script src="../../shared/tt.js"></script>
<script src="../../shared/guidelogic.js"></script>
<script>
(function () {
'use strict';
const L = Logic;

/* ---------- 명단: 학급 명렬표의 "우리 반" ---------- */
let HOME = null;
function loadHome() {
  let h = null;
  try { h = TT.roster.home(); } catch (e) { h = null; }
  HOME = h && h.students && h.students.length ? h : null;
}
const students = () => HOME ? HOME.students.map(s => ({ id: String(s.no), no: +s.no, name: String(s.name || '') })).sort((a, b) => a.no - b.no) : [];

/* ---------- 자료 ---------- */
function blank() {
  return { v: 1, att: {}, meta: {}, holidays: Object.assign({}, DEFAULT_HOL), counsel: [], reports: {}, guardians: {},
    settings: { weekN: 3, runN: 2, mask: false, countApproved: false, school: '', teacher: '', confirm: '학부모와의 통화' } };
}
function normalize(o) {
  const b = blank(); if (!o || typeof o !== 'object') return b;
  ['att', 'meta', 'holidays', 'reports', 'guardians'].forEach(k => { if (o[k] && typeof o[k] === 'object') b[k] = o[k]; });
  b.counsel = Array.isArray(o.counsel) ? o.counsel : [];
  b.settings = Object.assign(b.settings, o.settings || {});
  return b;
}
function lsGet(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
/* 예전 "지각 관리 노트"(tt_attend_v1, tt_counsel_v1) 자료를 한 번 옮겨 옴. 조퇴·결과는 버림 */
function migrate() {
  const s = blank(), A0 = lsGet('tt_attend_v1'), C0 = lsGet('tt_counsel_v1');
  if (!A0 && !C0) return null;
  const id = HOME ? String(HOME.id) : '_';
  const cls = A0 && A0.classes && (A0.classes[id] || A0.classes[Object.keys(A0.classes)[0]]);
  if (cls && cls.rec) Object.keys(cls.rec).forEach(k => {
    const [d, no] = k.split('|'), t = (cls.rec[k] && cls.rec[k].t) || '';
    let r = null;
    if (t.indexOf('결') >= 0) r = { t: 'A', k: 'un' }; else if (t.indexOf('지') >= 0) r = { t: 'L' };
    if (r && d && no) (s.att[d] = s.att[d] || {})[no] = r;
  });
  if (cls && cls.ov) Object.keys(cls.ov).forEach(d => { if (cls.ov[d] && cls.ov[d].v === 'off') s.holidays[d] = s.holidays[d] || '휴업일'; });
  const cn = C0 && C0.classes && (C0.classes[id] || C0.classes[Object.keys(C0.classes)[0]]);
  if (cn) Object.keys(cn).forEach(no => (cn[no] || []).forEach(n => s.counsel.push({ id: n.id || uid(), sid: String(no), date: n.d || today(), trigger: '', reasons: [], content: n.text || '', actions: [], actionNote: '', parent: 'none', next: '', done: false, created: n.u || Date.now() })));
  return s;
}

function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
loadHome();

if (!lsGet(KEY)) persist();
{ try { const C = JSON.parse(localStorage.getItem('tt_calendar_v1') || 'null'); ((C && C.events) || []).forEach(e => { if (e.k === 'off' && !S.holidays[e.d]) S.holidays[e.d] = e.t; }); } catch (e) {} }   // 학사일정(연간 업무에서 붙여 넣기)의 휴업일
{ const sc = TT.school.load(); if (sc.name) S.settings.school = sc.name; if (sc.teacher) S.settings.teacher = sc.teacher; }   // 학교 이름·담임 이름은 공통 설정(첫 화면 ⋯ → 학교·선생님 설정)과 같은 값

function dayInfo(d) {
  if (!L.isSchoolDay(d, S.holidays)) { const w = L.dow(d), h = S.holidays[d]; return { ok: false, msg: `${mdk(d)}은 수업일이 아닙니다.${h ? ' (' + h + ')' : w === 0 || w === 6 ? ' (주말)' : ''}` }; }
  if (d > today()) return { ok: false, msg: `${mdk(d)}은 아직 오지 않은 날입니다.` };
  return { ok: true };
}

  list.forEach(s => { const r = day[s.no]; if (!r) return; if (r.t === 'L') r.o ? cnt.Lo++ : cnt.Lu++; else cnt.A++; });
  let body;
  if (!info.ok) body = `<div class="empty">${esc(info.msg)}<br>위 화살표로 수업일을 넘겨 보세요.</div>`;
  else body = `<div class="chips2" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${list.map(st => {
    const r = day[st.no], w = wkStat(st.no, mon), t = r ? r.t : '';
    const flag = w.alert ? `주${w.count}회` : w.caution ? `연속${Math.max.apply(null, w.runs.map(x => x.len))}일` : '';

      <button class="okbtn" data-act="okmode" aria-pressed="${view.ok}" title="${view.mode === 'L' ? '질병 등 인정 사유가 있는 지각일 때 켜고 누릅니다' : '결석은 누르면 구분(병결·인정결·미인정결)과 사유를 적는 창이 열립니다'}">${view.mode === 'L' ? '인정' : '바로 입력'}</button></div>
    ${body}
    <div class="foot2"><div class="counts"><span>무단지각 <b>${cnt.Lu}</b></span><span>인정지각 <b>${cnt.Lo}</b></span><span>결석 <b>${cnt.A}</b></span><span class="small">학생을 누르면 표시되고, 한 번 더 누르면 지워집니다.</span></div>
      ${info.ok ? `<button class="donebtn" data-act="done" aria-pressed="${done}">${done ? '입력 완료 ✓' : '입력 끝'}</button>` : ''}</div>
  </div>`;
}

function renderWeek() {
  const mon = view.monday, days = L.weekDates(mon), td = today(), o = opt();
  const rows = students().map(st => ({ st, w: wkStat(st.no, mon) }));
  const nAlert = rows.filter(r => r.w.alert).length, nCaution = rows.filter(r => r.w.caution).length;
  const total = rows.reduce((a, r) => a + r.w.count, 0);
  const shown = rows.filter(r => view.filter === 'alert' ? r.w.alert : view.filter === 'caution' ? r.w.caution : true);
  const todos = todoList(rows, mon);
  const head = `<div class="wkrow wkhead"><div class="nm">학생</div>${days.map(d => `<div><button class="${d === td ? 'today' : ''}" data-act="goday" data-date="${d}" title="${esc(S.holidays[d] || '이 날 입력하기')}">${kd(d)}<br>${mdShort(d)}</button></div>`).join('')}<div>무단</div><div>상태</div></div>`;
  const body = shown.map(({ st, w }) => {
    const cells = days.map(d => {
      if (!L.isSchoolDay(d, S.holidays)) return `<div><button class="dc" disabled title="${esc(S.holidays[d] || '휴일')}">휴</button></div>`;
      const r = rec(st.no, d), t = r ? r.t : '';
      const tardy = t === 'L' && L.isTardy(S.att, S.holidays, String(st.no), d);
      const cls = r ? `dc has t-${t}${t === 'L' && r.o ? ' appr' : ''}` + (tardy ? (w.alert ? ' c-alert' : w.runDates.has(d) ? ' c-caution' : '') + (w.runDates.has(d) ? ' run' : '') : '') : 'dc';
      return `<div><button class="${cls}" data-act="cell" data-no="${st.no}" data-date="${d}" title="${esc(recLabel(r) + (r && r.r ? ' · ' + r.r : ''))}">${r ? (t === 'L' ? '지' : '결') : ''}</button></div>`;
    }).join('');
    const stt = w.alert ? `<span class="st pill-alert">주 ${w.count}회</span>` : w.caution ? `<span class="st pill-caution">연속 ${Math.max.apply(null, w.runs.map(x => x.len))}일</span>` : '';
    return `<div class="wkrow row-${w.level}"><div class="nm"><button data-act="student" data-sid="${st.id}"><span class="no">${st.no}</span>${esc(nm(st))}</button></div>${cells}<div class="sum">${w.count}</div><div>${stt}</div></div>`;
  }).join('');
  const isThis = mon === L.weekStart(td);
  return `<div class="view">
    <div class="row spread" style="flex:none"><div class="row" style="gap:6px"><button class="btn" data-act="wk" data-d="-7" aria-label="지난주">◀</button>
      <b style="min-width:128px;text-align:center">${mdShort(days[0])} ~ ${mdShort(days[4])}${isThis ? ' (이번 주)' : ''}</b>
      <button class="btn" data-act="wk" data-d="7" aria-label="다음 주">▶</button><button class="btn" data-act="wk-this">이번 주</button></div>
      <button class="btn mo" data-act="todo-open" ${todos.length ? '' : 'hidden'}>확인할 학생 ${todos.length}</button></div>
    <div class="split two"><div class="main">
      <div class="tiles"><button class="tile t-alert" data-act="filter" data-f="alert" aria-pressed="${view.filter === 'alert'}"><b>${nAlert}</b><span>주 ${o.weekN}회 이상</span></button>
        <button class="tile t-caution" data-act="filter" data-f="caution" aria-pressed="${view.filter === 'caution'}"><b>${nCaution}</b><span>연속 ${o.runN}일 이상</span></button>
        <button class="tile" data-act="filter" data-f="all" aria-pressed="${view.filter === 'all'}"><b>${total}</b><span>무단지각 (전체 ${students().length}명)</span></button></div>
      <div class="wkgrid">${head}${body || '<div class="empty" style="margin:8px">조건에 맞는 학생이 없습니다.</div>'}</div>
      <div class="legend"><span><i class="sw" style="background:var(--cL)"></i>지각</span><span><i class="sw" style="border:2px solid var(--cL)"></i>인정지각</span><span><i class="sw" style="background:var(--cA)"></i>결석</span>
        <span><i class="sw" style="background:var(--caution-fill)"></i>연속 무단지각</span><span><i class="sw" style="background:var(--alert-fill)"></i>주간 기준 이상</span></div></div>
    <div class="side"><section class="card"><h2>확인할 학생</h2>${todos.length ? `<ul class="todo">${todos.join('')}</ul>` : '<p class="muted small" style="margin:0">지금 확인할 학생이 없습니다.</p>'}</section>
      <section class="card small muted">칸을 누르면 그 날 출결을 고칠 수 있습니다. 표시 기준은 <b>무단 지각</b>만 셉니다(설정에서 바꿀 수 있음).</section></div></div></div>`;
}
function todoList(rows, mon) {
  const todos = [], td = today();
  rows.forEach(r => {
    if (r.w.level === 'ok') return;
    const since = [mon].concat(r.w.runs.map(x => x.start)).sort()[0];
    if (!S.counsel.some(c => c.sid === r.st.id && c.date >= since)) todos.push(`<li><span><b>${esc(nm(r.st))}</b> <span class="muted small">${esc(L.describe(r.w))}</span></span><span class="row">${sms('lateN', r.st.no, today(), r.w.tardyDays.map(mdk).join(', '), '문자')}<button class="btn btn-sm btn-primary" data-act="counsel-new" data-sid="${r.st.id}">상담일지 쓰기</button></span></li>`);
  });
  S.counsel.filter(c => c.next && !c.done && c.next <= td).forEach(c => {
    todos.push(`<li><span><b>${esc(nm(stu(c.sid)))}</b> <span class="muted small">후속 확인일 ${esc(mdShort(c.next))} (상담 ${esc(mdShort(c.date))})</span></span><span class="row"><button class="btn btn-sm" data-act="follow-done" data-id="${c.id}">개선 확인</button><button class="btn btn-sm" data-act="counsel-new" data-sid="${c.sid}">다시 상담</button></span></li>`);
  });
  const nr = episodes().filter(e => !S.reports[e.key]).length;
  if (nr) todos.push(`<li><span><b>결석신고서</b> <span class="muted small">아직 만들지 않은 결석 ${nr}건</span></span><button class="btn btn-sm" data-act="tab" data-tab="report">결석신고서로</button></li>`);
  return todos;
}

function typeCounts(no, inR) {
  const c = { Lu: 0, Lo: 0, sick: 0, ok: 0, un: 0, etc: 0, A: 0 };
  Object.keys(S.att).forEach(d => {
    const r = (S.att[d] || {})[no]; if (!r || !L.isSchoolDay(d, S.holidays) || !inR(d)) return;
    if (r.t === 'L') { if (r.o) c.Lo++; else c.Lu++; } else if (r.t === 'A') { c.A++; c[r.k || 'un']++; }
  });
  return c;
}
function logAfter(c) {
  const el = Math.min(14, L.diffDays(today(), c.date)); if (el <= 0) return '';
  const end = L.addDays(c.date, 14); let n = 0;
  Object.keys(S.att).forEach(d => { if (d > c.date && d <= end && d <= today() && L.isTardy(S.att, S.holidays, c.sid, d)) n++; });
  return `상담 후 ${el}일간 무단지각 ${n}회`;
}

function renderStudent() {
  const list = students();
  let st = stu(view.sel) || list[0]; view.sel = st.id;
  const idx = list.findIndex(x => x.id === st.id), no = String(st.no), td = today();
  const c = typeCounts(no, () => true);
  const logs = S.counsel.filter(x => x.sid === st.id).sort((a, b) => b.date.localeCompare(a.date));
  const weeks = []; for (let i = 7; i >= 0; i--) weeks.push(L.addDays(L.weekStart(td), -7 * i));
  const csDates = new Set(logs.map(x => x.date));
  const cal = weeks.map(m => {
    const w = wkStat(no, m);
    const cells = L.weekDates(m).map(d => {
      if (!L.isSchoolDay(d, S.holidays)) return `<button class="cc hol" disabled title="${esc(S.holidays[d] || '휴일')}"><small>${mdShort(d)}</small>휴</button>`;
      if (d > td) return `<button class="cc" disabled><small>${mdShort(d)}</small></button>`;
      const r = rec(no, d), t = r ? r.t : '';
      return `<button class="cc${r ? ` has t-${t}${t === 'L' && r.o ? ' appr' : ''}` : ''}${csDates.has(d) ? ' cs' : ''}" data-act="cell" data-no="${no}" data-date="${d}" title="${esc(r && r.r ? r.r : '')}"><small>${mdShort(d)}</small>${esc(recLabel(r))}</button>`;
    }).join('');
    return `<div class="wl ${w.alert ? 'f-alert' : w.caution ? 'f-caution' : ''}">${mdShort(m)}~${w.alert ? ' 주' + w.count : w.caution ? ' 연속' : ''}</div>${cells}`;
  }).join('');

    ${x.trigger ? `<p class="small muted">${esc(x.trigger)}</p>` : ''}${x.content ? `<p class="small">${esc(x.content)}</p>` : ''}

function inRange(d) {
  const td = today();
  if (view.range === 'month') return d.slice(0, 7) === td.slice(0, 7);
  if (view.range === 'last') { const p = L.addDays(td.slice(0, 7) + '-01', -1); return d.slice(0, 7) === p.slice(0, 7); }
  if (view.range === '4w') return d >= L.addDays(td, -27) && d <= td;
  return true;
}
function renderStats() {
  const o = opt(), td = today();
  const rows = students().map(s => {
    const key = String(s.no), c = typeCounts(key, inRange);
    const dates = L.allTardyDates(S.att, S.holidays, key).filter(inRange);
    const wk = {}; dates.forEach(d => { wk[L.weekStart(d)] = 1; });
    const aw = Object.keys(wk).filter(m => L.weekStatus(S.att, S.holidays, key, m, o).alert).length;
    const runs = L.allRuns(S.att, S.holidays, key, o.runN).filter(r => inRange(r.end)).length;
    const byDow = [0, 0, 0, 0, 0, 0, 0]; dates.forEach(d => byDow[L.dow(d)]++);
    let top = 1; for (let i = 2; i <= 5; i++) if (byDow[i] > byDow[top]) top = i;
    return { s, c, aw, runs, top: dates.length ? `${L.KD[top]}(${byDow[top]})` : '-', byDow, logs: S.counsel.filter(x => x.sid === s.id).length };
  }).sort((a, b) => b.c.Lu - a.c.Lu || b.c.A - a.c.A || a.s.no - b.s.no);
  const dow = [0, 0, 0, 0, 0]; rows.forEach(r => { for (let i = 1; i <= 5; i++) dow[i - 1] += r.byDow[i]; });
  const mx = Math.max(1, ...dow), sum = dow.reduce((a, b) => a + b, 0);
  const T = rows.reduce((a, r) => ({ Lu: a.Lu + r.c.Lu, Lo: a.Lo + r.c.Lo, A: a.A + r.c.A }), { Lu: 0, Lo: 0, A: 0 });
  const sel = `<select id="rangeSel" data-chg="range" style="width:auto" aria-label="기간">${[['all', '전체 기간'], ['month', '이번 달'], ['last', '지난 달'], ['4w', '최근 4주']].map(([v, t]) => `<option value="${v}" ${view.range === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  return `<div class="view"><div class="row spread" style="flex:none"><div class="row">${sel}<span class="small muted">무단지각 <b>${T.Lu}</b> · 인정지각 <b>${T.Lo}</b> · 결석 <b>${T.A}</b></span></div>
    <button class="btn btn-sm" data-act="att-csv">출결 표(CSV) 저장</button></div>
    <div class="split two"><div class="main"><div class="card scroll" style="flex:1;padding:6px 10px"><table class="plain"><thead><tr><th>학생</th><th>무단지각</th><th>인정지각</th><th>병결</th><th>인정결</th><th>미인정결</th><th>주${o.weekN}회+</th><th>연속</th><th>많은 요일</th><th>상담</th><th>3회=1일</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><button class="btn btn-sm" style="border:0;background:none;padding:0;font-weight:700" data-act="student" data-sid="${r.s.id}">${r.s.no} ${esc(nm(r.s))}</button></td><td>${r.c.Lu}</td><td>${r.c.Lo}</td><td>${r.c.sick}</td><td>${r.c.ok}</td><td>${r.c.un + r.c.etc}</td><td>${r.aw}주</td><td>${r.runs}회</td><td>${esc(r.top)}</td><td>${r.logs}</td><td>${Math.floor(r.c.Lu / 3)}일</td></tr>`).join('')}</tbody></table></div></div>
    <div class="side"><section class="card"><h3>요일별 무단지각 (${sum}회)</h3><div class="bars">${dow.map((n, i) => `<div class="b"><span>${n}</span><i style="height:${Math.round(n / mx * 62)}px"></i><span>${L.KD[i + 1]}</span></div>`).join('')}</div></section>
      <section class="card small muted">“3회=1일”은 무단 지각 3회를 결석 1일로 보는 일반 기준의 단순 계산입니다. 실제 처리는 학교 규정과 나이스를 따르세요.</section></div></div></div>`;
}

/* ---------- 결석신고서: 이어진 결석을 한 건으로 묶기 ---------- */
function episodes() {
  const out = [];
  students().forEach(st => {
    const no = String(st.no);
    const ds = Object.keys(S.att).filter(d => { const r = S.att[d][no]; return r && r.t === 'A'; }).sort();
    let cur = null;
    ds.forEach(d => {
      const r = S.att[d][no], k = r.k || 'un';
      if (cur && cur.kind === k && L.nextSchoolDay(cur.end, S.holidays) === d) { cur.end = d; cur.days.push(d); if (r.r && cur.reasons.indexOf(r.r) < 0) cur.reasons.push(r.r); if (r.ev && cur.ev.indexOf(r.ev) < 0) cur.ev.push(r.ev); }
      else { cur = { no, st, kind: k, start: d, end: d, days: [d], reasons: r.r ? [r.r] : [], ev: r.ev ? [r.ev] : [] }; out.push(cur); }
    });
  });
  out.forEach(e => { e.key = e.no + '|' + e.start; });
  return out.sort((a, b) => b.start.localeCompare(a.start) || a.no - b.no);
}

async function copyText(text) {

/* 출결 한 칸 */
let recCtx = null;
/* 상황별 학부모 문자: 학부모 문자 화면을 그 상황의 글로 채워 엽니다(주소에는 번호만, 이름은 넣지 않음) */
function sms(k, no, d, x, label) {
  const q = new URLSearchParams({ k, no: String(no), d: d || today(), x: x || '', c: HOME ? String(HOME.id) : '' });
  return `<a class="btn btn-sm" href="../parent/?${q.toString()}" title="학부모 문자 만들기">✉️ ${esc(label || '문자')}</a>`;
}
/* 상담일지의 "행동특성 참고" 한 줄 → 학생 기록(tt_notes_v1, 영역 행동특성). 상담 내용 자체는 옮기지 않습니다. */
function behNote(c) {
  if (!c || !TT.notes) return;
  const N = TT.notes, d = N.load(), gid = 'g' + c.id, i = d.recs.findIndex(r => r.gid === gid);
  const st = c.sid ? stu(c.sid) : null;
  if (!c.beh || !st || !HOME) { if (i >= 0) { d.recs.splice(i, 1); N.save(d); } return; }
  const rec = { k: N.key(HOME, st), n: st.name, date: c.date || today(), area: 'beh', src: '상담일지', text: c.beh };
  if (i >= 0) Object.assign(d.recs[i], rec); else d.recs.push(Object.assign({ id: uid(), gid, at: Date.now() }, rec));
  N.save(d);
}
function recModal(no, d) {

        idx++;
        if (!rep[idx]) return m;
        const plain = txt.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
        if (plain.indexOf(EXPECT[idx]) < 0) { bad = bad || String(idx); return m; }
        return '<hp:t>' + xmlEsc(rep[idx][0]) + '</hp:t>';
      });
      if (bad) throw new Error('결석신고서 양식이 예상과 달라 채우지 못했습니다. (칸 ' + bad + ')');
      data = new TextEncoder().encode(xml);
    }
    files.push({ name: e.name, data });
  }
  files.sort((a, b) => (a.name === 'mimetype' ? -1 : b.name === 'mimetype' ? 1 : 0));   // mimetype이 맨 앞
  return TT.file.zip(files);
}
/* 인쇄용 화면 (양식과 같은 모양) */

      <td style="width:6%;text-align:center;vertical-align:middle">결<br>재</td><td style="padding:0"><table class="sign"><tr><td>계</td><td>부 장</td><td>교 감</td></tr><tr><td style="height:58px"></td><td></td><td></td></tr></table></td></tr>
    <tr><td colspan="3" class="body"><div class="r">제 ${u(f.grade)} 학년 ${u(f.cls)} 반 ${u(f.no)} 번<br>성 명 : ${u(f.name)}</div>
      위 학생은 ( ${esc(f.reason)} )으로 인하여<br>20( ${esc(yy(f.y1))} )년( ${esc(f.m1)} )월( ${esc(f.d1)} )일( ${esc(f.w1)} )요일, ( ${esc(f.p1)} )교시부터<br>
      &emsp;&emsp;( ${esc(f.m2)} )월( ${esc(f.d2)} )일( ${esc(f.w2)} )요일, ( ${esc(f.p2)} )교시까지 ( ${esc(f.amount)} ) (${esc(f.unit)}) 동안<br>
      (${esc(f.what)})하게 되었으므로 증빙서류를 갖추어 결석신고서를 제출합니다.<div class="c">20${esc(yy(sy))} 년 ${esc(sm)} 월 ${esc(sd)} 일</div>
      <div class="r">본&ensp;인 : ${u(f.self)} (인)<br>보호자 : ${u(f.guardian)} (인)</div></td></tr>

    <div class="cut"></div><p class="lb">&lt;양식2&gt;</p><h2>담 임 확 인 서</h2>
    <p class="c" style="font-size:15.5px">위 사실을 (${esc(f.confirm)})(으)로 확인 합니다.</p><p class="c" style="font-size:15.5px">20${esc(yy(cy))} 년 ${esc(cm)} 월 ${esc(cd)} 일</p>
    <p class="r" style="font-size:15.5px">담&ensp;임 : ${u(f.teacher)} (인)</p><div class="school">${esc(school)} <small>귀하</small></div></div>`;
}

/* ---------- 입력 처리 ---------- */
function setRec(no, d, r) {
  if (r) (S.att[d] = S.att[d] || {})[no] = r; else if (S.att[d]) { delete S.att[d][no]; if (!Object.keys(S.att[d]).length) delete S.att[d]; }
  persist();
}
function afterDelta(no, d, before) { const w = wkStat(no, L.weekStart(d)); if (w.level !== 'ok' && w.level !== before) toast(`${nm(stu(no))}: ${L.describe(w)}`); }
const A = {
  tab: t => { view.tab = t.dataset.tab; closeModal(); render(); },
  mask: () => { S.settings.mask = !S.settings.mask; persist(); render(); },
  mode: t => { view.mode = t.dataset.m; view.ok = false; render(); },
  okmode: () => { view.ok = !view.ok; render(); },
  dstep: t => {
    if (+t.dataset.s < 0) view.date = L.prevSchoolDay(view.date, S.holidays);
    else { const n = L.nextSchoolDay(view.date, S.holidays); if (n <= today()) view.date = n; else { toast('오늘이 마지막 수업일입니다'); return; } }
    view.monday = L.weekStart(view.date); render();
  },
  dtoday: () => { view.date = startDate(); view.monday = L.weekStart(view.date); render(); },
  mark: t => {
    const no = t.dataset.no, d = view.date, cur = rec(no, d), m = view.mode;
    const before = wkStat(no, L.weekStart(d)).level;
    if (m === 'L') {
      let nr;
      if (cur && cur.t === 'L') nr = (!!cur.o === !!view.ok) ? null : Object.assign({}, cur, view.ok ? { o: 1 } : { o: undefined });
      else nr = view.ok ? { t: 'L', o: 1 } : { t: 'L' };
      if (nr && !nr.o) delete nr.o;
      setRec(no, d, nr); render(); if (nr) afterDelta(no, d, before);
    } else {
      if (cur && cur.t === 'A') { setRec(no, d, null); render(); return; }
      const prev = rec(no, L.prevSchoolDay(d, S.holidays));                 // 어제도 결석이면 같은 구분·사유를 이어 씀
      const nr = prev && prev.t === 'A' ? { t: 'A', k: prev.k || 'un', r: prev.r || '', ev: prev.ev || '' } : { t: 'A', k: 'sick' };
      setRec(no, d, nr); render();
      if (!view.ok) recModal(no, d);
    }
  },
  cell: t => { const d = t.dataset.date; if (d > today()) return; recModal(t.dataset.no, d); },
  done: () => { const d = view.date, m = S.meta[d] || {}; S.meta[d] = { d: !m.d }; persist(); render(); if (S.meta[d].d) toast('오늘 입력을 마쳤습니다'); },
  wk: t => { view.monday = L.addDays(view.monday, +t.dataset.d); render(); },
  'wk-this': () => { view.monday = L.weekStart(today()); render(); },
  filter: t => { view.filter = view.filter === t.dataset.f ? 'all' : t.dataset.f; render(); },
  goday: t => { const d = t.dataset.date; if (d > today()) return; view.date = d; view.monday = L.weekStart(d); view.tab = 'entry'; render(); },
  student: t => { view.sel = t.dataset.sid; view.tab = 'student'; closeModal(); render(); },
  sstep: t => { const l = students(), i = l.findIndex(s => s.id === view.sel) + (+t.dataset.s); if (l[i]) { view.sel = l[i].id; render(); } },
  'rec-type': t => {
    const { no, d } = recCtx, ty = t.dataset.t, cur = rec(no, d);
    if (!ty) setRec(no, d, null);
    else if (!cur || cur.t !== ty) setRec(no, d, ty === 'A' ? { t: 'A', k: 'sick' } : { t: 'L' });
    render(); recModal(no, d);
  },
  'rec-reason': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; const n = Object.assign({}, cur); if (n.r === t.dataset.r) delete n.r; else n.r = t.dataset.r; setRec(no, d, n); recModal(no, d); },
  'rec-kind': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; setRec(no, d, Object.assign({}, cur, { k: t.dataset.k })); render(); recModal(no, d); },
  'rec-areason': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; setRec(no, d, Object.assign({}, cur, { r: t.dataset.r })); render(); recModal(no, d); },
  'rec-ev': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; const n = Object.assign({}, cur); n.ev = n.ev === t.dataset.r ? '' : t.dataset.r; setRec(no, d, n); recModal(no, d); },
  'todo-open': () => todoModal(),
  'counsel-new': t => counselModal(t.dataset.sid || ''),
  'counsel-edit': t => counselModal('', t.dataset.id),
  'counsel-save': () => {
    const f = readForm(), err = $('#c-err');
    if (!f.sid) { err.textContent = '학생을 선택해 주세요.'; return; }
    if (!f.date) { err.textContent = '상담일을 입력해 주세요.'; return; }
    if (!f.trigger && !f.content && !f.reasons.length) { err.textContent = '상담 계기, 사유, 내용 중 하나는 적어 주세요.'; return; }
    if (f.id) { const c = S.counsel.find(x => x.id === f.id); if (c) Object.assign(c, f, { done: f.next !== c.next ? false : c.done }); }
    else S.counsel.push(Object.assign(f, { id: uid(), done: false, created: Date.now() }));
    const saved = f.id ? S.counsel.find(x => x.id === f.id) : S.counsel[S.counsel.length - 1];
    persist(); behNote(saved); closeModal(); render(); toast('상담일지를 저장했습니다' + (f.beh ? ' · 행동특성 기록에도 넣었어요' : ''));
  },
  'counsel-del': t => { const id = t.dataset.id; confirmBox('이 상담일지를 삭제할까요? 되돌릴 수 없습니다.', '삭제', () => { S.counsel = S.counsel.filter(c => c.id !== id); persist(); behNote({ id, beh: '' }); closeModal(); render(); }); },
  'follow-done': t => { const c = S.counsel.find(x => x.id === t.dataset.id); if (c) { c.done = true; persist(); closeModal(); render(); toast('개선 확인으로 표시했습니다'); } },
  'log-copy': t => { const c = S.counsel.find(x => x.id === t.dataset.id); if (c) copyText(logText(c)); },
  'parent-copy': t => { const c = S.counsel.find(x => x.id === t.dataset.id); if (c) copyText(parentText(c)); },
  'parent-form': () => { const f = readForm(); if (!f.sid) { $('#c-err').textContent = '학생을 먼저 선택해 주세요.'; return; } copyText(parentText(f)); },
  chip: t => t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')),
  csv: () => {
    if (!S.counsel.length) { toast('저장할 상담일지가 없습니다'); return; }
    const rows = S.counsel.slice().sort((a, b) => a.date.localeCompare(b.date)).map(c => { const st = stu(c.sid) || {}; return [c.date, st.no, st.name, c.trigger, (c.reasons || []).join(', '), c.content, (c.actions || []).join(', ') + (c.actionNote ? ' ' + c.actionNote : ''), PARENT[c.parent], c.next, c.done ? '예' : '']; });
    saveBlob('상담일지_' + today() + '.csv', csvBlob(['상담일', '번호', '이름', '상담 계기', '사유', '상담 내용', '지도·조치', '학부모 연락', '후속 확인일', '개선 확인'], rows));
  },
  'att-csv': () => {
    const rows = [];
    Object.keys(S.att).sort().forEach(d => Object.keys(S.att[d] || {}).sort((a, b) => a - b).forEach(no => { const r = S.att[d][no], st = stu(no) || {}; rows.push([d, kd(d), no, st.name || '', recLabel(r), r.r || '', r.ev || '', r.m || '']); }));
    if (!rows.length) { toast('저장할 출결 기록이 없습니다'); return; }
    saveBlob('출결기록_' + today() + '.csv', csvBlob(['날짜', '요일', '번호', '이름', '구분', '사유', '증빙', '늦은 시간(분)'], rows));
  },
  'report-open': t => reportModal(t.dataset.key),
  'report-blank': () => reportModal(''),
  'report-hwpx': async t => {
    const f = readReport(); keepReport(f);
    t.disabled = true; const old = t.textContent; t.textContent = '만드는 중…';
    try { const blob = await makeHwpx(f); saveBlob(`결석신고서_${f.grade}-${f.cls}-${f.no}_${f.name || '학생'}_${f.y1}${String(f.m1).padStart(2, '0')}${String(f.d1).padStart(2, '0')}.hwpx`, blob); toast('한글 파일을 저장했습니다'); render(); }
    catch (e) { $('#r-err').textContent = e.message || String(e); }
    t.disabled = false; t.textContent = old;
  },
  'report-print': () => { const f = readReport(); keepReport(f); $('#printArea').innerHTML = printHtml(f); render(); setTimeout(() => window.print(), 50); },
  'hol-add': () => {
    const a = $('#h1').value, b = $('#h2').value || a, n = $('#hn').value.trim() || '휴업일', err = $('#holErr');
    if (!a) { err.textContent = '시작일을 선택해 주세요.'; return; }
    if (b < a || L.diffDays(b, a) > 200) { err.textContent = '종료일은 시작일 이후, 200일 이내로 정해 주세요.'; return; }
    for (let d = a, g = 0; d <= b && g < 250; d = L.addDays(d, 1), g++) S.holidays[d] = n;
    persist(); render(); toast('휴일을 추가했습니다');
  },
  'hol-del': t => { delete S.holidays[t.dataset.d]; persist(); render(); },
  wipe: () => confirmBox('이 도구에 저장된 출결, 상담일지, 결석신고서 기록을 모두 지웁니다. 백업이 없으면 되돌릴 수 없습니다.', '모두 지우기', () => { S = blank(); persist(); closeModal(); view.tab = 'entry'; render(); toast('모두 지웠습니다'); }),
  close: () => { closeModal(); render(); },
  yes: () => { const f = pendingYes; pendingYes = null; if (f) f(); }
};
const C = {
  dpick: t => { if (t.value && t.value <= today()) { view.date = t.value; view.monday = L.weekStart(t.value); render(); } },
  stuSel: t => { view.sel = t.value; render(); },
  logStu: t => { view.logStudent = t.value; render(); },
  range: t => { view.range = t.value; render(); },
  rmonth: t => { view.rmonth = t.value; render(); },
  runN: t => { S.settings.runN = Math.min(5, Math.max(2, +t.value || 2)); persist(); render(); },
  weekN: t => { S.settings.weekN = Math.min(5, Math.max(2, +t.value || 3)); persist(); render(); },
  cApp: t => { S.settings.countApproved = !!t.checked; persist(); render(); },
  school: t => { S.settings.school = t.value.trim(); TT.school.save({ name: S.settings.school }); persist(); },
  teacher: t => { S.settings.teacher = t.value.trim(); TT.school.save({ teacher: S.settings.teacher }); persist(); },
  confirm: t => { S.settings.confirm = t.value; persist(); },
  'rec-ok': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; const n = Object.assign({}, cur); if (t.checked) n.o = 1; else delete n.o; setRec(no, d, n); render(); recModal(no, d); },
  'rec-min': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; const n = Object.assign({}, cur); if (+t.value > 0) n.m = +t.value; else delete n.m; setRec(no, d, n); },
  'rec-r': t => { const { no, d } = recCtx, cur = rec(no, d); if (!cur) return; setRec(no, d, Object.assign({}, cur, { r: t.value.trim().slice(0, 40) })); },
  'c-sid': t => { if (!t.value) return; const tr = $('#c-trigger'); if (!tr.value.trim()) tr.value = triggerFor(t.value); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && A[t.dataset.act]) { e.preventDefault(); A[t.dataset.act](t); return; }
  if (e.target.id === 'modal') { closeModal(); render(); }
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t && C[t.dataset.chg]) C[t.dataset.chg](t); });
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.r !== undefined) e.target.classList.remove('auto'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); render(); }

});
window.addEventListener('storage', e => { if (e.key === 'tt_roster_v1') { loadHome(); render(); } });
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
render();
})();
