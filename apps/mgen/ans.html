<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<title>정답 확인 · 쌤 노트</title>
<!-- 학습지 QR로 여는 스스로 채점 화면. 주소에는 문제 종류·숫자 번호(·학생 번호)만 들어 있고 이름 같은 개인정보는 없습니다.
     주소: ans.html?d=유형.개수,유형.개수&l=단계&s=숫자번호&w=번호 → 문항 생성기와 똑같이 다시 만들어 정답을 보여 줍니다. -->
<style>
  :root{--accent:#2f6fb5;--ok:#2e7d4f;--line:#dde3ea;--sub:#66727f}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f4f7fa;color:#1d2733}
  header{position:sticky;top:0;background:var(--accent);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
  header h1{font-size:18px;margin:0;flex:1}
  header button{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:7px 10px;background:#fff;color:var(--accent)}
  .tip{font-size:13px;color:var(--sub);padding:10px 14px 0}
  ol{list-style:none;margin:0;padding:10px 12px 30px;display:flex;flex-direction:column;gap:8px}
  li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
  li .n{font-weight:900;color:var(--accent);min-width:22px}
  li .b{flex:1;min-width:0}
  li .q{font-size:13.5px;color:var(--sub);line-height:1.5}
  li .a{margin-top:6px;font-size:17px;font-weight:900;color:var(--ok)}
  li button{font:inherit;font-size:13px;font-weight:800;border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:9px;padding:6px 10px;white-space:nowrap}
  li.me{border-color:var(--ok)}
  .mk{display:flex;gap:4px;margin-top:6px}.mk button{padding:4px 9px}
  .mk button.on{background:var(--accent);color:#fff}
  #sc{font-weight:900}
  .err{padding:30px 16px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header><h1>✅ 정답 확인<span id="who" style="font-size:13px;font-weight:700;opacity:.85"></span></h1><span id="sc"></span><button type="button" id="all">모두 보기</button></header>
<div class="tip">먼저 다 풀고, 한 문제씩 답을 열어 ⭕/❌를 눌러 보세요. 틀린 문제는 다시 풀어 봐요!</div>
<ol id="L"></ol>
<script src="../../shared/mathgen.js"></script>
<script>
(function(){
  "use strict";
  var P = new URLSearchParams(location.search), d = P.get("d") || "", lv = +(P.get("l") || 2), seed = P.get("s") || "", who = +(P.get("w") || 0);
  var spec = d.split(",").map(function(x){ var p = x.split("."); return {id: p[0], n: Math.min(30, +p[1] || 0)}; }).filter(function(x){ return x.n > 0 && MG.type(x.id); });
  var L = spec.length && seed ? MG.sheet(spec, lv, seed, who) : [], mark = {};
  if(who) document.getElementById("who").textContent = " · " + who + "번";
  if(!L.length){ document.getElementById("L").outerHTML = '<div class="err">주소가 올바르지 않아요. 학습지의 QR을 다시 찍어 주세요.</div>'; return; }
  function draw(){
    document.getElementById("L").innerHTML = L.map(function(o, i){
      return '<li class="' + (mark[i] === 1 ? "me" : "") + '"><span class="n">' + (i + 1) + '</span><div class="b"><div class="q">' + o.q + '</div>'
        + (o.open ? '<div class="a">' + o.a + '</div><div class="mk"><button type="button" data-m="1" data-i="' + i + '" class="' + (mark[i] === 1 ? "on" : "") + '">⭕ 맞음</button><button type="button" data-m="0" data-i="' + i + '" class="' + (mark[i] === 0 ? "on" : "") + '">❌ 틀림</button></div>' : "")
        + '</div>' + (o.open ? "" : '<button type="button" data-o="' + i + '">답 보기</button>') + "</li>";
    }).join("");
    var k = Object.keys(mark); document.getElementById("sc").textContent = k.length ? "⭕ " + k.filter(function(i){ return mark[i] === 1; }).length + " / " + L.length : "";
  }
  document.getElementById("L").onclick = function(e){
    var b = e.target.closest("button"); if(!b) return;
    if(b.dataset.o != null) L[+b.dataset.o].open = true;
    if(b.dataset.m != null) mark[+b.dataset.i] = +b.dataset.m;
    draw();
  };
  document.getElementById("all").onclick = function(){ L.forEach(function(o){ o.open = true; }); draw(); };
  draw();
})();
</script>
</body>
</html>
