<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'">

<!--
  💪 공부 Gym 교사용 — PLAN_공부Gym 11단계 (쌤 노트 연결)
  · 📥 결과 코드 넣기: 학생이 원할 때 보여 준 '주간 결과 코드'(GYM1.…)를 붙여 넣으면 반 현황판에 모임
    코드에는 별명·주 시작일·출석 일수·공부 시간·강도·연속·과목별 레벨·마스터 %·훈련일만 들어 있음(이름·연락처 없음)
  · 📊 반 현황: 주별 표 · 평균 · 관심 필요(출석 2일 이하) · CSV 저장 — 이 기기 브라우저에만 저장(gymboard_v1)
  · 🖨️ 학생 안내문: QR + 사용법 한 장(A4) 인쇄
  · 🔗 반 코드·진도 링크 (17·18단계): 🏫 반 코드 QR(학생 홈에 '우리 반 오늘 출석 ○명') · 📅 진도 따라가기(중1·2) 진도 링크 QR
-->
<style>
  :root{--ac:#2b4c9b;--ac2:#e8eefb;--ink:#1d2433;--sub:#667085;--line:#e3e7ee;--bg:#f5f7fb;--ok:#1d7a4f;--okb:#e3f4eb;--ng:#c0392b;--ngb:#fdeaea;--gy:#FF8A00}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
  #app{height:100dvh;display:grid;grid-template-rows:auto 1fr}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:19px;font-weight:900;white-space:nowrap}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tabs button{border:0;background:none;font:inherit;font-size:15px;font-weight:800;color:var(--sub);padding:8px 12px;border-radius:10px;cursor:pointer}
  .tabs button[aria-current=true]{background:var(--ac2);color:var(--ac)}
  header .sp{flex:1}
  .back{font-size:14px;font-weight:800;color:var(--ac);text-decoration:none;white-space:nowrap;border:1px solid var(--line);border-radius:10px;padding:7px 11px}
  main{min-height:0;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .btn{border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-size:15px;font-weight:800;padding:10px 16px;cursor:pointer;white-space:nowrap}
  .btn.sub{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}.btn.gray{background:#eef1f6;color:var(--ink)}
  .muted{color:var(--sub);font-size:14px}
  .sc{overflow:auto;min-height:0}.grow{flex:1;min-height:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,textarea{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
  textarea{width:100%;min-height:120px;font:13px/1.45 ui-monospace,monospace}
  .sum{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sum div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
  .sum b{display:block;font-size:24px;font-weight:900;color:var(--ac)}.sum span{font-size:13px;color:var(--sub);font-weight:700}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
  th{position:sticky;top:0;background:#f8f9fc;font-weight:900;font-size:13px;color:var(--sub);cursor:pointer}
  td.nk{text-align:left;font-weight:800}
  td .lv{display:block;font-size:11.5px;color:var(--sub)}
  .bar{display:inline-block;width:52px;height:8px;border-radius:4px;background:#eef1f6;vertical-align:middle;overflow:hidden}.bar i{display:block;height:100%;background:var(--gy)}
  .flag{font-size:12px;font-weight:900;border-radius:8px;padding:2px 7px;background:var(--ngb);color:var(--ng)}
  .ok{font-size:12px;font-weight:900;border-radius:8px;padding:2px 7px;background:var(--okb);color:var(--ok)}
  .x{border:0;background:none;color:var(--sub);font-size:16px;cursor:pointer}
  .lk{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;min-height:0;flex:1}
  .lk .card{display:flex;flex-direction:column;gap:8px;min-height:0}
  .lk #cn{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:9em}
  .cl{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
  .cl div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:7px 10px}
  .cl b{font-size:16px}.cl .n{margin-left:auto;font-weight:900;color:var(--ok);font-size:14px}
  .qrb{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}.qrb svg{width:150px;height:150px}
  .qrb .u{font-size:12px;word-break:break-all;color:var(--sub)}
  .stab2{display:flex;gap:4px;flex-wrap:wrap}.stab2 button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .stab2 button[aria-pressed=true]{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
  .ul{display:flex;flex-wrap:wrap;gap:5px;overflow:auto;min-height:0;align-content:flex-start}
  .ul label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:13.5px;cursor:pointer;background:#fff}
  .ul label.on{background:#FFF1D6;border-color:var(--gy)}.ul .g{width:100%;font-size:12px;font-weight:900;color:var(--sub);margin-top:2px}
  @media (max-width:760px){ .lk{grid-template-columns:1fr} }
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;z-index:9}
  /* 학생 안내문 (A4) */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:12px;width:min(100%,794px);margin:0 auto;padding:36px 44px;display:flex;flex-direction:column;gap:14px}
  .sheet h2{font-size:30px;font-weight:900;text-align:center}
  .sheet .lead{text-align:center;font-size:16px;color:var(--sub);font-weight:700}
  .sheet .top{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
  .sheet .qr svg{width:200px;height:200px}
  .sheet ol{padding-left:22px;font-size:16px;line-height:1.75}
  .sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet .grid div{border:1.5px solid #FFD59A;background:#FFF8E8;border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.55}
  .sheet .grid b{display:block;font-size:15.5px;margin-bottom:2px}
  .sheet .priv{font-size:13.5px;color:var(--sub);text-align:center;border-top:1px dashed var(--line);padding-top:10px}
  .sheet .url{font-size:12.5px;color:var(--sub);word-break:break-all}
  @media print{
    header,.noprint{display:none!important} #app{display:block;height:auto} main{overflow:visible;padding:0}
    body{background:#fff} .sheet{border:0;width:auto;padding:10mm 12mm} @page{size:A4;margin:8mm}
  }
  @media (max-width:760px){ .sum{grid-template-columns:repeat(2,1fr)} .sheet .top{grid-template-columns:1fr;justify-items:center} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>💪 공부 Gym · 교사용</h1>
    <nav class="tabs" id="tabs"><button data-t="in">📥 결과 코드 넣기</button><button data-t="board">📊 반 현황</button><button data-t="guide">🖨️ 학생 안내문</button><button data-t="link">🔗 반 코드·진도 링크</button></nav>
    <span class="sp"></span>
    <a class="back" href="../stuprog/">← 학생 프로그램</a>
  </header>
  <main id="m"></main>
</div>
<script src="../../shared/qr.js"></script>
<script src="map.js"></script>
<script src="feedback.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "gymboard_v1", S, TAB = "board", WEEK = null, SORT = "p";
  var R = {warm: ["🔥", "준비"], kor: ["📖", "국어"], math: ["🧮", "수학"], eng: ["🔤", "영어"], sci: ["🔬", "과학"], soc: ["🌏", "사회"]}, IDS = Object.keys(R), INT = {base: "🙂 기본", rec: "💪 권장", ch: "🔥 도전"};
  function load(){ try{ S = JSON.parse(localStorage.getItem(KEY)) || {e: {}}; }catch(e){ S = {e: {}}; } if(!S.e) S.e = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function b64d(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }
  function toast(t){ var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2200); }
  var m = document.getElementById("m"), tabs = document.getElementById("tabs");
  tabs.addEventListener("click", function(e){ var b = e.target.closest("[data-t]"); if(b){ TAB = b.dataset.t; draw(); } });
  function weeks(){ var w = {}; Object.keys(S.e).forEach(function(k){ w[S.e[k].w] = 1; }); return Object.keys(w).sort().reverse(); }
  function draw(){
    Array.prototype.forEach.call(tabs.children, function(b){ b.setAttribute("aria-current", b.dataset.t === TAB ? "true" : "false"); });
    ({in: drawIn, board: drawBoard, guide: drawGuide, link: drawLink})[TAB]();
  }
  /* 📥 코드 넣기 */
  function drawIn(){
    m.innerHTML = '<div class="card"><b>학생이 보여 준 \'이번 주 결과 코드\'를 붙여 넣어요</b><p class="muted" style="margin:6px 0 10px">학생 앱 → 📅 기록 → 🧾 이번 주 결과 코드 → 복사. 여러 명의 코드를 줄을 바꿔 한꺼번에 넣어도 돼요. 같은 별명·같은 주는 새 코드로 바뀌어요.</p>'
      + '<textarea id="ta" placeholder="GYM1.eyJu… (한 줄에 하나씩)"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="add">📥 반 현황판에 넣기</button><span class="muted">🔒 별명·출석·시간·레벨·마스터 %만 들어 있어요. 이 기기에만 저장돼요.</span></div></div>'
      + '<div class="card muted">💡 결과 코드는 학생이 원할 때만 보여 주는 선택 기능이에요. 학생의 공부 기록은 학생 휴대폰에만 있어요.</div>';
    document.getElementById("add").onclick = function(){
      var t = document.getElementById("ta").value, ok = 0, bad = 0;
      (t.match(/GYM1\.[A-Za-z0-9_-]+/g) || []).forEach(function(c){
        try{ var o = JSON.parse(b64d(c.slice(5))); if(!o || !o.w) throw 0; o.at = Date.now(); S.e[(o.n || "?") + "|" + o.w] = o; ok++; }catch(e){ bad++; }
      });
      if(!ok && !bad){ toast("GYM1.로 시작하는 코드를 찾지 못했어요"); return; }
      save(); toast("📥 " + ok + "명 넣었어요" + (bad ? " · 읽지 못한 코드 " + bad + "개" : ""));
      if(ok){ WEEK = null; TAB = "board"; draw(); }
    };
  }
  /* 📊 반 현황 */
  function drawBoard(){
    var ws = weeks(); if(!WEEK || ws.indexOf(WEEK) < 0) WEEK = ws[0] || null;
    if(!WEEK){ m.innerHTML = '<div class="card"><b>아직 들어온 결과 코드가 없어요</b><p class="muted" style="margin-top:6px">📥 결과 코드 넣기에서 학생 코드를 붙여 넣으면 여기에 반 현황이 보여요.</p></div>'; return; }
    var L = Object.keys(S.e).map(function(k){ return S.e[k]; }).filter(function(o){ return o.w === WEEK; });
    var key = {p: function(o){ return -(o.p || 0); }, a: function(o){ return -(o.a || 0); }, t: function(o){ return -(o.t || 0); }, n: function(o){ return o.n || ""; }}[SORT];
    L.sort(function(a, b){ var x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; });
    var avg = function(f){ return L.length ? Math.round(L.reduce(function(s, o){ return s + (f(o) || 0); }, 0) / L.length * 10) / 10 : 0; };
    var flag = L.filter(function(o){ return (o.a || 0) <= 2; }).length;
    m.innerHTML = '<div class="row noprint"><select id="wk">' + ws.map(function(w){ return '<option value="' + w + '"' + (w === WEEK ? " selected" : "") + ">" + w.replace(/-/g, ".") + " 주</option>"; }).join("") + "</select>"
      + '<select id="so"><option value="p">마스터 % 순</option><option value="a">출석 순</option><option value="t">공부 시간 순</option><option value="n">별명 순</option></select>'
      + '<span class="sp" style="flex:1"></span><button class="btn sub" id="csv">📄 CSV 저장</button><button class="btn gray" id="clr">이 주 지우기</button></div>'
      + '<div class="sum"><div><b>' + L.length + '명</b><span>코드 제출</span></div><div><b>' + avg(function(o){ return o.a; }) + '일</b><span>평균 출석(7일 중)</span></div><div><b>' + avg(function(o){ return o.t; }) + '분</b><span>평균 공부 시간(주)</span></div><div><b>' + avg(function(o){ return o.p; }) + '%</b><span>평균 중학교 마스터</span></div><div><b style="color:var(--ng)">' + flag + '명</b><span>관심 필요 (출석 2일 이하)</span></div></div>'
      + '<div class="card grow sc" style="padding:0"><table><thead><tr><th>별명</th><th>출석</th><th>공부 시간</th><th>강도</th><th>연속</th>' + IDS.map(function(k){ return "<th>" + R[k][0] + " " + R[k][1] + "</th>"; }).join("") + "<th>마스터</th><th>훈련일</th><th></th><th></th></tr></thead><tbody>"
      + L.map(function(o){ return '<tr><td class="nk">' + esc(o.n || "?") + "</td><td>" + (o.a || 0) + "일</td><td>" + (o.t || 0) + "분</td><td>" + (INT[o.i] || "") + "</td><td>🔥" + (o.s || 0) + "</td>"
          + IDS.map(function(k){ return "<td>" + (k === "warm" ? "" : '<span class="bar"><i style="width:' + ((o.m || {})[k] || 0) + '%"></i></span> ' + ((o.m || {})[k] || 0) + "%") + '<span class="lv">Lv.' + ((o.l || {})[k] || 1) + "</span></td>"; }).join("")
          + "<td><b>" + (o.p || 0) + "%</b></td><td>" + (o.d || 0) + "일</td><td>" + ((o.a || 0) <= 2 ? '<span class="flag">관심</span>' : (o.a || 0) >= 6 ? '<span class="ok">꾸준</span>' : "") + '</td><td><button class="x" data-del="' + esc((o.n || "?") + "|" + o.w) + '" title="지우기">✕</button></td></tr>'; }).join("")
      + "</tbody></table></div>";
    document.getElementById("so").value = SORT;
    document.getElementById("wk").onchange = function(){ WEEK = this.value; draw(); };
    document.getElementById("so").onchange = function(){ SORT = this.value; draw(); };
    document.getElementById("clr").onclick = function(){ if(!confirm(WEEK + " 주의 결과를 모두 지울까요?")) return; Object.keys(S.e).forEach(function(k){ if(S.e[k].w === WEEK) delete S.e[k]; }); save(); WEEK = null; draw(); };
    document.getElementById("csv").onclick = function(){
      var rows = [["주", "별명", "출석(일)", "공부 시간(분)", "강도", "연속"].concat(IDS.map(function(k){ return R[k][1] + " Lv"; }), IDS.filter(function(k){ return k !== "warm"; }).map(function(k){ return R[k][1] + " 마스터%"; }), ["중학교 마스터%", "훈련일"])];
      L.forEach(function(o){ rows.push([o.w, o.n, o.a, o.t, (INT[o.i] || "").replace(/^\S+ /, ""), o.s].concat(IDS.map(function(k){ return (o.l || {})[k] || 1; }), IDS.filter(function(k){ return k !== "warm"; }).map(function(k){ return (o.m || {})[k] || 0; }), [o.p, o.d])); });
      var csv = "﻿" + rows.map(function(r){ return r.map(function(v){ v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\r\n");
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"})); a.download = "공부Gym_반현황_" + WEEK + ".csv"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    m.querySelectorAll("[data-del]").forEach(function(b){ b.onclick = function(){ delete S.e[b.dataset.del]; save(); draw(); }; });
  }
  /* 🖨️ 학생 안내문 */
  function drawGuide(){
    var url = new URL("./", location.href).href, q = "";
    try{ q = TTQR.svg(url); }catch(e){ q = ""; }
    m.className = "sc";
    m.innerHTML = '<div class="row noprint" style="justify-content:center"><button class="btn" id="pr">🖨️ 인쇄 (A4 한 장)</button><span class="muted">반 게시판·가정 통신문에 붙이기 좋아요</span></div>'
      + '<div class="sheet"><h2>💪 공부 Gym · 쌤비 PT</h2><p class="lead">하루 60분, 12주 동안 중학교 공부를 마스터하고 고등학교에 입학하자!</p>'
      + '<div class="top"><div class="qr">' + q + '</div><ol><li>휴대폰 카메라로 QR을 찍어 <b>공부 Gym</b>을 열어요.</li><li>브라우저 메뉴에서 <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요.</li><li><b>별명</b>만 정하고(진짜 이름 X), 오늘 컨디션과 이번 주 강도를 골라요.</li><li><b>🔥 준비운동 → 📖 국어 · 🧮 수학 · 🔤 영어 · 🔬 통합과학 · 🌏 통합사회</b> PT실을 10분씩!</li><li>처음 들어간 PT실에서는 <b>🧪 입소 진단</b>으로 이미 아는 단원을 건너뛰어요.</li></ol></div>'
      + '<div class="grid"><div><b>⏱️ 10분 = 출석</b>5분 세트 2개. 첫 세트는 늘 복습 먼저, 두 번째는 오늘 단원.</div><div><b>🏋️ 강도는 주마다</b>🙂 기본 60분 · 💪 권장 90분(방학) · 🔥 도전 120분+</div>'
      + '<div><b>🔁 틀린 문제는 다시 만나요</b>1·2·4·7·14일 뒤 다시 나오고, 14일 뒤에도 맞히면 \'완전히 내 것\'.</div><div><b>🗺️ 마스터 맵</b>단원마다 연습 → 숙달 → 7일 뒤 확인 → ⭐마스터. 100%면 중학교 마스터!</div>'
      + '<div><b>🎟️ 포기하지 않게</b>주 1번 휴식권, 힘든 날은 쉬운 문제, 3일 쉬면 준비운동 10분만.</div><div><b>🏆 측정과 인증</b>주말 종합 PT · 4·8주 검사 · 12주 최종 측정 → 성장 리포트와 인증서.</div></div>'
      + '<p class="priv">🔒 기록은 내 휴대폰에만 저장돼요(서버 없음). 선생님이 준 반 코드를 넣으면 반 코드와 무작위 기기 번호만 보내 ‘우리 반 오늘 출석 ○명’을 함께 봐요. 휴대폰을 바꿀 땐 📅 기록 → 💾 백업 코드. 🧾 결과 코드는 원할 때만 담임 선생님께 보여 줘요.</p>'
      + '<p class="url">' + esc(url) + '</p></div>';
    document.getElementById("pr").onclick = function(){ window.print(); };
  }
  /* 🔗 반 코드 · 📅 진도 링크 */
  var LSUB = "math", LSEL = {}, LCLS = "";
  var SUBN = {kor: "📖 국어", math: "🧮 수학", eng: "🔤 영어", sci: "🔬 과학", soc: "🌏 사회"};
  var FBU = typeof GYM_FEEDBACK !== "undefined" && GYM_FEEDBACK.url || "";
  function gymUrl(q){ return new URL("./", location.href).href + (q ? "?" + q : ""); }
  function qrSvg(u){ try{ return TTQR.svg(u); }catch(e){ return ""; } }
  function ymd(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function drawLink(){
    if(!S.cls) S.cls = [];
    var cls = S.cls, sel = Object.keys(LSEL).filter(function(k){ return LSEL[k]; });
    var units = "";
    if(typeof GYM_MAP !== "undefined" && GYM_MAP[LSUB]) GYM_MAP[LSUB].groups.forEach(function(g){
      units += '<span class="g">' + esc(g.g) + "</span>" + g.f.map(function(f){ return '<label class="' + (LSEL[f[0]] ? "on" : "") + '"><input type="checkbox" data-u="' + f[0] + '"' + (LSEL[f[0]] ? " checked" : "") + ">" + esc(f[1]) + "</label>"; }).join("");
    });
    var pu = sel.length ? gymUrl("p=" + sel.join(",") + (LCLS ? "&c=" + encodeURIComponent(LCLS) : "")) : "";
    m.innerHTML = '<div class="lk">'
      + '<div class="card"><b>🏫 반 코드 · 반 함께 운동</b><p class="muted">반 코드 QR을 찍은 학생은 홈에 “우리 반 오늘 출석 ○명” 한 줄이 보여요(등수·점수 없음). 보내는 것은 반 코드와 무작위 기기 번호뿐이에요.</p>'
      + '<div class="row"><input id="cn" maxlength="6" placeholder="반 이름 (예: 3-3)"><button class="btn" id="cmk">만들기</button></div>'
      + '<div class="cl">' + (cls.length ? cls.map(function(c, i){ return '<div><b>' + esc(c.code) + '</b><button class="btn sub" data-cq="' + i + '">QR</button><span class="n" data-cn="' + esc(c.code) + '">' + (FBU ? "…" : "") + '</span><button class="x" data-cx="' + i + '" title="지우기">✕</button></div>'; }).join("") : '<p class="muted">아직 반 코드가 없어요.</p>') + "</div>"
      + '<div id="cqv"></div>'
      + (FBU ? '<p class="muted" style="font-size:12.5px">건의함 스크립트를 v2.30.0 코드로 바꿔야 출석 수가 모여요 (GYM_FEEDBACK_SETUP.md).</p>' : '<p class="muted" style="font-size:12.5px">건의함(구글 시트)을 연결해야 출석 수가 모여요.</p>') + "</div>"
      + '<div class="card"><b>📅 진도 링크 · 진도 따라가기 모드(중1·2)</b><p class="muted">이번 주에 배운 단원을 고르고 QR을 보여 주세요. 학생 마스터 맵에 그 단원이 열려요(받은 단원은 계속 쌓여요).</p>'
      + '<div class="row"><div class="stab2">' + Object.keys(SUBN).map(function(k){ return '<button data-ls="' + k + '" aria-pressed="' + (k === LSUB) + '">' + SUBN[k] + "</button>"; }).join("") + '</div><select id="lc"><option value="">반 코드 없이</option>' + cls.map(function(c){ return '<option' + (c.code === LCLS ? " selected" : "") + ">" + esc(c.code) + "</option>"; }).join("") + "</select></div>"
      + '<div class="ul">' + units + "</div>"
      + (pu ? '<div class="qrb"><div>' + qrSvg(pu) + '</div><div><b>고른 단원 ' + sel.length + '개</b><p class="u">' + esc(pu) + '</p><div class="row" style="margin-top:6px"><button class="btn sub" id="lcp">주소 복사</button><button class="btn gray" id="lclr">고른 단원 지우기</button></div></div></div>' : '<p class="muted">단원을 고르면 QR이 생겨요.</p>')
      + "</div></div>";
    m.className = "grow";
    document.getElementById("cmk").onclick = function(){
      var n = (document.getElementById("cn").value || "").replace(/[^0-9A-Za-z가-힣]/g, "").slice(0, 6);
      if(!n){ toast("반 이름을 적어 주세요 (예: 3-3)"); return; }
      var r = ""; for(var i = 0; i < 4; i++) r += "ABCDEFGHJKLMNPQRSTUVWXYZ23456789".charAt(Math.floor(Math.random() * 32));
      cls.push({code: n + "-" + r}); save(); drawLink(); toast("🏫 " + n + "-" + r + " 만들었어요");
    };
    m.onclick = function(e){
      var t = e.target;
      if(t.dataset.cq != null){ var c = cls[+t.dataset.cq], u = gymUrl("c=" + encodeURIComponent(c.code)); document.getElementById("cqv").innerHTML = '<div class="qrb"><div>' + qrSvg(u) + '</div><div><b>🏫 ' + esc(c.code) + '</b><p class="u">' + esc(u) + "</p></div></div>"; return; }
      if(t.dataset.cx != null){ if(confirm("반 코드 " + cls[+t.dataset.cx].code + "를 지울까요? (학생 기기의 코드는 그대로예요)")){ cls.splice(+t.dataset.cx, 1); save(); drawLink(); } return; }
      if(t.dataset.ls){ LSUB = t.dataset.ls; drawLink(); return; }
      if(t.id === "lcp"){ var tx = (m.querySelector(".qrb .u") || {}).textContent || ""; try{ navigator.clipboard.writeText(tx).then(function(){ toast("📋 복사했어요"); }); }catch(er){ toast(tx); } return; }
      if(t.id === "lclr"){ LSEL = {}; drawLink(); }
    };
    m.onchange = function(e){ var t = e.target; if(t.dataset.u){ LSEL[t.dataset.u] = t.checked; drawLink(); } else if(t.id === "lc"){ LCLS = t.value; drawLink(); } };
    if(FBU) Array.prototype.forEach.call(m.querySelectorAll("[data-cn]"), function(el){
      fetch(FBU + (FBU.indexOf("?") < 0 ? "?" : "&") + "cls=" + encodeURIComponent(el.dataset.cn) + "&d=" + ymd()).then(function(r){ return r.json(); }).then(function(j){ el.textContent = j && typeof j.n === "number" && j.cls === el.dataset.cn ? "오늘 " + j.n + "명" : "—"; }).catch(function(){ el.textContent = "—"; });
    });
  }
  var _draw = draw; draw = function(){ m.className = ""; m.onclick = null; m.onchange = null; _draw(); };
  load(); if(location.hash === "#guide") TAB = "guide"; else if(location.hash === "#link") TAB = "link"; else if(!Object.keys(S.e).length) TAB = "in"; draw();
})();
</script>
</body>
</html>
