<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style id="ttKeepAll">html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}</style>
<!-- 학생용 · 외부로 자료를 보내는 통로를 막습니다(이 사이트 안의 파일만). 기록은 이 기기 브라우저에만 저장(gym_v1). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD84D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../assets/ssambi3-192.png">
<link rel="apple-touch-icon" href="../../assets/ssambi3-180.png">
<title>공부 Gym · 쌤비 PT</title>
<!--
  💪 공부 Gym (쌤비 PT) — PLAN_공부Gym.md · 1단계 공통 틀
  · 홈: 쌤비 트레이너 · 오늘 링(기본 60 / 권장 90 / 도전 120) · 이번 주 강도 · 준비운동 + PT실 5개
  · PT실: 5분 미니 세트(첫 세트 복습 먼저 → 오늘 단원) · 끝나면 "오늘은 끝 / 한 세트 더"
  · 간격 반복 상자 1~5(1·2·4·7·14일) · 하루 복습 최대치 · XP · 출석(10분) · 휴식권(주 1회) · 복귀 루트(3일 이상 쉬면) · 컨디션
  · 2단계 마스터 시스템: 근섬유(단원) 미진단 → 연습 중 → 숙달(연속 2세트 90%) → 7일 뒤 확인 90% = 마스터⭐ (14일 뒤 다시 확인) · 마스터 맵
  · 문항 자료: rooms.js (GYM_ROOMS), 근섬유 지도: map.js (GYM_MAP). 별명만, 기록은 이 기기에만. 저장: localStorage "gym_v1"
  jidangmath가 Claude와 함께 제작
-->
<style>
  :root{--bg:#FFF3C4;--bg2:#FFE58A;--card:#fff;--ink:#2B2111;--sub:#7A6A45;--line:#F0DC9A;--ac:#FF8A00;--ac2:#FFF0D6;--ok:#1F9D55;--okb:#E3F6EA;--ng:#D63B32;--ngb:#FDE9E7;--t-accent:#FF8A00}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer}
  #app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:520px;margin:0 auto;background:var(--bg)}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;padding-top:max(10px,env(safe-area-inset-top))}
  header h1{font-size:19px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  header h1 small{font-size:12.5px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:800;white-space:nowrap}
  .chip.hot{background:#FFE1C2;border-color:#FFC47A;color:#B14E00}
  .ib{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:36px;height:34px;font-size:15px;font-weight:800}
  main{min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 14px 10px;gap:10px}
  nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{border:0;background:none;font-size:12px;font-weight:800;color:var(--sub);padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button b{font-size:21px;line-height:1}
  nav button[aria-current=true]{color:var(--ac)}
  body.focus nav{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
  .muted{color:var(--sub);font-size:13px}
  .grow{flex:1;min-height:0}
  .sc{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
  .btn{display:block;width:100%;border:0;border-radius:16px;background:var(--ac);color:#fff;font-size:17px;font-weight:900;padding:14px;box-shadow:0 3px 0 #C96A00}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #C96A00}
  .btn.sub{background:#fff;color:#B14E00;border:2px solid #FFC47A;box-shadow:none}
  .btn.dark{background:#2B2111;box-shadow:0 3px 0 #000}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:8px}.row>*{flex:1}
  /* 쌤비 트레이너 + 말풍선 */
  .coach{display:flex;align-items:center;gap:6px;min-height:0}
  .coach .sb{flex:none;cursor:pointer}
  .coach .sb .sbArt{animation:hop 2.6s ease-in-out infinite}
  @keyframes hop{0%,80%,100%{transform:none}86%{transform:translateY(-5px)}92%{transform:none}}
  .bub{position:relative;flex:1;background:#fff;border:2px solid #2B2111;border-radius:16px;padding:9px 12px;font-size:15px;font-weight:800;line-height:1.45;word-break:keep-all}
  .bub:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#2B2111;border-left:0}
  .bub small{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-top:2px}
  /* 오늘 링 */
  .today{display:flex;align-items:center;gap:12px}
  .ring{position:relative;flex:none;width:112px;height:112px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
  .ring .in b{font-size:27px;font-weight:900}.ring .in span{font-size:12px;color:var(--sub);font-weight:800}
  .ring.full svg{filter:drop-shadow(0 0 6px #FFB000)}
  .tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .tinfo .lv{display:flex;gap:6px;flex-wrap:wrap}
  .int{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#FFE9A8;border-radius:12px;padding:3px}
  .int button{border:0;background:none;border-radius:9px;font-size:13px;font-weight:900;padding:6px 2px;color:#8A6A1C;line-height:1.15}
  .int button small{display:block;font-size:10.5px;font-weight:700}
  .int button[aria-pressed=true]{background:#fff;color:#B14E00;box-shadow:0 1px 3px #0002}
  .attend{display:flex;gap:4px;align-items:center;font-size:12.5px;font-weight:800;color:var(--sub)}
  .attend i{width:16px;height:16px;border-radius:50%;background:#EADFBF;display:inline-grid;place-items:center;font-size:10px;font-style:normal;color:#fff}
  .attend i.on{background:var(--ok)}
  /* 준비운동 입구 + PT실 문 */
  .warm{display:flex;align-items:center;gap:12px;border:0;border-radius:18px;padding:11px 14px;background:linear-gradient(135deg,#FF7A45,#FFA24C);color:#fff;text-align:left;box-shadow:0 3px 0 #D2551F;width:100%}
  .warm .e{font-size:30px}.warm b{font-size:17px;font-weight:900;display:block}.warm span{font-size:12.5px;opacity:.92;font-weight:700}
  .warm .m{margin-left:auto;text-align:right;font-weight:900;font-size:15px;white-space:nowrap}
  .warm.done{background:linear-gradient(135deg,#1F9D55,#45C27A);box-shadow:0 3px 0 #13703B}
  .doors{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;flex:1;min-height:0;max-height:190px}
  .door{position:relative;border:2px solid var(--line);background:#fff;border-radius:16px 16px 10px 10px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;min-height:0;overflow:hidden}
  .door:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
  .door .e{font-size:25px;line-height:1;margin-top:4px}
  .door b{font-size:13.5px;font-weight:900;line-height:1.1;text-align:center}
  .door small{font-size:11px;color:var(--sub);font-weight:700}
  .door .bar{width:78%;height:7px;border-radius:4px;background:#F2EAD3;overflow:hidden}.door .bar i{display:block;height:100%;background:var(--c);border-radius:4px}
  .door .mn{font-size:11.5px;font-weight:900;color:var(--c)}
  .door.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
  .door .ck{position:absolute;right:4px;top:8px;font-size:12px}
  .door .rx{position:absolute;left:3px;top:8px;font-size:10px;font-weight:900;color:#fff;background:#D63B32;border-radius:6px;padding:0 3px}
  /* PT실 입구 */
  .rhead{display:flex;align-items:center;gap:10px}
  .rhead .e{font-size:34px}.rhead h2{font-size:22px;font-weight:900}.rhead p{font-size:13px;color:var(--sub);font-weight:700}
  .sets{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .set{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
  .set>div{min-width:0}
  .set .n{width:30px;height:30px;border-radius:50%;background:var(--ac2);color:#B14E00;font-weight:900;display:grid;place-items:center;flex:none}
  .set.done .n{background:var(--ok);color:#fff}
  .set b{font-size:14.5px;display:block}.set div span{font-size:12px;color:var(--sub);display:block;line-height:1.35}
  .grow2{display:flex;flex-direction:column;gap:5px}
  .gbar{height:14px;border-radius:8px;background:#F2EAD3;overflow:hidden;position:relative}.gbar i{display:block;height:100%;border-radius:8px}
  .glab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--sub)}
  .badge{display:inline-block;font-size:12px;font-weight:900;border-radius:8px;padding:2px 7px;background:#FDE9E7;color:#D63B32}
  /* 훈련 중 */
  .ttop{display:flex;align-items:center;gap:8px}
  .ttop .lab{font-size:13px;font-weight:900;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clk{font-variant-numeric:tabular-nums;font-size:24px;font-weight:900;color:#2B2111;background:#fff;border:2px solid #2B2111;border-radius:12px;padding:1px 10px}
  .clk.low{color:var(--ng);border-color:var(--ng)}
  .tbar{height:6px;border-radius:3px;background:#F2EAD3;overflow:hidden}.tbar i{display:block;height:100%;background:var(--ac);transition:width .3s linear}
  .tstat{display:flex;gap:6px;font-size:13px;font-weight:800;color:var(--sub);align-items:center}
  .combo{margin-left:auto;font-weight:900;color:#B14E00;font-size:15px}
  .combo.pop{animation:pop .35s}
  @keyframes pop{50%{transform:scale(1.35)}}
  .qcard{flex:1;min-height:0;background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:auto;position:relative}
  .qcard .tg{position:absolute;left:12px;top:10px;font-size:11.5px;font-weight:900;border-radius:7px;padding:2px 7px;background:var(--ac2);color:#B14E00}
  .qcard .tg.rv{background:#E6EEFF;color:#2F5BD3}
  .qq{font-size:19px;font-weight:800;line-height:1.6;text-align:center;word-break:keep-all}
  .qq.big{font-size:30px;font-variant-numeric:tabular-nums}
  .qq u{text-decoration:none;background:linear-gradient(transparent 58%,#FFD84D 58%);padding:0 2px}
  .qq sup,.ch sup,.fb sup{font-size:.62em}
  .frc{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.08;margin:0 2px}
  .frc i{font-style:normal;padding:0 2px}.frc i:first-child{border-bottom:1.5px solid currentColor}
  .num .disp .hint{font-size:12px;color:#BCA977;font-weight:700;margin-left:6px}
  .qa{font-size:13.5px;color:var(--sub);font-weight:800;text-align:center}
  .qcard.ok{border-color:var(--ok);background:var(--okb)}.qcard.ng{border-color:var(--ng);background:var(--ngb)}
  .fb{font-size:14.5px;line-height:1.5;text-align:center;font-weight:700}
  .fb b{display:block;font-size:16px;color:var(--ng)}
  .pad{flex:none}
  .ch{display:grid;grid-template-columns:1fr;gap:7px}
  .ch button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font-size:15.5px;font-weight:700;text-align:left;line-height:1.35;word-break:keep-all}
  .ch button.ok{border-color:var(--ok);background:var(--okb)}.ch button.ng{border-color:var(--ng);background:var(--ngb)}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ox button{border:2px solid var(--line);background:#fff;border-radius:18px;font-size:44px;font-weight:900;padding:12px 0}
  .ox button:first-child{color:#2F80ED}.ox button:last-child{color:var(--ng)}
  .ox button.ok{border-color:var(--ok);background:var(--okb)}.ox button.ng{border-color:var(--ng);background:var(--ngb)}
  .num{display:flex;flex-direction:column;gap:7px}
  .num .disp{height:52px;background:#fff;border:2px solid #2B2111;border-radius:14px;font-size:28px;font-weight:900;text-align:center;line-height:48px;font-variant-numeric:tabular-nums}
  .num .disp:empty:before{content:attr(data-ph);font-size:15px;color:#BCA977;font-weight:700}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .keys button{border:0;background:#fff;border-radius:12px;font-size:22px;font-weight:900;height:48px;box-shadow:0 2px 0 #E2D2A0}
  .keys button:active{transform:translateY(2px);box-shadow:none}
  .keys .go{grid-row:span 2;height:auto;background:var(--ac);color:#fff;box-shadow:0 2px 0 #C96A00;font-size:18px}
  .keys .fn{background:#FFE9A8;font-size:18px}
  /* 결과 */
  .res{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .res .xp{font-size:40px;font-weight:900;color:#B14E00;line-height:1}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:900}.stat span{font-size:11.5px;color:var(--sub);font-weight:700}
  .win{background:#fff;border:2px dashed #FFC47A;border-radius:14px;padding:9px 12px;font-size:14.5px;font-weight:800;text-align:center}
  .meta{display:flex;flex-direction:column;gap:6px}
  .meta .h{font-size:14px;font-weight:900;display:flex;justify-content:space-between}
  .meta .h i{font-style:normal;color:var(--sub);font-size:12.5px}
  .mopts{display:flex;gap:6px;flex-wrap:wrap}
  .mopts button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:800}
  .mopts button[aria-pressed=true]{border-color:#2F5BD3;background:#E6EEFF;color:#2F5BD3}
  /* 측정·인증 (9단계) */
  nav button{font-size:11.5px}
  .lvrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .lvrow span{background:#fff;border:1.5px solid var(--c);border-radius:10px;text-align:center;font-size:16px;padding:3px 0;line-height:1.2}
  .lvrow b{display:block;font-size:11.5px;color:var(--c)}
  .mlist2{display:flex;flex-direction:column;gap:6px}
  .mrow{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px}
  .mrow>div{flex:1;min-width:0}.mrow b{display:block;font-size:14.5px}.mrow>div>span{font-size:12px;color:var(--sub);display:block;line-height:1.35}
  .mrow .mi{font-size:24px}.mrow.done{border-color:var(--ok);background:#F4FBF6}
  .mini.go{background:var(--ac);color:#fff;border-color:var(--ac)}
  .rtab{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .rtab div{background:#fff;border:1.5px solid var(--c);border-radius:12px;padding:5px 8px;display:flex;flex-direction:column;font-size:12px;line-height:1.35}
  .rtab b{font-size:13.5px}.rtab em{font-style:normal;font-weight:900;color:var(--c)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .finrow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.finrow .chip{font-size:12.5px}
  textarea.code{width:100%;height:110px;font:12px/1.4 ui-monospace,monospace;border:2px solid #2B2111;border-radius:12px;padding:8px;word-break:break-all}
  /* 통합과학 PT (7단계) */
  .qcard.dsq{justify-content:flex-start;padding-top:32px;gap:6px}
  .dset{display:flex;flex-direction:column;gap:4px}
  .dtt{font-size:13.5px;font-weight:900;color:#2F5BD3}
  .chart{width:100%;max-height:min(24dvh,170px);background:#FFFDF6;border:1px solid var(--line);border-radius:12px}
  .dtab{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center;background:#FFFDF6;border-radius:10px;overflow:hidden}
  .dtab th,.dtab td{border:1px solid var(--line);padding:4px 3px}.dtab th{background:#FFF3C4;font-weight:900}
  .qq.qs{font-size:16px;line-height:1.5}
  .pv{display:flex;flex-direction:column;gap:6px}
  .pvr{display:flex;gap:8px;align-items:flex-start;background:#FFFDF6;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.55;text-align:left}
  .pvr b{flex:none;width:28px;height:28px;border-radius:50%;background:#E05BA8;color:#fff;display:grid;place-items:center;font-size:14px}
  .pvr:nth-child(2) b{background:#2F80ED}
  .dset.two .chart{max-height:min(15dvh,118px)}
  /* 영어 PT (5단계) */
  .toks{font-size:19px;font-weight:800;line-height:2.1;text-align:center;word-break:normal}
  .toks .tk{display:inline}
  .gap{display:inline-block;width:20px;height:30px;vertical-align:middle;border:0;background:none;position:relative;margin:0 1px}
  .gap:after{content:"";position:absolute;left:9px;top:4px;bottom:4px;border-left:2px dotted #D9C88F}
  .gap.on:after{border-left:3px solid #2F80ED;transform:skewX(-18deg)}
  .gap.on.ok:after{border-left-color:var(--ok)}.gap.on.ng:after{border-left-color:var(--ng)}.gap.on.miss:after{border-left:3px dashed var(--ok);transform:skewX(-18deg)}
  .toks.vb .tk{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:2px 8px;margin:3px 1px;font-size:18px;font-weight:800;line-height:1.5}
  .toks.vb .tk.ok{border-color:var(--ok);background:var(--okb)}.toks.vb .tk.ng{border-color:var(--ng);background:var(--ngb)}
  .tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .tiles button{width:42px;height:46px;border:0;border-radius:11px;background:#fff;box-shadow:0 2px 0 #E2D2A0;font-size:21px;font-weight:900}
  .tiles button:disabled{opacity:.25}
  .lsn{display:flex;gap:10px;justify-content:center}
  .spk{width:84px;height:84px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:38px;box-shadow:0 3px 0 #C96A00}
  .spk.slow{width:56px;height:56px;font-size:24px;align-self:flex-end;background:#FFE9A8;box-shadow:0 2px 0 #E2D2A0}
  /* 국어 PT (4단계) */
  .qcard.read{justify-content:flex-start;padding-top:34px;gap:6px}
  .ptitle{font-size:17px;font-weight:900}.ptitle small{font-size:12px;color:var(--sub);font-weight:700}
  .ptext{flex:1;min-height:0;overflow:auto;font-size:16px;line-height:1.85;text-align:left;word-break:keep-all;padding-right:4px}
  .ptext p{margin-bottom:.7em;text-indent:.6em}.ptext p:last-child{margin-bottom:0}
  .ptext.dlgp{max-height:62dvh;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .pbtn{position:absolute;right:10px;top:8px;border:1px solid var(--line);background:#FFF8E1;border-radius:9px;padding:3px 8px;font-size:12.5px;font-weight:900}
  .btn small{font-size:13px;opacity:.85;margin-left:6px;font-variant-numeric:tabular-nums}
  /* 수학 PT (3단계) */

<script>
(function(){
  "use strict";
  var R = GYM_ROOMS, IDS = R.order, KEY = "gym_v1";
  var SET_SEC = 300, ATT_SEC = 600, REV_MAX = 30, BOX_DAYS = {1: 1, 2: 2, 3: 4, 4: 7, 5: 14};
  if(/[?&]fast=1/.test(location.search)) SET_SEC = +(new URLSearchParams(location.search).get("sec") || 15);   // 화면 점검용(세트 15초). 출석 시간은 실제로 한 시간만 셉니다.
  var INT = {
    base: {name: "기본", emo: "🙂", sub: "60분", goal: {warm: 10, kor: 10, math: 10, eng: 10, sci: 10, soc: 10}, total: 60},
    rec:  {name: "권장", emo: "💪", sub: "90분", goal: {warm: 10, kor: 20, math: 20, eng: 20, sci: 10, soc: 10}, total: 90},
    ch:   {name: "도전", emo: "🔥", sub: "120분+", goal: {warm: 10, kor: 20, math: 20, eng: 20, sci: 10, soc: 10}, total: 120}
  };
  var COND = {good: ["😆", "좋음"], ok: ["🙂", "보통"], hard: ["😮‍💨", "힘듦"]};

  /* ── 날짜 ── */
  function ymd(d){ d = d || new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function pd(s){ var a = s.split("-"); return new Date(+a[0], a[1] - 1, +a[2]); }
  function add(s, n){ var d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function diff(a, b){ return Math.round((pd(b) - pd(a)) / 864e5); }
  function monday(s){ var d = pd(s), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); }
  var TODAY = ymd();

  /* ── 저장 (이 기기에만) ── */
  var S;
  function blank(){ return {v: 1, nick: "", start: TODAY, week: null, days: {}, xp: {}, lv: {}, rx: {}, cards: {}, ptr: {}, conf: [], restUsed: {}, last: null, fib: {}, cur: {}, intake: {}, kp: null, kpDone: {}, kr: [], dsDone: {}}; }
  function load(){ try{ S = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ S = blank(); } var b = blank(); for(var k in b) if(S[k] == null) S[k] = b[k]; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("저장 공간이 부족해요"); } }
  function day(s){ s = s || TODAY; var d = S.days[s]; if(!d){ d = S.days[s] = {sec: {}, xp: 0, sets: {}, n: {}, ok: {}, t: {}, rev: {}}; } return d; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function fmtE(s){ return esc(s).replace(/\^(\d+|□)/g, "<sup>$1</sup>"); }   // 해설: 지수만
  function fmt(s){ return fmtE(s).replace(/\[([^\]]+)\]/g, "<u>$1</u>").replace(/(\d+)\/(\d+)/g, '<span class="frc"><i>$1</i><i>$2</i></span>'); }
  function frStr(f){ return (f[0] < 0 ? "−" : "") + Math.abs(f[0]) + (f[1] === 1 ? "" : "/" + f[1]); }
  /* 숫자 답 맞는지: 분수 답(fr)은 값이 같으면 정답 */
  function checkNum(it, s){
    if(it.fr){ var m = /^(-?\d+)(?:\/(\d+))?$/.exec(s); if(!m) return false; var p = +m[1], q = m[2] ? +m[2] : 1; return q > 0 && p * it.fr[1] === it.fr[0] * q; }
    return parseFloat(s) === it.n;
  }
  function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  /* ── 하루 계산 ── */
  function trained(s){ var d = S.days[s]; if(!d) return false; for(var k in d.sec) if(d.sec[k] >= ATT_SEC) return true; return false; }
  function attCount(s){ var d = S.days[s], n = 0; if(d) IDS.forEach(function(k){ if((d.sec[k] || 0) >= ATT_SEC) n++; }); return n; }
  function intensity(){ return INT[(S.week && S.week.int) || "base"]; }
  function goalMin(id){
    var d = day();
    if(d.back) return id === "warm" ? 10 : 0;
    var g = intensity().goal[id], rx = S.rx[id];
    if(rx && rx.until >= TODAY) g += rx.plus;
    return g;
  }
  function totalGoal(){ if(day().back) return 10; var t = intensity().total; IDS.forEach(function(k){ var rx = S.rx[k]; if(rx && rx.until >= TODAY) t += rx.plus; }); return t; }
  function mins(id, s){ var d = S.days[s || TODAY]; return d ? Math.floor((d.sec[id] || 0) / 60) : 0; }
  function totalMin(s){ var d = S.days[s || TODAY], t = 0; if(d) for(var k in d.sec) t += d.sec[k]; return Math.floor(t / 60); }
  function streak(){
    var s = trained(TODAY) ? TODAY : add(TODAY, -1), n = 0;
    while(S.days[s] && (trained(s) || S.days[s].rest)){ if(trained(s)) n++; s = add(s, -1); }
    return n;
  }
  function trainDays(){ return Object.keys(S.days).filter(trained).length; }
  function restLeft(){ return S.restUsed[monday(TODAY)] ? 0 : 1; }
  /* 처음 열 때: 휴식권(하루 빠진 날 자동) · 복귀 루트(3일 이상 쉼) */
  function dailyCheck(){
    var msg = "";
    var y = add(TODAY, -1), y2 = add(TODAY, -2);
    if(S.last && !trained(y) && !(S.days[y] && S.days[y].rest) && (trained(y2) || (S.days[y2] && S.days[y2].rest)) && !S.restUsed[monday(y)]){
      day(y).rest = true; S.restUsed[monday(y)] = y; msg = "🎟️ 어제는 휴식권을 썼어요. 연속 기록은 그대로!";
    }
    var d = day();
    if(d.back == null){
      var gap = S.last ? diff(S.last, TODAY) - 1 : 0;
      d.back = gap >= 3 && !trained(TODAY);
    }
    save(); return msg;
  }

  /* ── 레벨·XP·근육 단계 ── */
  var STAGE = [0, 200, 500, 1000, 1700, 2600, 3800, 5300, 7200, 9500, 12500];
  function stage(x){ var i = 0; while(i < STAGE.length - 1 && x >= STAGE[i + 1]) i++; return i; }
  function stageBar(x){ var i = stage(x); if(i >= STAGE.length - 1) return 1; return (x - STAGE[i]) / (STAGE[i + 1] - STAGE[i]); }
  function lv(id){ return S.lv[id] || 1; }
  function totalXP(){ var t = 0; IDS.forEach(function(k){ t += S.xp[k] || 0; }); return t; }

  /* ── 문항 고르기: 복습 먼저 → 신규 ── */
  var BANKIX = {};
  IDS.forEach(function(k){ (R[k].bank || []).concat(R[k].deep || [], R[k].vocab || []).forEach(function(it){ BANKIX[it.id] = it; }); });
  function roomOf(id){ return id.split(":")[0]; }
  function itemFromCard(c, id){ var b = BANKIX[id]; if(b) return b.rev ? b.rev() : b; return c.q ? Object.assign({id: id}, c.q) : null; }
  /* 🔊 휴대폰 음성(영어) — 이 기기 안에서 읽어 줌 */
  var TTS = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
  function speak(t, slow){
    if(!TTS || !t) return;
    try{
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t), vs = speechSynthesis.getVoices().filter(function(v){ return /^en[-_]US/i.test(v.lang); });
      u.lang = "en-US"; u.rate = slow ? .65 : .92; if(vs.length) u.voice = vs[0];
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function dueCards(room, minBox){
    var out = [];
    for(var id in S.cards){ var c = S.cards[id]; if(c.b > 5 || !c.d || c.d > TODAY) continue; if(room && c.r !== room) continue; if(minBox && c.b < minBox) continue; out.push(id); }
    out.sort(function(a, b){ var A = S.cards[a], B = S.cards[b]; return A.b - B.b || (A.d < B.d ? -1 : A.d > B.d ? 1 : 0); });
    return out;
  }
  function revLeft(room){ return Math.max(0, REV_MAX - (day().rev[room] || 0)); }
  /* 어휘 줄(국어): 섞은 순서대로, 한 바퀴 돈 뒤에는 '완전히 내 것'이 아닌 것부터 */
  function nextVocab(room){
    var v = R[room].vocab, k = room + "v"; if(!S.ord) S.ord = {};
    if(v.some(function(x){ return x.lv > 1; })){   // 단계가 있는 낱말(영어): 이번 주차 단계까지, 안 본 낱말을 낮은 단계부터
      var sn = stageNow(), un = v.filter(function(x){ return (x.lv || 1) <= sn && !S.cards[x.id]; });
      if(un.length){ var lo = Math.min.apply(null, un.map(function(x){ return x.lv || 1; })); return pick(un.filter(function(x){ return (x.lv || 1) === lo; })); }
      var nm2 = v.filter(function(x){ var c = S.cards[x.id]; return (x.lv || 1) <= sn && (!c || c.b <= 5); });
      return pick(nm2.length ? nm2 : v);
    }
    if(!S.ord[k] || S.ord[k].length !== v.length) S.ord[k] = shuffle(v.map(function(_, i){ return i; }));
    var p = S.ptr[k] || 0; S.ptr[k] = p + 1;
    if(p < v.length) return v[S.ord[k][p]];
    var nm = v.filter(function(x){ var c = S.cards[x.id]; return !c || c.b <= 5; });
    return pick(nm.length ? nm : v);
  }
  function newItem(room){
    var r0 = R[room];
    if(r0.listen && TTS && ((S.week && S.week.int) || "base") !== "base" && (day().sets[room] || 0) >= 1 && Math.random() < .3) return pick(r0.listen);   // 🎧 듣기(권장·도전)
    if(r0.vocab){   // 첫 세트: 새 어휘 하루 6개 → 카드 / 두 번째: 카드 / 추가 세트: 어휘 반 카드 반
      var si = day().sets[room] || 0, kv = day().kv || 0, cf0 = curFiber(room);
      if(!cf0 || (si === 0 ? kv < (r0.vocabDaily || 6) : si >= 2 && Math.random() < .5)) return nextVocab(room);

      + '<div class="rtab">' + SUBJ.map(function(k){ var ip = intakePct(k), fp = fin && fin.r[k] ? pctOf(fin.r[k]) : null;
          return '<div style="--c:' + R[k].col + '"><b>' + R[k].emo + " " + R[k].name.replace("통합", "") + "</b><span>입소 " + (ip == null ? "—" : ip + "%") + " → " + (fp == null ? "—" : "<em>" + fp + "%</em>") + "</span><span>마스터 " + masterPct(k) + "% · Lv." + lv(k) + "</span></div>"; }).join("") + "</div>"
      + '<div class="kv"><div class="stat"><b>' + trainDays() + '일</b><span>훈련일</span></div><div class="stat"><b>' + Math.round(totalMinAll() / 60 * 10) / 10 + '시간</b><span>공부 시간</span></div><div class="stat"><b>' + allPct() + '%</b><span>중학교 마스터</span></div>'
      + '<div class="stat"><b>' + mine + '</b><span>완전히 내 것</span></div><div class="stat"><b>' + (spd0 && spd1 && spd1 !== spd0 ? (spd1.cpm >= spd0.cpm ? "+" : "") + Math.round((spd1.cpm - spd0.cpm) / spd0.cpm * 100) + "%" : "—") + '</b><span>읽기 속도 변화</span></div><div class="stat"><b>' + (t.c4 && t.c4.rx.length ? (t.c8 ? t.c4.rx.filter(function(k){ return t.c8.up.indexOf(k) >= 0; }).length + "/" + t.c4.rx.length : "8주 뒤") : "—") + '</b><span>처방 후 회복</span></div></div>'
      + '<div class="grow"></div>'
      + (g ? '<button class="btn" data-a="cert">' + g[1] + " " + g[0] + " 인증서 만들기</button>" : '<div class="win">🎖️ 인증서: ' + (fin && fin.d ? "완주 기준(훈련일 50일)에 " + Math.max(0, 50 - trainDays()) + "일 남았어요" : "12주차 최종 측정을 마치면 만들 수 있어요") + "</div>");
  }

  /* 그림 카드(인증서·주간 카드) — 캔버스로 그려 PNG 저장, 이름은 넣지 않음 */
  function sbImg(size, opts){
    return new Promise(function(res){
      if(!window.TT_SBART){ res(null); return; }
      var svg = TT_SBART.svg(Object.assign({acc: "trainer", size: size}, opts || {})).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
      var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); };
      im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
  }
  var FONT = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  function rr(x, c, X, Y, W, H, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); x.fillStyle = c; x.fill(); }
  function txt(x, s, X, Y, sz, col, w, al){ x.font = (w || 700) + " " + sz + "px " + FONT; x.fillStyle = col || "#2B2111"; x.textAlign = al || "left"; x.fillText(s, X, Y); }
  function showPic(cv, fname, title){
    var url = cv.toDataURL("image/png");
    dlg('<h3>' + title + '</h3><img src="' + url + '" alt="' + esc(title) + '" style="width:100%;border-radius:14px;border:1px solid var(--line)"><div class="row"><button class="btn sub" data-x="1">닫기</button><a class="btn" style="text-align:center;text-decoration:none" href="' + url + '" download="' + fname + '">💾 저장</a></div><p class="muted" style="text-align:center">🔒 이름은 들어가지 않아요' + (fname.indexOf("인증서") >= 0 ? " · 인쇄 후 이름 칸에 직접 적어요" : "") + "</p>");
  }
  handlers.cert = function(){
    var g = grade(); if(!g) return;
    sbImg(260, {item: "stamp"}).then(function(im){
      var cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1500; var x = cv.getContext("2d"), t = tests();
      x.fillStyle = "#FFF3C4"; x.fillRect(0, 0, 1080, 1500);
      x.strokeStyle = "#E8A200"; x.lineWidth = 14; x.strokeRect(36, 36, 1008, 1428); x.lineWidth = 3; x.strokeRect(62, 62, 956, 1376);
      txt(x, "입학 준비 인증서", 540, 190, 72, "#2B2111", 900, "center");
      txt(x, "공부 Gym · 쌤비 PT · 중학교 마스터 12주", 540, 245, 30, "#7A6A45", 700, "center");
      if(im) x.drawImage(im, 410, 270, 260, 260);
      rr(x, "#FF8A00", 290, 560, 500, 110, 55); txt(x, g[1] + " " + g[0], 540, 635, 54, "#fff", 900, "center");
      txt(x, g[2], 540, 715, 26, "#7A6A45", 700, "center");
      txt(x, "별명  " + (S.nick || "-"), 150, 800, 34, "#2B2111", 800);
      txt(x, "이름  ______________________", 150, 860, 34, "#2B2111", 800);
      txt(x, "기간  " + S.start + " ~ " + (t.fin && t.fin.d ? t.fin.d : TODAY) + "   ·   훈련일 " + trainDays() + "일", 150, 920, 28, "#5a4a25", 700);
      SUBJ.forEach(function(k, i){
        var Y = 990 + i * 74, mp = masterPct(k), ip = intakePct(k), fp = t.fin && t.fin.r[k] ? pctOf(t.fin.r[k]) : null;
        txt(x, R[k].name, 150, Y + 30, 30, "#2B2111", 800);
        rr(x, "#F2E3B0", 330, Y + 6, 380, 32, 16); if(mp) rr(x, R[k].col, 330, Y + 6, Math.max(32, 380 * mp / 100), 32, 16);
        txt(x, "마스터 " + mp + "%", 728, Y + 32, 25, R[k].col, 900);
        txt(x, (ip == null ? "" : "입소 " + ip + "→") + (fp == null ? "" : fp + "%"), 935, Y + 32, 22, "#7A6A45", 700, "right");
      });
      txt(x, "위 학생은 공부 Gym 12주 과정을 성실히 마쳤으므로 이 증서를 드립니다.", 540, 1390, 28, "#2B2111", 700, "center");
      txt(x, "jidangmath가 Claude와 함께 제작", 540, 1430, 20, "#A8966A", 600, "center");
      showPic(cv, "공부Gym_인증서.png", "🎖️ " + g[0] + " 인증서");
    });
  };
  handlers.wcard = function(){
    sbImg(220).then(function(im){
      var cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1080; var x = cv.getContext("2d"), mon = monday(TODAY), tot = 0, att = 0, xp = 0;
      x.fillStyle = "#FFF3C4"; x.fillRect(0, 0, 1080, 1080);
      rr(x, "#fff", 50, 50, 980, 980, 48);
      txt(x, "💪 이번 주 공부 Gym", 100, 150, 56, "#2B2111", 900);
      txt(x, mon.replace(/-/g, ".") + " ~ " + add(mon, 6).slice(5).replace("-", "."), 100, 205, 30, "#7A6A45", 700);
      if(im) x.drawImage(im, 800, 70, 200, 200);
      ["월", "화", "수", "목", "금", "토", "일"].forEach(function(w, i){
        var s = add(mon, i), mn = totalMin(s), d = S.days[s], X = 100 + i * 128;
        tot += mn; if(trained(s)) att++; if(d) xp += d.xp || 0;
        rr(x, s > TODAY ? "#F7F1DD" : d && d.rest && !trained(s) ? "#D9E6FF" : mn >= 60 ? "#FF8A00" : mn >= 20 ? "#FFB547" : mn > 0 ? "#FFD98A" : "#F2EAD3", X, 270, 108, 108, 26);
        txt(x, w, X + 54, 310, 30, "#2B2111", 800, "center"); txt(x, s > TODAY ? "" : d && d.rest && !trained(s) ? "🎟" : mn + "분", X + 54, 355, 26, "#2B2111", 800, "center");
      });
      var stat = [["출석", att + "일"], ["공부 시간", tot + "분"], ["XP", "+" + xp], ["연속", "🔥" + streak()]];
      stat.forEach(function(s2, i){ var X = 100 + i * 225; rr(x, "#FFF3C4", X, 420, 205, 130, 26); txt(x, s2[1], X + 102, 490, 44, "#B14E00", 900, "center"); txt(x, s2[0], X + 102, 530, 24, "#7A6A45", 700, "center"); });
      txt(x, "과목별 근육 (마스터 %)", 100, 610, 30, "#2B2111", 800);
      IDS.forEach(function(k, i){ var Y = 640 + i * 58, v = k === "warm" ? Math.min(100, Math.round(stageBar(S.xp.warm || 0) * 100)) : masterPct(k);
        txt(x, R[k].name, 100, Y + 36, 28, "#2B2111", 800); rr(x, "#F2E3B0", 300, Y + 12, 560, 30, 15); if(v) rr(x, R[k].col, 300, Y + 12, Math.max(30, 560 * v / 100), 30, 15);
        txt(x, k === "warm" ? "Lv." + lv(k) : v + "% · Lv." + lv(k), 880, Y + 36, 26, R[k].col, 900); });
      txt(x, "공부 Gym · 쌤비 PT", 540, 1000, 24, "#A8966A", 700, "center");
      showPic(cv, "공부Gym_주간카드_" + mon + ".png", "📸 이번 주 카드");
    });
  };

  /* 코드: 주간 결과 코드(담임에게) · 백업 코드(휴대폰 바꿀 때) */
  function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function b64d(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "="; return decodeURIComponent(escape(atob(s))); }
  function weekCode(){
    var mon = monday(TODAY), att = 0, tot = 0, L = {}, M = {};
    for(var i = 0; i < 7; i++){ var s = add(mon, i); if(trained(s)) att++; tot += totalMin(s); }
    IDS.forEach(function(k){ L[k] = lv(k); if(k !== "warm") M[k] = masterPct(k); });
    return "GYM1." + b64e(JSON.stringify({n: S.nick || "", w: mon, a: att, t: tot, i: (S.week && S.week.int) || "base", s: streak(), l: L, m: M, p: allPct(), d: trainDays()}));
  }
  handlers.wcode = function(){
    var c = weekCode();
    dlg('<h3>🧾 이번 주 결과 코드</h3><p class="muted">원할 때만 담임 선생님께 보여 주세요. 별명·출석 일수·공부 시간·강도·과목별 레벨·마스터 %만 들어 있어요.</p><textarea class="code" readonly>' + c + '</textarea><div class="row"><button class="btn sub" data-x="1">닫기</button><button class="btn" data-a2="copy">📋 복사</button></div>');
  };
  handlers.bcode = function(){
    var c = "GYMB." + b64e(JSON.stringify(S));
    dlg('<h3>💾 백업 코드</h3><p class="muted">휴대폰을 바꿀 때 이 코드를 새 휴대폰의 \'백업 코드 넣기\'에 붙여 넣으면 기록이 옮겨져요. 남에게 보내지 마세요.</p><textarea class="code" readonly>' + c + '</textarea><div class="row"><button class="btn sub" data-a2="savefile">📄 파일로 저장</button><button class="btn" data-a2="copy">📋 복사</button></div><button class="btn sub" data-x="1">닫기</button>');
  };
  handlers.bload = function(){
    dlg('<h3>📥 백업 코드 넣기</h3><p class="muted">지금 이 휴대폰의 공부 Gym 기록은 백업 코드의 기록으로 바뀌어요.</p><textarea class="code" placeholder="GYMB.로 시작하는 코드를 붙여 넣어요"></textarea><div class="row"><button class="btn sub" data-x="1">취소</button><button class="btn" data-a2="doLoad">넣기</button></div>');
  };
  handlers.copy = function(){ var ta = D && D.querySelector("textarea"); if(!ta) return; ta.select(); try{ (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(function(){ toast("📋 복사했어요"); }, function(){ document.execCommand("copy"); toast("📋 복사했어요"); }); }catch(e){ toast("길게 눌러 복사해 주세요"); } };
  handlers.savefile = function(){ var ta = D && D.querySelector("textarea"); if(!ta) return; var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ta.value], {type: "text/plain"})); a.download = "공부Gym_백업_" + TODAY + ".txt"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  handlers.doLoad = function(){
    var v = (D.querySelector("textarea").value || "").trim();
    try{ if(v.indexOf("GYMB.") !== 0) throw 0; var o = JSON.parse(b64d(v.slice(5))); if(!o || !o.days) throw 0; localStorage.setItem(KEY, JSON.stringify(o)); closeDlg(); toast("📥 기록을 옮겼어요!"); boot(); }
    catch(e){ toast("백업 코드가 맞지 않아요"); }
  };

  /* ── 창 ── */
  var D = null;
  function dlg(html){ closeDlg(); D = document.createElement("div"); D.className = "dlg"; D.innerHTML = "<div>" + html + "</div>"; document.body.appendChild(D); D.addEventListener("click", dlgClick); return D; }
  function closeDlg(){ if(D){ D.remove(); D = null; } }
  function dlgClick(e){
    if(e.target === D) return closeDlg();
    var t = e.target.closest("[data-x],[data-a2],[data-ci],[data-ii]"); if(!t) return;
    if(t.dataset.x){ closeDlg(); return; }
    if(t.dataset.a2 && handlers[t.dataset.a2]){ handlers[t.dataset.a2](t); return; }
    if(t.dataset.a2 === "doReset"){ try{ localStorage.removeItem(KEY); }catch(er){} load(); closeDlg(); boot(); return; }
    if(t.dataset.ci || t.dataset.ii){
      Array.prototype.forEach.call(t.parentNode.children, function(b){ b.setAttribute("aria-pressed", b === t ? "true" : "false"); });
      var ok = D.querySelector("[data-a2=startOk]"), need = function(a){ return D.querySelector("[" + a + "]") && !D.querySelector("[" + a + "][aria-pressed=true]"); };
      if(ok) ok.disabled = need("data-ci") || need("data-ii");
      return;
    }
    if(t.dataset.a2 === "startOk"){
      var ci = D.querySelector("[data-ci][aria-pressed=true]"), ii = D.querySelector("[data-ii][aria-pressed=true]");
      var d = day();
      if(ci){ var was = d.cond; d.cond = ci.dataset.ci; if(d.cond === "hard" && was !== "hard") setTimeout(function(){ toast("😮‍💨 오늘은 한 단계 쉽게! 10분만 해도 출석이에요"); }, 300); }
      if(ii){ S.week = {start: monday(TODAY), int: ii.dataset.ii}; if(ii.dataset.ii !== "base") setTimeout(function(){ sparkle("💪"); }, 300); }
      save(); closeDlg(); redraw();
    }
    if(t.dataset.a2 === "nickOk"){
      var v = (D.querySelector("input").value || "").trim().slice(0, 10);
      if(!v){ toast("별명을 적어 주세요"); return; }
      S.nick = v; save(); closeDlg();
      if(D_next) { var f = D_next; D_next = null; f(); } else redraw();
    }
  }
  var D_next = null;
  function nickDlg(first, then){
    D_next = then || null;
    dlg((first ? '<div style="display:flex;justify-content:center">' + sb(120, {item: "stamp"}) + "</div><h3>공부 Gym에 온 걸 환영해! 나는 트레이너 쌤비야.</h3>" : "<h3>🏷️ 별명 바꾸기</h3>")
      + '<p class="muted">진짜 이름 말고 <b>별명</b>만 적어 주세요. 기록은 이 휴대폰에만 저장돼요.</p>'
      + '<input maxlength="10" placeholder="예) 수학근육왕" value="' + esc(S.nick) + '" autocomplete="off">'
      + '<button class="btn" data-a2="nickOk">' + (first ? "입소하기 💪" : "저장") + "</button>");
    setTimeout(function(){ var i = D && D.querySelector("input"); if(i && !first) i.focus(); }, 50);
  }
  /* 오늘의 다짐: 컨디션 (+ 새 주면 강도) */
  function startDlg(intOnly){
    var needInt = intOnly || !S.week || S.week.start !== monday(TODAY), needCond = !intOnly, wk = (S.week && S.week.int) || "";
    dlg((needCond ? "<h3>☀️ 오늘의 다짐</h3><p class=\"muted\">오늘 컨디션은 어때요?</p><div class=\"pick\">" + Object.keys(COND).map(function(k){ return '<button data-ci="' + k + '" aria-pressed="' + (day().cond === k) + '"><span>' + COND[k][0] + "</span>" + COND[k][1] + (k === "hard" ? "<small>쉬운 문제로</small>" : "") + "</button>"; }).join("") + "</div>" : "")
      + (needInt ? "<h3 style=\"font-size:16px\">🏋️ 이번 주 강도는?</h3><div class=\"pick\">" + Object.keys(INT).map(function(k){ return '<button data-ii="' + k + '" aria-pressed="' + (wk === k) + '"><span>' + INT[k].emo + "</span>" + INT[k].name + "<small>하루 " + INT[k].sub + "</small></button>"; }).join("") + "</div><p class=\"muted\">방학엔 권장 💪을 추천! 중간에 낮춰도 벌점은 없어요.</p>" : "")
      + '<button class="btn" data-a2="startOk"' + ((needCond && !day().cond) || (needInt && !wk) ? " disabled" : "") + ">좋아, 시작!</button>");
  }
  function condDlg(){ dlg("<h3>🙂 오늘 컨디션</h3><div class=\"pick\">" + Object.keys(COND).map(function(k){ return '<button data-ci="' + k + '" aria-pressed="' + (day().cond === k) + '"><span>' + COND[k][0] + "</span>" + COND[k][1] + (k === "hard" ? "<small>쉬운 문제로</small>" : "") + "</button>"; }).join("") + '</div><button class="btn" data-a2="startOk">확인</button>'); }

  function redraw(){ if(V === "home" || V === "body" || V === "map" || V === "log") go(V); }
  function toast(t){ var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2300); }
  function sparkle(ch){ var w = document.createElement("div"); w.className = "spark"; for(var i = 0; i < 18; i++){ var s = document.createElement("i"); s.textContent = ch; s.style.left = Math.random() * 100 + "%"; s.style.animationDelay = Math.random() * .6 + "s"; w.appendChild(s); } document.body.appendChild(w); setTimeout(function(){ w.remove(); }, 2400); }

  function boot(){
    load();
    var msg = dailyCheck();
    go("home");
    if(!S.nick) nickDlg(true, function(){ go("home"); startDlg(false); });
    else if(!day().cond || !S.week || S.week.start !== monday(TODAY)) startDlg(false);
    if(msg) setTimeout(function(){ toast(msg); }, 400);
  }
  /* 자정을 넘기면 새 날로 */
  setInterval(function(){ if(ymd() !== TODAY && !T){ TODAY = ymd(); boot(); } }, 60000);
  if(/[?&]fast=1/.test(location.search)) window.__gymT = function(){ return T; };   // 화면 점검용
  boot();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("../../sw.js").catch(function(){});
})();
