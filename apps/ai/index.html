<html lang="ko">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">

<title>AI·문서 도우미 · 쌤 노트</title>
<!--
  AI·문서 도우미
  · 일을 고르고 빈칸을 채우면 AI에게 줄 "요청문"이 만들어집니다. 학생 이름(명렬표 전체)·전화번호·이메일·주민번호 꼴은 자동으로 가립니다.
  · ① 요청문 복사 → 학교가 허용한 AI에 붙여 넣고, 받은 답을 오른쪽 칸에 붙여 넣습니다.
    ② 🤖 바로 묻기: 학교 업무판(Code.gs)에 AI 키를 넣어 둔 학교만. 가린 요청문만 업무판을 거쳐 AI로 갑니다.
  · 받은 답은 다른 도구로 이어집니다: 채점 기준 → 수행평가, 가정통신문 → 인쇄 틀·제출물 체크, 공문 → 기안문 틀, 세특 → 생기부 도우미 초안.
  · 보관함 "tt_docs_v1" {list:[{id, type, title, body, at}]} (내 기기에만)
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap}
  main{display:grid!important;grid-template-columns:minmax(170px,200px) minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px!important}
  .nav{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px}
  .nav h4{font-size:11.5px;color:var(--sub);margin:4px 4px 1px;font-weight:800}
  .nav button{font:inherit;font-size:13.5px;text-align:left;border:0;background:transparent;border-radius:9px;padding:4px 8px;cursor:pointer;color:var(--ink)}
  .nav button:hover{background:#f3f6f9}
  .nav button[aria-current=true]{background:var(--accent);color:#fff}
  .col{min-height:0;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
  .col h2{font-size:15px;font-weight:800;display:flex;gap:6px;align-items:center}
  .col h2 .sp{flex:1}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;overflow:auto;flex:0 1 auto;max-height:44%}
  .fields label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--sub)}
  .fields label.w{grid-column:1/-1}
  .fields input,.fields select,.fields textarea{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);background:#fbfcfd}
  .fields textarea{resize:vertical;min-height:54px}
  .fields .ck{flex-direction:row;align-items:center;gap:6px}
  textarea.big{flex:1;min-height:0;resize:none;font:inherit;font-size:13.5px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfcfd;color:var(--ink)}
  .mask{font-size:12px;border-radius:8px;padding:3px 8px;background:var(--ok-soft);color:var(--ok)}
  .mask.warn{background:var(--star-soft);color:#6b4e00}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .row .btn{padding:6px 10px;font-size:13px}
  .chipS{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#eceff3;color:#4a5560;white-space:nowrap}
  .chipS.on{background:var(--ok-soft);color:var(--ok)}
  .muted{color:var(--sub);font-size:12.5px}
  .docs{list-style:none;overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
  .docs li{display:flex;gap:6px;align-items:center;border:1px solid #eef1f4;border-radius:8px;padding:5px 8px;font-size:13px}
  .docs li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .docs .x{border:0;background:none;color:#a0a9b3;font-size:16px;cursor:pointer}
  /* 인쇄 틀 (가정통신문·공문) */
  #prt{position:fixed;inset:0;z-index:50;background:#fff;overflow:auto;padding:18px 24px}
  #prt .pb{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .paper{max-width:720px;margin:0 auto;font-size:15px;line-height:1.75;color:#111}
  .paper h1{text-align:center;font-size:24px;margin:10px 0 18px;letter-spacing:.05em}
  .paper .meta{display:flex;justify-content:space-between;font-size:13px;border-bottom:2px solid #111;padding-bottom:4px}
  .paper .body{white-space:pre-wrap;margin-top:16px}
  .paper .sign{text-align:right;margin-top:24px;font-size:18px;font-weight:800;letter-spacing:.2em}
  .paper .cut{border-top:2px dashed #555;margin:26px 0 10px;text-align:center;font-size:12px;color:#555}
  .paper table{width:100%;border-collapse:collapse;font-size:14px}.paper td,.paper th{border:1px solid #333;padding:6px}
  .gong{max-width:720px;margin:0 auto;font-size:15px;line-height:1.9;color:#111}
  .gong .t{text-align:center;font-size:22px;font-weight:800;margin:6px 0 14px}
  .gong .h div{display:flex;gap:10px}.gong .h b{min-width:56px;display:inline-block}
  .gong .b{white-space:pre-wrap;border-top:2px solid #111;margin-top:8px;padding-top:10px}
  @media print{ body > *:not(#prt){display:none!important} #prt{position:static;padding:0} #prt .pb{display:none} }
  @media (max-width:980px){ main{grid-template-columns:1fr;overflow:auto} body{height:auto;min-height:100dvh;overflow:auto} .col{min-height:360px} }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../">← 쌤 노트</a>
    <h1>🤖 AI·문서 도우미</h1>
  </div>
  <div class="bar">
    <span class="chipS" id="aiChip" title="학교 업무판에 AI 키를 넣으면 🤖 바로 묻기를 쓸 수 있습니다">요청문 방식</span>
  </div>
</header>
<main class="panel" id="m">
  <nav class="nav" id="nav" aria-label="일 고르기"></nav>
  <section class="col" aria-label="요청">
    <h2 id="qTitle"></h2>
    <div class="muted" id="qHelp"></div>
    <div class="fields" id="fields"></div>
    <div class="row"><span class="mask" id="maskInfo"></span><span class="muted">더 가릴 말</span><input id="extra" placeholder="예: 다른 선생님 이름, 학부모 이름 (쉼표로)" style="flex:1;min-width:120px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px"></div>
    <textarea class="big" id="prompt" aria-label="AI에게 줄 요청문" spellcheck="false"></textarea>
    <div class="row"><button type="button" class="btn primary" id="copyQ">📋 요청문 복사 ①</button><button type="button" class="btn" id="askAI" disabled title="학교 업무판에 AI 키를 넣으면 켜집니다">🤖 바로 묻기 ②</button><span class="muted" id="askInfo"></span></div>
  </section>
  <section class="col" aria-label="결과">
    <h2>받은 답 <span class="sp"></span><button type="button" class="btn" id="unmask" style="padding:4px 9px;font-size:12px" title="결과 속 [학생1] 같은 표시를 원래 이름으로">가린 이름 되돌리기</button></h2>
    <textarea class="big" id="result" placeholder="AI가 준 답을 여기에 붙여 넣으세요. (🤖 바로 묻기를 쓰면 자동으로 채워집니다)" spellcheck="false"></textarea>
    <div class="row" id="actions"></div>
  </section>
</main>
<footer>
  <span>AI 답은 반드시 읽고 고쳐 쓰세요 · 학생 이름·연락처는 요청문에서 자동으로 가립니다</span>
  <span class="priv">🔒 요청문·결과는 이 기기(와 내 보관함)에만 · ②는 가린 요청문만 업무판을 거쳐 AI로</span>
</footer>
<script src="../../shared/tt.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function ymd(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  var SC = TT.school.load();
  var PRE = "당신은 한국 중학교 교사의 업무를 돕는 조수입니다. 개인정보는 [학생1], [전화번호]처럼 가려져 있으니 추측해서 채우지 마세요. 사실을 지어내지 말고, 확인이 필요한 부분은 [확인 필요]로 표시해 주세요.\n\n";

  /* ---------- 일 목록: 칸(fields)과 요청문 만들기(build) ---------- */
  var T = [
    {id:"sheet", g:"수업", ic:"📃", n:"학습지·문항", help:"단원과 조건을 넣으면 학습지·문항 요청문을 만듭니다. 계산형 문항은 수학 꾸러미의 문항 생성기도 쓸 수 있어요.",
     f:[["subj","교과","수학"],["grade","학년","3",["1","2","3"]],["unit","단원·주제","",null,"w"],["n","문항 수","8"],["lv","난이도","섞어서",["기초","보통","심화","섞어서"]],["type","유형","섞어서",["객관식","단답형","서술형","섞어서"]],["ans","정답·풀이 함께","1","ck"],["note","더 바라는 점","",null,"w","ta"]],
     b:function(v){ return "중학교 " + v.grade + "학년 " + v.subj + " '" + (v.unit || "[단원]") + "' 학습지를 만들어 주세요.\n- 문항 수: " + v.n + "개\n- 난이도: " + v.lv + "\n- 유형: " + v.type + "\n- 문항마다 번호를 붙이고, 수식은 x^2, √, 분수는 a/b처럼 글자로 적어 주세요." + (v.ans ? "\n- 맨 끝에 '정답과 풀이'를 따로 모아 주세요." : "") + (v.note ? "\n- 그 밖에: " + v.note : ""); }},
    {id:"rubric", g:"수업", ic:"📏", n:"수행평가 채점 기준", help:"받은 답을 그대로 📊 수행평가로 가져올 수 있도록 형식을 정해 요청합니다.",
     f:[["aname","평가 이름 (수행평가에 쓸 이름)","",null,"w"],["subj","교과","수학"],["grade","학년","3",["1","2","3"]],["task","과제 설명","",null,"w","ta"],["k","평가 항목 수","3"],["levels","수준 이름","상, 중, 하"],["mode","방식","점수형",["점수형","수준형"]],["total","총점(점수형)","25"]],
     b:function(v){ var L = v.levels.split(",").map(function(x){ return x.trim(); }).filter(Boolean); var sc = v.mode === "점수형";
       return "중학교 " + v.grade + "학년 " + v.subj + " 수행평가 채점 기준표를 만들어 주세요.\n- 과제: " + (v.task || "[과제 설명]") + "\n- 평가 항목 " + v.k + "개, 수준: " + L.join(", ") + (sc ? "\n- 점수형, 총점 " + v.total + "점(항목 배점의 합)" : "\n- 수준형(점수 없음)") + "\n- 성취기준에 맞춰 관찰 가능한 행동으로 적어 주세요.\n\n아래 형식만 그대로 지켜 주세요(다른 설명 없이):\n항목: [항목 이름]" + (sc ? " | 배점: [숫자]" : "") + "\n" + L.map(function(l){ return "- " + l + (sc ? "([점수])" : "") + ": [기준]"; }).join("\n"); }},
    {id:"letter", g:"학급·학부모", ic:"📨", n:"가정통신문", help:"받은 답을 가정통신문 틀에 넣어 바로 인쇄하고, 회신이 필요하면 📦 제출물 체크로 이어집니다.",
     f:[["title","제목","",null,"w"],["who","대상","",null],["due","회신 마감(선택)","",null,null,"date"],["pts","전할 내용 (요점)","",null,"w","ta"],["tone","어투","정중하고 간결하게",["정중하고 간결하게","따뜻하고 친근하게","공식적으로"]],["reply","회신서 필요","","ck"]],
     b:function(v){ return (SC.name || "○○중학교") + " 가정통신문 본문을 써 주세요.\n- 제목: " + (v.title || "[제목]") + "\n- 대상: " + (v.who || "학부모님") + "\n- 전할 내용:\n" + (v.pts || "[요점]") + "\n- 어투: " + v.tone + "\n- 인사말로 시작해 맺음말로 끝내고, 제목·학교 이름·날짜·서명은 빼고 본문만 써 주세요." + (v.reply ? "\n- 회신이 필요하다는 안내를 넣어 주세요" + (v.due ? "(회신 마감 " + v.due + ")" : "") + "." : ""); }},
    {id:"reply", g:"학급·학부모", ic:"💬", n:"민원 답변", help:"민원 내용의 이름·연락처를 가리고, 답변 초안과 주의할 점을 함께 요청합니다. 민감한 사안은 관리자와 꼭 협의하세요.",
     f:[["what","민원 내용 (요지 또는 원문)","",null,"w","ta"],["dir","답변 방향","",null,"w","ta"],["tone","어투","정중하고 공감하며",["정중하고 공감하며","정중하지만 분명하게","간결하게"]],["ch","보낼 곳","문자",["문자","전화 응대 메모","서면"]]],
     b:function(v){ return "학부모 민원에 대한 답변 초안(" + v.ch + ")을 써 주세요.\n- 민원 내용:\n" + (v.what || "[민원 내용]") + "\n- 답변 방향: " + (v.dir || "[방향]") + "\n- 어투: " + v.tone + "\n- 감정에 공감하되 사실과 학교 규정에 근거하고, 약속할 수 없는 것은 약속하지 마세요.\n- 답변 뒤에 '보내기 전 확인할 점'을 3가지 이내로 적어 주세요."; }},
    {id:"gong", g:"업무", ic:"🏛️", n:"공문 기안문", help:"공문서 항목 기호(1. 가. 1) 가) …)와 '끝.' 표시를 지키도록 요청하고, 기안문 틀로 정리해 줍니다.",
     f:[["to","수신","내부결재"],["title","제목","",null,"w"],["basis","관련 근거(선택)","",null,"w"],["pts","내용 요점","",null,"w","ta"],["att","붙임(선택, 줄마다 하나)","",null,"w","ta"]],
     b:function(v){ return "학교 공문 기안문 본문을 써 주세요.\n- 수신: " + v.to + "\n- 제목: " + (v.title || "[제목]") + (v.basis ? "\n- 관련 근거: " + v.basis : "") + "\n- 내용 요점:\n" + (v.pts || "[요점]") + (v.att ? "\n- 붙임:\n" + v.att : "") + "\n\n규칙: 본문은 '1. 관련: …'으로 시작(근거가 있을 때), 항목 기호는 1. → 가. → 1) → 가) 순서, 문장은 '~하고자 합니다/~바랍니다'처럼 공문 문체, 마지막에 붙임이 있으면 '붙임  1. ○○ 1부.' 형식, 맨 끝은 '  끝.'으로 맺어 주세요. 제목·수신은 빼고 본문만 써 주세요."; }},
    {id:"minutes", g:"업무", ic:"🗒️", n:"회의록 요약", help:"회의 메모를 붙여 넣으면 이름·연락처를 가린 뒤 요약을 요청합니다.",
     f:[["name","회의 이름","",null],["date","날짜",ymd(),null,null,"date"],["memo","회의 메모 (붙여 넣기)","",null,"w","ta"]],
     b:function(v){ return "아래 회의 메모를 학교 회의록 형식으로 정리해 주세요.\n- 회의: " + (v.name || "[회의 이름]") + " (" + v.date + ")\n- 형식: 1. 회의 개요 2. 논의 내용(안건별) 3. 결정 사항 4. 할 일(담당·기한 표)\n- 메모에 없는 내용은 만들지 마세요.\n\n[회의 메모]\n" + (v.memo || ""); }},
    {id:"saeteuk", g:"생기부", ic:"✒️", n:"세특 문장 다듬기", help:"생기부 도우미에서 🤖 버튼으로 오면 초안이 자동으로 들어옵니다. 다듬은 글은 그 학생 초안으로 되돌려 넣을 수 있어요.",

  /* 공문 본문 정리: 들여쓰기 깊이에 따라 1. 가. 1) 가) (1) (가) 기호, 붙임 줄, 마지막 "  끝." */
  function normGong(t){
    var SYM = [function(i){ return (i + 1) + "."; }, function(i){ return "가나다라마바사아자차카타파하"[i % 14] + "."; }, function(i){ return (i + 1) + ")"; }, function(i){ return "가나다라마바사아자차카타파하"[i % 14] + ")"; }, function(i){ return "(" + (i + 1) + ")"; }, function(i){ return "(" + "가나다라마바사아자차카타파하"[i % 14] + ")"; }];
    var out = [], cnt = [0, 0, 0, 0, 0, 0], att = [], inAtt = false;
    t.replace(/\r/g, "").split("\n").forEach(function(raw){
      var line = raw.replace(/\s+$/, ""); if(!line.trim()) return;
      if(/^\s*끝\.?\s*$/.test(line)) return;
      line = line.replace(/\s*끝\.\s*$/, "");
      if(/^\s*붙임/.test(line)){ inAtt = true; att.push(line.replace(/^\s*붙임\s*/, "").trim()); return; }
      if(inAtt){ att.push(line.trim()); return; }
      var ind = (raw.match(/^[\t ]*/)[0].replace(/\t/g, "  ").length) >> 1;
      var body = line.trim().replace(/^(\d+\.|[가-하]\.|\d+\)|[가-하]\)|\(\d+\)|\([가-하]\)|[-·•])\s*/, "");
      var lv = Math.min(5, ind); cnt[lv]++; for(var k = lv + 1; k < 6; k++) cnt[k] = 0;
      out.push(new Array(lv * 2 + 1).join(" ") + SYM[lv](cnt[lv] - 1) + " " + body);
    });
    if(!out.length) return "";
    if(att.length){ out.push(""); att.forEach(function(a, i){ out.push((i ? "      " : "붙임  ") + (att.length > 1 ? (i + 1) + ". " : "") + a.replace(/^\d+\.\s*/, "")); }); out[out.length - 1] += "  끝."; }
    else out[out.length - 1] += "  끝.";
    return out.join("\n");
  }

    if(!B.url || !/^https:\/\/script\.google\.com\//.test(B.url) || TT.classroom) return;
    post({action: "aiinfo"}).then(function(r){
      if(r && r.ok && r.enabled){ $("aiChip").textContent = "🤖 바로 묻기 가능" + (r.left != null ? " · 오늘 " + r.left + "번 남음" : ""); $("aiChip").className = "chipS on"; $("askAI").disabled = false; $("askAI").title = "가린 요청문만 학교 업무판을 거쳐 AI로 보냅니다"; }
      else $("aiChip").textContent = "요청문 방식 (업무판에 AI 키 없음)";
    }).catch(function(){ $("aiChip").textContent = "요청문 방식"; });
  }
  $("askAI").onclick = function(){
    var q = mask($("prompt").value); if(!q.trim()) return;
    var b = this; b.disabled = true; $("askInfo").textContent = "AI에게 묻는 중… (10~40초)";
    post({action: "ai", prompt: q.slice(0, 12000)}).then(function(r){
      b.disabled = false;
      if(r && r.ok){ $("result").value = r.text || ""; $("askInfo").textContent = "받았습니다" + (r.left != null ? " · 오늘 " + r.left + "번 남음" : "") + ". 꼭 읽고 고쳐 쓰세요."; }
      else $("askInfo").textContent = "실패: " + ((r && r.error) || "알 수 없는 오류");
    }).catch(function(){ b.disabled = false; $("askInfo").textContent = "업무판에 닿지 못했습니다. 인터넷·업무판 주소를 확인해 주세요."; });
  };

  function drawAll(){ drawNav(); drawFields(); build(); drawActions(); }

  /* 생기부 도우미에서 넘어온 초안 (주소에는 아무것도 싣지 않고 이 창의 임시 저장소로만 받음) */
  try{ handoff = JSON.parse(sessionStorage.getItem("tt_ai_handoff") || "null"); sessionStorage.removeItem("tt_ai_handoff"); }catch(e){ handoff = null; }
  var want = new URLSearchParams(location.search).get("t");
  if(want) cur = T.filter(function(t){ return t.id === want; })[0] || cur;
  if(handoff && handoff.kind === "saeteuk"){ cur = T.filter(function(t){ return t.id === "saeteuk"; })[0]; vals = {area: handoff.areaName, lim: String(handoff.lim || 1500), draft: handoff.text || ""}; }
  if(want) history.replaceState(null, "", location.pathname);
  drawAll(); checkAI();
})();
</script>
</body>
