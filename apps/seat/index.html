<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/tt.css">
<title>자리 배치 · 쌤 노트</title>
<!--
  자리 배치 (개편 10단계): 명렬표 학생으로 교실 자리를 정합니다.
  · 줄·칸 수 정하기 → [🎲 무작위] 또는 [번호순] → 두 자리를 차례로 누르면 서로 바뀜 · 🔒 자리 고정(무작위 때 그대로) · 빈자리
  · [👀 학생 쪽에서 보기]: 칠판에 띄울 때 학생이 보는 방향으로 뒤집기 · 🖨 인쇄
  · 저장 "snseat_v1" {c:{학급id:{r, c, seats:[번호|""], lock:{자리번호:1}, at}}} — 이 기기에만(백업·동기화에 들어가지 않음)
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap}
  .bar label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--sub)}
  .bar input[type=number]{width:52px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:6px}
  main{display:flex!important;flex-direction:column;gap:8px;padding:10px!important;min-height:0}
  .front{align-self:center;font-size:13px;font-weight:800;color:var(--sub);background:var(--t-chip,#eceff3);border-radius:8px;padding:4px 28px}
  .room{flex:1;min-height:0;display:grid;gap:clamp(4px,1vh,8px);grid-template-columns:repeat(var(--c,6),minmax(0,1fr));grid-template-rows:repeat(var(--r,5),minmax(0,1fr))}
  .room.flip{transform:rotate(180deg)}.room.flip .seat>*{transform:rotate(180deg)}
  .seat{position:relative;font:inherit;border:1.5px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);min-height:0;padding:2px}
  .seat b{font-size:clamp(15px,2.6vh,24px);font-weight:800;line-height:1.1}
  .seat i{font-style:normal;font-size:clamp(11px,1.5vh,13px);color:var(--sub)}
  .seat.empty{border-style:dashed;background:transparent;color:var(--t-faint,#9aa5b1)}
  .seat.sel{border-color:var(--t-homeroom,#1f7a4d);box-shadow:0 0 0 3px color-mix(in srgb,var(--t-homeroom,#1f7a4d) 30%,transparent);background:color-mix(in srgb,var(--t-homeroom,#1f7a4d) 10%,#fff)}
  .seat.lk::after{content:"🔒";position:absolute;top:2px;right:4px;font-size:11px}
  .hint{font-size:12.5px;color:var(--sub);text-align:center}
  .mode button[aria-pressed=true]{background:var(--t-homeroom,#1f7a4d);color:#fff;border-color:var(--t-homeroom,#1f7a4d)}
  @media (max-width:760px){ body{height:auto;min-height:100dvh;overflow:auto} .room{min-height:62vh} }
  @media print{ .bar,.hint,footer{display:none!important} main.panel{display:flex!important;height:90vh} .seat{border:1px solid #333} }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../#homeroom">← 쌤 노트</a>
    <h1>🪑 자리 배치</h1>
  </div>
  <div class="bar">
    <select id="clsSel" aria-label="학급 선택"></select>
    <label>줄 <input type="number" id="nr" min="1" max="10"></label>
    <label>칸 <input type="number" id="nc" min="1" max="10"></label>
    <button class="btn primary" id="shuf">🎲 무작위</button>
    <button class="btn" id="order">번호순</button>
    <span class="seg mode"><button class="btn" id="lockM" aria-pressed="false" title="누른 자리를 고정 — 무작위 때 그대로">🔒 고정</button></span>
    <button class="btn" id="flip" aria-pressed="false">👀 학생 쪽에서 보기</button>
    <button class="btn" id="print">🖨 인쇄</button>
  </div>
</header>
<main class="panel" id="m">
  <div class="front" id="front">교탁 · 칠판</div>
  <div class="room" id="room"></div>
  <div class="hint" id="hint">두 자리를 차례로 누르면 서로 바뀝니다 · 빈자리도 고를 수 있어요 · 🔒 고정을 켜고 누르면 그 자리는 무작위 때 그대로</div>
</main>
<footer><span class="priv">🔒 자리표는 이 기기에만 저장됩니다(백업·동기화에 들어가지 않음).</span><span id="info"></span></footer>
<script src="../../shared/tools.js"></script>
<script src="../../shared/tt.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var KEY = "snseat_v1", cls = null, sel = -1, lockMode = false, flip = false;
  function all(){ try{ var o = JSON.parse(localStorage.getItem(KEY) || "null"); return o && o.c ? o : {v: 1, c: {}}; }catch(e){ return {v: 1, c: {}}; } }
  function saveAll(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){ TT.ui.toast("저장하지 못했습니다(저장 공간)."); } }
  function cur(){
    var o = all(), n = cls ? cls.students.length : 0, s = cls && o.c[cls.id];
    if(!s){ var c0 = 6, r0 = Math.max(1, Math.ceil(n / c0)); s = {r: r0, c: c0, seats: [], lock: {}}; fillOrder(s); }
    s.lock = s.lock || {}; return s;
  }
  function put(s){ var o = all(); s.at = Date.now(); o.c[cls.id] = s; saveAll(o); }
  function nos(){ return (cls ? cls.students : []).map(function(x){ return String(x.no); }); }
  function fillOrder(s){ var L = nos(); s.seats = []; for(var i = 0; i < s.r * s.c; i++) s.seats.push(L[i] || ""); s.lock = {}; }
  /* 명단이 바뀌었으면 맞춤: 없는 번호는 빼고, 새 번호는 빈자리에 */
  function sync(s){
    var L = nos(), have = {}; s.seats = s.seats.slice(0, s.r * s.c); while(s.seats.length < s.r * s.c) s.seats.push("");
    s.seats = s.seats.map(function(x){ if(x && L.indexOf(x) >= 0 && !have[x]){ have[x] = 1; return x; } return ""; });
    L.forEach(function(x){ if(!have[x]){ var i = s.seats.indexOf(""); if(i >= 0){ s.seats[i] = x; have[x] = 1; } } });
    return s;
  }
  function name(no){ var x = cls.students.filter(function(s){ return String(s.no) === String(no); })[0]; return x ? x.name : ""; }
  function draw(){
    var room = $("room");
    if(!cls){ room.innerHTML = ""; $("info").textContent = ""; TT.ui.needRoster(room); return; }
    var s = sync(cur()); put(s);
    $("nr").value = s.r; $("nc").value = s.c;
    room.style.setProperty("--r", s.r); room.style.setProperty("--c", s.c); room.classList.toggle("flip", flip);
    room.innerHTML = s.seats.map(function(no, i){
      return '<button type="button" class="seat' + (no ? "" : " empty") + (i === sel ? " sel" : "") + (s.lock[i] ? " lk" : "") + '" data-i="' + i + '">' + (no ? "<b>" + esc(name(no)) + "</b><i>" + esc(no) + "번</i>" : "<i>빈자리</i>") + "</button>";
    }).join("");
    var placed = s.seats.filter(Boolean).length, n = cls.students.length;
    $("info").textContent = cls.name + " · " + placed + "/" + n + "명 앉음" + (s.r * s.c < n ? " · ⚠ 자리가 " + (n - s.r * s.c) + "개 모자람" : "");
    $("front").style.order = flip ? 2 : 0;
  }
  $("room").addEventListener("click", function(e){
    var b = e.target.closest(".seat"); if(!b) return; var i = +b.dataset.i, s = cur();
    if(lockMode){ if(s.lock[i]) delete s.lock[i]; else s.lock[i] = 1; put(s); draw(); return; }
    if(sel < 0){ sel = i; draw(); return; }
    if(sel !== i){ var t = s.seats[sel]; s.seats[sel] = s.seats[i]; s.seats[i] = t; var lk = !!s.lock[sel]; if(s.lock[i]) s.lock[sel] = 1; else delete s.lock[sel]; if(lk) s.lock[i] = 1; else delete s.lock[i]; put(s); }
    sel = -1; draw();
  });
  function size(){
    var s = cur(), r = Math.max(1, Math.min(10, +$("nr").value || s.r)), c = Math.max(1, Math.min(10, +$("nc").value || s.c));
    if(r === s.r && c === s.c) return;
    var L = s.seats.filter(Boolean); s.r = r; s.c = c; s.seats = []; s.lock = {};
    for(var i = 0; i < r * c; i++) s.seats.push(L[i] || ""); put(s); sel = -1; draw();
  }
  $("nr").onchange = size; $("nc").onchange = size;
  $("shuf").onclick = function(){
    if(!cls) return; var s = cur(), free = [], who = [];
    s.seats.forEach(function(no, i){ if(!s.lock[i]){ free.push(i); if(no) who.push(no); } });
    for(var k = who.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)), t = who[k]; who[k] = who[j]; who[j] = t; }
    var spots = free.slice(); for(var m = spots.length - 1; m > 0; m--){ var j2 = Math.floor(Math.random() * (m + 1)), t2 = spots[m]; spots[m] = spots[j2]; spots[j2] = t2; }
    spots = spots.slice(0, who.length).sort(function(a, b){ return a - b; });                       // 빈자리는 뒤쪽에 남도록 앞자리부터 채움
    free.forEach(function(i){ s.seats[i] = ""; }); spots.forEach(function(i, k2){ s.seats[i] = who[k2]; });
    put(s); sel = -1; draw(); TT.ui.toast("🎲 자리를 섞었습니다" + (Object.keys(s.lock).length ? " (🔒 고정 자리는 그대로)" : "") + ".");
  };
  $("order").onclick = function(){ if(!cls) return; TT.ui.confirm("번호순으로 앉히기", "지금 자리표를 1번부터 차례로 다시 채웁니다. 고정도 풀립니다.", "번호순", function(){ var s = cur(); fillOrder(s); put(s); sel = -1; draw(); }); };
  $("lockM").onclick = function(){ lockMode = !lockMode; this.setAttribute("aria-pressed", lockMode); $("hint").textContent = lockMode ? "🔒 고정 켜짐: 자리를 누르면 고정/해제 — 다 했으면 [🔒 고정]을 다시 누르세요" : "두 자리를 차례로 누르면 서로 바뀝니다 · 빈자리도 고를 수 있어요 · 🔒 고정을 켜고 누르면 그 자리는 무작위 때 그대로"; sel = -1; draw(); };
  $("flip").onclick = function(){ flip = !flip; this.setAttribute("aria-pressed", flip); draw(); };
  $("print").onclick = function(){ window.print(); };
  TT.ui.classSelect($("clsSel"), "seat", function(c){ cls = c; sel = -1; draw(); });
})();
</script>
</body>
</html>
