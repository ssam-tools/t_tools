<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 외부로 자료를 보내는 통로를 브라우저 차원에서 막습니다(이 사이트 안의 파일만 허용). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/ssambi2-192.png">
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/tt.css">
<title>자리 배치 · 쌤 노트</title>
<!--
  자리 배치 (개편 10단계): 명렬표 학생으로 교실 자리를 정합니다.
  · 줄·칸 수 정하기 → [🎲 무작위] 또는 [번호순] → 두 자리를 차례로 누르면 서로 바뀜 · 🔒 자리 고정(무작위 때 그대로) · 빈자리
  · [👀 학생 쪽에서 보기]: 칠판에 띄울 때 학생이 보는 방향으로 뒤집기 · 🖨 인쇄
  · 저장 "snseat_v1" {c:{학급id:{r, c, seats:[번호|""], lock:{자리번호:1}, at}}} — 이 기기에만(백업·동기화에 들어가지 않음)
-->
<style>
  header{align-items:center}
  .bar{flex-wrap:wrap}
  .bar label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--sub)}
  .bar input[type=number]{width:52px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:6px}
  main{display:flex!important;flex-direction:column;gap:8px;padding:10px!important;min-height:0}
  .front{align-self:center;font-size:clamp(16px,2.4vh,22px);font-weight:900;color:#fff;background:#3b4652;border-radius:10px;padding:8px 0;width:min(60%,640px);text-align:center;letter-spacing:.2em;box-shadow:0 4px 0 #22292f}
  .room{flex:1;min-height:0;display:grid;gap:clamp(4px,1vh,8px);grid-template-columns:repeat(var(--c,6),minmax(0,1fr));grid-template-rows:repeat(var(--r,5),minmax(0,1fr))}
  .room.flip{transform:rotate(180deg)}.room.flip .seat>*{transform:rotate(180deg)}
  .seat{position:relative;font:inherit;border:1.5px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);min-height:0;padding:2px}
  .seat b{font-size:clamp(15px,2.6vh,24px);font-weight:800;line-height:1.1}
  .seat i{font-style:normal;font-size:clamp(11px,1.5vh,13px);color:var(--sub)}
  .seat.empty{border-style:dashed;background:transparent;color:var(--t-faint,#9aa5b1)}
  .seat.sel{border-color:var(--t-homeroom,#1f7a4d);box-shadow:0 0 0 3px color-mix(in srgb,var(--t-homeroom,#1f7a4d) 30%,transparent);background:color-mix(in srgb,var(--t-homeroom,#1f7a4d) 10%,#fff)}
  .seat.lk::after{content:"🔒";position:absolute;top:2px;right:4px;font-size:11px}
  .hint{font-size:12.5px;color:var(--sub);text-align:center}
  .mode button[aria-pressed=true]{background:var(--t-homeroom,#1f7a4d);color:#fff;border-color:var(--t-homeroom,#1f7a4d)}
  @media (max-width:760px){ body{height:auto;min-height:100dvh;overflow:auto} .room{min-height:62vh} }
  /* 섞는 애니메이션 · 바꾸기 움직임 */
  .seat.cv{background:var(--t-accent-soft,#e9f2fc);border-color:var(--accent,#2f6fb5)}
  .seat.cv b{color:var(--accent,#2f6fb5);opacity:.55;filter:blur(1px)}
  .seat.cv i{visibility:hidden}
  .seat.rv{animation:rv .45s ease}
  @keyframes rv{0%{transform:rotateY(90deg) scale(.9)}100%{transform:none}}
  .seat.mv{transition:transform .45s cubic-bezier(.2,.8,.2,1.2);z-index:3;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  #skip{position:fixed;right:24px;bottom:24px;z-index:50}
  #pdlg{border:0;border-radius:16px;padding:18px 20px;width:min(460px,92vw)}
  #pdlg h2{font-size:18px;margin:0 0 10px}#pdlg label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:8px 0 3px}
  #pdlg input{width:100%;box-sizing:border-box;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  #pdlg .row{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
  #pr{display:none}
  @media print{
    @page{size:A4 landscape;margin:9mm}
    html,body{height:auto!important;min-height:0!important;overflow:visible!important;margin:0!important;padding:0!important;background:#fff!important}
    body>*{display:none!important}
    #pr{display:block!important;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#111}
    #pr .ph{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:6px}
    #pr .ph h1{font-size:20pt;margin:0}#pr .ph .fx{font-size:13pt;font-weight:700}#pr .ph .mm{margin-left:auto;font-size:11pt}
    #pr .pb{display:grid;grid-template-columns:3fr 1fr;gap:6mm;height:160mm}
    #pr .pl{display:flex;flex-direction:column;gap:3mm;min-height:0}
    #pr .pf{align-self:center;width:60%;text-align:center;font-size:16pt;font-weight:900;letter-spacing:.3em;border:2px solid #111;background:#e9e9e9;padding:2mm 0}
    #pr .pg{flex:1;display:grid;gap:2mm;grid-template-columns:repeat(var(--c),1fr);grid-template-rows:repeat(var(--r),1fr)}
    #pr .pg div{border:1.2px solid #333;border-radius:2mm;display:flex;flex-direction:column;align-items:center;justify-content:center}
    #pr .pg b{font-size:14pt}#pr .pg i{font-style:normal;font-size:9pt;color:#555}#pr .pg .e{border-style:dashed;border-color:#aaa}
    #pr .pn{border-left:1px solid #999;padding-left:4mm;font-size:9.5pt;overflow:hidden;columns:var(--cols,1);column-gap:4mm}
    #pr .pn h3{font-size:12pt;margin:0 0 2mm;column-span:all}#pr .pn div{break-inside:avoid;line-height:1.38}#pr .pn span{display:inline-block;width:2.2em;color:#555}
  }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../#homeroom">← 쌤 노트</a>
    <h1>🪑 자리 배치</h1>
  </div>
  <div class="bar">
    <select id="clsSel" aria-label="학급 선택"></select>
    <label>줄 <input type="number" id="nr" min="1" max="10"></label>
    <label>칸 <input type="number" id="nc" min="1" max="10"></label>
    <button class="btn primary" id="shuf">🎲 무작위</button>
    <button class="btn" id="order">번호순</button>
    <span class="seg mode"><button class="btn" id="lockM" aria-pressed="false" title="누른 자리를 고정 — 무작위 때 그대로">🔒 고정</button></span>
    <button class="btn" id="flip" aria-pressed="false">👀 학생 쪽에서 보기</button>
    <button class="btn" id="print">🖨 인쇄</button>
  </div>
</header>
<main class="panel" id="m">
  <div class="front" id="front">교탁 · 칠판</div>
  <div class="room" id="room"></div>
  <div class="hint" id="hint">두 자리를 차례로 누르면 서로 바뀝니다 · 빈자리도 고를 수 있어요 · 🔒 고정을 켜고 누르면 그 자리는 무작위 때 그대로</div>
</main>
<div id="pr"></div>
<dialog id="pdlg"><h2>🖨 자리표 인쇄 (A4 가로)</h2><label for="pFix">고정 문구 (저장됨 · 예: 급훈)</label><input id="pFix" maxlength="60" placeholder="예: 서로 존중하는 우리 반"><label for="pMemo">이번에 적을 한 줄</label><input id="pMemo" maxlength="60" placeholder="예: 2학기 3차 자리 (11/19~)"><div class="row"><button class="btn" id="pX" type="button">취소</button><button class="btn primary" id="pGo" type="button">인쇄</button></div></dialog>
<footer><span class="priv">🔒 자리표는 이 기기에만 저장됩니다(백업·동기화에 들어가지 않음).</span><span id="info"></span></footer>
<script src="../../shared/tools.js"></script>
<script src="../../shared/tt.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var KEY = "snseat_v1", cls = null, sel = -1, lockMode = false, flip = false;
  function all(){ try{ var o = JSON.parse(localStorage.getItem(KEY) || "null"); return o && o.c ? o : {v: 1, c: {}}; }catch(e){ return {v: 1, c: {}}; } }
  function saveAll(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){ TT.ui.toast("저장하지 못했습니다(저장 공간)."); } }
  function cur(){
    var o = all(), n = cls ? cls.students.length : 0, s = cls && o.c[cls.id];
    if(!s){ var c0 = 6, r0 = Math.max(1, Math.ceil(n / c0)); s = {r: r0, c: c0, seats: [], lock: {}}; fillOrder(s); }
    s.lock = s.lock || {}; return s;
  }
  function put(s){ var o = all(); s.at = Date.now(); o.c[cls.id] = s; saveAll(o); }
  function nos(){ return (cls ? cls.students : []).map(function(x){ return String(x.no); }); }
  function fillOrder(s){ var L = nos(); s.seats = []; for(var i = 0; i < s.r * s.c; i++) s.seats.push(L[i] || ""); s.lock = {}; }
  /* 명단이 바뀌었으면 맞춤: 없는 번호는 빼고, 새 번호는 빈자리에 */
  function sync(s){
    var L = nos(), have = {}; s.seats = s.seats.slice(0, s.r * s.c); while(s.seats.length < s.r * s.c) s.seats.push("");
    s.seats = s.seats.map(function(x){ if(x && L.indexOf(x) >= 0 && !have[x]){ have[x] = 1; return x; } return ""; });
    L.forEach(function(x){ if(!have[x]){ var i = s.seats.indexOf(""); if(i >= 0){ s.seats[i] = x; have[x] = 1; } } });
    return s;
  }
  function name(no){ var x = cls.students.filter(function(s){ return String(s.no) === String(no); })[0]; return x ? x.name : ""; }
  function draw(){
    var room = $("room");
    if(!cls){ room.innerHTML = ""; $("info").textContent = ""; TT.ui.needRoster(room); return; }
    var s = sync(cur()); put(s);
    $("nr").value = s.r; $("nc").value = s.c;
    room.style.setProperty("--r", s.r); room.style.setProperty("--c", s.c); room.classList.toggle("flip", flip);
    room.innerHTML = s.seats.map(function(no, i){
      return '<button type="button" class="seat' + (no ? "" : " empty") + (i === sel ? " sel" : "") + (s.lock[i] ? " lk" : "") + '" data-i="' + i + '">' + (no ? "<b>" + esc(name(no)) + "</b><i>" + esc(no) + "번</i>" : "<i>빈자리</i>") + "</button>";
    }).join("");
    var placed = s.seats.filter(Boolean).length, n = cls.students.length;
    $("info").textContent = cls.name + " · " + placed + "/" + n + "명 앉음" + (s.r * s.c < n ? " · ⚠ 자리가 " + (n - s.r * s.c) + "개 모자람" : "");
    $("front").style.order = flip ? 2 : 0;
  }
  $("room").addEventListener("click", function(e){
    var b = e.target.closest(".seat"); if(!b) return; var i = +b.dataset.i, s = cur();
    if(lockMode){ if(s.lock[i]) delete s.lock[i]; else s.lock[i] = 1; put(s); draw(); return; }
    if(sel < 0){ sel = i; draw(); return; }
    if(sel !== i){
      var A0 = seatEl(sel).getBoundingClientRect(), B0 = seatEl(i).getBoundingClientRect(), a0 = sel;
      var t = s.seats[sel]; s.seats[sel] = s.seats[i]; s.seats[i] = t; var lk = !!s.lock[sel]; if(s.lock[i]) s.lock[sel] = 1; else delete s.lock[sel]; if(lk) s.lock[i] = 1; else delete s.lock[i]; put(s);
      sel = -1; draw(); fly(seatEl(i), A0); fly(seatEl(a0), B0); tone(520, .08); tone(780, .12, .1); return;   /* 두 카드가 서로 날아가 자리를 바꿈 */
    }
    sel = -1; draw();
  });
  function seatEl(i){ return $("room").querySelector('.seat[data-i="' + i + '"]'); }
  function fly(el, from){ if(!el) return; var to = el.getBoundingClientRect(), k = flip ? -1 : 1; el.classList.remove("mv"); el.style.transform = "translate(" + k * (from.left - to.left) + "px," + k * (from.top - to.top) + "px)"; void el.offsetWidth; el.classList.add("mv"); el.style.transform = ""; setTimeout(function(){ el.classList.remove("mv"); }, 500); }
  var AC = null;
  function tone(f, d, w){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); var t = AC.currentTime + (w || 0), o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = "triangle"; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); }catch(e){} }
  /* 🎲 무작위: 모든 카드를 가리고 이름이 마구 바뀌다가(북소리) 앞자리부터 한 자리씩 공개 · [⏩ 바로 보기]로 건너뛰기 */
  var anim = null;
  function reveal(s, locks){
    var room = $("room"), els = Array.prototype.slice.call(room.querySelectorAll(".seat")), names = cls.students.map(function(x){ return x.name; }), n = 0, idx = 0, skip;
    skip = document.createElement("button"); skip.id = "skip"; skip.className = "btn primary"; skip.textContent = "⏩ 바로 보기"; document.body.appendChild(skip);
    function done(){ clearInterval(anim); anim = null; skip.remove(); draw(); }
    skip.onclick = done;
    els.forEach(function(e, i){ if(!locks[i] && s.seats[i]) e.classList.add("cv"); });
    anim = setInterval(function(){
      n++;
      if(n <= 14){ els.forEach(function(e){ if(e.classList.contains("cv")){ var b = e.querySelector("b"); if(b) b.textContent = names[Math.floor(Math.random() * names.length)]; } }); tone(140 + Math.random() * 60, .05); return; }
      while(idx < els.length && !els[idx].classList.contains("cv")) idx++;
      if(idx >= els.length){ tone(523, .15); tone(784, .3, .12); done(); TT.ui.toast("🎲 새 자리 완성!"); return; }
      var e = els[idx], no = s.seats[idx]; e.classList.remove("cv"); e.classList.add("rv"); e.innerHTML = "<b>" + esc(name(no)) + "</b><i>" + esc(no) + "번</i>"; tone(600 + idx * 12, .07); idx++;
    }, 90);
  }
  function size(){
    var s = cur(), r = Math.max(1, Math.min(10, +$("nr").value || s.r)), c = Math.max(1, Math.min(10, +$("nc").value || s.c));
    if(r === s.r && c === s.c) return;
    var L = s.seats.filter(Boolean); s.r = r; s.c = c; s.seats = []; s.lock = {};
    for(var i = 0; i < r * c; i++) s.seats.push(L[i] || ""); put(s); sel = -1; draw();
  }
  $("nr").onchange = size; $("nc").onchange = size;
  $("shuf").onclick = function(){
    if(!cls) return; var s = cur(), free = [], who = [];
    s.seats.forEach(function(no, i){ if(!s.lock[i]){ free.push(i); if(no) who.push(no); } });
    for(var k = who.length - 1; k > 0; k--){ var j = Math.floor(Math.random() * (k + 1)), t = who[k]; who[k] = who[j]; who[j] = t; }
    var spots = free.slice(); for(var m = spots.length - 1; m > 0; m--){ var j2 = Math.floor(Math.random() * (m + 1)), t2 = spots[m]; spots[m] = spots[j2]; spots[j2] = t2; }
    spots = spots.slice(0, who.length).sort(function(a, b){ return a - b; });                       // 빈자리는 뒤쪽에 남도록 앞자리부터 채움
    free.forEach(function(i){ s.seats[i] = ""; }); spots.forEach(function(i, k2){ s.seats[i] = who[k2]; });
    put(s); sel = -1; if(anim) return; draw(); reveal(s, s.lock);
  };
  $("order").onclick = function(){ if(!cls) return; TT.ui.confirm("번호순으로 앉히기", "지금 자리표를 1번부터 차례로 다시 채웁니다. 고정도 풀립니다.", "번호순", function(){ var s = cur(); fillOrder(s); put(s); sel = -1; draw(); }); };
  $("lockM").onclick = function(){ lockMode = !lockMode; this.setAttribute("aria-pressed", lockMode); $("hint").textContent = lockMode ? "🔒 고정 켜짐: 자리를 누르면 고정/해제 — 다 했으면 [🔒 고정]을 다시 누르세요" : "두 자리를 차례로 누르면 서로 바뀝니다 · 빈자리도 고를 수 있어요 · 🔒 고정을 켜고 누르면 그 자리는 무작위 때 그대로"; sel = -1; draw(); };
  $("flip").onclick = function(){ flip = !flip; this.setAttribute("aria-pressed", flip); draw(); };
  /* 🖨 인쇄: A4 가로 · 맨 위 학년 반 + 고정 문구 + 한 줄 · 왼쪽 3/4 자리표 · 오른쪽 1/4 명단 */
  $("print").onclick = function(){ if(!cls) return; var o = all(), P = (o.p || {})[cls.id] || {}; $("pFix").value = P.fix || ""; $("pMemo").value = P.memo || ""; $("pdlg").showModal(); };
  $("pX").onclick = function(){ $("pdlg").close(); };
  $("pGo").onclick = function(){
    var o = all(); o.p = o.p || {}; o.p[cls.id] = {fix: $("pFix").value.trim(), memo: $("pMemo").value.trim()}; saveAll(o); $("pdlg").close();
    var s = sync(cur()), P = o.p[cls.id], L = cls.students.slice().sort(function(a, b){ return a.no - b.no; });
    var seats = s.seats.map(function(no){ return no ? "<div><b>" + esc(name(no)) + "</b><i>" + esc(no) + "번</i></div>" : '<div class="e"></div>'; });
    if(flip) seats.reverse();
    var front = '<div class="pf">교탁 · 칠판</div>', grid = '<div class="pg" style="--r:' + s.r + ";--c:" + s.c + '">' + seats.join("") + "</div>";
    $("pr").innerHTML = '<div class="ph"><h1>' + esc(cls.name) + ' 자리 배치</h1>' + (P.fix ? '<span class="fx">' + esc(P.fix) + "</span>" : "") + '<span class="mm">' + esc(P.memo || "") + "</span></div>"
      + '<div class="pb"><div class="pl">' + (flip ? grid + front : front + grid) + '</div><div class="pn" style="--cols:' + (L.length > 34 ? 2 : 1) + '"><h3>명단 (' + L.length + "명)</h3>" + L.map(function(x){ return "<div><span>" + esc(x.no) + "</span>" + esc(x.name) + "</div>"; }).join("") + "</div></div>";
    setTimeout(function(){ window.print(); }, 50);
  };
  TT.ui.classSelect($("clsSel"), "seat", function(c){ cls = c; sel = -1; draw(); });
})();
</script>
</body>
</html>
