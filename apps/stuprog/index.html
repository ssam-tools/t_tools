<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style id="ttKeepAll">html{word-break:keep-all;overflow-wrap:break-word;line-break:strict}</style>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<!-- v2.38.1 빠르게 열기: 화면 파일을 처음부터 한꺼번에 받아 둠 (아래 <script src>를 바꾸면 여기도 같이) -->
<link rel="preload" as="script" href="../../shared/early.js">
<link rel="preload" as="script" href="../../shared/tools.js">
<link rel="preload" as="script" href="../../shared/tt.js">
<link rel="preload" as="script" href="../../shared/qr.js">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6fb5">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/ssambi3-192.png">
<script src="../../shared/early.js"></script>
<link rel="stylesheet" href="../../shared/tt.css">
<title>학생 프로그램 · 쌤 노트</title>
<!--
  학생 프로그램: 학생이 휴대폰으로 스스로 공부하는 쌤 노트 프로그램을 한 화면에 (예전 '개념지도 교사용' + '국어 근육 교사용').
  공부 Gym(apps/gym) · 지당 노트(apps/jidang) · 중학 개념지도(수학, apps/mstudy) · 국어 근육(apps/kread) — 큰 QR · 주소 복사 · 인쇄용 16개 · 크게 띄우기.
  QR은 이 기기 안에서 만들고(shared/qr.js) 주소를 밖으로 보내지 않습니다.
-->
<style>
  main.sp2{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:12px!important;min-height:0}
  .pc{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
  .pc .hd{display:flex;align-items:center;gap:10px}
  .pc .ic{font-size:30px}
  .pc h2{font-size:22px;font-weight:900;margin:0}
  .pc .sb{font-size:13.5px;color:var(--sub);margin:0}
  .pc .qr{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .pc .qr svg{height:100%;max-height:min(46dvh,30vw);width:auto;aspect-ratio:1;background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line);box-sizing:border-box}
  .pc .ad{font-size:13px;color:var(--sub);background:var(--bg,#f5f7fb);border-radius:10px;padding:6px 10px;word-break:break-all;text-align:center}
  .pc .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .pc .bt .btn{font-size:14px}
  .pc .bt2{border-top:1px dashed var(--line);padding-top:10px}
  @media (max-width:800px){ main.sp2{grid-template-columns:1fr} body{height:auto;min-height:100dvh;overflow:auto} .pc .qr svg{max-height:60vw} }
</style>
</head>
<body>
<header>
  <div>
    <a class="back" href="../../#class">← 쌤 노트</a>
    <h1>🎒 학생 프로그램</h1>
  </div>
</header>
<main class="panel sp2" id="m"></main>
<footer><span class="priv">🔒 QR은 이 기기에서 만들어요. 학생 프로그램은 학생 휴대폰 안에만 기록을 남겨요.</span><span>학생: 카메라로 QR → 열기 → 홈 화면에 추가</span></footer>
<script src="../../shared/tools.js"></script>
<script src="../../shared/tt.js"></script>
<script src="../../shared/qr.js"></script>
<script>
(function(){
  "use strict";
  var ROOT = new URL("../../", location.href);
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var P = [
    {id: "g", ic: "💪", n: "공부 Gym · 쌤비 PT", d: "하루 70분 · 7개 PT실(한국사 포함) · 중학교 마스터 12주", u: new URL("apps/gym/", ROOT).href,
     x: [["📊 반 현황판", "../gym/board.html"], ["🔗 반 코드·진도 링크", "../gym/board.html#link"], ["🖨️ 학생 안내문", "../gym/board.html#guide"]]},
    {id: "j", ic: "📝", n: "지당 노트 · 쌤비 코치", d: "지금 당장, 변화의 시작! · 목표 → 매일 한 줄 → 100일", u: new URL("apps/jidang/", ROOT).href,
     x: [["📊 지당 현황·선물 코드", "../gym/board.html#jd"]]},
    {id: "m", ic: "🗺️", n: "중학 수학 개념지도", d: "개념지도 · 고1 3월 모의고사 유형맵", u: new URL("apps/mstudy/", ROOT).href, x: []},
    {id: "k", ic: "📖", n: "국어 근육", d: "긴 지문 빨리 읽고 이해 확인 · 수능 어휘", u: new URL("apps/kread/", ROOT).href,
     x: [["🖥️ 교실 함께 읽기", "../kread/teach.html?tab=room"], ["📥 결과 모으기", "../kread/teach.html?tab=res"]]}
  ];
  function printQR(p){
    var q = TTQR.svg(p.u).replace("<svg ", '<svg width="150" height="150" ');
    var cell = '<div style="border:1px dashed #bbb;padding:10px;text-align:center;font-family:sans-serif"><div style="width:150px;height:150px;margin:0 auto">' + q + '</div><b style="font-size:15px">' + esc(p.n) + '</b><div style="font-size:11px;color:#666">' + esc(p.d) + "</div></div>";
    var w = window.open("", "_blank"); if(!w) return;
    w.document.write('<html><head><meta charset="utf-8"><title>' + esc(p.n) + ' QR</title></head><body style="margin:12mm"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' + new Array(16).fill(cell).join("") + "</div><script>setTimeout(function(){print()},300)<\/script></body></html>");
    w.document.close();
  }
  var m = document.getElementById("m");
  m.innerHTML = P.map(function(p){
    var q = ""; try{ q = TTQR.svg(p.u); }catch(e){ q = "QR을 만들지 못했어요"; }
    return '<section class="pc" data-p="' + p.id + '"><div class="hd"><span class="ic">' + p.ic + '</span><div><h2>' + esc(p.n) + '</h2><p class="sb">' + esc(p.d) + "</p></div></div>"
      + '<div class="qr">' + q + '</div><div class="ad">' + esc(p.u) + "</div>"
      + '<div class="bt"><button class="btn" data-a="copy">주소 복사</button><button class="btn" data-a="print">🖨 인쇄용 (16개)</button><a class="btn" href="../qr/?u=' + encodeURIComponent(p.u) + "&n=" + encodeURIComponent(p.n) + "&d=" + encodeURIComponent(p.d) + '">⛶ 크게 띄우기</a><a class="btn" href="' + esc(p.u) + '" target="_blank" rel="noopener">열어 보기</a></div>'
      + (p.x.length ? '<div class="bt bt2">' + p.x.map(function(x){ return '<a class="btn primary" href="' + esc(x[1]) + '">' + esc(x[0]) + "</a>"; }).join("") + "</div>" : "")
      + "</section>";
  }).join("");
  m.addEventListener("click", function(e){
    var b = e.target.closest("[data-a]"); if(!b) return;
    var p = P.filter(function(x){ return x.id === b.closest(".pc").dataset.p; })[0];
    if(b.dataset.a === "print") printQR(p);
    else (navigator.clipboard ? navigator.clipboard.writeText(p.u) : Promise.reject()).then(function(){ b.textContent = "복사했어요 ✓"; }, function(){ prompt("복사하세요", p.u); });
  });
})();
</script>
</body>
</html>
